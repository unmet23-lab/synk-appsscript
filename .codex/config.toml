# SYNK Codex 설정 — 오케스트레이션(Codex 구현 ↔ Claude 리뷰)용
# 최상위 키는 반드시 테이블 헤더([mcp_servers...]) 앞에 와야 함(TOML 규칙).
# ── 권한 (유호 지시 2026-09-09 「당분간 gpt로만 작업할것같아 · gpt에 걸려있는 모든 권한을 줘」) ──
#   막는 일은 «묻기»가 아니라 «가드»가 한다. 클로드에 걸린 훅 23벌이
#   tools/codex-hook-bridge.js 를 타고 코덱스에서도 그대로 돈다(자가시험 초록 09-09).
#   그중 넷이 실제로 손을 막는다: clasp 배포 · 커밋 범위 · 자격증명 · 학생 접점 말투.
#   그래서 물어보는 자리를 없애도 안전선은 남는다. 클로드가 도는 수준과 같아진 것이다.
approval_policy = "never"             # 묻지 않고 진행 — 막는 것은 가드가 한다
sandbox_mode = "danger-full-access"   # 저장소 «밖»도 만진다 — 기억 폴더에 적으려면 이게 필요하다(AGENTS.md §5-7)
model_reasoning_effort = "xhigh"      # 앱 화면이 Extra High 인데 여기가 medium 이라 서로 어긋나 있었다

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

# ────────────────────────────────────────────────────────────────────────────
# 💤 아래 한 덩이는 «지금은 잠들어 있다» (2026-09-09 오후)
#   sandbox_mode 가 danger-full-access 로 바뀌면서 .git 은 이미 열려 있다.
#   [sandbox_workspace_write] 는 이름 그대로 workspace-write 일 때만 읽히므로 지금은 안 쓰인다.
#   지우지 않는 까닭 = 권한을 다시 좁힐 날 그대로 필요하고, 아래 설명이 «왜 열었나»를 쥐고 있다.
#   🔴 되돌릴 때는 sandbox_mode 를 workspace-write 로 되돌려야 이 줄이 다시 산다.
#
# SYNK — 코덱스가 커밋할 수 있게 .git 을 연다 (2026-09-09)
#   유호 확정 09-09 「GPT 도 커밋·push 를 한다」(라우터 자리)를 «기계»가 안 따라오고 있었다.
#   코덱스는 workspace-write 로 돌아도 .git · .codex · .agents 를 읽기 전용으로 다시 덮는다.
#   그 까닭이 정확하다 — .git/hooks 에 쓸 수 있으면 «다음번에 사람이 git 을 칠 때»
#   샌드박스 밖에서 도는 코드가 심긴다.
#
#   그래서 문을 열되, 그 안의 «실행되는 자리»만 우리 가드가 대신 잠근다:
#     .claude/hooks/git-internals-guard.js  (.git/hooks 쓰기 · core.hooksPath · .git/config 직접 쓰기)
#   그 가드는 tools/codex-hook-bridge.js 를 타고 코덱스에도 그대로 실린다(시험 10건 초록).
#
#   ⚠ 경로가 절대값이다 — 저장소를 옮기면 이 줄이 낡는다.
#     그때는 커밋이 다시 'index.lock: Permission denied' 로 막히므로 증상으로 드러난다.
# ────────────────────────────────────────────────────────────────────────────
[sandbox_workspace_write]
writable_roots = ["C:/Users/q1212/Documents/SYNK-appsscript/.git"]

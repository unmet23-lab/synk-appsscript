<title>펠트 놀이터</title>
<style>
  @font-face{font-family:'SUIT';font-weight:500;src:url(/*FONT_SUIT_M*/) format('truetype');font-display:swap}
  @font-face{font-family:'SUIT';font-weight:600;src:url(/*FONT_SUIT_SB*/) format('truetype');font-display:swap}
  @font-face{font-family:'SUIT';font-weight:800;src:url(/*FONT_SUIT_XB*/) format('truetype');font-display:swap}
  @font-face{font-family:'Inter Tight';font-weight:500;src:url(/*FONT_INTER_M*/) format('truetype');font-display:swap}
  :root{
    --ink-deep:#080605; --ink:#2B2320; --paper:#FBF7F0; --stitch:#F0E3C8;
    --oat:#EDE7DC; --stone:#C7BFB2; --ash:#8D857A; --deep-wool:#575046;
    --coral:#F96859; --coral-soft:#FBB7A3; --coral-3:#AE322A; --coral-rim:#941F19; --coral-wash:#FEF0E9;
    --lapis:#3D6BC9; --lapis-soft:#C5D6F5; --lapis-deep:#24448C;
    --meadow:#7DB45A; --meadow-soft:#D3E8BE; --meadow-deep:#3F6B2E;
    --butter:#F5C445; --butter-soft:#FFEBB0; --butter-deep:#7E5A10;
    --shadow:rgba(8,9,12,.45);
    --r-outer:22px; --pad:14px; --r-inner:8px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink-deep);color:var(--paper);
    font-family:'SUIT','Inter Tight','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-weight:500;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{min-height:100dvh;display:flex;justify-content:center;padding:14px 10px 40px}
  #app{width:100%;max-width:430px;display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 6px 0}
  header h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
  header .sub{font-size:12px;color:var(--ash);letter-spacing:.04em}
  nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  nav.tabs button{appearance:none;border:1.5px dashed var(--stitch);background:var(--ink);color:var(--stone);border-radius:14px;
    padding:9px 4px;font:inherit;font-size:12.5px;font-weight:600;min-height:44px;cursor:pointer;line-height:1.15;transition:transform .18s,background .18s,color .18s}
  nav.tabs button[aria-selected="true"]{background:var(--coral);color:var(--ink-deep);border-style:solid;border-color:var(--coral-soft)}
  nav.tabs button:focus-visible{outline:2px solid var(--lapis-soft);outline-offset:2px}
  nav.tabs button:active{transform:scale(.97)}
  #stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:var(--r-outer);overflow:hidden;
    border:2px dashed var(--stitch);background:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;
    box-shadow:0 18px 40px -20px var(--shadow)}
  #stage .cloth{position:absolute;inset:0;background-size:520px auto;background-repeat:repeat;opacity:.96}
  #hint{margin:0;padding:0 8px;font-size:14px;line-height:1.5;color:var(--stone);min-height:22px;text-wrap:balance}
  #hint b{color:var(--paper);font-weight:600}
  #note{border-radius:var(--r-outer);border:1.5px dashed var(--stitch);background:var(--ink);padding:var(--pad) 16px;font-size:13px;line-height:1.55;color:var(--stone)}
  #note h2{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--butter);letter-spacing:.04em}
  #note ul{margin:0;padding-left:18px}
  #note li{margin:2px 0}
  .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.3}
  .chip.lapis{background:var(--lapis);color:var(--paper)}
  .chip.meadow{background:var(--meadow);color:var(--ink-deep)}
  .chip.butter{background:var(--butter);color:var(--ink-deep)}
  .felt-btn{appearance:none;border:none;border-radius:16px;background:var(--coral);color:var(--ink-deep);font:inherit;font-weight:700;font-size:15px;
    padding:12px 18px;min-height:44px;cursor:pointer;box-shadow:0 6px 0 var(--coral-rim);transition:transform .12s,box-shadow .12s}
  .felt-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-rim)}
  .felt-btn.quiet{background:var(--oat);color:var(--ink);box-shadow:0 6px 0 var(--stone)}
  .felt-btn.quiet:active{box-shadow:0 2px 0 var(--stone)}
  .felt-btn:focus-visible{outline:2px solid var(--lapis-soft);outline-offset:2px}
  .bubble{position:absolute;left:8%;right:8%;top:5%;padding:14px 16px 18px;border-radius:16px;background:var(--paper);color:var(--ink);
    border:1.5px solid var(--stitch);font-size:19px;font-weight:600;text-align:center;line-height:1.35;box-shadow:0 10px 24px -14px var(--shadow)}
  .bubble .blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--coral);color:var(--coral-3);padding:0 4px;font-weight:800}
  .bubble .blank.filled{border-bottom-color:var(--meadow);color:var(--meadow-deep)}
  .bubble small{display:block;font-size:12px;font-weight:500;color:var(--ash);margin-top:4px}
  .sprite{position:absolute;pointer-events:none;will-change:transform}
  .target img,.bow img,.arrow img,.zip-handle img,.jamo img,.pin img,.mole img,.mound,.burst img,.stamp,.sprite,.pile img{mix-blend-mode:multiply}
  .target img,.bow img,.arrow img,.zip-handle img,.pin img,.mole img{filter:none}
  .target{position:absolute;width:88px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none}
  .target img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 6px 6px var(--shadow))}
  .target span{position:absolute;top:26px;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.02em}
  .target.hit img{animation:wob .5s ease-out 1}
  @keyframes wob{0%{transform:rotate(0)}30%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}100%{transform:rotate(0)}}
  .bow{position:absolute;width:150px;height:150px;left:6%;bottom:8%;transform-origin:50% 50%;pointer-events:none}
  .bow img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px var(--shadow))}
  .string{position:absolute;height:3px;background:var(--stitch);transform-origin:0 50%;left:0;top:0;border-radius:2px;opacity:.9}
  .arrow{position:absolute;width:64px;height:64px;transform-origin:50% 50%;pointer-events:none}
  .arrow img{width:100%;height:100%;object-fit:contain}
  .burst{position:absolute;width:40px;height:40px;pointer-events:none;animation:burst .55s ease-out forwards}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
  .stamp{position:absolute;left:50%;top:50%;width:190px;transform:translate(-50%,-50%) scale(.6) rotate(-8deg);opacity:0;animation:stamp .35s cubic-bezier(.2,.9,.3,1.2) forwards;pointer-events:none}
  @keyframes stamp{to{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}}
  .toast{position:absolute;left:10%;right:10%;bottom:6%;padding:10px 14px;border-radius:14px;background:var(--lapis);color:var(--paper);font-size:14px;font-weight:600;text-align:center;
    opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateY(0)}
  .toast.meadow{background:var(--meadow);color:var(--ink-deep)}
  /* 지퍼 */
  .zip-word{position:absolute;left:8%;right:8%;top:14%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .zip-row{position:relative;display:flex;gap:0;align-items:stretch}
  .tile{background:var(--paper);color:var(--ink);border:2px solid var(--stitch);border-radius:14px;padding:18px 20px;font-size:40px;font-weight:800;line-height:1;min-width:96px;text-align:center;
    box-shadow:0 8px 20px -12px var(--shadow);position:relative;transition:transform .3s}
  .tile.l{border-top-right-radius:4px;border-bottom-right-radius:4px}
  .tile.r{border-top-left-radius:4px;border-bottom-left-radius:4px}
  .seam{width:14px;position:relative}
  .seam::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:3px dashed var(--stitch);opacity:.9}
  .zip-handle{position:absolute;left:50%;width:56px;height:56px;transform:translate(-50%,-50%);cursor:grab;touch-action:none;z-index:3}
  .zip-handle img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px var(--shadow))}
  .sound-band{margin-top:6px;padding:10px 16px;border-radius:12px;background:var(--ink-deep);border:1.5px dashed var(--stitch);color:var(--butter);font-family:'Inter Tight','SUIT',sans-serif;font-size:22px;font-weight:500;letter-spacing:.06em;min-width:200px;text-align:center;min-height:46px}
  .jamo{position:absolute;width:42px;height:42px;top:50%;transform:translate(-50%,-50%);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;z-index:2}
  .jamo img{width:100%;height:100%;object-fit:contain}
  .rule{position:absolute;left:8%;right:8%;bottom:20%;text-align:center}
  .rule .chip{font-size:13.5px}
  .ctrl{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:center;gap:10px;padding:0 8%}
  /* 다이얼 */
  .dial-wrap{position:absolute;left:50%;top:52%;width:230px;height:230px;transform:translate(-50%,-50%)}
  .dial{position:absolute;inset:0;transform-origin:50% 50%;cursor:grab;touch-action:none}
  .dial img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px var(--shadow))}
  .dial .knob{position:absolute;left:50%;top:9%;width:26px;height:26px;transform:translateX(-50%);border-radius:50%;background:var(--coral);border:3px solid var(--paper)}
  .dial-label{position:absolute;font-size:14.5px;font-weight:700;color:var(--paper);background:var(--ink);border:1.5px dashed var(--stitch);padding:5px 10px;border-radius:999px;transform:translate(-50%,-50%);transition:background .2s,color .2s}
  .dial-label.on{background:var(--butter);color:var(--ink-deep);border-style:solid}
  .npc{position:absolute;right:7%;top:6%;width:112px;height:112px;border-radius:50%;overflow:hidden;border:2px solid var(--stitch);background:var(--oat)}
  .npc img{width:100%;height:100%;object-fit:cover;transition:opacity .25s}
  .scene{position:absolute;left:7%;top:8%;width:55%;color:var(--paper);font-size:15px;line-height:1.4}
  .scene b{color:var(--butter);font-weight:700}
  .scene .say{margin-top:8px;font-size:22px;font-weight:800;color:var(--paper)}
  .field{position:absolute;left:7%;right:7%;bottom:14%;display:flex;gap:8px}
  .field input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;padding:12px 14px;border-radius:14px;border:2px solid var(--stitch);background:var(--paper);color:var(--ink);min-height:44px}
  .field input:focus{outline:2px solid var(--lapis);outline-offset:1px}
  /* 쪽지 */
  .note-paper{position:absolute;left:50%;top:44%;width:78%;transform:translate(-50%,-50%);perspective:800px}
  .note-inner{background:var(--paper);color:var(--ink);border-radius:8px;padding:34px 20px 22px;font-size:18px;font-weight:600;line-height:1.45;text-align:center;
    box-shadow:0 14px 30px -14px var(--shadow);transform-origin:50% 0;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .note-inner.fold{transform:rotateX(-88deg);opacity:.9}
  .note-inner small{display:block;margin-top:8px;font-size:13px;font-weight:500;color:var(--ash)}
  .pin{position:absolute;left:50%;top:-28px;width:64px;height:64px;transform:translateX(-50%);pointer-events:none}
  .pin img{width:100%;height:100%;object-fit:contain}
  .want{position:absolute;left:50%;top:9%;transform:translateX(-50%)}
  /* 두더지 */
  .mole-grid{position:absolute;left:8%;right:8%;top:22%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
  .hole{position:relative;height:96px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:0 0 40px 40px}
  .hole .mound{position:absolute;bottom:0;width:100%;height:46px;object-fit:contain;object-position:bottom;z-index:2;pointer-events:none}
  .mole{position:absolute;bottom:10px;width:76px;height:76px;transform:translateY(90px);transition:transform .22s cubic-bezier(.2,.8,.2,1);cursor:pointer;touch-action:manipulation;z-index:1}
  .mole img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px var(--shadow))}
  .mole span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--ink);padding-bottom:6px}
  .mole.up{transform:translateY(0)}
  .mole.hit{transform:translateY(90px) scale(.8)}
  .word-cue{position:absolute;left:8%;right:8%;top:5%;display:flex;align-items:center;justify-content:center;gap:10px}
  .pile{position:absolute;left:8%;right:8%;bottom:6%;height:44px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-end}
  .pile img{width:22px;height:22px;object-fit:contain}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<div id="app">
  <header><h1>펠트 놀이터</h1><span class="sub">만져 보는 시제품 다섯 · 2026-09-05</span></header>
  <nav class="tabs" role="tablist" aria-label="시제품 고르기"></nav>
  <div id="stage" aria-live="polite"></div>
  <p id="hint"></p>
  <section id="note" hidden><h2>이 판이 남기는 것</h2><ul></ul></section>
</div>
<script>
const A = /*ASSETS_JSON*/{};
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const snd = {}; function play(k, vol) { try { if (!A[k]) return; const a = snd[k] || (snd[k] = new Audio(A[k])); a.currentTime = 0; a.volume = vol == null ? .9 : vol; a.play().catch(() => {}); } catch (e) {} }
const stage = $('#stage'), hint = $('#hint'), note = $('#note');
function setHint(h) { hint.innerHTML = h; }
function setNote(items) { const ul = $('ul', note); ul.innerHTML = ''; if (!items || !items.length) { note.hidden = true; return; } items.forEach((t) => ul.appendChild(el('li', null, t))); note.hidden = false; }
function toast(text, kind) { let t = $('.toast', stage); if (!t) { t = el('div', 'toast'); stage.appendChild(t); } t.className = 'toast ' + (kind || '') ; t.textContent = text; requestAnimationFrame(() => t.classList.add('on')); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1900); }
function burstAt(x, y, key, n) { for (let i = 0; i < (n || 6); i++) { const b = el('div', 'burst'); const ang = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50; b.style.setProperty('--dx', Math.cos(ang) * d + 'px'); b.style.setProperty('--dy', Math.sin(ang) * d - 20 + 'px'); b.style.left = (x - 20) + 'px'; b.style.top = (y - 20) + 'px'; const im = el('img'); im.src = A[key] || A['반짝임']; im.style.width = '100%'; im.style.height = '100%'; im.style.objectFit = 'contain'; b.appendChild(im); stage.appendChild(b); setTimeout(() => b.remove(), 600); } }
function stamp(key) { const s = el('img', 'stamp'); s.src = A[key] || A['참잘했어요']; stage.appendChild(s); play('fx_achieve'); buzz([30, 40, 60]); return s; }
function cloth(key) { const c = el('div', 'cloth'); c.style.backgroundImage = 'url(' + A[key] + ')'; stage.appendChild(c); }
function rect() { return stage.getBoundingClientRect(); }
function ptr(e) { const r = rect(); const p = e.touches ? e.touches[0] : e; return { x: p.clientX - r.left, y: p.clientY - r.top }; }

/* ───────────── 1. 조사 활쏘기 ───────────── */
function 활쏘기() {
  cloth('바탕_메도우');
  const 문장들 = [
    { 앞: '저', 뒤: ' 학생이에요', 답: '은/는', 채움: '저는', 힌트: '「저」처럼 말하는 사람 자신을 소개할 땐 은/는' },
    { 앞: '친구', 뒤: ' 왔어요', 답: '이/가', 채움: '친구가', 힌트: '「왔어요」의 주인공은 이/가' },
    { 앞: '물', 뒤: ' 마셔요', 답: '을/를', 채움: '물을', 힌트: '마시는 «것»은 을/를' },
    { 앞: '오늘', 뒤: ' 날씨가 좋아요', 답: '은/는', 채움: '오늘은', 힌트: '「오늘」을 앞에 내세우면 은/는' },
    { 앞: '사과', 뒤: ' 먹어요', 답: '을/를', 채움: '사과를', 힌트: '먹는 «것»은 을/를' },
  ];
  const 쌍 = ['은/는', '이/가', '을/를'];
  let i = 0, 맞음 = 0, 머뭇들 = [], 발수 = 0;

  const targets = 쌍.map((t, k) => { const d = el('div', 'target'); const im = el('img'); im.src = A['깃발']; d.appendChild(im); d.appendChild(el('span', null, t)); d.dataset.pair = t; d._k = k; stage.appendChild(d); return d; });
  const bow = el('div', 'bow'); const bim = el('img'); bim.src = A['화살']; bow.appendChild(bim); stage.appendChild(bow);
  const string = el('div', 'string'); stage.appendChild(string); string.style.display = 'none';
  const toastEl = el('div', 'toast'); stage.appendChild(toastEl);
  let t0 = performance.now(), flying = false, dragging = false, dragStart = 0, aim = null;
  function bowCenter() { const r = rect(); return { x: r.width * 0.06 + 75, y: r.height * 0.92 - 75 }; }
  function 보여주기() { const s = 문장들[i]; bubble.innerHTML = s.앞 + ' <span class="blank">___</span>' + s.뒤 + '<small>빈칸에 맞는 깃발을 겨눠서 쏘세요 · ' + (i + 1) + '/' + 문장들.length + '</small>'; }
  function frame(now) { if (!stage.contains(bubble)) return; const r = rect(); const t = (now - t0) / 1000; targets.forEach((d, k) => { const y = r.height * (0.26 + k * 0.15); const amp = r.width * 0.28, cx = r.width * 0.5 + Math.sin(t * (0.35 + k * 0.12) + k) * amp; d.style.transform = 'translate(' + (cx - 44) + 'px,' + (y - 50) + 'px)'; d._c = { x: cx, y: y - 12 }; }); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  function down(e) { if (flying) return; dragging = true; dragStart = performance.now(); aim = ptr(e); string.style.display = 'block'; move(e); e.preventDefault(); }
  function move(e) { if (!dragging) return; aim = ptr(e); const c = bowCenter(); const dx = aim.x - c.x, dy = aim.y - c.y; const ang = Math.atan2(dy, dx); bow.style.transform = 'rotate(' + (ang * 180 / Math.PI - 45) + 'deg)'; const len = Math.min(120, Math.hypot(dx, dy)); string.style.left = c.x + 'px'; string.style.top = c.y + 'px'; string.style.width = len + 'px'; string.style.transform = 'rotate(' + (ang * 180 / Math.PI + 180) + 'deg)'; }
  function up(e) { if (!dragging) return; dragging = false; string.style.display = 'none'; const held = performance.now() - dragStart; 머뭇들.push(held); const c = bowCenter(); const dx = c.x - aim.x, dy = c.y - aim.y; const d = Math.hypot(dx, dy); if (d < 14) return; shoot(dx / d, dy / d); }
  function shoot(ux, uy) { flying = true; 발수++; const a = el('div', 'arrow'); const im = el('img'); im.src = A['화살']; a.appendChild(im); stage.appendChild(a); const c = bowCenter(); let x = c.x, y = c.y; const sp = 11; const ang = Math.atan2(uy, ux) * 180 / Math.PI; buzz(12); play('fx_notify', .35);
    function fly() { x += ux * sp; y += uy * sp; a.style.transform = 'translate(' + (x - 32) + 'px,' + (y - 32) + 'px) rotate(' + (ang - 45) + 'deg)'; const r = rect(); for (const t of targets) { if (t._c && Math.hypot(t._c.x - x, t._c.y - y) < 40) return hit(t, x, y, a); } if (x < -60 || x > r.width + 60 || y < -60 || y > r.height + 60) { a.remove(); flying = false; toast('빗나갔어요 · 다시 겨눠 봐요'); return; } requestAnimationFrame(fly); }
    requestAnimationFrame(fly); }
  function hit(t, x, y, a) { const s = 문장들[i]; a.remove(); t.classList.add('hit'); setTimeout(() => t.classList.remove('hit'), 520); buzz(35);

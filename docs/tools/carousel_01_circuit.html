<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK 캐러셀 01 — 입이 멈추는 순간</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=DM+Mono:wght@300;400;500&display=swap">
<style>
  :root{ --ink:#1B1B1A; --sub:#7A7566; --line:#D1D2D4; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:34px 40px 70px; background:#FAFAF9; color:var(--ink);
        font-family:'Inter Tight','SUIT Variable',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .wrap{ max-width:1180px; margin:0 auto; }
  h1{ font-size:18px; font-weight:600; margin:0 0 5px; letter-spacing:-.01em; }
  .sub{ font-size:12.5px; color:var(--sub); line-height:1.65; margin:0 0 4px; }
  .bar{ display:flex; gap:10px; align-items:center; margin:22px 0 26px; }
  .go{ font:inherit; font-size:13px; font-weight:600; padding:10px 20px; cursor:pointer;
       background:var(--ink); color:#fff; border:none; border-radius:9px; }
  .note{ font-size:11.5px; color:var(--sub); }
  .grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  .card canvas{ display:block; width:100%; height:auto; border-radius:6px;
        box-shadow:0 1px 2px rgba(16,24,40,.06),0 10px 22px -8px rgba(16,24,40,.14); }
  .cap{ font-size:11.5px; color:var(--sub); margin-top:9px; display:flex; justify-content:space-between; align-items:center; }
  .dl{ font:inherit; font-size:11px; padding:4px 10px; cursor:pointer; background:#fff;
       border:1px solid var(--line); border-radius:7px; color:var(--sub); }
  .toast{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
          background:#08090C; color:#E4E4E7; font-size:12.5px; padding:9px 18px; border-radius:99px;
          opacity:0; transition:all .18s ease; pointer-events:none; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <h1>SYNK 캐러셀 01 — 입이 멈추는 순간</h1>
  <p class="sub">디자인 정본 v1.4 · 1080×1350 (4:5) · 문법 = 1장 다크(플랫) → 2~4장 타이포 → 5장 겹침</p>
  <p class="sub">주제: 아는 것과 말하는 것은 뇌에서 다른 길이다 — 개원 전 인지도 단계용, 참여 유도로 마무리</p>

  <div class="bar">
    <button class="go" id="all">5장 전부 내려받기</button>
    <span class="note">순서대로 저장됩니다. 브라우저가 여러 파일 다운로드를 물으면 허용해 주세요.</span>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var BG='#08090C', INK='#E4E4E7', SIG='#FF6B5C', PAPER='#FAFAF9', DARK='#1B1B1A',
    DIM='#98A2B3', BODY='#475467', INK2='#FFD447'; // v1.5: 모드 C 2도 = KC Sun
// 라이트 배경 위 "글자" 강조는 SIG(Coral)를 쓰지 않는다 — Paper 위 대비 2.6으로
// 대형 텍스트 기준(3.0)에도 미달한다. Coral 3는 같은 자리에서 3.40으로 통과한다.
// SIG는 다크 배경 텍스트(6.5)와 면·도형(막대·리소 원)에만 쓴다. 정본 v1.3 §11 참조.
var SIG_TEXT='#E8543F';
var FONT="'Inter Tight','SUIT Variable',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
var W=1080, H=1350, PAD=88;

function prng(s){ var a=(s>>>0)||1; return function(){ a=(a*1664525+1013904223)>>>0; return a/4294967296; }; }

function tracked(c,t,x,y,sp){ var cx=x,i; for(i=0;i<t.length;i++){ c.fillText(t[i],cx,y); cx+=c.measureText(t[i]).width+sp; } }
function lines(c,arr,x,y,size,lh,color,weight){
  c.fillStyle=color; c.font=weight+' '+size+'px '+FONT; c.textBaseline='alphabetic';
  for(var i=0;i<arr.length;i++) c.fillText(arr[i], x, y+i*size*lh);
  return y+(arr.length-1)*size*lh;
}

// (v1.4) 1장 디더 아트 제거 — 다크 표지 기본은 플랫(2026-08-02 유호님 시험 채택).
// 디더는 시즌 오프닝·수료 등 의식 순간 전용으로 강등. 구 waveField 구현은 git 이력에.
function card1(c){
  c.fillStyle=BG; c.fillRect(0,0,W,H);
  c.fillStyle='rgba(246,241,232,.75)'; c.font='600 25px '+FONT; c.textBaseline='alphabetic'; // v1.4.1 알파 하한
  tracked(c,'SYNK LAB',PAD,PAD+18,5.4);
  c.fillStyle=SIG; c.fillRect(PAD, H-PAD-330, 78, 9);
  lines(c,['단어는 아는데','입이 멈추는 순간'],PAD,H-PAD-190,78,1.32,INK,'600');
  c.fillStyle='#8A8A94'; c.font='500 26px '+FONT;
  c.fillText('뇌과학으로 푸는 한국어',PAD,H-PAD+4);
}

function typeCard(c, idx, main, subLines, meta, hi){
  c.fillStyle=PAPER; c.fillRect(0,0,W,H);
  c.fillStyle=DIM; c.font='600 25px '+FONT; c.textBaseline='alphabetic';
  tracked(c,idx,PAD,PAD+18,4.6);
  var size=78, lh=1.34, blockH=(main.length-1)*size*lh;
  var top=H*0.40-blockH/2;
  if(hi){
    c.fillStyle=DARK; c.font='600 '+size+'px '+FONT;
    for(var i=0;i<main.length;i++){
      var seg=main[i].split('|');
      var x=PAD;
      for(var j=0;j<seg.length;j++){
        c.fillStyle=(j%2===1)?SIG_TEXT:DARK;
        c.fillText(seg[j], x, top+i*size*lh);
        x+=c.measureText(seg[j]).width;
      }
    }
  } else lines(c,main,PAD,top,size,lh,DARK,'600');
  var sy=top+blockH+72;
  lines(c,subLines,PAD,sy,30,1.65,BODY,'500');
  c.strokeStyle='rgba(16,24,40,.14)'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(PAD,H-PAD-52); c.lineTo(W-PAD,H-PAD-52); c.stroke();
  c.fillStyle=DIM; c.font='500 25px '+FONT; c.fillText(meta,PAD,H-PAD);
}

function card5(c){
  c.fillStyle=PAPER; c.fillRect(0,0,W,H);
  var ew=W*0.60, ex=W*0.16, ey=H*0.13;
  c.globalCompositeOperation='multiply';
  c.globalAlpha=0.80; c.fillStyle=INK2;
  c.beginPath(); c.ellipse(ex+ew/2, ey+ew/2, ew/2, ew/2, 0, 0, 6.284); c.fill();
  c.globalAlpha=0.72; c.fillStyle=SIG;
  c.beginPath(); c.ellipse(ex+ew/2+15, ey+ew/2+13, ew/2, ew/2, 0, 0, 6.284); c.fill();
  c.globalAlpha=0.55; c.fillStyle=INK2; c.fillRect(0, ey+ew+66, W, 11);
  c.globalAlpha=0.48; c.fillStyle=SIG; c.fillRect(0, ey+ew+72, W, 11);
  c.globalCompositeOperation='source-over'; c.globalAlpha=1;
  c.fillStyle='#1A237E'; c.font='600 25px '+FONT; c.textBaseline='alphabetic';
  tracked(c,'SYNK LAB',PAD,PAD+18,5.4);
  lines(c,['오늘의 세 문장,','댓글에 남겨보세요'],PAD,H-PAD-210,74,1.32,DARK,'600');
  c.strokeStyle='rgba(16,24,40,.18)'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(PAD,H-PAD-52); c.lineTo(W-PAD,H-PAD-52); c.stroke();
  c.fillStyle='#6B7280'; c.font='500 25px '+FONT;
  c.fillText('매주 한국어 회로 이야기',PAD,H-PAD);
}

var CARDS=[
  ['01_hook', card1],
  ['02_gonggam', function(c){ typeCard(c,'01',
      ['분명 외웠는데,','그 순간엔 조용해진다'],
      ['누구나 지나는 구간입니다.','머리가 아니라 길의 문제예요.'],
      '한국어를 배우는 모든 사람') }],
  ['03_reason', function(c){ typeCard(c,'02',
      ['아는 것과 말하는 것은','뇌에서 |다른 길|입니다'],
      ['외우기는 저장, 말하기는 연결.','연결은 쓸수록 굵어집니다.'],
      '시냅스 · 미엘린', true) }],
  ['04_action', function(c){ typeCard(c,'03',
      ['완벽한 문장 말고,','오늘 배운 걸로 |세 문장|'],
      ['소리를 내면 그때부터 길이 생깁니다.','매일 3분이면 충분해요.'],
      '오늘 할 수 있는 것', true) }],
  ['05_cta', card5]
];

var made=[];
var grid=document.getElementById('grid'), toast=document.getElementById('toast'), tmo;
function say(m){ toast.textContent=m; toast.classList.add('on');
  clearTimeout(tmo); tmo=setTimeout(function(){ toast.classList.remove('on'); },1500); }

function save(i){
  return new Promise(function(res){
    made[i].toBlob(function(b){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='synk_carousel01_'+CARDS[i][0]+'.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); res(); }, 420);
    },'image/png');
  });
}

CARDS.forEach(function(cd,i){
  var box=document.createElement('div'); box.className='card';
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  box.appendChild(cv);
  var cap=document.createElement('div'); cap.className='cap';
  cap.innerHTML='<span>'+(i+1)+'장</span>';
  var b=document.createElement('button'); b.className='dl'; b.textContent='PNG';
  b.addEventListener('click', function(){ save(i).then(function(){ say((i+1)+'장 저장됨'); }); });
  cap.appendChild(b); box.appendChild(cap); grid.appendChild(box);
  made.push(cv);
});

function drawAll(){ CARDS.forEach(function(cd,i){ cd[1](made[i].getContext('2d')); }); }

document.getElementById('all').addEventListener('click', function(){
  var i=0;
  (function next(){
    if(i>=CARDS.length){ say('5장 전부 저장됨'); return; }
    save(i).then(function(){ i++; next(); });
  })();
});

if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll); else drawAll();
drawAll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK FIELD 생성기 v1.3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=DM+Mono:wght@300;400;500&display=swap">
<style>
  :root{ --ink:#1B1B1A; --sub:#7A7566; --line:#D1D2D4; --paper:#FAFAF9; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink);
        font-family:'Inter Tight','SUIT Variable',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .wrap{ display:flex; gap:28px; padding:26px 30px; align-items:flex-start; }
  .panel{ width:290px; flex:0 0 290px; }
  h1{ font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0 0 4px; }
  .hint{ font-size:12px; color:var(--sub); line-height:1.6; margin:0 0 20px; }
  .fld{ margin-bottom:16px; }
  .fld > label{ display:block; font-size:11px; font-weight:600; letter-spacing:.06em;
                color:var(--sub); margin-bottom:6px; }
  input[type=text], textarea, select{ width:100%; font:inherit; font-size:13px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; outline:none; }
  textarea{ resize:vertical; min-height:64px; line-height:1.5; }
  input:focus, textarea:focus, select:focus{ border-color:#FF6B5C; }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; font:inherit; font-size:12px; font-weight:500; padding:8px 4px; cursor:pointer;
    background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--sub); }
  .seg button.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .row{ display:flex; gap:8px; align-items:center; }
  .row input[type=range]{ flex:1; }
  .num{ font-size:12px; color:var(--sub); width:26px; text-align:right; }
  .go{ width:100%; font:inherit; font-size:13px; font-weight:600; padding:11px; cursor:pointer;
    background:var(--ink); color:#fff; border:none; border-radius:9px; margin-top:4px; }
  .ghost{ width:100%; font:inherit; font-size:12px; padding:9px; cursor:pointer; margin-top:8px;
    background:#fff; color:var(--sub); border:1px solid var(--line); border-radius:9px; }
  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
  canvas{ max-height:78vh; max-width:100%; height:auto; box-shadow:0 1px 2px rgba(16,24,40,.06),0 12px 30px -8px rgba(16,24,40,.12); border-radius:4px; }
  .meta{ font-size:11px; color:var(--sub); }
  .rules{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
          font-size:11px; line-height:1.85; color:var(--sub); }
  .rules b{ color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>SYNK FIELD 생성기</h1>
    <p class="hint">정본 v1.5 · 다크 표지 기본은 <b>플랫</b>(그림 0 — 2026-08-02 유호님 시험 채택). 디더는 시즌 오프닝·수료 같은 의식 순간 전용. 바탕·잉크 2색과 신호색 1점은 자동으로 지켜집니다. 다크 = Navy 2 #08090C · 신호 = Coral #FF6B5C.</p>

    <div class="fld">
      <label>모드</label>
      <div class="seg" id="mode">
        <button data-v="dark" class="on">다크 (기본·플랫)</button>
        <button data-v="dither">디더 (의식 전용)</button>
        <button data-v="type">타이포</button>
        <button data-v="riso">겹침</button>
      </div>
    </div>

    <div class="fld">
      <label>비율</label>
      <select id="ratio">
        <option value="4:5">인스타 캐러셀 · 4:5 (1080×1350)</option>
        <option value="1:1">인스타 정사각 · 1:1 (1080×1080)</option>
        <option value="9:16">스토리·릴스 · 9:16 (1080×1920)</option>
        <option value="A4">인쇄 A4 · 세로 (1240×1754)</option>
      </select>
    </div>

    <div class="fld">
      <label>상단 라벨</label>
      <input type="text" id="label" value="SYNK LAB">
    </div>

    <div class="fld">
      <label>메인 카피 (줄바꿈 = 줄나눔)</label>
      <textarea id="copy">3개월 뒤,
말이 트입니다</textarea>
    </div>

    <div class="fld">
      <label>하단 메타</label>
      <input type="text" id="metaTxt" value="시즌 1 · 선착순 24명">
    </div>

    <div class="fld">
      <label>신호색 (화면당 1점)</label>
      <div class="seg" id="sig">
        <button data-v="coral" class="on">코랄</button>
        <button data-v="sun">노랑(2도)</button>
        <button data-v="none">없음</button>
      </div>
    </div>

    <div class="fld" id="objFld">
      <label>오브제</label>
      <select id="obj">
        <option value="toono">게르 천창 — 시작·몽골</option>
        <option value="ignition">발화 — 첫 이해의 순간</option>
        <option value="wave">파동 간섭 — 연결</option>
        <option value="orbit">궤도 — 시즌 순환</option>
        <option value="horizon">지평선 — 새벽·출발</option>
        <option value="lattice">결정 격자 — 시냅스망</option>
      </select>
    </div>

    <div class="fld" id="spokeFld">
      <label>천창 살 개수</label>
      <div class="row">
        <input type="range" id="spokes" min="6" max="16" step="1" value="8">
        <span class="num" id="spokeN">8</span>
      </div>
    </div>

    <div class="fld">
      <label>구도</label>
      <select id="comp">
        <option value="tr">우상단 크롭</option>
        <option value="c">중앙</option>
        <option value="bl">좌하단 크롭</option>
      </select>
    </div>

    <button class="go" id="dl">PNG 내려받기</button>
    <button class="ghost" id="re">다시 그리기 (시드 변경)</button>

    <div class="rules">
      <b>R1</b> 2색만 · 신호색 5% 미만<br>
      <b>R2</b> 위계는 밀도와 여백으로<br>
      <b>R3</b> 글자는 절대 건드리지 않는다<br>
      캐러셀 = 1장 다크(플랫) → 가운데 타이포 → 마지막 겹침<br>
      디더는 의식 순간 전용(시즌 오프닝·수료·간지) — 캐러셀 금지
    </div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="meta" id="stat"></div>
  </div>
</div>

<script>
var SIZES = { '4:5':[1080,1350], '1:1':[1080,1080], '9:16':[1080,1920], 'A4':[1240,1754] };
var SIG = { coral:'#FF6B5C', sun:'#FFD447', none:null }; // v1.5: 2도 = KC Sun (구 blue 폐기)
var FONT = "'Inter Tight','SUIT Variable',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";

var S = { mode:'dark', ratio:'4:5', label:'SYNK LAB',
          copy:'3개월 뒤,\n말이 트입니다', meta:'시즌 1 · 선착순 24명',
          sig:'coral', seed:17, spokes:8, comp:'tr', obj:'toono' };

var cv = document.getElementById('cv');

function prng(s){ var a=(s>>>0)||1; return function(){ a=(a*1664525+1013904223)>>>0; return a/4294967296; }; }
function rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

function tracked(ctx, text, x, y, sp){
  var cx = x, i, ch;
  for(i=0;i<text.length;i++){ ch = text[i]; ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
}

function lines(ctx, arr, x, y, size, lh, color, weight){
  ctx.fillStyle = color;
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.textBaseline = 'alphabetic';
  for(var i=0;i<arr.length;i++) ctx.fillText(arr[i], x, y + i*size*lh);
  return y + (arr.length-1)*size*lh;
}

function anchor(W, H){
  if(S.comp === 'tr') return [W*0.82, H*0.20];
  if(S.comp === 'bl') return [W*0.16, H*0.80];
  return [W*0.5, H*0.42];
}

function spark(P, cx, cy, L, R){
  var i, p;
  for(i=1;i<L;i++){
    p = 1-i/L; p = p*p;
    if(R()<p*0.95) P(cx, cy-i);
    if(R()<p*0.80) P(cx, cy+i*0.75);
    if(R()<p*0.55) P(cx-i*0.85, cy);
    if(R()<p*0.55) P(cx+i*0.85, cy);
  }
}

function objToono(P, W, H, u, R, cx, cy){
  var rr = (S.comp === 'c') ? W*0.40 : W*0.56, x, y, k, t;
  var cell = 5*u, wv = 0.63/u;
  for(y=0;y<H;y++){
    for(x=0;x<W;x++){
      var dx=(x-cx)/rr, dy=(y-cy)/rr, r=Math.sqrt(dx*dx+dy*dy);
      if(r>1.04) continue;
      var den = Math.max(0, 1-r*0.72)*0.62;
      var c2 = (((x/cell)|0)+((y/cell)|0))%2;
      var thr = c2 ? (Math.sin(x*wv)*0.5+0.5) : (Math.sin(y*wv)*0.5+0.5);
      if(R() < thr*den) P(x,y);
    }
  }
  for(k=0;k<S.spokes;k++){
    var an = k*6.283/S.spokes - 0.3;
    for(t=0;t<rr*1.02;t+=0.6){
      if(R() < 0.66*(1-t/(rr*1.02)*0.25)) P(cx+Math.cos(an)*t, cy+Math.sin(an)*t);
    }
  }
  var steps = Math.round(rr*7);
  for(k=0;k<steps;k++){
    var a2 = k/steps*6.283;
    if(R() < 0.72) P(cx+Math.cos(a2)*rr, cy+Math.sin(a2)*rr);
  }
}

function objIgnition(P, W, H, u, R, cx, cy){
  var span = Math.min(W,H), rays = Math.round(W*H*0.00068), i, t;
  for(i=0;i<rays;i++){
    var a = R()*6.283, len = Math.pow(R(), 2.1)*span*1.05, bend = (R()-0.5)*0.55;
    for(t=0;t<len;t+=1.0){
      var cv = Math.sin(t*0.011/u)*bend;
      var p = (1-t/len)*0.52+0.02;
      if(R() < p*0.52) P(cx+Math.cos(a+cv)*t, cy+Math.sin(a+cv)*t);
    }
  }
  var core = Math.round(W*H*0.0024);
  for(i=0;i<core;i++){
    var a2 = R()*6.283, r2 = Math.pow(R(), 3.0)*span*0.11;
    P(cx+Math.cos(a2)*r2, cy+Math.sin(a2)*r2);
  }
  spark(P, cx, cy, span*0.44, R);
}

function objWave(P, W, H, u, R, cx, cy){
  var bx = cx + W*0.66, by = cy + H*0.24, k = 0.052/u, x, y;
  var far = Math.max(W,H)*0.92;
  for(y=0;y<H;y++){
    for(x=0;x<W;x++){
      var d1 = Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy));
      var d2 = Math.sqrt((x-bx)*(x-bx)+(y-by)*(y-by));
      var v = Math.sin(d1*k) + Math.sin(d2*k);
      var att = Math.max(0, 1-Math.min(d1,d2)/far);
      var p = Math.max(0, (v+0.35)/2.35)*att*att*0.62;
      if(p>0.004 && R()<p) P(x,y);
    }
  }
}

function objOrbit(P, W, H, u, R, cx, cy){
  var span = Math.min(W,H), i, s, j;
  for(i=0;i<8;i++){
    var rx = span*(0.15+i*0.088), ry = rx*(0.24+R()*0.54), rot = R()*3.1416;
    var cs = Math.cos(rot), sn = Math.sin(rot), steps = Math.round(rx*16);
    var band = 1.6*u;
    for(s=0;s<steps;s++){
      var a = s/steps*6.283, ex = Math.cos(a)*rx, ey = Math.sin(a)*ry;
      var bx = cx+ex*cs-ey*sn, by = cy+ex*sn+ey*cs;
      for(j=0;j<2;j++){
        if(R() < 0.62) P(bx+(R()-0.5)*band, by+(R()-0.5)*band);
      }
    }
  }
  var core = Math.round(W*H*0.0026);
  for(i=0;i<core;i++){
    var a2 = R()*6.283, r2 = Math.pow(R(), 2.6)*span*0.1;
    P(cx+Math.cos(a2)*r2, cy+Math.sin(a2)*r2);
  }
}

function objHorizon(P, W, H, u, R, cx){
  var hy = H*0.63, span = Math.min(W,H), rr = span*0.21;
  var sy = hy - rr*0.28, x, y, i;
  for(y=0;y<H;y++){
    for(x=0;x<W;x++){
      var dd = Math.sqrt((x-cx)*(x-cx)+(y-sy)*(y-sy))/rr;
      if(dd>1.02) continue;
      if(R() < Math.max(0, 1-dd*0.78)*0.78) P(x,y);
    }
  }
  for(x=0;x<W;x++){
    if(R()<0.78) P(x, hy);
    if(R()<0.34) P(x, hy+1.4*u);
  }
  for(i=0;i<Math.round(W*0.9);i++){
    var bx = cx + (R()-0.5)*rr*1.9, up = hy - Math.pow(R(), 1.6)*span*0.75;
    if(R() < 0.5*(1-Math.abs(bx-cx)/(rr*1.1))) P(bx, up);
  }
  for(y=hy+2*u;y<H;y++){
    var fade = 1-(y-hy)/(H-hy);
    var wob = Math.sin(y*0.09/u)*rr*0.12;
    for(x=0;x<W;x++){
      var lat = Math.abs(x-cx-wob)/(rr*1.5);
      if(lat<1 && R() < fade*fade*0.42*(1-lat)) P(x,y);
    }
  }
}

function objLattice(P, W, H, u, R, cx, cy){
  var cell = Math.min(W,H)*0.108, nodes = [], gx, gy, i, j, s;
  for(gy=-1; gy*cell<H+cell; gy++){
    for(gx=-1; gx*cell<W+cell; gx++){
      nodes.push([gx*cell+(R()-0.5)*cell*0.6, gy*cell+(R()-0.5)*cell*0.6]);
    }
  }
  var far = Math.max(W,H)*1.15;
  for(i=0;i<nodes.length;i++){
    for(j=i+1;j<nodes.length;j++){
      var ax=nodes[i][0], ay=nodes[i][1], bx=nodes[j][0], by=nodes[j][1];
      var d = Math.sqrt((ax-bx)*(ax-bx)+(ay-by)*(ay-by));
      if(d > cell*1.32) continue;
      var steps = Math.round(d*1.6);
      for(s=0;s<steps;s++){
        var t = s/steps, px = ax+(bx-ax)*t, py = ay+(by-ay)*t;
        var att = Math.max(0.08, 1-Math.sqrt((px-cx)*(px-cx)+(py-cy)*(py-cy))/far);
        if(R() < 0.82*att) P(px+(R()-0.5)*1.3*u, py+(R()-0.5)*1.3*u);
      }
    }
  }
  for(i=0;i<nodes.length;i++){
    var nx=nodes[i][0], ny=nodes[i][1];
    var at2 = Math.max(0, 1-Math.sqrt((nx-cx)*(nx-cx)+(ny-cy)*(ny-cy))/(far*0.85));
    if(R() < at2*0.92){
      for(j=0;j<18;j++) P(nx+(R()-0.5)*5.5*u, ny+(R()-0.5)*5.5*u);
    }
  }
}

var OBJECTS = { toono:objToono, ignition:objIgnition, wave:objWave,
                orbit:objOrbit, horizon:objHorizon, lattice:objLattice };

function drawObject(ctx, W, H, u, R){
  var img = ctx.getImageData(0,0,W,H), d = img.data, ink = rgb('#E4E4E7'), k;
  function put(px, py){
    px = px|0; py = py|0;
    if(px<0||py<0||px>=W||py>=H) return;
    var i = ((py*W+px)<<2);
    d[i]=ink[0]; d[i+1]=ink[1]; d[i+2]=ink[2]; d[i+3]=255;
  }
  var a = anchor(W,H);
  (OBJECTS[S.obj] || objToono)(put, W, H, u, R, a[0], a[1]);
  var dust = Math.round(W*H*0.0028);
  for(k=0;k<dust;k++){ if(R()<0.5) put(R()*W, R()*H); }
  ctx.putImageData(img,0,0);
}

function render(){
  var sz = SIZES[S.ratio], W = sz[0], H = sz[1], u = W/1080;
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');
  var R = prng(S.seed);
  var pad = 78*u;
  var sig = SIG[S.sig];
  var copyArr = S.copy.split('\n');
  var isDark = (S.mode === 'dither' || S.mode === 'dark');
  var bg = isDark ? '#08090C' : '#FAFAF9';
  var ink = isDark ? '#E4E4E7' : '#1B1B1A';
  var dim = isDark ? '#8A8A94' : '#98A2B3';

  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  if(S.mode === 'dither'){
    drawObject(ctx, W, H, u, R);
  } else if(S.mode === 'riso'){
    var ex, ey, ew, eh;
    if(S.comp === 'tr'){ ex=W*0.34; ey=H*0.14; }
    else if(S.comp === 'bl'){ ex=W*0.04; ey=H*0.44; }
    else { ex=W*0.19; ey=H*0.24; }
    ew = W*0.62; eh = W*0.62;
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.80; ctx.fillStyle = '#FFD447'; // v1.5: 2도 = KC Sun
    ctx.beginPath(); ctx.ellipse(ex+ew/2, ey+eh/2, ew/2, eh/2, 0, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 0.72; ctx.fillStyle = '#FF6B5C';
    ctx.beginPath(); ctx.ellipse(ex+ew/2+13*u, ey+eh/2+11*u, ew/2, eh/2, 0, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#FFD447';
    ctx.fillRect(0, ey+eh+52*u, W, 11*u);
    ctx.globalAlpha = 0.48; ctx.fillStyle = '#FF6B5C';
    ctx.fillRect(0, ey+eh+57*u, W, 11*u);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  ctx.fillStyle = isDark ? 'rgba(246,241,232,.75)' : dim; // v1.4.1 알파 하한
  ctx.font = '600 ' + Math.round(25*u) + 'px ' + FONT;
  ctx.textBaseline = 'alphabetic';
  tracked(ctx, S.label, pad, pad + 18*u, 5.4*u);

  var baseCopy = Math.round((S.mode === 'type' ? 92 : 78) * u);
  if(copyArr.length >= 4) baseCopy = Math.round(baseCopy*0.74);
  else if(copyArr.length === 3) baseCopy = Math.round(baseCopy*0.86);
  var lh = 1.3;
  var blockH = (copyArr.length-1)*baseCopy*lh;

  if(S.mode === 'type'){
    var midY = H*0.44 - blockH/2;
    lines(ctx, copyArr, pad, midY, baseCopy, lh, ink, '600');
    if(sig){ ctx.fillStyle = sig; ctx.fillRect(pad, midY - baseCopy - 46*u, 78*u, 9*u); }
    ctx.strokeStyle = 'rgba(16,24,40,.14)'; ctx.lineWidth = 1.4*u;
    ctx.beginPath(); ctx.moveTo(pad, H-pad-52*u); ctx.lineTo(W-pad, H-pad-52*u); ctx.stroke();
    ctx.fillStyle = dim; ctx.font = '500 ' + Math.round(25*u) + 'px ' + FONT;
    ctx.fillText(S.meta, pad, H-pad);
  } else {
    var botY = H - pad - 44*u;
    var startY = botY - blockH;
    if(sig){ ctx.fillStyle = sig; ctx.fillRect(pad, startY - baseCopy - 44*u, 78*u, 9*u); }
    lines(ctx, copyArr, pad, startY, baseCopy, lh, ink, '600');
    ctx.fillStyle = dim; ctx.font = '500 ' + Math.round(25*u) + 'px ' + FONT;
    ctx.fillText(S.meta, pad, H-pad+6*u);
  }

  document.getElementById('stat').textContent =
    W + ' × ' + H + ' px · ' + S.mode + ' · 시드 ' + S.seed;
}

function syncFields(){
  document.getElementById('objFld').style.display = (S.mode === 'dither') ? '' : 'none';
  document.getElementById('spokeFld').style.display =
    (S.mode === 'dither' && S.obj === 'toono') ? '' : 'none';
}

function seg(id, key){
  var host = document.getElementById(id);
  host.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    S[key] = b.dataset.v;
    Array.prototype.forEach.call(host.children, function(n){ n.classList.toggle('on', n === b); });
    syncFields();
    render();
  });
}
seg('mode','mode'); seg('sig','sig');

function bind(id, key, after){
  document.getElementById(id).addEventListener('input', function(e){
    S[key] = e.target.value; if(after) after(); render();
  });
}
bind('label','label'); bind('copy','copy'); bind('metaTxt','meta');
bind('ratio','ratio'); bind('comp','comp'); bind('obj','obj', syncFields);
syncFields();

document.getElementById('spokes').addEventListener('input', function(e){
  S.spokes = +e.target.value;
  document.getElementById('spokeN').textContent = S.spokes;
  render();
});

document.getElementById('re').addEventListener('click', function(){
  S.seed = (S.seed*7919 + 13) % 99991; render();
});

document.getElementById('dl').addEventListener('click', function(){
  cv.toBlob(function(b){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'synk_' + (S.mode === 'dither' ? S.obj : S.mode) + '_' +
                 S.ratio.replace(':','x') + '_' + S.seed + '.png';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }, 'image/png');
});

if(document.fonts && document.fonts.ready) document.fonts.ready.then(render); else render();
render();
</script>
</body>
</html>

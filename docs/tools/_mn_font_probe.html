<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK 몽골 키릴 폰트 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=Manrope:wght@200..800&family=Golos+Text:wght@400..900&family=Geologica:wght@100..900&display=swap">
<style>
  body{ margin:0; padding:26px 30px 40px; background:#FDFCF8; color:#101014;
        font-family:'Inter Tight','SUIT Variable',system-ui,sans-serif; letter-spacing:-.02em; }
  h1{ font-size:19px; font-weight:800; margin:0 0 3px; letter-spacing:-.04em; }
  .note{ font-size:12.5px; color:#8A8F98; margin:0 0 20px; line-height:1.6; }
  .note b{ color:#101014; }
  .row{ border:1px solid #E7E5E0; border-radius:11px; padding:15px 18px 17px; margin:0 0 11px; background:#fff; }
  .tag{ font-size:10.5px; font-weight:800; letter-spacing:.09em; color:#FF6D00; margin:0 0 11px; }
  .kr{ font-family:'SUIT Variable',sans-serif; }
  .head{ font-size:26px; font-weight:800; letter-spacing:-.04em; line-height:1.3; }
  .body{ font-size:15.5px; font-weight:500; letter-spacing:-.02em; line-height:1.6; }
  .mix{ font-size:17px; font-weight:600; letter-spacing:-.03em; margin-top:9px;
        padding-top:11px; border-top:1px dashed #E7E5E0; }
  .lbl{ font-size:10.5px; color:#8A8F98; font-weight:600; letter-spacing:.04em; display:block; margin-bottom:3px; }
</style>
</head>
<body>
<h1>몽골 키릴 — SUIT와 나란히 세운 4종</h1>
<p class="note">한글은 전부 <b>SUIT Variable</b> 고정 · 몽골어만 후보가 바뀝니다. 맨 아래 줄이 진짜 시험대 — <b>한 줄에 3언어가 섞였을 때</b> 크기·굵기·베이스라인이 한 서체처럼 보이는가.</p>
<div id="sheet"></div>
<script>
var CANDS = ['Inter Tight','Manrope','Golos Text','Geologica'];
var s = '';
CANDS.forEach(function(f){
  var ff = "'" + f + "',sans-serif";
  s += '<div class="row"><div class="tag">' + f.toUpperCase() + '</div>'
    +  '<span class="lbl">헤드 800</span>'
    +  '<div class="head"><span class="kr">한국어를 얻다</span> &nbsp; <span style="font-family:'+ff+'">Солонгос хэл сурцгаая</span></div>'
    +  '<span class="lbl" style="margin-top:10px">본문 500</span>'
    +  '<div class="body"><span class="kr">오늘 수업에서 무엇을 배웠나요</span> &nbsp; <span style="font-family:'+ff+'">Өнөөдөр юу үзсэн бэ? Сургууль үнэгүй.</span></div>'
    +  '<div class="mix"><span class="lbl">3언어 혼합 600 — 실제 앱 UI</span>'
    +  '<span class="kr">오늘의 만남</span> <span style="font-family:'+ff+'">· Өнөөдрийн уулзалт · SYNK LAB 2027</span></div>'
    +  '</div>';
});
document.getElementById('sheet').innerHTML = s;
</script>
</body>
</html>

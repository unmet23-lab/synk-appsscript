<div class="r"><i style="font-family:'SYNK Bracket','Inter Tight','SUIT Variable',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">「이 사람 누구야?」</i> <span style="font-size:15px">고침</span></div>

<table id="t"><tr><th>잰 것<th>px<th>em<th>확인</tr></table>
<script>
  const w = (id) => Math.round(document.getElementById(id).getBoundingClientRect().width * 100) / 100;
  const 잰다 = () => {
    const 낫표 = { 'SUIT 단독': 'k_suit', 'Malgun 단독': 'k_mg', 'SYNK Bracket 단독': 'k_new', 'sans-serif 단독': 'k_gen', '킷 현행': 'k_kit', '킷 고침': 'k_fix' };
    const 라틴 = { '킷 현행': 'L_kit', '킷 고침': 'L_fix', 'SUIT 단독': 'L_suit', 'sans-serif 단독': 'L_gen' };
    const 값 = {};
    for (const k in 낫표) 값['낫표 「 · ' + k] = w(낫표[k]);
    for (const k in 라틴) 값['라틴줄 · ' + k] = w(라틴[k]);
    값['SUIT 잡히나(fonts.check)'] = document.fonts.check('34px "SUIT Variable"') ? 1 : 0;
    값['Malgun 잡히나'] = document.fonts.check('34px "Malgun Gothic"') ? 1 : 0;
    값['Inter Tight 잡히나'] = document.fonts.check('34px "Inter Tight"') ? 1 : 0;
    window.__잰값 = 값;
    const t = document.getElementById('t');
    for (const k in 값) t.insertAdjacentHTML('beforeend', '<tr><td>' + k + '<td>' + 값[k] + '<td>' + (Math.round(값[k] / 34 * 1000) / 1000) + '<td></tr>');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(잰다); else 잰다();
</script>

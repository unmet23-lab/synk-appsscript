<!doctype html><html lang="ko"><meta charset="utf-8"><title>라디오 — 털 고정·경계 합성 비교</title>
<style>
body{margin:16px;background:#201815;color:#fbf7f0;font-family:system-ui}h1{font-size:18px}button{padding:8px;margin:3px}section{position:relative;width:640px;height:360px;max-width:100%;overflow:hidden;background:#080605;margin-bottom:16px}video{position:absolute;width:640px;height:360px}iframe{position:absolute;border:0;width:1280px;height:720px;transform:scale(.5);transform-origin:0 0;background:transparent}#status{white-space:pre-wrap;font-size:12px}body.full section{height:500px}body.full video,body.full iframe{width:1280px;height:720px;left:-360px;top:-180px;transform:none}
</style>
<h1>동일한 털 · 얇은 경계만 비교</h1>
<nav id="controls"></nav><button id="auto">8표정 순환</button><button id="stop">중지</button><button id="size">1280 실제 송출 크기</button><button id="pixels">브라우저 픽셀 검사</button>
<p>수정: 공통 털 + 흰 경계 잔색 보정</p><section><video muted autoplay loop src="/docs/라디오/무대영상/추석_나무고정_조명_20260909.mp4"></video><iframe id="after" title="경계 보정 후"></iframe></section>
<p>비교: 공통 털만 적용 · 경계 원본</p><section><video muted autoplay loop src="/docs/라디오/무대영상/추석_나무고정_조명_20260909.mp4"></video><iframe id="before" title="경계 보정 전"></iframe></section><pre id="status">이미지 준비 중</pre>
<script>
const cuts=['기본','깜빡','눈웃음','궁금함','집중','안도','응원','놀람'];
const url='/bots/오버레이/마스코트.html?DJ=까몽&검수=1&결=추석보름달마당&크기=0.32&자리=중하&바닥=2.5&고정=기본';
after.src=url;before.src=url+'&경계원본=1';let timer=null,index=0;
function show(cut){for(const f of [before,after])f.contentWindow.마스코트검수표정(cut);statusRead();}
function statusRead(){document.getElementById('status').textContent=JSON.stringify([after,before].map(f=>{const w=f.contentWindow,im=w.document.querySelector('#마스코트틀 > img:not([hidden])');return {id:f.id,표정:w.마스코트상태?.().표정,파일:im?.dataset.originalSrc||im?.getAttribute('src'),edge:im?.dataset.edgeVersion,pixels:im?.dataset.edgePixels,shape:im?.style.transform,ready:im?.complete,width:im?.naturalWidth,opacity:im&&w.getComputedStyle(im).opacity,filter:im&&w.getComputedStyle(im).filter}}),null,2);}
for(const cut of cuts){const b=document.createElement('button');b.textContent=cut;b.onclick=()=>{clearInterval(timer);show(cut)};controls.append(b)}
document.getElementById('auto').onclick=()=>{clearInterval(timer);timer=setInterval(()=>show(cuts[index++%cuts.length]),750)};
document.getElementById('stop').onclick=()=>{clearInterval(timer);statusRead()};
document.getElementById('size').onclick=()=>document.body.classList.toggle('full');
setInterval(statusRead,1500);
document.getElementById('pixels').onclick=()=>{
  const get=f=>[...f.contentDocument.querySelectorAll('#마스코트틀 > img')].filter(im=>(im.dataset.originalSrc||im.src).includes('/65f92a753bb5416b/'));
  const raw=get(before), rendered=get(after), seen=new Set();
  const pixels=im=>{const c=document.createElement('canvas');c.width=1024;c.height=1024;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);return x.getImageData(0,0,1024,1024).data};
  const common=pixels(rendered[0]), commonRaw=pixels(raw[0]), results=[];
  for(const im of rendered){const name=im.dataset.originalSrc;if(seen.has(name))continue;seen.add(name);const d=pixels(im), r=pixels(raw.find(x=>decodeURI(x.src).endsWith(name.replace('../../','/'))));let outside=0,alpha=0,changed=0,inner=0;
    for(let p=0;p<1024*1024;p++){const i=p*4,x=p%1024,y=Math.floor(p/1024), eye=(x>=315&&x<417&&y>=313&&y<422)||(x>=492&&x<595&&y>=313&&y<422);if(d[i+3]!==common[i+3])alpha++;if(!eye&&[0,1,2,3].some(c=>d[i+c]!==common[i+c]))outside++;if([0,1,2,3].some(c=>d[i+c]!==r[i+c])){changed++;if(x>280&&x<620&&y>430&&y<750)inner++;}}
    results.push({name:name.split('/').pop(),outsideEyeRGBA:outside,alphaDifference:alpha,edgeDisplayChangedPixels:changed,protectedInnerChangedPixels:inner});
  }
  let panel=document.getElementById('pixelResult');if(!panel){panel=document.createElement('pre');panel.id='pixelResult';document.body.append(panel)}panel.textContent=JSON.stringify({at:new Date().toISOString(),scope:'Browser decoded rendered sprites, not YouTube compression',count:results.length,results},null,2);
};
</script></html>

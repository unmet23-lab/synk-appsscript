# 진단(2026-10-27): 배포 점검 6단계의 /path/ 휴대폰 axe 차이를 점검과 같은 실행기에서 가른다(.github/site-check/diag-axe.mjs).
# 이 가지에만 있는 임시 워크플로다 — 결과를 받으면 가지째 지운다. synk.im(main)과 배포 점검에는 닿지 않는다.
name: 배포 점검 진단 (axe)
on:
  push:
    branches: [diag/site-check-axe-20261027]
permissions:
  contents: read
concurrency:
  group: site-check-axe-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 플레이라이트 준비(배포 점검과 같은 판)
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: 진단
        run: node .github/site-check/diag-axe.mjs
        env:
          DIAG_FLOWS: IK
          DIAG_ROUTES: '[["/path/", 12], ["/en/path/", 3]]'
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-check-axe-diag
          path: site-check-artifacts
          if-no-files-found: ignore
          retention-days: 7

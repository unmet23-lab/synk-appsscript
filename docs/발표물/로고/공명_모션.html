<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNK 공명 모션 — 위상이 맞아가는 실</title>
<!--
  로고 한 벌 확정(유호 2026-08-21 · docs/_ops/결정.md) 중 «모션·영상 = 공명»의 모션 트랙.
  확정 시안 «공명 명품판»(베틀 위에서 두 실이 한 가닥으로 꼬인다)의 시간축 번역:
    ① 어긋남 — 코랄 실이 회색 실과 위상이 어긋난 채 흔들린다
    ② 정합 — 위상이 맞아간다(동기화 = SYNK)
    ③ 플라이드 얀 — 맞는 순간 두 실이 한 가닥으로 꼬여 뻗고, 구슬로 마감
    ④ 되감김 — 다시 어긋나며 루프(앱 로딩은 무한 루프, 영상은 ③에서 컷)
  자립형 1파일 — 외부 자산 0(전부 벡터·코드). 색은 킷 «이름» 값만(디자인_토큰 §색).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&display=swap">
<style>
  :root {
    --ink-deep:#080605; --ink:#2B2320; --paper:#FBF7F0; --stitch:#F0E3C8;
    --stone:#C7BFB2; --oat:#EDE7DC; --ash-wool:#8D857A; --coral:#F96859; --coral-soft:#FBB7A3;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--ink-deep); color:var(--paper);
    font-family:'Inter Tight','SUIT Variable',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:18px; padding:30px 18px 24px;
  }
  header { width:min(720px,94vw); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  header .tag  { font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--coral-soft); }
  header .name { font-size:15px; font-weight:700; }
  header .note { font-size:11px; font-weight:500; color:var(--stone); }
  .stage {
    width:min(720px,94vw); background:var(--ink); border-radius:20px; padding:26px 18px;
    box-shadow:0 16px 44px rgba(0,0,0,.5), inset 0 0 0 1px rgba(251,247,240,.045);
    position:relative;
  }
  .stage::after {
    content:""; position:absolute; inset:12px; border-radius:12px; pointer-events:none;
    border:1.6px dashed rgba(240,227,200,.28);
  }
  .stage svg { width:100%; height:auto; display:block; }
  .row { width:min(720px,94vw); display:flex; gap:14px; align-items:stretch; flex-wrap:wrap; }
  .chip {
    background:var(--ink); border-radius:14px; padding:14px 18px 10px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .chip label { font-size:10.5px; font-weight:500; color:var(--ash-wool); letter-spacing:.04em; }
  .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button {
    font:inherit; font-size:12px; font-weight:700; color:var(--paper);
    background:transparent; border:1px solid #575046; border-radius:999px;
    padding:8px 16px; cursor:pointer;
  }
  button:hover { border-color:var(--coral-soft); color:var(--coral-soft); }
  footer {
    width:min(720px,94vw); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    padding-top:12px; border-top:1px solid var(--ink);
  }
  footer .note { font-size:11px; font-weight:500; color:var(--stone); }
</style>
</head>
<body>

<header>
  <span class="tag">공명 · 모션 트랙</span>
  <span class="name">위상이 맞아가는 실 — 개원 영상·앱 로딩</span>
  <span class="note">동기화(SYNK)의 직조 번역: 어긋남 → 정합 → 플라이드 얀 → 구슬 마감</span>
</header>

<section class="stage" aria-label="공명 모션 — 큰 무대">
  <svg id="hero" viewBox="-160 -52 320 104"></svg>
</section>

<section class="row">
  <div class="chip"><svg id="spin1" viewBox="-80 -22 160 44" style="width:150px"></svg><label>앱 로딩 · 150px</label></div>
  <div class="chip"><svg id="spin2" viewBox="-80 -22 160 44" style="width:92px"></svg><label>앱 로딩 · 92px</label></div>
  <div class="controls">
    <button id="btn-play" type="button">멈춤</button>
    <button id="btn-restart" type="button">처음부터</button>
  </div>
</section>

<footer>
  <span class="note">자립형 1파일 — 외부 자산 0(전부 벡터·코드) · 무대 = 양모 밤(바탕 Ink Deep · 카드 Ink) · 실 = Coral↔Stone, 마감 구슬 = Coral+Paper · 영상 컷은 ③플라이드 얀 완성 순간(구슬 팝)에서 끊는다</span>
</footer>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const easeInOut = v => v < .5 ? 4*v*v*v : 1 - Math.pow(-2*v + 2, 3) / 2;
  const easeOut = v => 1 - Math.pow(1 - v, 3);

  // 한 무대를 세운다 — o: {x0 어긋남 시작, x1 정합점, x2 구슬, 파장, 진폭, 굵기, 구슬r, 주기(초), 경사}
  function 세우기(svg, o) {
    const mk = (n, at) => { const e = document.createElementNS(NS, n);
      for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
    if (o.경사) for (let x = -120; x <= 120; x += 40)
      mk('path', { d: `M ${x} -36 L ${x} 36`, stroke: '#F0E3C8', 'stroke-width': 1.1, opacity: .13 });
    const 실 = at => mk('path', Object.assign({ fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, at));
    return {
      o,
      tea:   실({ stroke: '#C7BFB2', 'stroke-width': o.굵기 * .64 }),
      stu:   실({ stroke: '#F96859', 'stroke-width': o.굵기 }),
      stuHi: 실({ stroke: '#FBB7A3', 'stroke-width': o.굵기, 'stroke-dasharray': `${o.굵기*.24} ${o.굵기*1.36}`, opacity: .5 }),
      ply:   실({ stroke: '#F96859', 'stroke-width': o.굵기 * 1.16 }),
      plyHi: 실({ stroke: '#C7BFB2', 'stroke-width': o.굵기 * 1.16, 'stroke-dasharray': `${o.굵기*.6} ${o.굵기*.92}`, 'stroke-linecap': 'butt' }),
      bead:  mk('circle', { fill: '#F96859', r: 0 }),
      beadHi:mk('circle', { fill: '#FBF7F0', r: 0 }),
    };
  }

  function 그리기(inst, t) {
    const o = inst.o, τ = (t % o.주기) / o.주기;
    // 타임라인 — ①어긋남→②정합(0~.42) · 고정(.42~.85) · ④되감김(.85~1). 플라이는 .45~.68 뻗는다.
    const 정합 = τ < .42 ? easeInOut(τ / .42) : τ < .85 ? 1 : 1 - easeInOut((τ - .85) / .15);
    const 플라이 = τ < .45 ? 0 : τ < .68 ? easeOut((τ - .45) / .23) : τ < .85 ? 1 : clamp01(1 - (τ - .85) / .12);
    const 맥박 = Math.exp(-Math.pow((τ - .44) * o.주기 / .18, 2));       // 위상이 맞는 순간의 고동
    const 팝   = Math.exp(-Math.pow((τ - .68) * o.주기 / .15, 2));       // 구슬이 태어나는 순간

    const 기본 = x => o.진폭 * Math.sin(TAU * (x - o.x0) / o.파장);
    let dT = '', dS = '';
    for (let x = o.x0; x <= o.x1 + .01; x += 4) {
      dT += (dT ? ' L ' : 'M ') + x + ' ' + 기본(x).toFixed(2);
      const 어긋 = 1 - 정합;
      const y = o.진폭 * (0.88 + 0.12 * 정합) * Math.sin(TAU * (x - o.x0) / o.파장 + 어긋 * .85 * Math.PI)
              + 어긋 * (o.진폭 * .38 * Math.sin(TAU * x / (o.파장 * .6) + 1.7)
                      + o.진폭 * .25 * Math.sin(TAU * x / (o.파장 * .33) + .6));
      dS += (dS ? ' L ' : 'M ') + x + ' ' + y.toFixed(2);
    }
    inst.tea.setAttribute('d', dT);
    inst.stu.setAttribute('d', dS); inst.stuHi.setAttribute('d', dS);
    inst.stu.setAttribute('stroke-width', (o.굵기 * (1 + .14 * 맥박)).toFixed(2));

    if (플라이 > .004) {
      const 끝x = o.x1 + (o.x2 - o.x1) * 플라이;
      let dP = '';
      for (let x = o.x1; x < 끝x; x += 4) dP += (dP ? ' L ' : 'M ') + x + ' ' + 기본(x).toFixed(2);
      dP += (dP ? ' L ' : 'M ') + 끝x.toFixed(1) + ' ' + 기본(끝x).toFixed(2);
      inst.ply.setAttribute('d', dP); inst.plyHi.setAttribute('d', dP);
      const r = o.구슬r * 플라이 * (1 + .25 * 팝);
      inst.bead.setAttribute('cx', 끝x); inst.bead.setAttribute('cy', 기본(끝x)); inst.bead.setAttribute('r', r.toFixed(2));
      inst.beadHi.setAttribute('cx', 끝x - r * .33); inst.beadHi.setAttribute('cy', 기본(끝x) - r * .33);
      inst.beadHi.setAttribute('r', (r * .3).toFixed(2));
    } else {
      inst.ply.removeAttribute('d'); inst.plyHi.removeAttribute('d');
      inst.bead.setAttribute('r', 0); inst.beadHi.setAttribute('r', 0);
    }
  }

  const 무대들 = [
    세우기(document.getElementById('hero'),
      { x0: -140, x1: 40, x2: 140, 파장: 88, 진폭: 15.8, 굵기: 5, 구슬r: 6, 주기: 6.4, 경사: true }),
    세우기(document.getElementById('spin1'),
      { x0: -70, x1: 14, x2: 66, 파장: 52, 진폭: 8.6, 굵기: 3, 구슬r: 3.6, 주기: 3.2, 경사: false }),
    세우기(document.getElementById('spin2'),
      { x0: -70, x1: 14, x2: 66, 파장: 52, 진폭: 8.6, 굵기: 3, 구슬r: 3.6, 주기: 3.2, 경사: false }),
  ];

  let 시계 = 0, 이전 = performance.now(), 재생중 = true;
  const 돌기 = 지금 => {
    if (재생중) 시계 += (지금 - 이전) / 1000;
    이전 = 지금;
    for (const 무 of 무대들) 그리기(무, 시계);
    requestAnimationFrame(돌기);
  };
  requestAnimationFrame(돌기);

  document.getElementById('btn-play').addEventListener('click', e => {
    재생중 = !재생중; e.target.textContent = 재생중 ? '멈춤' : '재생';
  });
  document.getElementById('btn-restart').addEventListener('click', () => { 시계 = 0; });

  // 검증 손잡이 — 숨은 탭에선 rAF 가 멈춰서 «움직이는지»를 밖에서 못 잰다.
  // 시각을 직접 넣어 한 프레임을 그리게 한다(제품 동작엔 관여하지 않는다).
  window.__공명프레임 = t => { 시계 = t; for (const 무 of 무대들) 그리기(무, 시계); };
})();
</script>

</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>첫 소개 한 문장 · 직접 작성</title><link rel="stylesheet" href="../edition.css"></head><body class="first-edition"><article class="reader proof-view"><img class="web-logo" src="../assets/logo-shift.png" alt="SYNK SHIFT"><p class="eyebrow">FIRST WORK / 가상 교육용 예시</p><h1>내 일이 남기는 것,<br>세 칸으로 써보기.</h1><p>예시의 대상을 자기 상황으로 바꿔보세요. 하는 일과 받는 결과도 그 사람에게 맞는지 함께 확인합니다.</p><label class="worksheet-label" for="person">누구에게</label><textarea class="worksheet-input" id="person" rows="2">첫 강의를 제안하는 독립 강사</textarea><label class="worksheet-label" for="work">어떤 일을</label><textarea class="worksheet-input" id="work" rows="2">강의의 대상과 실습을 정리해</textarea><label class="worksheet-label" for="result">끝에 남길 것</label><textarea class="worksheet-input" id="result" rows="2">강의 제안서 한 장</textarea><div class="live-result" id="sentence" aria-live="polite"></div><p id="check">확인: 실제로 하는 일인가요? 결과물의 이름이 보이나요? 받는 사람이 어디에 쓸지 알 수 있나요?</p><div class="actions"><button type="button" id="save">내 문장 TXT 받기</button><a class="button" href="shift-intro.html">더 많은 예시와 확인법</a></div><p id="status" role="status"></p><p class="eyebrow">입력은 이 화면에만 있습니다. 닫기 전에 내려받아 보관하세요. 회사·고객 정보 대신 가상 상황으로 연습해도 됩니다.</p></article><script>const fields=['person','work','result'].map(id=>document.getElementById(id));function objectWord(v){const c=v.trim().charCodeAt(v.trim().length-1);return v+(c>=44032&&c<=55203&&(c-44032)%28!==0?'을':'를')}function draw(){const [p,w,r]=fields.map(x=>x.value.trim());document.getElementById('sentence').textContent=objectWord(p)+' 위해 '+w+', '+objectWord(r)+' 만듭니다.'}fields.forEach(x=>x.addEventListener('input',draw));draw();document.getElementById('save').addEventListener('click',()=>{const value=document.getElementById('sentence').textContent+'\n\n확인할 것\n1. 실제 하는 일\n2. 결과물의 이름\n3. 사용하는 자리\n';const url=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='내일_소개문장.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='내 문장 파일을 만들었습니다.'})</script></body></html>

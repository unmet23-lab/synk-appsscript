<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔리오 사업계획서 심사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}
@font-face{font-family:'DM Mono';font-weight:400;font-display:swap;src:url(../../브랜드_폰트/DM_Mono/DMMono-Regular.ttf) format('truetype');}

/* 짜임: 솔리오 첫 팀 고르기 7판(무대 하나 + 문장 하나)의 검정 방을 그대로 잇는다.
   쓰기는 왼쪽 흰 종이가 무대다. 답을 넣을 때마다 그 글이 종이의 그 장 자리로 옮겨 앉는다.
   심사는 발표자 하나를 뒷모습의 심사위원 셋이 보는 장면이 무대이고, 오른쪽 채점표 칸에 점수가 들어온다.
   글자: 계획서 종이 안의 글은 명조(손님의 문서), 솔리오와 직원의 말은 SUIT, 점수와 장 번호는 DM Mono.
   색: 검정은 방, 흰 종이와 먹은 손님의 계획서, 청금석은 심사위원이 짚은 곳(가장 약한 항목),
   버터는 의견이 갈린 곳, 메도우는 정리된 것(쓴 장, 고친 곳, 오른 점수), 흰 알약은 그 순간 먼저 할 일 하나. */
:root{
  color-scheme:dark;
  --void:#000;
  --paper:#F3F1EC;
  --dim:rgba(243,241,236,.46);
  --soft:rgba(243,241,236,.72);
  --hair:rgba(243,241,236,.10);
  --hair-strong:rgba(243,241,236,.22);
  --ring:rgba(243,241,236,.55);
  --pit:#0C0C0B;
  --sheet:#FFFFFF;
  --sheet-ink:#151514;
  --sheet-dim:#6B6A66;
  --sheet-faint:#ABA79F;
  --sheet-rule:#E7E5E0;
  --lapis:#3D6BC9;
  --lapis-soft:#C5D6F5;
  --meadow:#7DB45A;
  --meadow-soft:#D3E8BE;
  --butter:#F5C445;
  --butter-soft:#FFEBB0;
  --sans:'SUIT Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --mono:'DM Mono','SUIT Variable','Malgun Gothic',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1px solid var(--ring);outline-offset:3px}

#stage{position:relative;min-height:100vh;width:var(--sw,100%);margin:0 auto;container-type:inline-size;container-name:stage;padding:0 clamp(20px,6cqw,110px) 110px}
body.narrow #stage{--sw:420px;outline:1px solid var(--hair)}

.here{display:flex;align-items:center;gap:10px;padding-top:clamp(14px,3vh,34px)}
.here svg{width:40px;height:40px}
.here-name{font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7)}
.here-step{margin-left:auto;font:400 12px/1 var(--sans);color:var(--dim)}
.here .quiet{margin-left:18px;font-size:12px}

.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:18px 40px;margin-top:clamp(20px,4vh,46px)}
.top > div:first-child{flex:1 1 auto}
.say{margin:0;font:300 clamp(26px,3.3cqw,46px)/1.28 var(--sans);letter-spacing:-.018em;max-width:20em;text-wrap:balance}
.say .then{display:block;margin-top:4px;font-size:.62em;line-height:1.5;letter-spacing:-.01em;color:var(--soft)}
.say.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px}
.chips{margin:0 0 12px;font:400 13px/1.5 var(--sans);color:var(--dim)}
.chips b{font-weight:500;color:var(--soft)}

.go{appearance:none;height:42px;margin:0;padding:0 22px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);font:500 14px/1 var(--sans);color:var(--paper);cursor:pointer;white-space:nowrap;transition:background-color .25s ease,border-color .25s ease,color .25s ease,opacity .25s ease}
.go:hover{border-color:var(--paper)}
.go.main{background:var(--paper);border-color:var(--paper);color:var(--void)}
.go.main:hover{background:#fff}
.go:disabled{opacity:.32;cursor:default}
.go:disabled:hover{border-color:rgba(243,241,236,.42)}
.go.main:disabled:hover{background:var(--paper)}
.go.sm{height:34px;padding:0 16px;font-size:13px}
.quiet{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;margin:0;padding:0 0 4px;font:400 13px/1.3 var(--sans);color:rgba(243,241,236,.8);cursor:pointer;transition:color .25s ease,border-color .25s ease}
.quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
.lab{font:400 13px/1.4 var(--sans);color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 무대(7판과 같다): 왼쪽에 장면, 오른쪽에 글 ── */
.show{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:clamp(26px,4.4cqw,72px);margin-top:clamp(10px,2vh,24px);align-items:start}
.hero-art{position:relative;aspect-ratio:3/2;margin:0 -2%}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .55s ease,transform 1.1s var(--ease);
  -webkit-mask-image:radial-gradient(ellipse 62% 64% at 52% 46%,#000 50%,transparent 92%),linear-gradient(to bottom,#000 70%,transparent 96%);-webkit-mask-composite:source-in;mask-image:radial-gradient(ellipse 62% 64% at 52% 46%,#000 50%,transparent 92%),linear-gradient(to bottom,#000 70%,transparent 96%);mask-composite:intersect}
.hero-art img.on{opacity:1;transform:none}
/* 첫 화면의 솔리오: 블렌더로 구운 책상 장면(그림/무대/책상자리.json)의 구 위에 눈을 얹는다 */
.hero-art{container-type:inline-size}
.hero-eyes{position:absolute;left:43.248%;top:24.774%;width:19.65%;aspect-ratio:1}
.hero-eyes .orb{width:100%;height:100%}
.hb{position:absolute;left:65.5%;top:24%;max-width:34.5%;padding:.75em 1em;background:rgba(12,12,11,.9);border:1px solid var(--hair-strong);border-radius:16px;font:500 clamp(11.5px,2.1cqw,16px)/1.45 var(--sans);color:var(--paper);animation:rise .6s var(--ease) .5s both}
.hb::after{content:'';position:absolute;left:-.42em;top:1.6em;width:.7em;height:.7em;background:inherit;border:inherit;border-top:0;border-right:0;transform:rotate(45deg)}
.hb p{margin:0}
.hb b{font-weight:700}
.hb-sub{margin-top:.4em !important;font-weight:400;font-size:.88em;color:var(--soft)}
.cas{opacity:0;transform:translateY(-10px)}
.info.in .cas{opacity:1;transform:none;transition:opacity .36s ease calc(60ms + var(--j,0) * 70ms),transform .52s var(--ease) calc(60ms + var(--j,0) * 70ms)}
.i-no{font:500 12px/1 var(--sans);letter-spacing:.08em;color:var(--dim)}
.i-name{margin:12px 0 0;font:700 clamp(30px,3.3cqw,46px)/1.12 var(--sans);letter-spacing:-.02em}
.i-tag{margin:10px 0 0;font:400 17px/1.45 var(--sans);color:rgba(243,241,236,.9)}
.meters{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center}
.meters dt{font:400 12px/1.2 var(--sans);color:var(--dim);white-space:nowrap}
.meters dd{margin:0;font:500 13px/1.4 var(--sans);color:var(--soft)}
.i-go{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;margin-top:20px}
.pc{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.pc h3{grid-column:1/-1;margin:0 0 8px;font:500 12px/1 var(--sans);letter-spacing:.12em;color:var(--dim)}
.ch-ln{display:grid;grid-template-columns:30px 1fr;gap:4px;margin:0;padding:5px 0;font:400 15px/1.5 var(--sans);color:rgba(243,241,236,.92)}
.ch-ln i{font:400 12px/1.9 var(--mono);font-style:normal;color:var(--dim)}
.ch-ln small{display:block;font-size:13px;color:var(--dim)}

/* 7판의 팀 줄 */
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2cqw,16px);margin-top:4px}
.pick{appearance:none;position:relative;margin:0;padding:8px 12px 8px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;text-align:left;cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:14px;transition:border-color .3s ease,background-color .3s ease}
.pick:hover{border-color:rgba(243,241,236,.36)}
.pick[aria-pressed="true"]{border-color:var(--paper);background:var(--pit)}
.th{display:block;width:clamp(64px,6.6cqw,92px);aspect-ratio:3/2;border-radius:9px;overflow:hidden;background:#000}
.th img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.6)}
.pick:not([aria-pressed="true"]) .th img{filter:grayscale(.3) brightness(.85)}
.p-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.p-no{font:400 11px/1 var(--mono);letter-spacing:.14em;color:var(--dim)}
.p-name{font:600 15px/1.25 var(--sans)}
.pick:not([aria-pressed="true"]) .p-name{color:var(--soft)}

/* ── 쓰기: 이름 붙은 일곱 막대 ── */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:clamp(18px,3vh,30px)}
.bar{appearance:none;background:none;border:0;margin:0;padding:6px 0 0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.bar i{display:block;height:3px;border-radius:1px;background:var(--hair-strong);transition:background-color .4s ease}
.bar span{font:400 11.5px/1.2 var(--sans);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.done i{background:var(--meadow)}
.bar.done span{color:var(--soft)}
.bar.now i{background:var(--paper)}
.bar.now span{color:var(--paper);font-weight:600}
.bar.skip i{background:none;border-top:1px dashed rgba(243,241,236,.4);height:2px}
.bar:hover span{color:var(--paper)}
.left-note{margin:14px 0 0;font:400 13px/1.5 var(--sans);color:var(--soft);animation:swap .5s var(--ease)}
.left-note b{font-weight:600;color:var(--paper)}

.write{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr);gap:clamp(26px,4.4cqw,72px);margin-top:clamp(18px,3vh,30px);align-items:start}
.ask{position:sticky;top:20px}
.ex{margin:0;padding:14px 16px;border-left:2px solid var(--hair-strong);font:400 14px/1.65 var(--sans);color:var(--soft)}
.ex-h{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:default}
.ex b,.ex .ex-h{display:block;margin-bottom:4px;font:500 11.5px/1 var(--sans);letter-spacing:.12em;color:var(--dim)}
.ex.fold{padding-top:8px;padding-bottom:8px}
.ex.fold span{display:none}
.ex.fold .ex-h{margin:0;cursor:pointer}
.ex.fold .ex-h::after{content:' · 쓰는 동안 접어 둡니다. 다시 보기 ›';letter-spacing:0}
.ex.fold .ex-h:hover{color:var(--paper)}
.ans{display:block;width:100%;min-height:190px;margin-top:16px;padding:16px 18px;resize:none;background:var(--pit);border:1px solid var(--hair-strong);border-radius:14px;font:400 16px/1.7 var(--sans);color:var(--paper);transition:border-color .25s ease}
.ans:focus{outline:none;border-color:rgba(243,241,236,.6)}
.ans::placeholder{color:rgba(243,241,236,.3)}
.ask-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.count{font:400 12px/1 var(--mono);color:var(--dim)}
.ask-go{display:flex;align-items:center;flex-wrap:wrap;gap:14px 22px;margin-top:18px}

/* 계획서 종이: 손님의 문서. 명조로 쓴다 */
.sheet{display:block;background:var(--sheet);color:var(--sheet-ink);border-radius:2px;padding:clamp(24px,3cqw,42px) clamp(22px,3.4cqw,48px) clamp(14px,2cqw,26px);box-shadow:0 30px 70px -24px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04)}
.sheet-h{padding-bottom:14px}
.sheet-h small{font:400 11.5px/1.3 var(--mono);color:var(--sheet-dim)}
.sheet-h h3{margin:10px 0 4px;font:600 clamp(22px,2.1cqw,27px)/1.3 var(--serif);letter-spacing:-.01em}
.sheet-h p{margin:0;font:400 13.5px/1.5 var(--serif);color:var(--sheet-dim)}
.sec{position:relative;padding:15px 0 16px;border-top:1px solid var(--sheet-rule)}
.sec h4{margin:0;display:flex;align-items:baseline;gap:10px;font:600 15.5px/1.4 var(--serif)}
.sec h4 .mono{font-size:11.5px;font-weight:400;color:var(--sheet-dim)}
.sec p{margin:8px 0 0;font:400 15px/1.8 var(--serif);color:var(--sheet-ink)}
.sec.future h4{color:var(--sheet-faint)}
.sec.future h4 .mono{color:var(--sheet-faint)}
.sec.done h4 .mono{color:var(--meadow)}
.slot{margin-top:9px;padding:10px 12px;border:1px dashed #CFCAC0;border-radius:3px;font:400 13px/1.4 var(--sans);color:var(--sheet-dim)}
.sec.now .slot{border-color:#8F8B83;color:var(--sheet-ink)}
.sec.landing p{opacity:0}
.sec p.live{color:#4a4844}
.sec p.live:empty{display:none}
.sec .slot[hidden]{display:none}
.sec p.fresh{animation:land .6s var(--ease)}
@keyframes land{from{opacity:.2}to{opacity:1}}
.fly{position:fixed;z-index:30;margin:0;pointer-events:none;font:400 15px/1.8 var(--serif);color:var(--sheet-ink);background:#fff;border-radius:3px;padding:0;overflow:hidden;box-shadow:0 18px 40px -16px rgba(0,0,0,.8);transition:transform .58s var(--ease),width .58s var(--ease),height .58s var(--ease),opacity .2s ease .5s;transform-origin:0 0}

/* 쓰기를 마친 뒤의 장 목록 */
.chlist{list-style:none;margin:0;padding:0}
.chlist li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.chlist .mono{font-size:12px;color:var(--dim)}
.chlist b{font:500 15px/1.4 var(--sans)}
.chlist small{display:block;font:400 12.5px/1.4 var(--sans);color:var(--dim)}
.chlist li.ok .mono{color:var(--meadow)}
.chlist li.ok small{color:var(--meadow-soft)}

/* 건너뛰기 전 물음 */
.veil{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.74);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--pit);border:1px solid var(--hair-strong);border-radius:20px;padding:clamp(24px,4vw,36px);animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dlg small{font:500 12px/1 var(--sans);letter-spacing:.12em;color:var(--dim)}
.dlg h2{margin:12px 0 0;font:600 clamp(21px,2.4vw,26px)/1.35 var(--sans);letter-spacing:-.015em}
.dlg p{margin:12px 0 0;font:400 15.5px/1.65 var(--sans);color:var(--soft)}
.dlg p b{font-weight:600;color:var(--paper)}
.dlg .ask-go{margin-top:24px}
.dlg.wide{width:min(720px,100%)}

/* ── 심사 ── */
.panel{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6cqw,22px);margin-top:-34px}
.jc{padding-top:12px;border-top:1px solid var(--hair-strong)}
.jc .mono{font-size:11px;letter-spacing:.12em;color:var(--dim)}
.jc b{display:block;margin-top:7px;font:600 18px/1.2 var(--sans)}
.jc span{display:block;margin-top:4px;font:400 12.5px/1.4 var(--sans);color:var(--dim)}
.read{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.read i{display:block;height:3px;border-radius:1px;background:var(--hair-strong);transition:background-color .3s ease}
.read i.on{background:var(--paper)}
.jc.fin .read i.on{background:var(--meadow)}
.read-n{margin-top:7px;font:400 12px/1 var(--mono);color:var(--soft)}
.jc.fin .read-n{color:var(--meadow-soft)}

.rubric h3,.res-h{margin:0;font:500 12px/1 var(--sans);letter-spacing:.12em;color:var(--dim)}
.rub-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rub-head{display:grid;grid-template-columns:1fr repeat(3,52px);gap:8px;margin-top:14px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.rub-head span{font:500 11.5px/1.2 var(--sans);color:var(--soft);text-align:center}
.rb{display:grid;grid-template-columns:1fr repeat(3,52px);gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.rb b{display:block;font:600 15px/1.3 var(--sans)}
.rb small{display:block;margin-top:3px;font:400 12.5px/1.4 var(--sans);color:var(--dim)}
.rb .anch{display:none;margin-top:8px;font:400 12.5px/1.6 var(--sans);color:var(--soft)}
.rb .anch .mono{display:inline-block;width:2.2em;color:var(--dim)}
.rubric.anchors .rb .anch{display:block}
.sl{height:34px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;font:400 15px/1 var(--mono);color:var(--paper)}
.sl:empty::before{content:'';width:14px;height:1px;background:var(--hair-strong)}
.sl.in{border-color:rgba(243,241,236,.5);animation:pop .42s cubic-bezier(.2,1.5,.4,1) both}
.sl.up{border-color:var(--meadow);color:var(--meadow-soft)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

/* 결과 */
.res-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(22px,4cqw,64px);align-items:end;margin-top:clamp(20px,4vh,46px)}
.total{display:flex;flex-direction:column;gap:8px}
.total-n{display:flex;align-items:baseline;gap:12px;font:200 clamp(76px,8.4cqw,120px)/.9 var(--sans);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.total-n small{font:400 .2em/1 var(--mono);letter-spacing:0;color:var(--dim)}
.total-d{font:400 15px/1 var(--mono);color:var(--meadow-soft)}
.total .lab{font-size:12.5px}
.fine{margin:14px 0 0;font:400 12.5px/1.5 var(--sans);color:var(--dim)}
.res{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:clamp(26px,4.4cqw,72px);margin-top:clamp(26px,4vh,46px);align-items:start}

table.sc{width:100%;border-collapse:collapse;margin-top:14px}
.sc th{padding:0 6px 10px;font:400 11.5px/1.35 var(--sans);color:var(--dim);text-align:center;vertical-align:bottom;border-bottom:1px solid var(--hair-strong)}
.sc th:first-child{text-align:left;padding-left:0}
.sc th b{display:block;font:600 13px/1.2 var(--sans);color:var(--soft)}
.sc th .mono{font-size:10.5px}
.sc td{padding:13px 6px;border-bottom:1px solid var(--hair);text-align:center;font:400 16px/1 var(--mono);vertical-align:middle}
.sc td:first-child{text-align:left;padding-left:0}
.crit{appearance:none;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:left;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.crit b{font:600 15px/1.3 var(--sans);color:var(--paper)}
.crit .chev{display:inline-block;width:12px;font:400 17px/1 var(--sans);color:var(--soft);transition:transform .3s ease}
.sc tr:has(.crit):hover td{background:rgba(243,241,236,.035)}
.crit:hover b{text-decoration:none;color:var(--paper)}
tr.open .crit .chev{transform:rotate(90deg)}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 12px/1.2 var(--sans)}
.tag::before{content:'';width:10px;height:2px;background:currentColor}
.tag.weak{color:var(--lapis-soft)}
.tag.split{color:var(--butter)}
.tag.fixed{color:var(--meadow-soft)}
tr.weak .crit b{color:var(--lapis-soft)}
.d{display:inline-block;margin-left:3px;font:400 10.5px/1 var(--mono);color:var(--meadow-soft);vertical-align:super}
.avg{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.avg .mono{font-size:15px;min-width:2.2em;text-align:right}
.avg i{display:block;width:72px;height:10px;background:var(--hair);position:relative}
.avg i::after{content:'';position:absolute;inset:0 auto 0 0;width:var(--w);background:rgba(243,241,236,.55);transition:width .7s var(--ease)}
tr.weak .avg i::after{background:var(--lapis-soft)}
tr.weak .avg .mono{color:var(--lapis-soft)}
tr.more td{padding:4px 0 18px;text-align:left;font-family:var(--sans)}
.why{display:grid;grid-template-columns:86px 26px minmax(0,1fr);gap:6px 10px;align-items:start;padding:9px 0}
.why + .why{border-top:1px dashed var(--hair)}
.why .who{font:600 13px/1.4 var(--sans)}
.why .who small{display:block;font:400 11.5px/1.3 var(--sans);color:var(--dim)}
.why .pt{font:400 15px/1.3 var(--mono)}
.why p{margin:0;font:400 14px/1.55 var(--sans);color:rgba(243,241,236,.9)}
.qs{display:flex;width:fit-content;max-width:100%;align-items:baseline;gap:10px;margin-top:8px;padding:2px 0 2px 12px;border-left:2px solid rgba(243,241,236,.5);color:rgba(243,241,236,.92);font:400 14.5px/1.6 var(--serif)}
.res-acts{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;margin-top:18px}
.qs .mono{flex:none;font-size:11px;color:var(--dim)}
.qs.fresh{border-left-color:var(--meadow)}

.jside .hero-art{margin:0 -3%}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:14px 0;border-top:1px solid var(--hair)}
.verdict .who{font:600 15px/1.3 var(--sans)}
.verdict .who .mono{font-size:11px;font-weight:400;letter-spacing:.12em;color:var(--dim);margin-right:8px}
.verdict .who small{font-size:12.5px;font-weight:400;color:var(--dim);margin-left:8px}
.verdict .g{grid-row:span 2;align-self:center;font:400 22px/1 var(--mono)}
.verdict p{margin:0;font:400 14.5px/1.55 var(--sans);color:rgba(243,241,236,.9)}

/* 최종 솔루션: 먼저 고칠 셋 */
.fixes{margin-top:clamp(36px,6vh,64px);padding-top:clamp(24px,4vh,36px);border-top:1px solid var(--hair-strong)}
.fixes h2{margin:0;font:600 clamp(22px,2.3cqw,28px)/1.3 var(--sans);letter-spacing:-.015em}
.fixes > p{margin:8px 0 0;font:400 15px/1.55 var(--sans);color:var(--soft)}
.fx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6cqw,22px);margin-top:22px;align-items:start}
.fx{background:var(--pit);border:1px solid var(--hair-strong);border-radius:16px;padding:20px 20px 22px;transition:border-color .3s ease}
.fx.cur{border-color:rgba(243,241,236,.5)}
.fx.done{border-color:rgba(125,180,90,.45)}
.fx h3{margin:10px 0 0;font:600 17.5px/1.4 var(--sans)}
.fx .whyl{margin:10px 0 0;font:400 14px/1.55 var(--sans);color:var(--soft)}
.fx-act{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.fx-act .row{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px}
.src{display:flex;flex-direction:column;gap:6px}
.src label{font:400 12.5px/1.3 var(--sans);color:var(--dim)}
.src input{width:100%;height:40px;padding:0 12px;background:#000;border:1px solid var(--hair-strong);border-radius:10px;font:400 14px/1 var(--sans)}
.src input:focus{outline:none;border-color:rgba(243,241,236,.6)}
.fx-q{margin:0;font:600 15px/1.4 var(--sans)}
.opt2{appearance:none;margin:0;padding:11px 14px;text-align:left;cursor:pointer;background:#000;border:1px solid var(--hair-strong);border-radius:12px;font:400 14px/1.45 var(--sans);color:var(--soft);transition:border-color .25s ease,color .25s ease}
.opt2:hover{border-color:rgba(243,241,236,.5);color:var(--paper)}
.opt2[aria-pressed="true"]{border-color:var(--paper);color:var(--paper)}
.work{font:400 13px/1.4 var(--sans);color:var(--soft)}
.work i{display:block;height:3px;margin-top:9px;background:var(--hair);position:relative;overflow:hidden}
.work i::after{content:'';position:absolute;inset:0 auto 0 0;width:0;background:var(--paper);animation:grow var(--t,3.2s) linear forwards}
@keyframes grow{to{width:100%}}
.calc{margin:0;padding:12px 14px;border:1px solid var(--hair);border-radius:10px;font:400 13px/1.9 var(--mono);color:var(--soft)}
.calc b{font-weight:400;color:var(--paper)}
.okline{display:flex;align-items:center;gap:10px;font:500 13.5px/1.4 var(--sans);color:var(--meadow-soft)}
.okline::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--meadow)}

.res-go{display:flex;align-items:center;flex-wrap:wrap;gap:14px 24px;margin-top:30px}

.endlist{list-style:none;margin:0;padding:0}
.endlist li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.endlist b{font:500 15px/1.4 var(--sans)}
.endlist small{display:block;font:400 12.5px/1.4 var(--sans);color:var(--dim)}
.endlist .mono{font-size:15px;color:var(--meadow-soft)}

/* ── 마스코트: 솔리오의 검은 구 직원. 몸은 거의 움직이지 않고 눈과 빛으로만 표정을 낸다 ── */
/* 구 몸은 블렌더로 구운 그림(그림/무대)이고, 눈만 그 위에 얹어 표정을 낸다 */
.sprite{position:relative;display:block;width:100%;aspect-ratio:1}
.sprite > img{position:absolute;inset:0;width:100%;height:100%;display:block}
.sprite > .orb{position:absolute;left:19.7%;top:19.7%;width:60.6%;height:60.6%}
.orb{display:block;overflow:visible}
.orb .o-eyes{fill:#FFFAF3;stroke:#FFFAF3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1.4px rgba(243,241,236,.55))}
.orb .o-blink{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s ease}
.orb.blink .o-blink{transform:scaleY(.12)}
.orb .o-look{transition:transform .35s var(--ease)}
.breath{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{translate:0 -1.4%}}
.hop{animation:hop .5s var(--ease)}
@keyframes hop{35%{translate:0 -6%}}

/* 쓰기 안내: 구 하나가 왜 필요한지 말한다 */
.guide{display:grid;grid-template-columns:78px minmax(0,1fr);gap:16px;align-items:start;margin:0 0 18px}
.g-orb{padding-top:4px}
.g-orb .sprite,.mini .sprite{width:150%;margin:-25% 0 -25% -25%}
.g-bub{position:relative;padding:13px 16px 14px;background:var(--pit);border:1px solid var(--hair-strong);border-radius:16px;animation:rise .45s var(--ease)}
.g-bub::before{content:'';position:absolute;left:-6px;top:24px;width:10px;height:10px;background:var(--pit);border-left:1px solid var(--hair-strong);border-bottom:1px solid var(--hair-strong);transform:rotate(45deg)}
.g-bub p{margin:0;font:400 15px/1.6 var(--sans);color:rgba(243,241,236,.92)}
.g-bub p b{font-weight:600;color:var(--paper)}
.g-tip{margin-top:8px !important;padding-top:8px;border-top:1px dashed var(--hair);font-size:13.5px !important;color:var(--soft) !important}
.g-tip:empty{display:none}
.g-tip.swap{animation:swap .35s var(--ease)}
.dlg .guide{grid-template-columns:64px minmax(0,1fr);margin:0}
.dlg .g-bub{background:#000}
.dlg .g-bub::before{background:#000}

/* ── 심사 무대: 발표자 구 하나, 뒷모습의 심사위원 구 셋 ── */
.stage{position:relative;aspect-ratio:16/9.4;overflow:hidden;border-radius:18px;background:#000;container-type:inline-size;container-name:stg;margin:0 -1%}
.scene{position:absolute;left:0;top:0;width:100%;aspect-ratio:16/10}
.lay{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.actor{position:absolute;inset:0;opacity:0;transform:translateY(1.6%);transition:opacity .6s ease,transform .8s var(--ease)}
.actor.in{opacity:1;transform:none}
.actor.breath{animation:breatheA 4.2s ease-in-out infinite}
@keyframes breatheA{50%{translate:0 -.35%}}
.actor.hop{animation:hopA .5s var(--ease)}
@keyframes hopA{35%{translate:0 -1.8%}}
.actor > .orb{position:absolute;aspect-ratio:1;height:auto}
/* 자리는 블렌더가 적은 그림/무대/자리.json 값이다(화면 비율, 구의 중심 ± 반지름) */
.presenter > .orb{left:30.602%;top:26.575%;width:12.802%}
.j0 > .orb{left:2.524%;top:63.522%;width:21.066%}
.j1 > .orb{left:38.27%;top:63.869%;width:21.174%}
.j2 > .orb{left:74.387%;top:64.219%;width:21.284%}
.jtag{position:absolute;translate:-50% 0;text-align:center;font:600 clamp(10px,1.2cqw,14px)/1 var(--sans);letter-spacing:.14em;color:rgba(243,241,236,.55);text-transform:uppercase}
.jtag small{display:block;margin-top:.45em;font-weight:400;font-size:1em;letter-spacing:0;text-transform:none;color:rgba(243,241,236,.4);white-space:nowrap}
@container stg (max-width:560px){.jtag small{display:none}}
.j0 .jtag{left:13.057%;top:86.4%}.j1 .jtag{left:48.857%;top:86.8%}.j2 .jtag{left:85.029%;top:87.2%}
.ez{position:absolute;left:60.9%;top:16.6%;width:9.5%;height:20.8%;padding:.9cqw 1cqw;color:#2a2826;display:flex;flex-direction:column;gap:.4cqw;overflow:hidden;mix-blend-mode:multiply;transform:perspective(40cqw) rotateX(5deg);transform-origin:50% 100%}
.ez .mono{font-size:clamp(7px,.85cqw,11px);color:#5d5a55}
.ez b{font:600 clamp(9px,1.32cqw,16px)/1.3 var(--serif)}
.ez i{display:block;height:max(1px,.16cqw);background:rgba(21,21,20,.14);margin-top:.5cqw}
.ez i:nth-of-type(2){width:86%}.ez i:nth-of-type(3){width:64%}
.ez.flip > *{animation:flip .45s var(--ease)}
@keyframes flip{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}
.ez.blank b{color:#9a968e}

/* 말풍선. 생각 중은 점 셋, 감탄은 메도우 테두리, 물음은 청금석 테두리 */
.sb{position:absolute;z-index:3;max-width:34%;padding:.6em .9em;background:rgba(12,12,11,.94);border:1px solid var(--hair-strong);border-radius:14px;font:500 clamp(11px,1.42cqw,16px)/1.4 var(--sans);color:var(--paper);white-space:nowrap;opacity:0;transform:translateY(8px) scale(.94);transition:opacity .22s ease,transform .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.sb.on{opacity:1;transform:none}
.sb.oh{border-color:rgba(125,180,90,.7)}
.sb.hmm{border-color:rgba(197,214,245,.6)}
.sb::after{content:'';position:absolute;width:.7em;height:.7em;background:inherit;border:inherit;border-top:0;border-left:0;transform:rotate(45deg)}
.sb-p{right:71%;top:21%}
.sb-p::after{right:-.42em;top:1em;transform:rotate(-45deg)}
.sb-j0,.sb-j1,.sb-j2{bottom:38.5%}
.sb-j0{left:3%}.sb-j1{left:48.86%;translate:-50% 0}.sb-j2{right:3%}
.sb-j0::after{left:2.2em;bottom:-.42em}.sb-j1::after{left:calc(50% - .35em);bottom:-.42em}.sb-j2::after{right:2.2em;bottom:-.42em}
.dots{display:inline-flex;gap:.28em;padding:.15em 0}
.dots i{width:.38em;height:.38em;border-radius:50%;background:var(--paper);opacity:.25;animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes dot{40%{opacity:1}}
.pd{position:absolute;inset:0;opacity:0;transform:translateY(4%);transition:opacity .25s ease,transform .55s cubic-bezier(.2,1.5,.4,1)}
.pd.on{opacity:1;transform:none}
.pd-n{position:absolute;aspect-ratio:1;mix-blend-mode:multiply;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 clamp(13px,3.1cqw,38px)/1 var(--mono);color:var(--sheet-ink);letter-spacing:-.02em}
.pd-n small{margin-top:.35em;font:600 clamp(7px,.9cqw,11px)/1 var(--sans);letter-spacing:.12em;color:#6b6a66;text-transform:uppercase}
.pd-n .up{margin-top:.3em;font:400 clamp(8px,1cqw,13px)/1 var(--mono);color:#4f8a32}
.pd0 .pd-n{left:6.448%;top:33.36%;width:10.884%}
.pd1 .pd-n{left:43.413%;top:33.556%;width:10.942%}
.pd2 .pd-n{left:80.775%;top:33.757%;width:11%}
.stot{position:absolute;left:50%;top:4%;translate:-50% 0;text-align:center;opacity:0;transform:scale(.88);transition:opacity .35s ease,transform .6s cubic-bezier(.2,1.4,.4,1)}
.stot.on{opacity:1;transform:none}
.stot b{display:block;font:200 clamp(34px,6.2cqw,76px)/1 var(--sans);letter-spacing:-.03em}
.stot small{display:block;margin-top:.35em;font:400 clamp(10px,1.15cqw,13px)/1.2 var(--sans);color:var(--soft)}
.stot .mono{color:var(--meadow-soft)}
.caption{min-height:1.6em;margin:14px 0 0;font:400 15px/1.55 var(--sans);color:rgba(243,241,236,.9)}
.caption b{font-weight:600;color:var(--paper)}
.caption.swap{animation:swap .35s var(--ease)}
.jgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:clamp(26px,4cqw,64px);margin-top:clamp(14px,2.4vh,26px);align-items:start}
.jgrid .panel{margin-top:16px}
.jgrid .i-go{margin-top:6px}
.stage-go{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;margin-top:14px}
.jc .st{display:block;margin-top:7px;font:400 12.5px/1.3 var(--sans);color:var(--soft)}
.jc.fin .st{color:var(--meadow-soft)}
.mini{display:inline-block;width:30px;vertical-align:middle;margin-right:10px}
.me{display:grid;grid-template-columns:auto auto;align-items:end;gap:18px}
.me .g-orb{width:clamp(70px,7cqw,96px);padding:0 0 6px}

/* 시안 조작 막대. 디자인의 일부가 아니다 */
#meta{position:fixed;right:14px;bottom:14px;opacity:.55;z-index:9;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;padding:5px;border-radius:22px;background:rgba(10,10,10,.86);border:1px solid var(--hair)}
#meta button{appearance:none;border:0;background:none;color:rgba(243,241,236,.7);font:400 12px/1 var(--sans);padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
#meta:hover{opacity:1}
#meta button:hover{color:var(--paper);background:rgba(243,241,236,.08)}

/* 좁은 창: 물음이 위, 종이는 그 아래. 표는 숫자 칸만 좁힌다 */
@container stage (max-width:820px){
  .top{align-items:flex-start}
  .show,.write,.res,.jgrid{grid-template-columns:minmax(0,1fr)}
  .ask{position:static;order:-1}
  .hero-art{margin:0 -6%}
  .bars{gap:4px}
  .bar span{font-size:10.5px}
  .pick{grid-template-columns:minmax(0,1fr);padding:6px 6px 10px;gap:8px}
  .th{width:100%}
  .p-t{padding:0 4px}
  .p-name{font-size:14px}
  .res-top{grid-template-columns:minmax(0,1fr);align-items:start}
  .fx-grid{grid-template-columns:minmax(0,1fr)}
  .rub-head,.rb{grid-template-columns:1fr repeat(3,44px);gap:6px}
  .panel{margin-top:-10px}
  .jc b{font-size:16px}
  .sc th{padding:0 3px 10px}
  .sc td{padding:12px 3px;font-size:15px}
  .avg i{display:none}
  .why{grid-template-columns:70px 22px minmax(0,1fr);gap:6px 8px}
  .guide{grid-template-columns:58px minmax(0,1fr);gap:12px}
  .stage{margin:0 -4%;border-radius:12px}
  .sb{white-space:normal;max-width:40%;font-size:11px}
  .sb-p{right:70%;top:12%}
  .jc .st{font-size:11.5px}
  .me{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .cas{opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>
<div id="stage">
  <header class="here">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><radialGradient id="hg" cx="34%" cy="30%" r="76%"><stop offset="0" stop-color="#F3F1EC" stop-opacity=".22"/><stop offset="1" stop-color="#F3F1EC" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="17" fill="#000"/><circle cx="20" cy="20" r="17" fill="url(#hg)" stroke="rgba(243,241,236,.6)" stroke-width="1"/><g><ellipse cx="16.4" cy="19" rx="1.5" ry="1.5" fill="#F3F1EC"/><ellipse cx="23.6" cy="19" rx="1.5" ry="1.5" fill="#F3F1EC"/></g></svg>
    <span class="here-name">SOLIO</span>
    <span class="here-step" id="step"></span>
    <button class="quiet" type="button" id="sound" aria-pressed="true">소리 켜짐</button>
  </header>
  <main id="room" aria-live="polite"></main>
</div>
<div id="layer"></div>
<nav id="meta" aria-label="시안 조작"><button type="button" id="m-reset">처음부터</button><button type="button" id="m-fill">예시 답 채우기</button><button type="button" id="m-narrow">좁은 창</button></nav>

<script>
'use strict';
/* ── 사업계획서 일곱 장. 정부 지원사업 표준 양식(문제 인식 · 실현 가능성 · 성장 전략 · 팀 구성)의 순서를 잇는다.
   예시는 지어낸 회사(동네 반찬 저녁 배송)다. 심사 결과도 이 예시 계획서로 보여 준다 ── */
const CH = [
  {no:'01', name:'문제 인식', short:'문제', what:'누가 어떤 불편을 겪나', q:'누가, 어떤 불편을 겪고 있나요?', hint:'숫자를 하나 넣으면 심사위원이 문제의 크기를 믿습니다.',
   ex:'동네 맞벌이 가구는 퇴근 뒤 저녁 준비에 하루 평균 50분을 씁니다. 동네 반찬가게는 저녁 7시면 문을 닫아, 늦게 퇴근하는 사람은 살 수 없습니다.'},
  {no:'02', name:'해결책', short:'해결', what:'그 불편을 어떻게 푸나', q:'그 불편을 어떻게 풀어 주나요?', hint:'고객이 실제로 겪게 될 하루를 적어 주세요.',

function eyesSVG(shape, k = 1, sk = 1) {
  const R = 50, X = 0.22 * R * sk, f = n => +n.toFixed(2);
  const pill = (cx, hh) => { const w = 0.05 * R * k, h = hh * k; return `<rect x="${f(cx - w)}" y="${f(-h)}" width="${f(2 * w)}" height="${f(2 * h)}" rx="${f(Math.min(w, h))}"/>`; };
  const arc = (cx, up) => { const r = 0.1 * R * k, dx = f(0.894 * r), y0 = f((up ? 0.015 : -0.015) * R * k), sw = f(0.028 * R * k);
    return `<path d="M${f(cx - dx)} ${y0} A${f(r)} ${f(r)} 0 0 ${up ? 1 : 0} ${f(cx + dx)} ${y0}" fill="none" stroke-width="${sw}"/>`; };
  const dash = cx => { const w = 0.056 * R * k, h = 0.013 * R * k; return `<rect x="${f(cx - w)}" y="${f(-h)}" width="${f(2 * w)}" height="${f(2 * h)}" rx="${f(h)}"/>`; };
  const one = cx => shape === 'smile' ? arc(cx, true) : shape === 'sleep' ? arc(cx, false) : shape === 'sorry' ? dash(cx)
    : pill(cx, R * (shape === 'half' ? 0.057 : shape === 'shut' ? 0.012 : 0.094));
  return one(-X) + one(X);
}

function startJudging() {
  stopTimers();
  if (planSkipped && !ans.some(Boolean)) { renderEmpty(true); return; }
  mode = 'judge'; setStep('처음 시작 · 3 / 3 · 첫 업무');

  const again = prevJudged != null, b = board(judged), prevB = again ? board(prevJudged) : null;
  room.innerHTML = `<div class="top"><div><p class="chips"><b>${esc(TEAMS[team].name)} 팀</b> · 사무실의 첫 업무</p>`

  const prEl = document.getElementById('pr'), P = makeOrb(prEl), J = JUDGES.map((_, k) => makeOrb(document.getElementById('jd' + k)));
  const drop = k => CRIT.forEach((c, i) => setTimeout(() => {
    const el = room.querySelector(`[data-sl="${i}-${k}"]`); if (!el) return;
    const v = b.rows[i].pts[k], up = prevB && v > prevB.rows[i].pts[k];
    el.textContent = v; el.classList.add('in'); if (up) el.classList.add('up');
  }, still ? 0 : i * 80));

  let t = 250;
  cap('심사위원들이 자리에 앉습니다.');
  JUDGES.forEach((_, k) => at(t + k * 380, () => { document.getElementById('jd' + k).classList.add('in'); play('sit'); setStatus(k, again ? '다시 듣는 중' : '듣는 중'); }));
  t += 1500;
  at(t, () => {
    prEl.classList.add('in'); setTimeout(() => prEl.classList.add('breath'), 900);
    P.mood('nervous'); play('sit'); bubble('p', again ? '고친 곳을 다시 보여 드릴게요!' : '떨려요… 잘 부탁드립니다!');
    cap('<b>대표님</b>이 발표를 시작합니다.');
  });

  const list = again ? [...judged].filter(f => !prevJudged.has(f)).flatMap(f => REACT2[f]).sort((x, y) => x.ch - y.ch) : REACT1;

      bubble('j' + r.j, esc(r.t), r.k); play(r.k); J[r.j].hop();

    st.classList.add('on'); play('chime');

    const h1 = room.querySelector('.top .say');

/* 결과: 큰 숫자 하나(평균)와 가장 약한 항목 → 항목별 점수표 → 최종 솔루션 */
function renderResult(anim) {
  stopTimers(); mode = 'result'; setStep('처음 시작 · 3 / 3 · 심사 결과');
  const b = board(judged), prevB = prevJudged ? board(prevJudged) : null;
  const again = !!prevB;
  let head, sub;
  if (!again) {
    head = `${b.weak.c.name}${이(b.weak.c.name)} 가장 약합니다.`;
    sub = '1장과 3장의 숫자에 출처가 없습니다.\n아래 셋을 고친 뒤 다시 심사받으세요.';
  } else {
    const gains = b.rows.map((r, i) => ({r, g:r.avg - prevB.rows[i].avg})).sort((x, y) => y.g - x.g);
    head = b.total > prevB.total + .04 ? `${f1(prevB.total)}점에서 ${f1(b.total)}점으로 올랐습니다.` : '점수가 그대로입니다.';
    sub = (gains[0].g > .04 ? `가장 많이 오른 것은 ${gains[0].r.c.name}입니다.\n` : '') + `지금 가장 약한 것은 ${b.weak.c.name}입니다.`;
  }
  const dT = again ? b.total - prevB.total : 0;
  room.innerHTML = `<section class="res-top"><div class="me"><div class="g-orb breath" id="gorb">${spriteHTML()}</div><div class="total"><span class="lab">세 심사위원 평균</span><div class="total-n">${f1(b.total)}<small>/ 5</small></div>`
    + (again && Math.abs(dT) > .04 ? `<span class="total-d">${dT > 0 ? '+' : ''}${f1(dT)}</span>` : '') + `</div></div>`
    + `<div>${say(head, sub, anim)}<div class="res-acts"><button class="go main" type="button" data-tofix>${again ? '최종 솔루션 보기' : '먼저 고칠 셋 보기'}</button><button class="quiet" type="button" data-plan>심사한 계획서 보기</button></div></div></section>`
    + `<section class="res"><div><div class="rub-top"><h3 class="res-h">항목별 점수 · 항목을 누르면 까닭과 근거 문장</h3></div>${tableHTML(b, prevB)}</div>`
    + `<div class="jside"><h3 class="res-h">심사위원 셋의 한 줄</h3>`
    + JUDGES.map((j, k) => {
        const line = judged.has(j.fix) ? j.say2 : j.say;
        return `<div class="verdict"><span class="who"><span class="mini">${spriteHTML()}</span><span class="mono">심사위원 ${j.no}</span>${j.name}<small>${j.co} · ${j.eye}</small></span><span class="g mono">${f1(avgOf(b, k))}</span><p>${esc(line)}</p></div>`;
      }).join('') + `</div></section>`
    + `<section class="fixes" id="fixes">${fixesHTML(b)}</section>`
    + `<p class="fine">연습 심사입니다. 실제 지원사업의 결과를 미리 알려 주지 않습니다. 심사는 고르신 팀의 구독 사용량을 씁니다.</p>`;
  mountGuide(again && dT > .04 ? 'happy' : 'firm');
  if (again && dT > .04 && anim) guide.hop();
}
function tableHTML(b, prevB) {
  return `<table class="sc"><thead><tr><th>항목</th>${JUDGES.map(j => `<th><span class="mono">심사위원 ${j.no}</span><b>${j.name}</b></th>`).join('')}<th>평균</th></tr></thead><tbody>`
    + b.rows.map((r, i) => {
      const weak = r === b.weak, split = r.spread >= 2, open = openRow === r.c.id;
      const was = prevB?.rows[i];
      const tags = (weak ? '<span class="tag weak">가장 약함</span>' : '') + (split ? '<span class="tag split">의견이 갈림</span>' : '') + (was && r.avg > was.avg + .04 ? '<span class="tag fixed">고친 뒤 오름</span>' : '');
      let h = `<tr class="${weak ? 'weak' : ''}${open ? ' open' : ''}"><td><button class="crit" type="button" data-row="${r.c.id}" aria-expanded="${open}"><span class="chev">›</span><b>${esc(r.c.name)}</b>${tags}</button></td>`
        + r.pts.map((p, k) => `<td>${p}${was && p > was.pts[k] ? `<span class="d">+${p - was.pts[k]}</span>` : ''}</td>`).join('')
        + `<td><span class="avg"><span class="mono">${f1(r.avg)}</span><i style="--w:${r.avg / 5 * 100}%"></i></span></td></tr>`;
      if (open) {
        h +=`<tr class="more"><td colspan="5">${JUDGES.map(j => {
          const e = entry(r.c.id, j.id, judged);
          return `<div class="why"><span class="who">${j.name}<small>${j.eye}</small></span><span class="pt">${e[0]}</span><div><p>${esc(e[1])}</p><div class="qs"><span class="mono">${CH[e[2]].no} ${esc(CH[e[2]].name)}</span><span>${esc(e[3])}</span></div></div></div>`;
        }).join('')}</td></tr>`;
      }
      return h;
    }).join('') + `</tbody></table>`;
}
function fixesHTML(b) {
  const all = FIX.every(f => fixed[f.id]), any = FIX.some(f => fixed[f.id]);
  const pending = FIX.some(f => fixed[f.id] && !judged.has(f.id));
  const cur = FIX.find(f => !fixed[f.id])?.id;
  const t = planText(fixedSet());
  const closed = all && !pending;
  return closed
    ? `<h2>최종 솔루션 · 셋을 고쳤습니다</h2><p>다음에 고칠 곳은 ${esc(b.weak.c.name)}입니다. ${esc(NEXT[b.weak.c.id] || '')} 기획부에서 언제든 이어서 고치고 다시 심사받을 수 있습니다.</p>`
    + `<div class="fx-grid">${FIX.map(f => fixCard(f, b, false, t)).join('')}</div>` + resGo(all, any, pending, cur)
    : `<h2>최종 솔루션 · 먼저 고칠 셋</h2><p>점수가 낮은 까닭을 계획서 문장에서 찾았습니다. 고친 뒤 다시 심사받으면 바뀐 점수를 보여 드립니다.</p>`
    + `<div class="fx-grid">${FIX.map(f => fixCard(f, b, f.id === cur, t)).join('')}</div>` + resGo(all, any, pending, cur);
}
function resGo(all, any, pending, cur) {
  return `<div class="res-go"><button class="go${all && pending ? ' main' : ''}" type="button" data-rejudge ${pending ? '' : 'disabled'}>다시 심사받기</button>`
    + `<button class="${!cur && !pending ? 'go main' : 'quiet'}" type="button" data-toend>사무실로 가기</button>`
    + (any && !pending ? '<span class="lab">고친 곳은 모두 다시 심사했습니다.</span>' : pending ? '<span class="lab">고친 곳이 아직 점수에 들어가지 않았습니다.</span>' : '') + `</div>`;
}
const NEXT = {trust:'설문 62명은 작아서, 더 넓게 물어본 숫자가 있으면 오릅니다.', money:'배송 한 번을 1,800원 안에 할 수 있는지 보이면 오릅니다.'};
function fixCard(f, b, isCur, t) {
  const row = b.rows.find(r => r.c.id === f.crit), weak = row === b.weak, split = row.spread >= 2;
  const st = fixed[f.id] ? 'done' : (fx[f.id] || 'idle');
  const tag = fixed[f.id] ? (judged.has(f.id) ? `<span class="tag fixed">${esc(row.c.name)} · 고친 뒤 ${f1(row.avg)}점</span>` : `<span class="tag fixed">${esc(row.c.name)} · 고쳤습니다</span>`)
    : `<span class="tag ${weak ? 'weak' : split ? 'split' : ''}">${esc(row.c.name)}${weak ? ' · 가장 약함' : split ? ' · 의견이 갈림' : ''} · ${f1(row.avg)}점</span>`;
  const qs = (list, fresh) => list.map(([i, q]) => `<div class="qs${fresh ? ' fresh' : ''}"><span class="mono">${CH[i].no} ${esc(CH[i].name)}</span><span>${esc(q)}</span></div>`).join('');
  let act = '';
  if (st === 'done') {
    const after = f.id === 'src' ? qs([[0, t[0].match(/하루 평균 50분을 씁니다\([^)]*\)/)[0]], [2, t[2].match(/약 4,200세대입니다\([^)]*\)/)[0]]], true)
      : f.id === 'crew' ? qs([[6, CREW_OPTS[crewPick]]], true) : qs([[4, MONEY_LINE]], true);
    act = `<span class="okline">계획서에 넣었습니다</span>${after}<div class="row"><button class="quiet" type="button" data-undo="${f.id}">되돌리기</button></div>`;
  } else if (f.id === 'src' && st === 'open') {
    act = `<div class="src"><label for="s0">1장 「하루 평균 50분」의 출처</label><input id="s0" data-src="0" value="${esc(srcVals[0])}"></div>`
      + `<div class="src"><label for="s1">3장 「약 4,200세대」의 출처</label><input id="s1" data-src="1" value="${esc(srcVals[1])}"></div>`
      + `<div class="row"><button class="go sm main" type="button" data-apply="src">계획서에 넣기</button><button class="quiet" type="button" data-close="src">닫기</button></div>`;
  } else if (f.id === 'crew' && (st === 'open' || st === 'draft')) {
    act = `<p class="fx-q">배송은 누가 하나요?</p>${CREW_OPTS.map((o, i) => `<button class="opt2" type="button" data-crew="${i}" aria-pressed="${crewPick === i}">${esc(o.replace(/^배송은 /, '').replace(/\.$/, ''))}</button>`).join('')}`
      + (st === 'draft' ? `<div class="qs fresh"><span class="mono">07 넣을 문장</span><span>${esc(CREW_OPTS[crewPick])}</span></div><div class="row"><button class="go sm main" type="button" data-apply="crew">7장에 넣기</button></div>` : `<div class="row"><button class="quiet" type="button" data-close="crew">닫기</button></div>`);
  } else if (f.id === 'money' && st === 'working') {
    act = `<div class="work" style="--t:3.2s">기획부 직원이 계획서의 숫자로 셈하고 있습니다.<i></i></div>`;
  } else if (f.id === 'money' && st === 'draft') {
    act = `<p class="calc"><b>120,000원 × 30%</b> = 36,000원<br><b>한 주 5번 × 4주</b> = 20번<br><b>36,000원 ÷ 20번</b> = 1,800원</p>`
      + `<div class="qs fresh"><span class="mono">05 넣을 문장</span><span>${esc(MONEY_LINE)}</span></div>`
      + `<p class="fine">계획서에 있는 숫자(월 12만 원, 30%, 한 주 다섯 번)로만 셈했습니다. 셈은 솔리오가 다시 확인했습니다.</p>`
      + `<div class="row"><button class="go sm main" type="button" data-apply="money">5장에 넣기</button></div>`;
  } else {
    act = `<div class="row"><button class="go sm${isCur ? ' main' : ''}" type="button" data-open="${f.id}">${esc(f.btn)}</button></div>`;
  }
  return `<article class="fx${st === 'done' ? ' done' : isCur ? ' cur' : ''}" data-fx="${f.id}">${tag}<h3>${esc(f.title)}</h3>`
    + (st === 'done' ? '' : qs(f.quotes) + `<p class="whyl">${esc(f.why)}</p>`) + `<div class="fx-act">${act}</div></article>`;
}
function refreshFixes() {
  const b = board(judged), box = document.getElementById('fixes');
  if (box) box.innerHTML = fixesHTML(b);
}
function openPlan() {
  dialog = 'plan';
  const t = planText(fixedSet());
  layer.innerHTML = `<div class="veil" data-veil><div class="dlg wide" role="dialog" aria-modal="true" aria-label="심사한 계획서">`
    + sheetHTML(t, {example:true, title:'오늘반찬 사업계획서', sub:'시안의 예시 계획서입니다. 받아들인 고침이 들어 있습니다.'})
    + `<div class="ask-go"><button class="go main" type="button" data-closedlg>닫기</button></div></div></div>`;
  layer.querySelector('[data-closedlg]').focus();
}

function renderEnd(anim) {
  stopTimers(); mode = 'end'; setStep('사무실');
  const done = judged ? board(judged) : null;
  room.innerHTML = `<div class="top"><div>${say('사무실이 열렸습니다.', done ? '사업계획서와 심사 결과는 기획부에 있습니다.\n계획서를 고칠 때마다 다시 심사받을 수 있습니다.' : '사업계획서는 기획부에서 기다립니다.\n다음에 편하실 때 이어서 써 주세요.', anim)}</div></div>`
    + `<section class="show"><div class="hero-art" role="img" aria-label="${esc(ART.write[1])}"><img class="on" src="${ART.write[0]}" alt="" decoding="async"><div class="hero-eyes" id="heyes">${orbSVG()}</div></div>`
    + `<div class="info in"><p class="i-no">기획부</p><ul class="endlist" style="margin-top:14px">`
    + `<li><span><b>사업계획서 초안</b><small>${done ? '받아들인 고침 ' + fixedSet().size + '개' : '비어 있음'}</small></span><span class="mono">${ans.filter(Boolean).length} / 7장</span></li>`
    + (done ? `<li><span><b>사업계획서 심사</b><small>${prevJudged ? '두 번 받았습니다' : '한 번 받았습니다'}</small></span><span class="mono">${f1(done.total)} / 5</span></li>` : '')
    + `</ul><div class="i-go"><button class="go" type="button" data-reset>처음부터 다시 보기</button></div></div></section>`;
  makeOrb(document.getElementById('heyes')).mood('happy');
}

/* ── 누름 ── */
room.addEventListener('input', e => {
  if (e.target.id === 'ans') {
    const v = e.target.value;
    document.getElementById('count').textContent = v.length + '자';
    const lv = document.getElementById('live'), ls = document.getElementById('liveslot');
    if (lv) { lv.textContent = v; ls.hidden = !!v.trim(); }
    const ex = document.getElementById('ex');
    if (ex && !ex.dataset.open) ex.classList.toggle('fold', !!v.trim());
    room.querySelector('[data-next]').disabled = !v.trim();
    if (guide && guide.cur !== 'sad') { const [m, t] = coach(v); if (m !== guide.cur) guide.mood(m); setTip(t); }
  }
  if (e.target.dataset.src != null) srcVals[+e.target.dataset.src] = e.target.value;
});
room.addEventListener('keydown', e => { if (e.target.id === 'ans' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); } });
room.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if ('begin' in d) { qi = ans.findIndex((a, i) => !a && !skipped.has(i)); if (qi < 0) qi = 0; renderQ(true); }
  else if ('skipall' in d) openSkipDialog(false);
  else if ('next' in d) commit();
  else if ('skip1' in d) skipOne();
  else if ('ex' in d) { const ex = document.getElementById('ex'); ex.dataset.open = '1'; ex.classList.remove('fold'); }
  else if ('prev' in d) { const v = document.getElementById('ans').value.trim(); if (v) ans[qi] = v; qi--; leftNote = ''; renderQ(true); }
  else if (d.go != null) { const v = document.getElementById('ans')?.value.trim(); if (mode === 'q' && v) ans[qi] = v; qi = +d.go; leftNote = ''; renderQ(true); }
  else if ('toteam' in d) { renderTeam(true); scrollTo({top:0}); }
  else if (d.team) { team = d.team; renderTeam(false); }
  else if ('backWrite' in d) { ans.some(Boolean) ? renderDone(true) : renderIntro(true); }
  else if ('startteam' in d) { scrollTo({top:0}); startJudging(); }
  else if ('anchors' in d) { anchors = !anchors; document.getElementById('rubric').classList.toggle('anchors', anchors); b.textContent = anchors ? '채점 기준 접기' : '채점 기준 보기'; }
  else if (d.row) { openRow = openRow === d.row ? null : d.row; const b2 = board(judged), p2 = prevJudged ? board(prevJudged) : null; room.querySelector('table.sc').outerHTML = tableHTML(b2, p2); }
  else if (d.open) { const f = d.open; if (f === 'money') { fx.money = 'working'; refreshFixes(); workT = setTimeout(() => { fx.money = 'draft'; refreshFixes(); }, still ? 0 : 3300); } else { fx[f] = 'open'; refreshFixes(); room.querySelector(f === 'src' ? '#s0' : '[data-crew]')?.focus(); } }
  else if (d.close) { fx[d.close] = 'idle'; refreshFixes(); }
  else if (d.crew != null) { crewPick = +d.crew; fx.crew = 'draft'; refreshFixes(); }
  else if (d.apply) { fixed[d.apply] = true; fx[d.apply] = 'idle'; refreshFixes(); }
  else if (d.undo) { fixed[d.undo] = false; fx[d.undo] = 'idle'; refreshFixes(); }
  else if ('rejudge' in d) { scrollTo({top:0}); startJudging(); }
  else if ('toresult' in d) { renderResult(true); scrollTo({top:0}); }
  else if ('tofix' in d) document.getElementById('fixes')?.scrollIntoView({behavior:still ? 'auto' : 'smooth', block:'start'});
  else if ('plan' in d) openPlan();
  else if ('toend' in d) { renderEnd(true); scrollTo({top:0}); }
  else if ('writenow' in d) { planSkipped = false; renderIntro(true); }
  else if ('usefile' in d) { ans = CH.map(c => c.ex); skipped.clear(); planSkipped = false; startJudging(); }
  else if ('reset' in d) reset();
});
layer.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) { if (e.target.dataset.veil != null && dialog === 'plan') closeDialog(); return; }
  if ('keep' in b.dataset) { closeDialog(); if (mode !== 'q') { qi = Math.max(0, ans.findIndex((a, i) => !a)); renderQ(true); } else document.getElementById('ans')?.focus(); }
  else if ('later' in b.dataset) { closeDialog(); planSkipped = !ans.some(Boolean); leftNote = ''; renderTeam(true); scrollTo({top:0}); }
  else if ('closedlg' in b.dataset) closeDialog();
});
addEventListener('keydown', e => { if (e.key === 'Escape' && dialog) closeDialog(); });

function reset() {
  stopTimers(); closeDialog();
  mode = 'intro'; qi = 0; ans = Array(7).fill(''); skipped = new Set(); leftNote = ''; planSkipped = false;
  team = 'claude'; round = 0; judged = null; prevJudged = null; openRow = 'trust'; anchors = false;
  fixed = {}; fx = {}; srcVals = SRC_DEFAULT.slice(); crewPick = null;
  renderIntro(true); scrollTo({top:0});
}
document.getElementById('m-reset').onclick = reset;
document.getElementById('sound').onclick = e => { soundOn = !soundOn; e.target.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐'; e.target.setAttribute('aria-pressed', soundOn); if (soundOn) play('land'); };
document.getElementById('m-fill').onclick = () => {
  ans = CH.map(c => c.ex); skipped.clear(); planSkipped = false;
  if (mode === 'q') renderQ(false); else if (mode === 'intro' || mode === 'done') renderDone(false);
};
document.getElementById('m-narrow').onclick = e => { const on = document.body.classList.toggle('narrow'); e.target.textContent = on ? '넓은 창' : '좁은 창'; };

/* 주소 끝으로 바로 연다(캡처용): #q-3 물음, #skip 건너뛰기 물음, #done 쓰기 끝, #team 팀, #judge 심사 중,
   #result 결과, #fix-crew 같이 쓰기를 연 결과, #again 셋을 고치고 다시 심사한 결과, #empty 비운 채 온 첫 업무, #end 사무실 */
(function route() {
  const h = location.hash.slice(1), full = () => { ans = CH.map(c => c.ex); skipped.clear(); };
  const m = h.match(/^q-(\d)$/);
  if (m) { qi = Math.min(6, +m[1] - 1); for (let i = 0; i < qi; i++) ans[i] = CH[i].ex; if (qi > 3) { ans[3] = ''; skipped.add(3); } renderQ(true); }
  else if (h === 'skip') { renderIntro(false); openSkipDialog(false); }
  else if (h === 'done') { full(); ans[3] = ''; skipped.add(3); renderDone(true); }
  else if (h === 'team') { full(); renderTeam(true); }
  else if (h === 'judge') { full(); startJudging(); }
  else if (h === 'result' || h === 'fix-crew' || h === 'fix-money') {
    full(); judged = new Set();
    if (h === 'fix-crew') { fx.crew = 'draft'; crewPick = 0; }
    if (h === 'fix-money') { fx.money = 'draft'; openRow = 'real'; }
    renderResult(false);
  }
  else if (h === 'again') { full(); crewPick = 0; prevJudged = new Set(); fixed = {src:true, crew:true, money:true}; judged = fixedSet(); openRow = 'real'; renderResult(false); }
  else if (h === 'empty') { planSkipped = true; renderEmpty(true); }
  else if (h === 'end') { full(); judged = new Set(); renderEnd(true); }
  else renderIntro(true);
})();
</script>
</body>
</html>

<title>강사 빨랫줄 시안 — SYNK SHIFT</title>
<!-- synk.im/shift 강사 마디 — 다시 짓기(2026-11-19). 유호님 「지금 빨래줄 아이디어만 좋고 나머지는 아직 너무 조잡해. 최대한 줄이고 강조할부분만 디자인시안 참고해서」.
     컨셉: 강사는 줄에 걸린 명찰이다. 한 장을 뒤집으면 그 사람이 맡는 강의와 문의가 나온다.
     강조 순위: ① 줄에 매달린 강사 카드 다섯 장(얼굴 창과 이름) ② 두 톤 제목 · 뒤집힌 뒷면의 맡는 강의 ③ 물러설 것: 구석의 작은 정보, 예시 표시, 모집 글.
     참고: Recent 「Team Profile Cards」(줄에 매단 팀원 카드, 흰 바탕, 3D 인물, 무지갯빛 뒷면)와 유호님이 만족하신 LAB 줄 무대(만족 사례 S56)의 줄 · 은색 집게 · 두께 있는 카드 · 효과음.
     순간: 카드가 위에서 떨어져 집게가 줄을 문다(집게 소리) → 손을 올리면 카드가 손 쪽으로 돌아본다(스침) → 누르면 뒤집힌다(뒤집기) → 잡아 끌면 흔들린다(바람). 처음 한 번은 손이 먼저 눌러 보인다. -->

<style>

.ts-wall{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#FFFFFF 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,var(--bg) 55%,var(--bg-lo) 100%)}

.ts-cord{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.ts-side.is-t{top:calc(var(--ct) / -2);transform:rotateX(90deg)}
.ts-side.is-b{bottom:calc(var(--ct) / -2);transform:rotateX(-90deg)}
.ts-gloss{position:absolute;inset:0;pointer-events:none;border-radius:inherit;mix-blend-mode:soft-light;background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,0) 60%);background-size:260% 100%;background-position:calc(50% + var(--g,0) * 120%) 0}

/* 앞면: 작은 머리 줄, 얼굴 창, 이름과 하는 일, 아래 줄 */

.ts-back>*{position:relative;z-index:1}

.ts-bwho img{width:calc(var(--cw) * .16);height:calc(var(--cw) * .16);border-radius:50%;object-fit:cover;background:var(--tone)}
.ts-bwho b{font-size:calc(var(--cw) * .078);font-weight:700;letter-spacing:-.03em}
.ts-btag{padding:calc(var(--cw) * .07) calc(var(--cw) * .06) 0;font-size:calc(var(--cw) * .046);font-weight:700;letter-spacing:.04em;color:rgba(23,23,26,.55)}
.ts-lecs{list-style:none;margin:calc(var(--cw) * .05) calc(var(--cw) * .06) 0;border-top:1px solid rgba(23,23,26,.14)}

.ts-pin-b{position:absolute;left:5px;right:5px;top:0;height:10px;border:2px solid var(--metal-lo);border-bottom:0;border-radius:6px 6px 0 0;transform-origin:50% 100%;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}

.ts-shadow{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:16px;background:rgba(40,40,70,.075);filter:blur(18px);pointer-events:none;transform-origin:50% 0}

/* 처음 한 번: 손이 먼저 눌러 보이고, 할 일을 한 문장으로 */
.ts-hand{position:absolute;left:0;top:0;z-index:9;width:44px;height:52px;margin:-5px 0 0 -21px;pointer-events:none;opacity:0;transform-origin:21px 5px;filter:drop-shadow(0 8px 10px rgba(20,20,40,.32))}

.ts-tip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 4px rgba(47,95,208,.3)}

/* 아래 구석: 물러설 말 */
.ts-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 var(--gut) 26px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
.ts-foot-l{display:inline-flex;align-items:center;gap:12px}
.ts-foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:1px}

@media (max-width:760px){
  :root{--cw:136px;--gut:20px}
  .ts{min-height:0}
  .ts-head{grid-template-columns:1fr;gap:14px}
  .ts-title{font-size:clamp(34px,10vw,44px)}
  .ts-aside{padding-bottom:0}
  .ts-line{height:calc(var(--ch) + 132px)}
  .ts-pin{top:-12px;width:22px;height:18px;margin-left:-11px}
  .ts-pin-a{height:13px}
  .ts-pin-b{left:4px;right:4px;height:8px}
  .ts-foot{flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:30px}
  .ts-head{padding-top:32px}
}
@media (prefers-reduced-motion:reduce){.ts-in,.ts-pin-b{transition:none}}
</style>

  const 강사 = [
    { id: 'yuho', nm: '양유호', real: true, rl: 'AI로 회사 하나를 돌리는 창업자', one: '', tone: '#CFE2F6', img: '{{P_yuho}}', lec: [1, 3, 4, 5] },
    { id: 'a', nm: '한서윤', rl: '공공기관 문서를 써 온 행정직', one: '공무원 반에서 양식에 맞춘 문서 수업을 맡습니다.', tone: '#F6E4A6', img: '{{P_a}}', lec: [2, 7] },
    { id: 'b', nm: '박도현', rl: '동네 가게 홍보를 맡아 온 마케터', one: '상인회와 소상공인 반을 맡습니다. 실습은 그 가게의 메뉴와 사진으로 합니다.', tone: '#F7D2C8', img: '{{P_b}}', lec: [6] },
    { id: 'c', nm: '이하은', rl: '고등학교 진로 교사 출신', one: '학교 반을 맡습니다. 학생마다 관심 분야로 진로 한 장을 씁니다.', tone: '#CDEBDC', img: '{{P_c}}', lec: [7] },
    { id: 'd', nm: '최민재', rl: '작은 회사의 반복 업무를 줄여 온 운영자', one: '직원이 적은 회사의 워크숍을 맡습니다.', tone: '#DED7F3', img: '{{P_d}}', lec: [3, 4] },
  ];

  /* ── 소리: 동작마다 다른 효과음(LAB 줄 무대와 같은 소리) ── */
  const SND = { hover: { f: '{{S_hover}}', g: 0.28, vary: 0.12 }, press: { f: '{{S_press}}', g: 0.7, vary: 0.06 }, flip: { f: '{{S_flip}}', g: 0.62, vary: 0.08 }, clipopen: { f: '{{S_clipopen}}', g: 0.7, vary: 0.08 }, clipsnap: { f: '{{S_clipsnap}}', g: 0.9, vary: 0.08 }, whoosh: { f: '{{S_whoosh}}', g: 0.26, vary: 0.1 }, pop: { f: '{{S_pop}}', g: 0.5 } };
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null, master = null, soundOn = true; const bufs = {};
  window.__snd = [];
  try { soundOn = localStorage.getItem('synk-shift-sound') !== 'off'; } catch { /* 기억 못 해도 켠다 */ }
  const loadAudio = () => {
    if (ac || !AC) return;
    ac = new AC(); master = ac.createGain(); const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; master.connect(comp).connect(ac.destination);
    for (const [k, s] of Object.entries(SND)) fetch(s.f).then((r) => r.arrayBuffer()).then((b) => ac.decodeAudioData(b)).then((d) => { bufs[k] = d; }).catch(() => {});
  };
  const play = (k, { g = 1, rate = 1, delay = 0 } = {}) => {
    if (!soundOn) return;
    const s = SND[k], r = rate * (1 + (Math.random() - 0.5) * (s.vary || 0));
    window.__snd.push({ t: Date.now() + delay * 1000, k, g: s.g * g, r });
    if (!ac || !bufs[k]) return;
    const src = ac.createBufferSource(); src.buffer = bufs[k]; src.playbackRate.value = r;
    const gn = ac.createGain(); gn.gain.value = s.g * g; src.connect(gn).connect(master); src.start(ac.currentTime + delay);
  };
  const paintSound = () => { soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.querySelector('span').textContent = soundOn ? '소리 켬' : '소리 꺼짐'; };
  root.addEventListener('pointerdown', () => { loadAudio(); ac?.resume(); }, { capture: true });
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('synk-shift-sound', soundOn ? 'on' : 'off'); } catch { /* 이번만 */ } paintSound(); if (soundOn) { loadAudio(); ac?.resume(); play('pop'); } });
  paintSound();

  /* ── 카드 ── */
  const cards = [];
  const make = (p, i) => {
    const el = document.createElement('div'); el.className = 'ts-card'; el.tabIndex = 0; el.setAttribute('role', 'listitem');
    el.setAttribute('aria-label', `${p.nm}${p.real ? '' : ' (예시 강사)'}. 누르면 맡는 강의를 봅니다`);
    const no = String(i + 1).padStart(2, '0');
    const lis = p.lec.map((n) => `<li><div><b>${강의[n][0]}</b><small>${강의[n][2]}</small></div><span>${강의[n][1]}</span></li>`).join('');
    const ask = p.real
      ? `<a href="mailto:hello@synk.im?subject=${encodeURIComponent('[강사 문의] ' + p.nm)}">${p.nm} 강사에게 문의<i class="ts-go">→</i></a>`
      : `<a class="is-line" href="mailto:hello@synk.im?subject=${encodeURIComponent('[강의 문의]')}">SHIFT에 강의 문의<i class="ts-go">→</i></a>`;
    el.innerHTML = '<div class="ts-in"><div class="ts-box"><div class="ts-flip">'
      + `<div class="ts-face ts-front"><div class="ts-top"><span class="${p.real ? '' : 'ex'}">${p.real ? 'SHIFT · 강사' : '예시 강사'}</span><span>${no}</span></div>`
      + `<div class="ts-pic" style="--tone:${p.tone}"><img src="${p.img}" alt="" draggable="false"></div>`
      + `<p class="ts-nm">${p.nm}</p><p class="ts-rl">${p.rl}</p>`
      + '<div class="ts-bot"><span>맡는 강의 보기</span><i class="ts-go">→</i></div><i class="ts-gloss"></i></div>'
      + `<div class="ts-face ts-back" aria-hidden="true"><div class="ts-top"><span>${p.real ? '' : '예시 강사 · '}${p.nm} · 맡는 강의</span><span>${no}</span></div>`
      + `<ol class="ts-lecs">${lis}</ol>${p.one ? `<p class="ts-one">${p.one}</p>` : ''}<div class="ts-bot">${ask}</div><i class="ts-gloss"></i></div>`
      + '<i class="ts-side is-l"></i><i class="ts-side is-r"></i><i class="ts-side is-t"></i><i class="ts-side is-b"></i></div>'
      + '<span class="ts-pin" aria-hidden="true"><i class="ts-pin-b"></i><i class="ts-pin-a"></i></span></div></div>';
    const sh = document.createElement('div'); sh.className = 'ts-shadow'; sh.setAttribute('aria-hidden', 'true');
    layer.append(sh, el);
    const c = { p, el, sh, box: $('.ts-box', el), flip: $('.ts-flip', el), back: $('.ts-back', el), front: $('.ts-front', el), i,
      x: 0, y: -600, th: 0, w: 0, s: 1, op: 0, home: 'fly', grab: false, vx: 0, px: 0, dip: 0, dipV: 0, ps: 0, pv: 0, pt: 0, fx: 0, fv: 0, ft: 0, turned: false };
    gsap.set(c.flip, { rotationY: 0, transformPerspective: 900 });
    bind(c); cards.push(c); return c;
  };

  /* ── 줄: 양 끝 못에서 처지고, 카드마다 그 무게만큼 더 처지고, 부딪히면 떨린다 ── */
  let W = 0, H = 0, CY = 70, SAG = 18, CW = 220, CH = 320, narrow = false;
  const wave = { a: 0, v: 0, x: 0 }, SIG2 = 2 * 95 * 95;
  const baseY = (x) => { const u = clamp((x + 20) / (W + 40), 0, 1); return CY + SAG * 4 * u * (1 - u); };
  const cordY = (x) => { let y = baseY(x); for (const c of cards) if (c.dip) { const d = x - c.x; y += c.dip * Math.exp(-(d * d) / SIG2); } return y + wave.a * Math.sin(x / 38) * Math.exp(-Math.abs(x - wave.x) / 420); };
  const kick = (x, v) => { wave.x = x; wave.v += v; };
  let slotX = [];
  const layout = () => {
    narrow = narrowMQ.matches;
    const probe = cards[0]?.el; CW = probe ? probe.offsetWidth : 220; CH = probe ? probe.offsetHeight : 320;
    const gut = parseFloat(getComputedStyle($('.ts-head', root)).paddingLeft) || 20;
    const gap = narrow ? 14 : 30, need = gut * 2 + 강사.length * CW + (강사.length - 1) * gap;
    line.style.width = Math.max(scroller.clientWidth, need) + 'px';
    W = line.clientWidth; H = line.clientHeight; CY = narrow ? 52 : 70; SAG = narrow ? 10 : 20;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const a = gut + CW / 2 + (narrow ? 6 : 0), b = W - gut - CW / 2;
    slotX = 강사.map((_, i) => a + (b - a) * (i / (강사.length - 1)));
    for (const c of cards) if (c.home === 'line') c.x = c.px = slotX[c.i];
  };

  /* ── 움직임: 카드마다 진자, 줄은 용수철 ── */
  let last = performance.now(), visible = true;
  const tick = (now) => {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    wave.v += (-wave.a * 260 - wave.v * 7) * dt; wave.a += wave.v * dt;
    const L = narrow ? 70 : 110, om = 2 * Math.PI * (narrow ? 1 : 0.78), dipW = narrow ? 7 : 10;
    for (const c of cards) { const t = c.home === 'line' ? dipW : 0; c.dipV += ((t - c.dip) * 90 - c.dipV * 9) * dt; c.dip += c.dipV * dt; }
    for (const c of cards) {
      if (!reduce) {
        c.pv += ((c.pt - c.ps) * 38 - c.pv * 3.2) * dt; c.ps += c.pv * dt;
        c.fv += ((c.ft - c.fx) * 60 - c.fv * 7) * dt; c.fx += c.fv * dt;
        const vNew = (c.x - c.px) / dt, dv = vNew - c.vx; c.vx = vNew; c.px = c.x;
        if (!c.grab) {
          if (Math.abs(dv) < 3000) c.w += (dv / L) * Math.cos(c.th) * 0.22;
          c.w += (-om * om * Math.sin(c.th) - 1.5 * c.w) * dt;
          c.th = clamp(c.th + c.w * dt, -0.7, 0.7);
        }
      } else { c.th = 0; c.w = 0; c.ps = 0; c.fx = 0; }
      if (c.home === 'line') c.y = cordY(c.x) + 2;
      const tx = c.x - CW / 2;
      c.el.style.transform = `translate(${tx}px, ${c.y}px) rotate(${c.th}rad) scale(${c.s})`;
      c.box.style.transform = `rotateY(${c.ps}rad) rotateX(${c.fx}rad)`;
      c.el.style.setProperty('--g', (Math.sin(c.ps) * 0.9 + c.th * 0.6).toFixed(3));
      const sx = Math.max(0.12, Math.abs(Math.cos(c.ps)));
      c.sh.style.transform = `translate(${tx - 14 - c.th * 30}px, ${c.y + 26 + Math.abs(c.th) * 6}px) rotate(${c.th * 0.85}rad) scale(${c.s * sx}, ${c.s})`;
      c.el.style.opacity = String(c.op); c.sh.style.opacity = String(0.85 * c.op);
    }
    let d = '', ds = '';
    for (let x = -20; x <= W + 20; x += 8) { const y = cordY(x), m = x === -20 ? 'M' : 'L'; d += `${m}${x} ${y.toFixed(1)}`; ds += `${m}${x} ${(y + 6).toFixed(1)}`; }
    cordPath.setAttribute('d', d); cordShadow.setAttribute('d', ds);
    if (visible) requestAnimationFrame(tick);
  };
  new IntersectionObserver((es) => { const v = es[0].isIntersecting; if (v && !visible) { visible = true; last = performance.now(); requestAnimationFrame(tick); } visible = v; }, { rootMargin: '200px 0px' }).observe(root);

  /* ── 뒤집기: 한 번에 한 장만 뒷면이 보인다 ── */
  const turn = (c, to = !c.turned) => {
    if (c.turned === to) return;
    c.turned = to; c.el.classList.toggle('is-turned', to);
    c.back.setAttribute('aria-hidden', String(!to)); c.front.setAttribute('aria-hidden', String(to));
    c.el.style.zIndex = to ? '4' : '';
    play('flip');
    if (reduce) { gsap.set(c.flip, { rotationY: to ? 180 : 0 }); c.s = to ? 1.05 : 1; return; }
    gsap.to(c.flip, { rotationY: to ? 180 : 0, duration: 0.7, ease: 'back.out(1.25)' });
    gsap.to(c, { s: to ? 1.06 : 1, duration: 0.5, ease: 'power2.out' });
    c.w += sign() * 1.2; c.pv += sign() * 2;
  };
  const pick = (c) => { for (const k of cards) if (k !== c) turn(k, false); turn(c); };

  /* ── 손: 지나가면 돌아보고, 짧게 누르면 뒤집고, 잡아 끌면 따라 흔들린다 ── */
  function bind(c) {
    const el = c.el; let down = null, dragged = false, suppress = 0;
    el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && c.home === 'line' && !down) { play('hover'); c.w -= clamp(e.movementX * 0.02, -0.5, 0.5) || 0.25; } });
    el.addEventListener('pointerleave', () => { c.pt = 0; c.ft = 0; });
    el.addEventListener('pointermove', (e) => {
      if (!down) {
        if (e.pointerType === 'mouse' && c.home === 'line') {
          c.w -= clamp(e.movementX * 0.006, -0.6, 0.6);
          const r = el.getBoundingClientRect(); const u = clamp((e.clientX - r.left) / r.width - 0.5, -0.5, 0.5), v = clamp((e.clientY - r.top) / r.height - 0.5, -0.5, 0.5);
          c.pt = -u * 0.5; c.ft = v * 0.28;
        }
        return;
      }
      if (!dragged && e.pointerType === 'mouse' && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 7) { dragged = true; c.grab = true; el.classList.remove('is-down'); }
      if (!dragged) return;
      const R = line.getBoundingClientRect(), px = e.clientX - R.left, py = e.clientY - R.top;
      const target = clamp(Math.atan2(c.x - px, Math.max(30, py - c.y)), -0.7, 0.7);
      const prev = c.th; c.th += (target - c.th) * 0.4; c.w = (c.th - prev) * 60;
    });
    el.addEventListener('pointerdown', (e) => {
      stopGuide(); if (c.home !== 'line') return;
      down = { x: e.clientX, y: e.clientY }; dragged = false; el.classList.add('is-down'); play('press');
      if (e.pointerType === 'mouse') { try { el.setPointerCapture(e.pointerId); } catch { /* 이미 놓음 */ } }
    });
    const up = () => { if (!down) return; down = null; el.classList.remove('is-down'); if (dragged) { c.grab = false; if (Math.abs(c.w) > 3) play('whoosh', { g: 0.5, rate: 1.3 }); suppress = performance.now(); } };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('click', (e) => { if (e.target.closest('a')) return; if (performance.now() - suppress < 400 || c.home !== 'line') return; pick(c); });
    el.addEventListener('keydown', (e) => { if (e.key !== 'Enter' && e.key !== ' ') return; if (e.target.closest('a')) return; e.preventDefault(); el.classList.add('is-down'); play('press'); setTimeout(() => { el.classList.remove('is-down'); pick(c); }, 110); });
  }

  /* ── 처음: 카드가 하나씩 위에서 떨어져, 열린 집게가 줄을 물고 닫힌다 ── */
  const dropIn = (c, delay) => new Promise((res) => {
    const x1 = slotX[c.i]; c.x = c.px = x1; c.home = 'fly'; c.th = sign() * (0.06 + Math.random() * 0.1); c.ps = sign() * (0.9 + Math.random() * 0.5);
    c.el.classList.add('is-open');
    if (reduce) { c.home = 'line'; c.op = 1; c.th = 0; c.ps = 0; c.el.classList.remove('is-open'); res(); return; }
    const y1 = cordY(x1) + 2; c.y = -CH - 140; c.op = 0;
    gsap.timeline({ delay }).to(c, { op: 1, duration: 0.18 }, 0).to(c, { y: y1, duration: 0.62, ease: 'power2.in' }, 0)
      .call(() => { c.home = 'line'; c.el.classList.remove('is-open'); c.w += sign() * 1.1; c.pv += sign() * 3; c.dipV += 160; kick(x1, 110); play('clipsnap'); res(); });
  });

  /* ── 안내: 처음 한 번 손이 첫 카드를 눌러 뒤집어 보이고, 다시 돌려놓는다 ── */
  const hand = document.createElement('div'); hand.className = 'ts-hand'; hand.setAttribute('aria-hidden', 'true');
  hand.innerHTML = '<svg viewBox="0 0 48 56"><path d="M18 30V9.5a4.5 4.5 0 0 1 9 0V25l1.2-.4a4.4 4.4 0 0 1 5.4 2.4l.4-.1a4.4 4.4 0 0 1 5.4 2.7 4.3 4.3 0 0 1 5.1 3.5l.5 4.6c.6 5.6-1.2 10-4.6 13.3l-1.2 1.2c-1.4 1.4-3.3 2.1-5.3 2.1H22.6c-2.4 0-4.6-1.1-6-3L7.9 40.6a4.6 4.6 0 0 1 7-5.9z"/></svg><i class="ts-hand-ring"></i>';
  const tip = document.createElement('p'); tip.className = 'ts-tip'; tip.setAttribute('aria-hidden', 'true'); tip.innerHTML = '<i></i>카드를 누르면 맡는 강의가 나옵니다';
  line.append(hand, tip);
  let guide = null;
  const stopGuide = () => { if (!guide) return; guide.kill(); guide = null; gsap.to([hand, tip], { opacity: 0, duration: 0.25 }); };
  const runGuide = () => {
    if (reduce) return;
    const c = cards[0], x = c.x + CW * 0.18, y = c.y + CH * 0.55;
    const tx = clamp(c.x - CW / 2, 8, W - 270), ty = c.y + CH + 22;
    gsap.set(tip, { left: tx, top: ty }); gsap.set(hand, { left: x + 70, top: y + 60, opacity: 0, scale: 1 });
    const ring = $('.ts-hand-ring', hand);
    guide = gsap.timeline({ delay: 0.5, onComplete: () => { guide = null; } })
      .to(tip, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0)
      .to(hand, { opacity: 1, left: x, top: y, duration: 0.7, ease: 'power3.out' }, 0.1)
      .to(hand, { scale: 0.86, duration: 0.12 }, 1.0)
      .call(() => { gsap.fromTo(ring, { scale: 0.2, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.6, ease: 'power2.out' }); c.el.classList.add('is-down'); play('press', { g: 0.4 }); }, null, 1.06)
      .to(hand, { scale: 1, duration: 0.18 }, 1.18)
      .call(() => { c.el.classList.remove('is-down'); turn(c, true); }, null, 1.2)
      .to(hand, { opacity: 0, left: x + 40, top: y + 50, duration: 0.5 }, 1.6)
      .call(() => turn(c, false), null, 3.6)
      .to(tip, { opacity: 0, duration: 0.4 }, 4.6);
  };

  강사.forEach(make);
  layout(); requestAnimationFrame(tick);
  addEventListener('resize', layout);
  document.fonts && document.fonts.ready.then(layout);
  const start = () => Promise.all(cards.map((c, i) => dropIn(c, 0.15 + i * 0.16))).then(() => setTimeout(runGuide, 300));
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { o.disconnect(); start(); } }, { threshold: 0.25 }).observe(root);
  window.__ts = { cards, turn, pick, stopGuide };
})();
</script>
</body>
</html>

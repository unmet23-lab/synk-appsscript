<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="base.css">
<style>
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
[hidden]{display:none!important}
/* 장면: 사업마다 사진 하나 */
.sc{position:absolute;inset:0;overflow:hidden;container-type:size}
.sc .m{position:absolute;container-type:inline-size;left:50%;transform:translateX(-50%)}
.sc .m>img{position:absolute;inset:0;width:100%;height:100%}
.sc>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.town{width:max(100cqw,84cqh*1040/1604);aspect-ratio:1040/1604;bottom:0}
.hall{width:max(100cqw,84cqh*1080/1720);aspect-ratio:1080/1720;top:0}
.scr{position:absolute;left:8.26%;top:31.1%;width:69.2%;height:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;color:#3a2a17;text-align:center;font:600 3.5cqi/1.4 var(--sans)}
.scr b{font:500 14.5cqi/1 var(--mono);letter-spacing:-.04em}
.pin{position:absolute;transform:translate(-50%,-100%);padding:.5em .8em;border-radius:999px;background:#fff;color:#1b1a12;font:700 clamp(12px,2.9cqi,16px)/1 var(--sans);white-space:nowrap;box-shadow:0 8px 22px rgba(60,50,10,.2)}
/* 세 칸 */
.tri{position:relative;display:flex;gap:10px;height:var(--vh);min-height:600px;max-height:1180px;padding:12px;background:#fff}
.tri a{position:relative;flex:1 1 0;min-width:0;border-radius:26px;overflow:hidden;background:#0b0b0c;color:#fff}
.tri .k1{color:#14120f;background:#c5d3ed}.tri .k2{background:#010101}
.tri .k3::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.66),transparent 46%)}
.tri .t{position:absolute;z-index:1;left:clamp(20px,2vw,34px);right:20px}
.tri small{display:block;font:600 clamp(16px,1.25vw,21px)/1.3 var(--sans);letter-spacing:-.01em}
.tri .t b{display:flex;align-items:center;gap:.34em;margin-top:8px;font:800 clamp(30px,3.15vw,56px)/1.1 var(--sans);letter-spacing:-.04em;white-space:nowrap}
.tri .t b::after{content:"";flex:none;width:.24em;height:.24em;border-right:.085em solid;border-top:.085em solid;transform:rotate(45deg);transition:translate .4s var(--ease)}
.tri a:hover .t b::after{translate:.16em 0}
@media (hover:hover) and (min-width:901px){.tri a{transition:flex-grow .7s var(--ease)}.tri:has(a:hover) a:not(:hover){flex-grow:.91}.tri a:hover,.tri a:focus-visible{flex-grow:1.18}}
@media (prefers-reduced-motion:no-preference){.tri a{animation:rise .9s var(--ease) both}.tri .k2{animation-delay:.1s}.tri .k3{animation-delay:.2s}@keyframes rise{from{translate:0 40px;opacity:0}to{translate:0 0;opacity:1}}}
@media (prefers-reduced-motion:reduce){.tri a{transition:none!important}}
@media (min-width:901px) and (max-width:1240px){.tri{height:min(var(--vh),66vw)}}
/* 윗줄: 그림 위에 synk 하나와 언어만 */
.nav{position:absolute;inset:calc(var(--rev) + 12px) 12px auto 12px;height:68px;padding:0 clamp(20px,2vw,34px);grid-template-columns:1fr auto 1fr;color:#fff}
.nav .logo{grid-column:2;font-size:28px}
.nav .lang{grid-column:3;justify-self:end;display:flex;gap:4px;font:600 14px/1 var(--sans)}
.nav .lang>*{padding:12px 8px;opacity:.78}.nav .lang [aria-current]{opacity:1;font-weight:800}
.tri .t{top:calc(68px + clamp(8px,1vw,18px))}
/* 지금 공개본 */
.no{position:relative;background:#000}.no img{width:100%;height:auto}
.no p{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:10px 18px;font:600 14px/1.3 var(--sans);white-space:nowrap}
/* 맨 아래: 묻는 곳 한 줄, 잔글씨 한 줄, 큰 synk */
.end{padding:clamp(44px,5vw,76px) var(--gut) 0;display:grid;grid-template-columns:1fr auto;gap:18px 40px;align-items:end}
.end .ask{font:600 clamp(19px,1.7vw,25px)/1.4 var(--sans);letter-spacing:-.02em}
.end .ask a{font-weight:800}
.end nav{display:flex;flex-wrap:wrap;gap:8px 24px;font:700 16px/1.4 var(--sans)}
.foot{padding:clamp(22px,2.4vw,36px) var(--gut) clamp(8px,1vw,18px)}
.wm{position:relative;height:30.4vw;overflow:hidden;background:#fff}
.wm span{position:absolute;left:50%;top:-12.6vw;transform:translateX(-51%);font:800 46vw/1 var(--sans);letter-spacing:-.07em;white-space:nowrap;color:#0b0b0c;user-select:none}
@media (prefers-reduced-motion:no-preference){.wm.io span{translate:0 22%;opacity:0;transition:translate 1s var(--ease),opacity .6s}.wm.on span{translate:0 0;opacity:1}}
.rev .lb{padding:0 4px 0 2px;color:#fff;flex:none;white-space:nowrap}
@media (max-width:900px){
  .tri{flex-direction:column;height:auto;max-height:none;padding:10px}.tri a{flex:none;height:min(122vw,560px)}
  .nav{inset:calc(var(--rev) + 10px) 10px auto 10px;height:60px;color:#14120f;grid-template-columns:1fr auto 1fr}
  .nav .logo{font-size:25px}.nav .lang{gap:0}.nav .lang>*{padding:12px 6px}
  .tri .t{top:clamp(20px,2.1vw,34px)}
  .tri .k1 .t{top:72px}
  .tri .k1{height:min(138vw,620px)}
  .end{grid-template-columns:1fr}
}
</style>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const nav=$('#nav');
function show(k){$$('[data-v]').forEach(h=>h.hidden=h.dataset.v!==k);$$('[data-go]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===k));scrollTo(0,0);paint()}
$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
function paint(){nav.hidden=!$('[data-v=now]').hidden;$$('.end,.foot,.wm').forEach(e=>e.hidden=nav.hidden)}
const tick=()=>{const t=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());$$('.now').forEach(e=>e.textContent=t)};tick();setInterval(tick,10000);
const wm=$('.wm');if('IntersectionObserver'in window){wm.classList.add('io');new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){wm.classList.add('on');o.disconnect()}},{threshold:.25}).observe(wm)}
show('a');
</script>

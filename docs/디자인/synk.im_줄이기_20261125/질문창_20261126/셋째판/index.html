<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>묻기 창 셋째 판 시안</title>
<style>
@font-face{font-family:'SYNK Sans Draft';src:url(f/sans.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'SYNK Serif Draft';src:url(f/serif.woff2) format('woff2');font-weight:300;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7A3,U+3000-303F,U+FF01-FF60}
@font-face{font-family:'DM Mono';src:url(f/mono.woff2) format('woff2');font-weight:500;font-display:swap}
:root{--tool:64px;--sans:'SYNK Sans Draft',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--serif:'SYNK Serif Draft','SYNK Sans Draft',serif;--mono:'DM Mono',ui-monospace,monospace;--ease:cubic-bezier(.22,.8,.22,1);--spring:cubic-bezier(.32,1.2,.5,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff}
body{font:400 16px/1.6 var(--sans);color:#111;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
kbd{font:500 11px/1 var(--mono)}
/* 뒤의 홈(지금 공개 후보 첫 화면 캡처) */
.home{position:fixed;inset:0;background:#fff url(a/home-1440.webp) 50% 0/cover no-repeat}
@media (max-width:700px){.home{background-image:url(a/home-390.webp)}}
.reopen{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 24px;border-radius:999px;background:#111;color:#fff;font:600 17px/1 var(--sans);box-shadow:0 12px 40px rgba(0,0,0,.25)}
/* 시안 고르기 띠 — 시안 밖의 도구 */
.shot .looks,.shot .refs{display:none!important}
.shot{--tool:0px}
.looks{position:fixed;z-index:60;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(30,30,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font:600 13px/1 var(--sans);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.looks button{padding:10px 13px;border-radius:999px;opacity:.72}
.looks button[aria-pressed="true"]{background:#fff;color:#111;opacity:1}
.looks b{font-weight:700;margin-right:5px;opacity:.55}
.looks .ref{margin-left:4px;border:1px solid rgba(255,255,255,.28);opacity:.9}
.looks .ref[aria-pressed="true"]{background:#f96859;border-color:#f96859;color:#111}
@media (max-width:560px){.looks .long{display:none}.looks button{padding:10px 12px}}
/* 참고 보기: 지금 시안이 무엇을 보고 무엇을 가져왔는지 */
.refs{position:fixed;z-index:59;right:14px;top:14px;bottom:70px;width:min(420px,calc(100vw - 28px));overflow:auto;padding:18px;border-radius:18px;background:rgba(20,20,22,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#eee;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:refs-in .32s var(--ease) both}
@keyframes refs-in{from{opacity:0;transform:translateY(8px)}}
.refs h3{font:700 15px/1.4 var(--sans);color:#fff}
.refs>p{font:400 13px/1.6 var(--sans);color:#a8a8ad;margin-top:6px}
.refs figure{margin:16px 0 0}
.refs img{display:block;width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.refs figcaption{font:600 13px/1.45 var(--sans);color:#fff;margin-top:8px}
.refs figcaption span{display:block;font-weight:400;color:#b9b9be;margin-top:3px}
.refs dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font:400 12.5px/1.5 var(--sans);color:#d6d6da}
.refs dt{color:#8d8d93}
.refs dd{margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
<link rel="stylesheet" href="look-a.css">
<link rel="stylesheet" href="look-b.css">
<link rel="stylesheet" href="look-c.css">
</head>
<body>
<script>if(/[?&]shot/.test(location.search))document.documentElement.classList.add('shot')</script>
<div class="home" aria-hidden="true"></div>
<button class="reopen" type="button" hidden>무엇이든 물어보세요</button>
<div data-look="a" hidden></div>
<div data-look="b" hidden></div>
<div data-look="c" hidden></div>
<aside class="refs" hidden aria-label="참고"></aside>
<nav class="looks" aria-label="시안 고르기">
  <button type="button" data-go="a"><b>가</b><span class="long">흰 입력창</span></button>
  <button type="button" data-go="b"><b>나</b><span class="long">유리 검색</span></button>
  <button type="button" data-go="c"><b>다</b><span class="long">검정 무대</span></button>
  <button type="button" class="ref" aria-pressed="false">참고</button>
</nav>
<script type="module">
import { mount as a } from './look-a.js';
import { mount as b } from './look-b.js';
import { mount as c } from './look-c.js';
import { load } from './ask-core.js';
import { REFS } from './refs.js';
const MOUNT = { a, b, c }, ctl = {};
let cur = 'a';
const reopen = document.querySelector('.reopen'), refs = document.querySelector('.refs'), refBtn = document.querySelector('.looks .ref');
const hooks = {
  close: () => { ctl[cur]?.close(); document.querySelector(`[data-look="${cur}"]`).hidden = true; reopen.hidden = false; },
  home: () => hooks.close(),
};
function drawRefs() {
  const r = REFS[cur];
  refs.innerHTML = `<h3>${r.title}</h3><p>${r.lead}</p>` + r.figs.map(f => `<figure><img src="${f.src}" alt="${f.name} 화면"><figcaption>${f.name}<span>${f.took}</span></figcaption></figure>`).join('') + `<dl>${r.nums.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function show(k) {
  if (!MOUNT[k]) k = 'a';
  if (ctl[cur] && cur !== k) ctl[cur].close();
  cur = k; reopen.hidden = true;
  document.querySelectorAll('[data-look]').forEach(s => s.hidden = s.dataset.look !== k);
  document.querySelectorAll('[data-go]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.go === k)));
  const root = document.querySelector(`[data-look="${k}"]`);
  if (!ctl[k]) ctl[k] = MOUNT[k](root, hooks);
  ctl[k].open();
  if (!refs.hidden) drawRefs();
  try { history.replaceState(null, '', '#' + k + (refs.hidden ? '' : '-ref')); } catch {}
}
document.querySelectorAll('[data-go]').forEach(x => x.addEventListener('click', () => show(x.dataset.go)));
refBtn.addEventListener('click', () => { refs.hidden = !refs.hidden; refBtn.setAttribute('aria-pressed', String(!refs.hidden)); if (!refs.hidden) drawRefs(); try { history.replaceState(null, '', '#' + cur + (refs.hidden ? '' : '-ref')); } catch {} });
reopen.addEventListener('click', () => show(cur));
const h = location.hash.slice(1);
if (h.endsWith('-ref')) { refs.hidden = false; refBtn.setAttribute('aria-pressed', 'true'); }
show(h.replace('-ref', ''));
load();
/* 시험용: ?q=질문 이면 그 질문으로 바로 답한다 */
const q = new URLSearchParams(location.search).get('q');
if (q) ctl[cur].ask?.(q);
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNK ID · 시안 A 한 칸</title>
<link rel="stylesheet" href="shared.css">
<style>
/* A 한 칸 — PC 앱 로그인 창(desktop/renderer #account-dialog: 폭 440 · 싱ㅋ 64 · 「SYNK ID」 회색 머리 · 검정 알약)을 그대로 쪽으로 편 판.
   겹: 싱ㅋ 표 → 「SYNK ID」 회색 머리(늘 같은 자리) → 제목 34 → 회색 안내 → 방법 한 쌍 → Google 안내 → (이메일 칸) → 처음이세요 → 바닥 링크.
   첫머리 · 둘로 나눔 · 카드 상자 없음. 머리 블록은 모든 장면에서 같은 높이에서 시작한다. */
.a .page{min-height:100vh;display:flex;justify-content:center;padding:clamp(32px,10vh,112px) max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px))}
.a .col{width:100%;max-width:400px;display:flex;flex-direction:column}
.a .col.wide{max-width:440px}
.a .col.account-col{max-width:640px}
.a .brand .wordmark{width:64px;height:auto}
.a .head{margin:16px 0 32px}
.a .kicker-above{margin:16px 0 8px}
.a .consent>h2{margin-bottom:4px}
.a footer{margin-top:auto;padding-top:48px}
@media (max-width:520px){.a .page{padding-top:20px}.a .head{margin-bottom:28px}}
</style>
</head>
<body class="sid a">
<div class="page"><main class="col" id="col"></main></div>
<script src="scenes.js"></script>
<script>
(function () {
  const M = window.SYNKMOCK;
  function draw() {
    const s = M.current(), h = M.head(s), col = document.getElementById('col');
    col.className = 'col' + (['onboarding', 'consent', 'restart'].includes(s.mode) ? ' wide' : s.mode === 'account' ? ' account-col' : '');
    const brand = `<a class="brand" href="#" aria-label="SYNK 홈">${M.WORDMARK}</a>`;
    let top;
    if (s.mode === 'consent' || s.mode === 'restart') top = '<p class="id-kicker kicker-above">SYNK ID</p>';
    else top = `<div class="head"><div class="intro-copy"><p class="id-kicker">SYNK ID</p>${s.mode === 'account'
      ? `<div class="account-top"><h2>${M.esc(h.h)}</h2><button class="sb-btn soft compact" type="button">로그아웃</button></div>` : `<h2 id="auth-heading">${M.esc(h.h)}</h2>`}${h.copy ? `<p id="auth-copy">${M.esc(h.copy)}</p>` : ''}</div></div>`;
    col.innerHTML = `${brand}${top}${M.body(s)}<footer>${M.footLinks}</footer>`;
    document.title = 'SYNK ID · A 한 칸 · ' + s.name;
  }
  addEventListener('hashchange', draw);draw();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개인화 구역 시안</title>
<style>
:root{color-scheme:light;--ink:#0b0b0c;--ink2:#5a5d65;--line:rgba(11,11,12,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font:15px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);background:#e9e9ea}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
header b{font-weight:700}
.g{display:flex;gap:4px;align-items:center}
.g span{color:var(--ink2);font-size:13px;margin-right:4px}
button{all:unset;cursor:pointer;min-height:36px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
button:focus-visible{outline:2px solid #0b0b0c;outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
main.solo{grid-template-columns:1fr}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane h2{margin:0 0 6px;font-size:13px;font-weight:650;color:var(--ink2)}
.box{flex:1;min-height:0;overflow:hidden;background:#fff;position:relative;box-shadow:0 0 0 1px var(--line)}
iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0;background:#fff}
@media (max-width:900px){main{grid-template-columns:1fr;grid-auto-rows:minmax(70vh,auto);overflow:auto}}
</style>
</head>
<body>
<header>
 <b>개인화 구역 시안</b>
 <div class="g" data-g="page"><span>쪽</span><button data-v="home">홈</button><button data-v="atlas">아틀라스</button><button data-v="lab">LAB</button></div>
 <div class="g" data-g="plan"><span>안</span><button data-v="a">A 학습자의 말</button><button data-v="b">B 한 문제, 30일</button></div>
 <div class="g" data-g="w"><span>폭</span><button data-v="1440">컴퓨터 1440</button><button data-v="390">휴대폰 390</button></div>
 <div class="g" data-g="cmp"><span>보기</span><button data-v="1">공개본과 나란히</button><button data-v="0">시안만</button></div>
</header>
<main id="m">
 <section class="pane" data-pane="now"><h2>지금 공개본</h2><div class="box"><iframe title="지금 공개본"></iframe></div></section>
 <section class="pane" data-pane="new"><h2 id="t">시안</h2><div class="box"><iframe title="시안"></iframe></div></section>
</main>
<script>
const s={page:'home',plan:'a',w:'1440',cmp:'1'};
const q=new URLSearchParams(location.search);for(const k in s)if(q.get(k))s[k]=q.get(k);
const m=document.getElementById('m'),now=document.querySelector('[data-pane=now] iframe'),neu=document.querySelector('[data-pane=new] iframe');
function fit(f){const w=+s.w,box=f.parentElement,sc=Math.min(1,box.clientWidth/w);f.style.width=w+'px';f.style.height=(box.clientHeight/sc)+'px';f.style.transform=`scale(${sc})`;}
function draw(){
 document.querySelectorAll('.g').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===s[g.dataset.g]))));
 const anchor={home:'#learner',atlas:'#learner',lab:'#learner'}[s.page];
 const srcNew=`/page/${s.page}?안=${s.plan}${anchor}`;
 if(neu.getAttribute('src')!==srcNew)neu.setAttribute('src',srcNew);
 const srcNow=`/page/${s.page}?안=공개${{home:'#atlas',atlas:'#engines',lab:'#world'}[s.page]}`;
 if(now.getAttribute('src')!==srcNow)now.setAttribute('src',srcNow);
 m.classList.toggle('solo',s.cmp==='0');document.querySelector('[data-pane=now]').hidden=s.cmp==='0';
 document.getElementById('t').textContent=`시안 ${s.plan.toUpperCase()}`;
 fit(now);fit(neu);
 history.replaceState(null,'','?'+new URLSearchParams(s));
}
document.querySelectorAll('.g').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s[g.dataset.g]=b.dataset.v;draw();}));
addEventListener('resize',draw);draw();
</script>
</body>
</html>

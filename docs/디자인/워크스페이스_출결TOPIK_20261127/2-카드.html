<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 2 · 출석 카드 — 학생 관리와 반 출결 · TOPIK</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="글꼴.css">
<style>
/* 시안 2 「출석 카드」: 지금 「내 수업」 교사 화면의 검은 판을 잇는다(Linear #08090A, flex 검은 판).
   흐름: 학생 관리(반 카드 · 살필 학생) → 「반에서 출결 찍기」 → 학생 카드를 여럿 골라 아래 띠에서 한 번에(Brightwheel 출석 모드) → 서랍. */
:root{
  --bg:#08090A;--s1:#111214;--s2:#18191C;--s3:#202226;--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.14);
  --tx:#EDEDEF;--tx2:rgba(237,237,239,.68);--tx3:rgba(237,237,239,.5);
  --y:#FED027;
  --pr:#9BD07A;--pr-d:rgba(155,208,122,.42);--la:#F5C445;--ab:#FF7B6B;--ex:#93B2F2;
  --serif:'WS Serif','Noto Serif KR',serif;--num:'Inter Tight','SUIT',system-ui,sans-serif;--sans:'SUIT',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
}
html,body{background:var(--bg);color:var(--tx);font:400 14px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 340px;min-height:100vh}
.side{border-right:.5px solid var(--hair);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font:600 22px/1 var(--num);letter-spacing:-.03em;padding:4px 10px 26px}
.side .lab{margin:14px 10px 6px;font:600 12px/1 var(--sans);color:var(--tx3)}
.nv{display:flex;justify-content:space-between;align-items:center;height:38px;padding:0 10px;border-radius:10px;font:500 14px/1 var(--sans);color:var(--tx2);text-decoration:none}
.nv:hover{background:var(--s1);color:var(--tx)}
.nv[aria-current]{background:var(--s2);color:var(--tx);font-weight:600}
.nv.sub{padding-left:22px;font-size:13.5px}
.nv span{font:500 12px/1 var(--num);color:var(--tx3);margin-left:10px}
.side .me{margin-top:auto;padding:10px;border-top:.5px solid var(--hair);font:500 13px/1.4 var(--sans)}
.side .me small{display:block;color:var(--tx3)}
.main{padding:26px 30px 130px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.crumb{font:500 12.5px/1 var(--sans);color:var(--tx3)}
.crumb a{color:var(--tx2);text-decoration:none}.crumb a:hover{color:var(--tx)}
h1{margin:12px 0 0;font:300 34px/1.12 var(--serif);letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--tx2);font:500 13.5px/1.4 var(--sans)}
.sub b{font:600 13.5px/1 var(--num);color:var(--tx)}
.br>button{height:32px;padding:0 14px;font:600 13px/1 var(--sans);color:var(--tx2);white-space:nowrap}
.br>button small{font:500 11.5px/1 var(--num);margin-left:5px;color:var(--tx3)}
.br>button[aria-pressed="true"]{color:var(--tx)}
.date{display:flex;align-items:center;gap:2px;height:38px;border-radius:10px;background:var(--s1);box-shadow:inset 0 0 0 .5px var(--hair2);flex:none}
.date button{width:32px;height:38px;color:var(--tx2);font:500 16px/1 var(--num)}
.date span{font:600 14px/1 var(--sans);min-width:116px;text-align:center}
.date em{font:500 14px/1 var(--num);font-style:normal}
/* 학생 한 명의 길 */
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}
.path button{text-align:left;padding:14px 16px;border-radius:14px;background:var(--s1);box-shadow:inset 0 0 0 .5px var(--hair);display:flex;flex-direction:column;gap:8px}
.path button:hover{background:var(--s2)}
.path button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--tx);background:var(--s2)}
.path .k{font:600 12.5px/1 var(--sans);color:var(--tx2)}
.path .k i{font:500 11px/1 var(--num);font-style:normal;color:var(--tx3);margin-right:6px}
.path b{font:500 28px/1 var(--num);letter-spacing:-.02em}
.path small{font:500 12px/1.3 var(--sans);color:var(--tx3)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:28px}
.sec-h h2{margin:0;font:600 15px/1.3 var(--sans)}
.sec-h span{font:500 12.5px/1 var(--sans);color:var(--tx2)}.sec-h span b{font:600 13px/1 var(--num);color:var(--tx)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.cc{border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 .5px var(--hair);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.cc .cn{font:650 15.5px/1.25 var(--sans)}
.cc .cm{font:500 12px/1.3 var(--sans);color:var(--tx3);margin-top:3px}
.cc .mt{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--num)}
.cc .mt i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.cc .mt i span{position:absolute;inset:0 auto 0 0;background:var(--tx);border-radius:2px}
.cc .cx{font:500 12px/1 var(--sans);color:var(--tx3)}.cc .cx .ab{color:var(--ab);font-weight:600}.cc .cx .la{color:var(--la);font-weight:600}
.cc .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px/1 var(--num);color:var(--tx3)}
.go-class{height:34px;padding:0 14px;border-radius:10px;background:var(--y);color:#141414;font:650 13px/1 var(--sans)}
.go-class:hover{background:#ffe066}
.go-ghost{height:30px;padding:0 11px;border-radius:9px;box-shadow:inset 0 0 0 .5px var(--hair2);font:600 12.5px/1 var(--sans);color:var(--tx)}
/* 반: 세는 줄과 카드 */
.count{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-top:22px;padding-bottom:14px;border-bottom:.5px solid var(--hair);font:500 13px/1 var(--sans);color:var(--tx2)}
.count b{font:500 22px/1 var(--num);color:var(--tx);margin-right:5px;font-variant-numeric:tabular-nums}
.count .pr b{color:var(--pr)}.count .la b{color:var(--la)}.count .ab b{color:var(--ab)}.count .ex b{color:var(--ex)}
.hint{margin:12px 0 0;font:500 12.5px/1.5 var(--sans);color:var(--tx3);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.hint .lg{display:inline-flex;align-items:center;gap:6px;color:var(--tx2)}.hint .lg i{width:14px;height:4px;border-radius:2px;background:var(--pr-d);margin-left:6px}.hint .lg i:first-child{margin-left:0}.hint .lg i.late{background:var(--la)}.hint .lg i.absent{background:var(--ab)}.hint .lg i.excused{background:var(--ex)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
.card{position:relative;text-align:left;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 .5px var(--hair);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;min-height:170px;transition:box-shadow .12s,background .12s;cursor:pointer}
.card:hover{background:var(--s2)}
.card.sel{box-shadow:inset 0 0 0 1.5px var(--tx);background:var(--s2)}
.card .tick{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--hair2);display:grid;place-items:center;font:700 12px/1 var(--num);color:var(--bg)}
.card.sel .tick{background:var(--tx);box-shadow:none}
.card .nm{font:650 16px/1.2 var(--sans);padding-right:26px}
.card .mn{display:block;font:500 12px/1 var(--num);color:var(--tx3);margin-top:3px}
.card .hl{font:500 10.5px/1 var(--sans);color:var(--tx3);margin-bottom:5px}
.bars{display:flex;gap:3px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--pr-d)}
.bars i.late{background:var(--la)}.bars i.absent{background:var(--ab)}.bars i.excused{background:var(--ex)}.bars i.none{background:transparent;box-shadow:inset 0 0 0 1px var(--hair2)}
.card .now{font:650 15px/1.2 var(--sans);color:var(--tx3)}
.card .now.present{color:var(--pr)}.card .now.late{color:var(--la)}.card .now.absent{color:var(--ab)}.card .now.excused{color:var(--ex)}
.card .note{display:block;font:500 12px/1.35 var(--sans);color:var(--tx2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .streak{display:block;margin-top:3px;font:600 11.5px/1 var(--sans);color:var(--ab)}
.card.is-late{background:rgba(245,196,69,.07)}.card.is-absent{background:rgba(255,123,107,.08)}.card.is-excused{background:rgba(147,178,242,.08)}
.card .tpb{margin-top:auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 6px;min-height:40px;padding:6px 10px;text-align:left;border-radius:9px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 .5px var(--hair);font:600 12px/1 var(--num);color:var(--tx2);white-space:nowrap}
.card .tpb:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.card .tpb.warn{color:var(--la)}.card .tpb.bad{color:var(--ab)}.card .tpb.none{color:var(--tx3);font-family:var(--sans)}
.card .tpb::after{content:'›';grid-row:1/3;grid-column:2;font:500 14px/1 var(--num);opacity:.6}
.card .tpb small{grid-column:1;font:500 11.5px/1.2 var(--num);opacity:.85}
.off{margin-top:22px;border-top:.5px solid var(--hair);padding-top:14px;display:grid;gap:8px;font:500 13px/1.4 var(--sans);color:var(--tx2)}
.off b{color:var(--tx);font-weight:600;margin-right:8px}
/* 아래 띠 */
.dock{position:fixed;left:calc(232px + (100vw - 232px - 340px)/2);transform:translateX(-50%);bottom:22px;z-index:20;display:flex;align-items:center;gap:6px;padding:7px;border-radius:16px;background:rgba(32,34,38,.94);backdrop-filter:blur(18px);box-shadow:0 0 0 .5px var(--hair2),0 20px 40px -16px rgba(0,0,0,.8);max-width:calc(100vw - 232px - 340px - 40px)}
.dock .msg{padding:0 10px 0 8px;font:500 13px/1.2 var(--sans);color:var(--tx2);white-space:nowrap}
.dock .msg b{color:var(--tx);font-family:var(--num)}
.dock button{height:36px;padding:0 13px;border-radius:10px;font:600 13.5px/1 var(--sans);color:var(--tx);white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.07)}
.dock button[data-bulk="present"]{color:var(--pr)}.dock button[data-bulk="late"]{color:var(--la)}.dock button[data-bulk="absent"]{color:var(--ab)}.dock button[data-bulk="excused"]{color:var(--ex)}
.dock .sep{width:.5px;height:22px;background:var(--hair2);margin:0 2px}
.dock input{height:36px;width:200px;border-radius:10px;background:rgba(255,255,255,.06);padding:0 12px;font:500 13px/1 var(--sans);color:var(--tx)}
.dock input::placeholder{color:var(--tx3)}
.dock .primary{background:var(--y);color:#141414}.dock .primary:hover{background:#ffe066}
.dock button[disabled]{opacity:.4;cursor:default;background:none}
[data-view="students"] .dock{display:none}
/* 오른쪽 칸 */
.rail{border-left:.5px solid var(--hair);padding:26px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.rail h2{margin:0;font:600 15px/1.3 var(--sans)}
.rail .basis{margin-top:4px;font:500 12px/1 var(--num);color:var(--tx3)}
.blk{margin-top:20px}
.blk h3{display:flex;justify-content:space-between;margin:0 0 6px;font:600 12.5px/1 var(--sans);color:var(--tx2)}
.blk h3 b{font:500 12.5px/1 var(--num);color:var(--tx)}
.who{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;text-align:left;padding:10px;margin:0 -10px;border-radius:10px;font:500 13.5px/1.3 var(--sans)}
.who:hover,.who[aria-current="true"]{background:var(--s1)}
.who b{font-weight:600}
.who b span{font:500 12px/1 var(--num);color:var(--tx3);margin-left:5px}
.who em{font:600 12.5px/1.3 var(--num);font-style:normal;text-align:right;white-space:nowrap}
.who em.warn{color:var(--la)}.who em.bad{color:var(--ab)}
.who small{grid-column:1/-1;font:500 12px/1.3 var(--sans);color:var(--tx3)}
.who[data-alert]{grid-template-columns:1fr auto 10px}.who[data-alert]::after{content:'›';grid-row:1/3;grid-column:3;align-self:center;color:var(--tx3);font:500 16px/1 var(--num)}.who[data-alert] small{grid-column:1/3}
.who .meter{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:6px;position:relative;overflow:hidden}
.who .meter i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{height:28px;padding:0 10px;border-radius:8px;background:var(--s1);box-shadow:inset 0 0 0 .5px var(--hair);font:500 12.5px/1 var(--sans);color:var(--tx)}
.names button:hover{background:var(--s2)}
[data-view="students"] .only-class,[data-view="class"] .only-students{display:none!important}
/* 서랍 */
.drawer{position:fixed;inset:0 0 0 auto;width:400px;background:#101113;border-left:.5px solid var(--hair2);z-index:30;transform:translateX(102%);transition:transform .22s ease;overflow:auto;box-shadow:-30px 0 60px -30px rgba(0,0,0,.9)}
.drawer.on{transform:none}
.dr{padding:24px 24px 40px}
.dr-top{display:flex;justify-content:space-between}
.dr h2{margin:0;font:300 30px/1.1 var(--serif)}
.dr .mn{margin-top:6px;font:500 13px/1 var(--num);color:var(--tx3)}
.x{width:32px;height:32px;border-radius:9px;color:var(--tx2);font:500 18px/1 var(--num)}
.x:hover{background:var(--s2)}
.sec{margin-top:24px}
.sec h3{margin:0 0 10px;font:600 12.5px/1 var(--sans);color:var(--tx3)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{display:flex;flex-direction:column;gap:7px;font:600 11.5px/1.2 var(--sans);color:var(--tx3)}
.steps span::before{content:'';height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.steps span.done{color:var(--tx2)}.steps span.done::before{background:rgba(255,255,255,.4)}
.steps span.now{color:var(--tx)}.steps span.now::before{background:var(--y)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font:500 13px/1.35 var(--sans)}
.kv dt{color:var(--tx3)}.kv dd{margin:0;font-weight:600}
.span{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:12px}
.span i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--tx2)}
.span.warn i{background:var(--la)}.span.bad i{background:var(--ab)}
.span-k{display:flex;justify-content:space-between;margin-top:7px;font:500 11.5px/1 var(--num);color:var(--tx3)}
.rep{font:500 22px/1.2 var(--num)}
.rep small{font:600 14px/1 var(--sans);margin-left:8px}
.rep-s{margin-top:8px;font:600 13px/1.4 var(--sans)}
.rep-s.warn{color:var(--la)}.rep-s.bad{color:var(--ab)}.rep-s.ok{color:var(--tx2);font-weight:500}
.f{display:grid;gap:12px}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:grid;gap:6px;font:600 12px/1 var(--sans);color:var(--tx2)}
.f .in{height:40px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 .5px var(--hair);padding:0 12px;display:flex;align-items:center;gap:4px;font:500 14px/1 var(--num)}
.f .in:focus-within{box-shadow:inset 0 0 0 1.5px var(--tx)}
.f .in input,.f .in select{width:100%;height:100%;font:500 14px/1 var(--num);color:var(--tx);color-scheme:dark;background:transparent}
.f .in input:focus-visible,.f .in select:focus-visible{outline:none}
.f .in span{color:var(--tx3);font:500 13px/1 var(--sans)}
.ch{align-self:start}
.ch>button{height:32px;min-width:46px;padding:0 13px;font:600 13px/1 var(--sans);color:var(--tx2)}
.ch>button[aria-pressed="true"]{color:var(--tx)}
.pv{border-radius:12px;background:var(--s1);padding:12px 14px;font:500 13px/1.5 var(--sans);color:var(--tx2)}
.pv b{color:var(--tx);font-family:var(--num)}.pv .warn{color:var(--la);font-weight:600}.pv .bad{color:var(--ab);font-weight:600}
.save{height:42px;border-radius:11px;background:var(--y);color:#141414;font:650 14px/1 var(--sans)}
.recs{list-style:none;margin:0;padding:0}
.recs li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:.5px solid var(--hair);font:500 13px/1.35 var(--sans)}
.recs li em{display:block;font:500 12px/1.3 var(--num);font-style:normal;color:var(--tx3)}
.recs button{font:600 12px/1 var(--sans);color:var(--tx3)}.recs button:hover{color:var(--ab)}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-10px);opacity:0;background:var(--tx);color:var(--bg);border-radius:12px;padding:11px 16px;font:600 13.5px/1 var(--sans);transition:.18s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr)}.rail{position:static;height:auto;border:0;padding:0;margin-top:28px}.dock{left:calc(200px + (100vw - 200px)/2);max-width:calc(100vw - 240px)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:12px 16px;border-right:0;border-bottom:.5px solid var(--hair);gap:6px;overflow-x:auto}
  .side .lab,.side .me,.nv.sub{display:none}
  .brand{padding:0 8px 0 0}
  .main{padding:18px 16px 170px}
  .top{flex-direction:column;align-items:stretch;gap:14px}
  h1{font-size:28px}
  .date{justify-content:space-between}
  .path{grid-template-columns:1fr 1fr;gap:8px}
  .path b{font-size:24px}
  .cgrid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{min-height:160px;padding:12px}
  .dock{left:8px;right:8px;transform:none;bottom:8px;max-width:none;flex-wrap:wrap;justify-content:space-between}
  .dock .msg{width:100%;padding:4px 6px 2px}
  .dock input{width:100%;order:9}
  .dock .sep{display:none}
  .dock button{flex:1;padding:0 6px}
  .drawer{width:100%;top:auto;height:86vh;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .drawer.on{transform:none}
}
</style>
</head>
<body data-view="students">
<div class="app">
  <aside class="side">
    <div class="brand">synk</div>
    <a class="nv" href="#">사무실</a>
    <div class="lab">학원</div>
    <a class="nv" href="#students" id="nav-students">학생 관리</a>
    <a class="nv sub" href="#class" id="nav-class">한국어 중급 A반<span>10</span></a>
    <a class="nv sub" href="#">TOPIK 대비 B반<span>6</span></a>
    <div class="me"><b>한결 선생님</b><small>울란바토르 직영 · 원장</small></div>
  </aside>
  <main class="main">
    <section class="only-students">
      <div class="top">
        <div><div class="crumb">학원 / 학생 관리</div><h1>학생 관리</h1><p class="sub">11월 27일 금요일 · 지점마다 그곳 날짜로 봐요</p></div>
        <div class="br jg dark" id="branches" role="group" aria-label="지점"></div>
      </div>
      <div class="path" id="path" aria-label="학생 한 명의 길"></div>
      <div class="sec-h"><h2>오늘 반</h2><span id="rate"></span></div>
      <div class="cgrid" id="classes"></div>
    </section>
    <section class="only-class">
      <div class="top">
        <div><div class="crumb"><a href="#students">학생 관리</a> / 울란바토르 직영 / 한국어 중급 A반</div><h1>한국어 중급 A반</h1><p class="sub">월 · 수 · 금 18:00 · 한결 · 기록에 동의한 학생 <b>8</b>명</p></div>
        <div class="date" role="group" aria-label="날짜"><button type="button" data-d="-1" aria-label="앞 수업">‹</button><span id="date"></span><button type="button" data-d="1" aria-label="다음 수업">›</button></div>
      </div>
      <div class="count" id="count" role="status"></div>
      <p class="hint">카드를 눌러 여럿 고르면 아래 띠에서 한 번에 찍어요. 카드 위 막대는 지난 6회 출결이에요.<span class="lg"><i></i>출석<i class="late"></i>지각<i class="absent"></i>결석<i class="excused"></i>공결</span></p>
      <div class="grid" id="grid"></div>
      <div class="off" id="off"></div>
    </section>
    <aside class="rail" id="rail" aria-label="살필 학생"></aside>
  </main>
</div>
<div class="dock" id="dock"></div>
<aside class="drawer" id="drawer" aria-label="학생"><div class="dr" id="dr"></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="참고.js"></script>
<script src="젤리.js"></script>
<script>
const A=ATT,$=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const picked=new Set();let open=null,openStay=null,branch='all',stage=null,form={kind:'II',round:'',level:4,on:''},stayForm=null;
const dates=A.sessionDates();
const view=()=>location.hash==='#class'?'class':'students';
const mq=matchMedia('(min-width:1181px)');
function placeRail(){const r=$('#rail');if(mq.matches)document.querySelector('.app').append(r);else document.querySelector('.main').append(r);}
mq.addEventListener('change',placeRail);placeRail();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000);}
function lastIn(id){const d=A.SESSIONS.slice().reverse().find(d=>{const s=A.state.saved[d]?.[id]?.status;return s==='present'||s==='late';});return d?A.mdShort(d)+' '+A.dow(d):'기록 없음';}

/* ── 학생 관리 ── */
function renderStudents(){
  $('#branches').innerHTML=A.BRANCHES.map(b=>'<button type="button" data-branch="'+b.key+'" aria-pressed="'+(branch===b.key)+'"'+(b.off?' disabled':'')+'>'+b.name+(b.off?'<small>'+b.sub+'</small>':'')+'</button>').join('');
  jelly($('#branches'),'br');
  const sub={academy:'울란바토르 반 넷',path:'서류 · 면접 준비',arrived:'입국 첫 달',enrolled:'협약 대학 둘'};
  $('#path').innerHTML=A.STAGES.map((s,i)=>'<button type="button" data-stage="'+s.key+'" aria-pressed="'+(stage===s.key)+'"><span class="k"><i>'+(i+1)+'</i>'+s.ko+'</span><b>'+s.n+'</b><small>'+sub[s.key]+'</small></button>').join('');
  const m=A.mgmt(branch);
  $('#rate').innerHTML=m.rate===null?'오늘 찍은 반 없음':'오늘 출석 <b>'+m.rate+'%</b> · '+m.came+' / '+m.rec+'명';
  $('#classes').innerHTML=A.CLASSES.filter(c=>branch==='all'||c.branch===branch).map(c=>{
    const t=A.classToday(c),br=A.BRANCHES.find(b=>b.key===c.branch).name;
    let mid='<span class="cx">'+(c.mentor?'대학 출석은 학생마다 따로 받아요':'오늘 수업 없음')+'</span>',ft='';
    if(t){const pct=t.total?Math.round((t.present+t.late)/t.total*100):0;mid='<div class="mt"><i><span style="width:'+(t.recorded?pct:0)+'%"></span></i>'+(t.recorded?(t.present+t.late)+' / '+t.total:'아직 · '+t.total+'명')+'</div><span class="cx">'+(t.absent?'<span class="ab">결석 '+t.absent+'</span>':'결석 0')+' · '+(t.late?'<span class="la">지각 '+t.late+'</span>':'지각 0')+'</span>';}
    if(c.live)ft=(t&&t.at&&!A.dirty()?'<span>'+t.at+' 찍음</span><button type="button" class="go-ghost" data-goclass="a">반 열기</button>':'<span></span><button type="button" class="go-class" data-goclass="a">반에서 출결 찍기</button>');
    else if(t)ft='<span>'+c.at+' '+c.teacher+' 찍음</span>';
    return '<div class="cc"><div><div class="cn">'+esc(c.name)+'</div><div class="cm">'+br+' · '+c.days+(c.time?' '+c.time:'')+' · '+c.teacher+'</div></div>'+mid+(ft?'<div class="ft">'+ft+'</div>':'')+'</div>';
  }).join('');
}
function renderRailStudents(){
  let list=A.alerts(branch);
  if(stage==='academy')list=list.filter(a=>a.kind!=='stay');
  else if(stage==='enrolled'||stage==='arrived')list=list.filter(a=>a.kind==='stay'&&A.stay(a.id).stage===stage);
  else if(stage==='path')list=[];
  const first=c=>c.chips[0];
  $('#rail').innerHTML='<h2>살필 학생</h2><div class="basis">'+(branch==='all'?'전체 지점':A.BRANCHES.find(b=>b.key===branch).name)+' · 급한 차례 · 기준일 2026.11.27</div><div class="blk">'
    +(list.length?list.map(a=>{const c=first(a),more=a.chips.slice(1).map(x=>x.t).join(' · ');return '<button type="button" class="who" data-alert="'+a.id+'" data-akind="'+a.kind+'" aria-current="'+(openStay===a.id)+'"><b>'+esc(a.ko)+'<span>'+esc(a.mn)+'</span></b><em class="'+c.tone+'">'+esc(c.t)+'</em><small>'+esc(a.where)+(more?' · '+esc(more):'')+'</small></button>';}).join(''):'<p style="color:var(--tx3);font-size:13px">'+(stage==='path'?'유학 수속 단계의 알림은 다음 판에 이어요.':'살필 학생이 없어요.')+'</p>')+'</div>';
}

/* ── 반 ── */
function tpText(l){const r=A.representative(l);if(!r)return ['TOPIK 성적 넣기','none'];return ['<span>TOPIK '+r.kind+' '+A.levelText(r.level)+'</span><small>'+(r.state==='expired'?A.ymd(r.expires)+' 만료':r.state==='valid'?A.ymd(r.expires)+'까지':'D-'+r.left+' · '+A.ymd(r.expires)+' 만료')+'</small>',r.tone==='bad'?'bad':r.tone==='warn'?'warn':''];}
function card(l){
  const e=A.eff(l.id),st=e.status,n=A.streak(l.id),[tp,tone]=tpText(l);
  return '<div class="card'+(picked.has(l.id)?' sel':'')+(st&&st!=='present'?' is-'+st:'')+'" data-id="'+l.id+'" role="button" tabindex="0" aria-pressed="'+picked.has(l.id)+'">'
    +'<span class="tick" aria-hidden="true">'+(picked.has(l.id)?'✓':'')+'</span>'
    +'<span><span class="nm">'+esc(l.ko)+'</span><span class="mn">'+esc(l.mn)+'</span></span>'
    +'<span><span class="bars" aria-label="지난 6회 출결">'+A.history(l.id).map(h=>'<i class="'+(h.status||'none')+'" title="'+A.mdShort(h.date)+' '+(h.status?A.STATUS[h.status].ko:'기록 없음')+'"></i>').join('')+'</span></span>'
    +'<span><span class="now '+(st||'')+'">'+(st?'오늘 '+A.STATUS[st].ko:'오늘 아직')+'</span>'+(n>=3?'<span class="streak">'+n+'회 연속 결석</span>':e.note?'<span class="note">'+esc(e.note)+'</span>':'')+'</span>'
    +'<button type="button" class="tpb '+tone+'" data-open="'+l.id+'">'+tp+'</button></div>';
}
function renderClass(){
  const c=A.counts(),d=A.state.date;
  $('#date').innerHTML=(d===A.BASIS?'오늘 ':'')+'<em>'+A.mdShort(d)+'</em> '+A.dow(d)+'요일';
  $('#count').innerHTML='<span class="pr"><b>'+c.present+'</b>출석</span><span class="la"><b>'+c.late+'</b>지각</span><span class="ab"><b>'+c.absent+'</b>결석</span><span class="ex"><b>'+c.excused+'</b>공결</span><span><b>'+c.none+'</b>아직</span>';
  $('#grid').innerHTML=A.shared().map(card).join('');
  $('#off').innerHTML=A.LEARNERS.filter(l=>l.share!=='on').map(l=>'<div><b>'+esc(l.ko)+'</b>'+A.shareLine(l)+' · 출결과 TOPIK을 남기지 않아요</div>').join('');
}
function renderDock(){
  const c=A.counts(),dirty=A.dirty(),n=picked.size;let h;
  if(n)h='<span class="msg"><b>'+n+'</b>명 골랐어요</span>'+A.ORDER.map(s=>'<button type="button" data-bulk="'+s+'">'+A.STATUS[s].ko+'</button>').join('')+'<span class="sep"></span><input id="bulknote" maxlength="200" placeholder="사유를 함께 적기(고른 학생 모두)" aria-label="사유"><button type="button" data-clear="1">고르기 풀기</button>';
  else{const needAll=c.none>0;h='<span class="msg">'+(c.none?'<b>'+c.none+'</b>명 아직 안 찍었어요':dirty?'저장하지 않은 출결이 있어요':A.state.lastSave&&A.state.lastSave.date===A.state.date?A.state.lastSave.at+' 한결 선생님이 저장했어요':'모두 찍었어요')+'</span><button type="button" data-pickall="1">모두 고르기</button>'+(needAll?'<button type="button" id="all" class="primary">모두 출석</button>':'')+'<button type="button" id="save" class="'+(dirty&&!needAll?'primary':'')+'"'+(dirty?'':' disabled')+'>출결 저장</button>';}
  $('#dock').innerHTML=h;
}
function renderRailClass(){
  const s=A.summary();
  let h='<h2>TOPIK 챙길 학생</h2><div class="basis">이 반 · 기준일 2026.11.27</div>';
  h+='<div class="blk"><h3>만료 90일 안 · 만료<b>'+s.exp.length+'</b></h3>'+s.exp.map(x=>{return '<button type="button" class="who" data-open="'+x.l.id+'"><b>'+esc(x.l.ko)+'<span>TOPIK '+x.r.kind+' '+A.levelText(x.r.level)+'</span></b><em class="'+(x.r.tone==='bad'?'bad':'warn')+'">'+(x.r.state==='expired'?A.ymd(x.r.expires)+' 만료':'D-'+x.r.left)+'</em></button>';}).join('')+'</div>';
  h+='<div class="blk"><h3>유효한 4급 이상 없음<b>'+s.noFour.length+'</b></h3><div class="names">'+s.noFour.map(l=>'<button type="button" data-open="'+l.id+'">'+esc(l.ko)+'</button>').join('')+'</div></div>';
  $('#rail').innerHTML=h;
}
function renderDrawer(){
  const d=$('#drawer'),on=!!(open||openStay);d.classList.toggle('on',on);if(!on){$('#dr').innerHTML='';return;}
  let h;
  if(openStay){
    const s=A.stay(openStay);stayForm??={stay:s.stay,uniAtt:s.uniAtt??'',visa:s.visa};
    const si=A.stayInfo({stay:stayForm.stay}),tr=A.topikInfo(s.topik),at=['academy','path','arrived','enrolled'].indexOf(s.stage),att=Number(stayForm.uniAtt);
    h='<div class="dr-top"><div><h2>'+esc(s.ko)+'</h2><div class="mn">'+esc(s.mn)+' · 정착 1기 · 멘토 '+esc(s.mentor)+'</div></div><button type="button" class="x" data-close="1" aria-label="닫기">×</button></div>'
      +'<div class="sec"><h3>학생 한 명의 길</h3><div class="steps">'+A.STAGES.map((x,i)=>'<span class="'+(i<at?'done':i===at?'now':'')+'">'+x.ko+'</span>').join('')+'</div></div>'
      +'<div class="sec"><h3>재학</h3><dl class="kv"><dt>대학 · 과정</dt><dd>'+esc(s.uni)+' · '+esc(s.program)+'</dd><dt>입국일</dt><dd>'+A.ymd(s.entered)+'</dd><dt>대표 TOPIK</dt><dd>TOPIK '+s.topik.kind+' '+A.levelText(s.topik.level)+' · <span style="color:var(--'+(tr.tone==='bad'?'ab':tr.tone==='warn'?'la':'tx2')+')">'+(tr.state==='expired'?A.ymd(tr.expires)+' 만료':tr.state==='valid'?A.ymd(tr.expires)+'까지':'D-'+tr.left)+'</span></dd></dl></div>'
      +'<div class="sec"><h3>체류와 대학 출석 고치기</h3><form class="f" id="sf"><div class="two"><label>비자<span class="in"><select id="visa">'+['D-2','D-2-1','D-4','D-4-1'].map(v=>'<option'+(stayForm.visa===v?' selected':'')+'>'+v+'</option>').join('')+'</select></span></label><label>체류 만료일<span class="in"><input type="date" id="stayOn" value="'+esc(stayForm.stay)+'"></span></label></div>'
      +'<label>대학 출석률<span class="in" style="width:140px"><input inputmode="numeric" id="uniAtt" value="'+esc(stayForm.uniAtt)+'"><span>%</span></span></label>'
      +'<p class="pv">체류 만료 <b>'+A.ymd(stayForm.stay)+'</b> · <span class="'+(si.tone==='quiet'?'':si.tone)+'">'+(si.state==='expired'?'이미 지났어요':si.label+' · '+si.left+'일 남음')+'</span>'+(si.state==='open'||si.state==='urgent'?'<br>연장은 만료 4개월 전부터 신청할 수 있어요.':'')+(att&&att<70?'<br><span class="bad">대학 출석 '+att+'% · 70% 아래예요</span>':'')+'</p><button class="save" type="submit">재학 기록 저장</button></form></div>';
  }else{
    const l=A.learner(open),r=A.representative(l),recs=l.topik.map(x=>A.topikInfo(x)).sort((a,b)=>b.on.localeCompare(a.on)),e=A.eff(l.id);
    h='<div class="dr-top"><div><h2>'+esc(l.ko)+'</h2><div class="mn">'+esc(l.mn)+' · 한국어 중급 A반</div></div><button type="button" class="x" data-close="1" aria-label="닫기">×</button></div>';
    h+='<div class="sec"><h3>오늘</h3><div class="rep-s ok">'+(e.status?A.STATUS[e.status].ko+(e.note?' · '+esc(e.note):''):'아직 안 찍었어요')+(e.old?' · '+e.old.at+' '+esc(e.old.by)+' 저장':'')+'</div></div>';
    h+='<div class="sec"><h3>대표 TOPIK</h3>';
    if(r){const pct=Math.max(2,Math.min(100,Math.round(A.days(r.on,A.BASIS)/730*100)));h+='<div class="rep">TOPIK '+r.kind+'<small>'+A.levelText(r.level)+'</small></div><div class="rep-s '+(r.tone==='bad'?'bad':r.tone==='warn'?'warn':'ok')+'">'+(r.state==='expired'?A.ymd(r.expires)+'에 만료됐어요':r.label+' · '+A.ymd(r.expires)+' · '+r.left+'일 남음')+'</div><div class="span '+(r.tone==='bad'?'bad':r.tone==='warn'?'warn':'')+'"><i style="width:'+pct+'%"></i></div><div class="span-k"><span>발표 '+A.ymd(r.on)+'</span><span>만료 '+A.ymd(r.expires)+'</span></div>';}
    else h+='<div class="rep-s ok">아직 넣은 성적이 없어요.</div>';
    h+='</div>';
    const lv=form.kind==='I'?[1,2,0]:[3,4,5,6,0];
    let pv='발표일을 고르면 만료일(발표일 + 2년)이 바로 보여요.';
    if(/^\d{4}-\d{2}-\d{2}$/.test(form.on)){const i=A.topikInfo({level:form.level,on:form.on});pv='만료일 <b>'+A.ymd(i.expires)+'</b> · '+(i.state==='fail'?'미달':'<span class="'+(i.tone==='bad'?'bad':i.tone==='warn'?'warn':'')+'">'+(i.state==='expired'?'이미 만료':i.label+' · '+i.left+'일 남음')+'</span>');}
    h+='<div class="sec"><h3>성적 넣기</h3><form class="f" id="tf"><div class="ch jg dark" id="kindg">'+['I','II'].map(k=>'<button type="button" data-kind="'+k+'" aria-pressed="'+(form.kind===k)+'">TOPIK '+k+'</button>').join('')+'</div>'
      +'<div class="two"><label>회차<span class="in"><span>제</span><input id="round" inputmode="numeric" placeholder="105" value="'+esc(form.round)+'"><span>회</span></span></label><label>성적 발표일<span class="in"><input id="on" type="date" max="2026-11-28" value="'+esc(form.on)+'"></span></label></div>'
      +'<label>급수<div class="ch jg dark" id="lvg">'+lv.map(v=>'<button type="button" data-lv="'+v+'" aria-pressed="'+(Number(form.level)===v)+'">'+A.levelText(v)+'</button>').join('')+'</div></label>'
      +'<p class="pv" id="pv">'+pv+'</p><button class="save" type="submit">성적 저장</button></form></div>';
    if(recs.length)h+='<div class="sec"><h3>넣은 성적</h3><ul class="recs">'+recs.map(x=>'<li><span>TOPIK '+x.kind+' 제'+x.round+'회 · '+A.levelText(x.level)+'<em>발표 '+A.ymd(x.on)+' · '+(x.state==='expired'?'만료':A.ymd(x.expires)+'까지')+'</em></span><button type="button" data-del="'+x.id+'">지우기</button></li>').join('')+'</ul></div>';
  }
  $('#dr').innerHTML=h;jelly($('#kindg'),'kind');jelly($('#lvg'),'lv');
}
function render(){
  document.body.dataset.view=view();
  $('#nav-students').toggleAttribute('aria-current',view()==='students');
  $('#nav-class').toggleAttribute('aria-current',view()==='class');
  if(view()==='students'){renderStudents();renderRailStudents();}else{renderClass();renderDock();renderRailClass();}
  renderDrawer();
}
addEventListener('hashchange',()=>{picked.clear();open=null;openStay=null;render();scrollTo(0,0);});
A.on(why=>{render();});
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o&&!o.disabled){open=o.dataset.open;openStay=null;form={kind:'II',round:'',level:4,on:''};renderDrawer();return;}
  const cd=e.target.closest('.card');if(cd){const id=cd.dataset.id;picked.has(id)?picked.delete(id):picked.add(id);renderClass();renderDock();return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.branch){branch=b.dataset.branch;render();return;}
  if(b.dataset.stage){stage=stage===b.dataset.stage?null:b.dataset.stage;render();return;}
  if(b.dataset.goclass){location.hash='#class';return;}
  if(b.dataset.alert){if(b.dataset.akind==='learner'){const id=b.dataset.alert;location.hash='#class';setTimeout(()=>{open=id;renderDrawer();},0);return;}if(b.dataset.akind==='other'){toast('B반은 예시라 열리지 않아요');return;}openStay=b.dataset.alert;open=null;stayForm=null;renderRailStudents();renderDrawer();return;}
  if(b.dataset.bulk){const note=$('#bulknote')?.value.trim();for(const id of picked){if(A.eff(id).status!==b.dataset.bulk)A.setStatus(id,b.dataset.bulk);if(note)A.setNote(id,note);}toast(picked.size+'명을 '+A.STATUS[b.dataset.bulk].ko+'으로 골랐어요');picked.clear();render();return;}
  if(b.dataset.clear){picked.clear();renderClass();renderDock();return;}
  if(b.dataset.pickall){for(const l of A.shared())picked.add(l.id);renderClass();renderDock();return;}
  if(b.id==='all'){const n=A.allPresent();toast(n+'명을 출석으로 골랐어요. 다른 학생만 바꿔요');return;}
  if(b.id==='save'){const n=A.save();if(n)toast(n+'명의 출결을 저장했어요');return;}
  if(b.dataset.d){const i=dates.indexOf(A.state.date)+Number(b.dataset.d);if(i>=0&&i<dates.length){picked.clear();A.setDate(dates[i]);}return;}
  if(b.dataset.close){open=null;openStay=null;render();return;}
  if(b.dataset.kind){form.kind=b.dataset.kind;form.level=form.kind==='I'?2:4;renderDrawer();return;}
  if(b.dataset.lv){form.level=Number(b.dataset.lv);renderDrawer();return;}
  if(b.dataset.del){if(confirm('이 성적을 지울까요?'))A.removeTopik(open,b.dataset.del);return;}
});
document.addEventListener('input',e=>{if(e.target.id==='round'){form.round=e.target.value.replace(/\D/g,'').slice(0,3);e.target.value=form.round;}if(e.target.id==='uniAtt'){stayForm.uniAtt=e.target.value.replace(/\D/g,'').slice(0,3);e.target.value=stayForm.uniAtt;}});
document.addEventListener('change',e=>{if(e.target.id==='on'){form.on=e.target.value;renderDrawer();}if(e.target.id==='stayOn'){stayForm.stay=e.target.value;renderDrawer();}if(e.target.id==='visa')stayForm.visa=e.target.value;if(e.target.id==='uniAtt')renderDrawer();});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='sf'){const s=A.stay(openStay);A.saveStay(openStay,{stay:stayForm.stay,visa:stayForm.visa,uniAtt:stayForm.uniAtt===''?null:Number(stayForm.uniAtt)});stayForm=null;toast(s.ko+' 재학 기록을 저장했어요');return;}
  if(!form.round||!/^\d{4}-\d{2}-\d{2}$/.test(form.on)){$('#pv').innerHTML='<span class="bad">회차와 성적 발표일을 넣어 주세요.</span>';return;}A.addTopik(open,form);toast('TOPIK '+form.kind+' 제'+form.round+'회 성적을 넣었어요');form={kind:'II',round:'',level:4,on:''};renderDrawer();});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select'))return;
  if(e.key===' '&&e.target.classList?.contains('card')){e.preventDefault();e.target.click();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#save')?.click();}
  if(e.key==='Escape'){if(open||openStay){open=null;openStay=null;renderDrawer();}else{picked.clear();renderClass();renderDock();}}
});
render();
mountRefs([

  ['학생 관리는 반 카드와 살필 학생','flex 근태 대시보드 · Notion Calendar 옆 칸','왼쪽은 오늘 반 카드(출석 막대 · 결석 · 지각 · 「반에서 출결 찍기」), 오른쪽은 급한 차례의 살필 학생. 학생을 누르면 서랍이 열린다.'],
  ['여럿 골라 한 번에 찍기','Brightwheel 출석 모드(Select All → Check In · Absent)','학생 카드를 누르면 고른 것이 되고, 아래 띠에서 출석 · 지각 · 결석 · 공결과 사유를 한 번에 넣는다.'],
  ['카드 격자와 지난 6회 막대','Class Charts 좌석표 · Arbor 지난 기록','이름, 지난 6회 출결(출석은 옅은 초록, 예외만 진한 색), 오늘 상태, 맨 아래 TOPIK 줄.'],
  ['만료까지 가는 막대','flex 목표 진척 막대','90일을 꽉 찬 막대로 보고 남은 날만큼만 칠한다. 날짜는 연도까지 적는다.'],
  ['학생 한 명의 길 네 칸','클래스업 단계 · 학생 관리 설계 2절','어학원 재원 → 유학 수속 → 입국 · 정착 → 한국 재학. 칸을 누르면 오른쪽 목록이 그 단계만 남는다.'],
]);

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔리오 사무실 스킨 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}

/* 짜임: 검정 구 클라이언트의 솔리오 방 하나다. 맨 위 문장이 결론을 말하고, 왼쪽에 사무실, 오른쪽에 부서 줄을 둔다.
   직원은 구의 작은 분신이다. 색은 하나이고, 급한 것만 밝다. */
:root{
  color-scheme:dark;
  --void:#000000;
  --paper:#F3F1EC;
  --dim:rgba(243,241,236,.46);
  --hair:rgba(243,241,236,.10);
  --hair-strong:rgba(243,241,236,.20);
  --ring:rgba(243,241,236,.55);
  --pit:#0C0C0B;
  --sheet:#FFFFFF;
  --sheet-ink:#151514;
  --sheet-dim:#6B6A66;
  --sheet-rule:#E7E5E0;
  --meta-bg:rgba(10,10,10,.84);
  --sans:'SUIT Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:300 clamp(25px,min(3.5cqw,5.6cqh),54px)/1.3 var(--sans);
  --body:400 16px/1.25 var(--sans);
  --small:400 13px/1.3 var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);overflow:hidden;display:grid;place-items:center;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 무대가 곧 창이다. 안의 것은 무대의 크기를 보고 놓인다 */
#stage{position:relative;width:var(--sw,100%);height:var(--sh,100%);max-width:100%;max-height:100%;min-height:240px;overflow:hidden;background:var(--void);user-select:none;-webkit-user-select:none;cursor:default;container-type:size;container-name:stage}
body.sized #stage{outline:1px solid var(--hair)}
#floor{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 왼쪽 위의 구와 이 공간의 프로그램 */
.here{position:absolute;z-index:2;left:calc(clamp(20px,9.5cqw,168px) - 9px);top:clamp(12px,3.4cqh,38px);display:flex;align-items:center;gap:6px}
#orb-btn{width:44px;height:44px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer}
#here-name{padding:10px 8px 10px 0;display:inline-flex;align-items:center;gap:9px;font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7)}
#here-name svg{width:8px;height:5px;flex:none;opacity:.7}
.rail{display:flex;align-items:center;gap:2px;margin-left:18px}
.obj{appearance:none;background:none;border:0;margin:0;padding:10px 8px;display:inline-flex;align-items:center;color:rgba(243,241,236,.46);cursor:pointer;border-radius:2px;transition:color .25s ease}
.obj svg{width:18px;height:18px;flex:none}
.obj-n{max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;font:400 13px/1.3 var(--sans);letter-spacing:.03em;transition:max-width .46s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms),margin-left .46s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms),opacity .3s ease calc(var(--k) * 70ms)}
.rail:hover .obj-n,.obj[aria-current="true"] .obj-n,.obj:focus-visible .obj-n{max-width:9em;margin-left:9px;opacity:1}
.obj[aria-current="true"],.obj:hover,.obj:focus-visible{color:var(--paper)}
:is(.obj,#orb-btn,.quiet,.go,.reread):focus-visible{outline:1px solid var(--ring);outline-offset:3px}

/* 방: 한 문장, 그 아래에 사무실과 부서 줄 */
.room{position:absolute;left:clamp(20px,9.5cqw,168px);right:clamp(20px,9.5cqw,168px);top:clamp(92px,21cqh,196px);max-height:calc(100% - clamp(92px,21cqh,196px) - 30px);overflow-y:auto;scrollbar-width:none;padding-bottom:34px;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
.say{margin:0;font:var(--display);letter-spacing:-.018em;max-width:21em;text-wrap:balance}
.say .then{display:block;color:var(--dim)}
.office{margin-top:clamp(22px,4.6cqh,52px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);column-gap:clamp(22px,3.6cqw,60px);align-items:start}
/* 사무실이 놓이는 자리. 그림은 뒤의 캔버스가 이 자리에 맞춰 그린다. 줄이 펼쳐져 방이 길어져도 제자리에 있다 */
#slot{position:sticky;top:0;height:clamp(230px,54cqh,540px);min-width:0}

.rows{display:grid;grid-template-columns:minmax(76px,auto) minmax(0,1fr) auto;column-gap:18px;min-width:0}
.row{display:grid;grid-column:1 / -1;grid-template-columns:subgrid;align-items:center;padding:15px 0;border-top:1px solid var(--hair);color:var(--dim);transition:color .25s ease}
button.row{appearance:none;background:none;border:0;border-top:1px solid var(--hair);border-radius:0;margin:0;width:100%;text-align:left;font:inherit;cursor:pointer}
button.row:focus-visible{outline:1px solid var(--ring);outline-offset:-1px}
.row.now,button.row:hover,button.row.opened,button.row.hot{color:var(--paper)}
.nm{font:var(--body);white-space:nowrap}
.nm small{display:block;margin-top:4px;font:var(--small);color:var(--dim)}
.mid{min-width:0;font:var(--small);color:var(--dim);transition:color .25s ease}
button.row .mid{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .mid,button.row:hover .mid,button.row.opened .mid{color:rgba(243,241,236,.84)}
.val{font:var(--small);text-align:right;white-space:nowrap}
.row.now .val{font-weight:500}
.when{font:var(--small);font-variant-numeric:tabular-nums;text-align:right;color:var(--dim);white-space:nowrap}
/* 줄의 안쪽: 다가가면 그 줄 아래로 차례로 펼쳐진다 */
.more{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;grid-template-rows:0fr;transition:grid-template-rows .46s cubic-bezier(.2,.8,.2,1)}
.more.open{grid-template-rows:1fr}
.more-in{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;align-content:start;min-height:0;overflow:hidden}
.more-in > *{grid-column:1 / -1;opacity:0;transform:translateY(-7px);transition:opacity .14s ease,transform .14s ease}
.more.open .more-in > *{opacity:1;transform:none;transition:opacity .34s ease calc(70ms + var(--j,0) * 50ms),transform .46s cubic-bezier(.2,.8,.2,1) calc(70ms + var(--j,0) * 50ms)}
.more.snap,.more.snap .more-in > *{transition:none !important}
.more-in .row{border:0;padding:7px 0;align-items:start}
.more-in .row .mid b{display:block;font:var(--small);font-weight:400;color:rgba(243,241,236,.84)}
.more-in .row .mid small{display:block;margin-top:3px;font:var(--small);color:var(--dim)}
.row.sub.now .mid b,.row.sub.hot .mid b{color:var(--paper)}
.row.sub.hot .nm{color:var(--paper)}
.row.sub .nm{font:var(--small);color:rgba(243,241,236,.7)}
.row.sub.fact .nm{color:var(--dim)}
.more-acts{margin:0;padding:4px 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.more-acts .lab{font:var(--small);color:var(--dim)}
.more-note{margin:0;padding:0 0 12px;font:var(--small);color:var(--dim)}
.more-in > :last-child{padding-bottom:18px}
/* 부서의 기능 줄: 누르면 그 자리에서 안쪽이 열린다. 펼침은 줄의 안쪽과 같은 움직임이다 */
.fold{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;grid-template-rows:0fr;transition:grid-template-rows .46s cubic-bezier(.2,.8,.2,1)}
.fold.open{grid-template-rows:1fr}
.fold-in{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;align-content:start;min-height:0;overflow:hidden}
.fold-in > *{grid-column:1 / -1;opacity:0;transform:translateY(-7px);transition:opacity .14s ease,transform .14s ease}
.fold.open .fold-in > *{opacity:1;transform:none;transition:opacity .34s ease calc(70ms + var(--j,0) * 50ms),transform .46s cubic-bezier(.2,.8,.2,1) calc(70ms + var(--j,0) * 50ms)}
.fold.snap,.fold.snap .fold-in > *{transition:none !important}
.fold.open .fold-in > :last-child{padding-bottom:12px}
.more-in .row.item,.more-in .row.soon{padding:9px 0;align-items:center}
.row.soon .mid{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sub.item .nm{font-weight:500;color:rgba(243,241,236,.84)}
.row.sub.item:hover .nm,.row.sub.item.opened .nm{color:var(--paper)}
/* 종류가 다른 줄(이 PC) 앞에는 틈을 둔다 */
.row.gap{margin-top:clamp(14px,2.6cqh,26px)}
.more:has(+ .row.gap){border-bottom:1px solid var(--hair)}
.quiet{appearance:none;background:none;text-align:left;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;margin:0;padding:0 0 4px;font:var(--small);color:rgba(243,241,236,.8);cursor:pointer;transition:color .25s ease,border-color .25s ease}
.quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
.quiet[aria-pressed="false"]{border-bottom-color:transparent;color:var(--dim)}
.quiet[aria-pressed="true"],.quiet.warn{color:var(--paper);border-bottom-color:var(--paper)}
/* 맡기기: 글을 넣는 칸은 밑줄 한 줄, 누르는 것은 알약 */
.give{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.give input{flex:1 1 auto;min-width:0;height:36px;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;outline:0;padding:0 2px;font:400 15px/1 var(--sans);color:var(--paper);user-select:text;-webkit-user-select:text;transition:border-color .3s ease}
.give input::placeholder{color:rgba(243,241,236,.46)}
.give input:hover{border-bottom-color:rgba(243,241,236,.6)}
.give input:focus{border-bottom-color:var(--paper)}
.go{appearance:none;flex:none;height:36px;margin:0;padding:0 18px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);font:500 14px/1 var(--sans);color:var(--paper);cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.go:hover{border-color:var(--paper)}
.give:has(input:not(:placeholder-shown)) .go{background:var(--paper);border-color:var(--paper);color:var(--void)}
.read{grid-column:1 / -1;margin:0;padding-top:16px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:14px;font:var(--small);color:var(--dim)}
.reread{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.4);padding:0 0 4px;font:var(--small);color:var(--paper);cursor:pointer;border-radius:0;white-space:nowrap}
.reread:hover{border-bottom-color:var(--paper)}

/* 알림: 새 소식이 있는 부서와 직원의 이름 옆, 그리고 위쪽 「사무실」 오브제에 느낌표가 붙는다.
   색은 쓰지 않는다(유호님 11-19 「느낌표만」) */
.flag{display:inline-block;margin-left:7px;font:700 13px/1 var(--sans);color:var(--paper)}
.flag.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.obj{position:relative}
.obj.news::after{content:'!';position:absolute;left:26px;top:4px;font:700 11px/1 var(--sans);color:var(--paper)}

/* 스킨 가게(11-23 시안): 사무실 그림이 곧 진열대다. 줄을 누르면 그 스킨이 지금 사무실에 먼저 입혀진다.
   색은 사무실 그림과 줄 앞의 작은 견본에만 있다. 글과 줄, 단추는 이 방의 한 색 그대로이고, 흰 알약은 결정(사기, 쓰기)에만 쓴다 */
.shop-top{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 0 16px}
.shop-top .lab{font:var(--small);color:var(--dim)}
.shop-tabs{display:flex;flex-wrap:wrap;gap:6px 20px}
.pick-row{grid-column:1 / -1;margin:0;padding:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.pick-row .lab{font:var(--small);color:var(--dim)}
.pick-note{grid-column:1 / -1;margin:0;padding:0 0 16px;font:var(--small);color:var(--dim)}
.row.skin .nm{display:inline-flex;align-items:center}
#stage.shopping .room{top:calc(clamp(76px,12cqh,118px) - 22px);max-height:calc(100% - clamp(76px,12cqh,118px) + 22px);padding-top:22px;-webkit-mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 30px),transparent)}
#stage.shopping .say{font:300 clamp(22px,min(2.3cqw,4.4cqh),34px)/1.3 var(--sans)}
#stage.shopping .office{margin-top:clamp(14px,2.4cqh,28px);grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr)}
#stage.shopping #slot{height:clamp(260px,68cqh,680px)}
/* 가게의 줄은 누르면 입혀 보는 자리라 설명 글보다 밝다 */
button.row.skin{color:rgba(243,241,236,.84)}
button.row.skin .mid{color:rgba(243,241,236,.6);white-space:normal;overflow:visible;text-overflow:clip}
.skin-sw{flex:none;width:60px;height:40px;margin-right:14px;border-radius:2px}
.row.skin .val{font-variant-numeric:tabular-nums}
.row.skin.worn .val{color:var(--paper)}
.buy{appearance:none;flex:none;height:36px;margin:0;padding:0 18px;border:1px solid var(--paper);border-radius:999px;background:var(--paper);font:500 14px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--void);cursor:pointer;transition:background-color .25s ease}
.buy:hover{background:#fff}
.buy:focus-visible,.back:focus-visible{outline:1px solid var(--ring);outline-offset:3px}
.paying{display:inline-flex;align-items:center;gap:10px;font:var(--small);color:rgba(243,241,236,.84)}
.shop-note{grid-column:1 / -1;margin:0;padding:14px 0 0;border-top:1px solid var(--hair);font:var(--small);color:var(--dim)}
.shop-note + .shop-note{border-top:0;padding-top:6px}

[hidden]{display:none !important}

/* 기획부 「사업계획서」 작업 화면(11-23): 검은 방 위에 흰 계획서 한 장이 주인공이다.
   종이 옆에 직원의 메모가 그 문단 높이에 붙고, 고른 메모 하나만 단추를 보인다. 색은 결정 단추(흰 알약)에만 쓴다 */
/* 작업 화면에서는 맨 위 문장을 줄이고 방을 위로 올려 계획서가 한 화면에 더 많이 보이게 한다 */
/* 종이 아래끝을 검게 덮던 아래 흐림을 빼고, 올라간 글이 잘린 조각으로 남지 않게 위쪽만 22px 흐린다 */
#stage.planning .room{top:calc(clamp(76px,12cqh,118px) - 22px);max-height:calc(100% - clamp(76px,12cqh,118px) + 22px);padding-top:22px;padding-bottom:28px;-webkit-mask-image:linear-gradient(transparent,#000 22px);mask-image:linear-gradient(transparent,#000 22px)}
#stage.planning .say{font:300 clamp(22px,min(2.3cqw,4.4cqh),34px)/1.3 var(--sans)}
.work{margin-top:clamp(16px,2.6cqh,30px);padding-bottom:20px}
.work-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:clamp(16px,2.6cqh,26px)}
.back{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;padding:0 0 4px;font:var(--small);color:rgba(243,241,236,.8);cursor:pointer}
.back:hover{color:var(--paper);border-bottom-color:var(--paper)}
.who{display:inline-flex;align-items:center;gap:9px;min-width:0;font:var(--small);color:rgba(243,241,236,.72)}
.who b{font-weight:500;color:var(--paper)}
.mini{position:relative;flex:none;width:20px;height:20px;border-radius:50%;background:#000;border:1px solid rgba(243,241,236,.5)}
.mini::before,.mini::after{content:'';position:absolute;top:7.5px;width:2.5px;height:2.5px;border-radius:50%;background:var(--paper)}
.mini::before{left:5.5px}.mini::after{right:5.5px}
.mini.on{animation:rim 3.2s ease-in-out infinite}
@keyframes rim{50%{border-color:rgba(243,241,236,.95)}}
.call{padding:12px 0 14px;border-top:1px solid var(--hair-strong)}
.call .pg{display:block;font:400 12px/1.3 var(--sans);color:var(--dim)}
.call p{margin:3px 0 0;font:var(--small);color:rgba(243,241,236,.72)}
.call p b{font:500 15px/1.4 var(--sans);color:var(--paper)}
.items{display:grid;gap:7px;margin:12px 0 0;padding:0;list-style:none;font:var(--small);color:rgba(243,241,236,.84)}
.items li{display:inline-flex;align-items:center;gap:7px}
.items li i{width:5px;height:5px;border-radius:50%;background:rgba(243,241,236,.7)}
.items li small{font:inherit;color:var(--dim)}
.items li.weak{color:var(--paper);font-weight:500}
.items li.weak i{width:10px;height:1.5px;border-radius:0;background:var(--paper)}
.items li.weak small{color:rgba(243,241,236,.84);font-weight:400}
.desk{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);column-gap:clamp(22px,3.4cqw,56px);row-gap:20px;align-items:start}
/* 계획서 종이 */
.sheet{display:block;background:var(--sheet);color:var(--sheet-ink);border-radius:2px;padding:clamp(22px,3cqw,40px) clamp(22px,3.4cqw,46px) clamp(14px,2cqw,24px);box-shadow:0 30px 70px -24px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04)}
.sheet-h{padding-bottom:16px}
.sheet-h small{font:400 12px/1.3 var(--sans);color:var(--sheet-dim)}
.sheet-h h3{margin:8px 0 4px;font:600 clamp(20px,2cqw,24px)/1.25 var(--sans);letter-spacing:-.01em}
.sheet-h p{margin:0;font:400 14px/1.4 var(--sans);color:var(--sheet-dim)}
.sec{position:relative;padding:15px 0 16px;border-top:1px solid var(--sheet-rule);transition:opacity .45s ease}
.sec .pg{display:block;font:400 12px/1.3 var(--sans);color:var(--sheet-dim)}
.sec h4{margin:5px 0 6px;font:600 15px/1.4 var(--sans)}
.sec p{margin:0;font:400 15px/1.7 var(--sans);color:#2b2a27}
.sec.unread{opacity:.2}
.sec.has{cursor:pointer}
.sec.has::before{content:'';position:absolute;left:-17px;top:21px;width:5px;height:5px;border-radius:50%;background:var(--sheet-ink)}
.sec.on::before{top:15px;bottom:16px;left:-15px;width:2px;height:auto;border-radius:0}
.sec.changed p{animation:settle .9s cubic-bezier(.2,.8,.2,1)}
@keyframes settle{from{opacity:0;transform:translateY(5px)}}
/* 메모 */
.notes{position:relative;min-width:0}
.notes.side > *{position:absolute;left:0;right:0;transition:top .38s cubic-bezier(.2,.8,.2,1)}
.note{padding:12px 0 14px;border-top:1px solid var(--hair-strong)}
.note .pg{display:block;font:400 12px/1.3 var(--sans);color:var(--dim)}
.note .what{display:block;margin:4px 0 0;padding:0;background:none;border:0;text-align:left;font:400 15px/1.45 var(--sans);color:rgba(243,241,236,.78);cursor:pointer}
.note button.what:hover{color:var(--paper)}
.note .what .arw{color:var(--dim);transition:color .25s ease}
.note button.what:hover .arw{color:var(--paper)}
.picked{margin:12px 0 0;font:var(--small);color:rgba(243,241,236,.72)}
.note .why{margin:5px 0 0;font:400 13px/1.55 var(--sans);color:var(--dim)}
.note.sel{border-top-color:var(--paper)}
.note.sel .what{font-size:17px;font-weight:500;color:var(--paper);cursor:default}

.note .acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:13px}
.note .lab{font:var(--small);color:var(--dim)}
.pill{appearance:none;display:inline-flex;align-items:center;height:38px;margin:0;padding:0 18px;border:1px solid var(--paper);border-radius:999px;background:var(--paper);font:500 14px/1 var(--sans);color:#000;cursor:pointer;white-space:nowrap}
.pill:hover{background:#fff}
.pill.ghost{background:none;border-color:rgba(243,241,236,.42);color:var(--paper)}
.pill.ghost:hover{border-color:var(--paper)}
.pill.small{height:34px;padding:0 14px;font-weight:400}
.pill.dark{border-color:rgba(21,21,20,.4);color:var(--sheet-ink)}
:is(.pill,.back,.note .what,.sec.has):focus-visible{outline:1px solid var(--ring);outline-offset:3px}
.prop{margin-top:12px;padding:12px 14px;border:1px solid var(--hair-strong);border-radius:2px}
.prop p{margin:0;font:400 14px/1.6 var(--sans);color:var(--paper)}
.prop p + p{margin-top:8px;padding-top:8px;border-top:1px dashed var(--hair-strong)}
.prop p:first-child:not(:last-child){color:var(--dim)}
.prop small{display:block;font:400 12px/1.3 var(--sans);color:var(--dim)}
.draft.reveal .s{animation:sIn .45s ease both;animation-delay:calc(var(--k) * 420ms)}
@keyframes sIn{from{opacity:0}}
.state{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font:400 14px/1.5 var(--sans);color:rgba(243,241,236,.86)}
.talk{margin-top:12px}
.talk .q{display:flex;gap:9px;align-items:flex-start;margin:0;font:400 14px/1.5 var(--sans);color:var(--dim)}
.talk .q.now{color:var(--paper)}
.talk .a{margin:4px 0 10px 29px;font:500 14px/1.4 var(--sans);color:rgba(243,241,236,.86)}
.talk .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 29px}

.sheet.blank{display:grid;place-items:center;min-height:clamp(300px,50cqh,480px);cursor:pointer;text-align:center;outline:1px dashed #CFCAC0;outline-offset:-18px;transition:box-shadow .25s ease}
.sheet.blank:hover{outline-color:#8F8B83}

.blank-in small{font:400 13px/1.55 var(--sans);color:var(--sheet-dim)}

.start-side select:hover{border-color:rgba(243,241,236,.6)}
.start-side select:focus-visible{outline:1px solid var(--ring);outline-offset:3px}
.start-side .why{margin:2px 0 0;font:400 13px/1.6 var(--sans);color:rgba(243,241,236,.66)}
.start-side .acts{margin-top:6px}
.start-side .hint{margin:0;font:var(--small);color:var(--paper)}
@container stage (max-width:860px){

}
@media (prefers-reduced-motion:reduce){
  .mini.on,.note.new,.sec.changed p,.draft.reveal .s{animation:none !important}
  .sec,.notes.side > *{transition:none !important}
}

@container stage (max-width:860px){
  .office{grid-template-columns:minmax(0,1fr);row-gap:22px}

  #stage.shopping .office{grid-template-columns:minmax(0,1fr)}

<script>

const DEPTS = [

const PCS = [{cores:16, ram:32, load:38, free:19}, {cores:24, ram:64, load:22, free:41}, {cores:4, ram:8, load:61, free:2.6}, {cores:8, ram:16, load:44, free:7}];

const TOOLS = ['Claude Code', 'Codex'], short = t => t === 'Codex' ? 'Codex' : 'Claude';
let pi = 0, sbi = 0, queue = {}, queueWhy = {}, sayHold = null;
const subOf = t => SUBCASES[sbi][t];
const pcCap = () => Math.max(1, Math.min(Math.floor(PCS[pi].cores / 2), Math.floor(PCS[pi].ram / 4)));

function fitToPC(list) {
  queue = {}; queueWhy = {};
  const cap = CAP(), per = {}, out = [], byTool = {}; let n = 0;
  const pri = s => s.state === 'ask' || s.dept === 'lobby' ? 0 : busy(s) ? 1 : 2;

    const d = s.dept, active = s.state === 'ask' || busy(s), held = active && d !== 'lobby' && s.state !== 'ask'; per[d] = per[d] || 0;
    const why = per[d] >= SEATS(deptOf(d)) || (held && n >= cap) ? 'pc' : held && (byTool[s.tool] || 0) >= toolCap(s.tool) ? s.tool : null;

  }

}

/* 경쟁사 살펴보기: 마케팅부가 정해 둔 곳의 공개된 쪽을 매주 다시 읽고, 지난번과 달라진 것만 말한다(이름과 값은 모두 예시).

const MISS = '한뼘상점의 후기는 로그인이 필요해 읽지 않았습니다';
const SCOUTS = [
  {head:'한 곳이 바뀌었습니다', when:'월 09:02', who:'온결상점', what:'기본 묶음을 39,000원에서 29,000원으로 내렸습니다', src:'가격 쪽 · onkyeol.example', rest:'한뼘상점과 두루상점은 지난번과 같습니다'},

  const order = DEPTS.filter(d => !d.lobby || staff.some(s => s.dept === 'lobby')).map(d => ({d, r:rectOf(d)})).sort((a, b) => P0(0, 0, a.r.z0)[2] - P0(0, 0, b.r.z0)[2]);

  const kD = {}, yD = {};

    const k = A === B ? 1 : d.lobby ? k0 : kOf(1 + i, now);
    const sl = (SK[A].slab * (1 - k) + SK[B].slab * k) * t3, y = d.lobby ? 0 : sl;

  });

  const list = [];
  for (const s of staff) {

    const y = base + R0 + L.lift * (.25 + .75 * t3);

    orbInk = mixRGB(SK[A].rim, SK[B].rim, k); bangInk = SK[near].bang; rimBoost = SK[near].boost || 1;

}
let mb = 0, mbNext = performance.now() + 3000;
function mainBlink(now) { if (mb > 0) mb = Math.max(0, mb - .12); else if (now > mbNext && !still) { mb = 1; mbNext = now + 2600 + Math.random() * 4200; } return mb; }

/* 사무실 위에서의 손: 부서에 다가가면 그 부서의 줄이 열리고, 직원을 가리키면 그 직원의 줄이 밝아진다 */
function inside(pts, x, y) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSE 시안 · 의뢰서 C 솔리오 안내</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./공통.css">
<style>
/* 컨셉: 솔리오가 옆에서 지금 할 일 하나를 짚어 주고, 손님은 그 한 가지만 답한다
   (유호님 11-25 「솔리오가 나와서 직접 움직이면서 가이드」 · 「너무 크게 사진이랑 영상이 있어서 눈아프다」).
   강조 순위: ① 지금 질문(두 톤 제목)과 솔리오의 한마디 ② 고를 칸 ③ 오른쪽 작은 「내 광고」 카드와 값 · 단추.
   참고: Duolingo 첫 설정(캐릭터가 질문 옆에서 한 줄로 묻는다) · Apple 구입 구성기(오른쪽 요약 · 값) · 솔리오 앱의 작은 구.
   움직임: 질문이 바뀔 때만 솔리오가 그 옆으로 한 번 미끄러져 온다. 그 밖에는 눈만 움직인다. 구르거나 모양이 바뀌지 않는다(11-20 멀미).
   글자 역할: 질문 SUIT 700 두 톤 · 솔리오의 말 SUIT 400 먹 · 광고 속 글 명조 300 · 값 숫자 고정폭. 색 역할: 먹 · 흐림, 색은 손님 사진만. */
:root{--bg:#060606;--ink:#f4f1ea;--dim:rgba(244,241,234,.5);--faint:rgba(244,241,234,.32);--line:rgba(244,241,234,.12);--card:#0f0f0f;--card2:#171717}
body{background:var(--bg);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1300px;margin:0 auto;padding:26px 40px 0}
.logo{height:20px;width:auto}
.top a{font-size:14px;color:var(--dim)}
.app{display:grid;grid-template-columns:220px minmax(0,580px) 300px;gap:56px;justify-content:center;max-width:1300px;margin:0 auto;padding:0 40px 96px}

/* 솔리오: 왼쪽 레일에서 지금 질문 옆에 선다 */
.rail{position:relative}
.solio{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:12px;transform:translateY(var(--y,0px));transition:transform .75s var(--ease)}
.orb{position:relative;flex:none;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.22),rgba(255,255,255,0) 16%),radial-gradient(circle at 50% 36%,#1d1d1d,#040404 74%);
  box-shadow:inset 0 0 0 1px rgba(244,241,234,.2),inset 0 -6px 12px rgba(244,241,234,.05),0 12px 28px rgba(0,0,0,.75)}
.eyes{position:absolute;left:50%;top:47%;display:flex;gap:6px;transform:translate(calc(-50% + var(--ex,0px)),calc(-50% + var(--ey,0px)));transition:transform .28s var(--ease)}
.eyes i{display:block;width:5px;height:5px;border-radius:50%;background:var(--ink);transition:height .08s}
.solio.blink .eyes i{height:1px}
.solio.happy .eyes i{width:8px;height:4px;background:none;border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0}
.solio.nod .orb{animation:nod .34s var(--ease)}
@keyframes nod{45%{transform:translateY(3px)}}
.say{position:relative;margin:0;padding:13px 15px;border-radius:14px;background:var(--card2);font-size:14.5px;line-height:1.6;letter-spacing:-.01em;transition:opacity .18s}
.say::before{content:'';position:absolute;left:20px;top:-5px;width:11px;height:11px;background:var(--card2);transform:rotate(45deg);border-radius:2px}
.say.out{opacity:0}

/* 가운데: 질문 */
.ask{display:flex;flex-direction:column;min-width:0}
.intro{padding:64px 0 20px}
.intro h1{margin:0;font-family:var(--sans);font-weight:700;font-size:clamp(30px,2.6vw,40px);line-height:1.2;letter-spacing:-.04em}
.intro h1 span,.sec h2 span,.sheet h1 span{color:var(--dim)}
.sec{padding:34px 0;border-top:1px solid var(--line);transition:opacity .3s}
.sec h2{margin:0 0 16px;font-size:clamp(20px,1.6vw,24px);font-weight:700;line-height:1.35;letter-spacing:-.03em}
.sec[data-locked]{opacity:.28;pointer-events:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;min-height:64px;padding:12px 18px;border:1px solid rgba(244,241,234,.2);border-radius:14px;text-align:left;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(244,241,234,.45)}
.opt[aria-checked=true]{border:2px solid var(--ink);padding:11px 17px;background:rgba(244,241,234,.04)}
.opt .t b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
.opt .t small{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.4}
.opt .won{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.opt[aria-checked=true] .won{color:var(--ink)}
.input{width:100%;background:var(--card);border:1px solid rgba(244,241,234,.2);border-radius:14px;padding:18px;font-size:18px;color:var(--ink);outline:none}
.input:focus{border:2px solid var(--ink);padding:17px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:14px;border-radius:14px;background:var(--card);text-align:left;overflow:hidden;transition:background .2s}
.drop:hover{background:var(--card2)}
.drop b{font-size:15px;font-weight:600}
.drop small{font-size:12px;color:var(--dim)}
.drop .need{position:absolute;left:14px;top:12px;font-size:12px}
.drop .add{position:absolute;right:14px;top:10px;font-size:20px;line-height:1;color:var(--dim)}
.drop.is-in img{position:absolute;right:10px;top:10px;width:44px;height:44px;object-fit:contain;border-radius:8px;background:#000}
.drop.is-in .add,.drop.is-in .need{display:none}
.drop.is-in::after{content:'받았어요';position:absolute;left:14px;top:12px;font-size:12px}
.drop.is-need:not(.is-in){box-shadow:inset 0 0 0 1px var(--ink)}
.drop.is-need:not(.is-in) .add{color:var(--ink)}
.drop:not(.is-need):not(.is-in) b{font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:40px;padding:0 15px;border:1px solid rgba(244,241,234,.2);border-radius:999px;font-size:14px;transition:.2s}
.chip[aria-pressed=true]{background:var(--ink);color:#0b0b0b;border-color:var(--ink)}
.more{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.more label{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--dim)}
.more textarea,.more input{background:var(--card);border:1px solid rgba(244,241,234,.2);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);outline:none;min-height:46px}
.more textarea:focus,.more input:focus{border-color:var(--ink)}
.toggle{margin-top:12px;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.consent{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--dim)}
.consent input{accent-color:#f4f1ea;width:18px;height:18px}

/* 오른쪽: 작은 「내 광고」 카드와 값 */
.side{position:relative}
.card{position:sticky;top:28px;margin-top:64px;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:18px;background:var(--card)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}
.card-h b{font-size:15px;color:var(--ink);font-weight:600}
.mini{container-type:inline-size;position:relative;flex:none;align-self:center;width:128px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px var(--line);transition:width .5s var(--ease)}
.mini[data-ratio="16:9"]{width:100%;aspect-ratio:16/9}
.mini[data-ratio="1:1"]{width:170px;aspect-ratio:1/1}
.cut{position:absolute;inset:0}
.cut img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cut .tag{position:absolute;left:7%;top:6%;max-width:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.5);padding:2px 6px}
.cut.is-title,.cut.is-empty{display:grid;place-items:center;text-align:center;padding:0 10%;background:radial-gradient(120% 90% at 50% 30%,#1a1a1a,#050505)}
.cut.is-title p{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(11px,10cqw,22px);line-height:1.3;letter-spacing:-.03em}
.cut.is-empty p{margin:0;font-size:11px;line-height:1.6;color:var(--faint)}
.cut.is-end{display:grid;place-content:center;justify-items:center;gap:6px;background:#050505;text-align:center;padding:0 8%}
.cut.is-end .lg{font-family:var(--latin);font-weight:650;font-size:clamp(10px,10cqw,22px);letter-spacing:-.03em}
.cut.is-end .ln{font-family:var(--serif);font-weight:300;font-size:clamp(9px,7cqw,15px)}
.cut.is-end .info{font-family:var(--mono);font-size:clamp(8px,5cqw,11px);color:var(--dim)}
.cut.is-end .info.is-ex{padding:2px 8px;border:1px dashed rgba(255,255,255,.3);border-radius:4px;color:var(--faint)}
@container (max-width:80px){.cut p,.cut .tag,.cut.is-end span{display:none}}
.mini.g-moved img{filter:saturate(.82) sepia(.12)}
.mini.g-wow img{filter:contrast(1.14) saturate(1.1)}
.mini.g-laugh img{filter:saturate(1.3) brightness(1.06)}
.sumlist{margin:0;font-size:13px}
.sumlist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.sumlist dt{color:var(--dim);flex:none}
.sumlist dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumlist dd.empty{color:var(--faint)}
.price{display:flex;flex-direction:column;gap:2px;min-width:0}
.price small{font-size:12px;color:var(--dim)}
.price b{font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price s{font-size:14px;color:var(--faint);text-decoration-thickness:1px}
.price .code{font-size:12px}
.price .left{font-size:12px;color:var(--dim);margin-top:4px}
.go{flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 24px;background:var(--ink);color:#0b0b0b;font-weight:700;font-size:16px;border-radius:999px;letter-spacing:-.02em;transition:opacity .2s,transform .2s var(--ease)}
.go:hover{transform:translateY(-1px)}
.go[disabled]{opacity:.3;transform:none}
.go .icon{width:18px;height:18px}
.card .go{width:100%}

/* 확인 · 결제(가운데 같은 자리) */
.sheet{padding:64px 0 0}
.sheet h1{margin:0 0 22px;font-family:var(--sans);font-weight:700;font-size:clamp(28px,2.4vw,38px);letter-spacing:-.04em;line-height:1.2}
.lines{display:flex;flex-direction:column;margin:0;border-top:1px solid var(--line)}
.lines div{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.lines dt{color:var(--dim)}
.lines dd{margin:0}
.lines button{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.total{margin-top:18px;padding:18px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.total .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.total .ln b{color:var(--ink);font-weight:600}
.total .ln.code{color:var(--ink)}
.codein{display:flex;gap:8px;margin-top:4px}
.codein input{flex:1;background:var(--card);border:1px solid rgba(244,241,234,.2);border-radius:12px;padding:12px 14px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);outline:none}
.codein button{padding:0 18px;border-radius:12px;border:1px solid rgba(244,241,234,.2);font-size:14px}
.pay-opts{margin-top:18px}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);margin-bottom:12px}
.status i{width:8px;height:8px;background:var(--busy)}
.test{font-size:13px;color:var(--new);margin:-8px 0 18px}

.mock{position:fixed;left:50%;transform:translateX(-50%);top:18px;z-index:90;display:flex;gap:4px;align-items:center;padding:5px;border-radius:10px;background:rgba(28,28,28,.92);font-size:12px;color:#ddd;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.mock button,.mock a{padding:6px 10px;border-radius:7px;color:#ddd}
.mock button[aria-pressed=true]{background:#f4f1ea;color:#111}
.mock i{width:1px;height:16px;background:#444}
.is-shot .mock{display:none}

/* 좁은 창: 카드는 아래 띠로 */
@media (max-width:1180px){
  .app{grid-template-columns:190px minmax(0,1fr);gap:40px;padding-bottom:130px}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:20}
  .card{position:static;margin:0;flex-direction:row;align-items:center;gap:14px;padding:12px 28px calc(env(safe-area-inset-bottom) + 14px);border-radius:0;background:rgba(6,6,6,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .card-h,.sumlist{display:none}
  .mini{width:34px}.mini[data-ratio="16:9"]{width:62px}.mini[data-ratio="1:1"]{width:44px}
  .price{flex:1}
  .card .go{width:auto}
}
/* 휴대폰: 솔리오는 값 띠 바로 위에서 말한다 */
@media (max-width:760px){
  .top{padding:16px 16px 0}
  .app{grid-template-columns:1fr;padding:0 16px 200px}
  .rail{position:fixed;left:0;right:0;bottom:var(--barh,80px);z-index:19;padding:14px 16px 8px;background:linear-gradient(rgba(6,6,6,0),rgba(6,6,6,.97) 26%)}
  .solio{position:static;transform:none;flex-direction:row;align-items:center;gap:12px}
  .orb{width:40px;height:40px}
  .eyes{gap:4px}.eyes i{width:4px;height:4px}
  .say{flex:1;padding:10px 12px;font-size:13.5px;line-height:1.5}
  .say::before{left:-4px;top:50%;margin-top:-5px}
  .intro{padding:26px 0 10px}
  .sec{padding:26px 0}
  .sheet{padding:28px 0 0}
  .card{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px)}
  .go{min-height:48px;padding:0 20px}
  .price b{font-size:20px}
  .mock{top:auto;bottom:calc(var(--barh,80px) + 76px);flex-wrap:wrap;justify-content:center;max-width:94vw}
}
@media (prefers-reduced-motion:reduce){.solio,.eyes,.mini,.say{transition:none}.solio.nod .orb{animation:none}}
</style>
</head>

      <button class="opt" role="radio" aria-checked="${S.method === 'bank'}" data-m="bank"><span class="t"><b>계좌이체</b><small>입금하시면 담당자가 평일 10~19시에 확인해요</small></span><span class="won">확인 뒤 시작</span></button>
    </div>
    ${S.method === 'bank' ? `<div class="total"><div class="ln"><span>입금할 곳</span><b>○○은행 000-000000-00-000</b></div><div class="ln"><span>입금자명</span><b>P-1125-7828</b></div></div>` : ''}</div>`;
}

function render(next) {
  if (S.view === 'form') { ask.innerHTML = formHTML(); }
  if (S.view === 'review') ask.innerHTML = reviewHTML();
  if (S.view === 'pay') ask.innerHTML = payHTML();
  if (S.view === 'sent') ask.innerHTML = `<div class="sheet" data-step="sent"><p class="status"><i></i>접수했어요 · 저희 차례</p><h1>보내 주셔서 고마워요. <span>방향 두 안과 어울리는 모델을 메일로 알려 드려요.</span></h1><button class="go" data-goto-pay>결제 화면 보기(시안) ${arrow}</button></div>`;
  if (S.view === 'paid') ask.innerHTML = `<div class="sheet" data-step="paid"><p class="status"><i></i>${S.method === 'card' ? '결제 확인 · 저희 차례' : '입금 확인 중'}</p><h1>${S.method === 'card' ? '결제를 확인했어요.' : '입금을 확인하고 있어요.'} <span>${S.method === 'card' ? '받으실 날은 12월 5일이에요.' : '담당자가 입금을 확인하면 바로 시작해요.'}</span></h1></div>`;
  drawCard();
  const step = S.view === 'form' ? next || active || 'kind' : S.view;
  active = ''; setActive(step);
  requestAnimationFrame(place);
}
const go = id => { const s = $(`[data-sec="${id}"]`, ask); if (s) s.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }); setActive(id); };

function act(t) {
  if (t.dataset.kind) { const changed = S.kind !== t.dataset.kind; S.kind = t.dataset.kind; if (changed) { S.files = {}; S.len = 0; S.name = ''; } S.cut = 'title'; sound.tick(); mood('nod', 340); render('name'); go('name'); $('[data-name]', ask)?.focus({ preventScroll: true }); return; }
  if (t.dataset.file) { S.files[t.dataset.file] = true; S.cut = 'hero'; sound.shutter(); render('files'); mood('happy', 900); return; }
  if (t.dataset.chan) { S.chan = Number(t.dataset.chan); S.cut = 'hero'; sound.tick(); render('len'); mood('nod', 340); return; }
  if (t.dataset.len) { S.len = Number(t.dataset.len); sound.tick(); render('len'); mood('nod', 340); return; }
  if (t.dataset.end) { S.end = Number(t.dataset.end); S.cut = 'end'; sound.tick(); render('end'); mood('nod', 340); return; }
  if (t.dataset.feel) { S.feel = S.feel === t.dataset.feel ? '' : t.dataset.feel; sound.soft(); render('feel'); mood('nod', 340); return; }
  if (t.hasAttribute('data-avoid-open')) { S.avoidOpen = true; render('feel'); $('[data-avoid]', ask)?.focus(); return; }
  if (t.hasAttribute('data-review') && !t.disabled) { S.view = 'review'; sound.tick(); scrollTo(0, 0); render(); return; }
  if (t.hasAttribute('data-back')) { S.view = 'form'; render('kind'); return; }
  if (t.hasAttribute('data-apply')) { const v = $('[data-code]', ask).value.trim(); if (!/^[A-Za-z0-9-]{4,12}$/.test(v)) return; S.code = true; sound.shutter(); render(); mood('happy', 900); return; }
  if (t.hasAttribute('data-send')) { S.view = 'sent'; sound.shutter(); scrollTo(0, 0); render(); mood('happy', 900); return; }
  if (t.hasAttribute('data-goto-pay')) { S.view = 'pay'; S.cut = 'end'; render(); return; }
  if (t.dataset.m) { S.method = t.dataset.m; sound.tick(); render(); mood('nod', 340); return; }
  if (t.hasAttribute('data-pay')) { S.view = 'paid'; sound.shutter(); render(); mood('happy', 900); }
}
document.addEventListener('click', e => { const t = e.target.closest('button'); if (t && !t.closest('.mock') && (ask.contains(t) || card.contains(t))) act(t); });
ask.addEventListener('pointerover', e => { const o = e.target.closest('[data-kind]'); if (o && active === 'kind') say(KINDS.find(k => k.id === o.dataset.kind).tip); });
ask.addEventListener('pointerleave', () => { if (active === 'kind') say(lineFor('kind')); });
ask.addEventListener('focusin', e => { const s = e.target.closest('[data-sec]'); if (s) setActive(s.dataset.sec); });
ask.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-name]')) { S.name = t.value; S.cut = 'title'; }
  if (t.matches('[data-line]')) { S.line = t.value; S.cut = 'end'; }
  if (t.matches('[data-exact]')) { S.exact = t.value; S.cut = 'end'; }
  if (t.matches('[data-avoid]')) S.avoid = t.value;
  if (t.matches('[data-mail]')) S.mail = t.value.trim();
  drawCard(); if (active === 'mail') setActive('mail');
});
ask.addEventListener('change', e => { if (e.target.matches('[data-agree]')) { S.agree = e.target.checked; drawCard(); setActive('mail'); if (S.agree) mood('nod', 340); } });
addEventListener('resize', () => { drawCard(); place(); });

// 시안 조작 띠(손님 화면 밖)
const mock = document.createElement('nav'); mock.className = 'mock'; mock.setAttribute('aria-label', '시안 조작');
mock.innerHTML = `<a href="./의뢰서B.html">B판</a><i></i><button data-v="form">의뢰서</button><button data-v="review">확인</button><button data-v="pay">결제 화면</button><i></i><button data-code-t aria-pressed="${S.code}">초대코드 손님</button>`;
document.body.append(mock);
if (location.search.includes('shot')) document.documentElement.classList.add('is-shot');
mock.onclick = e => {
  const v = e.target.closest('[data-v]'); if (v) { if (!S.kind) { S.kind = 'product'; S.name = '오미톡 오미자 스파클링'; S.files = { 0: true, 1: true }; S.mail = 'buyer@example.com'; S.agree = true; } S.view = v.dataset.v; S.cut = v.dataset.v === 'pay' ? 'end' : S.cut; scrollTo(0, 0); render(); return; }
  if (e.target.closest('[data-code-t]')) { S.code = !S.code; e.target.closest('button').setAttribute('aria-pressed', String(S.code)); render(); }
};
render('kind');
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSE 시안 · 의뢰서 E 솔리오가 걸으며 말한다</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./공통.css">
<style>
/* 컨셉: 솔리오가 길 위를 걸으며 옆에서 한마디씩 하고, 손님은 한 화면에 한 가지만 답한다(유호님 11-25 D판 뒤 「더 고쳐서 다시」).
   강조 순위: ① 지금 질문(크게, 한 번만) ② 길 위의 솔리오와 짧은 한마디 ③ 아래 띠의 값 · 단추. 오른쪽 요약 칸은 없앴다.
   참고: Duolingo(한 화면 한 질문 · 캐릭터 옆 짧은 말 · 진행 줄), 토스 송금 흐름(아래 고정 단추 하나 · 채운 선택 칸), Apple 구입 구성기(값은 한 자리).
   움직임: 다음 질문으로 넘어갈 때만 솔리오와 말풍선이 함께 길을 따라 미끄러진다. 그 밖에는 눈만. 구르거나 모양이 바뀌지 않는다(11-20 멀미).
   글자 역할: 질문 SUIT 700 두 톤(앞 먹 · 뒤 흐림, 뒤는 솔리오의 말과 겹치지 않게) · 솔리오의 말 SUIT 400 · 값 숫자 고정폭.
   색 역할: 먹 · 흐림. 고른 칸은 먹으로 채워 뒤집는다(테두리로 고름을 말하지 않는다). 색은 손님 사진과 갈래 그림의 소품만. */
:root{--bg:#060606;--ink:#f4f1ea;--dim:rgba(244,241,234,.5);--faint:rgba(244,241,234,.32);--line:rgba(244,241,234,.12);--card:#111;--card2:#181818}
body{background:var(--bg);color:var(--ink)}
/* C판과 같은 부품 */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;min-height:64px;padding:12px 18px;border:1px solid rgba(244,241,234,.2);border-radius:14px;text-align:left;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(244,241,234,.45)}
.opt[aria-checked=true]{border:2px solid var(--ink);padding:11px 17px;background:rgba(244,241,234,.04)}
.opt .t b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
.opt .t small{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.4}
.opt .won{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.opt[aria-checked=true] .won{color:var(--ink)}
.input{width:100%;background:var(--card);border:1px solid rgba(244,241,234,.2);border-radius:14px;padding:18px;font-size:18px;color:var(--ink);outline:none}
.input:focus{border:2px solid var(--ink);padding:17px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:14px;border-radius:14px;background:var(--card);text-align:left;overflow:hidden;transition:background .2s}
.drop:hover{background:var(--card2)}
.drop b{font-size:15px;font-weight:600}
.drop small{font-size:12px;color:var(--dim)}
.drop .need{position:absolute;left:14px;top:12px;font-size:12px}
.drop .add{position:absolute;right:14px;top:10px;font-size:20px;line-height:1;color:var(--dim)}
.drop.is-in img{position:absolute;right:10px;top:10px;width:44px;height:44px;object-fit:contain;border-radius:8px;background:#000}
.drop.is-in .add,.drop.is-in .need{display:none}
.drop.is-in::after{content:'받았어요';position:absolute;left:14px;top:12px;font-size:12px}
.drop.is-need:not(.is-in){outline:1px dashed var(--ink);outline-offset:-1px}
.drop.is-need:not(.is-in) .add{color:var(--ink)}
.drop:not(.is-need):not(.is-in) b{font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:40px;padding:0 15px;border:1px solid rgba(244,241,234,.2);border-radius:999px;font-size:14px;transition:.2s}
.chip[aria-pressed=true]{background:var(--ink);color:#0b0b0b;border-color:var(--ink)}
.more{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.more label{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--dim)}
.more textarea,.more input{background:var(--card);border:1px solid rgba(244,241,234,.2);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);outline:none;min-height:46px}
.more textarea:focus,.more input:focus{border-color:var(--ink)}
.toggle{margin-top:12px;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.consent{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--dim)}
.consent input{accent-color:#f4f1ea;width:18px;height:18px}
.mini{container-type:inline-size;position:relative;flex:none;align-self:center;width:128px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px var(--line);transition:width .5s var(--ease)}
.mini[data-ratio="16:9"]{width:100%;aspect-ratio:16/9}
.mini[data-ratio="1:1"]{width:170px;aspect-ratio:1/1}
.cut{position:absolute;inset:0}
.cut img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cut .tag{position:absolute;left:7%;top:6%;max-width:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.5);padding:2px 6px}
.cut.is-title,.cut.is-empty{display:grid;place-items:center;text-align:center;padding:0 10%;background:radial-gradient(120% 90% at 50% 30%,#1a1a1a,#050505)}
.cut.is-title p{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(11px,10cqw,22px);line-height:1.3;letter-spacing:-.03em}
.cut.is-empty p{margin:0;font-size:11px;line-height:1.6;color:var(--faint)}
.cut.is-end{display:grid;place-content:center;justify-items:center;gap:6px;background:#050505;text-align:center;padding:0 8%}
.cut.is-end .lg{font-family:var(--latin);font-weight:650;font-size:clamp(10px,10cqw,22px);letter-spacing:-.03em}
.cut.is-end .ln{font-family:var(--serif);font-weight:300;font-size:clamp(9px,7cqw,15px)}
.cut.is-end .info{font-family:var(--mono);font-size:clamp(8px,5cqw,11px);color:var(--dim)}
.cut.is-end .info.is-ex{padding:2px 8px;border:1px dashed rgba(255,255,255,.3);border-radius:4px;color:var(--faint)}
@container (max-width:80px){.cut p,.cut .tag,.cut.is-end span{display:none}}
.mini.g-moved img{filter:saturate(.82) sepia(.12)}
.mini.g-wow img{filter:contrast(1.14) saturate(1.1)}
.mini.g-laugh img{filter:saturate(1.3) brightness(1.06)}
.sumlist{margin:0;font-size:13px}
.sumlist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.sumlist dt{color:var(--dim);flex:none}
.sumlist dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumlist dd.empty{color:var(--faint)}
.price{display:flex;flex-direction:column;gap:2px;min-width:0}
.price small{font-size:12px;color:var(--dim)}
.price b{font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price s{font-size:14px;color:var(--faint);text-decoration-thickness:1px}
.price .code{font-size:12px}
.price .left{font-size:12px;color:var(--dim);margin-top:4px}
.go{flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 24px;background:var(--ink);color:#0b0b0b;font-weight:700;font-size:16px;border-radius:999px;letter-spacing:-.02em;transition:opacity .2s,transform .2s var(--ease)}
.go:hover{transform:translateY(-1px)}
.go[disabled]{opacity:.3;transform:none}
.go .icon{width:18px;height:18px}
.sheet{padding:64px 0 0}
.sheet h1{margin:0 0 22px;font-family:var(--sans);font-weight:700;font-size:clamp(28px,2.4vw,38px);letter-spacing:-.04em;line-height:1.2}
.lines{display:flex;flex-direction:column;margin:0;border-top:1px solid var(--line)}
.lines div{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.lines dt{color:var(--dim)}
.lines dd{margin:0}
.lines button{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.total{margin-top:18px;padding:18px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.total .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.total .ln b{color:var(--ink);font-weight:600}
.total .ln.code{color:var(--ink)}
.codein{display:flex;gap:8px;margin-top:4px}
.codein input{flex:1;background:var(--card);border:1px solid rgba(244,241,234,.2);border-radius:12px;padding:12px 14px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);outline:none}
.codein button{padding:0 18px;border-radius:12px;border:1px solid rgba(244,241,234,.2);font-size:14px}
.pay-opts{margin-top:18px}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);margin-bottom:12px}
.status i{width:8px;height:8px;background:var(--busy)}
.test{font-size:13px;color:var(--new);margin:-8px 0 18px}
.mock{position:fixed;left:50%;transform:translateX(-50%);top:18px;z-index:90;display:flex;gap:4px;align-items:center;padding:5px;border-radius:10px;background:rgba(28,28,28,.92);font-size:12px;color:#ddd;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.mock button,.mock a{padding:6px 10px;border-radius:7px;color:#ddd}
.mock button[aria-pressed=true]{background:#f4f1ea;color:#111}
.mock i{width:1px;height:16px;background:#444}
.is-shot .mock{display:none}
.top{display:flex;justify-content:space-between;align-items:center;max-width:784px;margin:0 auto;padding:26px 32px 0}
.logo{height:20px;width:auto}
.top a{font-size:14px;color:var(--dim)}
.stage{max-width:784px;margin:0 auto;padding:28px 32px 150px}

/* 길 · 솔리오 · 한마디: 셋이 함께 걷는다 */
.track{position:relative;padding-top:62px}
.track[hidden]{display:none}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.seg{display:flex;flex-direction:column;gap:9px;padding:0;text-align:left;font-size:12px;color:var(--faint)}
.seg i{display:block;height:2px;background:rgba(244,241,234,.14);border-radius:2px;transition:background .4s}
.seg.done i{background:rgba(244,241,234,.55)}
.seg.on i{background:var(--ink)}
.seg.on{color:var(--ink)}
.seg.done{color:var(--dim)}
.seg:disabled{cursor:default}
.seg:not(:disabled):hover{color:var(--ink)}
.solio{position:absolute;left:0;top:0;width:48px;height:48px;transform:translateX(calc(var(--x,24px) - 24px));transition:transform .8s var(--ease)}
.orb{position:relative;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.22),rgba(255,255,255,0) 16%),radial-gradient(circle at 50% 36%,#1d1d1d,#040404 74%);
  box-shadow:inset 0 0 0 1px rgba(244,241,234,.2),inset 0 -6px 12px rgba(244,241,234,.05),0 10px 24px rgba(0,0,0,.75)}
.eyes{position:absolute;left:50%;top:47%;display:flex;gap:5px;transform:translate(calc(-50% + var(--ex,0px)),calc(-50% + var(--ey,0px)));transition:transform .28s var(--ease)}
.eyes i{display:block;width:5px;height:5px;border-radius:50%;background:var(--ink);transition:height .08s}
.solio.blink .eyes i{height:1px}
.solio.happy .eyes i{width:7px;height:4px;background:none;border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0}
.solio.nod .orb{animation:nod .34s var(--ease)}
@keyframes nod{45%{transform:translateY(3px)}}
.say{position:absolute;left:0;top:6px;margin:0;max-width:300px;width:max-content;padding:9px 13px;border-radius:12px;background:var(--card2);font-size:14px;line-height:1.5;letter-spacing:-.01em;transform:translateX(var(--sx,80px));transition:transform .8s var(--ease),opacity .18s}
.say::before{content:'';position:absolute;top:50%;margin-top:-5px;left:-4px;width:10px;height:10px;background:var(--card2);transform:rotate(45deg);border-radius:2px}
.say.flip::before{left:auto;right:-4px}
.say.out{opacity:0}
/* 길이 없는 화면(보낸 뒤 · 결제): 솔리오와 한마디가 제목 위에 나란히 */
.solo{position:relative;display:flex;align-items:center;gap:14px;height:48px}
.solo .solio,.solo .say{position:relative;transform:none;top:0}
.solo .say::before{left:-4px}

/* 질문 한 장 */
.q{padding-top:40px;animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.q h2,.sheet h1{margin:0 0 26px;font-family:var(--sans);font-weight:700;font-size:clamp(28px,3vw,40px);line-height:1.2;letter-spacing:-.04em}
.q h2 span,.sheet h1 span{color:var(--dim)}
.sheet{padding-top:40px;animation:rise .4s var(--ease)}

/* 선택 칸: 테두리 대신 채운 칸, 고르면 먹으로 뒤집는다 */
.opt{border:0;background:var(--card);min-height:66px}
.opt:not([aria-checked=true]):hover{background:var(--card2)}
.opt[aria-checked=true]{border:0;padding:12px 18px;background:var(--ink);color:#0b0b0b}
.opt[aria-checked=true] .t small,.opt[aria-checked=true] .won{color:rgba(11,11,11,.6)}
.chip{border:0;background:var(--card)}
.chip:not([aria-pressed=true]):hover{background:var(--card2)}
.input{border:0;background:var(--card);box-shadow:inset 0 0 0 1px rgba(244,241,234,.14)}
.input:focus{border:0;padding:18px;box-shadow:inset 0 0 0 2px var(--ink)}
.drop small.act{color:var(--ink)}
.alt{display:inline-flex;margin-top:16px;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}

/* 갈래 카드 */
.kinds{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kcard{display:flex;flex-direction:column;padding:0 0 14px;border-radius:16px;background:var(--card);text-align:left;overflow:hidden;transition:box-shadow .2s,background .2s}
.kcard img{width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:12px;filter:brightness(.88);transition:filter .3s}
.kcard:hover{background:var(--card2)}
.kcard:hover img{filter:brightness(1.05)}
.kcard[aria-checked=true]{box-shadow:inset 0 0 0 2px var(--ink)}
.kcard .t{display:flex;flex-direction:column;gap:3px;padding:0 12px}
.kcard b{font-size:15px;font-weight:600;letter-spacing:-.02em}
.kcard small{font-size:12px;line-height:1.45;color:var(--dim);min-height:35px}
.kcard .won{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);margin-top:4px}

/* 추천대로 */
.rec{display:flex;flex-direction:column;margin:0;padding:6px 20px;border-radius:16px;background:var(--card)}
.rec div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:15px}
.rec div+div{border-top:1px solid var(--line)}
.rec dt{color:var(--dim)}
.rec dd{margin:0;text-align:right}
.sub{margin:28px 0 12px;font-size:15px;font-weight:600}
.sub:first-child{margin-top:0}

/* 확인: 왼쪽에 내 광고 한 컷, 오른쪽에 고른 것 */
.rv{display:grid;grid-template-columns:132px 1fr;gap:28px;align-items:start}
.rv .mini{width:132px;align-self:start}
.lines div{grid-template-columns:96px 1fr auto}

/* 아래 띠: 뒤로 · 내 광고 · 값 · 단추 한 자리 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,6,6,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;max-width:784px;margin:0 auto;padding:12px 32px calc(env(safe-area-inset-bottom) + 14px)}
.bar:has(> .bar-in:empty){display:none}
.bar .back{font-size:14px;color:var(--dim);white-space:nowrap}
.bar .back:hover{color:var(--ink)}
.bar .mini{width:30px;flex:none}
.bar .mini[data-ratio="16:9"]{width:54px}
.bar .mini[data-ratio="1:1"]{width:40px}
.bar .price{flex:1}
.bar .price b{font-size:20px}
.bar .spacer{flex:1}

@media (max-width:760px){
  .top{padding:16px 16px 0}
  .stage{padding:16px 16px 130px}
  .track{padding-top:60px}
  .seg span{font-size:11px}
  .say{max-width:calc(100vw - 110px);font-size:13.5px}
  .kinds{grid-template-columns:1fr}
  .kcard{flex-direction:row;align-items:center;gap:14px;padding:0 14px 0 0}
  .kcard img{width:72px;margin:0;flex:none}
  .kcard .t{padding:0;flex:1}
  .kcard small{min-height:0}
  .kcard .won{margin:0}
  .q,.sheet{padding-top:30px}
  .rv{grid-template-columns:1fr}
  .rv .mini{display:none}
  .bar-in{gap:12px;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px)}
  .bar:has(> .bar-in:empty){display:none}
.bar .back{display:none}
  .go{min-height:48px;padding:0 20px}
  .mock{top:auto;bottom:84px;flex-wrap:wrap;justify-content:center;max-width:94vw}
}
@media (prefers-reduced-motion:reduce){.solio,.say,.eyes,.seg i{transition:none}.solio.nod .orb,.q,.sheet{animation:none}}
</style>
</head>
<body>
<header class="top"><img class="logo" src="../../마케팅/온라인마케팅지도/engagement/company/public/pulse-app/assets/request/logo-paper.webp" alt="synk PULSE"><a href="./A.html#entry">닫기</a></header>
<main class="stage">
  <div class="track" data-track>
    <div class="solio" data-solio aria-hidden="true"><div class="orb"><span class="eyes"><i></i><i></i></span></div></div>
    <p class="say" data-say aria-live="polite"></p>
    <div class="segs" data-segs></div>
  </div>
  <div class="solo" data-solo hidden></div>
  <div data-ask></div>
</main>
<div class="bar"><div class="bar-in" data-bar></div></div>
<script type="module">
import { sound, $, $$, reduced } from './공통.js';
const APP = '../../마케팅/온라인마케팅지도/engagement/company/public/pulse-app/assets/';
const eul = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c < 11172 && c % 28 ? '을' : '를'); };
const won = v => v == null ? '정가 ○○만원' : `${v < 10 ? Math.round(v * 10) / 10 : Math.round(v)}만원`;
const arrow = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"/></svg>';

// 갈래: 그림 · 이름 칸 · 자료 · 길이와 값 · 솔리오의 한마디가 갈래마다 다르다.
const KINDS = [

      <button class="opt" role="radio" aria-checked="${S.method === 'bank'}" data-m="bank"><span class="t"><b>계좌이체</b><small>입금하시면 담당자가 평일 10~19시에 확인해요</small></span><span class="won">확인 뒤 시작</span></button>
    </div>
    ${S.method === 'bank' ? `<div class="total"><div class="ln"><span>입금할 곳</span><b>○○은행 000-000000-00-000</b></div><div class="ln"><span>입금자명</span><b>P-1125-7828</b></div></div>` : ''}</div>`;
}

function render() {
  const inForm = S.view === 'form' || S.view === 'review';
  track.hidden = !inForm; solo.hidden = inForm;
  if (inForm) {
    segs.innerHTML = STEPS.map(([, label], i) => `<button class="seg ${S.view === 'review' || i < S.step ? 'done' : ''} ${S.view === 'form' && i === S.step ? 'on' : ''}" data-goto="${i}" ${i > S.reached ? 'disabled' : ''}><i></i><span>${label}</span></button>`).join('');
    if (!track.contains(solio)) { track.prepend(sayEl); track.prepend(solio); }
  } else { solo.append(solio, sayEl); }
  if (S.view === 'form') ask.innerHTML = `<div class="q">${stepHTML()}</div>`;
  if (S.view === 'review') ask.innerHTML = reviewHTML();
  if (S.view === 'pay') ask.innerHTML = payHTML();
  if (S.view === 'sent') ask.innerHTML = `<div class="sheet"><p class="status"><i></i>접수했어요 · 저희 차례</p><h1>보내 주셔서 고마워요. <span>평일 10~19시에 보고, 방향 두 안과 모델을 메일로 알려 드려요.</span></h1></div>`;
  if (S.view === 'paid') ask.innerHTML = `<div class="sheet"><p class="status"><i></i>${S.method === 'card' ? '결제 확인 · 저희 차례' : '입금 확인 중'}</p><h1>${S.method === 'card' ? '결제를 확인했어요.' : '입금을 확인하고 있어요.'} <span>${S.method === 'card' ? '받으실 날은 12월 5일이에요.' : '담당자가 입금을 확인하면 바로 시작해요.'}</span></h1></div>`;
  drawBar();
  say(lineFor(S.view === 'form' ? STEPS[S.step][0] : S.view));
  requestAnimationFrame(place);
  $('[data-name], [data-mail]', ask)?.focus({ preventScroll: true });
}
function goStep(i) { S.view = 'form'; S.step = Math.max(0, Math.min(STEPS.length - 1, i)); S.reached = Math.max(S.reached, S.step); S.cut = { kind: 'title', name: 'title' }[STEPS[S.step][0]] || 'hero'; sound.tick(); render(); if (scrollY > 80) scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); }

function act(t) {
  if (t.dataset.kind) { const changed = S.kind !== t.dataset.kind; S.kind = t.dataset.kind; if (changed) { S.files = {}; S.len = 0; S.name = ''; S.reached = 0; } mood('nod', 340); setTimeout(() => goStep(1), reduced ? 0 : 260); return; }
  if (t.hasAttribute('data-next') && !t.disabled) { if (STEPS[S.step][0] === 'mail') { S.view = 'review'; S.cut = 'hero'; sound.tick(); render(); scrollTo(0, 0); return; } goStep(S.step + 1); return; }
  if (t.hasAttribute('data-prev')) { goStep(S.step - 1); return; }
  if (t.dataset.goto != null && !t.disabled) { goStep(Number(t.dataset.goto)); return; }
  if (t.dataset.file) { S.files[t.dataset.file] = true; S.cut = 'hero'; sound.shutter(); render(); mood('happy', 900); return; }
  if (t.dataset.chan) { S.chan = Number(t.dataset.chan); S.cut = 'hero'; sound.tick(); render(); mood('nod', 340); return; }
  if (t.dataset.len) { S.len = Number(t.dataset.len); sound.tick(); render(); mood('nod', 340); return; }
  if (t.hasAttribute('data-custom')) { S.custom = true; sound.tick(); render(); return; }
  if (t.dataset.end) { S.end = Number(t.dataset.end); S.cut = S.line || S.exact ? 'end' : 'hero'; sound.tick(); render(); mood('nod', 340); return; }
  if (t.dataset.feel) { S.feel = S.feel === t.dataset.feel ? '' : t.dataset.feel; sound.soft(); render(); mood('nod', 340); return; }
  if (t.hasAttribute('data-apply')) { const v = $('[data-code]', ask).value.trim(); if (!/^[A-Za-z0-9-]{4,12}$/.test(v)) return; S.code = true; sound.shutter(); render(); mood('happy', 900); return; }
  if (t.hasAttribute('data-send')) { S.view = 'sent'; sound.shutter(); render(); mood('happy', 900); return; }
  if (t.hasAttribute('data-goto-pay')) { S.view = 'pay'; S.cut = 'hero'; render(); return; }
  if (t.dataset.m) { S.method = t.dataset.m; sound.tick(); render(); mood('nod', 340); return; }
  if (t.hasAttribute('data-pay')) { S.view = 'paid'; sound.shutter(); render(); mood('happy', 900); }
}
document.addEventListener('click', e => { const t = e.target.closest('button'); if (t && !t.closest('.mock') && (ask.contains(t) || segs.contains(t) || bar.contains(t))) act(t); });
ask.addEventListener('pointerover', e => { const o = e.target.closest('[data-kind]'); if (o && S.view === 'form' && S.step === 0) say(KINDS.find(k => k.id === o.dataset.kind).tip); });
ask.addEventListener('pointerleave', () => { if (S.view === 'form' && S.step === 0) say(lineFor('kind')); });
ask.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-name]')) { S.name = t.value; S.cut = 'title'; }
  if (t.matches('[data-line]')) { S.line = t.value; S.cut = 'end'; }
  if (t.matches('[data-exact]')) { S.exact = t.value; S.cut = 'end'; }
  if (t.matches('[data-avoid]')) S.avoid = t.value;
  if (t.matches('[data-mail]')) S.mail = t.value.trim();
  drawBar();
});
ask.addEventListener('change', e => { if (e.target.matches('[data-agree]')) { S.agree = e.target.checked; drawBar(); if (S.agree) mood('nod', 340); } });
ask.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-name], [data-mail]')) { const g = $('[data-next]', bar); if (g && !g.disabled) act(g); } });
addEventListener('resize', place);

// 시안 조작 띠(손님 화면 밖)
const mock = document.createElement('nav'); mock.className = 'mock'; mock.setAttribute('aria-label', '시안 조작');
mock.innerHTML = `<a href="./의뢰서D.html">D판</a><i></i><button data-v="form">의뢰서</button><button data-v="review">확인</button><button data-v="pay">결제 화면</button><i></i><button data-code-t aria-pressed="${S.code}">초대코드 손님</button>`;
document.body.append(mock);
if (location.search.includes('shot')) document.documentElement.classList.add('is-shot');
mock.onclick = e => {
  const v = e.target.closest('[data-v]'); if (v) { if (!S.kind) { S.kind = 'product'; S.name = '오미톡 오미자 스파클링'; S.files = { 0: true, 1: true }; S.mail = 'buyer@example.com'; S.agree = true; S.reached = 5; } S.view = v.dataset.v; if (S.view === 'form') S.step = 0; S.cut = 'hero'; render(); return; }
  if (e.target.closest('[data-code-t]')) { S.code = !S.code; e.target.closest('button').setAttribute('aria-pressed', String(S.code)); render(); }
};
render();
</script>
</body>
</html>

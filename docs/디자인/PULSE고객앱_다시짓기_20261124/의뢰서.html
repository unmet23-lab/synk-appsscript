<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSE 시안 · 의뢰서 다시 짓기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./공통.css">
<style>
/* 시안 A 「캐스팅 복도」의 결 그대로: 검정 바탕, 왼쪽 판 + 오른쪽 무대, 명조 300 제목. 유호님 11-25 새벽 말씀으로 의뢰서를 다시 짠다. */
:root{--bg:#060606;--ink:#f4f1ea;--dim:rgba(244,241,234,.6);--faint:rgba(244,241,234,.38);--line:rgba(244,241,234,.14);--panel:500px}
body{background:var(--bg);color:var(--ink);overflow:hidden}
.app{display:grid;grid-template-columns:var(--panel) 1fr;height:100dvh}
.side{position:relative;z-index:2;display:flex;flex-direction:column;padding:32px 40px 28px;background:var(--bg);border-right:1px solid var(--line);overflow:auto}
.side-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{height:20px;width:auto;opacity:.95}
.side-body{margin:auto 0;display:flex;flex-direction:column;gap:22px;padding:26px 0}
.kick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.kick b{color:var(--ink);font-weight:600}
h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(36px,3.2vw,50px);line-height:1.14;letter-spacing:-.045em}
.lede{margin:0;font-size:15px;line-height:1.65;color:var(--dim);max-width:32em}
.link{color:var(--dim);font-size:14px;border-bottom:1px solid var(--line)}
.link:hover{color:var(--ink)}
.go{display:inline-flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;padding:0 22px;background:var(--ink);color:#0b0b0b;font-weight:650;font-size:16px;letter-spacing:-.02em;border-radius:2px;transition:transform .2s var(--ease),opacity .2s}
.go:hover{transform:translateY(-1px)}
.go[disabled]{opacity:.35;transform:none;cursor:not-allowed}
.go .icon{width:18px;height:18px}
.go.ghost{background:transparent;color:var(--ink);border:1px solid rgba(244,241,234,.32)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{min-height:1.4em;margin:0;font-size:13px;color:var(--dim)}
.small{font-size:13px;color:var(--faint);line-height:1.55}
.q{display:flex;flex-direction:column;gap:10px}
.qn{display:flex;gap:8px;align-items:baseline;font-size:15px;font-weight:600}
.qn .mono{font-size:12px;color:var(--faint);font-weight:400}
.field input,.field textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(244,241,234,.4);padding:10px 0;font-size:17px;outline:none;border-radius:0;color:var(--ink)}
.field textarea{border:1px solid var(--line);padding:10px 12px;font-size:15px;min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink)}

/* 첫 질문: 무엇을 만들까요 — 그림 카드 다섯(참고: Prefer Taste Quiz의 「그림으로 하나 고르기」) */
.kinds{display:flex;flex-direction:column;gap:6px}
.kind{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:8px 14px 8px 8px;border:1px solid var(--line);text-align:left;transition:border-color .2s,background .2s}
.kind:hover,.kind:focus-visible,.kind[aria-pressed=true]{border-color:rgba(244,241,234,.6);background:rgba(255,255,255,.04)}
.kind img{width:52px;height:52px;object-fit:cover}
.kind b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.kind span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.kind .icon{width:18px;height:18px;color:var(--faint)}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border:1px solid var(--line);font-size:14px;transition:.2s}
.chip:hover{border-color:rgba(244,241,234,.5)}
.chip[aria-pressed=true]{background:rgba(244,241,234,.1);border-color:var(--ink)}
.chip[aria-pressed=true]::before{content:'';width:6px;height:6px;background:var(--ink)}

/* 보내 주실 것: 갈래마다 다른 칸 */
.files{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.file{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.file b{font-size:15px;font-weight:600}
.file b em{font-style:normal;font-size:12px;font-weight:500;color:var(--faint);margin-left:6px}
.file b em.need{color:var(--ink)}
.file p{grid-column:1;margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.file .pick{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:8px}
.file .pick img{width:40px;height:40px;object-fit:cover}
.file .pick button{min-height:38px;padding:0 12px;border:1px solid var(--line);font-size:13px}
.file .pick button:hover{border-color:var(--ink)}
.file.is-in .pick button{color:var(--dim)}

/* 길이와 값 */
.lens{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.len{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border:1px solid var(--line);text-align:left;transition:.2s}
.len:hover{border-color:rgba(244,241,234,.5)}
.len[aria-pressed=true]{border-color:var(--ink);background:rgba(244,241,234,.07)}
.len b{font-size:15px}
.len span{font-size:12px;color:var(--dim);line-height:1.4}
.len .won{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:2px}
.len .won.tbd{color:var(--new)}

/* 접힌 칸(아이콘) — 시안 A 그대로 */
.folds{display:flex;gap:8px;flex-wrap:wrap}
.fold{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.02);text-align:left;transition:border-color .2s,background .2s}
.fold:hover,.fold[aria-expanded=true]{border-color:rgba(244,241,234,.5);background:rgba(255,255,255,.05)}
.fold .ico{display:grid;place-items:center;width:40px;height:40px;background:rgba(255,255,255,.06)}
.fold .ico .icon{width:20px;height:20px}
.fold .t{display:flex;flex-direction:column;line-height:1.25}
.fold .t small{font-size:12px;color:var(--faint)}
.fold .t span{font-size:13px;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold.is-rec .t small::after{content:' · 추천';color:var(--dim)}
.fold.is-set .t small::after{content:' · 정함';color:var(--ink)}
.who-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:rgba(255,255,255,.04);font-size:14px;line-height:1.55;color:var(--dim)}
.who-note b{color:var(--ink);font-weight:600}
.consent{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.consent input{accent-color:#f4f1ea;width:16px;height:16px}

/* 값 줄 — 판 아래에 붙어 늘 보인다 */
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:16px;border-top:1px solid var(--line)}
.price .p small{display:block;font-size:12px;color:var(--faint)}
.price .p .won{font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.03em;line-height:1.2}
.price .p .won s{font-size:18px;color:var(--faint);margin-right:8px;text-decoration-thickness:1px}
.price .p .won .tbd{color:var(--new);font-size:20px}
.price .p .why{display:block;font-size:12px;color:var(--dim);margin-top:2px}

/* 오른쪽 무대 */
.stage{position:relative;overflow:hidden;background:#000}
.stage>video,.stage>img.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .cap{position:absolute;left:28px;bottom:24px;z-index:2;max-width:70%;font-size:13px;color:var(--dim);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.stage .cap b{display:block;font-family:var(--serif);font-weight:300;font-size:26px;color:var(--ink);letter-spacing:-.03em}
.stage .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 45%)}
.sheet{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;gap:18px;background:rgba(6,6,6,.97);padding:30px 34px;overflow:auto;animation:sheet .4s var(--ease)}
@keyframes sheet{from{opacity:0;transform:translateY(12px)}}
.sheet[hidden]{display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.sheet-head h2{margin:0;font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.04em}
.sheet .lede{max-width:40em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);text-align:left;transition:border-color .2s}
.card:hover,.card[aria-pressed=true]{border-color:var(--ink)}
.card[aria-pressed=true]{background:rgba(244,241,234,.05)}
.card h3{margin:0;font-family:var(--serif);font-weight:300;font-size:22px;letter-spacing:-.03em}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
.card video,.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#111}
.card .ex{font-size:12px;color:var(--faint)}
.endcards .card .frame{position:relative;aspect-ratio:16/9;background:#0d0d0c;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--dim)}
.endcards .frame .lg{font-family:var(--latin);font-weight:600;font-size:16px;color:var(--ink);letter-spacing:-.02em}
.endcards .frame .ln{font-family:var(--serif);font-size:14px;color:var(--ink)}
.exact{display:flex;flex-direction:column;gap:8px}
.exact .one{display:flex;gap:8px}
.exact .one input{flex:1;background:transparent;border:1px solid var(--line);padding:10px 12px;font-size:15px;color:var(--ink);outline:none}
.exact .one input:focus{border-color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}

/* 확인: 영수증 꼴(참고: Receipt Printer) */
.receipt{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.receipt div{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.receipt dt{color:var(--faint)}
.receipt dd{margin:0}
.receipt button{font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
.total{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:rgba(255,255,255,.04)}
.total .line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--dim)}
.total .line s{text-decoration-thickness:1px}
.total .line.code{color:var(--ink)}
.total .line.code b{font-weight:600}
.total .sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:2px;border-top:1px solid var(--line)}
.total .sum span{font-size:14px}
.total .sum b{font-family:var(--serif);font-weight:300;font-size:32px;letter-spacing:-.03em}
.total .note{font-size:13px;color:var(--dim);line-height:1.55}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;background:transparent;border:1px solid var(--line);padding:10px 12px;font-family:var(--mono);font-size:15px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;outline:none}
.codebox input:focus{border-color:var(--ink)}
.codebox button{padding:0 16px;border:1px solid var(--line);font-size:14px}
.applied{animation:applied .5s var(--ease)}
@keyframes applied{from{opacity:0;transform:translateY(-4px)}}

/* 결제(방): 수단 두 장(참고: 어두운 결제 화면의 수단 카드 + 합계 · 결제 단추) */
.methods{display:flex;flex-direction:column;border:1px solid var(--line)}
.method{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;padding:16px;text-align:left;border-bottom:1px solid var(--line)}
.method:last-child{border-bottom:0}
.method .mk{width:14px;height:14px;border:1px solid rgba(244,241,234,.5);display:grid;place-items:center}
.method[aria-checked=true] .mk::after{content:'';width:8px;height:8px;background:var(--ink)}
.method b{font-size:16px}
.method span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.method .tag{font-size:12px;color:var(--faint)}
.bank{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:rgba(255,255,255,.04);font-size:14px}
.bank .mono{font-size:15px;color:var(--ink)}
.bank[hidden]{display:none}
.done-mark{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.done-mark i{width:8px;height:8px;background:var(--busy)}
.paybar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;border-top:1px solid var(--line)}
.paybar small{display:block;font-size:12px;color:var(--faint)}
.paybar b{font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.03em}
.test-tag{font-size:12px;color:var(--new)}

/* 시안 조작 띠 */
.mock{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:90;display:flex;gap:4px;align-items:center;padding:5px;border-radius:8px;background:rgba(24,24,24,.9);font-size:12px;color:#ddd;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.mock button,.mock a{padding:5px 9px;border-radius:5px;color:#ddd}
.mock button[aria-current=true],.mock button[aria-pressed=true]{background:#f4f1ea;color:#111}
.mock .sep{width:1px;height:16px;background:#444;margin:0 2px}

@media (max-width:900px){
  :root{--panel:1fr}
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .stage{order:-1;height:34dvh;min-height:220px}
  .side{padding:22px 18px 28px;border-right:0}
  .side-body{margin:0;padding:12px 0}
  h1{font-size:32px}
  .sheet{position:fixed;inset:auto 0 0 0;z-index:30;max-height:82dvh;padding:18px 16px 24px;border-top:1px solid var(--line);box-shadow:0 -20px 40px rgba(0,0,0,.5)}
  .stage .cap{left:16px;bottom:14px}
  .stage .cap b{font-size:20px}
  .receipt div{grid-template-columns:86px 1fr auto}
  .mock{top:auto;bottom:8px;flex-wrap:wrap;justify-content:center;max-width:94vw}
}
@media (prefers-reduced-motion:reduce){.sheet,.applied{animation:none}}
</style>
</head>

// ── 갈래 다섯. 무엇을 만드느냐에 따라 이름 칸 · 보낼 것 · 길이 · 정확한 표기 예시가 바뀐다. ──
const KINDS = [

      { n: '제품 정면 사진', need: true, why: '화면 속 제품은 AI로 그리지 않고 이 사진을 그대로 얹어요.', img: APP + 'request/demo-can-front.webp' },
      { n: '옆면 · 뒷면 사진', need: true, why: '돌아가는 컷과 손에 든 컷의 모양을 이 사진으로 맞춰요.', img: APP + 'request/demo-can-side.webp' },

  { id: 'place', name: '매장 · 공간', note: '카페, 식당, 병원, 학원, 숙소처럼 찾아오는 곳', poster: APP + 'films/somchae-room-poster-v1.webp', video: APP + 'films/somchae-room-v1.mp4', work: '솜채 「연말 빈방」', len: '1분 · 가상 브랜드로 만든 자체 작품',
    nameQ: '어떤 곳인가요', namePh: '예) 솜채 한옥스테이',

  { id: 'app', name: '앱 · 웹 서비스', note: '화면으로 쓰는 서비스', poster: film('modu').poster, video: film('modu').video, work: '모두의코스 「가는 데마다 또 그 사람」', len: '39초 · 가상 브랜드로 만든 자체 작품',

  $$('[data-file] button', side).forEach(b => b.addEventListener('click', () => { const i = b.closest('[data-file]').dataset.file; S.files[i] = true; sound.tick(); const row = b.closest('.file'); row.classList.add('is-in'); const f = k.files[i]; b.textContent = '바꾸기'; if (f.img && !row.querySelector('.pick img')) b.insertAdjacentHTML('beforebegin', `<img src="${f.img}" alt="">`); }));
  $$('[data-chan]', side).forEach(b => b.addEventListener('click', () => { const c = b.dataset.chan; S.chans = S.chans.includes(c) ? S.chans.filter(x => x !== c) : [...S.chans, c]; b.setAttribute('aria-pressed', String(S.chans.includes(c))); sound.tick(); }));
  $$('[data-len]', side).forEach(b => b.addEventListener('click', () => { S.len = Number(b.dataset.len); $$('[data-len]', side).forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.setAttribute('aria-checked', String(x === b)); }); sound.tick(); refresh(); }));
  side.addEventListener('click', e => { const f = e.target.closest('[data-fold]'); if (!f) return; const s = $(`[data-sheet="${f.dataset.fold}"]`, stage), open = s.hidden; closeSheets(); if (open) { s.hidden = false; f.setAttribute('aria-expanded', 'true'); sound.tick(); s.querySelectorAll('video').forEach(v => { if (!reduced) { v.src ||= v.dataset.src; v.play().catch(() => {}); } }); $('textarea,input,button.card', s)?.focus({ preventScroll: true }); } });
  stage.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeSheets(); return; }
    const end = e.target.closest('[data-end]'); if (end) { S.end = end.dataset.end; S.none = false; $$('[data-end]', stage).forEach(x => x.setAttribute('aria-pressed', String(x === end))); sound.tick(); return; }
    const fl = e.target.closest('[data-feel]'); if (fl) { S.feel = fl.dataset.feel; $$('[data-feel]', stage).forEach(x => x.setAttribute('aria-pressed', String(x === fl))); sound.tick(); return; }
    const bd = e.target.closest('[data-bold]'); if (bd) { S.bold = bd.dataset.bold; $$('[data-bold]', stage).forEach(x => x.setAttribute('aria-pressed', String(x === bd))); $('[data-bold-why]', stage).textContent = BOLDS.find(b => b[0] === S.bold)[1]; sound.tick(); return; }
    if (e.target.closest('[data-none]')) { S.none = true; S.end = ''; S.exact = ['', '', '']; closeSheets(); refresh(); sound.tick(); return; }
    const sv = e.target.closest('[data-save]'); if (!sv) return;
    const id = sv.dataset.save;
    if (id === 'keep') S.keep = $('[data-keep]', stage).value.trim();
    if (id === 'type') { S.exact = $$('[data-exact]', stage).map(i => i.value.trim()); S.none = false; if (!S.end && S.exact.some(Boolean)) S.end = ENDS[0][0]; }
    if (id === 'avoid') S.avoid = $('[data-avoid]', stage).value.trim();
    if (id === 'date') { const v = $('[data-date]', stage).value; S.date = v ? v.slice(5).replace('-', '월 ') + '일까지' : ''; }
    sound.tick(); closeSheets(); refresh();
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); }, { once: false });
  $('[data-next]', side).addEventListener('click', () => {
    const msg = $('[data-msg]', side);
    if (!S.name.trim()) { msg.textContent = `${k.nameQ.replace('인가요', '')} 이름을 적어 주세요.`; $('#nm', side).focus(); return; }
    if (!/^\S+@\S+\.\S+$/.test(S.mail)) { msg.textContent = '답을 받을 메일을 넣어 주세요. 이 메일로 방을 열어요.'; $('#ml', side).focus(); return; }
    if (!S.agree) { msg.textContent = '정보 수집 · 이용 동의가 있어야 보낼 수 있어요.'; return; }
    go('check');
  });
}

// ── 3. 이대로 보낼까요(영수증 꼴 + 값) ──
function viewCheck() {
  if (!S.kind) { S.kind = 'product'; S.sub = '음료 · 식품'; S.name = '오미톡 오미자 스파클링'; S.mail = 'buyer@example.com'; S.files = { 0: true, 1: true }; }
  const k = kindOf(), [l, n, p] = lenOf(), need = k.files.filter((f, i) => f.need && !S.files[i]);
  const rows = [
    ['만들 것', `${k.name}${S.sub && k.id === 'product' ? ' · ' + S.sub : ''}`, 'kind'],
    [k.nameQ.replace('인가요', '').replace('어떤 ', '').replace('어느 ', ''), S.name || '—', 'form'],
    ['보낼 자료', `${Object.keys(S.files).length}개${need.length ? ` · 아직: ${need.map(f => f.n).join(', ')}` : ''}`, 'form'],
    ['길이', `${l} · ${n}`, 'form'],
    ...(k.id === 'mv' ? [] : [['올릴 곳', S.chans.join(', ') || '저희가 제안해요', 'form']]),
    ['남길 한 가지', S.keep || '저희가 제안해요', 'form'],
    ['영상 속 글자', S.none ? '없어요' : S.end ? S.end : `${k.exact[0]}만`, 'form'],
    ['느낌', S.feel ? FEELS.find(f => f.id === S.feel).h : '저희가 제안해요', 'form'],
    ['모델', '저희가 골라 방에서 보여 드려요', ''],
  ];
  app.innerHTML = `
  <section class="side">
    <div class="side-top"><img class="logo" src="${LOGO}" alt="synk PULSE"><button class="link" data-go="form">${'뒤로'}</button></div>
    <div class="side-body">
      <p class="kick">새 의뢰 · 3/3</p>
      <h1>이대로<br>보낼까요?</h1>
      <dl class="receipt">${rows.map(([a, b, to]) => `<div><dt>${a}</dt><dd>${b}</dd>${to ? `<button data-go="${to}">고치기</button>` : '<span></span>'}</div>`).join('')}</dl>
      <div class="total" data-total>${totalHTML(l, p)}</div>
      ${S.code ? '' : `<details data-codebox><summary class="small" style="cursor:pointer">크몽 · 숨고에서 받은 초대코드가 있어요</summary><div class="codebox" style="margin-top:10px"><input data-code placeholder="초대코드" aria-label="초대코드" maxlength="12"><button data-apply>적용</button></div><p class="msg" data-codemsg aria-live="polite"></p></details>`}
      <div class="row"><button class="go" data-send>보내기 ${ic('arrow')}</button></div>
      <p class="small">보내시면 담당자가 평일 10~19시에 확인하고, 빠진 것이 있으면 그 칸만 다시 여쭤요.</p>
    </div>
  </section>
  <section class="stage"><div class="shade"></div><p class="cap"></p></section>`;
  stageFilm(k);
  $('[data-apply]', app)?.addEventListener('click', () => {
    const v = $('[data-code]', app).value.trim(), msg = $('[data-codemsg]', app);
    if (!/^[A-Za-z0-9-]{4,12}$/.test(v)) { msg.textContent = '받으신 초대코드를 그대로 넣어 주세요.'; return; }
    S.code = true; sound.shutter();
    const t = $('[data-total]', app); t.innerHTML = totalHTML(l, p); t.classList.remove('applied'); void t.offsetWidth; t.classList.add('applied');
    $('[data-codebox]', app).remove();
  });
  $('[data-send]', app).addEventListener('click', () => { sound.shutter(); go('sent'); });
}
function totalHTML(l, p) {
  if (p == null) return `<div class="sum"><span>뮤직비디오 한 곡</span><b class="tbd" style="color:var(--new);font-size:20px">정가 ○○만원</b></div><p class="note">뮤직비디오 정가는 유호님이 정하실 값이에요(시안 자리). 결제는 글 콘티를 확인한 뒤 방에서 해요.</p>`;
  if (S.code) return `<div class="line"><span>${l} 정가</span><s>${won(p)}부터</s></div><div class="line code"><span><b>초대코드 적용</b> · ${S.codeFrom}에서 결제하신 의뢰</span><span>−${won(p)}</span></div><div class="sum"><span>결제할 금액</span><b>0원</b></div><p class="note">이미 ${S.codeFrom}에서 결제하셨어요. 방에서도 따로 결제하지 않아요.</p>`;
  return `<div class="sum"><span>${l} · 예상 가격</span><b>${won(p)}부터</b></div><p class="note">지금은 결제하지 않아요. 담당자가 의뢰서를 보고 방향과 함께 값을 정해 드리고, 글 콘티를 확인하신 뒤 방에서 카드나 계좌이체로 결제해요.</p>`;
}

// ── 보낸 뒤 ──
function viewSent() {
  const k = kindOf();
  app.innerHTML = `
  <section class="side">
    <div class="side-top"><img class="logo" src="${LOGO}" alt="synk PULSE"><span></span></div>
    <div class="side-body">
      <p class="kick"><span class="done-mark"><i></i>접수했어요 · 저희 차례</span></p>
      <h1>지금은<br>저희 차례예요</h1>
      <p class="lede">보내 주신 의뢰서를 확인하고 있어요. 평일 10~19시에 보고, 확인이 끝나면 방향 두 안과 어울리는 모델을 보내 드려요.</p>
      <div class="row"><button class="go ghost" data-go="pay">방: 결제 차례 보기(시안) ${ic('arrow')}</button></div>

  <section class="stage"><div class="shade"></div><p class="cap"></p></section>`;

// ── 방의 결제 페이지(글 콘티 확인 뒤, 공개 손님만) ──
function viewPay() {
  const m = MODELS.find(x => x.id === 'M06');
  const amount = 39;
  app.innerHTML = `
  <section class="side">
    <div class="side-top"><img class="logo" src="${LOGO}" alt="synk PULSE"><span class="small">오미톡 오미자 스파클링 · P-1125-7828</span></div>
    <div class="side-body">
      ${S.code ? `
      <p class="kick"><span class="done-mark"><i></i>저희 차례</span></p>
      <h1>결제는<br>이미 끝났어요</h1>
      <p class="lede">${S.codeFrom}에서 결제하신 의뢰라 방에서는 결제하지 않아요. 확인하신 글 콘티로 장면 이미지를 만들기 시작했어요.</p>
      <div class="total"><div class="line"><span>15초 · 정해 드린 값</span><s>${won(amount)}</s></div><div class="line code"><span><b>초대코드 적용</b> · ${S.codeFrom}에서 결제</span><span>−${won(amount)}</span></div><div class="sum"><span>결제할 금액</span><b>0원</b></div></div>` : `
      <p class="kick"><span>내 차례 · 결제</span></p>
      <h1>결제해<br>주세요</h1>
      <p class="lede">글 콘티를 확인해 주셔서 고마워요. 결제가 확인되면 장면 이미지를 만들기 시작해요.</p>
      <div class="total"><div class="line"><span>15초 한 편 · 정해 드린 값</span><span>${won(amount)}</span></div><div class="line"><span>기간 · 수정</span><span>결제한 날부터 10일 · 2회</span></div></div>
      <div class="methods" role="radiogroup" aria-label="결제 수단">
        <button class="method" role="radio" aria-checked="true" data-method="card"><span class="mk"></span><span><b>카드 결제</b><span>결제창에서 카드나 간편결제로 바로 끝나요.</span></span><span class="tag">바로 시작</span></button>
        <button class="method" role="radio" aria-checked="false" data-method="bank"><span class="mk"></span><span><b>계좌이체</b><span>입금하시면 담당자가 확인하고 시작해요(평일 10~19시).</span></span><span class="tag">세금계산서 가능</span></button>
      </div>
      <div class="bank" data-bank hidden><span class="small">입금할 곳</span><span class="mono">○○은행 000-000000-00-000</span><span>예금주 ○○ · 입금자명에 <b class="mono">P-1125-7828</b>을 적어 주세요.</span><span class="small">계좌는 운영 설정에서 불러와요. 저장소에는 두지 않아요(시안 자리).</span></div>
      <div class="paybar"><span><small>결제할 금액</small><b>${won(amount)}</b></span><button class="go" data-pay>카드로 결제하기 ${ic('arrow')}</button></div>
      <p class="test-tag" data-paytest>시험 결제예요. 가맹 신청이 끝나면 실제 결제로 바뀌어요.</p>
      <p class="msg" data-paymsg aria-live="polite"></p>`}
    </div>
  </section>
  <section class="stage"><img class="fill" src="${m.tall}" alt="" style="object-position:50% 20%"><div class="shade"></div><p class="cap"><b>${m.name}</b>${m.line} · 정해 드린 모델</p></section>`;
  if (S.code) return;
  let method = 'card';
  $$('[data-method]', app).forEach(b => b.addEventListener('click', () => {
    method = b.dataset.method; $$('[data-method]', app).forEach(x => x.setAttribute('aria-checked', String(x === b)));
    $('[data-bank]', app).hidden = method !== 'bank'; $('[data-paytest]', app).hidden = method !== 'card';
    $('[data-pay]', app).innerHTML = (method === 'card' ? '카드로 결제하기 ' : '입금했어요 ') + ic('arrow'); sound.tick();
  }));
  $('[data-pay]', app).addEventListener('click', () => {
    sound.shutter();
    const body = $('.side-body', app);
    body.innerHTML = method === 'card'
      ? `<p class="kick"><span class="done-mark"><i></i>결제 확인 · 저희 차례</span></p><h1>결제를<br>확인했어요</h1><p class="lede">장면 이미지를 만들기 시작했어요. 받으실 날은 12월 5일이에요. 영수증은 메일로 보내 드렸어요.</p>`
      : `<p class="kick"><span class="done-mark"><i></i>입금 확인 중</span></p><h1>입금을<br>확인하고 있어요</h1><p class="lede">담당자가 평일 10~19시에 입금을 확인하면 바로 시작해요. 세금계산서가 필요하시면 나눈 말로 사업자 정보를 보내 주세요.</p>`;
  });
}

// 시안 조작 띠: 화면 넷 + 초대코드 손님 켜고 끄기(손님 화면 밖).
const VIEWS = { kind: viewKind, form: viewForm, check: viewCheck, sent: viewSent, pay: viewPay };
function go(name) { if (!VIEWS[name]) name = 'kind'; if (location.hash !== '#' + name) history.pushState(null, '', '#' + name); show(name); }
function show(name) { document.documentElement.dataset.screen = name; VIEWS[name](); $$('.mock [data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === name))); }
document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); go(a.dataset.go); } });
addEventListener('popstate', () => show(location.hash.slice(1) || 'kind'));
const bar = document.createElement('nav'); bar.className = 'mock'; bar.setAttribute('aria-label', '시안 화면 고르기');
bar.innerHTML = `<a href="./">시안</a><span class="sep"></span><button data-go="kind">무엇을</button><button data-go="form">의뢰서</button><button data-go="check">확인 · 값</button><button data-go="pay">방: 결제</button><span class="sep"></span><button data-code-toggle aria-pressed="${S.code}">초대코드 손님</button>`;
document.body.append(bar);
$('[data-code-toggle]', bar).addEventListener('click', e => { S.code = !S.code; e.currentTarget.setAttribute('aria-pressed', String(S.code)); show(location.hash.slice(1) || 'kind'); });
show(location.hash.slice(1) || 'kind');
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSE 시안 A · 캐스팅 복도</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./공통.css">
<style>
:root{--bg:#060606;--ink:#f4f1ea;--dim:rgba(244,241,234,.58);--faint:rgba(244,241,234,.36);--line:rgba(244,241,234,.14);--panel:420px;--w0:58px;--gap:6px}
body{background:var(--bg);color:var(--ink);overflow:hidden}
.app{display:grid;grid-template-columns:var(--panel) 1fr;height:100dvh}
/* 왼쪽 판 */
.side{position:relative;z-index:2;display:flex;flex-direction:column;padding:36px 40px 32px;background:var(--bg);border-right:1px solid var(--line);overflow:auto}
.logo{height:20px;width:auto;align-self:flex-start;flex:none;opacity:.95}
.side-body{margin:auto 0;display:flex;flex-direction:column;gap:22px;padding:28px 0}
.turn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.turn i{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.turn.is-busy i{background:var(--busy)}
h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(38px,3.4vw,52px);line-height:1.14;letter-spacing:-.045em}
.lede{margin:0;font-size:16px;line-height:1.65;color:var(--dim);max-width:30em}
.lede b{color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;color:var(--dim)}
.field input{background:transparent;border:0;border-bottom:1px solid rgba(244,241,234,.4);padding:10px 0;font-size:18px;outline:none;border-radius:0}
.field input:focus{border-color:var(--ink)}
.field input[name=code]{font-family:var(--mono);font-size:26px;letter-spacing:.32em}
.go{display:inline-flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;padding:0 22px;background:var(--ink);color:#0b0b0b;font-weight:650;font-size:16px;letter-spacing:-.02em;border-radius:2px;transition:transform .2s var(--ease),opacity .2s}
.go:hover{transform:translateY(-1px)}
.go .icon{width:18px;height:18px}
.go.ghost{background:transparent;color:var(--ink);border:1px solid rgba(244,241,234,.32)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{min-height:1.4em;margin:0;font-size:13px;color:var(--dim)}
.small{font-size:13px;color:var(--faint)}
.link{color:var(--dim);font-size:14px;text-decoration:none;border-bottom:1px solid transparent}
.link:hover{color:var(--ink);border-color:var(--line)}
.side-foot{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.side-foot .row{justify-content:space-between}
.due{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--dim)}
.due .mono{font-size:15px;color:var(--ink)}

/* 복도: 세로 띠 */
.hall{position:relative;overflow:hidden;background:#000}
.track{position:absolute;inset:0 auto 0 0;display:flex;gap:var(--gap);height:100%;will-change:transform;transition:transform 1s var(--ease)}
.strip{position:relative;flex:none;width:var(--w0);height:100%;overflow:hidden;background:#111;cursor:pointer;transition:width 1s var(--ease),margin 1s var(--ease),opacity .7s var(--ease),filter .7s}
.strip img,.strip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.strip video{opacity:0}
.strip.live img{opacity:0}
.strip.on{width:var(--w1)}
.strip.on video.is-ready{opacity:1}
.strip:not(.on){filter:saturate(.55) brightness(.62)}
.strip:not(.on):hover{filter:saturate(.85) brightness(.85)}
.strip.gone{width:0!important;margin-right:calc(var(--gap) * -1);opacity:0}
.tag{position:absolute;left:0;right:0;bottom:0;text-align:left;padding:80px 22px 20px;background:linear-gradient(to top,rgba(0,0,0,.78),transparent);opacity:0;transform:translateY(8px);transition:.5s var(--ease)}
.strip.on .tag{opacity:1;transform:none;transition-delay:.35s}
.tag .nm{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.04em}
.tag .en{font-family:var(--latin);font-size:13px;color:var(--dim);letter-spacing:.02em}
.tag p{margin:4px 0 0;font-size:14px;color:var(--dim)}
.tag .kind{font-size:12px;color:var(--faint)}
.hall-note{position:absolute;right:20px;top:18px;margin:0;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);font-size:12px;color:var(--dim);z-index:3}

/* 방 머리 */
.top{position:absolute;left:0;right:0;top:0;height:64px;z-index:5;display:flex;align-items:center;gap:22px;padding:0 24px 0 40px;background:linear-gradient(var(--bg),rgba(6,6,6,.9));border-bottom:1px solid var(--line)}
.top .proj{display:flex;align-items:baseline;gap:10px;min-width:0}
.top .proj b{font-weight:600;font-size:15px;white-space:nowrap}
.top .proj span{font-size:13px;color:var(--dim);white-space:nowrap}
.steps{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:13px;color:var(--dim)}
.bars{display:flex;gap:3px}
.bars i{width:22px;height:3px;background:rgba(244,241,234,.18)}
.bars i.done{background:rgba(244,241,234,.7)}
.bars i.now{background:linear-gradient(90deg,var(--ink) var(--p,33%),rgba(244,241,234,.18) 0)}
.ibtn{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);padding:4px 8px}
.ibtn:hover{color:var(--ink)}
.ibtn .dot{position:absolute;top:2px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--new)}
.is-room .app{padding-top:64px}
.is-room .side{padding-top:28px}

/* 접힌 결정: 아이콘 줄 */
.folds{display:flex;gap:8px;flex-wrap:wrap}
.fold{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.02);text-align:left;transition:border-color .2s,background .2s}
.fold:hover,.fold[aria-expanded=true]{border-color:rgba(244,241,234,.5);background:rgba(255,255,255,.05)}
.fold .ico{display:grid;place-items:center;width:40px;height:40px;background:rgba(255,255,255,.06);overflow:hidden}
.fold .ico img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.fold .t{display:flex;flex-direction:column;line-height:1.25}
.fold .t small{font-size:11px;color:var(--faint)}
.fold .t span{font-size:13px}
.fold.is-rec .t small::after{content:' · 추천';color:var(--dim)}
.fold.is-set .t small::after{content:' · 고름';color:var(--ink)}
.fold.is-done .ico{color:var(--ink)}
.fold.is-new::after{content:'';position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--new)}

/* 오른쪽 무대 */
.stage{position:relative;overflow:hidden;background:#000}
.sheet{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;background:rgba(6,6,6,.96);padding:28px 32px;animation:sheet .45s var(--ease)}
@keyframes sheet{from{opacity:0;transform:translateY(14px)}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.sheet-head h2{margin:0;font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.04em}
.sheet .hall{flex:1;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);text-align:left;transition:border-color .2s}
.card:hover,.card[aria-pressed=true]{border-color:var(--ink)}
.card h3{margin:0;font-family:var(--serif);font-weight:300;font-size:24px;letter-spacing:-.03em}
.card p{margin:0;color:var(--dim);font-size:14px}
.card img{aspect-ratio:3/4;object-fit:cover;object-position:50% 15%;width:100%}
.card .rec{font-size:12px;color:var(--faint)}

/* 장면 이미지: 컷 띠 */
.cuts{position:absolute;inset:0;display:flex;flex-direction:column}
.cut-hall{position:relative;flex:1;overflow:hidden}
.cut-track{position:absolute;inset:24px auto 24px 0;display:flex;align-items:center;gap:6px;transition:transform .9s var(--ease)}
.cut{position:relative;flex:none;width:72px;height:100%;transition:width .9s var(--ease),height .9s var(--ease),filter .5s;overflow:hidden;cursor:pointer;transition:width .9s var(--ease),filter .5s;filter:brightness(.55) saturate(.6)}
.cut img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cut.on{filter:none;background:#000}

.cut .no{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
.cut .mark{position:absolute;right:8px;top:8px;display:grid;place-items:center;width:24px;height:24px;background:var(--ink);color:#000}
.cut .mark .icon{width:14px;height:14px}
.cut-info{display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:start;padding:18px 32px 24px;border-top:1px solid var(--line);min-height:128px}
.cut-info .mono{font-size:13px;color:var(--dim)}
.cut-info p{margin:4px 0 0;font-size:17px}
.cut-acts{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);font-size:14px;transition:.2s}
.chip:hover,.chip[aria-pressed=true]{border-color:var(--ink)}
.chip[aria-pressed=true]{background:rgba(244,241,234,.1);border-color:var(--ink)}
.note{grid-column:1/-1;display:flex;gap:10px}
.note textarea{flex:1;min-height:44px;max-height:120px;background:transparent;border:1px solid var(--line);padding:10px 12px;resize:vertical;outline:none}
.note textarea:focus{border-color:var(--ink)}

/* 대화 서랍 */
.drawer{position:fixed;top:64px;right:0;bottom:0;z-index:20;width:min(400px,100vw);display:flex;flex-direction:column;background:#0d0d0c;border-left:1px solid var(--line);animation:drawer .4s var(--ease)}
@keyframes drawer{from{transform:translateX(30px);opacity:0}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.talk{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:20px}
.say{max-width:86%;display:flex;flex-direction:column;gap:4px}
.say .who{font-size:12px;color:var(--faint)}
.say .who .mono{font-size:12px}
.say p{margin:0;font-size:15px;line-height:1.55}
.say.staff{align-self:flex-start;padding:12px 14px;background:rgba(255,255,255,.06)}
.say.me{align-self:flex-end;text-align:right}
.say.news .who::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--new);margin-right:6px;vertical-align:1px}
.send{display:flex;gap:8px;padding:14px 20px 20px;border-top:1px solid var(--line)}
.send input{flex:1;background:transparent;border:0;border-bottom:1px solid rgba(244,241,234,.35);padding:10px 0;outline:none}

/* 의뢰서 */
.drop{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;border:1px dashed rgba(244,241,234,.3);text-align:left}
.drop:hover{border-color:var(--ink)}
.drop .thumbs{display:flex;gap:6px}
.drop .thumbs img{width:44px;height:44px;object-fit:cover}
.chans{display:flex;gap:6px;flex-wrap:wrap}
.chans button{min-height:38px;padding:0 12px;border:1px solid var(--line);font-size:14px}
.chans button[aria-pressed=true]{background:rgba(244,241,234,.1);border-color:var(--ink)}
.chans button[aria-pressed=true]::before{content:'✓ '}
.q{display:flex;flex-direction:column;gap:8px}
.q .qn{display:flex;gap:8px;align-items:baseline;font-size:14px}
.q .qn .mono{font-size:12px;color:var(--faint)}
.folds-head{font-size:13px;color:var(--dim)}

.brief{margin:0;padding:20px;display:flex;flex-direction:column}
.brief div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.brief dt{color:var(--faint)}.brief dd{margin:0}
.fold.is-done,.fold.is-status{cursor:default}
.consent{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.consent input{accent-color:#f4f1ea;width:16px;height:16px}
.mock-later{position:absolute;right:20px;bottom:20px;z-index:3;font-size:12px;color:var(--dim);border:1px dashed rgba(244,241,234,.3);padding:6px 10px}
.top .logo{align-self:center}

/* 휴대폰 */
@media (max-width:900px){
  :root{--panel:1fr;--w0:30px;--gap:4px}
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100dvh}
  .hall-wrap{order:-1;height:56dvh}
  .side{padding:24px 20px 28px;border-right:0}
  .side-body{margin:0;padding:12px 0}
  h1{font-size:34px}
  .top{padding:0 12px 0 16px;gap:10px}
  .top .proj span,.steps{display:none}
  .top .proj{flex:1;overflow:hidden}
  .top .proj b{overflow:hidden;text-overflow:ellipsis}
  .ibtn{white-space:nowrap}
  .stage{height:62dvh;order:1}
  .is-room .side{order:2}
  .cut-info{padding:14px 16px 18px}
  .sheet{position:fixed;inset:auto 0 0 0;z-index:30;max-height:80dvh;overflow:auto;padding:18px 16px 24px;border-top:1px solid var(--line);box-shadow:0 -20px 40px rgba(0,0,0,.5)}
  .sheet .hall{flex:none;height:52dvh}
  .fold{min-height:48px;padding-right:10px}
  .fold .t span{font-size:12px}
}
</style>

<body>
<div class="app" id="app"></div>
<script type="module">
import { MODELS, FILMS, PROJECT, STAGES, CHECKS, DIRECTIONS, OFFER, KEEP, LOOKS, HAIRS, CUTS, TALK, CHANNELS, FOLDED, PACKAGES, CHECK_COPY, briefHTML, mixedRow, modelById, icon, video, playNow, stopNow, reduced, sound, router, mockBar, bindLogin, bindFolds, $, $$, wait } from './공통.js';

const LOGO = '../../마케팅/온라인마케팅지도/engagement/company/public/pulse-app/assets/request/logo-paper.webp'; // 어두운 바탕용(고객 앱과 같은 파일)
const app = $('#app');
const isPhone = () => matchMedia('(max-width:900px)').matches;
const state = { pick: { model: 'F02', dir: 'poster', look: KEEP, hair: KEEP }, notes: {}, liked: {}, cut: 0, talk: 'pick' };
let offKeys = null;

/* ── 복도: 세로 띠 한 줄. 가운데(앵커) 한 칸만 넓고 걷는다. ── */
function corridor(host, items, { anchor = 0.32, autoplay = true, onPick, center = false, hover = true } = {}) {
  const N = items.length, list = [...items, ...items, ...items];
  const track = document.createElement('div'); track.className = 'track';
  const strips = list.map((it, i) => {
    const s = document.createElement('button');
    s.className = 'strip'; s.type = 'button';
    s.setAttribute('aria-label', it.kind === 'model' ? `${it.name}, ${it.line}` : `완성 광고 ${it.name}`);
    const img = new Image(); img.src = it.kind === 'model' ? it.tall : it.poster; img.alt = ''; img.loading = i < N * 2 && i >= N - 6 ? 'eager' : 'lazy';
    s.append(img);
    const tag = document.createElement('div'); tag.className = 'tag';
    tag.innerHTML = it.kind === 'model'
      ? `<div class="nm">${it.name}<span class="en">${it.en}</span><span class="mono kind">${it.id}</span></div><p>${it.line} · ${it.meta}</p>`
      : `<div class="kind">완성 광고 · <span class="mono">${it.len}</span></div><div class="nm" style="font-size:22px">${it.name}</div>`;
    s.append(tag);
    s.addEventListener('click', () => { set(i); hold(); onPick?.(it); });
    s.addEventListener('mouseenter', () => { if (hover && !isPhone()) { set(i); hold(); } });
    track.append(s);
    return s;
  });
  host.append(track);
  let cur = N, timer = null, pause = 0, vid = null, alone = false;
  const w1 = () => Math.min(host.clientHeight * 9 / 16, host.clientWidth * (isPhone() ? 0.62 : 0.46));
  const w0 = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--w0')) || 58;
  const gap = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 6;
  function place(animate = true) {
    const W1 = alone ? Math.min(host.clientHeight * 9 / 16, host.clientWidth) : w1();
    host.style.setProperty('--w1', `${W1}px`);
    // 접힌 띠(gone)는 폭 0이라 자리를 차지하지 않는다 — 앞선 띠 가운데 살아 있는 것만 센다.
    const before = alone ? 0 : cur;
    const x = (alone || center ? (host.clientWidth - W1) / 2 : host.clientWidth * anchor) - before * (w0() + gap());
    track.style.transition = animate ? '' : 'none';
    track.style.transform = `translateX(${x}px)`;
    if (!animate) { track.offsetWidth; track.style.transition = ''; }
  }
  function set(i, animate = true) {
    if (i < N / 2) { cur = i + N; place(false); i += N; }
    if (i >= N * 2 + N / 2) { cur = i - N; place(false); i -= N; }
    strips[cur]?.classList.remove('on', 'live'); stopNow(vid); vid?.remove(); vid = null;
    cur = i; const s = strips[cur], it = list[cur];
    s.classList.add('on');
    vid = video(it.video, '', { auto: false });
    const mine = s; vid.addEventListener('playing', () => { vid?.classList.add('is-ready'); mine.classList.add('live'); }, { once: true });
    s.insertBefore(vid, s.querySelector('.tag'));
    playNow(vid);
    place(animate);
  }
  const hold = () => { pause = Date.now() + 7000; };
  function tick() { if (Date.now() > pause) set(cur + 1); }
  set(cur, false);
  if (autoplay && !reduced) timer = setInterval(tick, 4000);
  addEventListener('resize', () => place(false));
  return {
    to(id) { // 가장 가까운 같은 사람으로
      const near = list.map((it, i) => it.id === id ? i : -1).filter(i => i >= 0).sort((a, b) => Math.abs(a - cur) - Math.abs(b - cur))[0];
      clearInterval(timer); timer = null; set(near); return strips[near];
    },
    focus(id) { // 그 사람만 남기고 접는다 — 한 장의 세로 초상으로 가운데에
      const s = this.to(id);
      strips.forEach(x => { if (x !== s) x.classList.add('gone'); });
      alone = true; place(true);
      return s;
    },
    refresh() { place(false); },
    stop() { clearInterval(timer); stopNow(vid); },
    get current() { return list[cur]; },
  };
}

let hallCtl = null;
const stopHall = () => { hallCtl?.stop(); hallCtl = null; };

/* ── 입장 ── */
function viewEntry() {
  stopHall(); document.body.classList.remove('is-room'); $('.top')?.remove(); $('.drawer')?.remove();
  app.innerHTML = `
  <section class="side">
    <img class="logo" src="${LOGO}" alt="synk PULSE">
    <div class="side-body">
      <h1>내 광고 방</h1>
      <p class="lede">의뢰서에 적은 메일만 넣으면 열려요.<br>가입도 비밀번호도 없어요.</p>
      <form data-login novalidate>
        <div class="field" data-step="email"><span>메일</span><input name="email" type="email" autocomplete="email" placeholder="name@company.com"></div>
        <div class="field" data-step="code" hidden><span>메일로 온 여섯 자리</span><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
        <p class="msg" data-msg aria-live="polite"></p>
        <div class="row"><button class="go" type="submit"><span data-go-label>코드 받기</span>${icon('arrow')}</button><button type="button" class="link" data-back data-step="code" hidden>다른 메일</button></div>
      </form>
      <button type="button" class="link" data-linkopen style="align-self:flex-start">담당자에게 받은 링크로 열기</button>
      <form data-linkform hidden novalidate><div class="field"><span>접수증이나 담당자에게 받은 링크</span><input name="invite" inputmode="url" placeholder="https://workspace.synk.im/pulse-app/#invite=…"></div><p class="msg" data-linkmsg></p><button class="go ghost">열기 ${icon('arrow')}</button></form>
    </div>
    <div class="side-foot">
      <div class="row"><span class="small">처음이세요?</span><button class="go ghost" data-go="request">광고 의뢰하기 ${icon('arrow')}</button></div>
    </div>
  </section>
  <section class="hall hall-wrap" aria-label="AI 모델과 완성 광고"><span class="hall-note">AI로 만든 가상 인물이에요</span></section>`;
  hallCtl = corridor($('.hall', app), mixedRow());
  bindLogin($('[data-login]', app), () => go('moment'));
  const lf = $('[data-linkform]', app);
  $('[data-linkopen]', app).onclick = () => { lf.hidden = !lf.hidden; if (!lf.hidden) lf.querySelector('input').focus(); };

    if (animate) sound.tick();
  }
  function marks() {

  requestAnimationFrame(() => { show(state.cut, false); marks(); });
}

  $('[data-fold=model]', app).addEventListener('click', () => setTimeout(() => { if (!picker) picker = corridor($('#reqHall', app), MODELS, { autoplay: false, anchor: 0.3, hover: false }); else picker.refresh(); }, 0));
  $('[data-choose-model]', app).addEventListener('click', () => { const it = picker.current; const f = $('[data-fold=model]', app); f.classList.replace('is-rec', 'is-set'); f.querySelector('.ico').innerHTML = faceIco(it.id); f.querySelector('[data-val]').textContent = it.name; $('[data-sheet=model]', app).hidden = true; sound.tick(); });
  $$('.chans button', app).forEach(b => b.addEventListener('click', () => { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); sound.tick(); }));
  $('[data-photo]', app).addEventListener('click', () => { const t = $('.thumbs', app); if (t.children.length < 3) t.insertAdjacentHTML('beforeend', `<img src="./assets/cut-05.webp" alt="">`); sound.tick(); });
  $('[data-send]', app).addEventListener('click', () => {
    const msg = $('[data-sendmsg]', app), mail = $('#mail', app).value.trim();
    if (!/^\S+@\S+\.\S+$/.test(mail)) { msg.textContent = '답을 받을 메일을 넣어 주세요. 이 메일로 방을 열어요.'; $('#mail', app).focus(); return; }
    if (!$('#agree', app).checked) { msg.textContent = '정보 수집 · 이용 동의가 있어야 보낼 수 있어요.'; return; }
    sound.shutter();
    $('.side-body', app).innerHTML = `<p class="turn is-busy"><i></i>접수했어요 · 저희 차례</p><h1>지금은<br>저희 차례예요</h1><p class="lede">${CHECK_COPY.text}</p><button class="mock-later" style="position:static;align-self:flex-start" data-go="moment">시안: 방향 두 안이 도착한 날로</button>`;
  });
}

const go = router({ entry: viewEntry, moment: viewMoment, pick: viewPick, wait: viewWait, images: viewImages, request: viewRequest });
mockBar('A 캐스팅 복도');

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE 시안 · 의뢰서 F 세 막</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./공통.css">
<style>
/* 컨셉: 의뢰서를 세 막으로 나눈다. 1막 고르기는 노란 바탕의 솔리오, 2막 적기는 흰 문 뒤에서 내다보는 작품 장면, 3막 보내기는 그 문이 선 하늘.
   바탕은 검정 → 노랑 → 흰색 → 하늘로 막이 바뀔 때만 바뀐다. 칸 크기, 단추 자리, 눌렀을 때 일어나는 일은 세 막이 같다.
   강조 순위: ① 지금 질문 ② 고를 칸 · 적을 칸 ③ 아래 띠의 값과 단추. 한 화면에 한 가지만 묻는다.
   움직임: 막이 바뀔 때 바탕이 0.6초 겹쳐 바뀌고 글이 8px 올라온다. 1막은 솔리오의 눈만, 2막은 다음을 누를 때마다 문 뒤의 사람이 한 걸음씩 나온다(작품 속 그 장면), 3막은 고른 날짜가 하늘에 적힌다.
   글자: 1막 질문 SUIT 800, 2 · 3막 질문 Noto Serif KR 300, 칸 · 단추 SUIT 600~700. 색: 막의 바탕 하나, 먹, 흰색. 고른 칸은 먹(하늘에서는 흰색)으로 채운다. */
:root{--pad:clamp(24px,5vw,72px);--r:16px;--fade:.6s}
html,body{height:100%}
body{overflow-x:hidden;background:#050505;color:#fff;transition:background-color var(--fade),color var(--fade)}
.app{position:relative;min-height:100vh;min-height:100dvh;display:grid;isolation:isolate}
.media{position:absolute;inset:0;z-index:-2;overflow:hidden}
.media>*{position:absolute;opacity:0;transition:opacity var(--fade)}
.top{display:flex;align-items:center;gap:20px}
.logo{display:block;height:24px;width:auto}
.acts{display:flex;gap:18px;margin:0 auto;font-size:15px;font-weight:600;letter-spacing:-.02em}
.acts span{opacity:.42;transition:opacity .3s}
.acts span.on{opacity:1;font-weight:800}
.later{font-size:15px;font-weight:600}
h1{margin:0;white-space:pre-line;text-wrap:balance}
.lead{margin:14px 0 0;max-width:24em;font-size:18px;font-weight:500;line-height:1.5;letter-spacing:-.02em}
.lead:empty{display:none}
.body{display:flex;flex-direction:column;min-width:0}
.q{display:flex;flex-direction:column;gap:14px;animation:rise .42s var(--ease)}
.ask.swap{animation:rise .42s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sub{margin:10px 0 -2px;font-size:16px;font-weight:700;letter-spacing:-.02em}
.sub:first-child{margin-top:0}

/* 고르는 줄 · 그림 칸 */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;min-height:76px;padding:12px 22px;border-radius:var(--r);text-align:left;transition:background .15s,color .15s}
.row b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.row small{display:block;margin-top:2px;font-size:15px;font-weight:500}
.row .won{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;gap:2px;padding:8px 8px 12px;border-radius:var(--r);text-align:left;transition:background .15s,color .15s}
.tile .pic{display:grid;place-items:center;height:78px;margin-bottom:8px;border-radius:10px}
.tile b{padding:0 6px;font-size:16px;font-weight:700;letter-spacing:-.03em;line-height:1.3}
.tile small{padding:0 6px;font-size:13px;font-weight:500;line-height:1.4}
.tile .won{padding:0 6px;margin-top:3px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.scr{display:block;border-radius:5px;background:currentColor}
.scr.r916{width:26px;height:46px}.scr.r169{width:62px;height:35px}.scr.r11{width:42px;height:42px}
.stand{display:flex;flex-direction:column;align-items:center}.stand i{width:3px;height:10px;background:currentColor}.stand u{width:26px;height:3px;border-radius:2px;background:currentColor}
.bars{display:flex;flex-direction:column;gap:6px;width:78%}.bars i{display:block;height:7px;border-radius:4px;background:currentColor}
.shots{display:flex;gap:4px}.shots i{width:12px;height:18px;border-radius:3px;background:currentColor}

/* 적는 칸 */
.f{position:relative;display:block}
.f span{position:absolute;left:20px;top:12px;font-size:14px;font-weight:600;pointer-events:none}
.f input{display:block;width:100%;height:74px;padding:26px 20px 6px;border:0;border-radius:var(--r);font-size:20px;font-weight:600;letter-spacing:-.02em;outline:none;transition:box-shadow .15s,background .15s}
.f.big input{height:92px;padding-top:34px;font-size:28px;font-weight:700}
.f.big span{top:14px;font-size:15px}
.f .err{display:none;position:absolute;right:18px;top:12px;font-size:14px;font-weight:700;font-style:normal}
.f.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 16px;border-radius:var(--r);font-size:17px;font-weight:600;letter-spacing:-.02em;transition:background .15s,color .15s}
.picks{display:flex;flex-wrap:wrap;gap:8px}.picks .pick{flex:1 1 0;min-width:0;min-height:54px;font-size:16px}
.link{align-self:flex-start;padding:8px 0;font-size:16px;font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}

/* 자료 칸 */
.drops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:132px;padding:14px 16px;border-radius:var(--r);overflow:hidden;cursor:pointer;transition:background .15s}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop b{position:relative;font-size:17px;font-weight:700;letter-spacing:-.03em}
.drop small{position:relative;font-size:14px;font-weight:600}
.drop .need{position:absolute;left:16px;top:13px;font-size:13px;font-weight:800}
.drop .plus{position:absolute;right:14px;top:8px;font-size:28px;font-weight:300;line-height:1}
.drop.in::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.66))}
.drop.in b,.drop.in small{z-index:2;color:#fff}
.drop.in .need,.drop.in .plus{display:none}
.drop.in .ok{position:absolute;z-index:2;left:14px;top:12px;padding:3px 9px;border-radius:999px;background:#fff;color:#111;font-size:13px;font-weight:800}
.drop:focus-within{box-shadow:inset 0 0 0 3px currentColor}

/* 추천 목록 */
.rec{margin:0;display:flex;flex-direction:column}
.rec div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:15px 0;border-top:1px solid rgba(10,10,10,.12);font-size:17px}
.rec div:last-child{border-bottom:1px solid rgba(10,10,10,.12)}
.rec dt{font-weight:700}.rec dd{margin:0;font-weight:500}

/* 달력 */
.cal{display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.cal-move{display:flex;gap:6px}
.cal-move button{display:grid;place-items:center;width:44px;height:44px;border-radius:12px}
.cal-move button:disabled{opacity:.25}
.cal-move svg,.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{padding:2px 0 4px;text-align:center;font-size:14px;font-weight:600}
.day{position:relative;display:grid;place-items:center;height:56px;border-radius:999px;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:background .15s,color .15s}
.day small{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:11px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.day.tag{padding-bottom:12px}
.day:disabled{cursor:default}
.hint{margin:0;min-height:26px;font-size:16px;font-weight:500}

/* 영수증 */
.paper{display:flex;flex-direction:column;gap:14px;padding:24px 26px;border-radius:26px;background:#fff;color:#0b1b30}
.lines{margin:0}
.lines div{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid #e6e9ee;font-size:16px}
.lines dt{font-weight:700}.lines dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.lines button{font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.price span{font-size:16px;font-weight:700}
.price b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price s{margin-right:8px;font-size:17px;font-weight:600;color:#7a8494}
.note{margin:-6px 0 0;font-size:15px;font-weight:500;line-height:1.5}
.code{display:flex;gap:8px}
.code input{flex:1;min-width:0;height:48px;padding:0 14px;border:0;border-radius:12px;background:#f0f2f5;font-family:var(--mono);font-size:16px;letter-spacing:.1em;text-transform:uppercase;outline:none}
.code input:focus{box-shadow:inset 0 0 0 2px #0b1b30}
.code button{padding:0 18px;border-radius:12px;background:#0b1b30;color:#fff;font-size:15px;font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600;line-height:1.45;cursor:pointer}
.agree input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:#0b1b30}
.agree.bad{color:#b0240f}
.status{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.status i{width:10px;height:10px;background:var(--busy)}
.next{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.next li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px solid #e6e9ee;font-size:16px;font-weight:500;line-height:1.45}
.next li b{font-weight:800}

/* 추천 · 중복 확인 */
.badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:#fed027;color:#111;font-size:12px;font-weight:800;letter-spacing:-.02em;vertical-align:3px}
.why{margin:0;font-size:16px;font-weight:600;line-height:1.5}
.notice{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:var(--r);background:#fff3c4;color:#111}
[data-act="2"] .notice{background:#f1f2f4}
.notice b{font-size:18px;font-weight:800;letter-spacing:-.03em}
.notice p{margin:0;font-size:15px;font-weight:500;line-height:1.5}
.notice .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.notice .row2 button{min-height:48px;padding:0 18px;border-radius:12px;background:#111;color:#fff;font-size:15px;font-weight:700}
.notice .row2 button+button{background:transparent;color:inherit;text-decoration:underline;text-underline-offset:3px}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;height:56px;padding:0 16px;border:0;border-radius:14px;background:#f3f3f1;font-size:17px;font-weight:600;outline:none}
.guess input:focus{box-shadow:inset 0 0 0 2px #111}
.guess button{padding:0 18px;border-radius:14px;background:#111;color:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.suggest{margin:-6px 0 0;font-size:15px;font-weight:600}
.suggest button{margin-left:6px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.drop .warn{position:absolute;z-index:3;left:10px;right:10px;top:10px;padding:8px 10px;border-radius:10px;background:#111;color:#fff;font-size:13px;font-weight:700;line-height:1.4}
.seat{margin:0;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.18);font-size:15px;font-weight:600;line-height:1.5}
.code-msg{margin:-6px 0 0;font-size:14px;font-weight:700;color:#b0240f}
.start2{margin:34px 0 0 22px;font-size:17px;font-weight:700;color:#fff;text-decoration:underline;text-underline-offset:4px}
.ask .start2{display:none}[data-act="0"] .ask .start2:not([hidden]){display:inline-block}
[data-act="1"] .tile[aria-checked=true] .badge,[data-act="1"] .row[aria-checked=true] .badge{background:#fed027;color:#111}

/* 아래 띠 */
.foot{display:flex;align-items:center;gap:18px}
.back{font-size:17px;font-weight:600;padding:14px 4px}
.sum{flex:1;min-width:0;margin:0;text-align:right;line-height:1.35}
.sum b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sum small{font-size:14px;font-weight:500}
.go{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-width:190px;min-height:64px;padding:0 28px;border-radius:var(--r);font-size:19px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;transition:transform .15s,opacity .15s}
.go:active{transform:scale(.98)}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
input:focus-visible{outline:none}

/* ── 0 검은 첫 화면에서 들어오는 자리 ── */
[data-act="0"] .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:44px var(--pad)}
[data-act="0"] .acts,[data-act="0"] .later,[data-act="0"] .body,[data-act="0"] .foot{display:none}
[data-act="0"] .ask{align-self:center;padding-bottom:8vh}
[data-act="0"] h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,5.6vw,86px);line-height:1.16;letter-spacing:-.055em}
[data-act="0"] .lead{color:rgba(255,255,255,.86)}
.start{display:inline-flex;align-items:center;gap:14px;margin-top:34px;min-height:64px;padding:0 30px;border-radius:999px;background:#fff;color:#050505;font-size:19px;font-weight:700;letter-spacing:-.03em}
.start svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ask .start{display:none}[data-act="0"] .ask .start{display:inline-flex}
[data-act="0"] .m-still{opacity:.55}
.m-still{right:0;top:0;width:46%;height:100%;object-fit:cover;-webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%)}

/* ── 1막 고르기: 노란 바탕, 솔리오가 서서 묻고 흰 판에서 고른다 ── */
[data-act="1"]{background:#fed027;color:#111}
[data-act="1"] .app{grid-template-columns:minmax(0,1fr) minmax(0,52%);grid-template-rows:auto 1fr auto;padding:20px 20px 20px 0}
[data-act="1"] .top{grid-column:1;padding:24px 24px 0 var(--pad);flex-wrap:wrap}
[data-act="1"] .ask{grid-column:1;grid-row:2/4;padding:clamp(24px,5vh,52px) 24px 0 var(--pad)}
[data-act="1"] .body{grid-column:2;grid-row:1/3;background:#fff;border-radius:36px 36px 0 0;padding:clamp(28px,5vh,52px) clamp(24px,3.6vw,56px) 10px;justify-content:center;overflow:auto}
[data-act="1"] .foot{grid-column:2;grid-row:3;background:#fff;border-radius:0 0 36px 36px;padding:18px clamp(24px,3.6vw,56px) clamp(24px,4vh,40px)}
[data-act="1"] h1{font-family:var(--sans);font-weight:800;font-size:clamp(38px,4.5vw,66px);line-height:1.14;letter-spacing:-.055em}
[data-act="1"] .m-solio{opacity:1}
.m-solio{left:0;bottom:0;width:48%;height:74%}
.scene{position:absolute;left:50%;bottom:-8%;height:100%;aspect-ratio:1;transform:translateX(-50%);opacity:0;transition:opacity .35s;container-type:size}
.scene.on{opacity:1}
.scene img{width:100%;height:100%;-webkit-mask:radial-gradient(closest-side,#000 80%,transparent 100%);mask:radial-gradient(closest-side,#000 80%,transparent 100%)}
.eyes{position:absolute;display:flex;justify-content:space-between;transform:translate(var(--ex,0),var(--ey,0));transition:transform .35s var(--ease)}
.eyes i{width:33.5%;border-radius:50%;background:#fff6dd;box-shadow:0 0 1.2vh rgba(255,232,170,.55);transition:transform .09s}
.blink .eyes i{transform:scaleY(.08)}
[data-act="1"] .row,[data-act="1"] .tile{background:#f3f3f1}
[data-act="1"] .row:hover,[data-act="1"] .tile:hover{background:#e9e9e5}
[data-act="1"] .row small,[data-act="1"] .tile small{color:#3d3d3a}
[data-act="1"] .row[aria-checked=true],[data-act="1"] .tile[aria-checked=true]{background:#111;color:#fff}
[data-act="1"] .row[aria-checked=true] small,[data-act="1"] .tile[aria-checked=true] small{color:#d6d6d2}
[data-act="1"] .tile .pic{background:#fff;color:#111}
[data-act="1"] .tile[aria-checked=true] .pic{background:#2a2a2a;color:#fed027}
[data-act="1"] .go{background:#fed027;color:#111;border-radius:20px}
[data-act="1"] .row,[data-act="1"] .tile{border-radius:20px}

/* ── 2막 적기: 왼쪽 흰 양식이 문이고, 작품 속 사람이 그 뒤에서 한 걸음씩 나온다 ── */
[data-act="2"]{background:#fff;color:#0a0a0a}
[data-act="2"] .app{grid-template-columns:50% 1fr;grid-template-rows:auto auto 1fr auto}
.app::before{content:'';position:absolute;z-index:-1;left:0;top:0;bottom:0;width:50%;background:#fff;box-shadow:1px 0 0 rgba(10,20,40,.14),18px 0 40px -18px rgba(20,30,50,.42);opacity:0;transition:opacity var(--fade)}
[data-act="2"] .app::before{opacity:1}
[data-act="2"] .top,[data-act="2"] .ask,[data-act="2"] .body,[data-act="2"] .foot{grid-column:1;padding-inline:var(--pad)}
[data-act="2"] .top{padding-top:44px}
[data-act="2"] .ask{padding-top:clamp(20px,4vh,44px)}
[data-act="2"] h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,3.9vw,58px);line-height:1.22;letter-spacing:-.05em}
[data-act="2"] .body{padding-top:clamp(18px,3vh,30px);overflow:auto}
[data-act="2"] .foot{padding-block:22px 40px}
[data-act="2"] .m-door{opacity:1}
.m-door{top:0;left:50%;width:max(108vw,192vh);height:auto;max-width:none;transform:translateX(-53.5%)}
[data-act="2"] .f input,[data-act="2"] .pick,[data-act="2"] .drop{background:#f1f2f4}
[data-act="2"] .pick:hover,[data-act="2"] .drop:hover{background:#e3e5e9}
[data-act="2"] .f input:focus{background:#fff;box-shadow:inset 0 0 0 2px #0a0a0a}
[data-act="2"] .f.bad input{box-shadow:inset 0 0 0 2px #c92a12}
[data-act="2"] .err{color:#c92a12}
[data-act="2"] .pick[aria-pressed=true],[data-act="2"] .go{background:#0a0a0a;color:#fff}
[data-act="2"] .drop .need{color:#0a0a0a}

/* ── 3막 보내기: 그 문이 선 하늘. 고른 날짜가 하늘에 적힌다 ── */
[data-act="3"]{background:#3f7fbe;color:#fff}
[data-act="3"] .app{grid-template-columns:minmax(0,1fr) minmax(0,600px);grid-template-rows:auto 1fr auto;column-gap:5vw;padding:44px var(--pad) 40px}
[data-act="3"] .top{grid-column:1/3}
[data-act="3"] .ask{grid-column:1;grid-row:2/4;padding-top:clamp(28px,7vh,72px);color:#03152e}
[data-act="3"] .body{grid-column:2;grid-row:2;justify-content:center;padding-block:22px}
[data-act="3"] .foot{grid-column:2;grid-row:3}
[data-act="3"] h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,4.7vw,72px);line-height:1.2;letter-spacing:-.055em}
[data-act="3"] .m-sky,[data-act="3"] .m-shade{opacity:1}
.m-sky{inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 100%}
.m-shade{inset:0;background:linear-gradient(90deg,rgba(6,38,80,0) 34%,rgba(6,38,80,.34) 60%,rgba(6,38,80,.38))}

    for (const k in bad) $(`[data-f="${k}"]`).classList.toggle('bad', bad[k]);
    const f = Object.keys(bad).find(k => bad[k]); if (f) { $(`[data-f="${f}"] input`).focus(); return; }
  }
  if (s.step === 'when' && !s.date && !s.free) return tell(true);
  if (s.step === 'review' && !(s.consent && s.rights)) { $$('[data-agree]').forEach(n => n.classList.toggle('bad', !s[n.dataset.agree])); return; }
  if (s.step === 'review') { if (s.sending) return; s.sending = true; $('[data-go] span').textContent = '보내는 중'; $('[data-go]').setAttribute('aria-disabled', 'true'); setTimeout(() => { s.sending = false; to('sent'); }, 900); return; }
  if (s.step === 'sent') { const p = $('.paper'); if (p && !p.querySelector('.end')) p.insertAdjacentHTML('beforeend', '<p class="note end" style="margin:4px 0 0">시안은 여기까지예요. 실제로는 이 의뢰의 프로젝트 방이 열려요.</p>'); return; }
  to(STEPS[i + 1]);
}
function back() { const i = STEPS.indexOf(s.step); if (i === 0) { s.act = 0; render(true); return; } to(STEPS[i - 1]); }

document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  const d = el.dataset;
  if ('start' in d) {
    if (s.mock === 'draft') { demo(true); s.mock = ''; s.step = 'more'; render(true); return; }
    if (s.mock === 'sent') { s.mock = 'sent-mailed'; render(true); return; }
    if (s.mock === 'sent-mailed') { s = blank(); render(true); return; }
    s = { ...blank(), prevOn: s.prevOn, seatFull: s.seatFull }; s.act = 1; s.step = 'kind'; render(true);
  }
  else if ('start2' in d) { s.mock = { draft: 'draft-new', 'draft-new': 'draft', sent: '' }[s.mock] ?? ''; if (s.mock === '' ) { s = blank(); s.act = 1; s.step = 'kind'; } render(true); }
  else if (d.mock) {
    if (d.mock === 'draft' || d.mock === 'sent') { s = blank(); s.mock = d.mock; render(true); }
    if (d.mock === 'prev') { s.prevOn = true; s.nameOk = false; s.nameDup = false; if (s.act === 0) { s.act = 1; } Object.assign(s, { kind: s.kind || 'product', name: '첨벙댕 강아지 구명조끼' }); to('name'); }
    if (d.mock === 'seat') { s.seatFull = !s.seatFull; if (s.step === 'when') render(); el.textContent = s.seatFull ? '자리 참 끄기' : '자리 참'; }
  }
  else if ('guessOpen' in d) { s.guessOpen = true; render(); $('[data-guess]').focus(); }
  else if ('guessGo' in d) { s.guess = $('[data-guess]').value.trim(); if (!s.guess) return; s.guessed = guessKind(s.guess); if (s.guessed) s.peek = s.guessed; render(); blink(); if (s.guessed) look($(`[data-kind="${s.guessed}"]`)); }
  else if ('openRoom' in d) { $('[data-room-note]').hidden = false; }
  else if ('nameOk' in d) { s.nameOk = true; s.nameDup = false; next(); }
  else if (d.t2) { s.date = +d.t2; s.free = false; $$('.day').forEach(n => n.setAttribute('aria-pressed', n.dataset.t === d.t2)); $('[data-free]').setAttribute('aria-pressed', 'false'); tell(); skyDate(); }
  else if ('fixMail' in d) { s.who.email = d.fixMail; $('[data-who="email"]').value = d.fixMail; mailHint(); }
  else if ('later' in d) { s.act = 0; render(true); }
  else if ('go' in d) next();
  else if ('back' in d) back();
  else if (d.kind) { if (s.kind !== d.kind) { s.files = {}; const rec = KINDS.find(k => k.id === d.kind).rec; s.chan = rec.chan; s.len = rec.len; s.date = null; } s.kind = d.kind; s.peek = ''; render(); blink(); look($(`[data-kind="${d.kind}"]`)); }
  else if (d.chan) { s.chan = +d.chan; render(); look($(`[data-chan="${d.chan}"]`)); }
  else if (d.len) { s.len = +d.len; render(); look($(`[data-len="${d.len}"]`)); }
  else if ('custom' in d) { s.custom = !s.custom; render(true); }
  else if (d.end) { s.end = +d.end; render(); }
  else if (d.feel) { s.feel = s.feel === +d.feel ? -1 : +d.feel; render(); }
  else if (d.approver) { s.approver = d.approver; $$('[data-approver]').forEach(n => n.setAttribute('aria-pressed', n === el)); }
  else if (d.t) { s.date = +d.t; s.free = false; $$('.day').forEach(n => n.setAttribute('aria-pressed', n === el)); $('[data-free]').setAttribute('aria-pressed', 'false'); tell(); skyDate(); }
  else if ('free' in d) { s.free = !s.free; if (s.free) s.date = null; el.setAttribute('aria-pressed', s.free); $$('.day').forEach(n => n.setAttribute('aria-pressed', 'false')); tell(); skyDate(); }
  else if (d.move) { s.page += +d.move; drawCal(); }
  else if (d.goto) to(d.goto);
  else if ('apply' in d) { const v = $('[data-code]').value.trim().toUpperCase(); s.codeMsg = ''; if (/^USED/.test(v)) s.codeMsg = '이미 쓴 초대코드예요. 크몽 · 숨고 메시지에서 새 코드를 받아 주세요.'; else if (/^[A-Z]{2}\d{4}$/.test(v)) s.code = true; else s.codeMsg = '맞지 않는 코드예요. 받으신 코드를 다시 확인해 주세요.'; render(); }
  else if ('demo' in d) demo();
  else if ('restart' in d) { s = blank(); render(true); video.currentTime = 0; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.file) {
    const f = t.files[0], i = +t.dataset.file; if (!f) return;
    const key = `${f.name}|${f.size}|${f.lastModified}`, at = Object.entries(s.files).find(([j, v]) => +j !== i && v.key === key);
    if (at) { s.dupAt = i; s.dupName = K().files[at[0]][0]; render(); setTimeout(() => { if (s.dupAt === i) { s.dupAt = -1; render(); } }, 2600); return; }
    s.dupAt = -1; s.files[i] = { key, url: f.type.startsWith('image/') ? URL.createObjectURL(f) : '' }; render();
    if (s.files[i].url) { const im = new Image(); im.onload = () => { if (s.files[i]?.key === key) { s.files[i].size = sizeNote(im.naturalWidth, im.naturalHeight); if (s.step === 'files') render(); } }; im.src = s.files[i].url; }
  }
  const a = t.closest('[data-agree]'); if (a) { s[a.dataset.agree] = t.checked; a.classList.remove('bad'); foot(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) s[t.dataset.bind] = t.value;
  if (t.dataset.who) { s.who[t.dataset.who] = t.value; if (t.dataset.who === 'email') mailHint(); }
  t.closest('.f')?.classList.remove('bad');
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.f input')) { e.preventDefault(); next(); } });
document.addEventListener('mouseover', e => {
  if (s.act !== 1) return; const r = e.target.closest('[data-kind]');
  const peek = r ? r.dataset.kind : ''; if (peek !== s.peek && (r || e.target.closest('.body') === null)) { s.peek = peek; stage(); }
  const o = e.target.closest('.row,.tile,.go'); if (o) look(o);
});
phone.addEventListener('change', () => render());

// 시안 도구: 첨벙댕 예시로 그 단계까지 채운다
function demo(quiet) {
  Object.assign(s, { kind: 'product', chan: 0, len: 1, name: '첨벙댕 강아지 구명조끼', nameOk: true });
  K().files.forEach(([, , img], i) => { if (img) s.files[i] = { key: img, url: IMG.file(img), size: '2048 × 2048 · 가까이 찍는 컷에도 충분해요' }; });
  Object.assign(s.who, { name: '김하늘', email: 'hello@example.com' }); s.approver = 'one';
  s.date = TODAY + 21 * DAY; s.consent = s.rights = true;
  if (quiet) { s.act = 2; return; }
  if (s.act === 0) { s.act = 1; s.step = 'kind'; }
  render(true);
}
render();
video.addEventListener('loadeddata', () => { if (s.act !== 2) video.currentTime = 0; }, { once: true });
window.__s = () => s;
}
</script>

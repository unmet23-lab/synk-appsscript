<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSE 시안 D · 먼저 말 거는 방</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./공통.css">
<style>
:root{--bg:#0b0a09;--panel:#121110;--ink:#f4f1ea;--dim:rgba(244,241,234,.6);--faint:rgba(244,241,234,.38);--line:rgba(244,241,234,.12);--staff:rgba(255,255,255,.065)}
body{background:var(--bg);color:var(--ink);overflow:hidden}
.logo{height:20px;width:auto;flex:none;align-self:flex-start}
.go{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:48px;padding:0 20px;border-radius:12px;background:var(--ink);color:#0b0a09;font-weight:650;font-size:15px;letter-spacing:-.02em;transition:transform .2s var(--ease)}
.go:hover{transform:translateY(-1px)}
.go .icon{width:18px;height:18px}
.go.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(244,241,234,.28)}
.small{font-size:13px;color:var(--faint)}
.link{color:var(--dim);font-size:14px}
.link:hover{color:var(--ink)}
.serif{font-family:var(--serif);font-weight:300;letter-spacing:-.04em}

/* 입장 */
.entry{display:grid;grid-template-columns:58% 42%;height:100dvh}
.screen{position:relative;overflow:hidden;background:#000}
.screen video,.screen img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;transition:transform .9s var(--ease)}
.screen .who{position:absolute;left:28px;bottom:24px;z-index:2;display:flex;align-items:baseline;gap:10px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.screen .who b{font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:-.04em}
.screen .who span{font-size:13px;color:var(--dim)}
.screen .ai{position:absolute;right:20px;top:18px;z-index:2;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);font-size:12px;color:var(--dim)}
.screen::after{content:'';position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
/* 띠(둘째 화면) */
.row{position:absolute;inset:0;display:flex;gap:5px;transition:transform 1.1s var(--ease)}
.row .s{position:relative;flex:none;width:46px;height:100%;overflow:hidden;filter:brightness(.55) saturate(.6);transition:width 1.1s var(--ease),filter .6s}
.row .s img,.row .s video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.row .s.on{filter:none}

.chat{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px;border-bottom:1px solid var(--line)}
.thread{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:26px}
.msg{display:flex;flex-direction:column;gap:5px;max-width:88%;animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg .by{font-size:12px;color:var(--faint)}
.msg .by .mono{font-size:11px}
.msg .b{padding:12px 15px;border-radius:14px 14px 14px 4px;background:var(--staff);font-size:15px;line-height:1.55}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .b{background:transparent;box-shadow:inset 0 0 0 1px rgba(244,241,234,.22);border-radius:14px 14px 4px 14px}
.msg.news .by::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--new);margin-right:6px;vertical-align:1px}
.typing{display:flex;gap:4px;padding:14px 16px;border-radius:14px;background:var(--staff);align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.quick{display:flex;gap:6px;flex-wrap:wrap;animation:pop .45s var(--ease) both}
.quick button{min-height:38px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(244,241,234,.25);font-size:14px}
.quick button:hover{box-shadow:inset 0 0 0 1px rgba(244,241,234,.6)}
.quick button[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--ink);background:rgba(244,241,234,.08)}
.quick button[aria-pressed=true]::before{content:'✓ '}
.compose{display:flex;gap:8px;align-items:center;padding:14px 18px 18px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:0;border-radius:12px;padding:13px 16px;font-size:16px;outline:none}
.compose input:focus{box-shadow:inset 0 0 0 1px rgba(244,241,234,.45)}
.compose input[name=code]{font-family:var(--mono);letter-spacing:.32em;font-size:20px}
.compose .go{min-height:46px;width:46px;padding:0;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(244,241,234,.3)}
.day{align-self:center;font-size:12px;color:var(--faint);padding:4px 0}
.entry .thread{justify-content:flex-end;padding-bottom:18px}
.door{margin:0;padding:clamp(28px,7vh,72px) 26px 0;font-family:var(--serif);font-weight:300;font-size:clamp(40px,4.4vw,64px);letter-spacing:-.045em;line-height:1.1}
.room .compose{padding-left:max(18px,calc((100% - 760px)/2));padding-right:max(18px,calc((100% - 760px)/2))}
.entry .chat-head{border-bottom:0}
.quick button{display:inline-flex;align-items:center;gap:6px}
.quick button::after{content:'→';opacity:.7}
.quick button[aria-pressed]::after{content:''}
.room .thread{-webkit-mask-image:linear-gradient(transparent 12px,#000 72px);mask-image:linear-gradient(transparent 12px,#000 72px)}
.chip.main{background:var(--ink);color:#0b0a09;box-shadow:none}

/* 방 */
.room{display:grid;grid-template-columns:1fr 360px;height:100dvh}
.room .chat{border-left:0;background:var(--bg)}
.room .thread{padding:28px max(28px,calc((100% - 760px)/2))}
.room .chat-head{padding:16px max(28px,calc((100% - 760px)/2))}
.proj{display:flex;flex-direction:column;line-height:1.3}
.proj b{font-size:15px;font-weight:650}
.proj span{font-size:12px;color:var(--faint)}
.side{display:flex;flex-direction:column;gap:20px;padding:26px 26px;background:var(--panel);border-left:1px solid var(--line);overflow:auto}
.turn{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--dim)}
.turn i{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.turn.is-busy i{background:var(--busy)}
.side h2{margin:0;font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.15;letter-spacing:-.045em}
.side .lede{margin:0;color:var(--dim);font-size:14px}
.bars{display:flex;gap:3px;align-items:center}
.bars i{flex:1;height:3px;background:rgba(244,241,234,.16)}
.bars i.done{background:rgba(244,241,234,.6)}
.bars i.now{background:var(--ink)}
.stagelab{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:20;width:min(400px,100vw);display:flex;flex-direction:column;background:#151413;border-left:1px solid var(--line);animation:pop .35s var(--ease)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.brief{margin:0;padding:20px;display:flex;flex-direction:column}
.brief div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.brief dt{color:var(--faint)}.brief dd{margin:0}
.stages{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.stages li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint)}
.stages li.done{color:var(--dim)}
.stages li.now{color:var(--ink);font-weight:600}
.stages .mono{font-size:12px}
.stages .icon{width:15px;height:15px}
.due{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.due .mono{color:var(--ink)}
.tools{display:flex;gap:6px;margin-top:auto}
.tool{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--dim)}
.tool:hover{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(244,241,234,.4)}

/* 대화 안의 결정 카드 */
.card{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:14px;border-radius:16px;background:var(--staff);max-width:100%;animation:pop .45s var(--ease) both}
.card .face{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:10px;background:#000}
.card .face img,.card .face video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.card .rec{font-size:12px;color:var(--faint)}
.card h3{margin:2px 0 6px;font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:-.04em;line-height:1.2}
.card p{margin:0;color:var(--dim);font-size:14px}
.card .body{display:flex;flex-direction:column;gap:12px;min-width:0}
.folds{display:flex;gap:6px;flex-wrap:wrap}
.fold{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:3px 12px 3px 3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;text-align:left}
.fold:hover,.fold[aria-expanded=true]{box-shadow:inset 0 0 0 1px rgba(244,241,234,.5)}
.fold .ico{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.fold .ico img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.fold .ico .icon{width:18px;height:18px}
.fold .t{display:flex;flex-direction:column;line-height:1.2}
.fold .t small{font-size:10.5px;color:var(--faint)}
.fold.is-rec .t small::after{content:' · 추천'}
.fold.is-set .t small::after{content:' · 고름';color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet{grid-column:1/-1;padding:14px;border-radius:12px;background:rgba(0,0,0,.35);animation:pop .4s var(--ease) both}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:14px}
.picks{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.picks button{position:relative;flex:none;width:58px;height:150px;overflow:hidden;border-radius:6px;filter:brightness(.6) saturate(.7);transition:width .6s var(--ease),filter .3s}
.picks button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.picks button:hover{filter:none}
.picks button[aria-pressed=true]{width:112px;filter:none}
.picks button span{position:absolute;left:6px;bottom:5px;font-size:12px;text-shadow:0 1px 4px #000}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:14px}
.opt img{aspect-ratio:3/4;object-fit:cover;object-position:50% 15%;border-radius:6px}
.opt small{color:var(--faint);font-size:12px}
.opt[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--ink)}
/* 장면 이미지 카드 */
.viewer{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:8px;background:var(--staff);animation:pop .45s var(--ease) both}
.viewer .big{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:4px;background:#000}
.viewer .big img{width:100%;height:100%;object-fit:cover}
.viewer .nav{position:absolute;top:0;bottom:0;display:grid;place-items:center;width:56px;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent);opacity:.75}
.viewer .nav.r{background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.viewer .nav:hover{opacity:1}
.viewer .nav.l{left:10px}.viewer .nav.r{right:10px}
.viewer .info{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.viewer .info .mono{font-size:12px;color:var(--dim)}
.viewer .info p{margin:2px 0 0;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px}
.chip:hover{box-shadow:inset 0 0 0 1px rgba(244,241,234,.5)}
.chip[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--ink);background:rgba(244,241,234,.08)}
.thumbs{display:flex;gap:5px}
.thumbs button{position:relative;flex:1;height:54px;overflow:hidden;border-radius:6px;filter:brightness(.5);transition:filter .2s}
.thumbs button img{width:100%;height:100%;object-fit:cover}
.thumbs button.on{filter:none;box-shadow:0 0 0 1.5px var(--ink)}
.thumbs .mark{position:absolute;right:3px;top:3px;display:grid;place-items:center;width:18px;height:18px;border-radius:999px;background:var(--ink);color:#000}
.thumbs .mark .icon{width:11px;height:11px}
.note{grid-column:1/-1;display:flex;gap:8px}
.note textarea{flex:1;min-height:44px;background:rgba(255,255,255,.05);border:0;border-radius:10px;padding:10px 12px;resize:vertical;outline:none}
.drop{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-align:left;border:1px dashed rgba(244,241,234,.3);align-self:flex-start}
.drop .th{display:flex;gap:5px}
.drop .th img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.mock-later{align-self:center;font-size:12px;color:var(--dim);border:1px dashed rgba(244,241,234,.3);padding:6px 12px;border-radius:999px}

@media (max-width:900px){
  body{overflow:auto}
  .entry{grid-template-columns:1fr;grid-template-rows:50dvh auto;height:auto;min-height:100dvh}
  .chat{min-height:50dvh}
  .room{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100dvh}
  .side{order:2;gap:8px;padding:12px 16px 14px;border-left:0;border-top:1px solid var(--line);position:sticky;bottom:0;z-index:4}
  .side .due,.side .bars,.side .stagelab{display:none}
  .side h2{font-size:24px}
  .side .stages,.side .tools,.side .lede{display:none}
  .room .thread{padding:18px 14px 90px}
  .room .chat-head{display:none}
  .side .turn{font-size:12px}
  .card{grid-template-columns:1fr}
  .card .face{aspect-ratio:4/3}
  .thread{padding:18px 16px}
}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { thumb, CHECKS, MODELS, PROJECT, STAGES, DIRECTIONS, OFFER, KEEP, LOOKS, HAIRS, CUTS, TALK, CHANNELS, FOLDED, PACKAGES, CODE_SENT, CHECK_COPY, briefHTML, modelById, icon, video, playNow, stopNow, reduced, sound, router, mockBar, bindFolds, $, $$, wait } from './공통.js';

const LOGO = '../../마케팅/온라인마케팅지도/engagement/company/public/pulse-app/assets/request/logo-paper.webp';
const app = $('#app');
const state = { pick: { model: 'F02', dir: 'poster', look: KEEP, hair: KEEP }, notes: {}, liked: {}, cut: 0, seen: new Set([0]) };
let cleanup = () => {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 대화 한 줄 넣기. 담당자 · PULSE의 말은 잠깐 입력 중 표시 뒤에 온다.
// gen: 이 대화가 다른 흐름으로 바뀌면(입장 → 새 의뢰) 늦게 도착한 옛 말은 버린다.
async function say(thread, { who = 'pulse', html, at = '', news = false, delay = 700, gen }) {
  const stale = () => gen && thread.dataset.gen !== gen;
  if (stale()) return null;
  if (who !== 'me' && delay && !reduced) { const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>'; thread.append(t); thread.scrollTop = thread.scrollHeight; await wait(delay); t.remove(); if (stale()) return null; }
  const name = who === 'me' ? '나' : who === 'staff' ? `${PROJECT.staff} 담당자` : 'SYNK PULSE';
  const m = document.createElement('div'); m.className = `msg ${who === 'me' ? 'me' : ''}${news ? ' news' : ''}`;
  m.innerHTML = `<span class="by">${name}${at ? ` · <span class="mono">${at}</span>` : ''}</span><div class="b">${html}</div>`;
  thread.append(m); thread.scrollTop = thread.scrollHeight; if (who !== 'me') sound.soft();
  return m;
}
const put = (thread, el) => { thread.append(el); thread.scrollTop = thread.scrollHeight; return el; };
const node = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

/* ── 입장: 한 사람이 화면을 채워 걷고, 로그인은 대화로 묻는다 ── */
function viewEntry() {
  cleanup();
  app.innerHTML = `
  <section class="entry">
    <div class="screen" aria-label="AI 모델이 걷는 영상"><span class="ai">AI로 만든 가상 인물이에요</span><div class="who"><b></b><span></span></div></div>
    <div class="chat">
      <div class="chat-head"><img class="logo" src="${LOGO}" alt="synk PULSE"><span class="small">가입 · 비밀번호 없이 열려요</span></div>
      <h1 class="door">내 광고 방</h1>
      <div class="thread" aria-live="polite"></div>
      <form class="compose" novalidate><input name="email" type="email" autocomplete="email" placeholder="의뢰서에 적은 메일" aria-label="메일"><button class="go" aria-label="보내기">${icon('arrow')}</button></form>
    </div>
  </section>`;
  // 왼쪽: 4초마다 다음 사람으로 겹쳐 넘긴다.
  const screen = $('.screen', app), who = $('.who', screen), order = ['F02', 'M02', 'F07', 'M01', 'F09', 'M04', 'F05', 'M07'];
  let k = 0, cur = null, timer;
  const next = () => {
    const m = modelById(order[k++ % order.length]);
    const v = video(m.video, m.tall, { auto: false }); if (cur) v.style.transform = 'translateX(100%)'; screen.insertBefore(v, screen.querySelector('.ai')); playNow(v);
    requestAnimationFrame(() => requestAnimationFrame(() => { v.style.transform = ''; if (cur) { const old = cur; old.style.transform = 'translateX(-100%)'; setTimeout(() => { stopNow(old); old.remove(); }, 950); } cur = v; }));
    who.querySelector('b').textContent = m.name; who.querySelector('span').textContent = `${m.line} · ${m.meta}`;
  };
  next(); if (!reduced) timer = setInterval(next, 4000);
  // 오른쪽: 대화로 로그인
  const thread = $('.thread', app), form = $('.compose', app);
  let step = 'email', mail = '';
  const g = thread.dataset.gen = 'entry' + Date.now();
  (async () => {
    await say(thread, { html: '안녕하세요. 광고 방을 열어 드릴게요.', delay: 500, gen: g });
    if (!await say(thread, { html: '의뢰서에 적은 메일을 알려 주세요.', delay: 600, gen: g })) return;
    put(thread, node(`<div class="quick"><button data-go="request">처음이에요, 광고 의뢰할래요</button><button data-q="link">담당자에게 링크를 받았어요</button></div>`));
    form.querySelector('input').focus();
  })();
  const asEmail = input => { input.name = 'email'; input.type = 'email'; input.inputMode = 'email'; input.placeholder = '의뢰서에 적은 메일'; input.removeAttribute('maxlength'); input.autocomplete = 'email'; input.setAttribute('aria-label', '메일'); };
  thread.addEventListener('click', async e => {
    if (!e.target.closest('[data-q=link]')) return;
    e.target.closest('.quick').remove(); step = 'link';
    await say(thread, { who: 'me', html: '링크를 받았어요' });
    const input = form.querySelector('input'); input.name = 'invite'; input.type = 'text'; input.inputMode = 'url'; input.placeholder = 'https://workspace.synk.im/pulse-app/#invite=…'; input.setAttribute('aria-label', '받은 링크');
    await say(thread, { html: '접수증이나 담당자에게 받은 링크를 그대로 붙여 넣어 주세요.' }); input.focus();
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const input = form.querySelector('input');
    if (step === 'link') {
      const v = input.value.trim(); if (!v) return;
      if (!/invite=|^https?:\/\//.test(v)) { await say(thread, { html: '받으신 링크를 그대로 붙여 넣어 주세요. 주소 전체가 필요해요.' }); input.focus(); return; }
      sound.shutter(); await say(thread, { who: 'me', html: '링크를 붙여 넣었어요' }); input.value = ''; input.disabled = true;
      await say(thread, { html: `열렸어요. ${PROJECT.brand}의 방이에요.` }); go('moment'); return;
    }
    if (step === 'email') {
      if (!/^\S+@\S+\.\S+$/.test(input.value.trim())) { if (input.value.trim()) await say(thread, { html: '메일 주소 꼴이 아니에요. 의뢰서에 적은 메일을 그대로 넣어 주세요.' }); input.focus(); return; }
      mail = input.value.trim(); $('.quick', thread)?.remove(); sound.tick();
      await say(thread, { who: 'me', html: esc(mail) });
      input.value = ''; input.name = 'code'; input.type = 'text'; input.inputMode = 'numeric'; input.maxLength = 6; input.autocomplete = 'one-time-code'; input.placeholder = '000000'; input.setAttribute('aria-label', '여섯 자리 코드');

    } else {
      const v = input.value.replace(/\D/g, '');
      if (v.length !== 6) { await say(thread, { html: '메일에 온 숫자 여섯 자리를 모두 넣어 주세요.' }); input.focus(); return; }
      sound.shutter(); $('.quick', thread)?.remove();

      input.value = ''; input.disabled = true;

      go('moment');
    }
  });

  cleanup = () => { clearInterval(timer); $$('video', app).forEach(stopNow); };
}

function pastTalk(thread, key) {
  let day = '';
  TALK[key].slice(0, -1).forEach(t => { const d = t.at.startsWith('오늘') ? '오늘' : t.at.split(' ').slice(0, 2).join(' '); if (d !== day) { day = d; thread.append(node(`<div class="day">${d}</div>`)); } thread.append(node(bubble(t))); });

  return TALK[key].at(-1);
}

        const rest = put(thread, node(`<div class="card" style="grid-template-columns:1fr"><div class="folds">${FOLDED.map(f => foldBtn(f.id, icon(f.icon), f.name, f.rec, 'is-rec')).join('')}</div>
          <div class="sheet" data-sheet="model" hidden><div class="sheet-head"><span>모델 · 누르면 그 사람으로 정해요</span><button class="link" data-sheet-close>닫기</button></div><div class="picks">${MODELS.map(x => `<button data-choose="${x.name}" aria-pressed="false"><img src="${x.tall}" alt=""><span>${x.name}</span></button>`).join('')}</div></div>
          <div class="sheet" data-sheet="length" hidden><div class="sheet-head"><span>길이</span><button class="link" data-sheet-close>닫기</button></div><div class="opts"><button class="opt" data-choose="저희가 제안해요" aria-pressed="true"><small>추천</small><b>제안해 주세요</b><span class="small">올릴 곳에 맞춰 저희가 골라요.</span></button>${PACKAGES.map(([a, b2]) => `<button class="opt" data-choose="${a}" aria-pressed="false"><b>${a}</b><small>${b2}</small></button>`).join('')}</div></div>
          ${['mood', 'text', 'avoid', 'files'].map(id => { const f = FOLDED.find(x => x.id === id); return `<div class="sheet" data-sheet="${id}" hidden><div class="sheet-head"><span>${f.name} · 비워 두면 「${f.rec}」</span><button class="link" data-sheet-close>닫기</button></div><div class="compose" style="padding:0;border:0"><input placeholder="${{ mood: '예) 홈쇼핑 같은 느낌은 피하고 차분하게', text: '예) 딸기 라떼 5,800원', avoid: '예) 경쟁사 이름', files: '로고, 상세페이지, 지난 광고' }[id]}"><button class="go ghost" data-choose="적었어요" aria-label="적기">${icon('check')}</button></div></div>`; }).join('')}
          <div class="acts"><button class="go" data-send>추천대로 보내기 ${icon('arrow')}</button></div></div>`));
        bindFolds(rest);
        $('[data-send]', rest).onclick = async () => {
          $('.acts', rest).remove(); step = 'mail';
          await say(thread, { who: 'me', html: '나머지는 추천대로 해 주세요.' });
          await say(thread, { html: '답을 받을 메일을 알려 주세요. 이 메일로 광고 방을 열어요.' });
          box.disabled = false; box.type = 'email'; box.inputMode = 'email'; box.placeholder = 'name@company.com'; box.setAttribute('aria-label', '답을 받을 메일'); box.focus();
        };
      });
    };
  });
  // 메일 → 동의 → 접수(저희 차례)
  fresh.addEventListener('submit', async e => {
    e.preventDefault(); if (step !== 'mail') return;
    const mail = box.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(mail)) { await say(thread, { html: '메일 주소 꼴이 아니에요. 다시 적어 주세요.' }); box.focus(); return; }
    step = 'agree'; box.value = ''; box.disabled = true; await say(thread, { who: 'me', html: esc(mail) });
    await say(thread, { html: '마지막으로, 연락과 제작에 필요한 정보 수집 · 이용에 동의해 주세요(필수).' });
    const q = put(thread, node(`<div class="quick"><button data-agree>동의하고 보내기</button></div>`));
    q.querySelector('button').onclick = async () => {
      q.remove(); sound.shutter(); await say(thread, { who: 'me', html: '동의하고 보낼게요.' });
      await say(thread, { html: `접수했어요. ${CHECK_COPY.text}`, delay: 900 });
      put(thread, node(`<button class="mock-later" data-go="moment">시안: 방향 두 안이 도착한 날로</button>`));
    };
  });
}

const go = router({ entry: viewEntry, moment: viewMoment, pick: viewPick, wait: viewPick, images: viewImages, request: viewRequest });
mockBar('D 먼저 말 거는 방');
</script>
</body>

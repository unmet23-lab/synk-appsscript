<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔리오 사업계획서 검토</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
/* 솔리오 사무실 기획부 「사업계획서」 검토 화면 새 시안(2026-11-26, 유호님 「조금 더 트렌디하고 세련되고 기능적으로 간편했으면 … 아직 조잡함이 꽤 남아있네」)
   한 문장: 파일을 놓으면 직원이 고칠 곳을 한 번에 하나씩 묻는다. 정한 것은 README.md */
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}
@font-face{font-family:'DM Mono';font-weight:400;font-display:swap;src:url(../../브랜드_폰트/DM_Mono/DMMono-Regular.ttf) format('truetype');}
:root{
  color-scheme:dark;
  --void:#000;--paper:#F3F1EC;--soft:rgba(243,241,236,.74);--dim:rgba(243,241,236,.5);--off:rgba(243,241,236,.26);
  --glass:rgba(30,30,29,.58);--edge:rgba(243,241,236,.11);--fill:rgba(243,241,236,.07);--fill2:rgba(243,241,236,.12);
  --lapis:#C5D6F5;--meadow:#7DB45A;--meadow-soft:#D3E8BE;
  --sans:'SUIT Variable',SUIT,Pretendard,'Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo',Batang,serif;--mono:'DM Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden}
button,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{appearance:none;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1.5px solid rgba(243,241,236,.6);outline-offset:3px}
::selection{background:rgba(243,241,236,.24)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:relative;min-height:100%;overflow-x:clip;display:flex;flex-direction:column;isolation:isolate}
.app::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse 62% 52% at 10% -6%,rgba(197,214,245,.13),rgba(197,214,245,0) 72%),
  radial-gradient(ellipse 55% 45% at 104% 108%,rgba(243,241,236,.055),rgba(243,241,236,0) 70%)}

/* 머리 막대: PC 앱 그대로 */
.head{display:flex;align-items:center;gap:30px;padding:26px clamp(20px,8.4vw,168px) 0;min-height:72px}
.brand{display:flex;align-items:center;gap:13px;font:400 14px/1 var(--sans);letter-spacing:.16em;color:var(--soft)}
.brand .sprite{width:34px}
.objs{display:flex;align-items:center;gap:26px;color:rgba(243,241,236,.55)}
.objs svg{width:20px;height:20px;display:block}
.objs .on{display:flex;align-items:center;gap:11px;color:var(--paper);font:500 15px/1 var(--sans)}
.todo{margin-left:auto;display:flex;align-items:center;gap:20px;font:400 14px/1 var(--sans);color:var(--dim)}
.todo span{height:40px;padding:0 22px;border-radius:999px;background:var(--paper);color:#000;font:500 14px/40px var(--sans)}

/* 짜임: 가운데 한 줄 */
.main{flex:1;display:flex;flex-direction:column;width:100%;padding:clamp(14px,2.6vh,28px) clamp(20px,8.4vw,168px) clamp(40px,7vh,72px)}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;height:36px;margin-left:-12px;padding:0 14px 0 10px;border-radius:999px;font:500 14px/1 var(--sans);color:var(--soft);transition:background-color .2s,color .2s}
.back:hover{background:var(--fill);color:var(--paper)}
.back svg{width:16px;height:16px}
h1{position:relative;z-index:1;margin:0;font:300 clamp(27px,3.5vw,46px)/1.25 var(--sans);letter-spacing:-.022em;text-align:center;text-wrap:balance}
.sub{position:relative;z-index:1;margin:12px auto 0;max-width:34em;text-align:center;font:400 clamp(15px,1.25vw,17px)/1.5 var(--sans);color:var(--soft);text-wrap:balance}
.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 무대: 구운 장면 한 장(팀 고르기 4판 결) 위에 눈만 얹는다 */
.hero{position:relative;width:min(720px,100%,76vh);aspect-ratio:3/2;margin:-22px auto -66px;transition:opacity .5s ease,filter .5s ease;pointer-events:none}
.hero > div{position:absolute;inset:0;transform:translateX(10.4%)}
.app[data-stage=done] .hero{width:min(430px,86%,44vh);margin:-8px auto -36px}
.hero img{width:100%;height:100%;display:block;object-fit:cover;
  -webkit-mask-image:radial-gradient(ellipse 41% 60% at 40% 50%,#000 52%,transparent 100%),linear-gradient(#000 66%,transparent 92%);-webkit-mask-composite:source-in;
  mask-image:radial-gradient(ellipse 41% 60% at 40% 50%,#000 52%,transparent 100%),linear-gradient(#000 66%,transparent 92%);mask-composite:intersect}
.hero .eyes{position:absolute;left:19.7%;top:22.175%;width:24.9%;aspect-ratio:1}
.eyes .orb,.sprite .orb{width:100%;height:100%}
.app[data-stage=limit] .hero{filter:brightness(.62) saturate(.7)}
.sprite{position:relative;display:block;aspect-ratio:1;flex:none}
.sprite > img{position:absolute;inset:0;width:100%;height:100%}
.sprite > .orb{position:absolute;inset:0}
.orb{display:block;overflow:visible}
.orb .o-eyes{fill:#FFFAF3;stroke:#FFFAF3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1.4px rgba(243,241,236,.55))}
.orb .o-blink{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s ease}
.orb.blink .o-blink{transform:scaleY(.12)}
.orb .o-look{transition:transform .6s var(--ease)}

/* 놓는 자리 하나 */
.comp{position:relative;width:min(720px,100%);margin:0 auto;padding:14px;border-radius:26px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,.07),0 40px 90px -40px #000;-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);transition:box-shadow .3s,background-color .3s}
.comp.over{background:rgba(48,48,46,.72);box-shadow:inset 0 0 0 1.5px rgba(243,241,236,.5),0 40px 90px -40px #000}
.place{display:block;width:100%;padding:13px 12px 19px;text-align:left;font:400 17px/1.45 var(--sans);color:var(--dim);border-radius:14px}
.place b{font-weight:500;color:var(--paper)}
.files{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 16px}
.file{display:flex;align-items:center;gap:11px;max-width:100%;height:52px;padding:0 8px 0 12px;border-radius:16px;background:var(--fill);animation:swap .45s var(--ease)}
.file svg{width:20px;height:20px;flex:none;color:var(--soft)}
.file span{min-width:0;font:500 14px/1.25 var(--sans)}
.file span b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{display:block;font:400 12.5px/1.3 var(--sans);color:var(--dim)}
.x{width:28px;height:28px;border-radius:50%;color:var(--dim);display:grid;place-items:center;flex:none;transition:background-color .2s,color .2s}
.x:hover{background:var(--fill2);color:var(--paper)}.x svg{width:13px;height:13px;color:inherit}
.bar{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.chip{position:relative;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:999px;background:var(--fill);font:500 14px/1 var(--sans);color:var(--soft);white-space:nowrap;transition:background-color .2s,color .2s}
.chip:hover,.chip[aria-expanded=true]{background:var(--fill2);color:var(--paper)}
.chip svg{width:14px;height:14px;flex:none}
.chip.round{width:40px;padding:0;justify-content:center}
.chip.round svg{width:17px;height:17px}
.go{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 22px;border-radius:999px;background:var(--paper);color:#000;font:600 15px/1 var(--sans);white-space:nowrap;transition:background-color .2s,opacity .2s,transform .2s var(--ease)}
.go:hover{background:#fff}.go:active{transform:scale(.98)}
.go:disabled{opacity:.18;cursor:default;background:var(--paper)}
.menu{position:absolute;left:0;bottom:calc(100% + 10px);z-index:5;min-width:270px;padding:7px;border-radius:18px;background:rgba(38,38,36,.96);box-shadow:inset 0 0 0 1px var(--edge),0 24px 60px -20px #000;animation:swap .25s var(--ease)}
.menu button{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;width:100%;padding:10px 13px;border-radius:12px;text-align:left;font:500 14.5px/1.35 var(--sans)}
.menu button:hover{background:var(--fill)}
.menu small{grid-column:1;font:400 12.5px/1.4 var(--sans);color:var(--dim)}
.menu i{grid-row:1/span 2;grid-column:2;width:7px;height:7px;border-radius:50%;background:var(--meadow);opacity:0}
.menu button[aria-checked=true] i{opacity:1}
.foot{margin:14px auto 0;text-align:center;font:400 13px/1.5 var(--sans);color:var(--dim)}

/* 읽는 중: 같은 자리가 상태 하나로 바뀐다 */
.read{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:10px 8px 8px 12px}
.shine{font:500 17px/1.4 var(--sans);color:transparent;background:linear-gradient(100deg,rgba(243,241,236,.66) 35%,#fff 50%,rgba(243,241,236,.66) 65%) 0 0/260% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.read .mono{margin-left:10px;font:400 13px/1 var(--mono);color:var(--dim)}
.segs{display:flex;gap:5px}
.read .segs{grid-column:1/-1}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(243,241,236,.13);overflow:hidden;transition:background-color .4s}
.seg i{display:block;height:100%;width:0;border-radius:2px;background:var(--paper);transition:width 1s linear}
.seg.on{background:rgba(243,241,236,.55)}.seg.ok{background:var(--meadow)}.seg.kept{background:rgba(243,241,236,.34)}
.seg.full i{width:100%}

/* 고칠 곳: 한 번에 하나. 놓던 자리가 묻는 자리가 된다 */
.note{flex:1;display:flex;flex-direction:column;width:min(720px,100%);margin:-40px auto 0}
.steps{display:flex;align-items:center;gap:16px}
.steps .segs{flex:1}
.steps button.seg{height:24px;background:none;position:relative;overflow:visible}
.steps button.seg::after{content:"";position:absolute;inset:10.5px 0;border-radius:2px;background:rgba(243,241,236,.13);transition:background-color .4s}
.steps button.seg:hover::after{background:rgba(243,241,236,.4)}
.steps button.seg.on::after{background:var(--paper)}.steps button.seg.ok::after{background:var(--meadow)}.steps button.seg.kept::after{background:rgba(243,241,236,.4)}
.count{font:400 13px/1 var(--mono);color:var(--dim);white-space:nowrap}
.body{flex:1;display:flex;flex-direction:column;animation:swap .45s var(--ease)}
.body.out{opacity:0;transform:translateY(-8px);transition:opacity .22s,transform .22s}
.stagearea{flex:1;display:grid;align-content:center;min-height:200px;padding:30px 6px}
.para{margin:0;font:400 clamp(22px,2.4vw,34px)/1.66 var(--serif);letter-spacing:-.014em;color:var(--off);text-wrap:pretty}
.para .t{color:var(--paper);transition:color .4s,filter .24s,opacity .24s}
.para .t.gone{opacity:0;filter:blur(7px)}
.para .t .bad{color:var(--lapis)}
.bad,.new.nw{white-space:nowrap}
.para .new,.fix .new{color:var(--meadow-soft)}
.para .add{animation:swap .5s var(--ease)}
.para [contenteditable]{outline:0;color:var(--paper);caret-color:var(--meadow);background:var(--fill);border-radius:10px;padding:.1em .3em;margin:0 -.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ask{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:8px 10px 14px}
.ask .sprite{width:44px}
.ask p{margin:0;font:500 16.5px/1.45 var(--sans)}
.ev{display:inline-flex;align-items:center;gap:7px;margin-top:4px;font:400 13px/1.4 var(--sans);color:var(--dim)}
.ev svg{width:14px;height:14px;flex:none}
.ev b{font-weight:500;color:var(--soft)}
.fix{margin:0 0 12px;padding:15px 18px 16px;border-radius:17px;background:var(--fill);font:400 19px/1.55 var(--serif);transition:opacity .3s}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.acts .chip{height:44px;padding:0 17px}
kbd{min-width:20px;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.09);font:500 11.5px/1 var(--sans);color:rgba(0,0,0,.6)}
.chip kbd{background:var(--fill2);color:var(--dim)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;transition:opacity .3s}
.opt{display:flex;flex-direction:column;justify-content:flex-start;padding:15px 18px 16px;border-radius:17px;background:var(--fill);text-align:left;transition:background-color .2s,transform .2s var(--ease)}
.opt:hover{background:var(--fill2)}.opt:active{transform:scale(.99)}
.opt b{display:block;font:600 16px/1.4 var(--sans)}
.opt span{display:block;margin-top:5px;font:400 15px/1.55 var(--serif);color:var(--soft)}

/* 끝 */
.diffs{width:min(720px,100%);margin:20px auto 0;padding:0;list-style:none}
.diffs li{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:4px 14px;padding:8px 26px;font:400 16px/1.55 var(--serif);color:var(--soft)}
.diffs li::before{content:"";width:7px;height:7px;margin-top:.55em;border-radius:50%;background:var(--meadow)}
.diffs li.hand::before{background:var(--lapis)}
.diffs small{font:400 13px/1 var(--sans);color:var(--dim)}
.done .file{flex:1;min-width:0}
.toast{position:fixed;left:50%;top:152px;z-index:20;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 20px;border-radius:999px;background:rgba(46,46,44,.94);box-shadow:inset 0 0 0 1px var(--edge),0 20px 50px -16px #000;font:500 14px/1 var(--sans);transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:34px;padding:0 14px;border-radius:999px;font:500 14px/1 var(--sans);color:var(--soft)}
.toast button:hover{background:var(--fill2);color:var(--paper)}
/* 전체 보기 */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.62);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet > div{width:min(720px,100%);max-height:min(720px,88vh);overflow:auto;padding:26px 14px 14px;border-radius:28px;background:#1B1B1A;box-shadow:inset 0 0 0 1px var(--edge),0 50px 120px -30px #000}
.sheet h2{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px 14px;font:600 19px/1.3 var(--sans)}
.row{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:baseline;width:100%;padding:13px 14px;border-radius:16px;text-align:left}
.row:hover{background:var(--fill)}
.row i{width:8px;height:8px;border-radius:50%;background:rgba(243,241,236,.22)}
.row.ok i{background:var(--meadow)}.row.kept i{background:rgba(243,241,236,.5)}
.row span{font:400 15.5px/1.55 var(--serif)}
.row small{font:400 13px/1 var(--sans);color:var(--dim);white-space:nowrap}
.demo{position:fixed;right:18px;bottom:16px;z-index:10;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(20,20,19,.8);box-shadow:inset 0 0 0 1px var(--edge);font:400 12px/1 var(--sans);color:var(--dim)}
.demo button{white-space:nowrap;height:30px;padding:0 12px;border-radius:999px;font:400 12px/1 var(--sans);color:var(--dim)}
.demo button:hover{background:var(--fill);color:var(--paper)}
@media (max-width:760px){
  .head{gap:16px;padding:16px 16px 0;min-height:56px}.objs > svg,.todo > em{display:none}.objs{margin-left:-6px}.todo span{height:36px;padding:0 15px;font:500 13px/36px var(--sans)}
  .brand .b{display:none}
  .main{padding:8px 16px 84px}
  .hero{width:100%;margin:-6px auto -38px}
  .bar{flex-wrap:wrap}.bar .go{flex:1 0 100%;margin-top:4px;height:48px}.sp{display:none}
  .place{font-size:16px;padding:10px 8px 16px}
  .chip{padding:0 13px}.menu{min-width:240px}
  .note{margin-top:0}.ask p{font-size:15.5px}.stagearea{padding:20px 2px;min-height:170px}
  .opts{grid-template-columns:1fr}
  .acts .go{flex:1 0 100%;height:50px}.acts .chip{flex:1;justify-content:center;padding:0 10px}kbd{display:none}
  .done .bar .file{flex:1 0 100%}
  .steps{gap:10px;margin-top:4px}
  .demo{right:50%;transform:translateX(50%)}.toast{top:156px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}.shine{color:var(--paper);background:none}}
</style>
</head>
<body>
<div class="app" id="app" data-stage="drop">
  <header class="head">
    <div class="brand"><span class="sprite" id="borb"></span><span class="b">SOLIO</span></div>
    <div class="objs" aria-hidden="true">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M10 10V3.4A6.6 6.6 0 0 1 16.6 10Z" fill="currentColor"/></svg>
      <svg viewBox="0 0 20 20"><path d="M6.2 3.6v11l3-2.8 2 4.4 2-.9-2-4.3h4.1Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="14.7" cy="5.3" r="1.9" fill="currentColor"/></svg>
      <svg viewBox="0 0 20 20"><path d="M2.5 10.5h3.2l1.8-4.5 3 8 2-5.5 1.2 2h3.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="on"><svg viewBox="0 0 20 20"><rect x="3.4" y="5" width="13.2" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="7.6" cy="10" r="1.2" fill="currentColor"/><circle cx="12.4" cy="10" r="1.2" fill="currentColor"/></svg>사무실</span>
    </div>
    <div class="todo" aria-hidden="true"><em style="font-style:normal">할 일 1</em><span>1순위부터 처리</span></div>
  </header>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"><span id="toastT"></span><button type="button" id="undo">되돌리기</button></div>
<div class="demo" aria-label="시안 조작"><button type="button" data-demo="reset">처음부터</button><button type="button" data-demo="note">고칠 곳</button><button type="button" data-demo="limit">한도 찬 때</button></div>
<div class="sr" id="live" aria-live="polite"></div>
<script>
{
/* ── 예시: 시험 계획서와 11-23에 GPT 직원이 실제로 낸 메모 ── */
const IMG = {write:'../솔리오_사업계획서_첫화면_20261123/그림/write.jpg', orb:'그림/orb.webp'};
const PLAN = {
  1:['왜 이 일을 하나', ['바쁜 직장인은 아침을 거르기 쉽습니다.', '시중 그래놀라는 설탕이 많아 매일 먹기 어렵습니다.']],
  2:['지금까지 한 일', ['2025년 9월부터 온라인으로 팔아 왔습니다.', '2025년 매출 10억 원을 달성했습니다.', '단골 손님 300명이 매달 다시 삽니다.']],

  crit(k) { S.crit = +k; S.menu = null; render(); }, staff(k) { S.staff = +k; S.menu = null; render(); },
  start() { if (S.files.some(f => kindOf(f) === 'plan')) { S.menu = null; set('read'); } },
  gpt() { S.staff = 1; set('read'); }, stop() { set('drop'); }, home() { S = fresh(); set('drop'); },
  back() { if (S.stage === 'note' || S.stage === 'done') { set('drop'); } else { S = fresh(); set('drop'); } },
  fix() { const n = NOTES[S.at]; apply(n.fix, esc(n.fix).replace(esc(n.hi), `<span class="new nw">${esc(n.hi)}</span>`)); },
  hand() { if (busy) return; busy = true; remember('개발부에 맡겼습니다'); S.hand = true; gorb.mood('happy'); mark('ok'); leave(() => { busy = false; next(); }, 700); },
  keep, edit, editok:editOk, editno() { render(); }, all:sheet, close:closeSheet,
  jump(k) { if (busy) return; closeSheet(); S.at = +k; if (S.stage !== 'note') S.stage = app.dataset.stage = 'note'; stop(); render(); },
  opt(k) { if (busy) return; busy = true; const n = NOTES[S.at], t = n.opts[k][1]; remember('넣었습니다'); S.added[n.s + ':' + S.at] = t; S.text[n.s][1].push(t); $('#addto').innerHTML = ` <span class="add new">${esc(t)}</span>`; gorb.mood('happy'); document.querySelector('.opts').style.opacity = .25; mark('ok'); leave(() => { busy = false; next(); }, 1350); },
  save() { S.saved = true; render(); say('저장했습니다'); }, folder() { toast('시안에서는 폴더를 열지 않습니다'); },
  again() { S.at = 0; set('note'); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } if (e.target.id === 'sheet') closeSheet(); return; }
  const f = ACT[b.dataset.a]; if (f) f(b.dataset.k);
});
$('#undo').onclick = () => { if (!last) return; stop(); busy = false; S.state = last.state; S.text = JSON.parse(last.text); S.added = last.added; S.hand = last.hand; S.at = last.at; last = null; $('#toast').classList.remove('on'); set('note'); };
document.querySelector('.demo').onclick = e => { const d = e.target.dataset.demo; if (!d) return; stop(); busy = false; closeSheet(); $('#toast').classList.remove('on'); S = fresh(); if (d !== 'reset') S.files = ['사업계획서_시험.docx', '회사자료.csv']; set(d === 'limit' ? 'limit' : d === 'note' ? 'note' : 'drop'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#sheet')) return closeSheet(); if (S.menu) { S.menu = null; render(); } return; }
  if ($('#sheet') || S.stage !== 'note' || e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = NOTES[S.at];
  if (e.key === 'Enter' && !e.target.closest('button')) { e.preventDefault(); if (n.fix) ACT.fix(); else if (n.hand) ACT.hand(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); keep(); }
  if (e.key === 'ArrowLeft' && S.at) ACT.jump(S.at - 1);
});
/* 창 어디에 놓아도 받는다. 구는 놓는 쪽을 본다 */
let depth = 0;
addEventListener('dragenter', e => { e.preventDefault(); depth++; if (S.stage === 'drop') { const c = $('#comp'); c && c.classList.add('over'); hero && hero.mood('drop'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; const c = $('#comp'); c && c.classList.remove('over'); } });
addEventListener('drop', e => { e.preventDefault(); depth = 0; if (S.stage !== 'drop') return; for (const f of e.dataTransfer.files) if (!S.files.includes(f.name)) S.files.push(f.name); render(); });
addEventListener('pointermove', e => { if (S.stage !== 'drop' || S.files.length || !hero) return; const s = $('#heyes').getBoundingClientRect(), dx = (e.clientX - s.left - s.width / 2) / innerWidth, dy = (e.clientY - s.top - s.height / 2) / innerHeight; $('#heyes .o-look').setAttribute('style', `transform:translate(${(dx * 12).toFixed(1)}px,${(dy * 12).toFixed(1)}px)`); });
$('#borb').innerHTML = spriteHTML(); makeOrb($('#borb')).mood('open');
S = fresh(); set('drop');
}
</script>

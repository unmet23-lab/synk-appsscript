<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔리오 · 처음 시작 · AI 팀 고르기</title>
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}

/* 짜임: 솔리오를 처음 켠 순간. 사무실 시안과 같은 검정 방에서 첫 직원(AI 팀)을 카드로 고른다.
   색은 하나이고, 고른 것만 밝다. 움직임은 카드가 조금 뜨는 것과 줄이 차례로 떨어지는 것뿐이다. */
:root{
  color-scheme:dark;
  --void:#000;
  --paper:#F3F1EC;
  --dim:rgba(243,241,236,.46);
  --soft:rgba(243,241,236,.72);
  --hair:rgba(243,241,236,.10);
  --hair-strong:rgba(243,241,236,.22);
  --ring:rgba(243,241,236,.55);
  --pit:#0C0C0B;
  --sans:'SUIT Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1px solid var(--ring);outline-offset:3px}

#stage{position:relative;min-height:100vh;width:var(--sw,100%);margin:0 auto;container-type:inline-size;container-name:stage;padding:0 clamp(20px,8cqw,150px) 96px}
body.narrow #stage{--sw:420px;outline:1px solid var(--hair)}

.here{display:flex;align-items:center;gap:10px;padding-top:clamp(14px,3vh,34px)}
.here svg{width:40px;height:40px}
.here-name{font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7)}
.here-step{margin-left:auto;font:400 12px/1 var(--sans);color:var(--dim);font-variant-numeric:tabular-nums}

.say{margin:clamp(34px,8vh,90px) 0 0;font:300 clamp(26px,3.6cqw,50px)/1.28 var(--sans);letter-spacing:-.018em;max-width:20em;text-wrap:balance}
.say .then{display:block;color:var(--dim)}
.say.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.acts{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;margin-top:clamp(20px,3.4vh,34px)}
.go{appearance:none;height:40px;margin:0;padding:0 20px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);font:500 14px/1 var(--sans);color:var(--paper);cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.go:hover{border-color:var(--paper)}
.go.main{background:var(--paper);border-color:var(--paper);color:var(--void)}
.go.main:hover{background:#fff}
.go:disabled{opacity:.35;cursor:default}
.quiet{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;margin:0;padding:0 0 4px;font:400 13px/1.3 var(--sans);color:rgba(243,241,236,.8);cursor:pointer;transition:color .25s ease,border-color .25s ease}
.quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
.lab{font:400 13px/1.3 var(--sans);color:var(--dim)}

/* 카드 세 장. 직업을 고르는 화면처럼 나란히 서고, 고른 장만 떠오른다 */
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.8cqw,26px);margin-top:clamp(26px,5vh,54px)}
.card{appearance:none;position:relative;margin:0;padding:0;text-align:left;cursor:pointer;background:var(--pit);border:1px solid var(--hair-strong);border-radius:16px;color:var(--paper);display:flex;flex-direction:column;overflow:hidden;
  transition:transform .46s var(--ease),border-color .3s ease,opacity .3s ease,box-shadow .46s var(--ease)}
.card:hover{transform:translateY(-4px);border-color:rgba(243,241,236,.4)}
.card[aria-expanded="true"]{transform:translateY(-8px);border-color:var(--paper);box-shadow:0 26px 60px -28px rgba(243,241,236,.22)}
.deck.has-sel .card:not([aria-expanded="true"]){opacity:.42}
.deck.has-sel .card:not([aria-expanded="true"]):hover{opacity:.8}
.art{display:block;height:clamp(130px,15cqw,178px);border-bottom:1px solid var(--hair)}
.art svg{display:block;width:100%;height:100%}
.c-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.c-no{font:500 12px/1 var(--sans);letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums}
.c-name{font:700 clamp(20px,2cqw,26px)/1.2 var(--sans);letter-spacing:-.01em;margin-top:6px}
.c-tag{font:400 14px/1.4 var(--sans);color:var(--soft)}
.stats{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center}
.stats dt{font:400 12px/1.2 var(--sans);color:var(--dim);white-space:nowrap}
.stats dd{margin:0;display:flex;align-items:center;gap:3px;font:500 12px/1.2 var(--sans);color:var(--soft)}
.seg{width:16px;height:4px;border-radius:1px;background:var(--hair-strong)}
.seg.on{background:var(--paper)}
.card[aria-expanded="true"] .seg.on{animation:fill .5s var(--ease) both;animation-delay:calc(var(--s) * 60ms)}
@keyframes fill{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.deck.has-sel .art{height:clamp(96px,9cqw,120px)}
.deck.has-sel .stats,.deck.has-sel .c-cost{display:none}
.art{transition:height .46s var(--ease)}
.c-more{display:flex;align-items:center;gap:6px;margin-top:12px;font:500 12px/1 var(--sans);color:var(--soft)}
.c-more svg{width:10px;height:10px;transition:transform .3s ease}
.card[aria-expanded="true"] .c-more svg{transform:rotate(180deg)}
.card:hover .c-more{color:var(--paper)}
.c-maker{font:400 12px/1.4 var(--sans);color:var(--dim)}
.chips{margin:14px 0 0;font:400 13px/1.5 var(--sans);color:var(--dim)}
.chips b{font-weight:500;color:var(--soft)}
.c-cost{margin-top:auto;padding-top:14px;font:400 12px/1.3 var(--sans);color:var(--dim)}
.badge{position:absolute;top:12px;right:12px;padding:6px 10px;border-radius:999px;background:var(--paper);color:var(--void);font:700 12px/1 var(--sans);letter-spacing:.02em;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* 구 직원: 눈을 가끔 감았다 뜬다. 그록은 떠 있고, 둘은 서로 본다 */
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 6.4s infinite;animation-delay:var(--d,0s)}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.bob{animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.look{animation:look 7s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes look{0%,40%,100%{transform:translateX(0)}50%,85%{transform:translateX(var(--lx,2px))}}

/* 펼침: 고른 카드의 좋은 점과 아쉬운 점이 한 줄씩 차례로 떨어진다 */
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease);margin-top:0}
.detail.open{grid-template-rows:1fr;margin-top:clamp(26px,4vh,40px)}
.d-in{min-height:0;overflow:hidden}
.d-in > *,.d-col li{opacity:0;transform:translateY(-10px)}
.detail.open .d-in > *,.detail.open .d-col li{opacity:1;transform:none;transition:opacity .36s ease calc(90ms + var(--j,0) * 80ms),transform .52s var(--ease) calc(90ms + var(--j,0) * 80ms)}
.d-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 0 18px;border-bottom:1px solid var(--hair)}
.d-head b{font:700 20px/1.2 var(--sans)}
.d-head span{font:400 13px/1.4 var(--sans);color:var(--dim)}
.d-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(24px,4cqw,64px);padding-top:8px}
.d-col h3{margin:14px 0 4px;font:500 12px/1 var(--sans);letter-spacing:.12em;color:var(--dim)}
.d-col ul{list-style:none;margin:0;padding:0}
.d-col li{display:grid;grid-template-columns:22px 1fr;gap:4px;padding:13px 0;border-top:1px solid var(--hair);font:400 15px/1.5 var(--sans);color:rgba(243,241,236,.9)}
.d-col li:first-child{border-top:0}
.d-col li i{font-style:normal;font-weight:700;color:var(--paper)}
.d-col.bad li{color:var(--soft)}
.d-col.bad li i{color:var(--dim)}
.d-col li small{display:block;margin-top:3px;font:400 13px/1.4 var(--sans);color:var(--dim)}
.d-rows{margin-top:18px;border-top:1px solid var(--hair)}
.d-row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair);font:400 14px/1.5 var(--sans);color:rgba(243,241,236,.88)}
.d-row > span:first-child{color:var(--dim);font-size:13px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.flow b{font-weight:500}
.flow em{font-style:normal;margin-left:6px;padding:3px 7px;border:1px solid var(--hair-strong);border-radius:999px;font:500 11px/1 var(--sans);letter-spacing:.04em;color:var(--soft)}
.flow .arr{color:var(--dim)}
.d-go{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:22px}

/* 추천받기: 카드 세 장을 한 장씩 골라 손에 쥔다 */
.quiz{margin-top:clamp(26px,5vh,54px)}
.hand{display:flex;gap:10px;align-items:center}
.slot{width:clamp(96px,12cqw,150px);height:52px;border:1px dashed var(--hair-strong);border-radius:10px;display:flex;align-items:center;padding:0 12px;font:500 12px/1.3 var(--sans);color:var(--dim)}
.slot.full{border:1px solid rgba(243,241,236,.5);background:var(--pit);color:var(--paper);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.q-no{margin:30px 0 0;font:500 12px/1 var(--sans);letter-spacing:.14em;color:var(--dim)}
.q{margin:12px 0 0;font:500 clamp(20px,2.2cqw,28px)/1.3 var(--sans)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6cqw,22px);margin-top:22px}
.opt{appearance:none;margin:0;text-align:left;cursor:pointer;background:var(--pit);border:1px solid var(--hair-strong);border-radius:14px;padding:22px 20px 24px;min-height:210px;display:flex;flex-direction:column;gap:10px;
  opacity:0;transform:translateY(-10px);transition:transform .46s var(--ease),border-color .3s ease,opacity .3s ease}
.opts.in .opt{opacity:1;transform:none;transition:opacity .34s ease calc(var(--j) * 90ms),transform .5s var(--ease) calc(var(--j) * 90ms),border-color .3s ease}
.opts.in .opt:hover{transform:translateY(-4px);border-color:rgba(243,241,236,.45);transition-delay:0s}
.opt .ic{width:34px;height:34px;color:var(--soft);margin-bottom:auto;transition:color .3s ease}
.opt:hover .ic,.opt.taken .ic{color:var(--paper)}
.opt b{font:700 18px/1.3 var(--sans);margin-top:28px}
.opt span{font:400 14px/1.45 var(--sans);color:var(--soft)}
.opt.taken{transform:translateY(-14px) !important;border-color:var(--paper);transition-delay:0s}
.opts.in.picked .opt:not(.taken){opacity:.2}
.q-acts{display:flex;gap:22px;margin-top:22px}

/* 시작: 고른 팀을 잇는 차례. 줄마다 단추 하나 */
.start{margin-top:clamp(26px,5vh,48px);display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:clamp(22px,4cqw,64px);align-items:start}
.start .card{cursor:default;transform:none;border-color:var(--paper);opacity:1 !important}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--hair);opacity:0;transform:translateY(-10px)}
.steps.in li{opacity:1;transform:none;transition:opacity .34s ease calc(80ms + var(--j) * 80ms),transform .5s var(--ease) calc(80ms + var(--j) * 80ms)}
.n{width:24px;height:24px;border-radius:50%;border:1px solid var(--hair-strong);display:grid;place-items:center;font:500 12px/1 var(--sans);color:var(--dim)}
.steps li.ok .n{background:var(--paper);border-color:var(--paper);color:var(--void)}
.s-t b{display:block;font:500 15px/1.4 var(--sans)}
.s-t small{display:block;margin-top:3px;font:400 13px/1.4 var(--sans);color:var(--dim)}
.s-t em{font-style:normal;margin-left:8px;padding:2px 7px;border:1px solid var(--hair-strong);border-radius:999px;font:500 11px/1 var(--sans);color:var(--soft);vertical-align:2px}
.steps li.ok .s-t small{color:var(--soft)}
.steps li:not(.ok) .go.sm:not(.main){opacity:.5}
.s-b{white-space:nowrap}
.s-b .lab{color:var(--paper)}
.go.sm{height:32px;padding:0 15px;font-size:13px}
.start-go{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding-top:22px}

/* 시안 조작 막대. 디자인의 일부가 아니다 */
#meta{position:fixed;right:14px;bottom:14px;opacity:.55;z-index:9;display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(10,10,10,.86);border:1px solid var(--hair)}
#meta button{appearance:none;border:0;background:none;color:rgba(243,241,236,.7);font:400 12px/1 var(--sans);padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
#meta:hover{opacity:1}
#meta button:hover{color:var(--paper);background:rgba(243,241,236,.08)}

/* 좁은 창: 카드는 그림 왼쪽, 글 오른쪽으로 눕는다 */
@container stage (max-width:820px){
  .deck,.opts{grid-template-columns:minmax(0,1fr)}
  .card{flex-direction:row}
  .art{width:38%;height:auto;min-height:150px;border-bottom:0;border-right:1px solid var(--hair);overflow:hidden}
  .art svg{transform:scale(1.7)}
  .deck .detail.open{margin-top:6px;margin-bottom:10px}
  .c-body{padding:16px}
  .stats{margin-top:8px;padding-top:10px}
  .d-cols{grid-template-columns:minmax(0,1fr)}
  .d-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .start{grid-template-columns:minmax(0,1fr)}
  .opt{min-height:0}
  .slot{width:auto;flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .d-in > *,.d-col li,.opt,.steps li{opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>
<div id="stage">
  <header class="here">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><radialGradient id="hg" cx="34%" cy="30%" r="76%"><stop offset="0" stop-color="#F3F1EC" stop-opacity=".22"/><stop offset="1" stop-color="#F3F1EC" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="17" fill="#000"/><circle cx="20" cy="20" r="17" fill="url(#hg)" stroke="rgba(243,241,236,.6)" stroke-width="1"/><g class="eyes" style="--d:1.2s"><ellipse cx="16.4" cy="19" rx="1.5" ry="1.5" fill="#F3F1EC"/><ellipse cx="23.6" cy="19" rx="1.5" ry="1.5" fill="#F3F1EC"/></g></svg>
    <span class="here-name">SOLIO</span>
    <span class="here-step" id="step">처음 시작 · 1 / 2</span>
  </header>
  <main id="room" aria-live="polite"></main>
</div>
<nav id="meta" aria-label="시안 조작"><button type="button" id="m-reset">처음부터</button><button type="button" id="m-narrow">좁은 창</button></nav>

<script>

  duo: {

    stats:[['시작하기 쉬움',3],['맡길 수 있는 일',5]], off:'PC가 켜져 있을 때 일함', cost:'구독 두 개(Claude, ChatGPT)',

      ['프로그램 둘을 설치하고 각각 로그인합니다.','솔리오가 한 단계씩 안내합니다.'],

/* 좁은 창에서는 펼침을 누른 카드 바로 아래에 둔다 */
function placeDetail() {

function renderQuiz() {
  stepEl.textContent = `추천받기 · ${qi + 1} / 3`;

  const slots = [0,1,2].map(i => picks[i] != null ? `<span class="slot full">${esc(QUIZ[i].opts[picks[i]].b)}</span>` : `<span class="slot">${i + 1}번째 카드</span>`).join('');
  room.innerHTML = (qi === 0 && !picks.length ? say('카드 세 장을 고르면 맞는 팀을 추천합니다.', '물음마다 마음에 가까운 카드를 한 장 고르세요.') : say('카드 세 장을 고르면 맞는 팀을 추천합니다.', '물음마다 마음에 가까운 카드를 한 장 고르세요.').replace(' swap', ''))
    + `<section class="quiz"><div class="hand" aria-label="고른 카드">${slots}</div>`
    + `<p class="q-no">${qi + 1} / 3</p><h2 class="q">${esc(Q.q)}</h2>`
    + `<div class="opts">${Q.opts.map((o, i) => `<button class="opt" type="button" data-opt="${i}" style="--j:${i}">${icon(o.ic)}<b>${esc(o.b)}</b>${o.s ? `<span>${esc(o.s)}</span>` : ''}</button>`).join('')}</div>`
    + `<div class="q-acts">${qi ? '<button class="quiet" type="button" data-back>앞 물음으로</button>' : ''}<button class="quiet" type="button" data-stop>그만두고 직접 고르기</button></div></section>`;
  const opts = room.querySelector('.opts');
  requestAnimationFrame(() => requestAnimationFrame(() => opts.classList.add('in')));
}
let busy = false;
function pickOpt(i) {
  if (busy) return; busy = true;
  const opts = room.querySelector('.opts');
  opts.classList.add('picked');
  opts.querySelector(`[data-opt="${i}"]`).classList.add('taken');
  picks[qi] = i;
  const slot = room.querySelectorAll('.slot')[qi];
  slot.textContent = QUIZ[qi].opts[i].b; slot.classList.add('full');
  setTimeout(() => {
    busy = false;
    if (qi < 2) { qi++; renderQuiz(); return; }
    finishQuiz();
  }, 520);
}
function finishQuiz() {
  const score = {grok:0, duo:0, custom:0};
  picks.forEach((p, q) => Object.entries(QUIZ[q].opts[p].p).forEach(([k, v]) => score[k] += v));
  const lead = QUIZ[1].opts[picks[1]].lead;
  rec = ORDER.slice().sort((a, b) => (score[b] - score[a]) || ((b === lead) - (a === lead)))[0];
  recWhy = TEAMS[rec].why;
  sel = rec; mode = 'pick'; qi = 0;
  renderPick(true);
}

function renderStart(k) {

    : say(`${t.name}${k === 'duo' ? '로' : '으로'} 시작합니다.`, all ? '모두 이었습니다. 사무실을 열면 첫 직원이 자리에 앉습니다.' : '아래 차례대로 이으면 첫 직원이 사무실에 앉습니다.');
  room.innerHTML = head
    + `<div class="start"><div class="deck has-sel" style="margin:0;grid-template-columns:1fr">${cardHTML(k, {static:true})}</div><div>`
    + `<ol class="steps">${t.steps.map((s, i) => {
        const ok = done.has(i);
        return `<li class="${ok ? 'ok' : ''}" style="--j:${i}"><span class="n">${ok ? '✓' : i + 1}</span><span class="s-t"><b>${esc(s.t)}</b><small>${esc(ok ? s.ok : s.s)}</small></span>`
          + `<span class="s-b">${ok ? '<span class="lab">됨</span>' : `<button class="go sm${i === nextStep ? ' main' : ''}" type="button" data-step="${i}">${esc(s.btn)}</button>`}</span></li>`;
      }).join('')}</ol>`
    + `<div class="start-go">${opened ? '<button class="go" type="button" data-again>처음부터 다시 보기</button>' : `<button class="go main" type="button" data-open ${all ? '' : 'disabled'}>사무실 열기</button><button class="quiet" type="button" data-change>다른 팀 고르기</button>`}</div>`
    + `</div></div>`;
  const ol = room.querySelector('.steps');
  if (startAnim) { requestAnimationFrame(() => requestAnimationFrame(() => ol.classList.add('in'))); startAnim = false; }
  else { ol.classList.add('in'); ol.querySelectorAll('li').forEach(x => x.style.transition = 'none'); room.querySelector('.say').classList.remove('swap'); }
}
let startAnim = false, stepT = null;

room.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.team) choose(b.dataset.team);
  else if ('quiz' in b.dataset) { mode = 'quiz'; qi = 0; picks = []; sel = null; renderQuiz(); }
  else if (b.dataset.opt != null) pickOpt(+b.dataset.opt);
  else if ('back' in b.dataset) { picks.length = qi - 1; qi--; renderQuiz(); }
  else if ('stop' in b.dataset) { mode = 'pick'; qi = 0; picks = []; renderPick(true); }
  else if (b.dataset.start) { mode = 'start'; sel = b.dataset.start; done = new Set(); opened = false; startAnim = true; renderStart(sel); window.scrollTo({top:0}); }
  else if (b.dataset.step != null) {
    if (stepT) return;
    const i = +b.dataset.step; b.outerHTML = '<span class="lab">잇는 중</span>';
    stepT = setTimeout(() => { stepT = null; done.add(i); const before = done.size === TEAMS[sel].steps.length; renderStart(sel); if (before) room.querySelector('.say').classList.add('swap'); }, 650);
  }
  else if ('open' in b.dataset) { opened = true; renderStart(sel); room.querySelector('.say').classList.add('swap'); }
  else if ('change' in b.dataset) { mode = 'pick'; renderPick(true); }
  else if ('again' in b.dataset) reset();
});
function reset() { sel = rec = null; recWhy = ''; mode = 'pick'; qi = 0; picks = []; done = new Set(); opened = false; clearTimeout(stepT); stepT = null; renderPick(true); window.scrollTo({top:0}); }
document.getElementById('m-reset').onclick = reset;
document.getElementById('m-narrow').onclick = e => { const on = document.body.classList.toggle('narrow'); e.target.textContent = on ? '넓은 창' : '좁은 창'; };

/* 주소 끝 #grok · #duo · #custom 은 그 카드가 열린 채로, #quiz 는 추천받기로, #start-duo 처럼 쓰면 시작 차례로 연다 */
const h = location.hash.slice(1);
if (TEAMS[h]) { sel = h; renderPick(false); }
else if (h === 'quiz') { mode = 'quiz'; renderQuiz(); }
else if (h.startsWith('start-') && TEAMS[h.slice(6)]) { mode = 'start'; sel = h.slice(6); startAnim = true; renderStart(sel); }
else renderPick(true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔리오 · 처음 시작 · AI 팀 고르기</title>
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}

/* 짜임(5판): 솔리오를 처음 켠 순간. 사무실 시안과 같은 검정 방이다.
   고르기는 무대 하나에 팀 하나가 크게 서고, 아래 줄에서 세 팀을 바꿔 본다(직업 고르기 화면).
   연결은 사무실 바닥 그림에서 직원이 입구에 나타나 눈을 뜨고 자기 부서 자리로 간다.
   색은 하나이고 고른 것만 밝다. 움직임은 그림이 바뀌는 것, 줄이 차례로 떨어지는 것, 직원이 한 번 자리로 가는 것뿐이다. */
:root{
  color-scheme:dark;
  --void:#000;
  --paper:#F3F1EC;
  --dim:rgba(243,241,236,.46);
  --soft:rgba(243,241,236,.72);
  --hair:rgba(243,241,236,.10);
  --hair-strong:rgba(243,241,236,.22);
  --ring:rgba(243,241,236,.55);
  --pit:#0C0C0B;
  --sans:'SUIT Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1px solid var(--ring);outline-offset:3px}

#stage{position:relative;min-height:100vh;width:var(--sw,100%);margin:0 auto;container-type:inline-size;container-name:stage;padding:0 clamp(20px,6cqw,110px) 96px}
body.narrow #stage{--sw:420px;outline:1px solid var(--hair)}

.here{display:flex;align-items:center;gap:10px;padding-top:clamp(14px,3vh,34px)}
.here svg{width:40px;height:40px}
.here-name{font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7)}
.here-step{margin-left:auto;font:400 12px/1 var(--sans);color:var(--dim);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:18px 40px;margin-top:clamp(20px,4vh,46px)}
.top > .say{flex:1 1 auto}
.say{margin:0;font:300 clamp(26px,3.3cqw,46px)/1.28 var(--sans);letter-spacing:-.018em;max-width:20em;text-wrap:balance}
.say .then{display:block;color:var(--dim)}
.say.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px}
.chips{margin:14px 0 0;font:400 13px/1.5 var(--sans);color:var(--dim)}
.chips b{font-weight:500;color:var(--soft)}

.go{appearance:none;height:42px;margin:0;padding:0 22px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);font:500 14px/1 var(--sans);color:var(--paper);cursor:pointer;white-space:nowrap;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.go:hover{border-color:var(--paper)}
.go.main{background:var(--paper);border-color:var(--paper);color:var(--void)}
.go.main:hover{background:#fff}
.go:disabled{opacity:.35;cursor:default}
.go.sm{height:32px;padding:0 15px;font-size:13px}
.quiet{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;margin:0;padding:0 0 4px;font:400 13px/1.3 var(--sans);color:rgba(243,241,236,.8);cursor:pointer;transition:color .25s ease,border-color .25s ease}
.quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
.lab{font:400 13px/1.3 var(--sans);color:var(--dim)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--paper);color:var(--void);font:700 11px/1 var(--sans);letter-spacing:.02em;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* ── 무대: 왼쪽에 고른 팀의 장면이 크게, 오른쪽에 그 팀의 글. 장면 아래 줄에서 팀을 바꾼다 ── */
.show{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:clamp(26px,4.4cqw,72px);margin-top:clamp(10px,2vh,24px);align-items:start}
.hero-art{position:relative;aspect-ratio:3/2;margin:0 -2%}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .55s ease,transform 1.1s var(--ease);
  -webkit-mask-image:radial-gradient(ellipse 70% 68% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 70% 68% at 50% 50%,#000 58%,transparent 100%)}
.hero-art img.on{opacity:1;transform:none}
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2cqw,16px);margin-top:4px}
.pick{appearance:none;position:relative;margin:0;padding:8px 12px 8px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;text-align:left;cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:14px;
  transition:border-color .3s ease,background-color .3s ease,opacity .3s ease}
.pick:hover{border-color:rgba(243,241,236,.36)}
.pick[aria-pressed="true"]{border-color:var(--paper);background:var(--pit)}
.th{display:block;width:clamp(64px,6.6cqw,92px);aspect-ratio:3/2;border-radius:9px;overflow:hidden;background:#000}
.th img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--fp,50% 45%);transform:scale(1.6);transition:filter .3s ease}
.pick:not([aria-pressed="true"]) .th img{filter:grayscale(.3) brightness(.85)}
.pick:hover .th img{filter:none}
.p-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.p-no{font:500 11px/1 var(--sans);letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums}
.p-name{font:600 15px/1.25 var(--sans)}
.pick:not([aria-pressed="true"]) .p-name{color:var(--soft)}
.pick .badge{position:absolute;top:-9px;right:10px}
.roster.deal .pick{animation:deal .6s var(--ease) both;animation-delay:calc(var(--n) * 110ms + 250ms)}
@keyframes deal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 오른쪽 글: 팀을 바꿀 때마다 위에서부터 한 줄씩 떨어진다 */
.info{padding-top:clamp(2px,1vh,12px)}
.cas{opacity:0;transform:translateY(-10px)}
.info.in .cas{opacity:1;transform:none;transition:opacity .36s ease calc(60ms + var(--j,0) * 70ms),transform .52s var(--ease) calc(60ms + var(--j,0) * 70ms)}
.i-no{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--sans);letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums}
.i-name{margin:12px 0 0;font:700 clamp(30px,3.3cqw,46px)/1.12 var(--sans);letter-spacing:-.02em}
.i-tag{margin:10px 0 0;font:400 17px/1.45 var(--sans);color:rgba(243,241,236,.9)}
.i-maker{margin:4px 0 0;font:400 13px/1.45 var(--sans);color:var(--dim)}
.meters{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center}
.meters dt{font:400 12px/1.2 var(--sans);color:var(--dim);white-space:nowrap}
.meters dd{margin:0;display:flex;align-items:center;gap:3px;font:500 13px/1.3 var(--sans);color:var(--soft)}
.seg{width:18px;height:4px;border-radius:1px;background:var(--hair-strong)}
.seg.on{background:var(--paper)}
.info.in .seg.on{animation:fill .5s var(--ease) both;animation-delay:calc(220ms + var(--s) * 60ms)}
@keyframes fill{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.pc{margin:18px 0 0}
.i-go + .pc{margin-top:26px;padding-top:20px;border-top:1px solid var(--hair)}
.pc h3{margin:0 0 8px;font:500 12px/1 var(--sans);letter-spacing:.12em;color:var(--dim)}
.pc + .pc{margin-top:12px}
.ln{display:grid;grid-template-columns:18px 1fr;gap:4px;margin:0;padding:3px 0;font:400 15px/1.5 var(--sans);color:rgba(243,241,236,.92)}
.ln i{font-style:normal;font-weight:700}
.ln small{font-size:13px;color:var(--dim)}
.pc.bad .ln{color:var(--soft)}
.pc.bad .ln i{color:var(--dim)}
.fit{margin:14px 0 0;font:400 14px/1.5 var(--sans);color:var(--soft)}
.fit b{font-weight:500;color:var(--dim);margin-right:8px}
.i-go{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;margin-top:18px}

/* ── 추천받기: 카드 세 장을 한 장씩 골라 손에 쥔다 ── */
.quiz{margin-top:clamp(22px,4vh,44px)}
.hand{display:flex;gap:10px;align-items:center}
.slot{width:clamp(96px,12cqw,150px);height:52px;border:1px dashed var(--hair-strong);border-radius:10px;display:flex;align-items:center;padding:0 12px;font:500 12px/1.3 var(--sans);color:var(--dim)}
.slot.full{border:1px solid rgba(243,241,236,.5);background:var(--pit);color:var(--paper);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.q-no{margin:30px 0 0;font:500 12px/1 var(--sans);letter-spacing:.14em;color:var(--dim)}
.q{margin:12px 0 0;font:500 clamp(20px,2.2cqw,28px)/1.3 var(--sans)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6cqw,22px);margin-top:22px}
.opt{appearance:none;margin:0;text-align:left;cursor:pointer;background:var(--pit);border:1px solid var(--hair-strong);border-radius:14px;padding:22px 20px 24px;min-height:210px;display:flex;flex-direction:column;gap:10px;
  opacity:0;transform:translateY(-10px);transition:transform .46s var(--ease),border-color .3s ease,opacity .3s ease}
.opts.in .opt{opacity:1;transform:none;transition:opacity .34s ease calc(var(--j) * 90ms),transform .5s var(--ease) calc(var(--j) * 90ms),border-color .3s ease}
.opts.in .opt:hover{transform:translateY(-4px);border-color:rgba(243,241,236,.45);transition-delay:0s}
.opt .ic{width:34px;height:34px;color:var(--soft);margin-bottom:auto;transition:color .3s ease}
.opt:hover .ic,.opt.taken .ic{color:var(--paper)}
.opt b{font:700 18px/1.3 var(--sans);margin-top:28px}
.opt span{font:400 14px/1.45 var(--sans);color:var(--soft)}
.opt.taken{transform:translateY(-14px) !important;border-color:var(--paper);transition-delay:0s}
.opts.in.picked .opt:not(.taken){opacity:.2}
.q-acts{display:flex;gap:22px;margin-top:22px}

/* ── 연결: 왼쪽은 사무실 바닥. 차례를 이을 때마다 직원이 입구에 나타나고, 눈을 뜨고, 자리로 간다 ── */
.start{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:clamp(26px,4.4cqw,72px);margin-top:clamp(14px,3vh,34px);align-items:start}
.scene{position:relative;aspect-ratio:7/5}
.scene canvas{position:absolute;inset:0;width:100%;height:100%}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:13px 0;opacity:0;transform:translateY(-10px)}
.steps.in li{opacity:1;transform:none;transition:opacity .34s ease calc(80ms + var(--j) * 80ms),transform .5s var(--ease) calc(80ms + var(--j) * 80ms)}
.n{width:24px;height:24px;border-radius:50%;border:1px solid var(--hair-strong);display:grid;place-items:center;font:500 12px/1 var(--sans);color:var(--dim)}
.steps li.ok .n{background:var(--paper);border-color:var(--paper);color:var(--void)}
.steps li.now .n{border-color:var(--paper);color:var(--paper)}
.s-t b{display:block;font:500 15px/1.4 var(--sans)}
.steps li:not(.ok):not(.now) .s-t b{color:var(--soft)}
.s-t small{display:block;margin-top:3px;font:400 13px/1.4 var(--sans);color:var(--dim)}
.steps li.ok .s-t small{color:var(--soft)}
.s-b{white-space:nowrap}
.s-b .lab{color:var(--paper)}
.steps li:not(.now) .go.sm{opacity:.45}
.start-go{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding-top:20px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.who .th{width:64px}
.who b{font:600 15px/1.3 var(--sans)}
.who span{display:block;font:400 12px/1.4 var(--sans);color:var(--dim)}

/* 시안 조작 막대. 디자인의 일부가 아니다 */
#meta{position:fixed;right:14px;bottom:14px;opacity:.55;z-index:9;display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(10,10,10,.86);border:1px solid var(--hair)}
#meta button{appearance:none;border:0;background:none;color:rgba(243,241,236,.7);font:400 12px/1 var(--sans);padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
#meta:hover{opacity:1}
#meta button:hover{color:var(--paper);background:rgba(243,241,236,.08)}

/* 좁은 창: 장면이 위, 팀 줄은 세 칸, 글은 그 아래 */
@container stage (max-width:820px){
  .top{align-items:flex-start}
  .show,.start{grid-template-columns:minmax(0,1fr)}
  .hero-art{margin:0 -6%}
  .scene{margin:0 -6%;aspect-ratio:5/4}
  .pick{grid-template-columns:minmax(0,1fr);padding:6px 6px 10px;gap:8px}
  .th{width:100%}
  .p-t{padding:0 4px}
  .p-name{font-size:14px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt{min-height:0}
  .slot{width:auto;flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .cas,.opt,.steps li{opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>
<div id="stage">
  <header class="here">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><radialGradient id="hg" cx="34%" cy="30%" r="76%"><stop offset="0" stop-color="#F3F1EC" stop-opacity=".22"/><stop offset="1" stop-color="#F3F1EC" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="17" fill="#000"/><circle cx="20" cy="20" r="17" fill="url(#hg)" stroke="rgba(243,241,236,.6)" stroke-width="1"/><g><ellipse cx="16.4" cy="19" rx="1.5" ry="1.5" fill="#F3F1EC"/><ellipse cx="23.6" cy="19" rx="1.5" ry="1.5" fill="#F3F1EC"/></g></svg>
    <span class="here-name">SOLIO</span>
    <span class="here-step" id="step">처음 시작 · 1 / 2</span>
  </header>
  <main id="room" aria-live="polite"></main>
</div>
<nav id="meta" aria-label="시안 조작"><button type="button" id="m-reset">처음부터</button><button type="button" id="m-narrow">좁은 창</button></nav>

<script>
'use strict';
/* 팀 세 가지. 글은 AI를 처음 쓰는 분이 읽는 말로 쓴다. 기술 이름(OAuth · CLI · MCP)은 화면에 쓰지 않는다 */

    good:[

      ['프로그램 둘을 설치하고 각각 로그인합니다.','솔리오가 한 단계씩 안내합니다.'],

    ],

    steps:[
      {t:'Claude Code 설치하고 로그인', s:'팀장 Claude가 내 PC의 파일로 일하게 하는 프로그램입니다. 사용량은 내 Claude 구독에서 나갑니다.', btn:'설치하기', ok:'팀장 Claude가 준비됐습니다. 쓰시던 Claude 구독으로 일합니다.'},

      {t:'솔리오와 연결', s:'팀장이 사무실의 일감을 받아 GPT와 나눠 하게 합니다.', btn:'연결', ok:'두 직원이 사무실의 일감을 받습니다.'},
    ],
    /* 연결 장면: 몇 번째 차례에서 입구에 나타나고(come), 눈을 뜨고(wake), 자리로 가는지(sit). lead는 팀장이다 */
    staff:[{who:'Claude', dept:'plan', come:0, wake:0, sit:2, lead:true}, {who:'GPT', dept:'dev', come:1, wake:1, sit:2}],
    seat:'팀장 Claude가 기획부에, GPT가 개발부에 앉았습니다.',
    why:'팀장 Claude가 일을 나누고,\nGPT와 서로 검토하며 문서와 코드를 만듭니다.',
  },
  gemini: {
    no:'02', name:'Gemini + Claude + GPT', obj:'Gemini + Claude + GPT를', with:'Gemini + Claude + GPT로', lead:'Gemini', maker:'Google의 Gemini, Anthropic의 Claude, OpenAI의 ChatGPT', tag:'Gemini가 팀장, Claude와 GPT가 함께 일합니다',
    ease:2, crew:'Gemini(팀장), Claude, GPT', off:'PC가 켜져 있을 때 일함', cost:'구독 세 개(Google AI, Claude, ChatGPT)',
    good:[
      ['팀장 Gemini가 긴 자료를 한 번에 읽고 일을 나눕니다.','회의 녹음, 긴 문서, 영상처럼 큰 자료에 강합니다.'],
      ['문서와 코드는 Claude와 GPT가 나눠 만듭니다.',''],
      ['셋이 서로의 결과를 검토합니다.','한 AI가 놓친 것을 다른 AI가 짚습니다.'],
      ['Google 계정으로 쓰던 Gemini를 그대로 팀장으로 씁니다.',''],
    ],
    bad:[
      ['프로그램 셋을 설치하고 각각 로그인합니다.','솔리오가 한 단계씩 안내합니다.'],
      ['PC가 켜져 있어야 일합니다.',''],
      ['구독 세 개의 값이 듭니다.',''],
      ['직원이 셋이라 한 번에 쓰는 사용량이 많습니다.',''],
    ],

  const cv = sceneCv; if (!cv || !cv.isConnected) return;

  const dpr = Math.min(2, devicePixelRatio || 1);
  if (w !== sceneW || h !== sceneH) { sceneW = w; sceneH = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); fitCam(w, h); }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const goal = new Set(crew.map(m => m.dept));
  const seated = id => crew.some(m => m.dept === id && m.tSit != null && now - m.tSit > 700);
  const fs = Math.max(10, Math.min(12.5, cam.S * .27)); ctx.font = `400 ${fs}px "SUIT Variable","Malgun Gothic",sans-serif`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  // 부서 자리: 뒤에서 앞으로. 이 팀이 앉을 부서는 처음부터 조금 밝다
  const order = DEPTS.map(d => ({d, q:rectOf(d)})).sort((a, b) => P0(0, 0, a.q.z0)[2] - P0(0, 0, b.q.z0)[2]);
  for (const {d, q} of order) {
    const g = goal.has(d.id), on = g && seated(d.id), lit = on && opened;
    const topF = [P(q.x0, SLAB, q.z0), P(q.x1, SLAB, q.z0), P(q.x1, SLAB, q.z1), P(q.x0, SLAB, q.z1)];
    const base = [P(q.x0, 0, q.z0), P(q.x1, 0, q.z0), P(q.x1, 0, q.z1), P(q.x0, 0, q.z1)];
    poly(ctx, base); ctx.strokeStyle = ink(on ? .2 : .07); ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); for (let i = 0; i < 4; i++) { ctx.moveTo(base[i][0], base[i][1]); ctx.lineTo(topF[i][0], topF[i][1]); } ctx.stroke();
    poly(ctx, topF); ctx.fillStyle = on ? 'rgb(14,14,13)' : 'rgb(5,5,5)'; ctx.fill();
    ctx.strokeStyle = ink(lit ? .62 : on ? .48 : g ? .3 : .12); ctx.stroke();
    const lp = P(q.x0 + .2, SLAB, q.z1 - .2);
    ctx.fillStyle = ink(on ? .95 : g ? .78 : .42); ctx.fillText(d.name, lp[0], lp[1]);
    if (!on) { const c = {x:(q.x0 + q.x1) / 2, z:(q.z0 + q.z1) / 2 - .18}, a = P(c.x - .17, SLAB, c.z + .3), b = P(c.x + .17, SLAB, c.z + .3);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.strokeStyle = ink(g ? .42 : .12); ctx.stroke(); }
  }
  // 입구: 맨 앞의 얇은 띠
  const door = [P(DOOR.x0, 0, DOOR.z0), P(DOOR.x1, 0, DOOR.z0), P(DOOR.x1, 0, DOOR.z1), P(DOOR.x0, 0, DOOR.z1)];
  poly(ctx, door); ctx.strokeStyle = ink(.13); ctx.lineWidth = 1; ctx.stroke();
  { const lp = P(DOOR.x0 + .2, 0, DOOR.z1 - .2); ctx.fillStyle = ink(.42); ctx.fillText('입구', lp[0], lp[1]); }

  // 직원: 입구에 나타나고(0.4초) → 눈을 뜨고 → 자리로 한 번 간다(0.9초)
  const list = [];
  for (const m of crew) {
    if (m.tCome == null) continue;
    const a = doorSpot(m), b = seatSpot(m), k = m.tSit == null ? 0 : ease((now - m.tSit) / 900);
    const x = a.x + (b.x - a.x) * k, z = a.z + (b.z - a.z) * k, base = SLAB * k;
    const awake = m.tWake != null && now >= m.tWake, lift = awake ? .16 : .02;
    const y = base + R0 + lift + (k > 0 && k < 1 ? Math.sin(k * Math.PI) * .25 : 0);
    const p = P(x, y, z), R = R0 * (m.lead ? 1.22 : 1) * cam.S * p[3];
    if (m.blink > 0) m.blink = Math.max(0, m.blink - .12); else if (awake && now > m.nextBlink && !still) { m.blink = 1; m.nextBlink = now + 2600 + Math.random() * 4800; }
    list.push({m, p, R, x, z, base, y, awake, alpha:still ? 1 : Math.min(1, (now - m.tCome) / 400)});
  }
  list.sort((a, b) => a.p[2] - b.p[2]);
  for (const {m, p, R, x, z, base, y, awake, alpha} of list) {
    ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
    if (y - R0 - base > .03) { const f = P(x, base, z), t = P(x, y - R0, z); ctx.beginPath(); ctx.moveTo(f[0], f[1]); ctx.lineTo(t[0], t[1]); ctx.strokeStyle = ink(.16); ctx.lineWidth = 1; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
    const gr = ctx.createRadialGradient(p[0] - R * .3, p[1] - R * .38, 0, p[0] - R * .3, p[1] - R * .38, R * 1.15);
    gr.addColorStop(0, ink(awake ? .2 : .07)); gr.addColorStop(1, ink(0)); ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = ink(opened ? .7 : awake ? .58 : .3); ctx.lineWidth = 1; ctx.stroke();
    eyes(ctx, p[0], p[1], R, opened ? 'smile' : awake ? 'open' : 'closed', awake && !opened ? R * .1 : 0, m.blink, awake ? .95 : .5);
    ctx.textAlign = 'center'; ctx.font = `500 ${fs}px "SUIT Variable","Malgun Gothic",sans-serif`; ctx.fillStyle = ink(awake ? .82 : .5);
    ctx.fillText(m.lead ? `${m.who} · 팀장` : m.who, p[0], p[1] + R + fs + 3);
    ctx.restore();
  }
}
(function loop(now) { requestAnimationFrame(loop); if (mode === 'start') drawScene(now); })(performance.now());
addEventListener('resize', () => { sceneW = 0; });

function renderStart(k, anim) {
  const t = TEAMS[k];
  stepEl.textContent = '처음 시작 · 2 / 2';
  const all = done.size === t.steps.length, next = t.steps.findIndex((_, i) => !done.has(i));
  const head = opened
    ? say('사무실이 열렸습니다.', t.seat, anim)
    : say(`${t.with} 시작합니다.`, all ? '모두 이었습니다.\n사무실을 열면 첫 직원이 일을 받습니다.' : '차례대로 이으면 직원이 와서 자기 자리에 앉습니다.', anim);
  room.innerHTML = `<div class="top">${head}</div>`
    + `<div class="start"><div class="scene" role="img" aria-label="사무실 바닥 그림. ${esc(t.staff.map(m => `${m.who}의 자리는 ${DEPTS.find(d => d.id === m.dept).name}`).join(', '))}입니다."><canvas></canvas></div><div>`
    + `<div class="who"><span><b>${esc(t.name)}</b><span>${esc(t.tag)}</span></span></div>`
    + `<ol class="steps">${t.steps.map((s, i) => {
        const ok = done.has(i);
        return `<li class="${ok ? 'ok' : i === next && !opened ? 'now' : ''}" style="--j:${i}"><span class="n">${ok ? '✓' : i + 1}</span><span class="s-t"><b>${esc(s.t)}</b><small>${esc(ok ? s.ok : s.s)}</small></span>`
          + `<span class="s-b">${ok ? '' : `<button class="go sm${i === next ? ' main' : ''}" type="button" data-step="${i}">${esc(s.btn)}</button>`}</span></li>`;
      }).join('')}</ol>`
    + `<div class="start-go">${opened ? '<button class="go" type="button" data-again>처음부터 다시 보기</button>' : `<button class="go main" type="button" data-open ${all ? '' : 'disabled'}>사무실 열기</button><button class="quiet" type="button" data-change>다른 팀 고르기</button>`}</div>`
    + `</div></div>`;
  sceneCv = room.querySelector('.scene canvas'); sceneW = 0;
  const ol = room.querySelector('.steps');
  if (anim === 'steps' && !still) raf2(() => ol.classList.add('in'));
  else { ol.classList.add('in'); ol.querySelectorAll('li').forEach(x => x.style.transition = 'none'); }
}
let stepT = null;
function beginStart(k, anim) { mode = 'start'; focus = k; done = new Set(); opened = false; makeCrew(k); renderStart(k, anim ? 'steps' : false); if (anim) room.querySelector('.say').classList.add('swap'); }

room.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.team) show(b.dataset.team);
  else if ('quiz' in b.dataset) { mode = 'quiz'; qi = 0; picks = []; renderQuiz(); }
  else if (b.dataset.opt != null) pickOpt(+b.dataset.opt);
  else if ('back' in b.dataset) { picks.length = qi - 1; qi--; renderQuiz(); }
  else if ('stop' in b.dataset) { mode = 'pick'; qi = 0; picks = []; renderPick(true); }
  else if (b.dataset.start) { beginStart(b.dataset.start, true); window.scrollTo({top:0}); }
  else if (b.dataset.step != null) {
    if (stepT) return;
    const i = +b.dataset.step; b.outerHTML = '<span class="lab">잇는 중</span>';
    stepT = setTimeout(() => { stepT = null; done.add(i); syncCrew(true); const all = done.size === TEAMS[focus].steps.length; renderStart(focus, all); }, 650);
  }
  else if ('open' in b.dataset) { opened = true; renderStart(focus, true); }
  else if ('change' in b.dataset) { mode = 'pick'; renderPick(true); }
  else if ('again' in b.dataset) reset();
});
function reset() { focus = 'claude'; rec = null; recWhy = ''; mode = 'pick'; qi = 0; picks = []; done = new Set(); opened = false; clearTimeout(stepT); stepT = null; renderPick(true); window.scrollTo({top:0}); }
document.getElementById('m-reset').onclick = reset;
document.getElementById('m-narrow').onclick = e => { const on = document.body.classList.toggle('narrow'); e.target.textContent = on ? '넓은 창' : '좁은 창'; sceneW = 0; };

/* 주소 끝 #claude · #gemini · #custom 은 그 팀을 무대에, #quiz 는 추천받기로, #start-gemini 처럼 쓰면 연결로 연다.
   #start-gemini-3 처럼 숫자를 붙이면 그 차례까지 이은 채로, #start-gemini-open 은 사무실을 연 뒤로 연다(캡처용) */
const h = location.hash.slice(1), hs = h.match(/^start-(claude|gemini|custom)(?:-(\d+|open))?$/);
if (TEAMS[h]) { focus = h; renderPick(true); }
else if (h === 'quiz') { mode = 'quiz'; renderQuiz(); }
else if (hs) {
  const k = hs[1]; mode = 'start'; focus = k; makeCrew(k);
  const n = hs[2] === 'open' ? TEAMS[k].steps.length : +(hs[2] || 0);
  done = new Set([...Array(Math.min(n, TEAMS[k].steps.length)).keys()]); opened = hs[2] === 'open'; syncCrew(false); renderStart(k, 'steps');
}
else renderPick(true);
</script>

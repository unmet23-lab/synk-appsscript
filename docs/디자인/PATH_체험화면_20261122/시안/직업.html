<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SYNK PATH · 일터 체험 — 시안</title>
<link rel="stylesheet" href="./ui.css">
<style>
  .head{padding:56px 0 36px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px 56px;align-items:end}
  /* 옛 판의 장점(여섯 일터가 큰 카드로 한 화면에)과 직업마다 사진(11-23 유호님). 실제 화면 workday.css와 같은 짜임. */
  .jobs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0;padding:0;list-style:none}
  .jobs>li{display:flex}
  .job{display:flex;flex-direction:column;width:100%;overflow:hidden;border-radius:var(--r-card);background:var(--soft);text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  a.job:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(20,23,28,.10)}
  .job-visual{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--desk)}
  .job-visual img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
  .job-flag{position:absolute;left:14px;top:14px;display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.94);color:var(--ink-2)}
  .job.open .job-flag{background:var(--meadow-wash);color:var(--meadow-deep)}
  .job-word{position:absolute;left:22px;right:22px;bottom:18px;margin:0;font-size:clamp(28px,3vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.02em;color:var(--ink-2);word-break:keep-all}
  .job-body{display:flex;flex-direction:column;gap:8px;flex:1;padding:20px 22px 24px}
  .job.open .job-body{gap:10px}
  .job-role{margin:0;font-size:clamp(24px,2.2vw,30px);line-height:1.2;font-weight:800;letter-spacing:-.02em}
  .job-summary{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
  .job-meta{display:flex;flex-wrap:wrap;align-items:center;margin:2px 0 0;font-family:"DM Mono",var(--sans,sans-serif);font-size:14px;font-weight:500;color:var(--ink-2)}
  .job-meta span+span::before{content:"";display:inline-block;width:4px;height:4px;margin:0 10px;border-radius:50%;background:var(--line-2,#d3d7dd);vertical-align:middle}
  .job.no-photo .job-role{display:none}
  .job .btn{margin-top:auto;width:100%}
  @media (max-width:1000px){.jobs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){
    .head{grid-template-columns:1fr;padding:36px 0 24px}
    .jobs{gap:12px}
    .jobs>li:has(.open){grid-column:1/-1}
    .job.making .job-visual{aspect-ratio:4/3}
    .job.making .job-word{left:14px;right:14px;bottom:12px;font-size:22px}
    .job.making .job-flag{left:8px;top:auto;bottom:8px;height:24px;padding:0 9px;font-size:12px}
    .job.making.no-photo .job-flag{top:8px;bottom:auto}
    .job.making .job-body{padding:12px 14px 16px}
    .job.making .job-role{font-size:18px}
    .job.making .job-summary{display:none}
    .jobs>li:last-child:nth-child(even){grid-column:1/-1}
    .jobs>li:last-child:nth-child(even) .job.making .job-visual{aspect-ratio:16/9}
  }
  @media (min-width:641px) and (max-width:900px){.head{grid-template-columns:1fr;padding:36px 0 24px}}
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
  <a class="brand" href="./입구.html" aria-label="SYNK PATH 체험 처음"><img src="../../../../experiences/path-vr/assets/logo-path-320.webp" alt="SYNK PATH" width="320" height="108"></a>
  <nav class="bar-nav" aria-label="체험"><a href="./직업.html" aria-current="page">일터 체험</a><a href="./면접.html">면접 연습</a></nav>
</div></header>

<main class="wrap">
  <section class="head" aria-labelledby="title">
    <div><p class="kicker">일터 체험</p><h1 class="display" id="title">어느 일터에서<br>하루를 보낼까요?</h1></div>
    <p class="lead">일터를 고르면 그곳 선배와 하루를 보내요. 장면 하나는 2~3분이고, 장면마다 쉬었다가 이어서 할 수 있어요.</p>
  </section>
  <ul class="jobs" id="jobs" aria-label="일터 고르기"></ul>
</main>

<footer class="foot"><div class="wrap foot-in"><span>SYNK PATH · 일터 체험 · 체험 기록은 이 기기에서 만들고, SYNK가 보관하지 않아요.</span><a href="./면접.html">면접 연습</a></div></footer>
<script src="./mock.js"></script>
<script>
(async () => {
  const base = '../../../../experiences/path-vr/workday/jobs/';
  const make = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const index = await (await fetch(base + 'index.json')).json();
  const jobs = [...index.jobs].sort((a, b) => (b.status === 'open') - (a.status === 'open'));
  jobs.forEach((job) => {
    const open = job.status === 'open', name = job.role || job.title, li = make('li'), card = make(open ? 'a' : 'div', `job ${open ? 'open' : 'making'}`);
    if (open) card.href = `./체험.html?job=${job.id}`;
    const visual = make('div', 'job-visual');
    const plain = () => { card.classList.add('no-photo'); visual.prepend(make('p', 'job-word', name)); };
    if (job.poster) { const img = make('img'); img.src = base + job.poster; img.alt = job.posterAlt || ''; img.onerror = () => { img.remove(); plain(); }; visual.append(img); } else plain();
    visual.append(make('span', 'job-flag', open ? '지금 할 수 있어요' : '만드는 중'));
    const body = make('div', 'job-body');
    body.append(make('h2', 'job-role', name), make('p', 'job-summary', job.summary || ''));
    if (open) {
      const meta = make('p', 'job-meta'); [job.scenes ? `장면 ${job.scenes}개` : '', job.minutes ? `${job.minutes}분쯤` : ''].filter(Boolean).forEach((t) => meta.append(make('span', '', t))); body.append(meta);
      const go = make('span', 'btn go big', '이 일터로 가기'); go.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'); body.append(go);
    }
    card.append(visual, body); li.append(card); document.getElementById('jobs').append(li);
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔리오 사무실 대화</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&amp;display=swap">
<style>
@font-face{font-family:'SUIT';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}
@font-face{font-family:'DM Mono';font-weight:400;font-display:swap;src:url(../../브랜드_폰트/DM_Mono/DMMono-Regular.ttf) format('truetype');}

/* 짜임: 왼쪽은 대화 상대(팀장과 부서) 목록, 가운데 위는 사무실 무대, 그 아래는 고른 상대와의 대화, 넓은 창에서는 오른쪽에 「이 부서」 칸.
   색은 역할마다 하나다. 검정은 방, 종이색 글과 흰 알약은 말과 결정, 호두나무와 등빛은 사무실(등빛 = 지금 일하는 중), 흰 종이와 먹은 손님의 문서다.
   글자는 SUIT(방과 직원의 말), DM Mono(때 · 파일 이름 · 주소), Noto Serif KR(손님의 문서)로 나눈다. */
:root{
  color-scheme:dark;
  --void:#000000;
  --paper:#F3F1EC;
  --text:rgba(243,241,236,.9);
  --dim:rgba(243,241,236,.54);
  --faint:rgba(243,241,236,.36);
  --hair:rgba(243,241,236,.1);
  --hair-strong:rgba(243,241,236,.2);
  --ring:rgba(243,241,236,.55);
  --lift:rgba(243,241,236,.065);
  --bubble:rgba(243,241,236,.095);
  --pit:#0C0C0B;
  --sheet:#FFFFFF;
  --sheet-ink:#151514;
  --sheet-body:#3B3A37;
  --sheet-dim:#6B6A66;
  --meta-bg:rgba(10,10,10,.86);
  --sans:'SUIT','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'DM Mono','SUIT','Malgun Gothic',ui-monospace,monospace;
  --serif:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);overflow:hidden;display:grid;place-items:center;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 창 하나가 곧 앱이다. 안의 것은 창의 크기를 보고 놓인다 */
#app{position:relative;width:var(--aw,100%);height:var(--ah,100%);max-width:100%;max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--void);overflow:hidden;container-type:size;container-name:app}
body.sized #app{outline:1px solid var(--hair)}

/* 맨 위: 구와 솔리오의 프로그램(검정 구 시안 그대로) */
.top{display:flex;align-items:center;gap:6px;height:64px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#orb-btn{width:44px;height:44px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
#orb-cv{width:44px;height:44px;display:block}
#here-name{padding:10px 8px 10px 0;display:inline-flex;align-items:center;gap:9px;font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7)}
#here-name svg{width:8px;height:5px;flex:none;opacity:.7}
.rail{display:flex;align-items:center;gap:2px;margin-left:18px;min-width:0}
.obj{appearance:none;background:none;border:0;margin:0;padding:10px 8px;display:inline-flex;align-items:center;color:rgba(243,241,236,.46);cursor:pointer;border-radius:2px;transition:color .25s ease}
.obj svg{width:18px;height:18px;flex:none}
.obj-n{max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;font:400 13px/1.3 var(--sans);letter-spacing:.03em;transition:max-width .46s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms),margin-left .46s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms),opacity .3s ease calc(var(--k) * 70ms)}
.rail:hover .obj-n,.obj[aria-current="true"] .obj-n,.obj:focus-visible .obj-n{max-width:9em;margin-left:9px;opacity:1}
.obj[aria-current="true"],.obj:hover,.obj:focus-visible{color:var(--paper)}
:is(.obj,#orb-btn,.icon,.chat,.jump,.chip,.go,.pill,.doc,.back,.mv):focus-visible{outline:1px solid var(--ring);outline-offset:2px}

/* 몸: 대화 상대 목록 | 방 */
.body{display:grid;grid-template-columns:clamp(256px,22cqw,312px) minmax(0,1fr);min-height:0}

/* ── 왼쪽: 대화 상대 ── */
.list{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0;border-right:1px solid var(--hair);padding:2px 10px 14px max(10px,env(safe-area-inset-left,0px))}
.list-h{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 8px 12px}
.list-h h2{margin:0;font:500 12px/1 var(--sans);letter-spacing:.08em;color:var(--dim)}
.icon{appearance:none;width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:color .2s ease,background-color .2s ease}
.icon svg{width:14px;height:14px}
.icon:hover,.icon[aria-expanded="true"]{color:var(--paper);background:var(--lift)}
.add{display:flex;gap:8px;align-items:center;padding:2px 4px 12px 12px}
.add input{flex:1;min-width:0;height:34px;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);outline:0;padding:0 2px;font:400 14px/1 var(--sans);color:var(--paper)}
.add input:focus{border-bottom-color:var(--paper)}
.add input::placeholder{color:var(--faint)}
.chats{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:2px;min-height:0;padding-bottom:6px}
.chat{appearance:none;border:0;background:none;width:100%;margin:0;text-align:left;display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;row-gap:4px;align-items:center;padding:10px 10px 10px 8px;border-radius:14px;cursor:pointer;color:var(--paper);transition:background-color .2s ease}
.chat:hover,.chat.hot{background:rgba(243,241,236,.035)}
.chat[aria-current="true"]{background:var(--lift)}
.chat canvas{grid-row:1 / span 2;width:44px;height:44px;display:block}
.cn{min-width:0;font:600 15px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font:400 12px/1.25 var(--sans);color:var(--dim);white-space:nowrap;justify-self:end}
.cp{grid-column:2 / 4;min-width:0;font:400 13px/1.4 var(--sans);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat.alert .cp{color:var(--text)}
.chat.alert .cs{color:var(--paper);font-weight:500}
.flag{display:inline-block;margin-left:6px;font:700 14px/1 var(--sans);color:var(--paper);font-style:normal}
.flag.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.chat.lead{grid-template-columns:52px minmax(0,1fr) auto;padding:12px 10px 12px 6px}
.chat.lead canvas{width:52px;height:52px}
.chat.lead .cn small{font:500 12px/1 var(--sans);letter-spacing:.04em;color:var(--dim);margin-right:7px}
.group{margin:14px 12px 6px;font:500 12px/1 var(--sans);letter-spacing:.08em;color:var(--faint)}
.list-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 6px 0 12px;border-top:1px solid var(--hair);font:400 12px/1.4 var(--sans);color:var(--dim)}
.list-f b{font-weight:500;color:var(--text)}

/* ── 방: 사무실 무대와 대화 ── */
.room{display:grid;grid-template-columns:minmax(0,1fr) clamp(264px,21cqw,300px);min-height:0;min-width:0}
.center{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;height:clamp(220px,37cqh,350px)}
.cap{padding:clamp(16px,3.2cqh,34px) 12px 16px clamp(20px,3cqw,44px);display:flex;flex-direction:column;gap:14px;min-width:0}
.back{display:none;appearance:none;flex:none;width:36px;height:36px;margin:-4px 0 0 -8px;border:0;border-radius:50%;background:none;color:var(--paper);place-items:center;cursor:pointer}
.back svg{width:16px;height:16px}
.who{margin:0;font:300 clamp(28px,2.7cqw,40px)/1.1 var(--sans);letter-spacing:-.02em;min-width:0}
.who small{display:block;margin-bottom:10px;font:500 12px/1 var(--sans);letter-spacing:.08em;color:var(--dim)}
.state{margin:0;font:300 clamp(15px,1.3cqw,19px)/1.5 var(--sans);color:var(--paper);max-width:26em;text-wrap:pretty}
.state .then{display:block;color:var(--dim)}
.floor{position:relative;height:100%;aspect-ratio:1.72;max-width:calc((100cqw - clamp(256px,22cqw,312px) - clamp(264px,21cqw,300px)) * .55);min-height:0}
.floor canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.talk{display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;min-height:0;min-width:0}
.thread{overflow-y:auto;padding:24px clamp(20px,3cqw,44px) 10px;-webkit-mask-image:linear-gradient(transparent,#000 12px);mask-image:linear-gradient(transparent,#000 12px);scrollbar-width:thin;scrollbar-color:rgba(243,241,236,.16) transparent;user-select:text;-webkit-user-select:text;min-height:0}
.thread-in{max-width:720px;display:flex;flex-direction:column;gap:18px}

/* 대화의 낱개 */
.day{margin:6px 0 0;align-self:center;font:400 12px/1 var(--sans);letter-spacing:.04em;color:var(--faint)}
.newline{display:flex;align-items:center;gap:12px;font:500 12px/1 var(--sans);letter-spacing:.04em;color:var(--paper)}
.newline::before,.newline::after{content:"";flex:1;height:1px;background:var(--hair-strong)}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;align-items:start}
.msg .av{width:30px;height:30px;display:block}
.mc{min-width:0}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:5px 0 6px}
.mh b{font:600 14px/1.2 var(--sans);color:var(--paper)}
.mh .by{font:400 12px/1.2 var(--sans);color:var(--dim)}
.mh time{font:400 12px/1 var(--mono);color:var(--faint)}
.mb{margin:0;font:400 15px/1.65 var(--sans);color:var(--text);max-width:36em}
.src{margin:8px 0 0;font:400 12px/1.5 var(--sans);color:var(--dim);font-variant-numeric:tabular-nums}
.rest{margin:4px 0 0;font:400 13px/1.6 var(--sans);color:var(--dim);max-width:38em}
.mgo{margin:10px 0 0}
.me{align-self:flex-end;max-width:min(74%,480px);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.me p{margin:0;padding:10px 16px;border-radius:18px 18px 6px 18px;background:var(--bubble);font:400 15px/1.55 var(--sans);color:var(--paper)}
.me time{font:400 11px/1 var(--mono);color:var(--faint)}
.act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:400 13px/1.45 var(--sans);color:var(--dim);padding-left:42px}
.act svg{width:14px;height:14px;flex:none;color:var(--faint)}
.act q{color:var(--text);quotes:"「" "」"}
.act time{font:400 12px/1 var(--mono);color:var(--faint)}
.act.warn{color:var(--text)}
.jump{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;margin:0;padding:0 0 2px;font:400 13px/1.2 var(--sans);color:var(--text);cursor:pointer;white-space:nowrap;transition:color .2s ease,border-color .2s ease}
.jump:hover{color:var(--paper);border-bottom-color:var(--paper)}
/* 승인 물음: 이 순간 손님이 할 일 하나라 꽉 찬 알약이 여기에만 있다 */
.askbox{margin-top:2px;padding:16px 18px 18px;border:1px solid rgba(243,241,236,.34);border-radius:16px;max-width:30em;display:grid;gap:6px;justify-items:start}
.askbox .q{margin:0;font:500 16px/1.5 var(--sans);color:var(--paper)}
.askbox .note{margin:0;font:400 13px/1.55 var(--sans);color:var(--dim)}
.pill{appearance:none;height:38px;margin:10px 0 0;padding:0 20px;border-radius:999px;border:1px solid var(--paper);background:var(--paper);color:var(--void);font:600 14px/1 var(--sans);cursor:pointer}
.pill:hover{background:#FFFFFF}
.verb{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:10px 0 0;font:400 12px/1.5 var(--sans);color:var(--faint)}
.verb .jump{font-size:12px}
.long .mb{margin-top:8px}
.shot{display:block;margin:12px 0 0;width:min(340px,100%);border-radius:8px;overflow:hidden;background:#FFFFFF;box-shadow:0 14px 30px -12px rgba(0,0,0,.9)}
.shot .bar{display:block;padding:6px 10px;background:#EEECE8;font:400 10px/1 var(--mono);color:#77746E}
.shot .site{display:block;padding:16px 18px 18px;color:#151514}
.shot .logo{display:block;font:600 11px/1 var(--sans);letter-spacing:.06em}
.shot .h{display:block;margin:18px 0 8px;font:600 21px/1.25 var(--serif)}
.shot .s{display:block;margin:0 0 14px;font:400 11px/1.45 var(--sans);color:#5D5B57}
.shot .btn{display:inline-block;padding:8px 13px;border-radius:999px;background:#151514;color:#FFFFFF;font:500 11px/1 var(--sans)}
.shot.phone{width:180px}
.shot.phone .h{font-size:17px}
.shotcap{margin:6px 0 0;font:400 12px/1.4 var(--sans);color:var(--faint)}
.ways{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ways li{position:relative;padding-left:14px;font:400 12px/1.5 var(--sans);color:var(--text)}
.ways li::before{content:"";position:absolute;left:0;top:.75em;width:7px;height:1px;background:var(--faint)}
.resolved{margin:6px 0 0;font:400 13px/1.5 var(--sans);color:var(--dim)}
/* 손님의 문서: 흰 종이 한 장. 누르면 그 자리에서 펼쳐진다 */
.doc{appearance:none;border:0;margin:12px 0 0;display:block;width:min(330px,100%);padding:15px 17px 13px;text-align:left;background:var(--sheet);color:var(--sheet-ink);border-radius:3px;box-shadow:0 14px 30px -12px rgba(0,0,0,.9);cursor:pointer;font:inherit}
.doc .fn{display:block;margin-bottom:10px;font:400 11px/1 var(--mono);color:var(--sheet-dim)}
.doc .dh{display:block;margin-bottom:7px;font:600 15px/1.45 var(--serif);color:var(--sheet-ink)}
.doc .dl{display:block;font:400 13px/1.65 var(--serif);color:var(--sheet-body)}
.doc .dmore{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.doc .dmore > span{min-height:0;overflow:hidden}
.doc[aria-expanded="true"] .dmore{grid-template-rows:1fr}
.doc .dfoot{display:block;margin-top:10px;padding-top:9px;border-top:1px dashed #DDDAD3;font:500 12px/1 var(--sans);color:var(--sheet-dim)}
.doc:hover .dfoot{color:var(--sheet-ink)}
/* 일하는 중: 그 직원과 걸린 시간 */
.typing{display:flex;align-items:center;gap:10px;font:400 13px/1.4 var(--sans);color:var(--dim)}
.typing canvas{width:30px;height:30px;flex:none;display:block}
.typing b{font-weight:600;color:var(--text)}
.typing time{font:400 12px/1 var(--mono);color:var(--faint)}
.fresh{animation:rise .36s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* 부서 없는 일: 솔리오 밖에서 연 세션 */
.out{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--hair)}
.out .av{width:30px;height:30px;display:block}
.out b{font:600 14px/1.3 var(--sans);color:var(--paper)}
.out .by{display:block;margin-top:4px;font:400 12px/1.4 var(--sans);color:var(--dim)}
.out .doing{display:block;margin-top:2px;font:400 13px/1.5 var(--sans);color:var(--text)}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lobby-note{margin:0;font:400 14px/1.65 var(--sans);color:var(--dim);max-width:34em}

/* 맡길 일 고르기와 적는 칸 */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px clamp(20px,3cqw,44px) 0;max-width:calc(720px + 2 * clamp(20px,3cqw,44px))}
.chip,.mv{appearance:none;height:32px;margin:0;padding:0 14px;border-radius:999px;border:1px solid var(--hair-strong);background:none;color:var(--text);font:400 13px/1 var(--sans);cursor:pointer;white-space:nowrap;transition:border-color .2s ease,color .2s ease}
.chip:hover,.mv:hover{border-color:rgba(243,241,236,.55);color:var(--paper)}
.compose{margin:10px clamp(20px,3cqw,44px) 16px;max-width:720px;display:flex;align-items:flex-end;gap:10px;padding:7px 7px 7px 16px;border:1px solid var(--hair-strong);border-radius:22px;background:var(--pit);transition:border-color .2s ease}
.compose:focus-within{border-color:rgba(243,241,236,.46)}
.compose textarea{flex:1;min-width:0;height:38px;max-height:140px;resize:none;border:0;outline:0;background:none;padding:8px 0;font:400 15px/1.45 var(--sans);color:var(--paper);user-select:text;-webkit-user-select:text}
.compose textarea::placeholder{color:var(--faint)}
.go{appearance:none;flex:none;height:38px;margin:0;padding:0 18px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);font:500 14px/1 var(--sans);color:var(--paper);cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.go:hover{border-color:var(--paper)}
.compose.ready .go{background:var(--paper);border-color:var(--paper);color:var(--void)}
.closed{margin:12px clamp(20px,3cqw,44px) 18px;max-width:720px;font:400 13px/1.55 var(--sans);color:var(--dim)}

/* ── 오른쪽: 이 부서 ── */
.side{border-left:1px solid var(--hair);overflow-y:auto;scrollbar-width:none;padding:clamp(18px,3.2cqh,34px) 20px 28px;display:flex;flex-direction:column;gap:28px;min-width:0;min-height:0}
.sec h3{margin:0 0 8px;font:500 12px/1 var(--sans);letter-spacing:.08em;color:var(--faint)}
.nrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--hair)}
.sec h3 + .nrow{border-top:0}
.nrow canvas{width:26px;height:26px;display:block}
.nrow b{font:600 13px/1.35 var(--sans);color:var(--paper)}
.nrow .tool{font:400 12px/1.35 var(--sans);color:var(--dim);margin-left:6px}
.nrow .doing{display:block;margin-top:3px;font:400 12px/1.5 var(--sans);color:var(--dim)}
.nrow.asked .doing,.nrow.silent .doing{color:var(--paper)}
.nrow .jump{margin-top:7px;font-size:12px}
.nrow time{padding-top:2px;font:400 12px/1.3 var(--mono);color:var(--faint);white-space:nowrap}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;margin:0;padding:8px 0;border:0;border-top:1px solid var(--hair);background:none;text-align:left;font:inherit;color:inherit}
button.frow{cursor:pointer}
button.frow span{text-decoration:underline;text-decoration-color:rgba(243,241,236,.34);text-underline-offset:4px}
button.frow:hover span{color:var(--paper);text-decoration-color:var(--paper)}
.sec h3 + .frow{border-top:0}
.frow span{min-width:0;font:400 12px/1.4 var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{flex:none;font:400 12px/1.4 var(--sans);color:var(--faint)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--hair)}
.sec h3 + .trow{border-top:0}
.trow b{font:500 13px/1.35 var(--sans);color:var(--paper)}
.trow small{font:400 12px/1.35 var(--sans);color:var(--dim);text-align:right}
.trow span{grid-column:1 / -1;font:400 12px/1.5 var(--sans);color:var(--dim)}
.sec p{margin:0;font:400 13px/1.6 var(--sans);color:var(--dim)}
.cfg{margin:12px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font:400 12px/1.5 var(--sans)}
.cfg dt{color:var(--faint)}
.cfg dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
/* 좁은 창에서 오른쪽 칸 대신 대화 끝에 서는 「지금」 */
.nowbox{display:none;padding:2px 0 0 42px}
.nowbox h3{margin:0 0 2px;font:500 12px/1 var(--sans);letter-spacing:.08em;color:var(--faint)}
.nowbox h3 + .nrow{border-top:0}

/* 창이 좁아지면: 오른쪽 칸을 접고 「지금」을 대화 끝에 둔다 */
@container app (max-width:1180px){
  .room{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .floor{max-width:calc((100cqw - clamp(256px,22cqw,312px)) * .62)}
  .nowbox{display:block}
}
@container app (max-width:900px){
  .who{font-size:28px}
  .state{font-size:16px}
}
/* 휴대폰 너비: 목록과 방을 번갈아 본다 */
@container app (max-width:760px){
  .body{grid-template-columns:minmax(0,1fr)}
  .room{display:none}
  #app.in-room .list{display:none}
  #app.in-room .room{display:grid}
  .list{border-right:0;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:clamp(230px,38cqh,290px)}
  .floor{height:auto;width:100%;aspect-ratio:auto;max-width:none}
  .cap{flex-direction:row;align-items:flex-start;gap:10px;padding:10px 16px 0}
  .back{display:grid}
  .who{font-size:24px}
  .who small{margin-bottom:6px}
  .state{margin-top:8px;font-size:14px}
  .cap-t{min-width:0}
  .thread{padding-left:16px;padding-right:16px}
  .chips{padding-left:16px;padding-right:16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .compose{margin-left:16px;margin-right:16px}
  .act,.nowbox{padding-left:0}
  .me{max-width:86%}
}
@container app (max-height:560px){
  .stage{height:180px}
}

/* 직원의 공식 창(모형). 솔리오가 그 직원 세션의 이름표로 열어, 하던 대화가 위에 그대로 있다 */
.win{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px;background:rgba(0,0,0,.62)}
.win-box{width:min(720px,100%);height:min(560px,100%);display:grid;grid-template-rows:auto auto 1fr auto;background:var(--pit);border:1px solid var(--hair-strong);border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.9);overflow:hidden}
.win-head{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--hair)}
.win-head b{font:600 13px/1.3 var(--sans);color:var(--text)}
.win-tag{font:400 11px/1 var(--mono);color:var(--dim);padding:4px 8px;border:1px solid var(--hair-strong);border-radius:999px}
.win-x{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:6px;background:none;color:var(--dim);cursor:pointer}
.win-x:hover{background:var(--lift);color:var(--text)}
.win-x svg{width:12px;height:12px}
.win-cmd{margin:0;padding:12px 16px 2px;font:400 12px/1.5 var(--mono);color:var(--faint);overflow-wrap:anywhere}
.win-log{overflow:auto;padding:6px 16px 16px;font:400 13px/1.62 var(--mono);color:var(--text)}
.win-log p{margin:0 0 4px;overflow-wrap:anywhere}
.win-log .u{margin-top:14px;color:var(--dim)}
.win-log .u::before{content:'› '}
.win-log .u i{font-style:normal;color:var(--faint);margin-right:8px}
.win-log .wait{color:var(--faint)}
.win-in{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--hair)}
.win-in:focus-within{box-shadow:inset 0 1px 0 var(--ring)}
.win-in>span{font:400 14px/1 var(--mono);color:var(--dim)}
.win-in input{flex:1;min-width:0;padding:4px 0;border:0;background:none;color:var(--text);font:400 13px/1.5 var(--mono);outline:none}
.win-in input::placeholder{color:var(--faint)}

/* 시안 조작 막대. 디자인의 일부가 아니다 */
#meta{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:9;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--meta-bg);border:1px solid var(--hair);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;transition:opacity .4s ease}
#meta.away{opacity:0;pointer-events:none}
#meta button{appearance:none;border:0;background:none;color:rgba(243,241,236,.7);font:400 12px/1 var(--sans);padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
#meta button:hover,#meta button:focus-visible{color:var(--paper);background:rgba(243,241,236,.08);outline:none}
@media (prefers-reduced-motion:reduce){
  .obj-n,.doc .dmore{transition:none !important}
  .flag.pop,.fresh{animation:none}
}

  's-minji':{text:'11월 블로그 글 초안을 다 썼습니다. 제목 후보 셋을 맨 위에 적었습니다.', doc:{fn:'블로그_11월.md', h:'아침을 거르는 직장인에게', p:['제목 후보: 아침 5분, 그래놀라 한 그릇', '바쁜 아침에도 거르지 않는 방법을 셋으로 나눴습니다.'], more:['본문 1,240자 · 사진 자리 셋', '맺음: 정기배송 첫 달 할인 안내']}},
  's-doyun':{text:'지난주 인스타그램 반응을 표로 정리했습니다.', doc:{fn:'반응_46주.csv', h:'46주 인스타그램 반응', p:['저장 288 · 「포장하는 손」', '댓글 41 · 「아침 5분 레시피」']}},
  's-haram':{text:'결제 화면의 시험을 모두 통과했습니다. 도우미 둘이 나눠 돌렸습니다.', src:'시험 42개 · 21분'},
  's-jian':{text:'용역 계약서 7조를 다 읽었습니다. 손해배상 상한을 받은 돈의 한 배로 적었습니다.'},
  's-max':{text:'로그인 오류의 원인을 찾았습니다. auth.ts 한 곳을 고치면 됩니다.'},
  's-wiles':{text:'회의록 요약을 끝냈습니다.'},
};
function ping() {
  const c = staff.filter(s => s.status === 'working' && s.zone !== sel && s.zone !== 'lobby' && !typing[s.zone]);
  const s = c[0]; if (!s) return;
  const f = FIN[s.id] || {text:'맡은 일을 끝냈습니다.'};
  Object.assign(s, {status:'done', act:'일을 끝냄', t0:Date.now(), news:true, subagents:0});
  push(s.zone, said(s.id, f.text, hhmm(), f));
  refresh();
}
function addDept(name) {
  const n = String(name || '').trim().slice(0, 8); if (!n) return;
  const key = 'd' + (++deptSeq);
  DEPTS.push({key, name:n, role:'역할을 아직 적지 않았습니다. 처음 맡긴 일로 직원이 부서 폴더를 읽습니다.', dir:'문서\\' + n, tool:'Claude Code', chips:[]});
  threads[key] = []; push(key, {t:'act', icon:'ok', text:`${을를(n)} 만들었습니다. 일을 맡기면 첫 직원이 빈 자리에 앉습니다`, at:hhmm()});
  select(key);
}

/* 「창에서 이어 말하기」: 솔리오는 직원 세션을 띄울 때 받은 이름표로 그 직원의 공식 창을 연다. 처음부터가 아니라 하던 대화가 위에 그대로 있고, 입력칸이 바로 아래다.
   Claude는 부서 폴더에서 claude --resume <이름>, GPT는 codex resume <ID>로 연다. 창에서 나눈 말은 같은 세션 기록에 남으므로 이 대화에도 붙는다 */
const winEl = $('#win'), winLog = $('#win-log'), winMsg = $('#win-msg'), winX = $('#win-x');
let winSid = null, winBack = null;
const fakeId = s => {
  const k = s.id + s.name; let h = 2166136261, x = '';
  for (let i = 0; i < 32; i++) { h = Math.imul(h ^ k.charCodeAt(i % k.length) ^ i, 16777619) >>> 0; x += (h >>> 7 & 15).toString(16); }
  return `019a${x.slice(4, 8)}-${x.slice(8, 12)}-7${x.slice(13, 16)}-${x.slice(16, 20)}-${x.slice(20, 32)}`;
};
/* 그 직원 세션에 오간 말: 직원에게 보낸 말(유호님이 적은 것, 솔리오가 전한 것)과 직원의 답 */
function winTurns(s) {
  const out = []; let ask = null;
  for (const m of threads[s.zone] || []) {
    if (m.t === 'me') ask = {text:m.text};
    else if (m.t === 'staff' && m.sid === s.id) { out.push({u:m.prompt ? {text:m.prompt, relay:m.relay} : ask, a:[m.text, ...(m.long || [])]}); ask = null; }
    else if (m.t === 'staff') ask = null;
  }
  return out;
}
function renderWin(s) {
  const d = deptOf(s.zone) || {};
  $('#win-title').textContent = `${d.name || ''} · ${s.name}`;
  $('#win-tag').textContent = `${brand(s)} 공식 창`;
  $('#win-cmd').textContent = `${d.dir || ''}> ` + (s.tool === 'Codex' ? `codex resume ${fakeId(s)}` : `claude --resume "${d.name || ''} ${s.name}"`);
  winLog.innerHTML = winTurns(s).map(t => (t.u ? `<p class="u">${t.u.relay ? '<i>솔리오가 전함</i>' : ''}${esc(t.u.text)}</p>` : '') + t.a.map(p => `<p>${esc(p)}</p>`).join('')).join('');
  winLog.scrollTop = winLog.scrollHeight;
}
function openWin(s) {
  winSid = s.id; winBack = document.activeElement;
  renderWin(s); winEl.hidden = false; winMsg.value = ''; winMsg.focus();
  winLog.scrollTop = winLog.scrollHeight;
}
function closeWin() {
  if (!winSid) return;
  winEl.hidden = true; winSid = null;
  if (winBack && winBack.isConnected) winBack.focus(); else msgEl.focus();
}
$('#win-form').addEventListener('submit', e => {
  e.preventDefault();
  const s = byId(winSid), text = winMsg.value.trim(); if (!s || !text) return;
  winMsg.value = '';
  push(s.zone, {t:'me', text, at:hhmm(), via:'창에서'});
  winLog.insertAdjacentHTML('beforeend', `<p class="u">${esc(text)}</p><p class="wait">답하는 중</p>`); winLog.scrollTop = winLog.scrollHeight;
  refresh({toEnd:true});
  later(still ? 500 : 1600, () => {
    const reply = s.tool === 'Codex' ? '네, 앞에서 본 곳에 이어서 보겠습니다.' : s.zone === 'dev' ? '네, 앞에서 만든 홈페이지에 이어서 하겠습니다. 바꾼 뒤 휴대폰 너비 화면을 다시 찍어 두겠습니다.' : '네, 앞의 대화에 이어서 하겠습니다.';
    push(s.zone, said(s.id, reply, hhmm(), {prompt:text, verb:`${brand(s)} 창에서 나눈 말 그대로`, win:true}));
    winLog.querySelector('.wait')?.remove();
    if (winSid === s.id) { winLog.insertAdjacentHTML('beforeend', `<p>${esc(reply)}</p>`); winLog.scrollTop = winLog.scrollHeight; }
    refresh({toEnd:true});
  });
});
winEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeWin(); }
  else if (e.key === 'Tab') { const f = [winX, winMsg], i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
});
winEl.addEventListener('click', e => { if (e.target === winEl) closeWin(); });
winX.addEventListener('click', closeWin);

/* ── 손 ── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-chat],[data-go],[data-approve],[data-wake],[data-doc],[data-chip],[data-move],[data-open],[data-more],[data-win]');
  if (!t) return;
  if (t.dataset.chat) select(t.dataset.chat);
  else if (t.dataset.go) select(t.dataset.go);
  else if (t.dataset.approve) approve(t.dataset.approve);
  else if (t.dataset.wake) wake(t.dataset.wake);
  else if (t.dataset.chip) send(sel, t.dataset.chip);
  else if (t.dataset.more) {
    const m = (threads[sel] || []).find(x => String(x.id) === t.dataset.more); if (!m) return;
    m.more = !m.more; const box = t.closest('.mc')?.querySelector('.long'); if (box) box.hidden = !m.more; t.textContent = m.more ? '줄여 보기' : '전체 답 보기';
  }
  else if (t.dataset.win) { const s = byId(t.dataset.win); if (s) openWin(s); }
  else if (t.dataset.open) {
    const m = (threads[sel] || []).find(x => String(x.id) === t.dataset.open), card = threadEl.querySelector(`[data-doc="${t.dataset.open}"]`); if (!m || !card) return;
    m.open = true; card.setAttribute('aria-expanded', 'true'); card.querySelector('.dfoot').textContent = '접기';
    pin = null; card.scrollIntoView({block:'center', behavior:still ? 'auto' : 'smooth'}); card.focus({preventScroll:true});
  }
  else if (t.dataset.move) { const [sid, k] = t.dataset.move.split(':'); moveTo(sid, k); }
  else if (t.dataset.doc) {
    const m = Object.values(threads).flat().find(x => String(x.id) === t.dataset.doc); if (!m) return;
    m.open = !m.open; t.setAttribute('aria-expanded', m.open); t.querySelector('.dfoot').textContent = m.open ? '접기' : '펼쳐 보기';
  }
});
chatsEl.addEventListener('pointerover', e => { const b = e.target.closest('.chat'); floor.setHot({zone:b && b.dataset.chat !== 'lead' ? b.dataset.chat : null}); });
chatsEl.addEventListener('pointerleave', () => floor.setHot(null));
$('#back').addEventListener('click', () => app.classList.remove('in-room'));
const fitMsg = () => { msgEl.style.height = 'auto'; msgEl.style.height = Math.min(140, Math.max(38, msgEl.scrollHeight)) + 'px'; composeEl.classList.toggle('ready', !!msgEl.value.trim()); };
msgEl.addEventListener('input', fitMsg);
msgEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); composeEl.requestSubmit(); } });
composeEl.addEventListener('submit', e => { e.preventDefault(); const v = msgEl.value; msgEl.value = ''; fitMsg(); send(sel, v); });
$('#add-btn').addEventListener('click', e => { const f = $('#add-form'), open = f.hidden; f.hidden = !open; e.currentTarget.setAttribute('aria-expanded', open); if (open) $('#add-name').focus(); });
$('#add-form').addEventListener('submit', e => { e.preventDefault(); const v = $('#add-name').value; $('#add-name').value = ''; $('#add-form').hidden = true; $('#add-btn').setAttribute('aria-expanded', 'false'); addDept(v); });

/* ── 시계: 걸린 시간과 깜빡임 ── */
function tick() {
  document.querySelectorAll('time[data-clock]').forEach(el => { const s = Math.max(0, Math.floor((Date.now() - +el.dataset.clock) / 1000)); el.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; });
  document.querySelectorAll('time[data-t0]').forEach(el => { const m = minsSince(+el.dataset.t0), st = el.dataset.st; el.textContent = st === 'working' || st === 'silent' ? (m < 1 ? '방금' : `${m}분째`) : st === 'asked' || st === 'done' ? (m < 1 ? '방금' : `${m}분 전`) : ''; });
}
setInterval(tick, 1000);
setInterval(() => { renderCap(); }, 20000);
/* 그려지지 않은 작은 구(감춰져 있다가 창이 넓어져 보이게 된 칸 등)는 다음 틈에 그린다 */
let sweepAt = 0;
function sweep() { document.querySelectorAll('canvas[data-av]').forEach(cv => { if (cv.clientWidth && cv.width !== Math.round(cv.clientWidth * Math.min(2, devicePixelRatio || 1))) paintAv(cv); }); }
new ResizeObserver(() => requestAnimationFrame(sweep)).observe(app);
function blinkLoop(now) {
  requestAnimationFrame(blinkLoop);
  paintMainOrb(now);
  if (now - sweepAt > 1500) { sweepAt = now; sweep(); }
  if (still) return;
  for (const s of staff) {
    const was = s.blink;
    if (s.blink > 0) s.blink = Math.max(0, s.blink - .14);
    else if (now > s.nextBlink && LOOK[s.status]?.mode === 'open') { s.blink = 1; s.nextBlink = now + 2400 + Math.random() * 5200; }
    if (s.blink !== was) document.querySelectorAll(`canvas[data-av="staff:${s.id}"],canvas[data-av="chat:${s.lead ? 'lead' : s.zone}"]`).forEach(paintAv);
  }
}

/* ── 시안 조작 막대 ── */
const meta = $('#meta'); let awayT = 0;
function wakeMeta() { meta.classList.remove('away'); clearTimeout(awayT); awayT = setTimeout(() => { if (!meta.matches(':hover') && !meta.contains(document.activeElement)) meta.classList.add('away'); }, 4000); }
addEventListener('pointermove', wakeMeta); addEventListener('keydown', wakeMeta); wakeMeta();
const CASES = [['ask', '승인 물음'], ['calm', '평소'], ['rest', '모두 쉼']];
let ci = 0;
function start(sc, k) {
  timers.forEach(clearTimeout); timers.clear();
  scene = sc; uid = 0; mid = 0; deptSeq = 0; typing = {}; newFrom = {}; paintedAt = {};
  DEPTS = DEPTS0.map(d => ({...d, chips:[...d.chips]}));
  MADE = Object.fromEntries(Object.entries(MADE0).map(([a, b]) => [a, b.map(x => [...x])]));
  staff = cast(sc); threads = seed(sc);
  tasks = sc === 'rest' ? [{dept:'cs', text:'견적 문의 답장', state:'끝냄'}, {dept:'mkt', text:'11월 블로그 글', state:'끝냄'}] : [{dept:'cs', text:'견적 문의 답장', state:'끝냄'}, {dept:'mkt', text:'11월 블로그 글', state:'일하는 중'}];
  seen = {}; for (const key in threads) seen[key] = threads[key].length;
  // 처음 여는 순간 아직 안 본 것: 팀장의 오늘 말과 회계부의 결과
  if (sc !== 'rest') seen.lead = threads.lead.length - 1;
  if (sc !== 'rest') seen.acc = threads.acc.length - 1;
  $('#m-case').textContent = '상황 · ' + CASES[ci][1];
  floorKey = '';
  select(k || 'lead');
}
$('#m-case').onclick = () => { ci = (ci + 1) % CASES.length; start(CASES[ci][0], sel === 'lobby' && CASES[ci][0] === 'rest' ? 'lead' : (deptOf(sel) || sel === 'lead' ? sel : 'lead')); };
$('#m-ping').onclick = ping;
$('#m-again').onclick = () => { ci = 0; start('ask', 'lead'); };
$('#m-hat').onclick = e => { hatsOn = !hatsOn; e.currentTarget.textContent = '모자 · ' + (hatsOn ? '씀' : '벗음'); refresh(); };
const SIZES = [['꽉 참'], ['1280×800', 1280, 800], ['1024×720', 1024, 720], ['420×760', 420, 760]];
let si = 0;
function setSize(i) { si = i; const z = SIZES[i]; document.body.classList.toggle('sized', !!z[1]); app.style.setProperty('--aw', z[1] ? z[1] + 'px' : '100%'); app.style.setProperty('--ah', z[1] ? z[2] + 'px' : '100%'); $('#m-size').textContent = '창 크기 · ' + z[0]; }
$('#m-size').onclick = () => setSize((si + 1) % SIZES.length);

/* 주소 끝으로 바로 연다(화면 확인용): #mkt · #law · #dev · #acc · #cs · #plan · #lobby, #calm · #rest, #w1280 · #w1024 · #w420, #nohat, #list(좁은 창에서 목록) */
const H = location.hash.slice(1).split(/[-,&]/);
if (H.includes('calm')) ci = 1; if (H.includes('rest')) ci = 2;
if (H.includes('nohat')) { hatsOn = false; $('#m-hat').textContent = '모자 · 벗음'; }
const sz = H.map(x => SIZES.findIndex(z => z[1] && 'w' + z[1] === x)).find(i => i > 0); if (sz) setSize(sz);
const first = H.find(x => ['lead', 'lobby', ...DEPTS0.map(d => d.key)].includes(x));
start(CASES[ci][0], first || 'lead');
if (H.includes('list')) app.classList.remove('in-room');
floor.show(true);
requestAnimationFrame(blinkLoop);
if (document.fonts?.ready) document.fonts.ready.then(() => { paintAll(document); floor.redraw(); });
</script>
</body>

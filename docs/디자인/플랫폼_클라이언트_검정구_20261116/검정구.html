<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>검정 구 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}

/* 짜임: 창 전체가 무대이고 물건은 구 하나다. 글은 구가 비켜 준 자리에만 놓는다. 스크롤과 메뉴는 없다. */
:root{
  color-scheme:dark;
  --void:#000000;                       /* 바탕. 구의 안쪽이기도 하다 */
  --paper:#F3F1EC;                      /* 글. 구에 닿는 빛과 같은 온도의 흰색 */
  --dim:rgba(243,241,236,.46);          /* 둘째 줄, 덜 급한 것 */
  --hair:rgba(243,241,236,.10);         /* 1px 선 */
  --hair-strong:rgba(243,241,236,.20);
  --ring:rgba(243,241,236,.55);         /* 자판 초점 */
  --pit:#0C0C0B;                         /* 단추와 입력 칸의 바닥. 뒤의 결이 비치지 않게 막는다 */
  --meta-bg:rgba(10,10,10,.84);         /* 시안 조작 막대(디자인의 일부가 아니다) */
  /* 한글과 영문이 한 문장에 섞이므로 한 서체(SUIT)로 통일한다 */
  --sans:'SUIT Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:300 clamp(25px,min(3.5vw,5.6vh),54px)/1.3 var(--sans);
  --choice:300 clamp(22px,2.3vw,34px)/1.2 var(--sans);
  --body:400 16px/1.25 var(--sans);
  --small:400 13px/1.3 var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#stage{position:relative;height:100%;min-height:420px;overflow:hidden;background:var(--void);user-select:none;-webkit-user-select:none;cursor:default}
#orb{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 제목 줄 없는 창에서 맨 위 40px를 잡고 창을 옮긴다(브라우저에서는 아무 일도 없다) */
#stage::before{content:"";position:absolute;left:0;right:0;top:0;height:40px;z-index:1;pointer-events:none;-webkit-app-region:drag}
.here,#meta{-webkit-app-region:no-drag}

/* 구만 있는 첫 화면에서는 어디를 눌러도 넘어간다 */
#wake{position:absolute;inset:0;display:none;background:none;border:0;padding:0;cursor:pointer}
#stage[data-boot="1"] #wake{display:block}
#wake:focus-visible{outline:none}

.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage[data-ui="ask"] #ask,#stage[data-ui="app"] #app,#stage[data-ui="switch"] #switch{opacity:1;visibility:visible;transition:opacity .9s ease .05s,visibility 0s}
.rise{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
#stage[data-ui="ask"] #ask .rise,#stage[data-ui="app"] #app .rise,#stage[data-ui="switch"] #switch .rise{
  opacity:var(--o,1);transform:none;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*95ms + 140ms)}
/* 다 떠오른 뒤에는 손에 바로 반응한다 */
#stage.settled .layer .rise{transition:opacity .3s ease,transform .3s ease;transition-delay:0s}
/* 화면 확인용: 움직임 없이 끝 모습으로 선다 */
#stage.still,#stage.still *{transition:none !important}

/* 로그인 방식을 묻는 자리 */
.ask-in{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:min(520px,100% - 32px);display:flex;flex-direction:column;align-items:center}
.mark{width:46px;height:auto;fill:var(--paper);margin-bottom:clamp(26px,4.6vh,44px);--o:.92}
.ask-ways{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;transition:opacity .35s ease}
/* 누르는 것은 누르는 것처럼 보이게: 먼저 권하는 길은 채우고, 다른 길은 선으로 둔다 */
.way{appearance:none;flex:1 1 220px;max-width:254px;height:54px;margin:0;padding:0 22px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:500 16px/1 var(--sans);letter-spacing:0;color:var(--paper);cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.way svg{width:18px;height:18px;flex:none}
.way:hover{border-color:var(--paper);background:#1A1A19}
.way-main{background:var(--paper);border-color:var(--paper);color:var(--void)}
.way-main:hover{background:#FFFFFF;border-color:#FFFFFF}
.way:focus-visible,.sw:focus-visible,#orb-btn:focus-visible,.reread:focus-visible{outline:1px solid var(--ring);outline-offset:5px}
.invite{margin-top:clamp(26px,4.8vh,46px);width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.invite label{font:400 14px/1.3 var(--sans);color:rgba(243,241,236,.78)}
.invite input{width:min(320px,88%);height:46px;background:var(--pit);border:1px solid rgba(243,241,236,.24);border-radius:999px;outline:0;padding:0 20px;
  font:400 15px/1 var(--sans);letter-spacing:.02em;text-align:center;color:var(--paper);user-select:text;-webkit-user-select:text;transition:border-color .3s ease}
.invite input::placeholder{color:rgba(243,241,236,.4)}
.invite input:hover{border-color:rgba(243,241,236,.55)}
.invite input:focus{border-color:var(--paper)}
/* 기다리는 동안에는 고를 것을 치우고 한 줄만 남긴다 */
.status{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;font:400 15px/1.5 var(--sans);color:rgba(243,241,236,.72);text-align:center;opacity:0;pointer-events:none;transition:opacity .5s ease}
#stage[data-wait="1"] .ask-ways,#stage[data-wait="1"] #ask .invite{opacity:0;--o:0;pointer-events:none;transition:opacity .35s ease;transition-delay:0s}
#stage[data-wait="1"] .status{opacity:1;transition-delay:.25s}

/* 들어온 뒤. 왼쪽 위의 구가 이 앱의 하나뿐인 조작 자리다 */
/* 구의 왼쪽 끝을 본문의 왼쪽 줄에 맞춘다(구 반지름 11px, 단추 44px) */
.here{position:absolute;z-index:2;left:calc(clamp(20px,9.5vw,168px) - 9px);top:clamp(12px,3.4vh,38px);display:flex;align-items:center;gap:6px}
#orb-btn{width:44px;height:44px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer}
#orb-btn:focus-visible{outline-offset:1px}
#here-name{font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.66)}
.room{position:absolute;left:clamp(20px,9.5vw,168px);right:clamp(20px,9.5vw,168px);top:52%;transform:translateY(-50%);display:none}
#stage[data-space="solio"] .room[data-room="solio"],#stage[data-space="workspace"] .room[data-room="workspace"],#stage[data-space="pulse"] .room[data-room="pulse"]{display:block}
.say{margin:0;font:var(--display);letter-spacing:-.018em;max-width:21em;text-wrap:balance}
.say .then{display:block;color:var(--dim)}
.rows{margin-top:clamp(34px,8vh,84px);display:grid}
.row{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 6.2em minmax(190px,auto);align-items:center;column-gap:clamp(16px,2.4vw,36px);
  padding:17px 0;border-top:1px solid var(--hair);color:var(--dim)}
.row:last-child{border-bottom:1px solid var(--hair)}
.row.now,.row:hover{color:var(--paper)}
.row{transition:color .25s ease}
.read{margin:16px 0 0;display:flex;align-items:center;gap:14px;font:var(--small);color:var(--dim)}
.reread{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.4);padding:0 0 2px;font:var(--small);color:var(--paper);cursor:pointer;border-radius:0}
.reread:hover{border-bottom-color:var(--paper)}
.rows.again .gauge i{animation:fill .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fill{from{width:0}}
.nm{font:var(--body)}
.gauge{position:relative;height:1px;background:rgba(243,241,236,.15)}
.gauge i{position:absolute;left:0;top:0;height:1px;width:var(--v);background:rgba(243,241,236,.82)}
.row.now .gauge i{background:var(--paper)}
.gauge i::after{content:"";position:absolute;right:0;top:-4px;width:1px;height:9px;background:inherit}
.val{font:var(--body);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.when{font:var(--small);font-variant-numeric:tabular-nums;text-align:right;color:var(--dim);white-space:nowrap}

/* 구를 누르면 갈 수 있는 곳이 이름으로만 뜬다 */
/* 셋 다 갈 수 있는 곳이라 밝기를 같게 둔다. 지금 있는 곳과 가리킨 곳은 구가 그 위로 가서 알린다 */
.sw-names{position:absolute;left:16px;right:16px;top:55%;display:flex;flex-wrap:wrap;justify-content:center;gap:18px clamp(8px,2.4vw,36px)}
.sw{appearance:none;background:none;border:0;margin:0;padding:10px 12px;width:min(248px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--paper);--o:.86;cursor:pointer;border-radius:2px}
.sw-n{font:400 clamp(17px,1.5vw,22px)/1.2 var(--sans);letter-spacing:.2em;margin-right:-.2em;padding-bottom:9px;border-bottom:1px solid transparent;transition:border-color .3s ease}
.sw-d{font:400 14px/1.4 var(--sans);color:var(--dim)}
.sw-now{display:none;font:400 12px/1 var(--sans);color:var(--paper)}
.sw[aria-current="true"] .sw-n{border-bottom-color:var(--paper)}
.sw[aria-current="true"] .sw-now{display:block}
.sw[aria-current="true"],.sw:hover,.sw:focus-visible{--o:1}

/* 시안 조작 막대 */
#meta{position:absolute;z-index:5;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;padding:6px 14px;
  background:var(--meta-bg);border:1px solid rgba(243,241,236,.12);border-radius:18px;font:400 12px/1 var(--sans);color:rgba(243,241,236,.62);transition:opacity .5s ease}
#meta.idle{opacity:0;pointer-events:none}
#meta .tag{letter-spacing:.04em;color:rgba(243,241,236,.38);padding-right:2px}
#meta .grp{display:flex;align-items:center;gap:2px}
#meta button{appearance:none;background:none;border:0;border-radius:999px;padding:7px 9px;cursor:pointer;white-space:nowrap}
#meta button:hover{color:var(--paper)}
#meta button[aria-pressed="true"]{color:var(--paper);background:rgba(243,241,236,.11)}
#meta button:focus-visible{outline:1px solid var(--ring);outline-offset:1px}

@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:10px;padding:14px 0}
  .sw-names{top:50%}
  .gauge{grid-column:1 / -1;grid-row:2}
  .when{grid-column:1 / -1;grid-row:3;text-align:left}
  .room{top:clamp(84px,13vh,128px);transform:none}
  .rows{margin-top:28px}
  #meta{gap:2px 6px;padding:5px 10px;font-size:11px}
  #meta .tag{display:none}
  #meta button{padding:6px 7px}
}
@media (max-height:620px) and (min-width:641px){
  .room{top:47%}
  .rows{margin-top:22px}
  .row{padding:10px 0}
  #meta{bottom:8px;padding:3px 12px}
}
@media (prefers-reduced-motion:reduce){
  .layer,.rise,.way,.sw,#meta{transition-duration:.01s !important;transition-delay:0s !important}
}
</style>
</head>
<body>
<div id="stage" data-ui="none" data-space="solio">
  <canvas id="orb" aria-hidden="true"></canvas>
  <button id="wake" type="button" aria-label="시작하기"></button>

  <section id="ask" class="layer" aria-label="로그인 방법">
    <div class="ask-in">
      <svg class="mark rise" style="--i:0" viewBox="0 0 560 328" role="img" aria-label="싱ㅋ"><path d="M87 8h58v30c0 46 23 76 61 103l-34 43c-29-19-52-45-66-70-15 30-36 54-64 72L8 143c49-32 79-64 79-112Z"/><path d="M222 8h58v172h-58Z"/><path fill-rule="evenodd" d="M157 192c-76 0-124 24-124 65s48 65 124 65 124-24 124-65-48-65-124-65Zm0 45c42 0 67 8 67 20s-25 20-67 20-67-8-67-20 25-20 67-20Z"/><path d="M326 8h226L464 312h-61l40-138H322v-54h137l16-55H326Z"/></svg>
      <div class="ask-ways">
        <button class="way way-main rise" style="--i:1" type="button" data-way="google"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" d="M17.1 9.2c0-.6-.05-1.1-.17-1.64H9v3.18h4.65a4 4 0 0 1-1.88 2.78l2.86 2.21c1.71-1.58 2.47-3.9 2.47-6.53ZM9 17.4c2.28 0 4.2-.75 5.6-2.04l-2.86-2.21c-.76.53-1.78.9-2.74.9-2.1 0-3.88-1.41-4.52-3.36l-2.94 2.27A8.4 8.4 0 0 0 9 17.4ZM4.48 10.69a5.04 5.04 0 0 1 0-3.38L1.54 5.04a8.4 8.4 0 0 0 0 7.92l2.94-2.27ZM9 3.95c1.38 0 2.33.6 2.86 1.1l2.09-2.04A8.07 8.07 0 0 0 9 1.1a8.4 8.4 0 0 0-7.46 4.44l2.94 2.27C5.12 5.36 6.9 3.95 9 3.95Z"/></svg>Google로 계속</button>
        <button class="way rise" style="--i:2" type="button" data-way="email"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" d="M2.2 4.4h13.6v9.2H2.2zM2.6 4.8 9 10l6.4-5.2"/></svg>이메일로 계속</button>
      </div>
      <form id="invite" class="invite rise" style="--i:4" autocomplete="off" novalidate>
        <label for="code">초대받으셨다면</label>
        <input id="code" name="code" type="text" placeholder="여기에 코드를 붙여 넣으세요" spellcheck="false" autocapitalize="off" autocorrect="off" maxlength="200">
      </form>
      <p id="ask-status" class="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="app" class="layer" aria-label="앱">
    <div class="here">
      <button id="orb-btn" type="button" aria-label="다른 공간으로 가기"></button>
      <span id="here-name">SOLIO</span>
    </div>

    <div class="room" data-room="solio">
      <p class="say rise" style="--i:1">Codex가 내일 오후에 바닥납니다.<span class="then">Claude와 Gemini는 이번 주 내내 넉넉합니다.</span></p>
      <div class="rows" role="list" aria-label="구독별 남은 양">
        <div class="row rise" style="--i:3" role="listitem"><span class="nm">Claude</span><span class="gauge" aria-hidden="true"><i style="--v:64%"></i></span><span class="val">64% 남음</span><span class="when">목 09:00 초기화</span></div>
        <div class="row now rise" style="--i:4" role="listitem"><span class="nm">Codex</span><span class="gauge" aria-hidden="true"><i style="--v:12%"></i></span><span class="val">12% 남음</span><span class="when">토 14:00 초기화</span></div>
        <div class="row rise" style="--i:5" role="listitem"><span class="nm">Gemini</span><span class="gauge" aria-hidden="true"><i style="--v:88%"></i></span><span class="val">88% 남음</span><span class="when">일 00:00 초기화</span></div>
        <div class="row rise" style="--i:6" role="listitem"><span class="nm">Higgsfield</span><span class="gauge" aria-hidden="true"><i style="--v:41%"></i></span><span class="val">1,240 남음</span><span class="when">3,000 크레딧 중 · 12월 3일 결제</span></div>
      </div>
      <p class="read rise" style="--i:7"><span id="read-when">방금 읽은 값입니다.</span><button class="reread" id="reread" type="button">다시 읽기</button></p>
    </div>

    <div class="room" data-room="workspace">
      <p class="say rise" style="--i:1">Workspace<span class="then">바깥 창 없이 이 창 안에서 열립니다. 안쪽 화면은 다음 시안에서 짓습니다.</span></p>
    </div>
    <div class="room" data-room="pulse">
      <p class="say rise" style="--i:1">PULSE<span class="then">바깥 창 없이 이 창 안에서 열립니다. 안쪽 화면은 다음 시안에서 짓습니다.</span></p>
    </div>
  </section>

  <section id="switch" class="layer" aria-label="공간 고르기">
    <div class="sw-names">
      <button class="sw rise" style="--i:0" type="button" data-go="solio"><span class="sw-n">SOLIO</span><span class="sw-d">솔리오 · 혼자 하는 사업의 도구</span><span class="sw-now">지금 여기</span></button>
      <button class="sw rise" style="--i:1" type="button" data-go="workspace"><span class="sw-n">WORKSPACE</span><span class="sw-d">워크스페이스 · 팀이 함께 일하는 곳</span><span class="sw-now">지금 여기</span></button>
      <button class="sw rise" style="--i:2" type="button" data-go="pulse"><span class="sw-n">PULSE</span><span class="sw-d">펄스 · 고객과 함께 만드는 곳</span><span class="sw-now">지금 여기</span></button>
    </div>
  </section>

  <nav id="meta" aria-label="시안 조작">
    <span class="tag">시안</span>
    <div class="grp" role="group" aria-label="구의 모습">
      <button type="button" data-var="0" aria-pressed="true">구 가</button>
      <button type="button" data-var="1" aria-pressed="false">구 나</button>
      <button type="button" data-var="2" aria-pressed="false">구 다</button>
    </div>
    <div class="grp" role="group" aria-label="켜는 상황">
      <button type="button" data-mode="first" aria-pressed="true">처음 켤 때</button>
      <button type="button" data-mode="back" aria-pressed="false">다시 켤 때</button>
    </div>
    <button type="button" id="replay">처음부터</button>
    <button type="button" id="sound" aria-pressed="false">소리 꺼짐</button>
  </nav>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const stage = $('#stage'), canvas = $('#orb'), wake = $('#wake'), orbBtn = $('#orb-btn');
const layers = { ask: $('#ask'), app: $('#app'), switch: $('#switch') };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rad = d => d * Math.PI / 180, lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeIOQ = t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

let W = 1, H = 1, DPR = 1;
let variant = 0, mode = 'first', space = 'solio', ui = 'none';
let run = 0, tw = null, poseName = 'void', glintBoost = 0, glintWant = 0;
/* az와 lz는 빛이 오는 쪽(화면에서의 각도, 보는 쪽으로 기운 정도), ax는 구를 깎은 축이다 */
const S = { cx: 0, top: 0, r: 1, az: 0, lz: .5, lit: 0, focus: 0, ax: [.28, .52, .81] };
const ptr = { x: .5, y: .5 }, ptrS = { x: .5, y: .5 };
let swTarget = null;

/* ── 구가 서는 자리. top은 구의 맨 윗점, r은 반지름(화면 px) ── */
function poses() {

  const ax = [base[0] + (ptrS.x - .5) * .24 * free * still, base[1] - (ptrS.y - .5) * .2 * free * still, base[2]];
  const lit = S.lit * (1 + .03 * Math.sin(t * .9) * still);
  const gb = glintBoost * (1.2 + .8 * Math.sin(t * 3.1));
  if (still) frameNo = (frameNo + 1) % 64;
  if (gl) {
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform2f(U.uC, cx * DPR, (H - cy) * DPR);
    gl.uniform1f(U.uR, S.r * DPR); gl.uniform1f(U.uLit, lit); gl.uniform1f(U.uAz, az); gl.uniform1f(U.uLz, S.lz); gl.uniform1f(U.uFocus, S.focus);
    gl.uniform1f(U.uVar, variant); gl.uniform1f(U.uGb, gb); gl.uniform1f(U.uDpr, DPR); gl.uniform1f(U.uSeed, frameNo);
    gl.uniform3f(U.uAxis, ax[0], ax[1], ax[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else if (ctx2d) {
    const c = ctx2d; c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    c.beginPath(); c.arc(cx, cy, S.r, 0, Math.PI * 2); c.fillStyle = '#030303'; c.fill();
    c.lineWidth = 1.4; c.strokeStyle = 'rgba(243,241,236,' + (.6 * S.lit).toFixed(3) + ')'; c.beginPath(); c.arc(cx, cy, S.r, -az - 1.1, -az + 1.1); c.stroke();
  }
}
function frame(now) { stepTween(now); draw(now); requestAnimationFrame(frame); }

if (!initGL()) ctx2d = canvas.getContext('2d');
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => { initGL(); resize(); });
new ResizeObserver(resize).observe(stage);
resize(); setVariant(0); setMode('first'); applySpace(); wakeMeta();
requestAnimationFrame(frame);
boot();

/* 화면 확인용. 움직임을 기다리지 않고 한 장면에 바로 선다 */
window.__orb = {
  at(scene, opt = {}) {
    ++run; skip = null;
    if (opt.variant !== undefined) setVariant(opt.variant);
    if (opt.space) { space = opt.space; applySpace(); }
    const map = { void: ['void', 'none'], rest: ['rest', 'rest'], ask: ['ask', 'ask'], app: ['home', 'app'], switch: ['sw', 'switch'] }[scene];
    stage.classList.add('still'); resize();
    swTarget = null; snap(map[0]); setUI(map[1]); if (opt.wait) { askWait(opt.wait); glintBoost = 1; }
    if (opt.point) { swTarget = $('.sw[data-go="' + opt.point + '"]'); snap('sw'); }
    draw(performance.now()); return { ...S, W, H };
  },
  /* 두 자리 사이의 한순간(t는 0~1)을 그린다 */
  mid(from, to, t, opt = {}) {
    ++run; skip = null; if (opt.variant !== undefined) setVariant(opt.variant);
    stage.classList.add('still'); resize(); setUI('none');
    const a = poses()[from], b = poses()[to], e = (opt.ease || easeIO)(t);
    tw = null; poseName = to;
    S.cx = lerp(a.cx, b.cx, e); S.top = lerp(a.top, b.top, e); S.r = Math.exp(lerp(Math.log(a.r), Math.log(b.r), e));
    S.az = lerp(a.az, b.az, e); S.focus = lerp(a.focus, b.focus, e);
    if (b.lz !== undefined) S.lz = lerp(a.lz, b.lz, e);
    if (b.ax) S.ax = [lerp(a.ax[0], b.ax[0], e), lerp(a.ax[1], b.ax[1], e), lerp(a.ax[2], b.ax[2], e)];
    S.lit = opt.lit !== undefined ? opt.lit : lerp(a.lit, b.lit, e);
    draw(performance.now()); return { ...S };
  },
  draw: () => draw(performance.now()), state: () => ({ ui, space, variant, mode, poseName, moving: !!tw, wait: stage.dataset.wait || '', ...S }),
  /* 화면이 가려져 프레임이 멈춘 곳에서도 흐름이 끝까지 가게 민다 */
  pump() { stage.classList.remove('still'); return setInterval(() => { const now = performance.now(); stepTween(now); draw(now); }, 16); },
};
})();
</script>
</body>

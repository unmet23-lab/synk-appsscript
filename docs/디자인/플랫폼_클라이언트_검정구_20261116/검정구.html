<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>검정 구 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;font-display:swap;src:url(../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2-variations');}

/* 짜임: 창 전체가 무대이고 물건은 구 하나다. 글은 구가 비켜 준 자리에만 놓는다. 스크롤과 메뉴는 없다. */
:root{
  color-scheme:dark;
  --void:#000000;                       /* 바탕. 구의 안쪽이기도 하다 */
  --paper:#F3F1EC;                      /* 글. 구에 닿는 빛과 같은 온도의 흰색 */
  --dim:rgba(243,241,236,.46);          /* 둘째 줄, 덜 급한 것 */
  --hair:rgba(243,241,236,.10);         /* 1px 선 */
  --hair-strong:rgba(243,241,236,.20);
  --ring:rgba(243,241,236,.55);         /* 자판 초점 */
  --pit:#0C0C0B;                         /* 단추와 입력 칸의 바닥. 뒤의 결이 비치지 않게 막는다 */
  --meta-bg:rgba(10,10,10,.84);         /* 시안 조작 막대(디자인의 일부가 아니다) */
  /* 한글과 영문이 한 문장에 섞이므로 한 서체(SUIT)로 통일한다 */
  --sans:'SUIT Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:300 clamp(25px,min(3.5cqw,5.6cqh),54px)/1.3 var(--sans);
  --choice:300 clamp(22px,2.3cqw,34px)/1.2 var(--sans);
  --body:400 16px/1.25 var(--sans);
  --small:400 13px/1.3 var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 무대가 곧 창이다. 안의 것은 창이 아니라 무대의 크기를 보고 놓인다(무대를 줄이면 그 크기에 맞춰진다) */
#stage{position:relative;height:100%;min-height:420px;overflow:hidden;background:var(--void);user-select:none;-webkit-user-select:none;cursor:default;container-type:size;container-name:stage}
#orb{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 점으로 된 synk 표가 뜨는 자리. 구 안으로 들어온 순간에만 그린다 */
#sig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;pointer-events:none}
/* 제목 줄 없는 창에서 맨 위 40px를 잡고 창을 옮긴다(브라우저에서는 아무 일도 없다) */
#stage::before{content:"";position:absolute;left:0;right:0;top:0;height:40px;z-index:1;pointer-events:none;-webkit-app-region:drag}
.here,.back,#meta{-webkit-app-region:no-drag}

/* 구만 있는 첫 화면에서는 어디를 눌러도 넘어간다 */
#wake{position:absolute;inset:0;display:none;background:none;border:0;padding:0;cursor:pointer}
#stage[data-boot="1"] #wake{display:block}
#wake:focus-visible{outline:none}

.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage[data-ui="ask"] #ask,#stage[data-ui="app"] #app,#stage[data-ui="switch"] #switch,#stage[data-ui="forge"] #forge{opacity:1;visibility:visible;transition:opacity .9s ease .05s,visibility 0s}
.rise{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
#stage[data-ui="ask"] #ask .rise,#stage[data-ui="app"] #app .rise,#stage[data-ui="switch"] #switch .rise,#stage[data-ui="forge"] #forge .rise{
  opacity:var(--o,1);transform:none;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*95ms + 140ms)}
/* 다 떠오른 뒤에는 손에 바로 반응한다 */
#stage.settled .layer .rise{transition:opacity .3s ease,transform .3s ease;transition-delay:0s}
/* 새 판을 받거나 처음 설치하는 동안. 구가 가운데에서 새로 깎이고, 그 아래에 한 문장과 판 번호만 둔다 */
.forge-in{position:absolute;left:16px;right:16px;top:var(--forge-top,70%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.forge-say{margin:0;font:300 clamp(19px,2.2cqw,29px)/1.36 var(--sans);letter-spacing:-.012em}
.forge-say .then{display:block;color:var(--dim)}
.forge-ver{font:400 12px/1 var(--sans);letter-spacing:.22em;margin-right:-.22em;color:rgba(243,241,236,.6);font-variant-numeric:tabular-nums}
#forge-go{display:none;flex:none;width:220px;margin-top:6px}
#stage[data-forge="ready"] #forge-go{display:inline-flex}
.forge-acts{margin:2px 0 0;display:none;gap:26px}
#stage[data-forge="failed"] .forge-acts{display:flex}
/* 웅장한 판: 구가 창을 채우므로 글은 왼쪽 아래에 작품 설명처럼 둔다. 깎는 날이 가운데를 가로질러 내려와 가운데 글과 겹치기 때문이다 */
#stage[data-grand] .forge-in{left:clamp(20px,9.5cqw,168px);right:auto;top:auto;bottom:clamp(84px,13cqh,128px);align-items:flex-start;text-align:left;isolation:isolate} /* 큰 구의 결과 깎는 선이 글 뒤를 지나가도 글이 읽히게, 글 뒤만 부드럽게 어둡힌다 */ #stage[data-grand] .forge-in::before{content:"";position:absolute;inset:-70px -160px -90px -210px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(0,0,0,.84),rgba(0,0,0,.58) 54%,rgba(0,0,0,0))}
/* 화면 확인용: 움직임 없이 끝 모습으로 선다 */
#stage.still,#stage.still *{transition:none !important}

/* 로그인 방식을 묻는 자리 */
.ask-in{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:min(520px,100% - 32px);display:flex;flex-direction:column;align-items:center}
.mark{width:58px;height:auto;fill:var(--paper);margin-bottom:clamp(26px,4.6cqh,44px);--o:.92}
.ask-ways{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;transition:opacity .35s ease}
/* 누르는 것은 누르는 것처럼 보이게: 먼저 권하는 길은 채우고, 다른 길은 선으로 둔다 */
.way{appearance:none;flex:1 1 220px;max-width:254px;height:54px;margin:0;padding:0 22px;border:1px solid rgba(243,241,236,.42);border-radius:999px;background:var(--pit);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:500 16px/1 var(--sans);letter-spacing:0;color:var(--paper);cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.way svg{width:18px;height:18px;flex:none}
.way:hover{border-color:var(--paper);background:#1A1A19}
.way-main{background:var(--paper);border-color:var(--paper);color:var(--void)}
.way-main:hover{background:#FFFFFF;border-color:#FFFFFF}
.way:focus-visible,.sw:focus-visible,.back:focus-visible,#orb-btn:focus-visible,.reread:focus-visible{outline:1px solid var(--ring);outline-offset:5px}
.invite{margin-top:clamp(26px,4.8cqh,46px);width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.invite label{font:400 14px/1.3 var(--sans);color:rgba(243,241,236,.78)}
/* 글을 넣는 칸은 누르는 단추와 모양을 달리한다: 테두리 없이 밑줄 한 줄 */
.invite input{width:min(300px,88%);height:42px;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;outline:0;padding:0 6px;
  font:400 15px/1 var(--sans);letter-spacing:.02em;text-align:center;color:var(--paper);user-select:text;-webkit-user-select:text;transition:border-color .3s ease}
.invite input::placeholder{color:rgba(243,241,236,.46)}
.invite input:hover{border-bottom-color:rgba(243,241,236,.6)}
.invite input:focus{border-bottom-color:var(--paper)}
/* 기다리는 동안에는 고를 것을 치우고 한 줄만 남긴다 */
.status{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .5s ease}
.status p{margin:0;font:400 15px/1.5 var(--sans);color:rgba(243,241,236,.72);text-align:center}
/* 조용한 글 단추. 기다릴 때는 취소, 오류에서는 다시 시도 하나만 보인다 */
.quiet{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;margin:0;padding:0 0 4px;font:var(--small);color:rgba(243,241,236,.8);cursor:pointer;transition:color .25s ease,border-color .25s ease}
.quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
.quiet:focus-visible{outline:1px solid var(--ring);outline-offset:5px}
.status .quiet{display:none}
#stage[data-wait="1"] #ask-cancel,#stage[data-wait="error"] #ask-retry{display:inline-block}
.signup{margin-top:20px}
/* 가입을 누른 뒤의 한 줄. 가입은 브라우저에서 하고 이 창은 그대로 있다 */
.ask-note{margin:14px 0 0;min-height:1.5em;font:var(--small);color:rgba(243,241,236,.72);text-align:center;transition:opacity .35s ease}
.ask-note:empty{opacity:0}
#stage[data-wait] .ask-note{opacity:0}
#stage[data-wait] .ask-ways,#stage[data-wait] #signup,#stage[data-wait] #ask .invite{opacity:0;--o:0;pointer-events:none;transition:opacity .35s ease;transition-delay:0s}
#stage[data-wait] .status{opacity:1;pointer-events:auto;transition-delay:.25s}

/* 들어온 뒤. 왼쪽 위의 구가 이 앱의 하나뿐인 조작 자리다 */
/* 구의 왼쪽 끝을 본문의 왼쪽 줄에 맞춘다(구 반지름 11px, 단추 44px) */
.here{position:absolute;z-index:2;left:calc(clamp(20px,9.5cqw,168px) - 9px);top:clamp(12px,3.4cqh,38px);display:flex;align-items:center;gap:6px}
#orb-btn{width:44px;height:44px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer}
#orb-btn:focus-visible{outline-offset:1px}
/* 이름도 누르는 자리다. 작은 꺾쇠로 열린다는 것을 알린다 */
#here-name{appearance:none;background:none;border:0;margin:0;padding:10px 8px 10px 0;display:inline-flex;align-items:center;gap:9px;font:400 12px/1 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7);cursor:pointer;border-radius:2px;transition:color .25s ease,opacity .2s ease}
#here-name svg{width:8px;height:5px;flex:none;opacity:.7}
.here:hover #here-name,#here-name:focus-visible{color:var(--paper)}
#here-name:focus-visible{outline:1px solid var(--ring);outline-offset:2px}
/* 이 공간의 프로그램: 구 옆에 놓인 작은 오브제. 다가가면 이름이 차례로 펼쳐진다 */
.rail{display:flex;align-items:center;gap:2px;margin-left:18px;transition:opacity .25s ease}
#stage:not([data-space="solio"]) .rail{display:none}
.obj{appearance:none;background:none;border:0;margin:0;padding:10px 8px;display:inline-flex;align-items:center;color:rgba(243,241,236,.46);cursor:pointer;border-radius:2px;transition:color .25s ease}
.obj svg{width:18px;height:18px;flex:none}
.obj-n{display:inline-flex;align-items:baseline;gap:7px;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;font:400 13px/1.3 var(--sans);letter-spacing:.03em;transition:max-width .46s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms),margin-left .46s cubic-bezier(.2,.8,.2,1) calc(var(--k) * 70ms),opacity .3s ease calc(var(--k) * 70ms)}
.obj-n small{font:var(--small);color:var(--dim)}
.rail.near .obj-n,.obj[aria-current="true"] .obj-n,.obj:focus-visible .obj-n{max-width:9em;margin-left:9px;opacity:1}
.obj[aria-current="true"],.obj:hover,.obj:focus-visible{color:var(--paper)}
.obj:focus-visible{outline:1px solid var(--ring);outline-offset:1px}
/* 구 곁의 펼침: 갈 수 있는 공간이 구 옆으로 차례로 나온다 */
.fan{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:1px;visibility:hidden;pointer-events:none;transition:visibility 0s linear .2s;
  /* 창보다 길면 안에서 내린다. 왼쪽에서 들어오는 글과 초점 고리가 잘리지 않게 안쪽 여백을 두고 그만큼 당겨 놓는다 */
  overflow-y:auto;scrollbar-width:none;padding:3px 4px 3px 18px;margin:-3px 0 0 -18px}
.fan > *{flex:none}
#stage[data-fan] .fan{visibility:visible;pointer-events:auto;transition:visibility 0s}
.fan-go{appearance:none;background:none;border:0;margin:0;padding:8px 14px 8px 0;display:flex;align-items:baseline;gap:18px;color:var(--paper);cursor:pointer;text-align:left;border-radius:2px;opacity:0;transform:translateX(-16px);transition:opacity .16s ease,transform .16s ease}
.fan-foot{margin:12px 0 0;display:flex;gap:22px;opacity:0;transform:translateX(-16px);transition:opacity .16s ease,transform .16s ease}
#stage[data-fan] .fan-go,#stage[data-fan] .fan-foot{opacity:1;transform:none;transition:opacity .34s ease calc(110ms + var(--k) * 60ms),transform .5s cubic-bezier(.2,.8,.2,1) calc(110ms + var(--k) * 60ms)}
.fan-n{position:relative;min-width:8.6em;font:400 13px/1.3 var(--sans);letter-spacing:.2em;color:rgba(243,241,236,.7);transition:color .2s ease}
.fan-d,.fan-now{font:var(--small);color:var(--dim);transition:color .2s ease}
.fan-now{display:none}
.fan-go[aria-current="true"] .fan-d{display:none}
.fan-go[aria-current="true"] .fan-now{display:inline}
.fan-go[aria-current="true"] .fan-n{color:var(--paper)}
.fan-go:hover .fan-n,.fan-go:focus-visible .fan-n,.fan-go.hot .fan-n{color:var(--paper)}
.fan-go:hover .fan-d,.fan-go:focus-visible .fan-d,.fan-go.hot .fan-d{color:rgba(243,241,236,.84)}
.fan-go:focus-visible{outline:1px solid var(--ring);outline-offset:2px}
.fan-foot .quiet{border-bottom-color:transparent;color:rgba(243,241,236,.62)}
.fan-foot .quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
#stage[data-fan] #here-name,#stage[data-fan] .rail{opacity:0;pointer-events:none}
/* 펼친 동안 방은 흐리고 눌리지 않는다. 눌러서 연 펼침을 바깥을 눌러 닫을 때, 그 자리에 있던 흐린 줄이나 단추가 같이 눌리지 않게 한다 */
#stage[data-fan] .room{opacity:.14;pointer-events:none}
/* 방은 위에서부터 놓는다. 줄이 펼쳐져 길어져도 손 밑의 줄이 움직이지 않는다 */
.room{position:absolute;left:clamp(20px,9.5cqw,168px);right:clamp(20px,9.5cqw,168px);top:clamp(92px,21cqh,196px);max-height:calc(100% - clamp(92px,21cqh,196px) - 70px);overflow-y:auto;scrollbar-width:none;display:none;padding-bottom:34px;transition:opacity .3s ease;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
/* 방을 내리면 위쪽도 흐린다. 위쪽 끝에 걸린 줄의 글자가 반쯤 잘려 보이지 않게 한다. 맨 위에 있을 때는 아래쪽만 흐리다 */
.room.scrolled{-webkit-mask-image:linear-gradient(transparent,#000 30px,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(transparent,#000 30px,#000 calc(100% - 30px),transparent)}
#stage[data-space="solio"] .room[data-room="solio"],#stage[data-space="workspace"] .room[data-room="workspace"],#stage[data-space="pulse"] .room[data-room="pulse"]{display:block}
.say{margin:0;font:var(--display);letter-spacing:-.018em;max-width:21em;text-wrap:balance}
.say .then{display:block;color:var(--dim)}
/* 줄들은 한 격자의 열을 같이 쓴다. 한 줄의 글이 길어도 모든 줄의 열이 같이 움직인다 */
.rows{margin-top:clamp(34px,8cqh,84px);display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 6.2em minmax(190px,auto);column-gap:clamp(16px,2.4cqw,36px)}
.row{display:grid;grid-column:1 / -1;grid-template-columns:subgrid;align-items:center;padding:17px 0;border-top:1px solid var(--hair);color:var(--dim)}
.row:last-child{border-bottom:1px solid var(--hair)}
.row.now,button.row:hover{color:var(--paper)}
.row{transition:color .25s ease}
/* 줄의 안쪽: 다가가면 그 줄 아래로 차례로 펼쳐진다 */
.more{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;grid-template-rows:0fr;transition:grid-template-rows .46s cubic-bezier(.2,.8,.2,1)}
.more.open{grid-template-rows:1fr}
.more:last-child{border-bottom:1px solid var(--hair)}
.more-in{grid-column:1 / -1;display:grid;grid-template-columns:subgrid;align-content:start;min-height:0;overflow:hidden}
.more-in > *{grid-column:1 / -1;opacity:0;transform:translateY(-7px);transition:opacity .14s ease,transform .14s ease}
.more.open .more-in > *{opacity:1;transform:none;transition:opacity .34s ease calc(70ms + var(--j) * 50ms),transform .46s cubic-bezier(.2,.8,.2,1) calc(70ms + var(--j) * 50ms)}
.more-in .row{border:0;padding:8px 0}
.more-say{margin:0;padding:0 0 10px;font:var(--body);color:rgba(243,241,236,.84)}
.row.sub .nm{color:var(--dim)}
.row.sub.now .nm{color:var(--paper)}
.more-note{margin:0;padding:0 0 18px;min-height:0;font:var(--small);color:var(--dim)}
button.row.opened{color:var(--paper)}
button.row.opened .gauge i{background:var(--paper)}
.read{margin:16px 0 0;display:flex;align-items:center;justify-content:space-between;gap:14px;font:var(--small);color:var(--dim)}
.reread{appearance:none;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.4);padding:0 0 4px;font:var(--small);color:var(--paper);cursor:pointer;border-radius:0}
.reread:hover{border-bottom-color:var(--paper)}
/* 구독 줄은 누르는 것이다. 누르면 그 구독의 안쪽으로 들어간다 */
button.row{appearance:none;background:none;border:0;border-top:1px solid var(--hair);border-radius:0;margin:0;width:100%;text-align:left;font:inherit;cursor:pointer}
button.row:last-child{border-bottom:1px solid var(--hair)}
button.row:focus-visible{outline:1px solid var(--ring);outline-offset:-1px}
/* 글이나 그림이 가운데를 차지하는 줄(백업, 지난 7일, 요금) */
.row-plain > :nth-child(2){grid-column:2 / 4}
.row-plain > :last-child{grid-column:4;justify-self:end}
.rows-more{margin-top:clamp(18px,3.2cqh,30px)}
.note{font:var(--body);color:var(--dim);transition:color .3s ease}
.note.ok{color:var(--paper)}
.nm small{display:block;margin-top:5px;font:var(--small);color:var(--dim)}
/* 지난 7일: 하루 사용량을 가는 세로선 일곱 개로 보인다. 오늘만 밝다 */
.week{display:flex;align-items:flex-end;gap:9px;height:24px}
.week i{display:block;width:2px;height:var(--h);min-height:1px;background:rgba(243,241,236,.38)}
.week i.today{background:var(--paper)}
.up{display:inline-block;margin-bottom:clamp(16px,3cqh,30px)}
.up + .up{margin-left:22px}
.acts{display:flex;gap:22px}
/* 안쪽으로 들어가면 첫 화면이 물러나고 같은 짜임(한 문장과 줄)의 방이 뜬다 */
#stage[data-space="solio"][data-prog="backup"] .room[data-room="solio"]{display:none}
#stage[data-space="solio"][data-prog="backup"] .room[data-room="solio-backup"]{display:block}
#stage[data-space="solio"][data-prog="visits"] .room[data-room="solio"]{display:none}
#stage[data-space="solio"][data-prog="visits"] .room[data-room="solio-visits"]{display:block}
/* 방문자 분석: 줄의 가운데 칸은 선이 아니라 풀어 쓴 숫자다. 아직 재지 못한 줄은 흐리게 둔다 */
.rows.vis{grid-template-columns:minmax(118px,172px) minmax(0,1fr) 6.2em minmax(150px,auto)}
.mid{min-width:0;font:var(--small);color:var(--dim);transition:color .25s ease}
.row.now .mid,button.row:hover .mid,button.row.opened .mid{color:rgba(243,241,236,.84)}
.row.unread .val{color:var(--dim)}
.more-in .row .mid{color:var(--dim)}
/* 솔리오 안쪽의 나머지(요금, 모델별 토큰, 계정 관리, 내 계정, 설정). 짜임은 같다: 한 문장과 줄, 다가가면 그 자리에서 펼쳐진다 */
/* 종류가 다른 줄 사이에는 틈을 둔다(구독 줄 아래의 요금과 모델별 토큰) */
.row.gap{margin-top:clamp(14px,2.6cqh,26px)}
.more:has(+ .row.gap){border-bottom:1px solid var(--hair)}
/* 안쪽에서 할 수 있는 일은 조용한 글 단추 한 줄이다. 고르는 것은 지금 것만 밝다 */
.more-acts{margin:0;padding:6px 0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.more-acts .lab{font:var(--small);color:var(--dim)}
.more-acts .quiet[aria-pressed="false"]{border-bottom-color:transparent;color:var(--dim)}
.more-acts .quiet[aria-pressed="true"],.quiet[aria-checked="true"],.quiet.warn{color:var(--paper);border-bottom-color:var(--paper)}
.quiet[aria-checked="false"]{color:var(--dim)}
.quiet:disabled{opacity:.42;cursor:default}
/* 물음과 답: 물음을 누르면 답이 바로 아래에 나온다 */
.more-acts.qa{padding:5px 0}
/* 되돌릴 수 없는 일(지우기)은 같은 줄의 다른 단추와 떨어져 오른쪽 끝에 선다 */
.more-acts .far{margin-left:auto}
/* 줄 안쪽 사실 줄의 기한과 값은 찾아보는 값이라 설명보다 밝게 둔다 */
.row.sub .when,.row.sub .val{color:rgba(243,241,236,.8)}
.more-acts.qa + .more-note{padding:2px 0 12px;max-width:46em}
.more-in .row .quiet{white-space:nowrap}
/* 글을 넣는 칸은 로그인 화면의 초대코드 칸과 같이 밑줄 한 줄이다 */
.fld{display:grid;grid-column:1 / -1;grid-template-columns:subgrid;align-items:center;padding:5px 0}
.fld label{font:var(--body);color:var(--dim)}
.fld input{width:min(280px,100%);height:34px;background:none;border:0;border-bottom:1px solid rgba(243,241,236,.34);border-radius:0;outline:0;padding:0 2px;font:400 15px/1 var(--sans);color:var(--paper);user-select:text;-webkit-user-select:text;transition:border-color .3s ease}
.fld input:hover{border-bottom-color:rgba(243,241,236,.6)}
.fld input:focus{border-bottom-color:var(--paper)}
.fld .hint{grid-column:3 / -1;justify-self:end;text-align:right;font:var(--small);color:var(--dim)}
/* 안쪽의 묶음: 눌렀을 때만 나오는 칸들(요금 고치기, 계정 더하기의 단계) */
.grp{display:grid;grid-column:1 / -1;grid-template-columns:subgrid;align-content:start}
.grp > *{grid-column:1 / -1}
.grp[hidden]{display:none}
.grp > .more-acts{padding-top:10px}
/* 다시 지은 줄은 펼쳐지는 움직임 없이 열린 채로 선다 */
.more.snap,.more.snap .more-in > *{transition:none !important}
#stage[data-aside][data-space] .room[data-room]{display:none}
#stage[data-aside="account"][data-space] .room[data-room="account"],#stage[data-aside="settings"][data-space] .room[data-room="settings"],#stage[data-aside="manage"][data-space] .room[data-room="manage"]{display:block}
.room.enter > *{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.room.enter > :nth-child(2){animation-delay:.05s}
.room.enter > :nth-child(3){animation-delay:.1s}
.room.enter > :nth-child(4){animation-delay:.15s}
.room.enter > :nth-child(5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#stage.still .room.enter > *{animation:none}
/* 구를 눌러 여는 화면의 아래: 계정, 설정, 로그아웃 */
.sw-foot{position:absolute;left:16px;right:16px;bottom:clamp(58px,9cqh,92px);margin:0;display:flex;justify-content:center;gap:28px}
.sw-foot .quiet{border-bottom-color:transparent;color:rgba(243,241,236,.62)}
.sw-foot .quiet:hover{color:var(--paper);border-bottom-color:var(--paper)}
.rows.again .gauge i{animation:fill .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fill{from{width:0}}
.nm{font:var(--body)}
.gauge{position:relative;height:1px;background:rgba(243,241,236,.15)}
/* 급한 줄만 밝다. 넉넉한 줄의 긴 선이 급한 줄의 짧은 선보다 튀지 않게 한다 */
.gauge i{position:absolute;left:0;top:0;height:1px;width:var(--v);background:rgba(243,241,236,.38);transition:background-color .25s ease}
.row.now .gauge i,button.row:hover .gauge i{background:var(--paper)}
.gauge i::after{content:"";position:absolute;right:0;top:-4px;width:1px;height:9px;background:inherit}
.val{font:var(--body);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.when{font:var(--small);font-variant-numeric:tabular-nums;text-align:right;color:var(--dim);white-space:nowrap}

/* 구를 누르면 구가 가운데로 와서 지도가 된다. 별 하나가 공간 하나다.
   이름은 구 아래에 가만히 있고, 이름을 가리키면 그 공간의 별이 밝아진다 */
/* 이름 셋은 밝기가 같다. 지금 있는 곳은 이름 앞의 점(구 위의 별과 같은 것)과 「지금 여기」로 알린다 */
.sw-names{position:absolute;left:16px;right:16px;top:66%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px clamp(8px,2.4cqw,36px)}
.sw{appearance:none;background:none;border:0;margin:0;padding:10px 12px;width:min(248px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;color:var(--paper);cursor:pointer;border-radius:2px}
.sw-n{position:relative;font:400 clamp(17px,1.5cqw,22px)/1.2 var(--sans);letter-spacing:.2em;margin-right:-.2em;padding-bottom:8px}
/* 밑줄은 글자 폭에 맞춘다(마지막 글자 뒤의 자간만큼은 긋지 않는다) */
.sw-n::after{content:"";position:absolute;left:0;right:.2em;bottom:0;height:1px;background:var(--paper);opacity:0;transition:opacity .3s ease}
.sw-d,.sw-now{font:400 14px/1.4 var(--sans);color:var(--dim);transition:color .3s ease}
.sw-now{display:none}
.sw[aria-current="true"] .sw-n::before{content:"";position:absolute;left:-18px;top:calc((100% - 8px) / 2 - 3px);width:6px;height:6px;border-radius:50%;background:var(--paper)}
.sw[aria-current="true"] .sw-d{display:none}
.sw[aria-current="true"] .sw-now{display:block}
.sw:hover .sw-n::after,.sw:focus-visible .sw-n::after,.sw.hot .sw-n::after{opacity:1}
.sw:hover .sw-d,.sw:focus-visible .sw-d,.sw.hot .sw-d{color:rgba(243,241,236,.84)}
/* 구가 떠난 왼쪽 위 자리에 돌아가는 길을 둔다 */
.back{appearance:none;position:absolute;left:clamp(20px,9.5cqw,168px);top:calc(clamp(12px,3.4cqh,38px) + 9px);height:26px;margin:0;padding:0;background:none;border:0;border-radius:2px;
  display:inline-flex;align-items:center;gap:10px;font:400 13px/1 var(--sans);color:rgba(243,241,236,.7);cursor:pointer;transition:color .25s ease}
.back kbd{font:400 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
@media (hover:none){.back kbd{display:none}}
@container stage (max-width:640px){.back kbd{display:none}}
.back:hover{color:var(--paper)}

/* 시안 조작 막대 */
#meta{position:fixed;z-index:5;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;padding:6px 14px;
  background:var(--meta-bg);border:1px solid rgba(243,241,236,.12);border-radius:18px;font:400 12px/1 var(--sans);color:rgba(243,241,236,.62);transition:opacity .5s ease}
#meta.idle{opacity:0;pointer-events:none}
#meta .tag{letter-spacing:.04em;color:rgba(243,241,236,.38);padding-right:2px}
#meta .grp{display:flex;align-items:center;gap:2px}
#meta button{appearance:none;background:none;border:0;border-radius:999px;padding:7px 9px;cursor:pointer;white-space:nowrap}
#meta button:hover{color:var(--paper)}
#meta button[aria-pressed="true"]{color:var(--paper);background:rgba(243,241,236,.11)}
#meta button:focus-visible{outline:1px solid var(--ring);outline-offset:1px}

/* 가운데 폭의 창(641~900px)에서는 이름 칸과 오른쪽 칸을 줄여 설명 칸에 자리를 준다. 그대로 두면 설명이 120px 남짓에 갇혀 서너 줄로 꺾인다 */
@container stage (min-width:641px) and (max-width:900px){
  .rows.vis{grid-template-columns:minmax(96px,128px) minmax(0,1fr) 6.2em minmax(96px,auto)}
}
@container stage (max-width:640px){
  .rows{grid-template-columns:minmax(0,1fr)}
  /* 방문자 분석의 줄도 좁은 창에서는 한 칸으로 쌓는다. 이 줄이 없으면 네 칸이 남아 큰 숫자가 창 밖으로 밀린다 */
  .rows.vis{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:10px;padding:14px 0}
  .gauge{grid-column:1 / -1;grid-row:2}
  .when{grid-column:1 / -1;grid-row:3;text-align:left}
  .mid{grid-column:1 / -1;grid-row:2}
  .row-plain > :nth-child(2){grid-column:1 / -1;grid-row:2}
  .row-plain > :last-child{grid-column:2;grid-row:1}
  /* 글을 넣는 칸도 좁은 창에서는 이름 아래로 내려온다 */
  .fld{grid-template-columns:minmax(0,1fr);row-gap:2px;padding:8px 0}
  .fld .hint{grid-column:1;justify-self:start;text-align:left}
  /* 좁은 창에서는 줄이 다 들어가지 않으므로 방 안에서 스크롤한다 */
  .room{top:clamp(84px,13cqh,128px);max-height:none;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:calc(clamp(20px,9.5cqw,168px) - 6px);right:calc(clamp(20px,9.5cqw,168px) - 6px);padding:0 6px 36px;overflow-y:auto;scrollbar-width:none}
  .rows{margin-top:28px}
  .sw-foot{bottom:calc(84px + env(safe-area-inset-bottom,0px))} /* 좁은 창에서는 시안 막대가 두 줄이라 그 위로 올린다 */
  /* 좁은 창에서는 자란 구와 이름이 본문 위에 놓이므로 본문을 더 가라앉힌다 */
  #stage[data-fan] .room{opacity:.05}
}
/* 시안 막대가 한 줄에 다 들어가지 않는 폭에서는 한 줄로 두고 옆으로 민다(단추가 늘어도 높이가 그대로다) */
@media (max-width:1100px){
  #meta{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;width:auto;left:16px;right:16px;border-radius:14px}
  #meta .grp,#meta button{flex:none}
}
@media (max-width:640px){
  #meta{gap:2px 6px;padding:5px 10px;font-size:11px}
  #meta .tag{display:none}
  #meta button{padding:6px 7px}
}
@container stage (max-height:620px) and (min-width:641px){
  .room{top:16cqh;max-height:calc(100% - 16cqh - 56px)}
  .rows{margin-top:22px}
  .row{padding:10px 0}
  .rows-more{margin-top:8px}
  .up{margin-bottom:10px}
}
@media (max-height:620px) and (min-width:641px){
  #meta{bottom:8px;padding:3px 12px}
}
/* 아주 작은 창: 구와 한 문장만 남는다 */
@container stage (max-height:340px){
  .rail,.rows,.read,.up,#here-name{display:none}
  .here{left:12px;top:8px}
  .room{left:24px;right:24px;top:62px;bottom:14px;max-height:none;padding:0 0 34px}
  .say{font-size:clamp(17px,5.4cqw,22px);line-height:1.36}
}
/* 창 크기를 바꿔 보는 시안: 무대를 창처럼 줄였다 늘린다 */
body.sized{background:#0d0d0d}
body.sized #stage{position:absolute;left:50%;top:calc(50% - 28px);transform:translate(-50%,-50%);width:var(--sw);height:var(--sh);min-height:0;border-radius:10px;box-shadow:0 0 0 1px rgba(243,241,236,.17),0 30px 90px rgba(0,0,0,.7);transition:width .85s cubic-bezier(.3,.7,.2,1),height .85s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){
  .layer,.rise,.way,.sw,.fan-go,.fan-foot,.more,#meta{transition-duration:.01s !important;transition-delay:0s !important}
  .room.enter > *{animation:none}
}
</style>
</head>
<body>
<div id="stage" data-ui="none" data-space="solio" data-prog="subs">
  <canvas id="orb" aria-hidden="true"></canvas>
  <canvas id="sig" aria-hidden="true"></canvas>
  <button id="wake" type="button" aria-label="시작하기"></button>

  <section id="ask" class="layer" aria-label="로그인 방법">
    <div class="ask-in">
      <svg class="mark rise" style="--i:0" viewBox="0 0 560 328" role="img" aria-label="싱ㅋ"><path d="M87 8h58v30c0 46 23 76 61 103l-34 43c-29-19-52-45-66-70-15 30-36 54-64 72L8 143c49-32 79-64 79-112Z"/><path d="M222 8h58v172h-58Z"/><path fill-rule="evenodd" d="M157 192c-76 0-124 24-124 65s48 65 124 65 124-24 124-65-48-65-124-65Zm0 45c42 0 67 8 67 20s-25 20-67 20-67-8-67-20 25-20 67-20Z"/><path d="M326 8h226L464 312h-61l40-138H322v-54h137l16-55H326Z"/></svg>
      <div class="ask-ways">
        <button class="way way-main rise" style="--i:1" type="button" data-way="signin">로그인</button>
      </div>
      <button id="signup" class="quiet signup rise" style="--i:2" type="button">처음이라면 가입하기</button>
      <p class="ask-note" id="ask-note" role="status" aria-live="polite"></p>
      <form id="invite" class="invite rise" style="--i:4" autocomplete="off" novalidate>
        <label for="code">초대받으셨다면</label>
        <input id="code" name="code" type="text" placeholder="여기에 코드를 붙여 넣으세요" spellcheck="false" autocapitalize="off" autocorrect="off" maxlength="200">
      </form>
      <div class="status" role="status" aria-live="polite"><p id="ask-status"></p><button id="ask-cancel" class="quiet" type="button">취소</button><button id="ask-retry" class="quiet" type="button">다시 시도</button></div>
    </div>
  </section>

  <section id="app" class="layer" aria-label="앱">
    <div class="here">
      <button id="orb-btn" type="button" aria-label="다른 공간으로 가기"></button>
      <button id="here-name" type="button" aria-label="다른 공간으로 가기"><span id="here-text">SOLIO</span><svg viewBox="0 0 8 5" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" d="M1 1l3 3 3-3"/></svg></button>
      <nav class="rail" aria-label="이 공간의 프로그램">
        <button class="obj" type="button" data-prog="subs" aria-current="true" style="--k:0"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M10 10V3.4A6.6 6.6 0 0 1 16.6 10Z" fill="currentColor"/></svg><span class="obj-n">구독</span></button>
        <button class="obj" type="button" data-prog="backup" aria-current="false" style="--k:1"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="10" cy="10" r="2.9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg><span class="obj-n">백업<small>준비 중</small></span></button>
        <button class="obj" type="button" data-prog="visits" aria-current="false" style="--k:2"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="14.7" cy="5.3" r="1.9" fill="currentColor"/></svg><span class="obj-n">방문자 분석</span></button>
      </nav>
    </div>
    <div id="fan" class="fan" role="group" aria-label="갈 수 있는 공간과 계정">
      <button class="fan-go" type="button" data-go="solio" style="--k:0"><span class="fan-n">SOLIO</span><span class="fan-d">혼자 하는 사업의 도구</span><span class="fan-now">지금 여기</span></button>
      <button class="fan-go" type="button" data-go="workspace" style="--k:1"><span class="fan-n">WORKSPACE</span><span class="fan-d">팀이 함께 일하는 곳</span><span class="fan-now">지금 여기</span></button>
      <button class="fan-go" type="button" data-go="pulse" style="--k:2"><span class="fan-n">PULSE</span><span class="fan-d">고객과 함께 만드는 곳</span><span class="fan-now">지금 여기</span></button>
      <p class="fan-foot" style="--k:3"><button class="quiet" type="button" data-foot="account">계정</button><button class="quiet" type="button" data-foot="settings">설정</button><button class="quiet" type="button" data-foot="logout">로그아웃</button></p>
    </div>

    <div class="room" data-room="solio">
      <p class="say rise" style="--i:1">Codex가 내일 오후에 바닥납니다.<span class="then">Claude와 Gemini는 이번 주 내내 넉넉합니다.</span></p>
      <div class="rows" role="group" aria-label="구독별 남은 양">
        <button type="button" data-svc="claude" class="row rise" style="--i:3"><span class="nm">Claude</span><span class="gauge" aria-hidden="true"><i style="--v:64%"></i></span><span class="val">64% 남음</span><span class="when">목 09:00 초기화</span></button>
        <button type="button" data-svc="codex" class="row now rise" style="--i:4"><span class="nm">Codex</span><span class="gauge" aria-hidden="true"><i style="--v:12%"></i></span><span class="val">12% 남음</span><span class="when">토 14:00 초기화</span></button>
        <button type="button" data-svc="gemini" class="row rise" style="--i:5"><span class="nm">Gemini</span><span class="gauge" aria-hidden="true"><i style="--v:88%"></i></span><span class="val">88% 남음</span><span class="when">일 00:00 초기화</span></button>
        <button type="button" data-svc="higgsfield" class="row rise" style="--i:6"><span class="nm">Higgsfield</span><span class="gauge" aria-hidden="true"><i style="--v:41%"></i></span><span class="val">41% 남음</span><span class="when">1,240 / 3,000 크레딧 · 12월 3일 결제</span></button>
      </div>
      <p class="read rise" style="--i:7"><span id="read-when">방금 읽은 값입니다.</span><span class="acts"><button class="reread" id="to-manage" type="button">계정 관리</button><button class="reread" id="reread" type="button">다시 읽기</button></span></p>
    </div>

    <div class="room" data-room="solio-backup">

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const stage = $('#stage'), canvas = $('#orb'), wake = $('#wake'), orbBtn = $('#orb-btn');
const layers = { ask: $('#ask'), app: $('#app'), switch: $('#switch'), forge: $('#forge') };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rad = d => d * Math.PI / 180, lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeIOQ = t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

let W = 1, H = 1, DPR = 1;
let mode = 'first', space = 'solio', ui = 'none';
let run = 0, tw = null, poseName = 'void', glintBoost = 0, glintWant = 0;
/* 새 판을 깎는 정도. cut은 깎인 만큼(0~1), cutOn은 그 장면이 켜진 정도다 */
let cut = 1, cutOn = 0, cutOnWant = 0, grand = false, forgeP = 0;
/* az와 lz는 빛이 오는 쪽(화면에서의 각도, 보는 쪽으로 기운 정도), ax는 구를 깎은 축, spin은 그 축을 따라 구를 돌린 각이다.
   mark는 새긴 자리가 보이는 정도, par는 손을 따라 기우는 정도, calm은 글이 놓일 자리의 결을 가라앉히는 정도, open은 들어갈 자리가 열린 정도, eye는 눈이 보이는 자세인지다 */
const S = { cx: 0, top: 0, r: 1, az: 0, lz: .5, lit: 0, focus: 0, ax: [.28, .52, .81], spin: 0, mark: 0, par: 1, calm: 0, open: 0, eye: 0 };
const ptr = { x: .5, y: .5 }, ptrS = { x: .5, y: .5 };
let diveTo = 'solio', hotWant = -1, faceWant = null, sigOn = true;
const hot = [0, 0, 0], markXY = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];

/* ── 구 위의 자리. 공간 하나가 별 하나다(11-20 유호님이 고르신 「눈이 별이 된다」). 별은 구에서 정해진 자리에 있고 구는 돌지 않는다.
      지도가 켜지면 눈의 점이 흩어져 별이 되고, 꺼지면 점이 돌아와 다시 눈이 된다 ── */
const ORDER = ['solio', 'workspace', 'pulse'];
const LON = { solio: 0, workspace: 0, pulse: 0 };   // 구를 돌려 자리를 앞에 두던 때의 값이다. 별은 돌지 않아 모두 0이다
/* 별의 자리(구의 반지름을 1로 본 화면 좌표, 위가 +). 셋을 워크스페이스 · 솔리오 · PULSE 순서로 선 둘이 잇는다 */
const STAR = { solio: [.14, -.44], workspace: [-.50, .26], pulse: [.55, .12] };
const RHO = .11;   // 별을 손으로 가리킬 때 닿는 너비이고, 들어갈 때 구가 커지는 끝을 정한다
/* 지도를 내보일 때도 구의 축은 쉴 때 그대로다 */
const faceAx = () => AX.rest;
/* 그 공간의 별이 보는 쪽 좌표로 어디에 있는지 낸다(축과 도는 각에 매이지 않는다) */
function placeDir(a, spin, name) { const q = STAR[name]; return [q[0], q[1], Math.sqrt(1 - q[0] * q[0] - q[1] * q[1])]; }
/* 어떤 자세 s에서 그 자리가 화면의 어디에 찍히는지 */
function placeXY(s, name) { const m = placeDir(s.ax, s.spin, name); return [s.cx + s.r * m[0], s.top + s.r - s.r * m[1]]; }

/* ── 구가 서는 자리. top은 구의 맨 윗점, r은 반지름(화면 px) ── */
/* 깎은 축의 방향 둘: 쉴 때와 로그인을 물을 때. 자리를 내보이거나 들어갈 때는 faceAx를 쓴다 */
const AX = { rest: [.28, .52, .81], top: [0, .972, .235] };
/* 구에 다가가 지도가 켜졌을 때의 반지름. 고리가 보일 만큼은 커야 한다 */
const fanR = () => clamp(H * .086, 50, 84);
function swGeom() {
  const wide = W >= 760 && H >= 470, r = wide ? Math.min(H * .2, W * .19) : Math.min(H * .13, W * .23);
  return { wide, r, cy: wide ? H * .4 : r + Math.max(64, H * .09) };
}
/* 새 판을 받는 동안 구가 서는 자리. 아래에 글이 놓이므로 가운데보다 조금 위다 */
function forgeGeom(p = forgeP) {
  if (grand) return { grand: true, r: Math.min(H * lerp(.5, .62, p), W * .78), cy: H * .64 };
  const low = H < 620, r = Math.min(H * (low ? .2 : .24), W * .3);
  return { r, cy: H * (low ? .34 : .405) };
}
function poses() {
  const r0 = Math.min(H * .21, W * .3);
  const rAsk = Math.max(H * 1.9, W * 1.25);
  const b = orbBtn.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const hx = b.left - s.left + b.width / 2, hy = b.top - s.top + b.height / 2, hr = 16;
  const g = swGeom(), fg = forgeGeom(), rIn = Math.hypot(W, H) * .56 / RHO, fr = fanR();
  return {
    void:   { cx: W / 2, top: H / 2 - r0, r: r0, az: rad(-50), lz: .5, lit: 0, focus: 0, ax: AX.rest, mark: 0, par: 1, calm: 0 },
    rest:   { cx: W / 2, top: H / 2 - r0, r: r0, az: rad(135), lz: .5, lit: 1, focus: 0, ax: AX.rest, mark: 0, par: 1, calm: 0, eye: 1 },
    forge:  { cx: W / 2, top: fg.cy - fg.r, r: fg.r, az: rad(128), lz: grand ? .42 : .5, lit: grand ? .58 : 1, focus: 0, ax: AX.rest, mark: 0, par: grand ? .16 : .35, calm: grand ? .85 : 0, eye: 1 },
    ask:    { cx: W / 2, top: H * .25, r: rAsk, az: rad(150), lz: -.3, lit: 1, focus: 1, ax: AX.top, mark: 0, par: 0, calm: 1 },
    /* 들어갈 자리가 보는 쪽을 똑바로 향하고 그 고리가 창보다 커진 때다. 거기까지 가는 길은 mix가 자리를 따라가며 잡는다 */
    inside: { cx: W / 2, top: H / 2 - rIn, r: rIn, az: rad(150), lit: 0, focus: 1, ax: faceAx(diveTo), spin: -LON[diveTo], mark: 1, par: 0, calm: 0, dive: true },
    home:   { cx: hx, top: hy - hr, r: hr, az: rad(135), lz: .5, lit: 1, focus: 0, ax: AX.rest, mark: 0, par: 1, calm: 0, eye: 1 },
    /* 구에 다가가면 구가 제자리에서 자라 지도가 켜진다. 왼쪽 위 모서리는 그대로 두고 오른쪽 아래로 자란다. 눈은 물러난다 */
    fan:    { cx: hx - hr + fr, top: hy - hr, r: fr, az: rad(140), lz: .45, lit: 1, focus: 0, ax: faceAx(faceWant || space), spin: -LON[faceWant || space], mark: 1, par: 0, calm: 0 },
    /* 공간을 고를 때는 구가 가운데로 와서 지금 있는 자리를 앞에 보인다. 이름을 가리키면 그 자리가 앞으로 돌아온다 */
    sw:     { cx: W / 2, top: g.cy - g.r, r: g.r, az: rad(140), lz: .45, lit: 1, focus: 0, ax: faceAx(faceWant || space), spin: -LON[faceWant || space], mark: 1, par: 0, calm: 0 },
  };
}
function snap(name) {
  const p = poses()[name];
  for (const k in p) if (k !== 'dive') S[k] = Array.isArray(p[k]) ? [...p[k]] : p[k];
  S.open = name === 'inside' ? 1 : 0; S.eye = p.eye || 0; poseName = name; tw = null;
}
function tween(name, ms, ease = easeIO, litCurve = null) {
  if (tw) tw.res();
  poseName = name;
  const from = { ...S, ax: [...S.ax] }, to = poses()[name];
  // 도는 각은 가까운 쪽으로 돈다
  if (to.spin !== undefined) from.spin = to.spin + Math.atan2(Math.sin(S.spin - to.spin), Math.cos(S.spin - to.spin));
  return new Promise(res => { tw = { from, p0: placeXY(S, diveTo), name, t0: performance.now(), ms: reduce ? Math.min(ms, 220) : ms, ease, litCurve, res }; });
}
/* 자세 a에서 b로 가는 길의 한순간(t는 0~1)을 S에 적는다 */
function mix(a, b, t, o) {
  const e = o.ease(t), dive = !!b.dive, eo = dive ? smooth(0, .62, t) : e;
  S.r = Math.exp(lerp(Math.log(a.r), Math.log(b.r), e));
  S.az = lerp(a.az, b.az, eo); S.focus = lerp(a.focus, b.focus, eo);
  S.mark = lerp(a.mark, b.mark, eo); S.par = lerp(a.par, b.par, eo); S.calm = lerp(a.calm, b.calm, eo);
  /* 눈은 자리를 옮기는 길의 앞쪽에서 사라지고 뒤쪽에서 나타난다 */
  S.eye = (a.eye || 0) > (b.eye || 0) ? lerp(a.eye || 0, b.eye || 0, smooth(0, .3, t)) : lerp(a.eye || 0, b.eye || 0, smooth(.6, 1, t));
  if (b.lz !== undefined) S.lz = lerp(a.lz, b.lz, eo);
  S.ax = [lerp(a.ax[0], b.ax[0], eo), lerp(a.ax[1], b.ax[1], eo), lerp(a.ax[2], b.ax[2], eo)];
  if (b.spin !== undefined) S.spin = lerp(a.spin, b.spin, eo);
  S.lit = o.litCurve ? o.litCurve(t, a.lit, b.lit) : lerp(a.lit, b.lit, e);
  if (dive) {
    /* 들어갈 자리가 화면 한가운데로 오도록 구를 옮긴다. 구는 그 자리를 보는 쪽으로 돌리면서 커지고, 고리 안이 열린다 */
    const m = placeDir(S.ax, S.spin, diveTo), ep = smooth(0, .7, t);
    S.cx = lerp(o.p0[0], W / 2, ep) - S.r * m[0];
    S.top = lerp(o.p0[1], H / 2, ep) + S.r * m[1] - S.r;
    S.open = smooth(.3, .8, t);
  } else {
    S.cx = lerp(a.cx, b.cx, e); S.top = lerp(a.top, b.top, e); S.open = lerp(a.open, 0, e);
  }
}
function stepTween(now) {
  if (!tw) return;
  const t = clamp((now - tw.t0) / tw.ms, 0, 1);
  mix(tw.from, poses()[tw.name], t, tw);
  if (t >= 1) { const r = tw.res; tw = null; r(); }
}
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 120) : ms));
let skip = null;
const waitSkippable = ms => new Promise(r => { const id = setTimeout(done, ms); function done() { clearTimeout(id); skip = null; r(); } skip = done; });

/* ── 화면 층 ── */
let settleTimer = 0, hurry = false;
/* 구가 드러나는 동안 누르면 기다림을 줄이고 바로 다음으로 간다 */
function hurryBoot() {
  hurry = true;
  if (skip) skip();
  else if (tw && tw.name === 'rest') tw.ms = Math.min(tw.ms, performance.now() - tw.t0 + 320);
}
function setUI(next) {
  ui = next; stage.dataset.ui = next;
  if (next === 'ask' || next === 'app' || next === 'switch' || next === 'forge') delete stage.dataset.boot;
  for (const k in layers) layers[k].inert = k !== next;
  if (next !== 'ask') { delete stage.dataset.wait; glintWant = 0; }
  stage.classList.remove('settled'); clearTimeout(settleTimer);
  if (layers[next]) settleTimer = setTimeout(() => stage.classList.add('settled'), 1900);
}
function applySpace() {
  stage.dataset.space = space;
  $('#here-text').textContent = { solio: 'SOLIO', workspace: 'WORKSPACE', pulse: 'PULSE' }[space];
  $$('.sw, .fan-go').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === space)));
  delete stage.dataset.sub; delete stage.dataset.aside;
}

/* ── 눈. 구 겉에 켜지는 두 눈이다. 손이 있는 쪽을 보고, 가끔 깜빡이고, 표정으로 상태를 말한다 ── */
const EYE_KINDS = [['dot', '점 눈'], ['slit', '틈 눈'], ['light', '빛 눈'], ['none', '눈 없음']];
const MOODS = [['calm', '평소'], ['smile', '웃음'], ['busy', '일하는 중'], ['sorry', '문제'], ['sleep', '잠']];
const MOOD_NO = { calm: 0, smile: 1, sleep: 2, sorry: 3, busy: 4 };
/* gate는 눈을 켠 정도, open은 뜬 정도, face는 얼굴이 향한 쪽, gaze는 눈길이 얼굴보다 앞서 간 만큼(점 한 칸이 1)이다. fixed는 화면 확인용으로 멈춰 둔 값이다 */
const eye = { kind: 'dot', gate: 0, gateS: 0, mood: 'calm', open: 1, face: [0, 0], gaze: [0, 0], lid: null, nextBlink: 0, token: 0, fixed: null };
function lidTo(v, ms, ease = easeIO) {
  if (eye.lid) eye.lid.res();
  return new Promise(res => { eye.lid = { from: eye.open, to: v, t0: performance.now(), ms: reduce ? Math.min(ms, 80) : ms, ease, res }; });
}
function stepEye(now) {
  const l = eye.lid;
  if (l) { const t = clamp((now - l.t0) / l.ms, 0, 1); eye.open = lerp(l.from, l.to, l.ease(t)); if (t >= 1) { eye.lid = null; l.res(); } }
  eye.gateS += (eye.gate - eye.gateS) * .09;
  if (!reduce && !eye.lid && !eye.fixed && eye.mood === 'calm' && eye.gateS > .9 && S.eye > .9 && now > eye.nextBlink) { eye.nextBlink = now + 2600 + Math.random() * 4200; blink(); }
}
async function blink() { const k = ++eye.token; await lidTo(0, 90); if (k !== eye.token) return; await lidTo(1, 170, easeOut); }
/* 표정을 바꾼다. 눈을 감았다 뜨는 사이에 바뀐다. ms를 주면 그 뒤 평소로 돌아온다 */
async function setMood(m, ms = 0) {
  const k = ++eye.token; eye.nextBlink = performance.now() + 1400;   // 표정을 바꾸는 동안에는 깜빡이지 않는다(밀려 있던 깜빡임이 표정 바꾸기를 지우지 않게)
  if (m !== eye.mood) { await lidTo(0, 110); if (k !== eye.token) return; eye.mood = m; syncMoodBtn(); await lidTo(1, m === 'calm' ? 260 : 190, easeOut); if (k !== eye.token) return; }
  if (ms) { await wait(ms); if (k !== eye.token) return; setMood('calm'); }
}
/* 잠든 눈으로 떠오른다 */

  if (stage.dataset.prog === name && !stage.dataset.aside) return;

  o.addEventListener('pointerleave', () => clearTimeout(progTimer));
  o.addEventListener('click', () => showProg(o.dataset.prog));
  o.addEventListener('focus', () => { if (o.matches(':focus-visible')) showProg(o.dataset.prog); });
});

    if (opt.eye) setEyeKind(opt.eye);

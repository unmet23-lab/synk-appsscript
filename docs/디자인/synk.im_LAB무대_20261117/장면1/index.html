<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB 빨랫줄 첫 장면</title>
<link rel="stylesheet" href="장면1.css">
</head>
<body>
<!-- LAB 「직접 풀어 보기」 다시 짓기 첫 장면(2026-11-18). 유호님 「이정도를 공개하는건 진짜 안돼 … 효과음도없고 모션그래픽도 애매하고 미학도없고」 → 「그렇게 해」.
     컨셉: 30일은 줄 하나다. 보기 세 낱말이 줄에 매단 종이 카드이고, 답한 말은 그 줄의 다음에 돌아올 날로 옮겨 간다(참고: Recent 「줄에 매단 카드」).
     이 쪽은 첫 장면(안내 → 첫 문제 → 맞힘 · 틀림 → 1분 뒤 감기 → 둘째 문제 → 내일로)까지만 짓는다. -->
<section class="sc" id="sc" data-scene="now" aria-labelledby="sc-title">
  <div class="sc-wall" aria-hidden="true"><div class="sc-win"><i></i><i></i><i></i><i></i></div></div>

  <header class="sc-head">
    <p class="sc-kicker">SYNK WORLD · 직접 풀어 보기</p>
    <h2 class="sc-title" id="sc-title"><span>한 문제를 풀면,</span> <span>그 말이 30일 동안 언제 돌아오는지 보여 드립니다.</span></h2>
    <div class="sc-meta">
      <span class="sc-time">약 1분</span>
      <button class="sc-sound" type="button" aria-pressed="false"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i><span>소리 켜기</span></button>
    </div>
  </header>

  <div class="sc-stage">
    <p class="sc-qhead"></p>
    <p class="sc-ctx"></p>
    <p class="sc-prompt"></p>
  </div>

  <div class="sc-line">
    <svg class="sc-cord" aria-hidden="true"><path class="sc-cord-shadow"/><path class="sc-cord-path"/></svg>
    <ol class="sc-stops" aria-label="이 말이 돌아오는 날"></ol>
    <div class="sc-cards" role="group" aria-label="보기"></div>
    <p class="sc-hint" aria-hidden="true">카드를 잡아 흔들어 보세요</p>
  </div>

  <div class="sc-after" aria-live="polite">
    <p class="sc-say"></p>
    <p class="sc-sub"></p>
    <div class="sc-next"></div>
  </div>

  <div class="sc-ff" aria-hidden="true"><span class="sc-ff-num">00:00</span><span class="sc-ff-cap"></span></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="장면1.js"></script>
</body>
</html>

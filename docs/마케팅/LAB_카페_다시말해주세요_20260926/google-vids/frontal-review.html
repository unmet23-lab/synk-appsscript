<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유호 · 정면 얼굴 수정 테스트</title>
<style>@font-face{font-family:SUIT;src:url('../rebuild-v3/assets/SUIT-Variable.woff2')}*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#171717;font-family:SUIT,system-ui,sans-serif}main{max-width:950px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:baseline;gap:18px}h1{font-size:25px;letter-spacing:-.6px}p{color:#555;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pane{margin:0}h2{font-size:16px;margin:8px 0 12px}.media{width:100%;aspect-ratio:9/16;max-height:73vh;border-radius:16px;background:#ddd;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;object-position:56% 50%}video{width:100%;height:100%;object-fit:contain;background:#181818}button{border:0;border-radius:10px;padding:13px 22px;background:#171717;color:white;font:inherit;cursor:pointer;margin-top:16px}a{color:inherit;text-underline-offset:3px}.note{font-size:13px}#status{display:inline-block;padding-left:12px;font-size:14px}@media(max-width:600px){main{padding:14px}.grid{gap:12px}h1{font-size:20px}header{display:block}.media{max-height:none}h2{font-size:13px}}</style></head>
<body><main><header><h1>정면 얼굴, 다시 맞춰보기</h1><p class="note">카페 대화 · 10초 테스트</p></header><div class="grid"><section class="pane"><h2>실제 인터뷰 얼굴</h2><div class="media"><img src="../yuho-interview-face/interview-75s.png" alt="실제 인터뷰 영상의 정면 기준"></div></section><section class="pane"><h2>정면 기준으로 새로 만든 영상</h2><div class="media"><video id="v" controls playsinline preload="metadata" poster="../yuho-interview-face/SYNK_LAB_카페_유호_정면기준_v2.png"><source src="test-07-frontal-image-to-video-preview.webm" type="video/webm"><source src="test-07-frontal-image-to-video.mp4" type="video/mp4"></video></div></section></div><button id="play">수정 영상 재생</button><span id="status">소리를 켜고 봐주세요.</span><p class="note">실제 정면 프레임 → 카페 기준 이미지 → 이미지 기반 영상 생성.<br>얼굴 재현 검토용입니다. 전체 편집본에는 아직 반영하지 않았습니다. <a href="test-07-frontal-image-to-video.mp4" download>10초 MP4 저장</a></p></main><script>const v=document.getElementById('v'),b=document.getElementById('play'),s=document.getElementById('status');b.onclick=()=>{if(v.paused){if(v.ended)v.currentTime=0;v.play().catch(()=>s.textContent='영상의 재생 버튼을 눌러주세요.')}else v.pause()};v.onplay=()=>{b.textContent='일시 정지';s.textContent='재생 중'};v.onpause=()=>{b.textContent='수정 영상 재생';if(!v.ended)s.textContent='일시 정지'};v.onended=()=>{b.textContent='다시 보기';s.textContent='10초 전체 재생 완료'};v.onerror=()=>s.textContent='재생을 불러오지 못했습니다.';</script></body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>실제 미소 · 배경 교체 시험 비교</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #20211f; background: #f5f3ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 24px; }
    main { max-width: 1600px; margin: auto; }
    h1 { font-size: clamp(23px, 3vw, 34px); line-height: 1.3; margin: 0 0 10px; }
    .intro { margin: 0 0 24px; color: #55554f; line-height: 1.65; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    figure { min-width: 0; margin: 0; background: #fff; border: 1px solid #d9d8d2; border-radius: 16px; overflow: hidden; }
    figcaption { padding: 17px 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h2 { font-size: 20px; margin: 0; }
    .sound-label { font-size: 14px; color: #60615c; }
    video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #111; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 14px 24px; flex-wrap: wrap; margin: 24px 0 16px; }
    button, select, input { font: inherit; }
    button { min-width: 196px; border: 0; border-radius: 11px; background: #222520; color: white; padding: 13px 24px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    select { margin-left: 8px; padding: 9px 12px; border: 1px solid #aaa9a1; border-radius: 8px; background: white; }
    label { display: inline-flex; align-items: center; gap: 8px; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: #242923; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #bf654f; outline-offset: 4px; }
    .seek-row { display: flex; align-items: center; gap: 14px; max-width: 860px; margin: 0 auto; }
    .seek-row label { white-space: nowrap; font-size: 14px; }
    #seek { width: 100%; accent-color: #3c5143; }
    #time { min-width: 115px; font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; }
    #status { text-align: center; min-height: 1.5em; line-height: 1.6; margin: 18px 0 8px; }
    .note { max-width: 920px; margin: 8px auto; text-align: center; font-size: 14px; line-height: 1.6; color: #61625c; }
    @media (max-width: 680px) { body { padding: 20px 12px; } .comparison { gap: 10px; } figcaption { padding: 12px; } h2 { font-size: 16px; } .sound-label { font-size: 12px; } .seek-row { flex-wrap: wrap; } #seek { flex: 1; min-width: 120px; } }
  </style>
</head>
<body>
<main>
  <h1>실제 미소와 배경 교체 시험 비교</h1>
  <p class="intro"><strong>이 AI 생성 시험은 미소 차이로 채택하지 않았습니다.</strong> <a href="../motion-composite/watch.html">원본 인물 합성 비교 보기</a></p>
  <p class="intro">눈과 입이 움직이는 방식, 웃음이 시작되고 풀리는 순간을 비교해 주세요. 이번 영상은 표정 보존 시험입니다. 카페 대사 완성본은 아닙니다.</p>

  <section class="comparison" aria-label="원본과 배경 교체 시험 영상">
    <figure>
      <figcaption><h2>원본</h2><span id="original-sound" class="sound-label">소리 켜짐</span></figcaption>
      <video id="original" aria-label="실제 원본 미소 영상" playsinline preload="metadata" src="../../performance-references/upload-ready/yuho-genuine-smile-under10s-compatible.mp4"></video>
    </figure>
    <figure>
      <figcaption><h2>배경 교체 시험</h2><span class="sound-label">소리 꺼짐</span></figcaption>
      <video id="generated" aria-label="카페 배경으로 교체한 표정 보존 시험 영상" playsinline muted preload="metadata" src="../test-10-motion-preservation.mp4"></video>
    </figure>
  </section>

  <div class="controls" aria-label="두 영상 함께 제어">
    <button id="play-both" type="button" autofocus>두 영상 재생</button>
    <label for="speed">재생 속도<select id="speed"><option value="1" selected>1배속</option><option value="0.5">0.5배속</option></select></label>
    <label for="original-audio"><input id="original-audio" type="checkbox" checked>원본 소리</label>
  </div>
  <div class="seek-row">
    <label for="seek">같은 시점</label>
    <input id="seek" type="range" min="0" max="10" value="0" step="0.01" disabled aria-valuetext="0초">
    <output id="time" for="seek" aria-live="off">0.00 / 0.00초</output>
  </div>
  <p id="status" role="status" aria-live="polite">두 영상을 불러오고 있습니다.</p>
  <p id="duration-note" class="note">두 영상의 공통 길이까지 같은 시점으로 재생합니다. 원본 소리만 기본으로 켜져 있습니다.</p>
</main>
<script>
(() => {
  const original = document.getElementById('original');
  const generated = document.getElementById('generated');
  const videos = [original, generated];
  const button = document.getElementById('play-both');
  const speed = document.getElementById('speed');
  const audio = document.getElementById('original-audio');
  const seek = document.getElementById('seek');
  const time = document.getElementById('time');
  const status = document.getElementById('status');
  const note = document.getElementById('duration-note');
  let playing = false;
  let complete = false;
  let frameRequest = 0;
  let loadingPlay = false;

  original.muted = false;
  generated.muted = true;
  const ready = () => videos.every(video => !video.error && Number.isFinite(video.duration) && video.duration > 0 && video.readyState >= 1);
  const length = () => ready() ? Math.min(original.duration, generated.duration) : 0;
  const position = () => Math.min(original.currentTime || 0, length());
  const number = value => Number(value || 0).toFixed(2);

  function updateTime() {
    const current = position();
    seek.value = current;
    seek.setAttribute('aria-valuetext', `${number(current)}초, 전체 ${number(length())}초`);
    time.textContent = `${number(current)} / ${number(length())}초`;
  }

  function pauseBoth(message) {
    playing = false;
    cancelAnimationFrame(frameRequest);
    videos.forEach(video => video.pause());
    button.disabled = false;
    button.textContent = complete ? '처음부터 다시 재생' : '두 영상 재생';
    if (message) status.textContent = message;
    updateTime();
  }

  function finish() {
    if (!ready()) return;
    complete = true;
    pauseBoth(`전체 비교 재생 완료 · ${number(length())}초`);
    videos.forEach(video => { video.currentTime = length(); });
    updateTime();
  }

  function tick() {
    if (!playing) return;
    if (original.ended || generated.ended || original.currentTime >= length() - 0.025) {
      finish();
      return;
    }
    if (!original.seeking && !generated.seeking && generated.readyState >= 2 && Math.abs(generated.currentTime - original.currentTime) > 0.12) {
      generated.currentTime = original.currentTime;
    }
    updateTime();
    frameRequest = requestAnimationFrame(tick);
  }

  function updateReady() {
    if (!ready()) return;
    seek.max = length();
    seek.disabled = false;
    button.textContent = playing ? '두 영상 일시정지' : complete ? '처음부터 다시 재생' : '두 영상 재생';
    note.textContent = `공통 ${number(length())}초를 같은 시점으로 재생합니다. 원본 ${number(original.duration)}초 · 배경 교체 시험 ${number(generated.duration)}초.`;
    if (!playing && !complete) status.textContent = '비교 준비 완료. 버튼을 누르면 두 영상이 함께 시작됩니다.';
    updateTime();
  }

  button.addEventListener('click', async () => {
    if (loadingPlay) return;
    if (!ready()) {
      complete = false;
      pauseBoth('두 영상의 준비 상태를 다시 확인하고 있습니다.');
      videos.forEach(video => video.load());
      return;
    }
    if (playing) {
      pauseBoth(`일시정지 · ${number(position())}초`);
      return;
    }
    loadingPlay = true;
    button.disabled = true;
    const start = complete || position() >= length() - 0.025 ? 0 : position();
    complete = false;
    videos.forEach(video => { video.currentTime = start; video.playbackRate = Number(speed.value); });
    original.muted = !audio.checked;
    generated.muted = true;
    try {
      await Promise.all(videos.map(video => video.play()));
      playing = true;
      button.textContent = '두 영상 일시정지';
      status.textContent = `두 영상 재생 중 · ${speed.value}배속`;
      frameRequest = requestAnimationFrame(tick);
    } catch {
      pauseBoth('함께 재생을 시작하지 못했습니다. 두 영상 재생 버튼으로 다시 시도할 수 있습니다.');
    } finally {
      loadingPlay = false;
      button.disabled = false;
    }
  });

  seek.addEventListener('input', () => {
    if (!ready()) return;
    const selected = Math.max(0, Math.min(Number(seek.value), length()));
    complete = false;
    videos.forEach(video => { video.currentTime = selected; });
    updateTime();
    if (!playing) status.textContent = `같은 시점으로 이동 · ${number(selected)}초`;
  });
  speed.addEventListener('change', () => {
    videos.forEach(video => { video.playbackRate = Number(speed.value); });
    status.textContent = playing ? `두 영상 재생 중 · ${speed.value}배속` : `재생 속도 ${speed.value}배속`;
  });
  audio.addEventListener('change', () => {
    original.muted = !audio.checked;
    generated.muted = true;
    document.getElementById('original-sound').textContent = audio.checked ? '소리 켜짐' : '소리 꺼짐';
  });
  videos.forEach(video => {
    video.addEventListener('loadedmetadata', updateReady);
    video.addEventListener('canplay', updateReady);
    video.addEventListener('ended', () => { if (playing) finish(); });
    video.addEventListener('error', () => {
      const message = video === generated
        ? '배경 교체 시험 영상이 아직 준비되지 않았거나 불러올 수 없습니다. 파일이 준비되면 같은 버튼으로 다시 확인할 수 있습니다.'
        : '원본 영상을 불러올 수 없습니다. 원본 파일 경로를 확인해 주세요.';
      pauseBoth(message);
      seek.disabled = true;
      button.textContent = '영상 준비 확인';
    });
  });
})();
</script>
</body>
</html>

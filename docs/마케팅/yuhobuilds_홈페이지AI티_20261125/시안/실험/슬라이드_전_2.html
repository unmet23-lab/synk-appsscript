<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF는 글로 바꿔 올리자</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --bad: #f87171;
    --good: #34d399;
    --u: calc(min(100vw, 100vh * 16 / 9) / 100);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  body { display: grid; place-items: center; }

  .slide {
    width: calc(var(--u) * 100);
    height: calc(var(--u) * 56.25);
    background: var(--bg);
    color: var(--text);
    padding: calc(var(--u) * 5) calc(var(--u) * 6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .eyebrow {
    font-size: calc(var(--u) * 1.5);
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  h1 {
    font-size: calc(var(--u) * 4.6);
    font-weight: 800;
    line-height: 1.25;
    margin-top: calc(var(--u) * 1);
  }
  h1 em { font-style: normal; color: var(--good); }

  .chart {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(var(--u) * 3);
  }
  .row-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: calc(var(--u) * 1.9);
    margin-bottom: calc(var(--u) * 0.8);
  }
  .row-label .name { font-weight: 700; }
  .row-label .num { font-size: calc(var(--u) * 3.2); font-weight: 800; font-variant-numeric: tabular-nums; }
  .row-label .num small { font-size: calc(var(--u) * 1.6); font-weight: 500; color: var(--muted); margin-left: 0.3em; }

  .track {
    height: calc(var(--u) * 5);
    background: var(--panel);
    border-radius: calc(var(--u) * 1);
    overflow: hidden;
  }
  .bar { height: 100%; border-radius: calc(var(--u) * 1); }
  .bar.pdf  { width: 100%;   background: var(--bad); }
  .bar.text { width: 46.27%; background: var(--good); }

  .result {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 2.5);
    background: var(--panel);
    border-left: calc(var(--u) * 0.5) solid var(--good);
    border-radius: calc(var(--u) * 1);
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
  }
  .result .big {
    font-size: calc(var(--u) * 5.5);
    font-weight: 800;
    color: var(--good);
    white-space: nowrap;
  }
  .result .desc { font-size: calc(var(--u) * 2.1); line-height: 1.5; }
  .result .desc b { color: var(--good); }

  .foot {
    margin-top: calc(var(--u) * 1.6);
    font-size: calc(var(--u) * 1.3);
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="slide">
    <div class="eyebrow">클로드에 문서를 올리는 방법</div>
    <h1>앞으로 PDF는 <em>글로 바꿔서</em> 올리자</h1>

    <section class="chart">
      <div>
        <div class="row-label">
          <span class="name">PDF 파일 그대로 올릴 때</span>
          <span class="num">23,596<small>토큰</small></span>
        </div>
        <div class="track"><div class="bar pdf"></div></div>
      </div>
      <div>
        <div class="row-label">
          <span class="name">글로 복사해 올릴 때</span>
          <span class="num">10,917<small>토큰</small></span>
        </div>
        <div class="track"><div class="bar text"></div></div>
      </div>
    </section>

    <section class="result">
      <div class="big">53.7% 절감</div>
      <div class="desc">같은 내용인데 토큰이 <b>절반 아래</b>로 줄어든다.<br>PDF로 올리면 약 2.2배를 쓴다.</div>
    </section>

    <div class="foot">기준: 8쪽짜리 약관 PDF 1건 · 같은 내용을 글로 복사해 올린 경우와 비교</div>
  </main>
</body>
</html>

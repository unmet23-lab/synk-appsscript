<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF는 글로 바꿔 올리자</title>
<style>
  :root {
    --black: #111111;
    --white: #ffffff;
    --accent: #e8590c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--black);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Malgun Gothic", sans-serif;
  }
  .slide {
    container-type: inline-size;
    width: min(100vw, 100vh * 16 / 9);
    aspect-ratio: 16 / 9;
    background: var(--white);
    color: var(--black);
    padding: 6cqw 7cqw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
  }
  h1 {
    font-size: 3.6cqw;
    font-weight: 700;
    line-height: 1.3;
  }
  .hero {
    display: flex;
    align-items: baseline;
    gap: 2cqw;
  }
  .hero .num {
    font-size: 17cqw;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .hero .label {
    font-size: 2.6cqw;
    font-weight: 700;
  }
  .bars { display: flex; flex-direction: column; gap: 1.6cqw; }
  .row {
    display: grid;
    grid-template-columns: 22cqw 1fr;
    align-items: center;
    column-gap: 2cqw;
  }
  .row .name { font-size: 2cqw; }
  .track { display: flex; align-items: center; gap: 1.4cqw; }
  .bar { height: 3.4cqw; }
  .row.pdf .bar { width: 100%; background: var(--black); }
  .row.txt .bar { width: 46.3%; background: var(--accent); }
  .row .val {
    font-size: 2cqw;
    font-weight: 700;
    white-space: nowrap;
  }
  .row.pdf .track { position: relative; }
  .row.pdf .bar { position: relative; }
  .row.pdf .val {
    position: absolute;
    right: 1.2cqw;
    color: var(--white);
  }
  .conclusion {
    font-size: 2.6cqw;
    font-weight: 700;
    border-top: 0.25cqw solid var(--black);
    padding-top: 1.8cqw;
  }
  .conclusion em { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
  <main class="slide">
    <h1>8쪽짜리 약관 PDF, 올리는 방식에 따라<br>토큰 사용량이 달라진다</h1>

    <div class="hero">
      <span class="num">54%</span>
      <span class="label">글로 바꿔 올리면 토큰이 이만큼 줄어든다</span>
    </div>

    <div class="bars">
      <div class="row pdf">
        <span class="name">PDF 그대로 올리기</span>
        <div class="track">
          <div class="bar"></div>
          <span class="val">23,596토큰</span>
        </div>
      </div>
      <div class="row txt">
        <span class="name">글로 복사해 올리기</span>
        <div class="track">
          <div class="bar"></div>
          <span class="val">10,917토큰</span>
        </div>
      </div>
    </div>

    <p class="conclusion">앞으로 PDF는 <em>글로 바꿔서</em> 올리자.</p>
  </main>
</body>
</html>

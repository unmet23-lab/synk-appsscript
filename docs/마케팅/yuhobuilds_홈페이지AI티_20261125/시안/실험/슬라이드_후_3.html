<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF는 글로 바꿔 올리자</title>
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --accent: #e8590c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--black);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide {
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    background: var(--white);
    color: var(--black);
    padding: 6cqw 7cqw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
  }
  .label {
    font-size: 1.6cqw;
    font-weight: 700;
    color: var(--accent);
  }
  h1 {
    font-size: 4.4cqw;
    font-weight: 800;
    line-height: 1.25;
    margin-top: 1.2cqw;
  }
  .hero {
    display: flex;
    align-items: baseline;
    gap: 2.4cqw;
  }
  .hero .num {
    font-size: 17cqw;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .hero .cap {
    font-size: 2.4cqw;
    font-weight: 700;
    line-height: 1.4;
  }
  .bars { display: flex; flex-direction: column; gap: 1.6cqw; }
  .row { display: flex; align-items: center; gap: 2cqw; }
  .row .name {
    width: 14cqw;
    font-size: 1.8cqw;
    font-weight: 700;
  }
  .track { width: 56cqw; }
  .bar {
    height: 3.2cqw;
    background: var(--black);
  }
  .bar.text { background: var(--accent); }
  .row .val {
    font-size: 1.8cqw;
    font-weight: 700;
  }
  .note {
    font-size: 1.4cqw;
    font-weight: 400;
    margin-top: 1.4cqw;
  }
</style>
</head>
<body>
  <main class="slide">
    <header>
      <div class="label">토큰 비교</div>
      <h1>PDF는 글로 바꿔서<br>클로드에 올리자</h1>
    </header>

    <section class="hero">
      <div class="num">2.2배</div>
      <div class="cap">PDF를 그대로 올리면<br>토큰을 이만큼 더 쓴다</div>
    </section>

    <section>
      <div class="bars">
        <div class="row">
          <div class="name">PDF 그대로</div>
          <div class="track"><div class="bar" style="width:100%"></div></div>
          <div class="val">23,596토큰</div>
        </div>
        <div class="row">
          <div class="name">글로 복사</div>
          <div class="track"><div class="bar text" style="width:46.3%"></div></div>
          <div class="val">10,917토큰</div>
        </div>
      </div>
      <div class="note">8쪽짜리 약관 PDF, 같은 내용으로 비교</div>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘꽃</title>
<style>
  :root {
    --black: #111111;
    --white: #ffffff;
    --accent: #c2410c;
    --line: 1px solid var(--black);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--white);
    color: var(--black);
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.7;
  }
  a { color: inherit; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 24px 48px;
    border-bottom: var(--line);
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  nav a {
    margin-left: 28px;
    font-size: 15px;
    text-decoration: none;
  }
  nav a:hover { color: var(--accent); }

  .hero {
    display: grid;
    grid-template-columns: 5fr 7fr;
    min-height: calc(100vh - 74px);
  }
  .hero-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 48px;
    border-right: var(--line);
  }
  .hero-text h1 {
    font-size: clamp(34px, 4.2vw, 56px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .hero-text h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .hero-text .lead {
    margin-top: 24px;
    font-size: 17px;
    max-width: 30em;
  }

  .services {
    margin-top: 40px;
    border-top: var(--line);
  }
  .services div {
    padding: 18px 0;
    border-bottom: var(--line);
  }
  .services h2 {
    font-size: 16px;
    font-weight: 700;
  }
  .services p {
    font-size: 15px;
    margin-top: 2px;
  }

  .order {
    display: inline-block;
    align-self: flex-start;
    margin-top: 36px;
    padding: 16px 36px;
    background: var(--accent);
    color: var(--white);
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid var(--accent);
  }
  .order:hover {
    background: var(--white);
    color: var(--accent);
  }
  .order:focus-visible {
    outline: 2px solid var(--black);
    outline-offset: 3px;
  }

  .photo {
    margin: 48px;
    border: var(--line);
    display: flex;
    align-items: flex-end;
    padding: 16px;
    min-height: 420px;
  }
  .photo span {
    font-size: 13px;
  }

  @media (max-width: 860px) {
    header { padding: 20px 24px; }
    nav a { margin-left: 18px; }
    .hero { grid-template-columns: 1fr; min-height: 0; }
    .hero-text { padding: 48px 24px; border-right: 0; border-bottom: var(--line); }
    .photo { margin: 24px; min-height: 320px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">오늘꽃</a>
  <nav>
    <a href="#order">꽃다발 주문</a>
    <a href="#subscribe">정기 배송</a>
  </nav>
</header>

<main class="hero">
  <section class="hero-text">
    <h1>오늘 필 꽃을,<br><em>오늘</em> 묶어 드립니다.</h1>
    <p class="lead">동네 꽃집 오늘꽃입니다. 필요한 날에 맞춰 꽃다발을 만들고, 매달 집이나 가게로 꽃을 보내 드립니다.</p>

    <div class="services">
      <div id="order">
        <h2>꽃다발 주문</h2>
        <p>선물, 기념일, 집에 둘 꽃까지 원하시는 분위기를 말씀해 주시면 맞춰 만듭니다.</p>
      </div>
      <div id="subscribe">
        <h2>한 달 정기 배송</h2>
        <p>한 달 동안 정해진 날에 새 꽃을 보내 드립니다. 받으실 곳은 집이든 가게든 괜찮습니다.</p>
      </div>
    </div>

    <a class="order" href="#order">꽃다발 주문하기</a>
  </section>

  <section class="photo" aria-label="가게 사진 자리">
    <span>가게 사진이 들어갈 자리</span>
  </section>
</main>

</body>
</html>

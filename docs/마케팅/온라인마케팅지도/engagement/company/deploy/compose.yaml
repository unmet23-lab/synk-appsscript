# Preparation only. Run from an approved release checkout on one Linux host.
# Set SYNK_COMPANY_DOMAIN to one DNS hostname; do not include a scheme or path.
# Supply the runtime env file outside the repository. It contains server secrets.
# Pre-create all bind directories on the mounted persistent disk. Never use an
# empty directory in place of the restored company volume.
# Docker HEALTHCHECK reports readiness; restart restarts exited processes only.
name: synk-company
services:
  company:
    image: ${SYNK_COMPANY_IMAGE:?Set the prebuilt reviewed release image tag}
    build:
      context: ../../../../../..
      dockerfile: docs/마케팅/온라인마케팅지도/engagement/company/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ${SYNK_COMPANY_RUNTIME_ENV_FILE:-/etc/synk/company.env}
    environment:
      NODE_ENV: production
      SYNK_COMPANY_HOST: 0.0.0.0
      SYNK_COMPANY_PORT: "4191"
      SYNK_COMPANY_ORIGIN: https://${SYNK_COMPANY_DOMAIN:?Set the approved DNS hostname}
      SYNK_COMPANY_DATA: /data
      SYNK_COMPANY_REQUIRE_EXISTING_DATA: "1"
      MESSENGER_DATA_DIR: /data/messenger
      SYNK_COMPANY_TRUSTED_PROXY_IPS: "172.30.77.3"
      # Screen files come from the current static set when one is valid (static/README.md).
      SYNK_COMPANY_STATIC_ROOT: /static
    networks:
      edge:
        ipv4_address: 172.30.77.2
    expose:
      - "4191"
    volumes:
      - type: bind
        source: ${COMPANY_VOLUME_DIR:?Set the absolute restored company volume path}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${COMPANY_BACKUP_DIR:-/srv/synk/backups}
        target: /backups
        bind:
          create_host_path: false
      # The static root lives on the persistent disk, so it follows the writer on failover.
      # An empty root only means "serve the image copy", so a restored or new disk may create it.
      - type: bind
        source: ${SYNK_COMPANY_STATIC_DIR:-/srv/synk/static}
        target: /static
        read_only: true
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.30.77.3
      # Work-backup front: Caddy and wb-api only (see wb-api below).
      wb-front:
        ipv4_address: 172.30.77.11
    environment:
      SYNK_COMPANY_DOMAIN: ${SYNK_COMPANY_DOMAIN:?Set the approved DNS hostname}
      SYNK_TLS_EMAIL: ${SYNK_TLS_EMAIL:?Set the TLS certificate operations email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CADDY_DATA_DIR:-/srv/synk/caddy-data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${CADDY_CONFIG_DIR:-/srv/synk/caddy-config}
        target: /config
        bind:
          create_host_path: false
    depends_on:
      company:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Work-backup provisioning server (experiences/solo-backup-rust/server/README.md).
  # OFF: the plain `compose up` in company-stack.sh starts no profiled service, nothing
  # above depends on these, and every value below has a default, so the company stack
  # reads and starts exactly as before. The HA guards and disaster capture still expect
  # exactly the company, https and spaceship containers, so turning the profile on is a
  # later infrastructure release, not a switch. Each service mounts only its own folder
  # on the persistent disk: the api never sees a B2 key, the workers never see each other.
  # Caddy joins the small wb-front network for it; that network exists even while these are off.
  wb-api:
    profiles: ["workbackup"]
    image: ${WB_IMAGE:-synk-workbackup:local}
    build:
      context: ../../../../../../experiences/solo-backup-rust/server
    command: ["node", "main.mjs", "api"]
    user: "10771:10771"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    environment:
      WB_PORT: "4210"
      WB_SETTINGS: /wb/settings.env
      WB_SECRETS_DIR: /wb/secrets
      WB_DB: /wb/data/wb.sqlite
      WB_BACKUP_DIR: /wb/backups
      WB_KEYS_URL: http://wb-keys:4211/rpc
      WB_FILES_URL: http://wb-files:4212/rpc
      WB_TRUSTED_PROXIES: "172.30.77.11"
    networks:
      # Not on the company edge network: the company app never reaches the api, and the
      # api reaches the company nothing. Only Caddy shares wb-front with it.
      wb-front:
        ipv4_address: 172.30.77.10
      wb-keys: {}
      wb-files: {}
    expose:
      - "4210"
    volumes:
      - type: bind
        source: ${WB_DIR:-/srv/synk/workbackup}/api
        target: /wb
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  wb-keys:
    profiles: ["workbackup"]
    image: ${WB_IMAGE:-synk-workbackup:local}
    command: ["node", "main.mjs", "keys"]
    user: "10772:10772"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      WB_PORT: "4211"
      WB_SETTINGS: /wb/settings.env
      WB_SECRETS_DIR: /wb/secrets
      WB_STATE_DIR: /wb/state
    networks:
      - wb-keys
    expose:
      - "4211"
    volumes:
      - type: bind
        source: ${WB_DIR:-/srv/synk/workbackup}/keys
        target: /wb
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  wb-files:
    profiles: ["workbackup"]
    image: ${WB_IMAGE:-synk-workbackup:local}
    command: ["node", "main.mjs", "files"]
    user: "10773:10773"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      WB_PORT: "4212"
      WB_SETTINGS: /wb/settings.env
      WB_SECRETS_DIR: /wb/secrets
      WB_STATE_DIR: /wb/state
    networks:
      - wb-files
    expose:
      - "4212"
    volumes:
      - type: bind
        source: ${WB_DIR:-/srv/synk/workbackup}/files
        target: /wb
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.77.0/29
  # Caddy and wb-api only, fixed addresses (the api trusts Caddy's forwarded address).
  wb-front:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.77.8/29
  # Only the api reaches each worker; the workers reach B2 and nothing else of ours.
  wb-keys:
    driver: bridge
  wb-files:
    driver: bridge

<!doctype html>
<html lang="ko" class="sx">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="영상에 들어갈 모든 컷을 장면 이미지로 먼저 보여 드려요. AI 모델 21명 캐스팅, 제품·로고는 실제 파일로 합성해요.">
  <title>SYNK PULSE — 모든 컷을 먼저 보여 드리는 AI 광고</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preload" href="./assets/SUIT.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/NotoSerifKR-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./film.css" id="film-css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="app-header">
    <a class="brand" href="./" aria-label="PULSE 처음으로"><img src="./assets/brand-pulse.webp" alt="SYNK PULSE" width="206" height="55"></a>
    <span class="header-caption">AI 광고 제작</span>
    <div id="header-crumb" class="header-crumb"></div>
    <div id="pulse-live" hidden></div>
    <div id="header-actions" class="header-actions"></div>
  </header>
  <div id="connection-banner" class="connection-banner" role="status" hidden>인터넷 연결이 끊겼어요. 쓰던 내용은 이 화면에 그대로 있어요.</div>
  <main id="main" tabindex="-1"><div class="loading" role="status"><span class="loading-mark"></span>프로젝트를 확인하고 있어요.</div></main>
  <div id="request-root" hidden></div>
  <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="empty-note">프로젝트를 보려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
</body>
</html>

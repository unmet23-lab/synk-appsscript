<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNK 온라인 마케팅 지도</title>
<meta name="description" content="LAB · SHIFT · PULSE · PATH가 계정을 확보한 나라와 준비 중인 나라(PULSE는 타깃 시장), 전체 계정과 장기 계획을 세계 지도로 본다.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="world.css">
<script type="module" src="world.js"></script>
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="#" aria-label="SYNK 마케팅 지도 처음">
    <svg class="wordmark" viewBox="0 0 560 328" role="img" aria-label="싱ㅋ"><path d="M87 8h58v30c0 46 23 76 61 103l-34 43c-29-19-52-45-66-70-15 30-36 54-64 72L8 143c49-32 79-64 79-112Z"/><path d="M222 8h58v172h-58Z"/><path fill-rule="evenodd" d="M157 192c-76 0-124 24-124 65s48 65 124 65 124-24 124-65-48-65-124-65Zm0 45c42 0 67 8 67 20s-25 20-67 20-67-8-67-20 25-20 67-20Z"/><path d="M326 8h226L464 312h-61l40-138H322v-54h137l16-55H326Z"/></svg>
    <span class="brand-name">마케팅 지도</span>
  </a>
  <div class="seg" role="tablist" aria-label="사업 고르기">
    <button class="seg-item" role="tab" id="tab-lab" data-view="lab" aria-selected="true" aria-controls="stage"><span class="seg-dot lab"></span>LAB<span class="seg-count num" data-count="lab"></span></button>
    <button class="seg-item" role="tab" id="tab-shift" data-view="shift" aria-selected="false" aria-controls="stage"><span class="seg-dot shift"></span>SHIFT<span class="seg-count num" data-count="shift"></span></button>
    <button class="seg-item" role="tab" id="tab-pulse" data-view="pulse" aria-selected="false" aria-controls="stage"><span class="seg-dot pulse"></span>PULSE<span class="seg-count num" data-count="pulse"></span></button>
    <button class="seg-item" role="tab" id="tab-path" data-view="path" aria-selected="false" aria-controls="stage"><span class="seg-dot path"></span>PATH<span class="seg-count num" data-count="path"></span></button>
    <button class="seg-item" role="tab" id="tab-all" data-view="all" aria-selected="false" aria-controls="stage">전체<span class="seg-count num" data-count="all"></span></button>
  </div>
  <div class="top-right">
    <a class="link" href="detail/">자세한 표</a>
  </div>
</header>

<main class="wrap" id="stage" role="tabpanel" aria-labelledby="tab-lab">
  <section class="head">
    <div class="head-text">
      <p class="eyebrow"><span class="dot-brand"></span><span data-slot="eyebrow">불러오는 중</span></p>
      <h1><span data-slot="h1a">지도를 그리고 있어요.</span><br><span class="soft" data-slot="h1b"></span></h1>
    </div>
    <dl class="stats" data-slot="stats"></dl>
  </section>

  <section class="stage">
    <div class="map-box">
      <div class="map-scroll" id="map-scroll">
        <svg class="map" id="map" role="group" aria-label="세계 지도" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="hatch" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect class="hatch-bg" width="4.2" height="4.2"/>
              <line class="hatch-line" x1="0" y1="0" x2="0" y2="4.2"/>
            </pattern>
          </defs>
          <g id="land"></g>
          <g id="marks"></g>
          <g id="labels"></g>
        </svg>
      </div>
      <ul class="legend" aria-label="색 안내">
        <li><span class="sw sw-active"></span>계정 있음</li>
        <li><span class="sw sw-target"></span>준비 중</li>
        <li><span class="sw sw-other"></span>그 밖</li>
      </ul>
      <div class="tip" id="tip" role="status" aria-live="polite" hidden></div>
    </div>
    <aside class="pane" id="pane" aria-live="polite"></aside>
  </section>

  <footer class="foot">
    <span data-slot="foot"></span>
    <span>나라 경계 Natural Earth · 가운데 동경 150도</span>
  </footer>
</main>
<noscript><p class="wrap">이 지도는 자바스크립트가 켜져 있어야 보여요.</p></noscript>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코어앤플로우 필라테스 아카데미</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; color: #2d2d2d; line-height: 1.6; }
  header { position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.95); display: flex; justify-content: space-between; align-items: center; padding: 18px 8%; z-index: 10; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
  .logo { font-size: 1.4rem; font-weight: 700; color: #6b8e7f; }
  nav a { margin-left: 28px; text-decoration: none; color: #444; font-size: 0.95rem; }
  nav a:hover { color: #6b8e7f; }
  .hero { min-height: 100vh; background: linear-gradient(135deg, #e8f0ec 0%, #f6efe8 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 8% 60px; }
  .hero h1 { font-size: 3rem; line-height: 1.3; margin-bottom: 20px; color: #2f4a3f; }
  .hero p { font-size: 1.15rem; color: #555; margin-bottom: 36px; max-width: 560px; }
  .btns a { display: inline-block; padding: 15px 34px; border-radius: 30px; text-decoration: none; font-weight: 600; margin: 6px; }
  .primary { background: #6b8e7f; color: #fff; }
  .primary:hover { background: #567566; }
  .secondary { border: 2px solid #6b8e7f; color: #6b8e7f; }
  .features { display: flex; gap: 24px; justify-content: center; margin-top: 70px; flex-wrap: wrap; }
  .card { background: #fff; padding: 28px 24px; border-radius: 16px; width: 240px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .card h3 { margin-bottom: 8px; color: #2f4a3f; }
  .card p { font-size: 0.92rem; margin: 0; color: #666; }
  @media (max-width: 700px) { .hero h1 { font-size: 2.1rem; } nav { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">Core &amp; Flow</div>
  <nav>
    <a href="#">학원소개</a>
    <a href="#">수업안내</a>
    <a href="#">강사진</a>
    <a href="#">시간표</a>
    <a href="#">상담문의</a>
  </nav>
</header>
<section class="hero">
  <h1>바른 몸의 시작,<br>코어앤플로우 필라테스</h1>
  <p>1:1 맞춤 지도와 소규모 그룹 수업으로 체형 교정부터 자격증 과정까지 함께합니다.</p>
  <div class="btns">
    <a href="#" class="primary">무료 체험 신청</a>
    <a href="#" class="secondary">수업 둘러보기</a>
  </div>
  <div class="features">
    <div class="card"><h3>소수 정예</h3><p>수업당 최대 6명으로 세심하게 지도합니다.</p></div>
    <div class="card"><h3>전문 강사진</h3><p>국제 자격을 갖춘 강사가 직접 수업합니다.</p></div>
    <div class="card"><h3>맞춤 커리큘럼</h3><p>체형 분석 후 개인별 프로그램을 설계합니다.</p></div>
  </div>
</section>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; img-src file: data:; font-src file:; connect-src 'none'; script-src 'none'">
  <title>댓글 DM 자료 전달 시험 A·B · 게시 승인 전</title>
  <!-- 운영 점검 fixture. 사용자의 시험 자료 제작 요청(2026-10-08)이 트리거다.
       홍보 콘텐츠가 아니므로 실제 얼굴·마케팅 훅·행동 유도를 넣지 않는다.
       기존 SNS 키트의 builds 테마·doc45·펠트 로고·실땀을 사용한다.
       외부 링크·스크립트·AI 생성 이미지 없이 로컬 자산으로만 굽는다. 공개 게시 미승인. -->
  <link rel="stylesheet" href="../../디자인/SNS키트/kit.css">
  <style>
    body{margin:0;background:#e9eaee;display:flex;flex-direction:column;gap:28px;padding:28px}
    .test-card .k-in{inset:214px 84px 230px}
    .test-card .k-head{font-family:var(--k-sans);font-size:30px;line-height:1.3}
    .test-card .k-head .date{font-family:var(--k-mono);font-size:28px}
    .test-card .test-title{font-size:76px;line-height:1.18;letter-spacing:-.055em;white-space:nowrap}
    .test-card .marker{margin-top:170px}
    .test-card .marker-name{margin:0;font-size:136px;font-weight:900;line-height:1.15;letter-spacing:-.055em;white-space:nowrap;color:var(--mark-field)}
    .test-card .marker-code{margin:38px 0 0;font:500 62px/1.2 var(--k-mono);letter-spacing:-.025em;color:#fff}
    .test-card .notice{position:absolute;left:84px;right:84px;bottom:230px;margin:0;color:#fff;font:500 31px/1.5 var(--k-sans);letter-spacing:-.025em;white-space:nowrap}
    .test-card .k-logo{height:56px;width:auto}
    .test-card .k-foot{bottom:92px}
    .test-card .k-handle{font-size:30px}
  </style>
</head>
<body data-acc="builds">
  <section class="k-slide k-field k-corners test-card" data-fmt="doc45" data-name="시험-A" aria-label="자료 전달 시험 A">
    <header class="k-head"><span>운영 점검</span><span class="date">2026.10.08</span></header>
    <div class="k-in">
      <h1 class="k-title test-title">자료 전달 시험 A</h1>
      <div class="marker"><p class="marker-name">파란 우산</p><p class="marker-code">A-20261008</p></div>
    </div>
    <p class="notice">자동 DM 연결 확인용 · 실제 배포 자료 아님</p>
    <footer class="k-foot"><img class="k-logo" src="../../디자인/SNS키트/assets/logo-synk-paper.webp" alt="SYNK"><span class="k-handle">@yuhobuilds</span></footer>
  </section>
  <section class="k-slide k-field k-corners test-card" data-fmt="doc45" data-name="시험-B" aria-label="자료 전달 시험 B">
    <header class="k-head"><span>운영 점검</span><span class="date">2026.10.08</span></header>
    <div class="k-in">
      <h1 class="k-title test-title">자료 전달 시험 B</h1>
      <div class="marker"><p class="marker-name">노란 연필</p><p class="marker-code">B-20261008</p></div>
    </div>
    <p class="notice">자동 DM 연결 확인용 · 실제 배포 자료 아님</p>
    <footer class="k-foot"><img class="k-logo" src="../../디자인/SNS키트/assets/logo-synk-paper.webp" alt="SYNK"><span class="k-handle">@yuhobuilds</span></footer>
  </section>
</body>
</html>

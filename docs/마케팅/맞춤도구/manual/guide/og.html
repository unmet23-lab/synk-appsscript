<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og · manual</title>
<!-- 링크 미리보기(1200×630) 원고. build.mjs가 Chrome으로 og.png를 찍는다.
     2026-10-06: synk.im 홈페이지 언어(검은 브랜드 면 + 결 + 굵은/가는 두 줄 제목 + 모노 꼬리표 + 펠트 오브젝트 하나)로 다시 짰다. 도구 첫 화면과 같다. -->
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;src:url(../../../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:100 499;src:url(../../../../브랜드_폰트/InterTight/InterTight-Regular.ttf)}
@font-face{font-family:'Inter Tight';font-weight:500 900;src:url(../../../../브랜드_폰트/InterTight/InterTight-Bold.ttf)}
@font-face{font-family:'DM Mono';font-weight:400 700;src:url(../../../../브랜드_폰트/DM_Mono/DMMono-Regular.ttf)}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
body{font-family:'Inter Tight','SUIT Variable',sans-serif;color:#fff;word-break:keep-all;-webkit-font-smoothing:antialiased}
.field{position:absolute;inset:14px;display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:center;gap:20px;padding:56px 60px 56px 64px;border-radius:30px;overflow:hidden;isolation:isolate;
 background:url(../../assets/field-grain.webp) 0 0/192px 192px repeat,radial-gradient(900px 520px at 10% -180px,rgba(255,255,255,.15),rgba(255,255,255,0) 70%),#0a0a0a}
.eyebrow{display:flex;align-items:center;gap:18px;margin:0 0 30px;font:400 17px/1.4 'DM Mono','SUIT Variable',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.eyebrow::after{content:'';flex:1;border-top:1.5px solid rgba(255,255,255,.2)}
h1{margin:0;font-size:76px;line-height:1.06;letter-spacing:-.05em;font-weight:300}
h1 b{font-weight:700}
h1 span{color:#f5c445}
p{margin:26px 0 0;font-size:27px;line-height:1.45;font-weight:500;letter-spacing:-.02em;color:rgba(255,255,255,.82)}
.url{display:inline-flex;align-items:center;gap:12px;margin-top:34px;height:60px;padding:0 26px 0 28px;border-radius:999px;background:#f5c445;color:#0a0a0a;font:700 25px/1 'Inter Tight','SUIT Variable',sans-serif;letter-spacing:-.02em}
.url i{font-style:normal;font-weight:400}
.art{position:relative;display:grid;place-items:center;height:100%}
.art::before{content:'';position:absolute;left:50%;top:52%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(245,196,69,.24),rgba(245,196,69,.06) 58%,rgba(245,196,69,0));z-index:-1}
.art img{width:300px;height:auto;filter:drop-shadow(0 30px 34px rgba(0,0,0,.65)) drop-shadow(0 4px 6px rgba(0,0,0,.4))}
</style>
</head>
<body>
<div class="field">
  <div>
    <p class="eyebrow">yuhobuilds — AI 직원 매뉴얼</p>
    <h1><b>내 일에 맞는</b><br><span>AI 직원 매뉴얼</span></h1>
    <p>질문 다섯 개면 만들어져요. 한 번 깔아 두면 다음부턴 한 줄로.</p>
    <div class="url">synk.im/builds <i>↗</i></div>
  </div>
  <div class="art"><img src="../../assets/hero-manual.webp" alt=""></div>
</div>
</body>
</html>

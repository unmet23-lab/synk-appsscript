<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카타나 요청문 만들기 · synkbrief</title>
<meta name="description" content="무엇이 주인공인지, 어떤 영상으로 어디에 올릴지 고르면 클로드에서 /katana 뒤에 붙여 넣을 요청문을 만들어 드려요. 크레딧 상한·화질·음악까지 넣고, 영상 속 실제 요청 두 개와 결과 숫자도 함께 보여 드려요.">
<meta name="theme-color" content="#060709">
<script>
/* 화면 테마: SYNK 플랫폼(웹, 같은 synk.im)에서 고른 밤·낮·기기 설정을 따른다. 고른 적이 없으면 밤(core/signal.css). */
(function(){var v='night';try{v=localStorage.getItem('synk.platform.theme')||'night'}catch(e){}if(['night','day','system'].indexOf(v)<0)v='night';document.documentElement.setAttribute('data-theme',v);var day=v==='day'||(v==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);document.querySelector('meta[name="theme-color"]').setAttribute('content',day?'#ECECEA':'#060709')})();
</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="synkbrief">
<meta property="og:title" content="카타나에 보낼 요청문, 내 영상에 맞게 · 1분">
<meta property="og:description" content="클로드 + 힉스필드 카타나. 크레딧 상한·화질·음악까지 넣은 요청문과 영상 속 실제 요청 두 개.">
<meta property="og:url" content="https://synk.im/brief/katana/">
<meta property="og:image" content="https://synk.im/brief/katana/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preload" href="assets/SUIT-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="tool">
  <header class="bar">
    <a class="brand" href="https://synk.im/shift/" aria-label="SYNK SHIFT 홈 · synkbrief 뉴스">
      <span class="bead"><img src="assets/brand-shift.webp" alt="synk SHIFT" width="88" height="24"></span>
      <span class="crumb" aria-hidden="true">synkbrief <i>/</i> katana</span>
    </a>
    <div class="bar-tools">
      <button type="button" class="switch" role="switch" aria-checked="true" data-tips><span class="track" aria-hidden="true"></span><span>팁 보기</span></button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="foot no-print">
    <span>synkbrief · 처음부터, 하나씩</span>
    <span><a href="https://www.instagram.com/synkbrief/" target="_blank" rel="noopener">Instagram</a> · <a href="https://www.youtube.com/@synkbrief" target="_blank" rel="noopener">YouTube</a> · <button type="button" data-forget>저장된 기록 지우기</button><span data-account-slot hidden> · <button type="button" data-account>SYNK 설정 불러오기</button></span></span>
  </footer>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<noscript><p style="max-width:680px;margin:40px auto;padding:0 20px;font-size:17px">요청문은 브라우저에서 만들어요. 자바스크립트를 켜 주세요.</p></noscript>
<script src="atlas-engine.js"></script>
<script src="content.js"></script>
<script src="rules.js"></script>
<script src="view.js"></script>
<script src="account.js"></script>
<script src="wizard.js"></script>
<script>
SynkWizard.start({
  root: document.getElementById('app'),
  tool: {
    id: 'brief.katana',
    scope: { domain: 'SHIFT', workspace: 'synkbrief', subject: 'visitor' },
    content: SynkKatanaContent, rules: SynkKatanaRules, view: SynkKatanaView,
    candidates: [
      { id: 'quick', pace: 'short', minutes: 2 },
      { id: 'guided', pace: 'standard', minutes: 4 },
      { id: 'deep', pace: 'deep', minutes: 8 }
    ]
  }
});
</script>
</body>
</html>

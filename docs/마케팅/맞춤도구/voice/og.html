<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og · voice-check</title>
<!-- 링크 미리보기(1200×630) 원고. build.mjs voice가 Chrome으로 og.png를 찍는다.
     싱ㅋ 시그널(prompts/og.html과 같은 문법): 근사 검정 판 · 두 줄 큰 제목(둘째 줄 회색) · 흰 알약 주소 ·
     청금석 포스터 + 큰 「깨짐」 + 펠트 마이크 + 실제 결과 두 줄(예시 목소리 A · B). -->
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;src:url(../../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-weight:500;src:url(../../../브랜드_폰트/DM_Mono/DMMono-Medium.ttf);unicode-range:U+0021-007E}
@font-face{font-family:'Inter Tight';font-weight:600;src:url(../../../브랜드_폰트/InterTight/InterTight-Medium.ttf);unicode-range:U+0021-007E}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#060709}
body{font-family:'SUIT Variable',sans-serif;color:#FAFAF9;word-break:keep-all;-webkit-font-smoothing:antialiased}
.panel{position:absolute;inset:22px;display:grid;grid-template-columns:1fr 430px;gap:40px;align-items:stretch;padding:34px;border-radius:30px;background:#0C0D10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075)}
.left{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 4px 8px}
.top{display:flex;align-items:center;gap:16px}
.bead{display:grid;place-items:center;height:48px;padding:0 20px;border-radius:999px;background:#FAFAF9}
.bead img{height:28px}
.crumb{font:500 15px/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,250,249,.52)}
h1{margin:0;font-size:60px;font-weight:680;line-height:1.1;letter-spacing:-.035em}
h1 span{color:rgba(250,250,249,.52)}
.rows{margin:24px 0 0;display:grid;gap:10px;max-width:560px}
.row{display:grid;grid-template-columns:1fr 190px 112px;align-items:center;gap:18px;padding:12px 18px;border-radius:16px;background:#121317;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075);font-size:21px;font-weight:600}
.row .n{font:600 22px/1 'Inter Tight',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:rgba(250,250,249,.86)}
.row .chip{justify-self:start}
.row .n.hot{color:#FFB4A9}
.chip{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 15px 0 12px;border-radius:999px;background:#191A1F;font-size:17px;font-weight:650}
.chip::before{content:'';width:9px;height:9px;border-radius:50%;background:#7DB45A;box-shadow:0 0 0 3px rgba(125,180,90,.25)}
.chip.fail::before{background:#F96859;box-shadow:0 0 0 3px rgba(249,104,89,.25)}
.url{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;height:58px;padding:0 26px;border-radius:999px;background:#FAFAF9;color:#08090C;font:600 24px/1 'SUIT Variable',sans-serif}
.url::before{content:'';width:10px;height:10px;border-radius:50%;background:#3D6BC9;box-shadow:0 0 0 4px rgba(61,107,201,.25)}
.poster{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 85% at 28% -10%,rgba(255,255,255,.16),transparent 58%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.1)),#3D6BC9;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.poster .label{position:absolute;left:24px;top:22px;font:500 14px/1 'DM Mono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.82)}
.poster img{position:absolute;top:56px;right:22px;width:360px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.3)) drop-shadow(0 4px 6px rgba(0,0,0,.18));transform:rotate(-3deg)}
.word{position:absolute;left:20px;bottom:14px;font-size:150px;font-weight:900;line-height:.84;letter-spacing:-.065em;color:#fff}
</style>
</head>
<body>
<div class="panel">
  <div class="left">
    <div class="top"><span class="bead"><img src="../assets/brand-shift.webp" alt="synk SHIFT"></span><span class="crumb">yuhobuilds / voice check</span></div>
    <div>
      <h1>AI 목소리 깨짐 검사<br><span>파일만 넣으면 돼요</span></h1>
      <div class="rows">
        <div class="row"><span>목소리 A</span><span class="n hot">20.8% · 666Hz</span><span class="chip fail">미통과</span></div>
        <div class="row"><span>목소리 B</span><span class="n">0.0% · 403Hz</span><span class="chip">통과</span></div>
      </div>
    </div>
    <span class="url">synk.im/builds/voice-check</span>
  </div>
  <div class="poster"><span class="label">VOICE CHECK</span><img src="../assets/voice-art-intro.webp" alt=""><span class="word">깨짐</span></div>
</div>
</body>
</html>

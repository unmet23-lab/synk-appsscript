<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og · prompts</title>
<!-- 링크 미리보기(1200×630) 원고. build.mjs prompts가 Chrome으로 og.png를 찍는다.
     싱ㅋ 시그널(move/guide/og.html과 같은 문법): 근사 검정 판 · 두 줄 큰 제목(둘째 줄 회색) · 흰 알약 주소 ·
     청금석 포스터 + 큰 「프롬프트」 + 빈칸이 든 프롬프트 카드와 「복사」 알약. -->
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;src:url(../../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-weight:500;src:url(../../../브랜드_폰트/DM_Mono/DMMono-Medium.ttf);unicode-range:U+0021-007E}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#060709}
body{font-family:'SUIT Variable',sans-serif;color:#FAFAF9;word-break:keep-all;-webkit-font-smoothing:antialiased}
.panel{position:absolute;inset:22px;display:grid;grid-template-columns:1fr 430px;gap:40px;align-items:stretch;padding:34px;border-radius:30px;background:#0C0D10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075)}
.left{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 4px 8px}
.top{display:flex;align-items:center;gap:16px}
.bead{display:grid;place-items:center;height:48px;padding:0 20px;border-radius:999px;background:#FAFAF9}
.bead img{height:28px}
.crumb{font:500 15px/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,250,249,.52)}
h1{margin:0;font-size:64px;font-weight:680;line-height:1.1;letter-spacing:-.035em}
h1 span{color:rgba(250,250,249,.52)}
.sub{margin:22px 0 0;font-size:25px;font-weight:450;line-height:1.45;color:rgba(250,250,249,.72)}
.url{display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 26px;border-radius:999px;background:#FAFAF9;color:#08090C;font:600 24px/1 'SUIT Variable',sans-serif}
.url::before{content:'';width:10px;height:10px;border-radius:50%;background:#3D6BC9;box-shadow:0 0 0 4px rgba(61,107,201,.25)}
.poster{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 85% at 28% -10%,rgba(255,255,255,.16),transparent 58%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.1)),#3D6BC9;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.poster .label{position:absolute;left:24px;top:22px;font:500 14px/1 'DM Mono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.82)}
.card{position:absolute;left:24px;right:24px;top:62px;padding:20px 22px 26px;border-radius:20px;background:rgba(8,9,12,.62);font-size:21px;line-height:1.6;transform:rotate(-1.5deg)}
.card b{color:#FFE08A;font-weight:600}
.card i{position:absolute;right:16px;bottom:-20px;padding:9px 20px;border-radius:999px;background:#FAFAF9;color:#08090C;font-style:normal;font-size:19px;font-weight:650}
.word{position:absolute;left:20px;bottom:14px;font-size:104px;font-weight:900;line-height:.84;letter-spacing:-.06em;color:#fff}
</style>
</head>
<body>
<div class="panel">
  <div class="left">
    <div class="top"><span class="bead"><img src="../assets/logo-synk.webp" alt="synk"></span><span class="crumb">synk / prompts</span></div>
    <div>
      <h1>영상에서 푼 문제,<br><span>그대로 가져가세요</span></h1>
      <p class="sub">빈칸만 바꿔 붙여 넣는 프롬프트.<br>모두 직접 돌려 본 것만 모았어요.</p>
    </div>
    <span class="url">synk.im/prompts</span>
  </div>
  <div class="poster"><span class="label">PROMPTS</span><div class="card"><b>【내 영상 파일】</b>에서 화면이 거의 안 바뀌는 시간을 재 줘. 셈은 이대로 해 줘 —…<i>복사</i></div><span class="word">프롬프트</span></div>
</div>
</body>
</html>

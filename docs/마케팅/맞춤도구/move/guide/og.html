<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og · move</title>
<!-- 링크 미리보기(1200×630) 원고. build.mjs가 Chrome으로 og.png를 찍는다.
     싱ㅋ 시그널(core/signal.css와 같은 문법, katana/guide/og.html이 본보기): 근사 검정 바탕 · 두 줄 큰 제목(둘째 줄 회색) · 흰 알약 주소 ·
     SHIFT 청금석 포스터 + 큰 「이사」 + 펠트 이삿짐 상자 + 상태 칩. -->
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;src:url(../../../../브랜드_폰트/SUIT/SUIT-Variable.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-weight:500;src:url(../../../../브랜드_폰트/DM_Mono/DMMono-Medium.ttf);unicode-range:U+0021-007E}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#060709}
body{font-family:'SUIT Variable',sans-serif;color:#FAFAF9;word-break:keep-all;-webkit-font-smoothing:antialiased}
.panel{position:absolute;inset:22px;display:grid;grid-template-columns:1fr 410px;gap:40px;align-items:stretch;padding:34px;border-radius:30px;background:#0C0D10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075)}
.left{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 4px 8px}
.top{display:flex;align-items:center;gap:16px}
.bead{display:grid;place-items:center;height:48px;padding:0 18px;border-radius:999px;background:#FAFAF9}
.bead img{height:28px}
.crumb{font:500 15px/1 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,250,249,.52)}
h1{margin:0;font-size:66px;font-weight:680;line-height:1.08;letter-spacing:-.035em}
h1 span{color:rgba(250,250,249,.52)}
.sub{margin:22px 0 0;font-size:25px;font-weight:450;line-height:1.45;color:rgba(250,250,249,.72)}
.url{display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 26px;border-radius:999px;background:#FAFAF9;color:#08090C;font:600 24px/1 'SUIT Variable',sans-serif;letter-spacing:0}
.url::before{content:'';width:10px;height:10px;border-radius:50%;background:#3D6BC9;box-shadow:0 0 0 4px rgba(61,107,201,.25)}
.poster{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 85% at 28% -10%,rgba(255,255,255,.16),transparent 58%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.1)),#3D6BC9;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.poster .label{position:absolute;left:24px;top:22px;font:500 14px/1 'DM Mono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.82)}
.poster img{position:absolute;top:62px;right:36px;width:250px;height:auto;filter:drop-shadow(0 22px 26px rgba(0,0,0,.3)) drop-shadow(0 4px 6px rgba(0,0,0,.18));transform:rotate(-3deg)}
.chip{position:absolute;top:18px;right:18px;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:999px;background:rgba(8,9,12,.62);color:#fff;font-size:15px;font-weight:600}
.chip::before{content:'';width:8px;height:8px;border-radius:50%;background:#7DB45A;box-shadow:0 0 0 3px rgba(125,180,90,.25)}
.poster .word{position:absolute;left:22px;bottom:16px;font-size:176px;font-weight:900;line-height:.84;letter-spacing:-.06em;color:#fff}
</style>
</head>
<body>
<div class="panel">
  <div class="left">
    <div class="top"><span class="bead"><img src="../../assets/brand-shift.webp" alt=""></span><span class="crumb">yuhobuilds / move</span></div>
    <div>
      <h1>새 컴퓨터로 이사,<br><span>내 PC에 맞는 목록으로</span></h1>
      <p class="sub">질문 3개 · Windows에서 Windows로<br>절대 두고 가면 안 되는 것부터 확인까지</p>
    </div>
    <div><span class="url">synk.im/builds/move</span></div>
  </div>
  <div class="poster"><span class="label">01 / YUHOBUILDS TOOL</span><span class="chip">실제 이사 기록</span><img src="../../assets/move-art-intro.webp" alt=""><span class="word">이사</span></div>
</div>
</body>
</html>

<!doctype html>

<style>

  * { box-sizing:border-box; margin:0; padding:0; }

  .띠 { position:absolute; top:84px; left:0; right:0; display:flex; gap:14px; }

  figcaption { margin-top:13px; font-size:14px; font-weight:560; letter-spacing:.02em; color:var(--회색); white-space:nowrap; }
  figcaption i { font-style:normal; color:var(--버터); font-weight:700; margin-right:8px; letter-spacing:.06em; }

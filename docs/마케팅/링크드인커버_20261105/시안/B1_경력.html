<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>B1 경력</title>
<!--폰트-->
<style>
  /* 11-05 Fable 심사 반영: 단색 검정 · 흰 글자 · 노란 강조 빼고 굵기로 리듬 · 영어는 synk.im 하나 */
  :root { --검정:#0A0A0A; --흰:#FFFFFF; --옅은:#CFCFCF; --회색:#8A8A8A; --부제:#9A9A9A; --선:#222222; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1584px; height:396px; background:var(--검정); overflow:hidden; }
  body { font-family:'SUIT Variable', sans-serif; color:var(--흰); position:relative; }
  /* 휴대폰에서 사진이 원본 x≈750까지 덮는다 → 글 덩어리는 800부터 */
  .판 { position:absolute; left:806px; right:64px; top:0; bottom:0; }
  .머리 { position:absolute; top:56px; left:0; right:0; display:flex; justify-content:space-between; align-items:baseline;
          font-size:17px; font-weight:560; letter-spacing:.04em; color:var(--회색); }
  .머리 b { color:var(--흰); font-weight:680; }
  .줄 { position:absolute; top:90px; left:0; right:0; height:2px; background:var(--선); }
  h1 { position:absolute; top:126px; left:-3px; font-size:var(--제목, 63px); line-height:1.3; letter-spacing:-.025em; white-space:nowrap; }
  h1 .하나 { display:block; font-weight:500; color:var(--옅은); }
  h1 .둘 { display:block; font-weight:740; color:var(--흰); }
  .발 { position:absolute; top:326px; left:0; font-size:17px; font-weight:480; letter-spacing:.01em; color:var(--부제); }
</style></head>
<body>
  <div class="판">
    <div class="머리"><span><b>양유호</b>&nbsp;&nbsp;·&nbsp;&nbsp;SYNK 대표</span><span>synk.im</span></div>
    <div class="줄"></div>
    <h1><span class="하나">엔터테인먼트·광고 업계 10년.</span><span class="둘">지금은 AI로 직접 만듭니다.</span></h1>
    <div class="발">웹 · 앱 · 광고 영상 · 기업·기관 AI 교육</div>
  </div>
</body></html>

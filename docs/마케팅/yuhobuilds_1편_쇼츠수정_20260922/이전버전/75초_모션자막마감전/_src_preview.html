<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>번역만 하려던 사람의 첫 앱 도전 · yuhobuilds</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #000; font-family: 'SUIT Variable', sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 1160px); margin: 0 auto; padding: 48px 32px 72px; display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: clamp(36px, 6vw, 80px); align-items: start; }
    .screen { position: sticky; top: 32px; }
    .playback { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .playback button { font: inherit; font-size: 14px; padding: 10px 14px; border: 1px solid #ddd; background: white; color: black; border-radius: 8px; cursor: pointer; }
    .playback button:first-child { background: black; color: white; border-color: black; }
    video { display: block; width: 100%; max-height: calc(100dvh - 150px); aspect-ratio: 9 / 16; object-fit: contain; background: #000; }
    article { padding-top: 36px; }
    .eyebrow { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .12em; }
    h1 { margin: 24px 0; font-size: clamp(32px, 3.7vw, 48px); font-weight: 750; line-height: 1.26; letter-spacing: -.055em; word-break: keep-all; text-wrap: balance; }
    .intro { margin: 0; font-size: 20px; line-height: 1.75; letter-spacing: -.02em; word-break: keep-all; }
    .spec { margin: 28px 0 0; font-size: 15px; line-height: 1.6; color: #555; }
    a { color: inherit; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible, summary:focus-visible, video:focus-visible { outline: 2px solid #000; outline-offset: 6px; }
    nav { display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 8px; margin-top: 24px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; font-size: 16px; font-weight: 650; }
    details { margin-top: 30px; }
    summary { width: fit-content; padding: 12px 0; cursor: pointer; font-size: 17px; font-weight: 650; }
    .captions { margin-top: 14px; }
    .caption { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 16px; margin: 0 0 16px; font-size: 16px; line-height: 1.7; white-space: pre-line; word-break: keep-all; }
    .caption-time { padding-top: 2px; color: #666; font-size: 13px; font-variant-numeric: tabular-nums; }
    .caption-empty { color: #666; font-size: 16px; line-height: 1.7; }
    footer { margin-top: 36px; color: #666; font-size: 13px; line-height: 1.8; word-break: keep-all; }
    @media (max-width: 720px) {
      main { display: flex; flex-direction: column; gap: 28px; padding: 20px 22px 44px; }
      .screen { position: static; width: min(100%, 400px); align-self: center; }
      video { max-height: 72dvh; }
      article { width: 100%; padding-top: 0; }
      h1 { max-width: 540px; margin-top: 18px; font-size: clamp(30px, 8.4vw, 42px); }
      .intro { font-size: 18px; }
      .spec { margin-top: 24px; }
      nav { column-gap: 20px; margin-top: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="screen" aria-label="1편 영상">
      <video controls playsinline preload="metadata" poster="poster.png" aria-label="번역만 하려던 사람의 첫 앱 도전">
        <source src="preview-720.webm" type="video/webm">
        영상을 재생할 수 없으면 <a href="yuhobuilds_EP01.mp4" download>영상 파일을 내려받아 주세요.</a>
      </video>
      <div class="playback" aria-label="재생 구간">
        <button type="button" id="play-toggle">영상 재생</button>
        <button type="button" data-time="0">처음부터</button><button type="button" data-time="53.36666666666667">입력 예시</button>
        <button type="button" data-time="28.5">표정·눈물</button>
        <button type="button" data-time="65.76666666666667">마무리</button>
      </div>
    </section>
    <article>
      <p class="eyebrow">YUHO BUILDS · EP.01</p>
      <h1>번역만 하려다,<br>앱 만드는 사람 됨.</h1>
      <p class="intro">처음엔 번역을 도와줄 AI가 필요했어요.<br>그런데 어느새, 학원 출석을 관리할 앱을 만들고 있었습니다.</p>
      <p class="spec">75초 · 정의로 임시 내레이션 · 100시간 오프닝·타건 동기화 수정본</p>
      <nav aria-label="영상 자료">
        <a href="yuhobuilds_EP01.mp4" download>영상 다운로드</a>
        <a href="poster.png" download>표지 다운로드</a>
        <a href="captions.srt" download>자막 파일</a>
      </nav>
      <details>
        <summary>자막 열기</summary>
        <div class="captions" aria-label="영상 자막">
          <!-- CAPTIONS_CONTENT -->
        </div>
      </details>
      <footer>유호의 실제 경험을 바탕으로 재구성한 이야기입니다.</footer>
    </article>
  </main>
  <script>
    const video = document.querySelector('video');
    const toggle = document.querySelector('#play-toggle');
    toggle.addEventListener('click', () => {
      if (video.paused) video.play().catch(() => { toggle.textContent = '다시 재생'; });
      else video.pause();
    });
    video.addEventListener('play', () => { toggle.textContent = '일시 정지'; });
    video.addEventListener('pause', () => { toggle.textContent = '영상 재생'; });
    document.querySelectorAll('[data-time]').forEach(button => button.addEventListener('click', () => {
      video.currentTime = Number(button.dataset.time);
    }));
  </script>
</body>
</html>

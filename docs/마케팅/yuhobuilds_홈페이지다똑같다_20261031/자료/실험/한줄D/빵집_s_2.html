<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀알제과 - 동네 빵집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 기준 물건: 가게 앞 에나멜 간판 (짙은 병녹색 바탕, 금박 글씨, 크림색 테두리 선) */
:root{
  --enamel:#0f3b2e;
  --enamel-deep:#0a2a21;
  --gold:#d9ac4a;
  --gold-soft:#e9cd8a;
  --cream:#f4ead2;
  --rule:rgba(217,172,74,.55);
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--enamel-deep);
  color:var(--cream);
  font-family:'Noto Serif KR',serif;
  line-height:1.7;
  min-height:100vh;
}
.sign{
  max-width:1040px;
  margin:0 auto;
  padding:24px 16px 48px;
}
.board{
  background:
    radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.07), transparent 60%),
    var(--enamel);
  border:3px solid var(--gold);
  outline:1px solid var(--rule);
  outline-offset:-14px;
  border-radius:10px;
  padding:40px 36px 48px;
  position:relative;
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}
.board::before,.board::after{
  content:"";position:absolute;top:18px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--gold-soft),#8a6a24);
}
.board::before{left:18px}.board::after{right:18px}
nav{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  padding:0 20px 18px;
  border-bottom:1px solid var(--rule);
  font-size:15px;letter-spacing:.08em;color:var(--gold-soft);
}
nav ul{list-style:none;padding:0;display:flex;gap:22px;flex-wrap:wrap}
nav a{color:inherit;text-decoration:none}
nav a:hover{color:var(--cream)}
.hero{text-align:center;padding:56px 12px 28px}
.since{
  font-size:14px;letter-spacing:.5em;color:var(--gold-soft);margin-bottom:18px;
}
h1{
  font-family:'Black Han Sans',sans-serif;
  font-weight:400;
  font-size:clamp(64px,13vw,150px);
  line-height:1.05;
  color:var(--gold);
  letter-spacing:.06em;
  text-shadow:0 2px 0 #7a5a1c,0 6px 14px rgba(0,0,0,.5);
}
.ornament{
  display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 20px;
  color:var(--gold);max-width:420px;
}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:var(--rule)}
.lead{
  font-size:clamp(17px,2.4vw,22px);
  max-width:30em;margin:0 auto;color:var(--cream);
}
.cta{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-block;padding:14px 30px;border-radius:999px;
  text-decoration:none;font-weight:600;font-size:16px;letter-spacing:.05em;
  border:2px solid var(--gold);transition:.2s;
}
.btn.fill{background:var(--gold);color:var(--enamel-deep)}
.btn.fill:hover{background:var(--gold-soft)}
.btn.line{color:var(--gold)}
.btn.line:hover{background:rgba(217,172,74,.14)}
.menu{
  margin-top:40px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.menu div{padding:22px 20px;text-align:center;border-right:1px solid var(--rule)}
.menu div:last-child{border-right:0}
.menu b{display:block;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;color:var(--gold);letter-spacing:.04em}
.menu span{font-size:14px;color:var(--gold-soft)}
.menu em{display:block;font-style:normal;margin-top:6px;font-size:15px}
.info{
  margin-top:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:15px;color:var(--gold-soft);padding:0 8px;
}
@media(max-width:640px){
  .board{padding:32px 16px 36px;outline-offset:-10px}
  .menu div{border-right:0;border-bottom:1px solid var(--rule)}
  .menu div:last-child{border-bottom:0}
  nav{justify-content:center}
}
</style>
</head>
<body>
<main class="sign">
  <div class="board">
    <nav>
      <span>동네 빵집</span>
      <ul>
        <li><a href="#menu">오늘의 빵</a></li>
        <li><a href="#story">가게 이야기</a></li>
        <li><a href="#visit">오시는 길</a></li>
      </ul>
    </nav>

    <section class="hero">
      <p class="since">SINCE 1998</p>
      <h1>밀알제과</h1>
      <div class="ornament">&#10022;</div>
      <p class="lead">매일 새벽 네 시, 반죽부터 다시 시작합니다.<br>갓 구운 빵 냄새가 골목 끝까지 닿는 우리 동네 빵집.</p>
      <div class="cta">
        <a class="btn fill" href="#menu">오늘 구운 빵 보기</a>
        <a class="btn line" href="#visit">예약 전화하기</a>
      </div>
    </section>

    <section class="menu" id="menu">
      <div><b>식빵</b><span>매일 아침 7시</span><em>3,800원</em></div>
      <div><b>소보로</b><span>겉바속촉</span><em>2,200원</em></div>
      <div><b>단팥빵</b><span>직접 쑨 팥앙금</span><em>2,500원</em></div>
      <div><b>크림치즈 바게트</b><span>오후 2시 한정</span><em>4,500원</em></div>
    </section>

    <div class="info" id="visit">
      <span>매일 오전 7시 - 오후 8시 (빵이 떨어지면 마감)</span>
      <span>전화 000-0000-0000</span>
    </div>
  </div>
</main>
</body>
</html>

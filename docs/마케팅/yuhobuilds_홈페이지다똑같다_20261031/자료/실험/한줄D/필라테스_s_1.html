<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결 필라테스 스튜디오</title>
<!--
  고른 물건: 스튜디오 출입문 유리에 붙이는 시트지 간판.
  연한 세이지 빛 유리 위에 흰색 컷팅 글씨, 가는 선, 아래쪽 영업시간 표기.
  색: 세이지 유리 #9fb3a6 / 짙은 유리 #6f8a7b / 시트지 흰색 #f6f8f5 / 문틀 먹색 #1f2723
-->
<style>
  :root{
    --glass:#9fb3a6;
    --glass-deep:#6f8a7b;
    --vinyl:#f6f8f5;
    --frame:#1f2723;
    --muted:#dfe8e1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--frame);
    color:var(--vinyl);
    -webkit-font-smoothing:antialiased;
  }
  .door{
    min-height:100vh;
    margin:0 auto;
    max-width:1280px;
    display:grid;
    grid-template-rows:auto 1fr auto;
    background:
      radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.28),transparent 55%),
      linear-gradient(160deg,var(--glass) 0%,var(--glass-deep) 100%);
    border-left:14px solid var(--frame);
    border-right:14px solid var(--frame);
    position:relative;
    overflow:hidden;
  }
  /* 유리에 비친 빛줄기 */
  .door::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.14) 38.3%,rgba(255,255,255,.14) 46%,transparent 46.3%,transparent 52%,rgba(255,255,255,.08) 52.3%,rgba(255,255,255,.08) 54%,transparent 54.3%);
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:28px clamp(24px,5vw,64px);
    border-bottom:1px solid rgba(246,248,245,.55);
    position:relative;
  }
  .brand{font-weight:800;font-size:20px;letter-spacing:.18em}
  nav{display:flex;gap:clamp(16px,3vw,36px);font-size:14px;letter-spacing:.08em}
  nav a{color:var(--vinyl);text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent}
  nav a:hover{border-color:var(--vinyl)}

  main{
    display:grid;
    grid-template-columns:1.25fr .75fr;
    gap:clamp(24px,4vw,64px);
    padding:clamp(40px,8vw,110px) clamp(24px,5vw,64px);
    align-items:end;
    position:relative;
  }
  .sign .eng{
    font-size:13px;letter-spacing:.42em;margin-bottom:28px;font-weight:600;
  }
  h1{
    font-weight:900;
    font-size:clamp(76px,16vw,220px);
    line-height:.95;
    letter-spacing:-.02em;
  }
  h1 small{
    display:block;
    font-size:clamp(22px,3.4vw,44px);
    font-weight:500;
    letter-spacing:.5em;
    margin-top:18px;
    padding-left:.2em;
  }
  .lead{
    margin-top:36px;max-width:30em;
    font-size:clamp(16px,1.6vw,19px);line-height:1.8;font-weight:400;
    color:var(--vinyl);
  }
  .cta{margin-top:38px;display:flex;gap:14px;flex-wrap:wrap}
  .btn{
    display:inline-block;text-decoration:none;
    font-size:15px;font-weight:700;letter-spacing:.06em;
    padding:16px 30px;border:1.5px solid var(--vinyl);
    color:var(--vinyl);transition:.2s;
  }
  .btn.fill{background:var(--vinyl);color:var(--glass-deep)}
  .btn:hover{background:var(--frame);border-color:var(--frame);color:var(--vinyl)}

  /* 문 손잡이 옆 영업 안내 시트 */
  aside.info{
    border:1.5px solid var(--vinyl);
    padding:28px 28px 24px;
    background:rgba(246,248,245,.08);
    backdrop-filter:blur(3px);
  }
  aside.info h2{font-size:13px;letter-spacing:.36em;font-weight:700;margin-bottom:18px}
  .row{
    display:flex;justify-content:space-between;gap:12px;
    padding:11px 0;border-top:1px solid rgba(246,248,245,.45);
    font-size:15px;
  }
  .row b{font-weight:600}
  .row span{font-variant-numeric:tabular-nums;color:var(--muted)}
  .note{margin-top:16px;font-size:13px;line-height:1.7;color:var(--muted)}

  footer{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 32px;
    padding:20px clamp(24px,5vw,64px);
    border-top:1px solid rgba(246,248,245,.55);
    font-size:13px;letter-spacing:.06em;position:relative;
  }
  .handle{
    position:absolute;right:-6px;top:50%;width:10px;height:140px;
    background:var(--frame);border-radius:6px;transform:translateY(-50%);
  }
  @media(max-width:820px){
    .door{border-left-width:6px;border-right-width:6px}
    main{grid-template-columns:1fr}
    nav a:nth-child(n+3){display:none}
  }
</style>
</head>
<body>
<div class="door">
  <header>
    <div class="brand">결 PILATES</div>
    <nav>
      <a href="#class">수업 안내</a>
      <a href="#trainer">강사진</a>
      <a href="#price">수강권</a>
      <a href="#visit">오시는 길</a>
    </nav>
  </header>

  <main>
    <section class="sign">
      <div class="eng">REFORMER &amp; MAT STUDIO</div>
      <h1>결<small>필라테스</small></h1>
      <p class="lead">몸의 결을 따라 천천히 움직입니다. 최대 5인 소그룹 리포머 수업, 첫 방문 때는 자세 체크부터 함께 시작해요.</p>
      <div class="cta">
        <a class="btn fill" href="#trial">체험 수업 예약</a>
        <a class="btn" href="#class">수업 둘러보기</a>
      </div>
    </section>

    <aside class="info" id="visit">
      <h2>OPEN</h2>
      <div class="row"><b>평일</b><span>06:30 – 22:00</span></div>
      <div class="row"><b>토요일</b><span>09:00 – 15:00</span></div>
      <div class="row"><b>일 · 공휴일</b><span>휴무</span></div>
      <div class="row"><b>전화</b><span>02-000-0000</span></div>
      <p class="note">체험 수업은 50분이며 편한 운동복이면 충분합니다. 양말은 매장에서 드려요.</p>
    </aside>
  </main>

  <footer>
    <span>서울시 ○○구 ○○로 00, 2층</span>
    <span>@gyeol.pilates</span>
    <span>밀기 · 당기기 · 숨 쉬기</span>
    <div class="handle" aria-hidden="true"></div>
  </footer>
</div>
</body>
</html>

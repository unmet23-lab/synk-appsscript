<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파란차양 베이커리</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f4e9c;
    --blue-dark:#16396f;
    --cream:#fbf6ea;
    --white:#ffffff;
    --ink:#1d2a44;
    --wheat:#d9a441;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.6;
  }
  .awning{
    height:72px;
    background:repeating-linear-gradient(90deg,var(--blue) 0 56px,var(--white) 56px 112px);
    position:relative;
    box-shadow:0 4px 0 rgba(0,0,0,.06);
  }
  .awning::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-18px;height:18px;
    background:
      radial-gradient(circle at 28px 0,var(--blue) 28px,transparent 29px) 0 0/112px 18px repeat-x,
      radial-gradient(circle at 84px 0,var(--white) 28px,transparent 29px) 0 0/112px 18px repeat-x;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:36px 6vw 8px;
  }
  .logo{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.5rem;color:var(--blue-dark)}
  nav a{margin-left:24px;color:var(--blue-dark);text-decoration:none;font-weight:500}
  nav a:hover{text-decoration:underline}
  .hero{
    text-align:center;
    padding:72px 6vw 80px;
    max-width:820px;margin:0 auto;
  }
  .hero small{letter-spacing:.2em;color:var(--blue);font-weight:700}
  .hero h1{
    font-family:'Gowun Batang',serif;
    font-size:clamp(2.2rem,6vw,3.8rem);
    line-height:1.25;margin:16px 0 20px;color:var(--blue-dark);
  }
  .hero p{font-size:1.1rem;color:#44506a;margin-bottom:32px}
  .btns a{
    display:inline-block;padding:14px 28px;border-radius:999px;
    text-decoration:none;font-weight:700;margin:6px;
  }
  .primary{background:var(--blue);color:#fff}
  .primary:hover{background:var(--blue-dark)}
  .ghost{border:2px solid var(--blue);color:var(--blue)}
  .ghost:hover{background:var(--blue);color:#fff}
  .info{
    background:var(--blue);color:#fff;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:24px;padding:40px 6vw;text-align:center;
  }
  .info h3{font-family:'Gowun Batang',serif;margin-bottom:6px;color:#ffe9b0}
  footer{text-align:center;padding:24px;font-size:.85rem;color:#6b7690}
</style>
</head>
<body>
  <div class="awning" aria-hidden="true"></div>
  <header>
    <div class="logo">파란차양 베이커리</div>
    <nav><a href="#">메뉴</a><a href="#">소개</a><a href="#">오시는 길</a></nav>
  </header>
  <section class="hero">
    <small>SINCE 2014 · 우리 동네 빵집</small>
    <h1>매일 아침, 갓 구운 빵 냄새가<br>파란 차양 아래서 시작돼요</h1>
    <p>국산 밀과 천연 발효종으로 새벽마다 정성껏 굽습니다.<br>문 앞 줄무늬 차양을 보면 오늘도 따끈한 빵이 기다리고 있어요.</p>
    <div class="btns">
      <a class="primary" href="#">오늘의 빵 보기</a>
      <a class="ghost" href="#">예약 주문</a>
    </div>
  </section>
  <section class="info">
    <div><h3>영업시간</h3><p>매일 07:30 – 20:00<br>매주 월요일 휴무</p></div>
    <div><h3>위치</h3><p>우리동네로 12, 1층<br>00역 3번 출구 도보 3분</p></div>
    <div><h3>전화</h3><p>000-0000-0000</p></div>
  </section>
  <footer>© 파란차양 베이커리</footer>
</body>
</html>

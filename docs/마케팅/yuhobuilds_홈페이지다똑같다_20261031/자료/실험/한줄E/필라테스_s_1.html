<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오렌지 매트 필라테스</title>
<style>
  :root{
    --orange:#F26A1B;
    --orange-dark:#C94F0C;
    --cream:#FFF4EA;
    --ink:#2B1A10;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 6vw;
  }
  .logo{font-weight:800;font-size:1.3rem;color:var(--orange-dark);letter-spacing:-0.02em}
  nav a{margin-left:24px;text-decoration:none;color:var(--ink);font-weight:500}
  nav a:hover{color:var(--orange)}
  .hero{
    background:var(--orange);
    color:#fff;
    padding:90px 6vw 110px;
    border-radius:0 0 48px 48px;
    position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-80px;bottom:-80px;
    width:340px;height:340px;border-radius:50%;
    border:40px solid rgba(255,255,255,.15);
  }
  .hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;line-height:1.2;letter-spacing:-0.03em;max-width:12em}
  .hero p{margin-top:20px;font-size:1.15rem;max-width:30em;opacity:.95}
  .btns{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:14px 28px;border-radius:999px;
    font-weight:700;text-decoration:none;font-size:1rem;
  }
  .btn.primary{background:#fff;color:var(--orange-dark)}
  .btn.ghost{border:2px solid #fff;color:#fff}
  .info{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;padding:60px 6vw;
  }
  .card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 6px 20px rgba(242,106,27,.12)}
  .card h3{color:var(--orange-dark);margin-bottom:8px}
  footer{text-align:center;padding:30px;color:#8a6b55;font-size:.9rem}
</style>
</head>
<body>
<header>
  <div class="logo">오렌지 매트 필라테스</div>
  <nav><a href="#">수업 소개</a><a href="#">강사진</a><a href="#">시간표</a><a href="#">상담 문의</a></nav>
</header>

<section class="hero">
  <h1>매트 위에서 시작하는 단단한 하루</h1>
  <p>소규모 그룹 수업과 1:1 맞춤 지도로 자세를 바로잡고, 몸의 중심을 되찾아 드립니다.</p>
  <div class="btns">
    <a class="btn primary" href="#">무료 체험 신청</a>
    <a class="btn ghost" href="#">시간표 보기</a>
  </div>
</section>

<section class="info">
  <div class="card"><h3>소그룹 수업</h3><p>최대 6명, 한 분 한 분 눈을 맞추며 교정합니다.</p></div>
  <div class="card"><h3>1:1 개인 레슨</h3><p>체형과 목표에 맞춘 맞춤 프로그램을 설계합니다.</p></div>
  <div class="card"><h3>운영 시간</h3><p>평일 07:00 - 22:00<br>토요일 09:00 - 15:00</p></div>
</section>

<footer>© 오렌지 매트 필라테스 · 상담 문의 000-0000-0000</footer>
</body>
</html>

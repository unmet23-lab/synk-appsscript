<!doctype html>
<html lang="ko">
<head>

<title>synkbrief 활용 · 사진 1장으로 광고 3컷 · 릴스 표지(cover916)</title>

<link rel="stylesheet" href="assets/synk-kit/kit.css">
<style>

<body data-acc="brief">

  </div>
  <figure class="k-photo" style="position:absolute;left:84px;top:722px;width:290px;--r:-6deg;padding:10px"><div class="ph" style="height:324px"><img src="assets/images/source.webp" alt="원본 머그컵(AI 예시)"></div><figcaption>원본 1장</figcaption></figure>

  <div class="k-foot"><span class="k-logo-tag"><img class="k-logo" src="assets/synk-kit/assets/logo-shift.webp" alt="synk SHIFT"></span><span class="k-handle">@synkbrief</span></div>

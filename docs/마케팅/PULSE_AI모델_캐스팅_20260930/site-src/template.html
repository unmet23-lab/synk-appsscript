<footer class="foot pad"><span>SYNK PULSE · 모델 캐스팅북 · <span id="updated"></span></span><span>이 페이지의 모델 사진은 모두 AI로 만든 가상인물이에요. ‘실제 인물’ 표시가 있는 모델만 실제 사람을 바탕으로 했어요.</span></footer>

<template id="guide-tpl">
  <section class="pad" id="guide" aria-labelledby="guide-title">
    <div class="guide-head"><h2 id="guide-title">쓰기 전에 알아 두세요</h2></div>
    <div class="guide">
      <article>
        <h3>광고에는 ‘가상인물’ 표시가 필요해요</h3>
        <p>2026년 6월 1일부터 AI로 만든 가상인물이 제품을 추천하거나 보증하는 광고에는 가상인물임을 알리는 표시를 해야 해요. 영상은 인물이 나오는 동안 인물 가까이에, 글은 제목이나 첫 부분에 표시해요. 게시 전에 표시 문구와 위치를 함께 확인해 드려요.</p>
        <p class="small">근거: 공정거래위원회 「추천·보증 등에 관한 표시·광고 심사지침」(2026. 6. 1. 시행), 「인공지능 발전과 신뢰 기반 조성 등에 관한 기본법」(2026. 1. 22. 시행). 최종 판단은 광고 매체와 법률 전문가에게 확인해 주세요.</p>
      </article>
      <article>
        <h3>한 번 고른 얼굴은 끝까지 같아요</h3>
        <p>모든 컷은 모델의 대표 사진을 기준으로 만들어요. 새 옷, 새 장면, 다른 헤어가 필요해도 같은 얼굴로 더 만들 수 있어요.</p>
        <p>‘실제 인물’ 표시가 없는 모델은 실제 사람의 사진이나 이름 없이 만든 가상인물이에요. 특정 인물과 닮아 보이면 알려 주세요. 쓰기 전에 얼굴을 조정해 드려요.</p>
      </article>
      <article>
        <h3>사용 범위와 전속은 상담에서 정해요</h3>
        <p>쓸 매체(SNS·상세페이지·옥외 등)와 기간, 같은 업종의 다른 브랜드에 이 모델을 쓰지 않는 업종 전속 여부, 납품 해상도와 사진·영상 수량을 함께 정해요.</p>
      </article>
      <article>
        <h3>목소리는 톤을 들어 보는 용도예요</h3>
        <p>샘플 문장은 톤을 비교하려고 만든 음성이에요. 실제 광고 대사로 다시 만들어 드리고, 다른 언어도 상담할 수 있어요.</p>
        <p>M03 유호는 SYNK 대표 본인의 얼굴과 목소리로, 본인 동의를 받아 만든 모델이에요.</p>
      </article>
    </div>
  </section>
</template>

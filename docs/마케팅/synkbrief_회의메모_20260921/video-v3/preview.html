</style></head><body><main><figure class="player"><video id="video" preload="auto" playsinline poster="snapshots/frame-00-at-0.8s.png"><source src="preview.webm" type="video/webm"><source src="synkbrief-opening-v3.mp4" type="video/mp4"></video><div class="controls"><button class="primary" id="play">재생</button><button id="restart">처음부터</button><button id="mute">소리 끄기</button><time id="time">0:00 / 0:15</time></div><input id="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="영상 재생 위치"></figure><aside><div class="tag">synkbrief · 도입 검토 샘플</div><h1>회의는 끝났는데,<br>누가 뭘 하죠?</h1><p>회의 후의 상황을 그림으로 보여주고,<br>메모가 할 일 표로 정리되는 과정을 이어 붙였습니다.</p><div class="shots"><button data-time="1.8">상황 보기</button><button data-time="6.9">표로 정리</button><button data-time="12.8">핵심 확인</button></div><div class="links"><a class="button" href="synkbrief-opening-v3.mp4" download>MP4 저장</a><a class="button" href="../index.html">이전 98초본</a></div><p class="notice">15초 · 효과음 포함 · 내레이션 미포함<br>전체 사용법 영상의 도입을 검토하는 샘플입니다.</p><p style="font-size:14px">자료 확인: 2026년 9월 22일<br><a href="research.md">공식 자료와 장면 반영 기록</a></p></aside></main><script>
const v=document.getElementById('video'),p=document.getElementById('play'),s=document.getElementById('seek'),m=document.getElementById('mute'),clock=document.getElementById('time');
const fmt=t=>'0:'+String(Math.floor(t)).padStart(2,'0');const sync=()=>{s.value=v.currentTime;clock.textContent=fmt(v.currentTime)+' / '+fmt(Number.isFinite(v.duration)?v.duration:15);p.textContent=v.paused?'재생':'일시정지';};
p.onclick=()=>{if(v.paused){if(v.ended)v.currentTime=0;v.play().catch(()=>{p.textContent='다시 재생';});}else v.pause();};document.getElementById('restart').onclick=()=>{v.currentTime=0;v.play().catch(()=>{});};m.onclick=()=>{v.muted=!v.muted;m.textContent=v.muted?'소리 켜기':'소리 끄기';};s.oninput=()=>{v.currentTime=Number(s.value);sync();};v.addEventListener('timeupdate',sync);v.addEventListener('play',sync);v.addEventListener('pause',sync);v.addEventListener('loadedmetadata',sync);v.addEventListener('ended',sync);document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.pause();v.currentTime=Number(b.dataset.time);sync();});
</script></body></html>

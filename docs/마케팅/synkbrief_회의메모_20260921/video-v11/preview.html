<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>synkbrief · 회의 정리 따라 하기</title><style>
@font-face{font-family:SUIT;src:url('assets/SUIT-Variable.woff2');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:#111;font-family:SUIT,sans-serif}main{display:grid;grid-template-columns:minmax(300px,450px) minmax(300px,430px);gap:52px;justify-content:center;align-items:center;min-height:100svh;padding:28px 24px}.player{margin:0;min-width:0}video{display:block;width:100%;aspect-ratio:9/16;max-height:79svh;object-fit:contain;background:white;border-radius:14px;box-shadow:0 15px 60px #1523401c}.controls{flex-wrap:wrap;display:flex;align-items:center;gap:8px;margin-top:14px}button,a.button{font:700 14px SUIT,sans-serif;cursor:pointer;border:0;border-radius:8px;padding:12px 16px;background:white;color:#111;text-decoration:none}button.primary,a.primary{background:#3D6BC9;color:white}time{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:#526079}input{width:100%;accent-color:#3D6BC9;margin:15px 0 0}h1{font-size:40px;line-height:1.22;letter-spacing:-1.1px;margin:15px 0 20px}p{font-size:17px;line-height:1.75;color:#526079;margin:0 0 21px}.label{color:#3D6BC9;font-size:14px;font-weight:750}.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:24px 0 28px}.chapters button{text-align:left;background:#e4eaf5;font-size:13px;padding:11px}.chapters span{font-size:11px;font-weight:500;color:#526079;margin-left:7px}.downloads{display:flex;gap:8px;flex-wrap:wrap}.notice{font-size:13px;margin-top:19px}.meta{font-size:13px;margin-bottom:18px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8badff;outline-offset:3px}::selection{background:#C5D6F5}a{color:#24448c}a.sub{font-size:13px;display:inline-block;margin-top:14px}@media(max-width:760px){main{grid-template-columns:minmax(0,450px);padding:18px;gap:28px;align-items:start}video{max-height:76svh}h1{font-size:32px}.chapters{margin-top:18px}aside{padding-bottom:30px}}
.video-stage{position:relative;width:min(100%,calc(79svh * 9 / 16));margin-inline:auto;height:auto;aspect-ratio:9/16;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 15px 60px #1523401c}.video-stage video{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}.video-stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}@media(max-width:760px){.video-stage{width:min(100%,calc(76svh * 9 / 16))}}</style></head><body><main><figure class="player"><video id="video" playsinline preload="auto" poster="verification/poster.jpg"><source src="preview.webm?v=14" type="video/webm"><source src="synkbrief-meeting-v11.mp4" type="video/mp4"></video><div class="controls"><button class="primary" id="play">재생</button><button id="restart">처음부터</button><button id="sound" aria-pressed="false">소리 켜짐</button><time id="time">0:00 / 1:52</time></div><input id="seek" type="range" min="0" max="112" value="0" step="0.05" aria-label="영상 재생 위치"></figure><aside><div class="label">synkbrief · 전체 화면부터 클릭 위치까지</div><h1>회의 때 적어둔 메모,<br>여기서부터 시작해요.</h1><p>직접 쓴 메모도, 녹음을 글로 옮긴 내용도.<br>전체 화면 → 위치 확대 → 클릭·입력을 따라 해보세요.</p><div class="meta">112초 · 18장면 · Suno BGM + 효과음 · 내레이션 없음</div><div class="chapters"><button data-time="18.15">기록 준비<span>0:18</span></button><button data-time="24.15">입력창 찾기·확대<span>0:24</span></button><button data-time="29.15">요청문 입력<span>0:29</span></button><button data-time="36.15">메모 붙여넣기<span>0:36</span></button><button data-time="42.15">보내기 버튼<span>0:42</span></button><button data-time="54">정리 전후 비교<span>0:46</span></button><button data-time="62.15">프로젝트란?<span>1:02</span></button><button data-time="69.15">채팅과 차이<span>1:09</span></button><button data-time="75.15">프로젝트 만들기<span>1:15</span></button><button data-time="81.15">설정 위치<span>1:21</span></button><button data-time="86.15">지침 입력·저장<span>1:26</span></button><button data-time="98.15">다음 회의 입력<span>1:38</span></button><button data-time="105.15">자료 받기<span>1:45</span></button></div><div class="downloads"><a class="button primary" href="../follow-along-v11/synkbrief-meeting-kit-v11.zip" download>따라 하기 자료 받기</a><a class="button" href="../output/pdf/synkbrief-meeting-guide-v11.pdf" download>PDF만 받기</a></div><a class="sub" href="synkbrief-meeting-v11.mp4" download>영상 MP4 저장</a><p class="notice">실제 ChatGPT 화면과 같은 메모의 정리 전후 시연을 사용했습니다.<br>기존 Suno 시티팝_147을 사용했습니다. 음성 추가 전 검토본입니다.</p></aside></main><script>
document.getElementById('sound').onclick=()=>{const v=document.getElementById('video');v.muted=!v.muted;document.getElementById('sound').textContent=v.muted?'소리 꺼짐':'소리 켜짐';document.getElementById('sound').setAttribute('aria-pressed',String(v.muted))};const v=document.getElementById('video'),p=document.getElementById('play'),s=document.getElementById('seek'),clock=document.getElementById('time');const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');const sync=()=>{s.value=v.currentTime;clock.textContent=fmt(v.currentTime)+' / '+fmt(Number.isFinite(v.duration)?v.duration:112);p.textContent=v.paused?'재생':'일시정지'};p.onclick=()=>{if(v.paused){if(v.ended)v.currentTime=0;v.play().catch(()=>p.textContent='다시 재생')}else v.pause()};document.getElementById('restart').onclick=()=>{v.currentTime=0;v.play().catch(()=>{})};s.oninput=()=>{v.currentTime=Number(s.value);sync()};for(const e of ['timeupdate','play','pause','loadedmetadata','ended'])v.addEventListener(e,sync);document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.pause();v.currentTime=Number(b.dataset.time);sync();document.querySelector(".video-stage").scrollIntoView({block:"start",behavior:"smooth"})});
</script><script src="preview-display.js?v=8"></script></body></html>

# 2026-10-22: agy-account.py picks the Ultra login for this run (77yuhbs; unmet25 only when a 77yuhbs
# Gemini window is under 10% or its check fails), then execs the same official CLI command.
# Rollback: remove this file from the 7 role service.d folders and daemon-reload.
[Service]
ReadWritePaths=-/var/lib/synk-argon-unmet25
ExecStart=
ExecStart=/usr/bin/flock --exclusive --nonblock --conflict-exit-code 75 --close /var/lib/synk-argon-77yuhbs/run.lock /usr/bin/python3 -I /opt/synk-argon-77yuhbs/agy-account.py launch %N -- /opt/synk-argon-77yuhbs/bin/agy --input-format stream-json --output-format stream-json --model gemini-4-argon-high --print-timeout 45m --disable-slash-commands

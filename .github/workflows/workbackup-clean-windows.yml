name: workbackup-clean-windows

# 업무 백업 1단계의 깨끗한 Windows 연습(experiences/solo-backup-rust/STAGE1_DESIGN.md 4.10 · 4.11 · 7장 T6 · T12 · T19).
# build: 배포 판과 NSIS 설치기를 이 원천에서 한 번 빌드한다.
# install: 컴퓨터 전체 설치기(4.2 「컴퓨터 전체 설치」) — 조용히 설치, 파일 · 권한 · 등록 · 바로 가기 · 작업 폴더, 표준 사용자 등록,
#   다시 설치, 지우기(test-support/installer-check.ps1).
# update: 이 실행에서 만든 버리는 시험 열쇠(운영 · 비상 · 엉뚱한 열쇠)로 0.7.0 · 0.7.1 · 0.7.2를 빌드해, 서명이 맞는 묶음만 깔리고
#   틀린 묶음 · 다른 열쇠 · 판 번호가 안 맞는 묶음은 거절되며 갱신 뒤 회차 작업과 사용자 상태가 남는지 본다. 0.7.2는 비상 열쇠로
#   서명해, 운영 열쇠의 확인이 실패한 뒤 비상 열쇠로 다시 확인해 까는지 본다(test-support/clean-update.ps1). 실제 서명 열쇠는 쓰지 않는다.
# backup → restore: 실행기 1에서 관리자와 표준 사용자가 합성 자료 D0를 백업하고(잠긴 파일의 부분 판, 표준 사용자는 섀도 복사본 없음),
#   다른 깨끗한 실행기 2가 복구 키로 되살려 해시를 전수 대조한다(clean-backup.ps1 · clean-restore.ps1). 복구 키는 CI 씨앗 비밀값으로
#   봉해 하루만 넘긴다. 저장소 이름과 비밀값을 쓰는 갈래는 이 저장소에서만 돈다. 포크의 PR은 이 작업 흐름을 띄우지 않는다
#   (pull_request · pull_request_target 계기를 두지 않는다).
# 지금 엔진의 클라우드 저장소는 버킷의 `work-backup/<id>`라 CI 시험 출입증(`ci/`)으로 쓸 수 없어, 실제 B2 갈래는 개통 서버와 함께 더한다.
# 운영자 PC에는 설치하지 않는다(이 PC 시험 설치는 유호님과 함께 — T13).
on:
  push:
    paths:
      - 'experiences/solo-backup-rust/**'
      - '!experiences/solo-backup-rust/**/*.md'
      - '!experiences/solo-backup-rust/ui-mockups/**'
      - 'experiences/solo-backup/ui/**'
      - 'tools/lib/브랜드폰트.js'
      - 'docs/브랜드_폰트/SUIT/SUIT-Variable.woff2'
      - '.github/workflows/workbackup-clean-windows.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 0'

permissions:
  contents: read

# Every run finishes: a newer push waits (only the newest waiting run is kept) instead of cancelling the one in
# progress, so 「연속 통과」 can be counted.
concurrency:
  group: workbackup-clean-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiences/solo-backup-rust/
            !/experiences/solo-backup-rust/ui-mockups/
            /experiences/solo-backup/ui/
            /tools/lib/브랜드폰트.js
            /docs/브랜드_폰트/SUIT/SUIT-Variable.woff2
            /docs/브랜드_폰트/SUIT/LICENSE_OFL.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: prepare the build tools
        uses: ./experiences/solo-backup-rust/test-support/build-tools
      - name: build the release and its installer from these sources
        shell: pwsh
        run: |
          & (Join-Path $env:SWB_APP 'scripts/build.ps1') -ResticPath $env:SWB_RESTIC -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wb-out') `
            -InventoryBinDirectory (Join-Path $env:RUNNER_TEMP 'wb-inventory/release') -TargetDirectory (Join-Path $env:RUNNER_TEMP 'wb-target')
      - name: build the schedule probe (registers a user's runs the way the app does)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'wb-target'
          cargo build --locked --example schedule_probe --manifest-path (Join-Path $env:SWB_APP 'src-tauri/Cargo.toml')
          if ($LASTEXITCODE -ne 0) { throw 'schedule probe build failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wb-target/debug/examples/schedule_probe.exe') (Join-Path $env:RUNNER_TEMP 'wb-out')
      - uses: actions/upload-artifact@v4
        with:
          name: workbackup-build
          retention-days: 3
          path: |
            ${{ runner.temp }}/wb-out/*-setup.exe
            ${{ runner.temp }}/wb-out/build-receipt.json
            ${{ runner.temp }}/wb-out/schedule_probe.exe

  install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /experiences/solo-backup-rust/test-support/
      - uses: actions/download-artifact@v5
        with:
          name: workbackup-build
          path: ${{ runner.temp }}/wb-out
      - name: install, check, register as a standard user, install again, uninstall, check
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'wb-out'
          $setup = @(Get-ChildItem -LiteralPath $out -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected one installer in the build output, found $($setup.Count)" }
          & 'experiences/solo-backup-rust/test-support/installer-check.ps1' -Setup $setup[0].FullName -Receipt (Join-Path $out 'build-receipt.json') `
            -Probe (Join-Path $out 'schedule_probe.exe') -Work (Join-Path $env:RUNNER_TEMP 'install-check')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbackup-install
          path: |
            ${{ runner.temp }}/wb-out/build-receipt.json
            ${{ runner.temp }}/install-check/*.json
          if-no-files-found: warn

  update:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SWB_FEED_PORT: '18732'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiences/solo-backup-rust/
            !/experiences/solo-backup-rust/ui-mockups/
            /experiences/solo-backup/ui/
            /tools/lib/브랜드폰트.js
            /docs/브랜드_폰트/SUIT/SUIT-Variable.woff2
            /docs/브랜드_폰트/SUIT/LICENSE_OFL.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: prepare the build tools
        uses: ./experiences/solo-backup-rust/test-support/build-tools
      # A key pair made here and thrown away with the runner, and a second one a forger might have. Not the release key,
      # which never leaves the signing PC (4.10).
      - name: make throwaway signing keys and the test build settings
        shell: pwsh
        run: |
          $keys = Join-Path $env:RUNNER_TEMP 'keys'
          New-Item -ItemType Directory -Force -Path $keys | Out-Null
          $tauri = Join-Path $env:SWB_APP 'node_modules/@tauri-apps/cli/tauri.js'
          foreach ($name in 'good', 'recovery', 'wrong') {
            node $tauri signer generate --ci -p clean-test -w (Join-Path $keys "$name.key") | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "key $name not made" }
          }
          $pub = (Get-Content -LiteralPath (Join-Path $keys 'good.key.pub') -Raw).Trim()
          $recovery = (Get-Content -LiteralPath (Join-Path $keys 'recovery.key.pub') -Raw).Trim()
          # The release build's own keys are replaced by this run's throwaway ones, the recovery key included (4.10).
          foreach ($version in '0.7.0', '0.7.1', '0.7.2') {
            @{ version = $version; plugins = @{ updater = @{ pubkey = $pub; endpoints = @("http://127.0.0.1:$($env:SWB_FEED_PORT)/workbackup.json"); dangerousInsecureTransportProtocol = $true }; synkUpdate = @{ recoveryPubkey = $recovery } } } |
              ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "override-$version.json") -Encoding utf8
          }
      - name: build 0.7.0, 0.7.1 and 0.7.2 for the test
        shell: pwsh
        run: |
          foreach ($version in '0.7.0', '0.7.1', '0.7.2') {
            & (Join-Path $env:SWB_APP 'scripts/build.ps1') -ResticPath $env:SWB_RESTIC -OutputDirectory (Join-Path $env:RUNNER_TEMP "wb-$version") `
              -InventoryBinDirectory (Join-Path $env:RUNNER_TEMP 'wb-inventory/release') -TargetDirectory (Join-Path $env:RUNNER_TEMP 'wb-target') `
              -ConfigOverride (Join-Path $env:RUNNER_TEMP "override-$version.json")
          }
      - uses: actions/download-artifact@v5
        with:
          name: workbackup-build
          path: ${{ runner.temp }}/wb-out
      - name: refuse what is not ours, update in place to what is
        shell: pwsh
        run: |
          $a = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'wb-0.7.0') -Filter '*-setup.exe')[0].FullName
          $b = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'wb-0.7.1') -Filter '*-setup.exe')[0].FullName
          $c = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'wb-0.7.2') -Filter '*-setup.exe')[0].FullName
          & (Join-Path $env:SWB_APP 'test-support/clean-update.ps1') -SetupA $a -SetupB $b -SetupC $c -ReceiptB (Join-Path $env:RUNNER_TEMP 'wb-0.7.1/build-receipt.json') `
            -Keys (Join-Path $env:RUNNER_TEMP 'keys') -Tauri (Join-Path $env:SWB_APP 'node_modules/@tauri-apps/cli/tauri.js') `
            -Probe (Join-Path $env:RUNNER_TEMP 'wb-out/schedule_probe.exe') -Work (Join-Path $env:RUNNER_TEMP 'update-check') -Port ([int]$env:SWB_FEED_PORT)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbackup-update
          path: ${{ runner.temp }}/update-check/update-results.json
          if-no-files-found: warn

  backup:
    needs: build
    if: ${{ github.repository == 'unmet23-lab/synk-appsscript' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WORKBACKUP_CI_SEED: ${{ secrets.WORKBACKUP_CI_SEED }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /experiences/solo-backup-rust/test-support/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: workbackup-build
          path: ${{ runner.temp }}/wb-out
      - name: back up synthetic data as an administrator and as a standard user
        shell: pwsh
        run: |
          if (-not $env:WORKBACKUP_CI_SEED) { throw 'the CI seed secret is missing' }
          $out = Join-Path $env:RUNNER_TEMP 'wb-out'
          & 'experiences/solo-backup-rust/test-support/clean-backup.ps1' -Setup @(Get-ChildItem -LiteralPath $out -Filter '*-setup.exe')[0].FullName `
            -Probe (Join-Path $out 'schedule_probe.exe') -Work (Join-Path $env:RUNNER_TEMP 'backup-work') -Carry (Join-Path $env:RUNNER_TEMP 'carry')
      # Repositories (restic-encrypted), hash lists of synthetic data and the recovery kits sealed with the CI seed.
      - uses: actions/upload-artifact@v4
        with:
          name: workbackup-carry
          retention-days: 1
          path: ${{ runner.temp }}/carry/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbackup-backup-results
          path: ${{ runner.temp }}/carry/backup-results.json
          if-no-files-found: warn

  restore:
    needs: [build, backup]
    if: ${{ github.repository == 'unmet23-lab/synk-appsscript' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WORKBACKUP_CI_SEED: ${{ secrets.WORKBACKUP_CI_SEED }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /experiences/solo-backup-rust/test-support/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: workbackup-build
          path: ${{ runner.temp }}/wb-out
      - uses: actions/download-artifact@v5
        with:
          name: workbackup-carry
          path: ${{ runner.temp }}/carry
      - name: restore both backups on a fresh Windows and compare every file
        shell: pwsh
        run: |
          if (-not $env:WORKBACKUP_CI_SEED) { throw 'the CI seed secret is missing' }
          & 'experiences/solo-backup-rust/test-support/clean-restore.ps1' -Setup @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'wb-out') -Filter '*-setup.exe')[0].FullName `
            -Carry (Join-Path $env:RUNNER_TEMP 'carry') -Work (Join-Path $env:RUNNER_TEMP 'restore-work')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbackup-restore-results
          path: ${{ runner.temp }}/restore-work/restore-results.json
          if-no-files-found: warn

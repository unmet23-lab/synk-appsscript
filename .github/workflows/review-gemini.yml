# 노트북 없는 검수 ② — 제미나이 (안 B · 정찰 지면 docs/교차검수_재설계_정찰_2026-09-02.html §8)
#
# 🔴 스위치 — 저장소 변수 `SYNK_REVIEW_GITHUB` = `on` 일 때만 뜬다(review-claude.yml 과 같은 스위치).
# 🔒 시크릿 — `GEMINI_API_KEY_FREE` : **공짜 몫** 열쇠(글 전용). mn-check-eval.yml 과 **같은 열쇠를 나눠 쓴다**.
#    🔴 유호 확정 09-05 「㉯로 가자」 — 돈 쪽 열쇠(`GEMINI_API_KEY`)를 새로 맡기지 않고 이미 맡긴 공짜 몫을 쓴다.
#      09-03 에 유호님이 「글=공짜 · 그림·음악=돈」으로 가르셨고, 검수는 «글»이라 이쪽이 제자리다.
#    🔴 **몫을 나눈다** — 공짜 몫은 하루 20발이고 몽골어 검문이 14발을 먼저 쓴다(17:30 KST). 검수에 남는 것은
#      **하루 6발**. 몫이 말라 이 잡이 못 돌면 그것은 「통과」가 아니라 «못 쟀다»이고, review-judge 가
#      「응답 벤더 2 미만 = pending」으로 그 사실을 도장에 적는다(초록으로 새지 않는다).
#    ⚠ 무료 등급은 입력이 구글 제품 개선에 쓰인다 — 이 저장소는 공개 코드뿐이라 같은 선 위에 있지만,
#      학생을 식별하는 데이터가 든 PR 은 이 워크플로가 보게 두지 않는다(그런 데이터는 애초에 저장소에 없어야 한다).
# 📐 공식 예제(google-github-actions/run-gemini-cli · examples/workflows/pr-review · v0.1.22) 를 pull_request 직결로 줄인 것.
# 🛡 같은 저장소 브랜치의 PR 만 본다. 자동 승인·자동 수정 없음.
name: review-gemini

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-gemini-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  review:
    if: ${{ vars.SYNK_REVIEW_GITHUB == 'on' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare prompt context
        run: |
          mkdir -p .gemini
          jq -n --arg repo "${REPOSITORY}" --arg pr "${PULL_REQUEST_NUMBER}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: "규칙 = AGENTS.md 「Code Review Rules」. 한국어. P0/P1/P2/P3. 값비싼 변경은 명시. 끝에 읽은 파일·안 본 것. 총평 첫 줄은 [review-gemini], 둘째 줄은 합의표식: P0=<n> P1=<n>"}' > .gemini/context.json
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

      # 모델은 **저장소 정본에서 읽는다**(vars.GEMINI_MODEL 이 아니라) — 2026-09-03.
      # 옛 판은 GitHub 저장소 변수를 읽었는데 그 변수는 실제로 **0개**였고(09-03 `gh variable list` 실측),
      # 그러면 이 레인만 조용히 액션 기본 모델로 돌아 「정본 = tools/모델정책.js」가 거짓이 된다.
      # 한 값을 두 곳이 알면 갈리고, 갈라진 쪽은 조용하다(constant-known-in-two-places).
      # 🔴 열쇠가 비면 «조용히 안 돈 것»이 되고, 그 침묵은 초록과 구별이 안 된다. 먼저 물어서 세운다
      #    (mn-check-eval.yml 이 같은 자리에 같은 검사를 두고 있다 — 자를 한 곳에서만 다르게 두지 않는다).
      - name: Check the free-tier key is actually there
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FREE }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::시크릿 GEMINI_API_KEY_FREE 가 비어 있다 — 이건 「검수 통과」가 아니라 «안 돌렸다»다."
            exit 1
          fi
          echo "공짜 몫 열쇠가 있다(값은 안 찍는다)."

      - name: Resolve model from repo policy
        # 🔴 id 는 **ASCII 만** 쓴다 — 한글을 쓰면 GitHub 이 파일 전체를 파싱하지 못한다.
        #   09-03 에 `id: 모델` 로 넣었다가 이 워크플로가 **100건 연속 실패**했다(성공 0):
        #   이름을 못 읽어 목록에 «경로»로 뜨고, 트리거(`on: pull_request`)를 못 읽어 모든 push 에
        #   반응하며, 잡을 하나도 못 만든 채 끝난다(로그 0건 · 그래서 사유가 안 보인다).
        #   같은 무늬 = 기억 `workflow-schema-ascii-keys`(밖으로 «키»로 나가는 낱말은 ASCII).
        id: model
        run: |
          M=$(node -e "process.stdout.write(require('./tools/모델정책.js').제미나이설정().model)")
          if [ -z "$M" ]; then echo "::error::모델정책.js 에서 제미나이 픽을 못 읽었다 — 이건 「기본값으로 돈다」가 아니라 «확인 불가»다"; exit 1; fi
          echo "id=$M" >> "$GITHUB_OUTPUT"
          echo "제미나이 검수 모델 = $M (정본 = tools/모델정책.js)"

      - name: Gemini pull request review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_FREE }}
          # 🔴 09-05: 이 잡이 «성공 도장을 받고 7.8초 만에 조용히» 끝났다(run 33922839253).
          #   남은 자취는 `##[warning]Gemini CLI stderr was not valid JSON` 한 줄뿐이라 원인을
          #   못 잡았다. 디버그를 켜면 CLI 가 stderr 에 사람이 읽는 줄을 남긴다.
          GEMINI_DEBUG: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_FREE }}
          gemini_model: ${{ steps.model.outputs.id }}
          workflow_name: gemini-review
          github_pr_number: ${{ github.event.pull_request.number }}
          settings: |
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": ["add_comment_to_pending_review", "pull_request_read", "pull_request_review_write"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": [] }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/pr-code-review'

      # 🔴 09-05 에 이 잡이 **말 한 마디 없이 초록**을 냈다. 그 침묵은 「지적할 게 없다」와 구별이
      #   안 되고, 심판은 그것을 pending 으로 세지만 **이 잡 자신은 성공으로 남아** 다음 사람이
      #   「제미나이도 봤다」로 읽는다. 우리 프롬프트는 지적이 0건이어도 총평 한 개를 요구하므로,
      #   코멘트가 0 이면 그것은 «검수 통과»가 아니라 «안 돌았다»다.
      - name: The reviewer must have actually spoken
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          sleep 20   # 코멘트가 늦게 붙는 창을 준다
          N=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '[.[] | select((.user.login|ascii_downcase|test("gemini")) or (.body|test("\\[review-gemini\\]")))] | length')
          echo "제미나이가 남긴 말: ${N}건"
          if [ "${N:-0}" -eq 0 ]; then
            echo "::error title=제미나이가 침묵했다::검수가 한 마디도 안 남겼다 — 이건 「지적 0건」이 아니라 «안 돌았다»다. 위 Run Gemini CLI 로그의 stderr 를 본다."
            exit 1
          fi

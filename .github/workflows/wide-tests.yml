name: wide-tests

# 루트 tests/*.test.js 밖의 시험(루트 .mjs·.cjs, 회사 서버, PC 앱, 경험 앱, tools)을 묶음마다 돌린다(2026-10-22).
# 기준선(tests/ci넓은시험_알려진실패.json)에 적힌 실패는 빨강으로 치지 않고, 늘어난 실패만 빨강이다 — tools/ci넓은시험.js.
# 기준선 파일이 없으면 이번 실패를 기준선 후보로 올리기만 한다(그 후보로 기준선을 적는다).
on:
  push:
    # syntax-check.yml과 같은 기록 전용 경로는 띄우지 않는다.
    paths-ignore:
      - 'docs/_ops/트랙.md'
      - 'docs/_ops/결정.md'
      - 'docs/_ops/보관/**'
      - 'docs/_ops/*.jsonl'
      - 'docs/현장노트/**'
  schedule:
    - cron: '30 18 * * *' # 매일 03:30 KST — push가 안 건드린 바뀜(남의 저장소 계약 등)도 하루 한 번은 본다
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wide:
    if: ${{ github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        bundle: [루트, 회사, desktop, experiences, tools]
    defaults:
      run:
        working-directory: SYNK-appsscript
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: SYNK-appsscript
      # 형제 저장소 SYNK-talk에서 시험이 읽는 파일만 받는다(syntax-check.yml과 같은 읽기 열쇠, 2026-10-22). 형제를 쓰는 시험은
      # 저마다 특정 파일이 있을 때만 켜진다 — 이 목록에 없는 파일(예: lib/world-v1-server.js)을 찾는 WORLD 실제 브라우저 시험은 그대로 건너뛴다.
      - name: checkout SYNK-talk test inputs
        if: ${{ vars.SYNK_TALK_CI == 'on' && (matrix.bundle == '루트' || matrix.bundle == 'desktop' || matrix.bundle == 'experiences') }}
        uses: actions/checkout@v5
        with:
          repository: unmet23-lab/SYNK-talk
          ref: master
          ssh-key: ${{ secrets.SYNK_TALK_READ_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: SYNK-talk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /lib/sha256.js
            /lib/플래그.js
            /lib/synk-account-lifecycle.js
            /lib/synk-account-restore-export.js
            /lib/synk-care-push-worker.js
            /lib/world-v1-catalog.js
            /lib/자격증명.js
            /supabase/functions/_shared/synk-play-runtime.js
            /supabase/migrations/
            /tests/lib/account-lifecycle-fixture.js
            /tests/lib/play-fixture.js
            /tests/lib/postgres-json-fixture.js
            /tools/synk-account-restore-export.js
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: install dependencies
        timeout-minutes: 8
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          BUNDLE: ${{ matrix.bundle }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "$BUNDLE" = "desktop" ]; then (cd desktop && npm ci --ignore-scripts --no-audit --no-fund); fi
          if [ "$BUNDLE" = "experiences" ]; then (cd experiences/synk-account && npm ci --ignore-scripts --no-audit --no-fund); fi
          # 영상·납품 묶음 시험이 ffmpeg를 부른다 — 10-21 첫 실행에서 회사 19·루트 5개가 「spawn ffmpeg ENOENT」였다.
          # 경험 앱은 초보 게임 음성 시험이 후처리 도구(ffmpeg·ffprobe)를 확인한다(10-22).
          if [ "$BUNDLE" = "회사" ] || [ "$BUNDLE" = "루트" ] || [ "$BUNDLE" = "experiences" ]; then
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              # Azure mirrorlist는 작은 색인은 받아도 큰 패키지에서 멈췄다. 이 설치만 Ubuntu 공식 HTTPS 원천을 쓴다.
              media_sources="$RUNNER_TEMP/synk-media-ubuntu.list"
              printf '%s\n' \
                'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse' \
                'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse' \
                'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse' > "$media_sources"
              apt_bounded() {
                local limit="$1" status=0
                shift
                for attempt in 1 2; do
                  if timeout --kill-after=5s "$limit" sudo apt-get -o "Dir::Etc::sourcelist=$media_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=30 "$@"; then
                    return 0
                  else
                    status=$?
                  fi
                  echo "::warning::APT attempt $attempt failed ($status): $*"
                done
                return "$status"
              }
              apt_bounded 90s update
              apt_bounded 120s install -y --no-install-recommends ffmpeg
            fi
            ffmpeg -version >/dev/null
            ffprobe -version >/dev/null
          fi
      # 형제 저장소 자리의 시험 도구 — PC에서 형제 저장소의 node_modules가 하는 몫을 시험이 쓰는 꾸러미만으로 채운다(앱 의존성 Expo 등은 받지 않는다).
      # SYNK-talk 쪽(PGlite·postgres·postcss)은 그 저장소 lock의 판 그대로, parse5는 PC의 SYNK-website 판이다.
      - name: sibling repository test tools
        if: ${{ matrix.bundle == '루트' || matrix.bundle == 'desktop' || matrix.bundle == 'experiences' }}
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/sibling-deps"; mkdir -p "$deps"
          # SYNK-talk lock에 있으면 그 판, 없으면(SYNK-talk을 못 받은 run) 이 PC의 판 — postcss·parse5는 형제 저장소를 못 받아도 깐다.
          talk() { node -e "const f='../SYNK-talk/package-lock.json',p=require('fs').existsSync(f)?require(f).packages||{}:{},v=(p['node_modules/'+process.argv[1]]||{}).version;console.log(v?process.argv[1]+'@'+v:process.argv[2])" "$1" "$2"; }
          pkgs="parse5@8.0.1 $(talk postcss postcss@8.5.28)"
          if [ -f ../SYNK-talk/package-lock.json ]; then pkgs="$pkgs $(talk @electric-sql/pglite '') $(talk postgres '')"; fi
          (cd "$deps" && npm init -y >/dev/null && npm install --no-audit --no-fund --ignore-scripts $pkgs)
          if [ -d ../SYNK-talk ] || [ "$BUNDLE" = "루트" ]; then mkdir -p ../SYNK-talk && ln -s "$deps/node_modules" ../SYNK-talk/node_modules; fi
          if [ "$BUNDLE" = "루트" ]; then
            mkdir -p ../SYNK-website && ln -s "$deps/node_modules" ../SYNK-website/node_modules
            # 헤르메스 검증 도구(tools/hermes-synk/validation-*.cjs — 운영 감시가 해시로 묶은 계약 파일이라 고치지 않는다)는 PC 배치에서
            # 실행 도구를 찾는다: ajv·typescript·react는 영상/node_modules, source-map(0.5 동기 API)은 저장소 node_modules,
            # Playwright는 Codex 런타임 자리, parse5·postcss는 형제 저장소 자리. CI가 그 배치를 흉내 낸다.
            (cd 영상 && npm ci --ignore-scripts --no-audit --no-fund)
            npm install --no-save --no-audit --no-fund --ignore-scripts source-map@0.5.7
            codex="$HOME/.cache/codex-runtimes/codex-primary-runtime/dependencies/node"
            mkdir -p "$codex" && ln -s "$PWD/node_modules" "$codex/node_modules"
          fi
      - name: public release assets
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: node tools/ci넓은시험.js 자산받기 "$BUNDLE"
      - name: run tests (기준선보다 늘어난 실패만 빨강)
        env:
          BUNDLE: ${{ matrix.bundle }}
          # 운영 서버를 쓰지 않는 격리 fixture에서 실제 Linux flock의 120초 대기까지 확인한다.
          SYNK_TEST_REAL_BACKUP_LOCK_TIMEOUT: ${{ matrix.bundle == '회사' && '1' || '0' }}
        run: |
          if [ -f tests/ci넓은시험_알려진실패.json ]; then
            node tools/ci넓은시험.js "$BUNDLE" --후보 "$RUNNER_TEMP/wide-baseline.json"
          else
            node tools/ci넓은시험.js "$BUNDLE" --기준선 "$RUNNER_TEMP/wide-baseline.json"
          fi
      - name: 기준선 후보 올리기
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wide-baseline-${{ strategy.job-index }}
          path: ${{ runner.temp }}/wide-baseline.json
          retention-days: 5
          if-no-files-found: ignore

name: windows-check

# Windows 파일 시스템·가짜 자격 증명 회귀(2026-10-20 syntax-check.yml에서 떼어 냄). 이 검사가 받는 파일이 바뀐 push에만 뜬다 —
# 아래 paths는 sparse-checkout 목록 + 이 워크플로 파일과 같아야 한다(tests/ci읽기대조.test.js가 대조한다).
on:
  push:
    paths:
      - 'tests/prism래칫회귀.test.js'
      - 'tests/sns-발행.test.js'
      - 'tests/_git밖.js'
      - 'tools/prism래칫.js'
      - 'tools/lib/sns-publisher.js'
      - 'tools/lib/sns-dm.js'
      - 'tools/sns-자격.ps1'
      - '.github/workflows/windows-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-specific:
    if: ${{ github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/prism래칫회귀.test.js
            /tests/sns-발행.test.js
            /tests/_git밖.js
            /tools/prism래칫.js
            /tools/lib/sns-publisher.js
            /tools/lib/sns-dm.js
            /tools/sns-자격.ps1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: run Windows filesystem and mocked credential regressions
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os');console.log(JSON.stringify({temp:os.tmpdir(),real:fs.realpathSync(os.tmpdir()),native:fs.realpathSync.native(os.tmpdir())}))"
          $testLog = Join-Path $env:RUNNER_TEMP 'synk-windows.tap'
          node --test --test-reporter=tap --test-reporter-destination=$testLog --test-name-pattern='^Windows' tests/prism래칫회귀.test.js tests/sns-발행.test.js
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath $testLog
          if ($testExit -ne 0) { exit $testExit }
          $summary = Get-Content -LiteralPath $testLog -Raw
          if (-not ($summary -match '(?m)^# pass (?<passed>\d+)\r?$') -or [int]$Matches['passed'] -lt 4) { throw 'Expected all four Windows regressions to execute' }
          if ($summary -notmatch '(?m)^# skipped 0\r?$') { throw 'Windows-specific regressions must not be skipped here' }

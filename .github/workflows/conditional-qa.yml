name: conditional-qa

# All pushes on the operating branch get an exact-commit receipt. No fork/PR code is sent to the PC.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conditional-${{ github.sha }}
  cancel-in-progress: false

jobs:
  hosted:
    if: ${{ github.repository == 'unmet23-lab/synk-appsscript' && github.ref == 'refs/heads/master' && (github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            route: windows
          - os: ubuntu-24.04
            route: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: support long Windows source paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.[pP][nN][gG]
            !*.[jJ][pP][gG]
            !*.[jJ][pP][eE][gG]
            !*.[wW][eE][bB][pP]
            !*.[wW][aA][vV]
            !*.[mM][pP]3
            !*.[mM]4[aA]
            !*.[mM][pP]4
            !*.[mM][oO][vV]
            !*.[wW][eE][bB][mM]
            !*.[oO][nN][nN][xX]
            !*.[wW][aA][sS][mM]
            !*.[pP][dD][fF]
            !*.[hH][dD][rR]
            !*.[gG][lL][bB]
            !*.[bB][lL][eE][nN][dD]
            /desktop/assets/**
            /docs/마케팅/맞춤도구/voice/samples/**
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: install the Windows archive test dependency
        if: runner.os == 'Windows'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: install the actual Electron runtime for ASAR virtualization
        if: runner.os == 'Windows'
        run: node desktop/node_modules/electron/install.js
      # S116 — the zip hash pins the official release, and the engine checks the exe hash again when it opens.
      - name: install the work backup test dependency and the pinned restic
        if: runner.os == 'Windows'
        run: |
          npm ci --prefix experiences/solo-backup --ignore-scripts --no-audit --no-fund
          $folder = Join-Path $env:RUNNER_TEMP 'solo-backup-restic'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $zip = Join-Path $folder 'restic.zip'
          Invoke-WebRequest -Uri 'https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_windows_amd64.zip' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash -Algorithm SHA256 -Path $zip).Hash -ne 'da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d') { throw 'restic ZIP SHA-256 mismatch' }
          Expand-Archive -Path $zip -DestinationPath $folder
      - name: build current Rust source and install media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path tools/text-compare-bench/rust/Cargo.toml
      # S117–S119 · S128 — tools/컷연속성검사.py needs NumPy · Pillow · OpenCV · SciPy (and ffmpeg above). The versions are the ones
      # verified on the PC, and every wheel is pinned by SHA-256, so a changed or missing file is red instead of a skip.
      - name: set up Python for the cut continuity image tests
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: install the pinned image libraries for the cut continuity tests
        if: runner.os == 'Linux'
        run: |
          requirements="$RUNNER_TEMP/cut-continuity-requirements.txt"
          cat > "$requirements" <<'EOF'
          numpy==2.5.2 --hash=sha256:318b9a4c845dbea06708a29c84ee429cc3065048db34cdb799047643492050ee
          pillow==12.3.0 --hash=sha256:251bf95b67017e27b13d82f5b326234ca62d70f9cf4c2b9032de2358a3b12c7b
          opencv-python-headless==5.0.0.93 --hash=sha256:ed709fdf9aa0bd1f2ed8549e71d19449b03a675bb581eb292285f6861953be37 --hash=sha256:09a872a157c1376ab922a69bbf22f9a95bcc7b658a9d8b436a60212b02b2eeb4
          scipy==1.18.1 --hash=sha256:ac0333bdf38309aa3dcbe7e3fa7ea29e7a2c37c6ea306a757b700ded8e4596ad
          EOF
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r "$requirements"
          python -I -X utf8 -c "import numpy, PIL, cv2, scipy; print('cut continuity libraries', numpy.__version__, PIL.__version__, cv2.__version__, scipy.__version__)"
      - name: checkout the released WORLD account bundle for the drama sync test
        if: runner.os == 'Linux'
        uses: actions/checkout@v5
        with:
          repository: unmet23-lab/synk-policy
          ref: 30492147d467337c46ef61a1b8ec5c3c58a1356c
          path: .tmp/conditional-drama-public
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /world/world-account.bundle.mjs
            /world/life-content.mjs
      - name: verify exact registered cases, with no skips
        env:
          DRAMA_LIVE_WORLD_BUNDLE: ${{ runner.os == 'Linux' && format('{0}/.tmp/conditional-drama-public/world/world-account.bundle.mjs', github.workspace) || '' }}
          SOLO_BACKUP_RESTIC: ${{ runner.os == 'Windows' && format('{0}\solo-backup-restic\restic_0.19.1_windows_amd64.exe', runner.temp) || '' }}
        run: node tools/conditional-qa/run.cjs --route ${{ matrix.route }} --output "${{ runner.temp }}/conditional-${{ matrix.route }}"
      - name: save the actual event ledger
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: conditional-${{ matrix.route }}
          path: ${{ runner.temp }}/conditional-${{ matrix.route }}
          retention-days: 14
          if-no-files-found: error

  local-coverage:
    needs: hosted
    if: ${{ github.repository == 'unmet23-lab/synk-appsscript' && github.ref == 'refs/heads/master' && (github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on') }}
    runs-on: ubuntu-24.04
    # Reads the local result once. While it is pending the job cancels its own run instead of holding a runner.
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: tools/conditional-qa
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: check the exact commit's complete local result
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/conditional-qa/wait-local.cjs

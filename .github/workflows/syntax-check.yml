name: syntax-check

on:
  push:
    # 기록 전용 경로만 바꾼 push는 이 검사를 띄우지 않는다. records-check.yml이 그 경로를 읽는 시험만 돈다(2026-10-20).
    # 이 목록은 records-check.yml의 paths와 같아야 하고, 이 경로를 읽는 시험은 records-check.yml에 있어야 한다 —
    # 아래 「읽기 대조」 단계(tools/ci읽기대조.cjs)가 실제 읽기 기록으로 대조한다. tools/원격ci.js는 이 목록으로
    # 기록 전용 커밋이 조상 run의 판정을 이어받는지 가른다.
    paths-ignore:
      - 'docs/_ops/트랙.md'
      - 'docs/_ops/결정.md'
      - 'docs/_ops/보관/**'
      - 'docs/_ops/*.jsonl'
      - 'docs/현장노트/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntax-${{ github.ref }}
  # 도는 run은 끝까지 둔다. 새 push는 기다리는 한 자리에 서고, 더 새 push가 오면 그 자리만 새 판으로 바뀐다
  # (기다리던 run은 시작 전에 취소돼 러너 시간을 안 쓴다). 10-20까지 true였을 때는 push 간격(중앙값 2.3분)이
  # run 한 번(약 3분)보다 짧아 24시간 194회 중 107회가 도중에 끊겼고, 끊긴 run 시간(204분)이 성공 run(172분)보다 컸다.
  cancel-in-progress: false

jobs:
  check:
    # Private hosted CI is opt-in, after verifying the account's spending stop.
    if: ${{ github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on' || vars.SYNK_SELFHOSTED == 'on' }}
    runs-on: ${{ (github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on') && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SYNK-appsscript
    env:
      # tools/ci읽기기록.cjs가 프로세스마다 읽은 경로를 여기에 남기고 「읽기 대조」 단계가 읽는다(저장소 밖).
      SYNK_READ_TRACE_DIR: ${{ github.workspace }}/synk-reads
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          path: SYNK-appsscript
          # 미디어는 받지 않는다(10-20: 4.36GB 중 3.3GB, 받기만 약 1분). 시험·단계가 실제로 여는 미디어만 다시 넣는다.
          # 시험이 여기서 뺀 파일을 열면 「읽기 대조」가 그 경로를 짚어 멈춘다. records-check.yml과 같은 목록이다.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.[pP][nN][gG]
            !*.[jJ][pP][gG]
            !*.[jJ][pP][eE][gG]
            !*.[wW][eE][bB][pP]
            !*.[aA][vV][iI][fF]
            !*.[sS][vV][gG]
            !*.[wW][aA][vV]
            !*.[mM][pP]3
            !*.[mM]4[aA]
            !*.[mM][pP]4
            !*.[mM][oO][vV]
            !*.[wW][eE][bB][mM]
            !*.[oO][nN][nN][xX]
            !*.[wW][aA][sS][mM]
            !*.[pP][dD][fF]
            !*.[hH][dD][rR]
            !*.[gG][lL][bB]
            !*.[bB][lL][eE][nN][dD]
            /desktop/assets/*.png
            /desktop/assets/launcher/*.webp
            /experiences/synk-account/assets/**
            /experiences/learning-hub/assets/**
            /experiences/path-vr/assets/path-vr-felt-800.webp
            /docs/_ops/코스튬_20261008/assets/**
            /docs/디자인/SNS키트/assets/**
            /docs/디자인/펠트부품/assets/**
            /docs/디자인/플랫폼_시그널/웹그림/**
            /docs/마케팅/맞춤도구/assets/**
            /docs/캐릭터/정본_4K/*_본체.png
            /docs/홍보물/계정별콘텐츠_20260909/**
            /docs/홍보물/마케팅실행_20260909/브랜드킷/**
            /docs/홍보물/브랜드소개_20260909/**
            /docs/Loom_자산/라디오장면/**
            /docs/라디오/DJ장면_20261019/구운판/**
            /docs/라디오/무대/**
      - name: checkout authorized Talk source inputs
        if: ${{ vars.SYNK_TALK_CI == 'on' }}
        uses: actions/checkout@v5
        with:
          repository: unmet23-lab/SYNK-talk
          ref: master
          ssh-key: ${{ secrets.SYNK_TALK_READ_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: SYNK-talk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /contents/토픽퀴즈문항.js
            /lib/태그기술표.js
            /계약/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: check new Git storage payloads
        env:
          STORAGE_BEFORE: ${{ github.event.before }}
          STORAGE_EVENT: ${{ github.event_name }}
          STORAGE_DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$STORAGE_BEFORE"
          if [ "$STORAGE_EVENT" = "workflow_dispatch" ]; then
            base=$(git rev-parse "$GITHUB_SHA^")
          elif [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git merge-base "origin/$STORAGE_DEFAULT" "$GITHUB_SHA")
          fi
          node tools/git-storage-check.cjs --base "$base" --head "$GITHUB_SHA" --allow-lazy-fetch
      - name: test Git storage guards and recovery
        run: |
          node --test tests/git-storage-check.test.cjs
          python3 -B tests/git-storage-restore.test.py
      - name: install deterministic build dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd experiences/synk-account && npm ci --ignore-scripts --no-audit --no-fund)
      - name: verify all local Atlas consumer copies
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/SYNK-appsscript/tools/ci읽기기록.cjs
        run: npm run check:atlas:local
      - name: verify account library and portal bundles
        # 원천만 고치고 생성기를 안 돌린 커밋을 잡는다(PC desktop/renderer/platform-continuity.mjs · experiences/synk-account/dist).
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/SYNK-appsscript/tools/ci읽기기록.cjs
        run: |
          npm run check:account-bundles
          npm run check:topik4-course
      - name: node --check all .js files
        run: |
          set -e
          for f in *.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done
      - name: validate appsscript.json
        run: node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8')); console.log('appsscript.json OK')"
      - name: run SYNK safety tests
        env:
          SYNK_REQUIRE_TALK_SOURCE: ${{ vars.SYNK_TALK_CI == 'on' && '1' || '0' }}
          NODE_OPTIONS: --require ${{ github.workspace }}/SYNK-appsscript/tools/ci읽기기록.cjs
        run: |
          set -o pipefail
          rc=0
          test_log="$RUNNER_TEMP/synk-test.txt"
          node --test --test-reporter=tap tests/*.test.js 2>&1 | tee "$test_log" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo "::group::🔴 깨진 검사만 다시 — 분모와 함께 읽는다(F207)"
          grep -E "^# (tests|pass|fail|skipped|todo) " "$test_log" || true
          echo "--- not ok ---"
          grep -E "^not ok " "$test_log" \
            || echo "(not ok 0건 — 실패가 TAP 밖에서 났다: 스폰 실패·구문 오류 쪽을 본다)"
          echo "::endgroup::"
          exit "$rc"
      - name: prism 접점 래칫 (학생·학부모 참조 0)
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/SYNK-appsscript/tools/ci읽기기록.cjs
        run: node tools/prism래칫.js
      - name: 읽기 대조 (기록 전용 경로를 읽는 시험·희소 체크아웃이 뺀 파일)
        if: ${{ success() || failure() }}
        run: node tools/ci읽기대조.cjs --trace "$SYNK_READ_TRACE_DIR"

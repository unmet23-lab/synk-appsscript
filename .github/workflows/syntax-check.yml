name: syntax-check

# 모든 push에서 Apps Script 소스(.js)와 appsscript.json의 구문 + 전체 테스트를 검사한다.
# 실패하면 GitHub이 커밋 작성자에게 이메일로 알린다 (기본 알림 설정).
# 목적: 어떤 세션·어떤 경로로 커밋됐든 깨진 코드가 조용히 쌓이는 것 방지.
# 경로 필터를 두지 않는다 — 테스트가 docs(버전_이력 등)·tools도 검사하므로,
# .js만 거르면 문서만 깨는 커밋이 CI를 「안 돌아서 초록」으로 통과한다(2026-08-04 실사고).

# 🔴 workflow_dispatch 가 왜 있나 (2026-08-06 실측 · GitHub Actions 대규모 장애 15:22 UTC~).
#    push 웹훅이 throttle 되면서 master 커밋 6건에 **run 이 아예 안 생겼다**(SHA로도 0건,
#    커밋을 담은 상위 run 으로도 0건 — 32개 run 헤드 전수 대조). 그런데 `on: push` 만 있으면
#    그 상태를 되돌릴 손잡이가 없다: rerun 은 run 이 있어야 하고, 남은 수단은 빈 커밋뿐이다.
#    ⚠ 「run 0건」은 「초록」과 화면에서 같은 모양이다 — 손잡이가 없으면 미검증이 그대로 굳는다.
#    복구: `gh workflow run syntax-check.yml --ref master`
# ⏸ 2026-08-14: `push:` 트리거 일시 중지 (대기열 #Q77 이 복원 줄).
#    Actions 3,000분 소진(리셋 9/1 · 유호 「돈 안 쓴다」 08-09)으로 모든 run 이 기동 없이 실패하며
#    실패 알림만 하루 ~16통 나간다 — 검증 0 인 통로가 소음만 낸다. 그동안 검증은 로컬
#    `node tools/test-ci.js` 몫(CLAUDE.md 신뢰성 절 — 원격 미검증은 보고에 밝힌다).
#    ⚠ 이 중지가 틀릴 때의 모습: 리셋 뒤에도 복원을 잊으면 「push 해도 CI 0건」이 정상 얼굴로 굳는다
#      — 그래서 복원 줄을 대기열 #Q77(⏸시점)에 두고, 수동 확인 통로는 아래 dispatch 로 남긴다.
# 🟢 2026-08-18: `push:` 를 되살렸다 — 단 **스위치가 꺼져 있으면 job 이 아예 안 뜬다**(아래 `if:`).
#    유호 확정 08-18 「셀프호스티드로 간다」. 왜 「9/1 리셋을 기다린다」가 답이 아닌지 실측:
#      스위트 2.7분 × 하루 머지 PR 71건(08-17 실측) = **월 5,760분** — 무료 3,000분으로는
#      push 는커녕 **PR 단위로 줄여도 못 버틴다**(하루 커밋은 792건이었다). 상한을 아끼는 게
#      아니라 상한 자체를 없애야 하는 자리라, GitHub-hosted 로는 원리상 안 된다.
#    ⚠ 셀프호스티드는 **유호님 노트북이 win32** 라 그냥 세우면 리눅스 축을 잃는다 — F617 실측에서
#      「윈도우 초록 3건이 리눅스에서 무너진」 그 축이다. 그래서 러너는 **WSL2/Docker 리눅스**로 세운다
#      (`runs-on` 이 `linux` 레이블을 요구하는 이유가 이것이다).
on:
  push:
  workflow_dispatch:

# 🔴 낡은 판의 run 을 취소한다 (F210 실측 2026-08-07 — 무료분 $12.05 를 7일에 소진해 계정이 잠겼다).
#    이 저장소는 커밋 간격 중앙값 1분 · 스위트 수 분이라, 취소 없이는 「이미 낡은 판」 검사가
#    분량 대부분을 태운다. 취소가 검증을 깎지 않는 근거 — 판정 도구(tools/원격ci.js)의 축이
#    「최신 run」이 아니라 「커밋을 **담은** run 의 최신 완료본」이고, 취소는 언제나 「같은 ref 에
#    더 새 판이 왔다」일 때만 일어나므로, 취소된 run 의 커밋은 그것을 담은 뒤 run 이 대신 증언한다.
#    ⚠ 경로 필터와 다르다 — 그건 「안 돌아서 초록」을 만들어 2026-08-04 실사고로 제거됐다(위 주석).
#       여기서는 모든 커밋이 여전히 검증되고, 중간 판의 run 만 상위 run 으로 접힌다.
concurrency:
  group: syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 🔴 **러너 스위치** — 저장소 변수 `SYNK_SELFHOSTED` 가 `on` 일 때만 job 이 뜬다.
    #    켜는 법: Settings → Secrets and variables → Actions → Variables → New variable
    #            이름 `SYNK_SELFHOSTED` · 값 `on`. 끄려면 값을 지우거나 변수를 삭제한다.
    #
    #    🔑 왜 `if:` 인가 — 스위치가 꺼져 있으면 job 이 **러너에 배정되지 않는다**. 그래서
    #      ①큐에 쌓이지 않고(러너가 없어도 PR 이 영원히 pending 이 안 된다) ②분을 안 쓴다.
    #      트리거를 주석 처리해 두는 옛 방식과 다른 점: 스위치는 **GitHub 화면에서 켜진다** —
    #      러너를 세운 사람이 커밋 없이 즉시 켤 수 있고, 그 상태가 저장소에 남아 다음 세션도 읽는다.
    #    ⚠ 대가 (틀릴 때의 모습): skip 된 run 은 `conclusion: skipped` 로 «완료»된다.
    #      그것을 초록으로 읽으면 **검사 0건이 「통과」가 된다** — 새는 방향이 언제나 통과인 그 형태다.
    #      `tools/원격ci.js` 가 그 갈래를 `건너뜀`(=미실행)으로 따로 낸다 — **이 도구는 산다.**
    #      🔴 그 짝 회귀 `tests/원격ci.test.js` 는 ⚠삭제됨 e75fc7fc 2026-08-19 — 지금 없다.
    #      즉 「건너뜀을 초록으로 안 읽는다」를 **지키는 도구는 있고 그 도구가 안 깨졌는지 세는 자는 없다.**
    #    ⚠ 안 쟀다: 「skip 된 job 이 분을 안 쓴다」는 GitHub 문서의 동작이지 **이 저장소에서 실측하진
    #      못했다**(Actions 가 08-14 이후 죽어 있어 재볼 대상이 없다). 켠 뒤 첫 청구에서 확인한다.
    # 🟢 2026-08-19 — **두 판을 다 받는다**(유호 확정 08-19 「저장소 공개」).
    #    · public  = GitHub-hosted 가 **무제한 무료**다. 스위치도 러너도 필요 없고, 오히려 켜 두면
    #                안 된다 — public 저장소 + self-hosted 러너는 **누구나 fork·PR 로 그 기계에서
    #                코드를 돌릴 수 있는** 조합이라 GitHub 이 명시적으로 금한다.
    #    · private = 종전 그대로. 스위치가 켜졌을 때만 self-hosted 에서 돌고 분은 0 이다.
    #
    #    🔑 왜 조건식인가 — 공개하는 순간 **사람 손 없이** 갈아타야 하기 때문이다. 손으로 바꾸게 두면
    #      「공개는 했는데 워크플로가 아직 러너를 가리키는」 창이 생기고, 그 창이 정확히 위험 구간이다.
    #    ⚠ 틀릴 때의 모습 — 이벤트에 `repository` 가 없으면 `private` 가 undefined 가 되는데,
    #      그때 두 식 모두 **private 갈래로 떨어진다**(스위치 필요 · self-hosted). 즉 새는 방향이
    #      「분 청구」나 「public 에서 러너 사용」이 아니라 **종전 동작**이라 안전하다.
    #      회귀: ⚰`tests/워크플로.test.js` 가 두 갈래가 다 살아 있는지 셌다 — ⚠삭제됨 e75fc7fc 2026-08-19 — 지금 없다.
    #      🔴 **이 두 갈래를 지금 세는 자는 없다.**
    if: ${{ github.event.repository.private == false || vars.SYNK_SELFHOSTED == 'on' }}
    # 🔴 private 갈래는 `linux` 를 **함께** 요구한다 — 러너를 윈도우에 세우면 이 job 이 안 잡히고
    #    그대로 드러난다. 조용히 윈도우에서 도는 것보다 낫다: 그러면 로컬 모사와 같은 축을 재면서
    #    「원격도 봤다」가 된다(F617 — 윈도우 초록 3건이 리눅스에서 무너졌다).
    runs-on: ${{ github.event.repository.private == false && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    # 러너가 죽거나 매달리면 job 이 무한정 남지 않게 한다(큐 대기에는 안 걸린다 — 시작 후 카운트다).
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 = 전체 이력. 기본값 1(얕은 클론)이면 `HEAD~1` 이 없어서
      # 실저장소 이력을 재는 검사(tests/실행층점검 등)가 CI 에서만 깨진다 — 로컬은 초록인데.
      # ⚠ 이력 없이도 **조용히 통과하지는 않는다**: 범위를 못 읽으면 그 검사는 skip 으로 드러난다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 🔴 **로컬과 같은 판을 쓴다** (2026-08-20 실측 · F670 트랙에서 드러났다).
      #    20 이던 것을 22 로 올린다 — 개발 기계(클라우드 컨테이너 v22.22 · 유호님 노트북)가 22 인데
      #    CI 만 20 이라, **로컬 fail 0 인 판이 CI 에서 깨지는** 자리가 실재했다. 같은 저장소를
      #    전체 이력까지 맞춰 놓고 재현하니 갈린 것은 판 하나였다: node22 = fail 0 · **node20 = fail 2**
      #    (`인쇄면의 이모지를 잡는다` · `게이트 — 이모지 폴백은 통과, 모르는 글자는 잡는다` —
      #     유니코드 속성 정규식이 ICU 판을 타는 자리다).
      #    ⚠ 틀릴 때의 모습: 개발 기계가 24 로 올라가면 이 줄이 **다시 낡는다** — 그때 갈리는 것은
      #      또 조용하다(로컬 초록 · CI 적색). 판을 올릴 땐 여기부터 맞춘다.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: node --check all .js files
        run: |
          set -e
          for f in *.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done
      - name: validate appsscript.json
        run: node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8')); console.log('appsscript.json OK')"
      # 🔴 **실패를 로그 «끝»에 다시 적는다** (2026-08-20 실측 · F670 트랙).
      #    왜 있나 — TAP 은 `not ok` 를 그 검사가 도는 «순간» 찍는데, 스위트가 4,700건이라 그 줄이
      #    로그 한복판에 묻힌다. 원격에서 로그를 읽는 통로(MCP `get_job_logs`)는 **끝에서 N줄**만
      #    주므로, 앞쪽에서 깨진 검사는 **이름조차 못 읽는다** — 실측: fail 21 인 run 에서 `not ok`
      #    를 5,000줄 받아도 0건이었다. 그래서 「무엇이 깨졌나」를 물으려면 매번 로컬 재현이 필요했다.
      #    ⚠ 이 줄이 검증을 바꾸지는 않는다 — 판정은 그대로 `node --test` 의 종료코드다(`pipefail`).
      #      여기서 하는 일은 **이미 난 실패를 한 번 더 적는 것**뿐이라, 새는 방향이 「통과」가 아니다.
      - name: run SYNK safety tests
        run: |
          set -o pipefail
          # ⚠ 변수명은 ASCII 로만 둔다 — bash 는 한글 식별자를 «구문 오류»로 죽인다(2026-08-20 실측).
          # 🔴 rc 는 파이프라인 «바로 뒤»에서 잡는다. 앞선 판은 `if PIPE; then exit 0; fi` 뒤에서
          #    `rc=$?` 를 읽었는데, 그 자리의 $? 는 파이프라인이 아니라 **if 문 자체**의 값이고
          #    「조건 거짓 + else 없음」인 if 문은 0 을 낸다 ⇒ 깨진 검사가 있어도 `exit 0` 이었다.
          #    실측(2026-09-05): 이 저장소의 검사 다섯이 깨진 채로 run 33913905109 가 success 를 받았다.
          rc=0
          node --test tests/*.test.js 2>&1 | tee /tmp/synk-test.txt || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo "::group::🔴 깨진 검사만 다시 — 분모와 함께 읽는다(F207)"
          grep -E "^# (tests|pass|fail|skipped|todo) " /tmp/synk-test.txt || true
          echo "--- not ok ---"
          grep -E "^not ok " /tmp/synk-test.txt \
            || echo "(not ok 0건 — 실패가 TAP 밖에서 났다: 스폰 실패·구문 오류 쪽을 본다)"
          echo "::endgroup::"
          exit "$rc"

name: syntax-check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Private hosted CI is opt-in, after verifying the account's spending stop.
    if: ${{ github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on' || vars.SYNK_SELFHOSTED == 'on' }}
    runs-on: ${{ (github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on') && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SYNK-appsscript
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          path: SYNK-appsscript
      - name: checkout authorized Talk source inputs
        if: ${{ vars.SYNK_TALK_CI == 'on' }}
        uses: actions/checkout@v5
        with:
          repository: unmet23-lab/SYNK-talk
          ref: master
          ssh-key: ${{ secrets.SYNK_TALK_READ_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: SYNK-talk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /contents/토픽퀴즈문항.js
            /lib/태그기술표.js
            /계약/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: check new Git storage payloads
        env:
          STORAGE_BEFORE: ${{ github.event.before }}
          STORAGE_EVENT: ${{ github.event_name }}
          STORAGE_DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$STORAGE_BEFORE"
          if [ "$STORAGE_EVENT" = "workflow_dispatch" ]; then
            base=$(git rev-parse "$GITHUB_SHA^")
          elif [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git merge-base "origin/$STORAGE_DEFAULT" "$GITHUB_SHA")
          fi
          node tools/git-storage-check.cjs --base "$base" --head "$GITHUB_SHA" --allow-lazy-fetch
      - name: test Git storage guards and recovery
        run: |
          node --test tests/git-storage-check.test.cjs
          python3 -B tests/git-storage-restore.test.py
      - name: install deterministic build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: verify all local Atlas consumer copies
        run: npm run check:atlas:local
      - name: verify account library and portal bundles
        # 원천만 고치고 생성기를 안 돌린 커밋을 잡는다(PC desktop/renderer/platform-continuity.mjs · experiences/synk-account/dist).
        run: |
          (cd experiences/synk-account && npm ci --ignore-scripts --no-audit --no-fund)
          npm run check:account-bundles
          npm run check:topik4-course
      - name: node --check all .js files
        run: |
          set -e
          for f in *.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done
      - name: validate appsscript.json
        run: node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8')); console.log('appsscript.json OK')"
      - name: run SYNK safety tests
        env:
          SYNK_REQUIRE_TALK_SOURCE: ${{ vars.SYNK_TALK_CI == 'on' && '1' || '0' }}
        run: |
          set -o pipefail
          rc=0
          test_log="$RUNNER_TEMP/synk-test.txt"
          node --test --test-reporter=tap tests/*.test.js 2>&1 | tee "$test_log" || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo "::group::🔴 깨진 검사만 다시 — 분모와 함께 읽는다(F207)"
          grep -E "^# (tests|pass|fail|skipped|todo) " "$test_log" || true
          echo "--- not ok ---"
          grep -E "^not ok " "$test_log" \
            || echo "(not ok 0건 — 실패가 TAP 밖에서 났다: 스폰 실패·구문 오류 쪽을 본다)"
          echo "::endgroup::"
          exit "$rc"
      - name: prism 접점 래칫 (학생·학부모 참조 0)
        run: node tools/prism래칫.js

  windows-specific:
    if: ${{ github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/prism래칫회귀.test.js
            /tests/sns-발행.test.js
            /tests/_git밖.js
            /tools/prism래칫.js
            /tools/lib/sns-publisher.js
            /tools/lib/sns-dm.js
            /tools/sns-자격.ps1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: run Windows filesystem and mocked credential regressions
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os');console.log(JSON.stringify({temp:os.tmpdir(),real:fs.realpathSync(os.tmpdir()),native:fs.realpathSync.native(os.tmpdir())}))"
          $testLog = Join-Path $env:RUNNER_TEMP 'synk-windows.tap'
          node --test --test-reporter=tap --test-reporter-destination=$testLog --test-name-pattern='^Windows' tests/prism래칫회귀.test.js tests/sns-발행.test.js
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath $testLog
          if ($testExit -ne 0) { exit $testExit }
          $summary = Get-Content -LiteralPath $testLog -Raw
          if (-not ($summary -match '(?m)^# pass (?<passed>\d+)\r?$') -or [int]$Matches['passed'] -lt 4) { throw 'Expected all four Windows regressions to execute' }
          if ($summary -notmatch '(?m)^# skipped 0\r?$') { throw 'Windows-specific regressions must not be skipped here' }

# 노트북 없는 검수 ① — 클로드 (안 B · 정찰 지면 docs/교차검수_재설계_정찰_2026-09-02.html §8)
#
# 🔴 스위치 — 저장소 변수 `SYNK_REVIEW_GITHUB` 가 `on` 일 때만 job 이 뜬다(유호님 픽 ㉯ 전까지 꺼져 있다).
#    GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable
#    이름 `SYNK_REVIEW_GITHUB` · 값 `on`.
# 🔒 시크릿 — `CLAUDE_CODE_OAUTH_TOKEN` : 노트북에서 `claude setup-token` 을 돌려 나온 1년짜리 토큰
#    (공식 문면: 「runs use your Claude subscription instead of API billing」 · 돌린 사람의 Max 구독 한도를 쓴다).
#    같은 화면 → Secrets → New repository secret 에 붙인다. 값은 채팅에 붙이지 않는다.
# 🛡 같은 저장소 브랜치의 PR 만 본다(포크 PR 은 시크릿이 안 나가기도 하고, 낯선 본문을 프롬프트에 넣지 않는다).
# 💸 공개 저장소라 러너 분은 무료 · 토큰은 Max 한도 차감. 자동 승인·자동 수정은 하지 않는다(코멘트만).
name: review-claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ vars.SYNK_REVIEW_GITHUB == 'on' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 을 «검수»한다(고치지 않는다). 규칙은 저장소의 AGENTS.md 「Code Review Rules」와 CLAUDE.md 를 따른다.
            - 한국어. 지적마다 파일:줄 · 무엇이 깨지나 · 재현 입력.
            - 등급: P0(라이브 시트·학생 식별·자격증명·배포 통로) · P1(기능이 틀리게 돈다) · P2 · P3.
            - 값비싼 변경(대외 확정 문안 · 보장 · 수치 · 금칙 완화 · 돈 · 소급 불가 스키마)은 반드시 「봤다 → 괜찮다/문제다」를 명시한다.
            - 끝에 「읽은 파일」과 「안 본 것」을 적는다. 저장소를 못 읽었으면 첫 줄에 「확인 불가」.
            - 구체 지적은 인라인 코멘트, 총평은 한 개의 톱레벨 코멘트로. 첫 줄은 반드시 `[review-claude]` 로 시작하고
              둘째 줄에 `합의표식: P0=<n> P1=<n>` 을 적는다(집계 잡이 이 두 줄을 읽는다).
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

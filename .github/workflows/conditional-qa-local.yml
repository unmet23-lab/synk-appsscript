name: conditional-qa-local

# master 커밋별 로컬 판정(conditional-qa/local 상태)을 짧게 읽는다. 시험을 돌리지 않고 통과를 쓰지 않는다(11-04).
# conditional-qa의 local-coverage는 기다리는 동안 자기 run을 취소하고 취소는 빨강이 아니어서, PC가 멈춰도 그쪽에는 신호가 없다.
# 빨강: 새 실패(24시간)·판 불일치·대기가 있는데 일꾼 155분 무소식·72시간 넘은 대기. tools/ci빨간불.js가 이 빨강을 알린다.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: conditional-local-status

jobs:
  status:
    if: ${{ github.repository == 'unmet23-lab/synk-appsscript' && github.ref == 'refs/heads/master' && (github.event.repository.private == false || vars.SYNK_HOSTED_CI == 'on') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: tools/conditional-qa
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: read every queued commit's local status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/conditional-qa/local-status.cjs

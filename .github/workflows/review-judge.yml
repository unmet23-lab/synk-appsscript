# 노트북 없는 검수 ③ — 집계 잡(심판) (안 B · 정찰 지면 docs/교차검수_재설계_정찰_2026-09-02.html §8)
#
# 봇들의 코멘트를 읽어 «문턱만큼 P0/P1 을 짚었나»를 커밋 상태 하나(`SYNK/검수합의`)로 낸다.
#   · 응답한 벤더가 0 → pending(아직 못 셌다 — «봇 침묵 = 미확인» 얼굴. 초록으로 접지 않는다)
#   · 문턱 = min(2, 응답 벤더 수) 만큼 P0/P1 → failure(사람이 본다) · 그 밖 → success
#   🔴 09-05 에 「둘 이상」 못박기를 걷었다 — 깃허브 벤더가 클로드 하나뿐이라 그 하나가 P0 를 짚어도
#     영원히 pending 이었다. 벤더가 늘면 문턱도 저절로 올라간다(둘이면 다시 「둘 이상」이다).
#   유호님이 원하시면 Settings → Branches 에서 이 상태를 required 로 올리면 merge 게이트가 된다.
# 🔴 스위치 — `SYNK_REVIEW_GITHUB` = `on`. 시크릿 불필요(GITHUB_TOKEN 만).
# 📏 v0 — 벤더 판별은 코멘트 작성자 로그인(claude · chatgpt-codex-connector · gemini · coderabbit)과
#    현재 SHA·완료 표식이 있는 최신 총평만 센다. 자(규칙)는 tools/lib/github-review-judge.js에 있다.
name: review-judge

on:
  # 🔴 09-05: PR 이벤트가 «빠져» 있었다. 봇이 코멘트를 남겨야만 이 잡이 깨어나므로, 두 봇이 다
  #   침묵하면(열쇠가 없거나 죽으면) 그 커밋에는 도장이 pending 도 아닌 «아예 없음»으로 남는다.
  #   그러면 이 파일이 스스로 적어 둔 규율 「봇이 침묵하면 pending 이지 초록이 아니다」를 **찍을
  #   기회가 없다.** PR 이 열리거나 새 커밋이 밀리는 순간 먼저 pending 을 박아 두어야 그 말이 산다.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

concurrency:
  group: review-judge-${{ github.event.pull_request.number || github.event.issue.number }}-${{ startsWith(github.event.comment.body, '[review-judge]') && 'self' || 'reviews' }}
  cancel-in-progress: true

jobs:
  judge:
    if: ${{ vars.SYNK_REVIEW_GITHUB == 'on' && (github.event_name != 'issue_comment' || github.event.issue.pull_request) && !startsWith(github.event.comment.body, '[review-judge]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      - name: Checkout trusted judge implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/lib/github-review-judge.js
          sparse-checkout-cone-mode: false

      - name: Tally bot reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { tally } = require('./tools/lib/github-review-judge.js');
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;
            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            if (pr.head.repo.full_name !== `${owner}/${repo}`) { core.info('포크 PR — 세지 않는다'); return; }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 });
            const result = tally({ headSha: pr.head.sha, comments, reviews });
            const { state, description: 설명 } = result;
            const current = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            if (current.head.sha !== pr.head.sha) { core.info('head가 변경됨 — 새 이벤트가 집계한다'); return; }

            await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha, state, context: 'SYNK/검수합의', description: 설명.slice(0, 140) });

            const 줄 = result.responses.length
              ? result.responses.map(r => `- ${r.vendor}: P0=${r.p0} P1=${r.p1}`).join('\n')
              : '- (현재 커밋 완료 검수 없음)';
            const body = `[review-judge] SYNK 검수 합의 — 커밋 ${pr.head.sha}\n\n${줄}\n\n판정: ${state} — ${설명}\n\n현재 SHA·완료 표식이 있는 최신 총평만 집계한다. 문턱 min(2, 응답 벤더 수)를 유지한다.`;
            const mine = comments.find((c) => /^\s*\[review-judge\]/.test(c.body || '') && (c.user || {}).login === 'github-actions[bot]');
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            core.info(`${state} — ${설명}`);

# 홍보물용 자 — 학부모·학생이 «보는» 것 (인쇄물 · 슬라이드 · 홈페이지 · 카드뉴스)
#
# 대외문안.toml 과 갈라 둔 까닭 (2026-09-03 실측):
#   그 자를 홍보물에 대니 「짧은 문단」과 「문장형 제목」이 100건 넘게 걸렸다.
#   표본을 열어 보니 전부 «의도한 것»이었다 —
#     · 「낱말 하나를 먼저 맞춥니다」 「4급은 말해 본 시간이 열어 줍니다」 = 슬라이드·브로셔가 말을 거는 제목
#     · A4 안내문·A3 로드맵의 한두 문장 문단 = 인쇄 지면이 그렇게 짜여 있다
#   자가 틀린 채로 빨간 숫자를 내면 아무도 안 본다. 그래서 그 둘만 여기서 끈다.
#   🔑 산문(기업철학·강사공고·강사훈련·연재)은 여전히 대외문안.toml 이 잰다 — 거기선 그 둘이 옳다.
#   한 판정에 자 하나(one-ruler-per-judgment).
preset = "docs"

disable = [
  # ── 대외문안.toml 과 같은 것 셋
  "outsideProfile",   # 블로그 1140문장으로 재는 %. 우리 분모가 아니다
  "sectionNoProse",   # 표만 있는 절은 가격표·일정표에서 정상
  "draftHistory",     # 수정 이력은 홍보물에 원래 없다
  # ── 한글 맞춤법과 어긋나는 것
  #    「마침표는 서술, 명령, 청유 등을 나타내는 문장의 끝에 쓴다」(한글 맞춤법 문장 부호).
  #    검사기가 든 근거는 국어 규정이 아니라 그 도구 저자의 문체 취향이라 우리 자로 안 쓴다.
  "imperativePeriod",
  # ── 홍보물에서는 «의도»인 것 둘
  "paraFragment",     # 인쇄 지면·슬라이드의 한두 문장 문단
  "headingSentence",  # 말을 거는 문장형 제목(「1년 뒤, TOPIK 4급.」)
  # ── [2026-09-08] 09-03 에 시작한 판정을 마저 한다 (판정 지면 `docs/말투_두규칙_판정_0904.html`)
  #    두 규칙이 홍보물에서만 42곳 걸렸는데, 표본을 열어 보니 «자가 못 보는 것»이 넷이었다:
  #      ① 까닭이 «다음 문단»에 있다 — 검사기는 문단 하나 안에서만 이음말을 찾는다
  #      ② 인쇄물 문구에는 「그래서」를 붙일 자리가 없다(붙이면 힘이 빠진다 · 09-03 에 이미 «일부러»로 판정)
  #      ③ 표를 문단으로 읽는다 — 브로셔의 표는 글자만 뽑으면 칸이 이어 붙는다
  #      ④ 히어로 문구·카드 글귀는 애초에 산문이 아니다
  #    실측 = 이 둘을 끄면 전체 지적이 102 → 60 으로 준다(42곳이 그 자리에서 조용해진다).
  #    🔑 산문(기업철학·강사공고·강사훈련·연재)은 여전히 대외문안.toml 이 잰다 — 거기선 이 둘이 옳다.
  "endingRepeat",     # 같은 어미 반복 — 슬라이드·카드의 짧은 선언문에는 리듬을 바꿀 자리가 없다
  "factListParagraph",# 사실 나열 — 표·문구·다음 문단에 까닭이 있는 글이 대부분이었다
]

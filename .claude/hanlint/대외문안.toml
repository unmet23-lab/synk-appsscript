# 대외 문안용 자 — 학부모·학생·강사·지원자가 읽는 글
#
# 브랜드 말투 규칙(.claude/skills/synk-brand)이 «우리 규칙»을 보고,
# 이 자는 «일반 한국어»를 본다. 둘은 겹치지 않고 서로를 메운다.
#   · voice-guard  → 금칙어 · 결핍 프레임 · 재촉 · 주어가 사람인가
#   · 이 자        → 번역투 · 긴 줄표 · 이중 피동 · 가리킬 것 없는 지시어 · 어려운 한자어
preset = "docs"

# 끈 것과 그 까닭 — 우리 문서 성격에 안 맞는 것만 끈다
disable = [
  # 「블로그 1140문장 가운데 상위 0.1%」로 재는 규칙. 우리 대외문안은 블로그가 아니라
  # 안내문·공고·브로셔라 문장 길이·화제어 분포가 애초에 다르다. 분모가 우리 것이 아니면 그 %는 자가 아니다.
  "outsideProfile",
  # 설명글 없이 표만 있는 절 = 우리 문서에선 정상이다(가격표 · 일정표 · 커리큘럼 표).
  "sectionNoProse",
  # 「처음에는 ~라고 썼습니다」류 수정 이력. 대외 문안엔 원래 없고, 있으면 다른 규칙이 잡는다.
  "draftHistory",
  # 🔴 한글 맞춤법과 어긋난다(09-03 심사). 문장 부호 규정은 「마침표는 **서술, 명령, 청유** 등을
  # 나타내는 문장의 끝에 쓴다」이다. 「물어봐 주세요.」의 마침표는 옳다.
  # 검사기가 든 근거는 국어 규정이 아니라 그 도구 저자의 문체 취향이라 우리 자로 안 쓴다.
  "imperativePeriod",
  # 🔴 09-03 심사 — 우리 산문 넷이 전부 «읽는 사람에게 말을 거는» 글이다.
  # 검사기 자신이 「강의 교안의 H3 부제는 계약상 행동과 결과를 말하는 문장이다」라며 예외를 인정하는데,
  # 걸린 41건 중 35건이 그 강의 교안(강사훈련_온라인자료)이었다.
  # 「낱말 하나를 먼저 맞춥니다」 「급여가 오르는 길이 여덟 개 있습니다」는 흠이 아니라 의도다.
  # ⚠ 이건 «자가 틀렸다»가 아니라 «우리 글의 성격에 안 맞는다»이다. 다시 여는 조건 =
  # 대외 문안에 목록·설명서 성격의 글이 늘어 문장형 제목이 실제로 거슬리는 날.
  "headingSentence",
  # 공고문·안내문은 «게시물»이라 짧은 문단이 읽기 좋다 — 홍보물.toml 이 같은 까닭으로 이미 껐고,
  # 걸린 3건이 전부 강사 채용 공고의 본문이었다.
  "paraFragment",
  # 목록 앞의 🔴·⚠ 는 «급한 것을 먼저 보시라»는 우리 표식이다(내답.toml 도 같은 까닭으로 껐다).
  "emojiBullet",
]

# 🔑 홍보물(인쇄물·슬라이드·홈페이지·카드뉴스)은 이 자가 아니라 `홍보물.toml` 이 잰다 —
#    거기서는 짧은 문단과 문장형 제목이 «의도»라 그 둘을 더 끈다. 고르는 곳 = tools/lib/대외문안.js

# 긴 문장 상한은 검사기 기본값 30 어절을 그대로 쓴다 — 설정 파일로는 못 바꾼다(키는 preset·disable 둘뿐).

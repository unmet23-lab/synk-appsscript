name: SYNK macOS Preview

on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        options: [both, arm64, x64]
        default: both
  push:
    branches: [codex/macos-preview-20261012, codex/macos-intel-preview-20261012, codex/macos-intel-fix-20261012]
    paths:
      - '.github/desktop-preview/**'
      - '.github/workflows/desktop-macos-preview.yml'

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.architecture == 'x64' || startsWith(github.ref_name, 'codex/macos-intel-')) && '[{"arch":"x64","runner":"macos-15-intel"}]' || inputs.architecture == 'arm64' && '[{"arch":"arm64","runner":"macos-15"}]' || '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]') }}
    defaults:
      run:
        working-directory: .github/desktop-preview
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: .github/desktop-preview/package-lock.json
      - name: Install pinned build tools
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install the exact Electron CPU architecture
        run: node node_modules/electron/install.js
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Build and stage the missing Intel graphics loader
        if: matrix.arch == 'x64'
        run: |
          bash build-vulkan-loader.sh
          cp native-libs/x64/libvulkan.dylib 'node_modules/electron/dist/Electron.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Libraries/libvulkan.dylib'
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app
      - name: Verify graphics before packaging
        run: node qa/probe-gpu.cjs
        env:
          SYNK_QA_EXPECTED_ARCH: ${{ matrix.arch }}
          SYNK_QA_SOFTWARE_GPU: ${{ matrix.arch == 'x64' && '1' || '0' }}
      - name: Validate frozen public source
        run: node build.cjs --validate-only
      - name: Build native Preview DMGs
        id: build
        run: |
          node build.cjs --arch=${{ matrix.arch }}
          test -s dist/${{ matrix.arch }}/deliverables/mac-package-${{ matrix.arch }}.json
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install DMGs in an isolated folder and run native QA
        run: node qa/run-macos-qa.cjs --arch=${{ matrix.arch }}
        env:
          SYNK_QA_VISIBLE: '1'
          SYNK_QA_SOFTWARE_GPU: ${{ matrix.arch == 'x64' && '1' || '0' }}
      - name: Save verified installers
        uses: actions/upload-artifact@v7
        with:
          name: synk-macos-preview-${{ matrix.arch }}
          path: .github/desktop-preview/dist/${{ matrix.arch }}/deliverables/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve failed QA candidate for diagnosis
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: synk-macos-candidate-${{ matrix.arch }}
          path: .github/desktop-preview/dist/${{ matrix.arch }}/deliverables/
          compression-level: 0
          retention-days: 7
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synk-macos-qa-${{ matrix.arch }}
          path: |
            .github/desktop-preview/qa/gpu-preflight.json
            .github/desktop-preview/qa-results/${{ matrix.arch }}/mac-native-qa.json
            .github/desktop-preview/qa-results/${{ matrix.arch }}/*/report.json
            .github/desktop-preview/qa-results/${{ matrix.arch }}/*/*.png
            .github/desktop-preview/qa-results/${{ matrix.arch }}/*-process.log
            .github/desktop-preview/dist/${{ matrix.arch }}/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

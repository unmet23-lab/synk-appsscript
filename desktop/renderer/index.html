<!doctype html>
<html lang="ko" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SYNK Platform</title>
  <link rel="stylesheet" href="./launcher.css">
  <link rel="stylesheet" href="./account-page.css">
  <link rel="stylesheet" href="./orb-face.css">
  <link rel="stylesheet" href="./solio-lobby.css">
  <script src="/assets/launcher/engine.js"></script>
  <script src="/assets/launcher/personalization.js"></script>
  <script type="module" src="./launcher.mjs"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4.5H15"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-square" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><rect x="5.5" y="8.5" width="10" height="10" rx="1.5"/><path d="M9 5.5h8a1.5 1.5 0 0 1 1.5 1.5v8"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="11.5" rx="2"/><path d="M8.5 20h7M12 16v4"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9Zm0 0c2-4 6-4 6-1.5S14 9 12 9Z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></symbol>
  <symbol id="i-solio" viewBox="0 0 24 24"><rect x="3.5" y="8.5" width="17" height="11" rx="1.5"/><path d="M9 8.5v-2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3.5 13.5h17"/></symbol>
</svg>
<!-- 검정 구 얼굴(portal-entry)이 창 전체를 맡는다. 옛 런처의 보기 일곱과 제목 줄 · 상태 줄 · 대화상자는 PC 0.5.0에서 거뒀다(PC 0.5.0 설계 4절).
     .launcher 안에는 내 계정 방의 마을 기록 · 연습 기록 내려받기가 여는 옛 내 계정만 남는다(2단계 둘째 조각 설계 14절 D4). -->
<div class="launcher">
  <main id="main" tabindex="-1">
    <section id="view-account" class="view padded-view" aria-labelledby="account-page-title" hidden></section>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="leave-dialog" class="account-dialog leave-dialog" aria-labelledby="leave-title" aria-describedby="leave-description"><h2 id="leave-title">작성 중인 메모가 있습니다</h2><p id="leave-description"></p><form method="dialog" class="leave-actions"><button class="solid-button" value="keep" autofocus>돌아가서 저장</button><button class="ghost-button" value="discard">저장 없이 나가기</button></form></dialog>
<div id="portal-entry"></div>
<template id="portal-window-chrome">
  <div class="portal-window-bar" data-portal-window-bar hidden>
    <div class="portal-window-drag" data-portal-window-drag aria-hidden="true"></div>
    <div class="portal-window-actions" role="group" aria-label="창 조절">
      <button type="button" data-window="minimize" aria-label="최소화"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
      <button type="button" data-window="toggle-maximize" data-portal-maximize data-maximized="false" aria-label="최대화"><svg class="i when-normal" aria-hidden="true"><use href="#i-square"/></svg><svg class="i when-maximized" aria-hidden="true"><use href="#i-restore"/></svg></button>
      <button type="button" data-window="close" class="window-close" aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
  </div>
</template>
</body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SYNK Platform 업데이트</title>
  <link rel="stylesheet" href="startup-update.css">
  <script type="module" src="startup-update.mjs"></script>
</head>
<body>
  <main class="startup-root" id="startup-update" data-state="checking" aria-labelledby="startup-title" aria-busy="true">
    <div class="startup-orb-stage" id="startup-orb-stage" aria-hidden="true"></div>
    <div class="startup-layer">
      <div class="startup-surface" id="startup-surface">
        <span class="sr-only" id="startup-stage">시작 준비</span>
        <span class="sr-only" id="startup-version" aria-hidden="true"></span>
        <div class="message" aria-live="polite" aria-atomic="true">
          <h1 id="startup-title">최신 버전을 확인하고 있어요</h1>
          <p id="startup-description">잠시만 기다려 주세요. 확인이 끝나면 바로 열려요.</p>
        </div>
        <div class="download" id="startup-progress-wrap" hidden>
          <div class="download-label"><span>다운로드</span><span class="percent" id="startup-percent">0%</span></div>
          <progress id="startup-progress" max="100" value="0" aria-label="업데이트 받는 중"></progress>
        </div>
        <div class="actions" id="startup-actions" hidden>
          <button class="primary" id="startup-retry" type="button" hidden>다시 시도</button>
          <button class="primary" id="startup-install" type="button" hidden>설치 파일 열기</button>
          <button class="secondary" id="startup-open-current" type="button" hidden>지금 버전 열기</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK 라디오 오버레이 — 무대</title>
<!--
  라디오24 오버레이 · 무대 층 (유호 지시 2026-09-06 「라디오 송출할 때 쓸 화면을 최대한 생동감이
  느껴지게, 그리고 전환도 자연스럽게」)

  ■ 왜 «따로» 있나
    마스코트 층(`마스코트.html`)은 **투명해야 한다** — OBS 에서 밑에 깔린 것을 덮으면 안 된다.
    무대는 반대로 화면을 꽉 채운다. 한 파일에 둘을 넣으면 마스코트 층이 밑 소스를 통째로 가린다.
    ⇒ OBS 소스 셋을 아래에서부터 **무대 → 마스코트 → 전광판** 으로 쌓는다.

  ■ 무엇이 «생동감»인가 — 사진 한 장을 살아 있게 만드는 넷
    ① 숨 쉬는 무대  : 아주 느리게 당겼다 놓는다(54초 한 숨). 트랜스폼만 쓴다.
    ② 떠다니는 보풀 : 양모 보풀이 천천히 떠오른다. 킷의 Butter Soft 직책이 그대로 「보풀 빛」이다.
    ③ 숨 쉬는 빛    : 좌상단 따뜻한 빛이 26초에 한 번 밝아졌다 여린다(킷 Butter Soft).
    ④ 사건에 어리는 빛 : 정답·체크인 같은 일이 있으면 그 빛이 1.2초 밝아진다. 글자 없이 반응한다.
    이 넷은 전부 «천천히»다. 이 방송의 상품은 잔잔함이라 무대가 앞에 나서면 안 된다(설계 v1.5 §8-2).

  ■ 전환 — 결(곡 장르)이 바뀌면 무대도 바뀐다
    무대 층 둘을 겹쳐 두고 새 무대를 2.4초에 걸쳐 «포개어» 올린다. 같은 순간 마스코트 층에서는
    DJ 가 화면 밖으로 나갔다 갈아입고 들어온다 — 두 층이 같은 사건 하나로 함께 움직인다.

    🔑 **여기서만 opacity 를 쓴다.** 마스코트 층의 «색 연산 0»은 펠트 스프라이트를 지키는 규격이다
       (filter·blend 가 양모 결을 뭉갠다). 무대는 지킬 스프라이트가 아니라 «바닥»이고, 화면을 꽉
       채우고 있어 «화면 밖에서 몰래 바꾸는» 길이 원리상 없다. filter·blend 는 여기서도 안 쓴다.

  ■ 그림 정본
    `docs/Loom_자산/무대/<결>.webp` — `tools/무대작게.py` 가 4096 원본에서 2048 로 낸다.
    원본(`docs/Loom_자산/구움/라디오무대_*.png`)은 한 장 20MB 라 git 밖이고, 작은 판만 저장소에 든다.
    🔴 결 이름은 `마스코트.html` 의 `장르차림` 과 **같은 낱말**이다. 한쪽을 고치면 같은 커밋에서 다른 쪽을 연다.

  ■ 보는 법
    OBS 브라우저 소스 1920×1080 · 파일을 그대로 연다(`file://` 로도 뜬다).
    `?결=드림들판` 으로 첫 무대를 고르고, `?demo=1` 로 일곱을 돌려 본다.
    콘솔 시험: 무대반응({종류:'결', 결:'전자밤도시'})

  틀릴 때의 모습: 그림이 없으면 무대가 «검게» 나간다 — 그래서 로드 실패는 콘솔 에러 + 화면 경고로
  드러낸다(침묵 실패 금지 · 마스코트 층과 같은 규율).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080605; } /* Ink Deep */
  #무대 { position: absolute; inset: 0; }

  /* 무대 두 겹 — 하나가 서 있고 하나가 다음 것을 들고 기다린다(겹쳐 넘기려면 둘이 필요하다) */
  /* 🔴 겹치기는 CSS 옮겨 붙이기(transition)로 안 한다 (09-06 실측).
     숨은 탭·절전에서는 그림 시계가 멎어 opacity 가 0.002 에 붙박이고, 무대가 «영영 안 뜬다».
     방송에 나갈 층이라 「보통은 된다」로는 부족하다 — 아래 `서서히()` 가 타이머로 직접 민다. */
  .장 { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
  /* 🆕 2026-09-08 — 그림을 «판» 안에 넣고 숨은 판이 쉰다. 그래야 판 안에 얹는 불빛·물비침이 그림과
     **같이** 움직인다(그림만 숨 쉬면 불빛이 그림 위에서 4% 까지 미끄러진다 · 09-08 실측 셈). */
  .장 .판 {
    position: absolute; inset: 0;
    /* ① 숨 쉬는 무대 — 트랜스폼만. 54초에 한 숨(들이쉬고 내쉬기) */
    animation: 숨 var(--숨주기, 54s) ease-in-out infinite alternate;
    will-change: transform;
  }
  .장:nth-child(2) .판 { animation-delay: calc(var(--숨주기, 54s) / -2); }   /* 두 겹이 «같이» 숨쉬면 전환이 티 난다 */
  .장 img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;                       /* 정사각 그림을 16:9 에 채운다 — 자르는 일은 화면 몫 */
    object-position: var(--맞춤, center);
    display: block;
    user-select: none; -webkit-user-drag: none;
  }

  /* 🆕 2026-09-08 «살아 있는 무대» — 유호 지시 「전체적으로 불빛 반짝이는거랑 가로등 가끔씩 깜빡거리는거랑
     바닥에 비치고있는 빛들 은은하게 움직이도록 · 배경이 조금 더 생동감있었으면 해」.
     구운 펠트 그림은 못 건드리므로, 그림에 «박힌» 불빛 자리 위에 여린 빛 조각을 얹어 저마다 다른 박자로 산다.
     자리는 `무대빛` 표(아래 스크립트)가 결마다 든다 — 그림을 도구로 잰 값이고 눈대중이 아니다.
     🔴 색 연산(filter·blend) 0 · 자리 이동 0 — 밝기만 오르내린다. 물비침 한 겹만 ±0.22% 흔들린다(4px).
     ⓐ 물비침: 같은 그림을 한 장 더 물 자리에만(마스크) 깔고 좌우로 아주 조금 흔든다 → 물에 비친 불빛이 «일렁»인다.
     ⓑ 등(가로등): 불무리가 숨 쉬다 «가끔» 한 번 꺼질 듯 깜빡인다 — 어두운 심을 같은 박자로 얹어 알전구 자체가 어두워진다.
     ⓒ 창: 창문 불빛이 저마다 2.6~5.4초로 밝아졌다 여린다.
     ⓓ 네온: 물에 비친 네온 기둥이 2.4~4.6초로 숨 쉬고, 기둥 «안에서» 빛 띠가 천천히 흘러내린다(물의 흐름).
     🔴 09-08 걷은 것 — 물 전체에 가로 빛띠를 흘리는 「잔물결」겹. 화면에서 주사선(가로줄)으로 읽혔다(실측 사진).
        흐름은 «기둥 안에서만» 낸다 — 색이 있는 자리 안의 띠는 물결로 읽히고, 빈 물 위의 띠는 줄로 읽힌다. */
  .장 img.물비침 {
    opacity: var(--물비침밝기, .5);
    transform-origin: 50% var(--물선, 44%);
    /* 물이 화면 폭을 다 차지하지 않는 무대(시티팝 바다 · 차분 호수)는 표의 «물꼴»(clip-path 다각형)로 물 자리만 오린다 —
       안 오리면 옆의 집·부두·창틀까지 같이 흔들린다. 위쪽은 마스크로 여리게 시작한다. */
    clip-path: var(--물꼴, none);
    -webkit-mask-image: linear-gradient(to bottom, transparent calc(var(--물선, 44%) - 4%), rgba(0,0,0,.7) calc(var(--물선, 44%) + 5%), #000 calc(var(--물선, 44%) + 16%));
            mask-image: linear-gradient(to bottom, transparent calc(var(--물선, 44%) - 4%), rgba(0,0,0,.7) calc(var(--물선, 44%) + 5%), #000 calc(var(--물선, 44%) + 16%));
    animation: 물결 var(--물결주기, 8.2s) ease-in-out infinite alternate;
    will-change: transform;
  }
  /* 세기는 표가 정한다(가로 = 좌우 흔들림 % · 세로 = 물선 기준으로 늘었다 줄기 배). 네온 물가 = 0.22% · 1.012 (기본값). */
  @keyframes 물결 {
    from { transform: translate3d(calc(var(--물결가로, 0.22%) * -1), 0, 0) scale(1.004, var(--물결세로, 1.012)); }
    to   { transform: translate3d(var(--물결가로, 0.22%), 0.1%, 0) scale(0.996, calc(2 - var(--물결세로, 1.012))); }
  }
  .장 .판:not(.물있음) img.물비침 { display: none; }

  .장 .빛들 { position: absolute; inset: 0; pointer-events: none; }
  .장 .빛들 i {
    position: absolute; display: block; border-radius: 50%;
    transform: translate(-50%, -50%);
    animation-delay: var(--늦게, 0s);
    will-change: opacity;
  }
  .장 .빛들 i.등 {
    width: 6.2vw; height: 6.2vw;
    background: radial-gradient(circle, rgba(255,226,166,.62) 0%, rgba(255,214,140,.30) 28%, rgba(255,200,120,0) 68%);
    animation: 등깜빡 var(--주기, 13s) ease-in-out infinite;
  }
  .장 .빛들 i.등심 {
    width: 1.9vw; height: 1.9vw;
    background: radial-gradient(circle, rgba(30,24,52,.9) 0%, rgba(30,24,52,.7) 40%, rgba(30,24,52,0) 74%);
    opacity: 0;
    animation: 등심 var(--주기, 13s) linear infinite;
  }
  /* 가로등 — 대부분 잔잔히 숨 쉬고, 한 주기에 두 번(30%·71%) 짧게 꺼질 듯 흔들린다. 네 등의 주기가 다 달라 겹치지 않는다. */
  @keyframes 등깜빡 {
    0%, 100% { opacity: .55; } 9% { opacity: .64; } 18% { opacity: .48; } 27% { opacity: .62; }
    30% { opacity: .16; } 31.5% { opacity: .6; } 33% { opacity: .28; } 35% { opacity: .62; }
    50% { opacity: .5; } 64% { opacity: .62; }
    71% { opacity: .1; } 72.5% { opacity: .56; } 74% { opacity: .22; } 76% { opacity: .62; } 88% { opacity: .54; }
  }
  @keyframes 등심 {
    0%, 29%, 36%, 70%, 77%, 100% { opacity: 0; }
    30% { opacity: .6; } 31.5% { opacity: .05; } 33% { opacity: .42; } 35% { opacity: 0; }
    71% { opacity: .66; } 72.5% { opacity: .1; } 74% { opacity: .5; } 76% { opacity: 0; }
  }
  .장 .빛들 i.창 {
    width: var(--크기, 2.2vw); height: var(--크기, 2.2vw);   /* 등대 불·달빛처럼 큰 불은 표가 크기를 준다 */
    background: radial-gradient(circle, var(--색) 0%, transparent 62%);
    opacity: .35;
    animation: 반짝 var(--주기, 3.4s) ease-in-out infinite alternate;
  }
  @keyframes 반짝 { from { opacity: .18; } to { opacity: .85; } }
  /* 달 — 아주 천천히(30초 왕복) 숨만 쉰다. 잔잔한 결의 규율(설계 v1.5 §8-2). */
  .장 .빛들 i.달 {
    width: var(--크기, 12vw); height: var(--크기, 12vw);
    background: radial-gradient(circle, var(--색, rgba(235,238,255,.28)) 0%, rgba(235,238,255,.10) 40%, transparent 70%);
    opacity: .5;
    animation: 달숨 var(--주기, 30s) ease-in-out infinite alternate;
  }
  @keyframes 달숨 { from { opacity: .25; } to { opacity: .8; } }
  .장 .빛들 i.네온 {
    width: 3.4vw; height: 36vh;
    transform: translate(-50%, 0);
    border-radius: 50% / 10%;
    /* 색 띠가 66px 마다 되풀이되고(아래 흐름 이 66px 을 밀어 이음매 없이 돈다), 부드러운 타원 마스크가 기둥 꼴을 만든다 */
    background: repeating-linear-gradient(to bottom, var(--색) 0, transparent 22px, transparent 44px, var(--색) 66px);
    -webkit-mask-image: radial-gradient(50% 50% at 50% 38%, #000 0%, transparent 72%);
            mask-image: radial-gradient(50% 50% at 50% 38%, #000 0%, transparent 72%);
    opacity: .5;
    animation: 네온숨 var(--주기, 3s) ease-in-out infinite alternate, 흐름 var(--흐름주기, 6s) linear infinite;
  }
  @keyframes 네온숨 { from { opacity: .3; } to { opacity: .92; } }
  @keyframes 흐름 { from { background-position: 0 0; } to { background-position: 0 66px; } }
  @keyframes 숨 {
    from { transform: scale(1.045) translate3d(-0.5%, 0.35%, 0); }
    to   { transform: scale(1.085) translate3d(0.6%, -0.45%, 0); }
  }

  /* ③ 숨 쉬는 빛 — 좌상단 따뜻한 빛(킷 Butter Soft #FFEBB0). 무대와 마스코트 사이에 깔린다. */
  #빛 {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 72% at 12% 4%, rgba(255,235,176,.34), rgba(255,235,176,0) 62%);
    opacity: .34;
    animation: 빛숨 var(--빛숨주기, 26s) ease-in-out infinite alternate;
    transition: opacity .45s ease-out;
    will-change: opacity;
  }
  @keyframes 빛숨 { from { opacity: .26; } to { opacity: .48; } }

  /* 🆕 2026-09-08 «불빛 흔들림» — 유호 지시 「뒤에 배경 불빛이 흔들리게 해줘」.
     무대 그림에 박힌 창문·가로등·네온이 «물에 비쳐 일렁이는» 결을 낸다.
     🔑 그림 자체를 못 건드리므로(구운 펠트다) 그 위에 **아주 여린 빛 겹 둘**을 얹어 서로 다른 박자로
        밝아졌다 여린다. 겹이 둘이라 주기가 겹치지 않고, 그래서 규칙적인 깜빡임으로 안 읽힌다.
     🔴 색 연산(filter·blend)은 안 쓴다 — 펠트 결을 뭉갠다(마스코트 층과 같은 규격). opacity 만 민다.
     🔴 «천천히»가 이 방송의 규율이다(설계 v1.5 §8-2). 7.5초·11.3초 주기라 눈에 띄게 깜빡이지 않고
        보고 있으면 «살아 있다»만 남는다. 유호님 멀미 이력이 있는 자리라 움직임은 밝기뿐이고 자리는 안 바뀐다. */
  .일렁 {
    position: absolute; inset: 0; pointer-events: none;
    mix-blend-mode: normal;
    will-change: opacity;
  }
  #일렁1 {
    background:
      radial-gradient(38% 26% at 22% 34%, rgba(255,196,120,.20), rgba(255,196,120,0) 70%),
      radial-gradient(34% 22% at 74% 30%, rgba(150,210,255,.18), rgba(150,210,255,0) 70%);
    animation: 일렁A var(--일렁A주기, 7.5s) ease-in-out infinite alternate;
  }
  #일렁2 {
    background:
      radial-gradient(44% 30% at 50% 40%, rgba(255,150,190,.16), rgba(255,150,190,0) 72%),
      radial-gradient(30% 20% at 12% 26%, rgba(255,235,176,.16), rgba(255,235,176,0) 70%);
    animation: 일렁B var(--일렁B주기, 11.3s) ease-in-out infinite alternate;
  }
  @keyframes 일렁A { from { opacity: .30; } to { opacity: .92; } }
  @keyframes 일렁B { from { opacity: .85; } to { opacity: .22; } }
  /* ④ 사건에 어리는 빛 — 1.2초 밝아졌다 제자리로 */
  #빛.어린다 { animation: none; opacity: .92; transition: opacity 1.2s ease-out; }

  /* ② 떠다니는 보풀 — 양모 보풀이 천천히 떠오른다 */
  #보풀 { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #보풀 i {
    position: absolute; display: block;
    width: var(--굵기); height: var(--굵기);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,235,176,.85), rgba(255,235,176,0) 70%);
    animation: 떠오름 var(--시간) linear infinite;
    animation-delay: var(--늦게);
    will-change: transform, opacity;
    opacity: 0;
  }
  @keyframes 떠오름 {
    0%   { transform: translate3d(0, 6vh, 0);     opacity: 0; }
    12%  {                                         opacity: .55; }
    50%  { transform: translate3d(2.2vw, -46vh, 0); opacity: .5; }
    88%  {                                         opacity: .35; }
    100% { transform: translate3d(-1.4vw, -96vh, 0); opacity: 0; }
  }

  .경고 {
    position: absolute; left: 12px; bottom: 12px; max-width: 46ch;
    font: 13px/1.5 system-ui, sans-serif; color: #FBF7F0;          /* Paper */
    background: rgba(43,35,32,.86); border: 1px solid #F96859;     /* Coral */
    padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
  }
  #데모판 {
    position: absolute; left: 12px; top: 12px;
    font: 12px/1.6 ui-monospace, monospace; color: #FBF7F0;
    background: rgba(43,35,32,.72); padding: 8px 10px; border-radius: 8px;
    display: none;
  }
  body.데모 #데모판 { display: block; }
  @media (prefers-reduced-motion: reduce) {
    .장 .판, .장 img.물비침, .장 .빛들 i, #빛, #보풀 i, .일렁 { animation: none; }
  }
</style>
</head>
<body>
<div id="무대" aria-hidden="true">
  <div class="장"><div class="판"><img class="바탕" alt=""><img class="물비침" alt=""><div class="빛들"></div></div></div>

<script>
'use strict';

/* ── 설정(URL 파라미터) ─────────────────────────────────────────── */
const 인자 = new URLSearchParams(location.search);
if (인자.get('demo') === '1' || 인자.get('데모') === '1') document.body.classList.add('데모');
{
  const 맞춤 = 인자.get('맞춤');                    // object-position (예: 「center 60%」)
  if (맞춤) document.documentElement.style.setProperty('--맞춤', 맞춤);
}

/* ── 🆕 2026-09-08 «구울 때의 박자» — `?루프=<초>` ──────────────────────────────
   이 지면은 방송에 «그대로» 나가지 않는다. 방송 배경은 곡 팩(.ts)에 영상으로 박혀 있고(라디오무대만팩.sh),
   그 영상은 tools/무대영상굽기.js 가 이 지면을 헤드리스 크롬으로 한 장씩 찍어 만든다.
   영상은 <루프>초로 잘라 되풀이되므로, 되풀이되는 모든 박자가 그 길이를 «정확히 나눠야» 이음매가 안 보인다.
   🔑 루프가 오면 모든 박자를 루프/n (n = 1…60) 중 가장 가까운 값으로 «살짝» 옮긴다 — 7.5초는 7.5초 그대로,
      11.3초는 10초로, 54초 숨은 30초 왕복(=60초 한 바퀴)으로. 미리보기·OBS 에서는 인자가 없어 박자가 그대로다.
   ⚠ 왕복(alternate)은 두 번이 한 바퀴다 — 그래서 왕복 박자는 «2×초»가 루프를 나눠야 한다. */
const 루프 = Math.max(0, parseFloat(인자.get('루프')) || 0);
function 박자(초, 왕복 = false) {
  if (!루프) return 초;
  const 바퀴 = 왕복 ? 초 * 2 : 초;
  let 가장 = 루프;
  for (let n = 2; n <= 60; n++) { const 후보 = 루프 / n; if (Math.abs(후보 - 바퀴) < Math.abs(가장 - 바퀴)) 가장 = 후보; }
  return 왕복 ? 가장 / 2 : 가장;
}
const 초로 = (x) => x.toFixed(3).replace(/\.?0+$/, '') + 's';
if (루프) {
  const r = document.documentElement.style;
  r.setProperty('--숨주기', 초로(박자(54, true)));
  r.setProperty('--빛숨주기', 초로(박자(26, true)));
  r.setProperty('--일렁A주기', 초로(박자(7.5, true)));
  r.setProperty('--일렁B주기', 초로(박자(11.3, true)));
  r.setProperty('--물결주기', 초로(박자(8.2, true)));
}

/* ── 무대 그림 ────────────────────────────────────────────────────
   🔴 결 이름은 `마스코트.html` 의 `장르차림` 키와 **같은 낱말**이다(일곱).
      한쪽만 고치면 그 결에서 DJ 는 갈아입는데 무대는 그대로 서 있다 — 가장 안 보이는 자리다. */
const 무대경로 = '../../docs/Loom_자산/무대/';
/* 🆕 09-07 추석보름달마당 — 추석 시즌 무대(2026-09-25). 이 목록이 결 이름의 정본 자리이고,
   `마스코트.html` 의 `장르차림` 열쇠와 «같아야» 한다(tests/라디오오버레이층.test.js 가 잰다). */
const 결들 = ['시티팝노을휴양지', '전자밤도시', '드림하늘', '드림물결', '드림들판', '차분달빛호수', '집안밤공부', '추석보름달마당', '전자네온물가'];
const 무대파일 = (결) => 무대경로 + 결 + '.webp';

const 겹들 = Array.from(document.querySelectorAll('.장'));
const 그림들 = 겹들.map((d) => d.querySelector('img.바탕'));
const 판들 = 겹들.map((d) => d.querySelector('.판'));
const 물비침들 = 겹들.map((d) => d.querySelector('img.물비침'));
let 선겹 = 0;                                      // 지금 «보이는» 겹의 번호
let 현재결 = null;

/* ── 🆕 2026-09-08 무대별 «빛 지도» ──────────────────────────────────────────
   무대 그림에 박힌 불빛의 자리. 화면(16:9 프레임) 기준 백분율이다.
   🔑 값은 그림을 도구로 잰 것이다(밝고 따뜻한 덩이 = 등 · 밝고 채도 높은 작은 덩이 = 창 · 물 위 밝고 채도 높은 세로 기둥 = 네온).
      정사각 그림을 16:9 에 cover 로 채우면 위아래 21.875% 씩 잘리므로 y_화면 = (y_그림 − 0.21875) ÷ 0.5625 로 옮겼다.
   ⚠ 그림을 다시 구우면 이 표도 다시 잰다 — 눈대중으로 옮겨 적지 않는다.
   표에 없는 결은 빛 조각 없이 그림만 선다(그래도 바깥 일렁·보풀·숨은 돈다). */
const 네온색 = { 분홍: 'rgba(222,72,178,.5)', 파랑: 'rgba(24,186,236,.46)', 주황: 'rgba(240,164,112,.46)', 호박: 'rgba(210,140,92,.42)' };
const 무대빛 = {
  전자네온물가: {
    물선: 44,                                     // 물이 시작되는 높이(%) — 물비침·잔물결의 마스크 선
    등: [[6.2, 22.2], [13.2, 24.0], [87.1, 24.2], [93.5, 22.4]],
    창: [
      [16.7, 36.1, '#2edcf0'], [20.0, 30.8, '#f9a345'], [21.6, 34.9, '#1fdafd'], [24.9, 36.0, '#fe9537'],
      [37.0, 31.9, '#f6a263'], [39.1, 34.7, '#31e0fb'], [41.6, 39.9, '#43dffa'], [44.4, 29.2, '#f7c278'],
      [49.0, 36.1, '#f6c255'], [52.3, 38.4, '#fe9f39'], [58.8, 38.4, '#f6ac57'], [61.0, 35.2, '#fb8d45'],
      [63.5, 29.6, '#f8b065'], [66.4, 35.8, '#20e8fa'], [70.1, 27.1, '#24d1f9'], [72.1, 32.2, '#f4a747'],
      [74.6, 33.6, '#20e8fb'], [79.0, 30.3, '#fb8d5f'], [82.9, 36.8, '#f7a435'],
    ],
    네온위: 47,                                   // 네온 기둥의 윗머리(%)
    네온: [
      [8.7, '분홍'], [24.8, '분홍'], [30.3, '분홍'], [39.2, '파랑'], [41.7, '파랑'], [48.6, '파랑'],
      [52.4, '주황'], [58.7, '주황'], [62.7, '주황'], [66.5, '파랑'], [70.9, '파랑'], [90.5, '호박'], [94.5, '호박'],
    ],
  },
  /* 🆕 09-08 시티팝 — 유호 지적 09-07 「나무 흔들리는거랑 파도치는거 좀 부자연스러워」(Veo 영상). 나무는 안 움직이고
     바다만 살린다: 부두 오른쪽 바다(다각형)를 물비침으로 좌우 0.35% · 위아래 2.4% 흔들고, 등대 불이 4.4초로 숨 쉰다.
     자리는 화면 프레임에서 읽었다(등대 불 x0.469 y0.06 · 바다 = 부두 대각선 오른쪽 · 윗선 0.30 · 거품선 0.57). */
  시티팝노을휴양지: {
    /* 맞춤 = 그림을 조금 위로(44%) — 가운데로 자르면 등대 꼭대기가 숨 쉬는 확대(4.5~8.5%)에 잘려 화면 위 끝에서 들락날락한다.
       옛 팩(라디오배경굽기 장르표)도 세로 40% 였다. 아래 자리들은 이 맞춤 기준으로 잰 값이다(가운데 기준 +4.7%). */
    맞춤: 'center 44%',
    물선: 35,
    물꼴: 'polygon(47% 33.7%, 100% 33.7%, 100% 63.7%, 33% 63.7%)',
    물결: { 가로: 0.35, 세로: 1.024, 주기: 7.5, 밝기: .55 },
    창: [[46.9, 10.9, 'rgba(255,214,150,.75)', '5vw']],
    창주기: [4.4],
  },
  /* 🆕 09-08 차분 — 정지 그림이던 무대. 달이 30초에 한 번 숨 쉬고, 호수(창틀 안 다각형)가 아주 여리게 일렁인다.
     잔잔함이 상품인 결이라 흔들림은 네온의 절반이다(가로 0.12% · 세로 1.008). 달 자리 x0.625 y0.104 · 물비침 달 x0.62 y0.43. */
  차분달빛호수: {
    물선: 33,
    물꼴: 'polygon(15% 42%, 52% 42%, 55% 33%, 93% 33%, 93% 87%, 15% 87%)',
    물결: { 가로: 0.12, 세로: 1.008, 주기: 11, 밝기: .45 },
    달: [[62.5, 10.4, '13vw'], [62.0, 43.0, '11vw']],
  },
};

/** 판 하나에 그 결의 빛 조각을 심는다. 박자는 «번호로 정해진» 값이라 두 겹·두 기계에서 늘 같다(구울 때 재현되어야 한다). */
function 빛심기(번호, 결) {
  const 판 = 판들[번호];
  const 통 = 판.querySelector('.빛들');
  const 지도 = 무대빛[결];
  통.replaceChildren();
  판.classList.toggle('물있음', !!(지도 && 지도.물선 != null));
  판.style.setProperty('--물선', ((지도 && 지도.물선 != null) ? 지도.물선 : 44) + '%');
  const 물결 = (지도 && 지도.물결) || {};
  if (지도 && 지도.맞춤) 판.style.setProperty('--맞춤', 지도.맞춤); else 판.style.removeProperty('--맞춤');   // 결별 자르기 자리(없으면 ?맞춤= 또는 가운데)
  판.style.setProperty('--물꼴', (지도 && 지도.물꼴) || 'none');
  판.style.setProperty('--물결가로', (물결.가로 == null ? 0.22 : 물결.가로) + '%');
  판.style.setProperty('--물결세로', String(물결.세로 == null ? 1.012 : 물결.세로));
  판.style.setProperty('--물결주기', 초로(박자(물결.주기 == null ? 8.2 : 물결.주기, true)));
  판.style.setProperty('--물비침밝기', String(물결.밝기 == null ? .5 : 물결.밝기));
  if (!지도) return;
  const 넣기 = (cls, x, y, 값들) => {
    const e = document.createElement('i');
    e.className = cls;
    e.style.left = x + '%';
    e.style.top = y + '%';
    for (const [k, v] of Object.entries(값들)) e.style.setProperty(k, v);
    통.appendChild(e);
  };
  (지도.등 || []).forEach(([x, y], i) => {
    const 박 = { '--주기': 초로(박자(12.7 + i * 2.3)), '--늦게': (-(i * 3.7 + 1.1)).toFixed(1) + 's' };
    넣기('등', x, y, 박);
    넣기('등심', x, y, 박);
  });
  (지도.창 || []).forEach(([x, y, 색, 크기], i) => 넣기('창', x, y, {
    '--색': 색, '--크기': 크기 || '2.2vw',
    '--주기': 초로(박자((지도.창주기 && 지도.창주기[i]) || (2.6 + ((i * 7) % 11) * 0.26), true)),
    '--늦게': (-((i * 5) % 13) * 0.37).toFixed(2) + 's' }));
  (지도.달 || []).forEach(([x, y, 크기], i) => 넣기('달', x, y, {
    '--크기': 크기 || '12vw', '--주기': 초로(박자(30 + i * 4, true)), '--늦게': (-(i * 9)).toFixed(1) + 's' }));
  (지도.네온 || []).forEach(([x, 결색], i) => 넣기('네온', x, 지도.네온위 == null ? 47 : 지도.네온위, {
    '--색': 네온색[결색] || 결색, '--주기': 초로(박자(2.4 + ((i * 5) % 9) * 0.25, true)), '--늦게': (-((i * 3) % 7) * 0.53).toFixed(2) + 's',
    '--흐름주기': 초로(박자(5.2 + ((i * 4) % 7) * 0.6)) }));
}

/** 밝기를 «타이머로» 서서히 민다 — 그림 시계가 멎어도 끝까지 간다(위 CSS 주석의 그 자리). */
function 서서히(요소, 목표, 초) {
  const 시작 = parseFloat(요소.style.opacity || getComputedStyle(요소).opacity) || 0;
  if (시작 === 목표) return;
  clearInterval(요소._시계);
  const t0 = performance.now();
  요소._시계 = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / (초 * 1000));
    const 결 = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // 부드럽게 들고 부드럽게 놓기
    요소.style.opacity = (시작 + (목표 - 시작) * 결).toFixed(4);
    if (p >= 1) { clearInterval(요소._시계); 요소._시계 = null; 요소.style.opacity = String(목표); }
  }, 33);
}

function 경고(글) {
  console.error('[무대 오버레이] ' + 글);
  let 판 = document.querySelector('.경고');
  if (!판) { 판 = document.createElement('div'); 판.className = '경고'; document.body.appendChild(판); }
  판.textContent = '무대 오버레이: ' + 글;
}

/** 일곱 장을 미리 받아 둔다 — 안 받아 두면 전환 첫 순간에 «검은 화면»이 스친다. */
const 받아둠 = new Map();
function 미리받기(결) {
  if (받아둠.has(결)) return 받아둠.get(결);
  const p = new Promise((되면, 안되면) => {
    const im = new Image();
    im.onload = () => 되면(im);
    im.onerror = () => 안되면(new Error(결));
    im.src = 무대파일(결);
  });
  받아둠.set(결, p);
  return p;
}

/** 무대를 갈아 세운다. 겹 둘을 번갈아 쓰며 2.4초에 걸쳐 포갠다.
 *
 * 🔴 «어느 겹이 서 있나»는 **기다리기 전에** 정한다 (09-06 실측).
 *   전에는 그림이 다 뜬 뒤에 정했다. 그런데 같은 사건이 두 번 들어오면(문이 둘이라 그럴 수 있다)
 *   두 부름이 같은 겹을 골라 잡고, 나중 것이 «방금 세운 겹»을 도로 내려서 화면이 통째로 검어졌다.
 *   ⇒ 번호를 먼저 떼고(현재결·선겹), 그림이 뜬 뒤에는 «내 차례가 아직 최신인가»만 본다. */
let 차례 = 0;
function 무대세우기(결, 처음 = false) {
  if (!결 || 결 === 현재결) return;
  if (!결들.includes(결)) { 경고('모르는 결이라 무대를 안 바꾼다: ' + 결); return; }
  const 옛결 = 현재결;
  const 옛겹 = 선겹;
  const 다음 = (선겹 + 1) % 겹들.length;
  const 내차례 = ++차례;
  현재결 = 결;
  선겹 = 다음;
  미리받기(결).then(() => {
    if (내차례 !== 차례) return;                    // 그새 다른 결이 왔다 — 늦게 온 그림이 이기면 안 된다
    그림들[다음].src = 무대파일(결);
    물비침들[다음].src = 무대파일(결);             // 물비침은 «같은 그림»을 물 자리에만 한 장 더 깐다
    빛심기(다음, 결);
    if (!처음) 빛어리기(1.6);                       // 겹치는 순간 빛이 한 번 어린다 = 「장면이 바뀌었다」
    /* 🔴 다음 그림 프레임(requestAnimationFrame)을 기다리지 않는다 (09-06 실측).
       숨은 탭·절전에서는 그 부름이 아예 안 와서 무대가 «영영 안 선다» — 화면이 통째로 검어졌다.
       (같은 함정을 마스코트 층이 이미 겪었다 — 그 파일의 「rAF 기아 폴백」 주석 자리다.)
       옮겨 붙이기(transition)는 «앞 프레임의 값»에서 출발하므로, 여기서는 셈만 한 번 시키면 된다. */
    겹들[다음].classList.add('선다');
    겹들[옛겹].classList.remove('선다');
    서서히(겹들[다음], 1, 처음 ? 0.8 : 2.4);
    서서히(겹들[옛겹], 0, 처음 ? 0.8 : 2.4);
    데모판갱신();
  }).catch(() => {
    if (내차례 === 차례) { 현재결 = 옛결; 선겹 = 옛겹; }
    경고('무대 그림이 없다: ' + 무대파일(결) + ' (무대를 안 바꾼다)');
  });
}

/* ── ④ 사건에 어리는 빛 ─────────────────────────────────────────── */
const 빛 = document.getElementById('빛');
let 빛시계 = null;
function 빛어리기(초 = 1.2) {
  빛.classList.add('어린다');
  clearTimeout(빛시계);
  빛시계 = setTimeout(() => 빛.classList.remove('어린다'), 초 * 1000);
}

{
  const 판 = document.getElementById('보풀');
  const 몇 = 14;                                   // 잔잔함이 정본이라 많이 안 뿌린다
  for (let i = 0; i < 몇; i++) {
    const e = document.createElement('i');

/* ── 이벤트 입구 (마스코트 층과 «같은 문») ───────────────────────── */
/* 봇이 사건을 한 번 보내면 무대는 배경을, 마스코트는 모션을 각자 집는다. */
function 사건받기(사건) {
  if (!사건 || !사건.종류) return;
  if (사건.종류 === '결') { 무대세우기(사건.결); return; }
  // 글자 없이 «반응»만 한다 — 문안은 전광판 몫이다
  if (사건.종류 === '정답' || 사건.종류 === '체크인' || 사건.종류 === '인사' || 사건.종류 === '연동') 빛어리기();
}
/* 🔴 문 손잡이를 «변수에 잡아 둔다» — 안 잡으면 브라우저가 청소하다 문째로 치운다(09-06 실측). */
let 문 = null;
try {
  문 = new BroadcastChannel('라디오오버레이');
  문.onmessage = (e) => 사건받기(e.data);
} catch (_) { /* OBS CEF 구버전 — postMessage 만으로 동작 */ }
window.addEventListener('message', (e) => {
  if (e.data && e.data.채널 === '라디오오버레이') 사건받기(e.data);
});
window.무대반응 = (x) => 사건받기(typeof x === 'string' ? { 종류: x } : x);

/* ── 첫 무대 ─────────────────────────────────────────────────────── */
무대세우기(인자.get('결') || '드림하늘', true);
// 나머지 여섯도 뒤따라 받아 둔다(전환이 즉시 서게)
setTimeout(() => 결들.forEach((결) => 미리받기(결).catch(() => { /* 그 장만 없는 것 */ })), 1200);

/* ── 데모(?demo=1) — 일곱 무대를 돌려 눈으로 검수한다 ─────────────── */
const 데모판 = document.getElementById('데모판');
function 데모판갱신() {
  if (!document.body.classList.contains('데모')) return;
  데모판.textContent = `무대: ${현재결}\n(수동: 무대반응({종류:'결', 결:'전자밤도시'}))`;
}
if (document.body.classList.contains('데모')) {
  let i = 0;
  setInterval(() => { i++; 사건받기({ 종류: '결', 결: 결들[i % 결들.length] }); }, 6000);
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK 라디오 오버레이 — 마스코트</title>
<!--
  라디오24 오버레이 · 마스코트 상주 층 (유호 확정 08-14 「화면에 세워서 자동으로 움직이고 반응하게」 · Claude FM 오마주)

  구현 명세 = 이 파일의 주석이 정본이다 (⚰tools/마스코트모션.py 는 삭제됨 · 08-23 실측 — 원칙만
  승계: 스프라이트 «교체» + 트랜스폼뿐, 색 연산 0. 아래 마스코트모션.py 언급들은 그 옛 원본 표기다).
  그림 정본 = 토큰 재질.펠트.정본사진.평상복 세트의 누끼 = docs/캐릭터/정본_4K/ (몽글 6컷 · 09-05 판올림 — 한 컷에 파일 하나, 전부 투명).

  ■ v2 (2026-09-01 · 유호 확정 08-25 ③) — **DJ 가 둘이 됐다: 몽글 ↔ 까몽.**
    「몽글이 나가고 까몽이 들어오는 짧은 순간이 «누가 만든 방송인지»를 말하고, 그 과정이
    캐릭터에 생명력을 준다」. 교대는 결이 바뀌는 자리에서만 온다(`{종류:'결', 결, DJ}` ·
    하루 다섯 번 · Reed 편성 §3 「곡 사이마다 바뀌면 존재가 싸구려가 된다」).
    까몽 컷 = docs/캐릭터/정본_4K/ · 두 DJ 가 **같은 다섯 키**를 든다.
    교대 연출은 **트랜스폼만** 쓴다(색 연산 0 규격 그대로) — 페이드가 아니라 화면 밖으로
    나갔다 들어오는 움직임이라, 확정 문면과도 그대로 맞는다.
  ⛔ 구판 마스코트_렌더/ (체리 글래시 13컷)는 2026-08-19 퇴역·삭제 — 아래 컷표 주석에 전말이 있다.
  킷(정본 = docs/디자인_토큰.json): 무대=Ink Deep #080605 + 좌상단 따뜻한 빛(Butter Soft) ·
  글자=Paper #FBF7F0 · 신호 1점=Coral #F96859 테두리.
  ⚠08-25 현행화 — 여기 살던 「Navy2」·「Cream」은 무채축(08-18)에서 «퇴역한 이름»이었고, 08-23 의
  「퇴역 색 이름 15자리 스윕」이 이 폴더를 안 탔다. 다크는 「양모 밤」이 현행이다(조항 ⓚ · 유호 확정
  08-20) — 08-23 에 NPC 를 양모 밤으로 재채색한 그 축이고, 이 층이 마지막 잔여였다.

  이 파일이 안 싣는 것(근거가 있는 제외 — 넓히기 전에 원문을 연다):
    · 별눈(본체별눈)   — 발동 닫힌 목록(진화·생애 첫·시즌 완주)에 라디오 사건이 없다. 컷 자체를 로드하지 않는다.
    · 슬픔 계열 4컷    — 슬럼프 신고는 공개 화면에 되쏘지 않는다(라디오24_설계 §2 I-2). 반응 자체가 금지.
    · 텍스트·이모지    — 명령 피드백 문안은 P3 전광판 몫. 이 층은 마스코트만.
  틀릴 때의 모습: 컷 경로가 깨지면 방송에 마스코트가 조용히 «없음»으로 나간다 — 그래서 로드 실패는
  콘솔 에러 + (무대/데모 모드에선) 화면 경고로 드러낸다. 침묵 실패 금지.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* 무대 모드(?무대=1) — 방송 합성 대신 눈으로 검수하는 바닥: Ink Deep + 좌상단 따뜻한 빛 */
  body.무대 {
    background:
      radial-gradient(120% 70% at 10% 5%, rgba(255,235,176,.30), rgba(255,235,176,0) 60%),
      #080605;
  }
  #마스코트틀 {
    position: absolute;
    /* 기본 자리 = 우하단(방송 구석) — ?자리= 로 바꾼다 */
    right: 2.5vw; bottom: 3.5vh;
    width: var(--폭, 22vw);
    will-change: transform;
  }
  #마스코트틀 img {
    display: block; width: 100%; height: auto;
    /* 색 연산 0 — filter·blend 금지(마스코트모션.py 무손상 규격) */
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  #마스코트틀 img[hidden] { display: none; }
  /* 옷 층은 몸 «위에 겹친다» — 흐름대로 두면 아래위로 쌓인다(09-06 실측: 옷이 화면 위로 솟았다).
     몸 그림과 같은 정사각이라 left/top 0 · width 100% 면 자리가 딱 맞는다. */
  #마스코트틀 img.옷 { position: absolute; left: 0; top: 0; }
  /* 🆕 09-07 접지 그림자 — 스티커와 «앉은 것»을 가르는 한 겹(라디오배경굽기.js .접지 와 같은 자).
     발밑에 눌려 퍼진 타원. 옛 팩에는 무대 굽기가 그려 넣었는데, 무대만 팩으로 가면서 층이 진다.
     몸 «뒤»에 그려져야 하므로 첫 자식으로 두고, 색은 결(장르차림.접지)이 정한다. filter 를 안 쓴다(색 연산 0 규격). */
  #접지 { position: absolute; left: 50%; width: 86%; height: 14%; transform: translate(-50%, 50%);
          bottom: 15.6%; border-radius: 50%; pointer-events: none;
          background: radial-gradient(ellipse at 50% 50%, var(--접지색, rgba(10,10,14,0.38)) 0%, transparent 70%); }
  /* 🆕 2026-09-08 DJ 부스 — 유호 지시 「마스코트앞에 dj 부스같은거 설치해보는거어때? dj 컨트롤?
     디스크 판은 계속 돌아가게 해놓고」. 부스는 마스코트 «앞»에 서서 하반신을 가린다(DJ 가 부스 뒤에 선 꼴).
     🔑 부스·디스크는 **구운 펠트 그림**이다 — CSS 로 흉내내지 않는다(킷 ①). 여기서 CSS 가 하는 일은
        «도는 것» 하나뿐이고, 그건 재질이 아니라 움직임이라 규격에 안 걸린다.
     🔴 디스크는 «천천히» 돈다(8초 한 바퀴). 실제 LP 는 1.8초에 한 바퀴인데 그 속도로 돌리면
        24시간 켜 두는 화면에서 눈이 아프다 — 이 방송의 상품은 잔잔함이다(설계 v1.5 §8-2).
     ⚠ 디스크 그림은 «가운데를 맞춰 정사각»으로 담아 두었다. 안 그러면 도는 축이 어긋나 흔들린다. */
  #부스 {
    position: absolute; left: 50%; transform: translateX(-50%);
    /* 🔴 09-08 유호 지적 「dj 부스가 마린을 너무 가렸어」 — 30vw 는 마린 몸의 대부분을 덮었다.
       부스는 «앞에 놓인 물건»이지 마린을 대신하는 것이 아니다. 폭을 줄이고 아래로 더 내려서
       마린의 가슴 위가 드러나게 한다(실제 DJ 부스도 허리께에 온다). */
    /* 🔴 09-08 둘째 지적 「부스 옆에 뭐가 삐져나와있어」 — 부스 «그림» 왼쪽에 흰 종이 잔재가 남아 있었다
       (tools/부스다듬기.py 가 걷고 몸통 네모로 잘랐다). 캔버스가 1024→934 로 좁아져 같은 vw 면 부스가
       9% 커지므로, 눈에 보이는 크기가 그대로이게 폭을 24→22vw 로 내렸다(몸통 실폭 = 24vw × 0.912). */
    width: var(--부스폭, 22vw);
    bottom: var(--부스바닥, -3.5vh);
    pointer-events: none;
  }
  #부스 img.판 { display: block; width: 100%; height: auto; }
  /* 🔑 디스크 자리는 «눈대중이 아니라 잰 값»이다 — 부스 그림에서 빈 턴테이블 자리(가장 어두운 덩이) 둘의
     중심을 재니 왼쪽 x25.1% y22.2%, 오른쪽 x78.0% y21.9%, 지름 15.8%였다(09-08 · 종이 잔재를 걷고 몸통으로 자른 판 ·
     `python tools/부스다듬기.py` 가 이 값을 찍는다). 디스크 폭 17%(가로 기준)를 그 중심에 맞추면 아래 값이 된다.
     ⚠ top 은 «부스 높이» 기준이라 가로 17% 를 세로 몫으로 바꿔야 한다(부스 H/W = 0.641). */
  #부스 .디스크 {
    position: absolute; width: 17%;
    animation: 돈다 8s linear infinite;
    will-change: transform;
  }
  #부스 .디스크.왼 { left: 16.6%; top: 9.0%; }
  #부스 .디스크.오 { right: 13.5%; top: 8.6%; animation-duration: 8.6s; }   /* 둘이 «같이» 돌면 기계처럼 보인다 */
  @keyframes 돈다 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #부스 .디스크 { animation: none; } }

  .경고 {
    position: absolute; left: 12px; bottom: 12px; max-width: 46ch;
    font: 13px/1.5 system-ui, sans-serif; color: #FBF7F0;
    background: rgba(43,35,32,.86); border: 1px solid #F96859;
    padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
  }
  #데모판 {
    position: absolute; left: 12px; top: 12px;
    font: 12px/1.6 ui-monospace, monospace; font-variant-numeric: tabular-nums;
    color: #FBF7F0;
    background: rgba(43,35,32,.72); padding: 8px 10px; border-radius: 8px;
    display: none;
  }
  body.데모 #데모판 { display: block; }
</style>
</head>
<body>
<div id="마스코트틀" aria-hidden="true"></div>
<div id="부스" aria-hidden="true" hidden></div>
<div id="데모판"></div>
<script>
'use strict';
/* ── 설정(URL 파라미터) ─────────────────────────────────────────── */
const 인자 = new URLSearchParams(location.search);
if (인자.get('무대') === '1') document.body.classList.add('무대');
if (인자.get('demo') === '1' || 인자.get('데모') === '1') document.body.classList.add('데모');
{
  const 폭 = parseFloat(인자.get('크기'));
  if (폭 > 0 && 폭 <= 1) document.documentElement.style.setProperty('--폭', (폭 * 100) + 'vw');
  const 자리 = 인자.get('자리'); // 우하(기본)·좌하·우상·좌상
  const 틀 = document.getElementById('마스코트틀');
  if (자리 === '좌하') { 틀.style.right = 'auto'; 틀.style.left = '2.5vw'; }
  if (자리 === '우상') { 틀.style.bottom = 'auto'; 틀.style.top = '3.5vh'; }
  if (자리 === '좌상') { 틀.style.right = 'auto'; 틀.style.left = '2.5vw'; 틀.style.bottom = 'auto'; 틀.style.top = '3.5vh'; }
  /* 🆕 09-07 «중하» = 화면 가운데 아래 — 옛 팩에 박혀 있던 자리(무대 굽기의 .얼굴 left:50%). 무대만 팩으로 가면서 층이 그 자리에 선다.
     margin 으로 가운데를 맞춘다 — transform 은 반응 움직임이 쓰는 칸이라 여기서 안 건드린다. */
  if (자리 === '중하') { 틀.style.right = 'auto'; 틀.style.left = '50%'; 틀.style.marginLeft = 'calc(var(--폭, 22vw) / -2)'; }
  /* `?바닥=<vh>` — 발밑 여백. 무대의 앉는 선(라디오배경굽기 장르표 0.885)에 맞추는 손잡이. */
  const 바닥 = parseFloat(인자.get('바닥'));
  if (바닥 >= 0 && 바닥 <= 40) 틀.style.bottom = 바닥 + 'vh';
}

/* 🆕 2026-09-08 DJ 부스 — `?부스=1` 일 때만 선다. 결마다 켤지 말지가 갈리므로(잔잔한 결에는 안 어울린다)
   기본은 «꺼짐»이고 방송이 켠다. 크기·바닥은 마스코트와 같은 손잡이 문법을 쓴다. */
const 부스켬 = 인자.get('부스') === '1';   // 갈아입기(아래)도 본다 — 부스 뒤에 숨는 옷을 가르기 위해
/* 🆕 2026-09-08 부스가 «서는 결» — 부스는 조작대라 신나는 전자 곡에 어울리고, 차분한 달밤·추석 마당에 놓이면 결이 깨진다.
   그래서 `부스=1` 이어도 이 표에 든 결에서만 선다(방송은 늘 `부스=1` 로 켜 두고, 결이 정한다).
   ⏳ 유호님이 「모든 곡에」로 바꾸시면 이 표에 결을 더한다. */
const 부스결 = new Set(['전자네온물가', '전자밤도시']);
const 부스 = document.getElementById('부스');
let 부스판떴다 = false;
const 부스선다 = (결) => 부스켬 && 부스결.has(결);
function 부스맞추기() { 부스.hidden = !(부스판떴다 && 부스선다(현재차림)); }
{
  if (부스켬) {
    const 소품 = '../../docs/Loom_자산/라디오소품/';
    const 폭 = parseFloat(인자.get('부스크기'));
    if (폭 > 0 && 폭 <= 1) 부스.style.setProperty('--부스폭', (폭 * 100) + 'vw');
    const 바닥 = parseFloat(인자.get('부스바닥'));
    if (바닥 >= 0 && 바닥 <= 40) 부스.style.setProperty('--부스바닥', 바닥 + 'vh');
    const 판 = new Image();
    판.className = '판'; 판.alt = '';
    판.onload = () => { 부스판떴다 = true; 부스맞추기(); };
    판.onerror = () => 경고('부스 그림이 없다: ' + 판.src);   // 침묵 실패 금지 — 층의 규율 그대로
    부스.appendChild(판);
    for (const 쪽 of ['왼', '오']) {
      const d = new Image();
      d.className = '디스크 ' + 쪽; d.alt = '';
      d.onerror = () => 경고('디스크 그림이 없다: ' + d.src);
      부스.appendChild(d);
      d.src = 소품 + '디스크.webp';
    }
    판.src = 소품 + '부스.webp';
  }
}

/* ── 컷 (그림 정본 = 토큰 `재질.펠트.정본사진.평상복` 의 누끼 세트) ───────────────
   🔴 2026-08-20 수리 — 여기는 `마스코트_렌더/`(체리 글래시) 5컷을 들고 있었고,
      그 폴더는 **2026-08-19 에 퇴역·삭제**됐다(유호 확정 「이제 아예 안쓸거야」 · F659).
      즉 이 오버레이는 그날부터 그림이 전부 깨진 채였다 — 아무도 안 봤다(F671).
      🔑 이 자리를 «가드가 못 봤다»: 구판 검사는 지면방 「입는다」 23벌의 `src`/`url()` 만 보는데
         이 봇은 그 목록 밖이고, 경로도 JS 상수라 두 겹으로 사각이었다.

   ⚠ **여기가 손으로 고쳐야 하는 유일한 자리다** (2026-08-20 · 숨기지 않는다).
      다른 곳(`tools/*`)은 전부 `lib/마스코트자산.js` → `docs/디자인_토큰.json` 에서 경로를
      파생하지만, 이 파일은 **브라우저 문서**라 Node 모듈을 못 부른다. `fetch` 로 토큰을 읽는
      길은 있으나 그러면 `file://` 직접 열기가 죽는다(README 「보는 법」이 그 통로를 쓴다) —
      빌드 단계를 새로 만들지 않는 한 자동화되지 않는다.
      ⇒ **정본이 바뀌면 이 두 줄(컷경로·컷표)을 손으로 맞춘다.**
      정본 자리 = `docs/디자인_토큰.json` → `재질.펠트.정본사진.평상복` 의 폴더 + `누끼/`. */
/* 🆕 2026-09-07 — **화면용 1024 webp 로 갈아탄다**(정본은 그대로 `정본_4K/` 다 · 통로 `tools/마스코트층작게.py`).
   까닭은 «파일 크기»가 아니라 «브라우저가 펼쳐 놓는 몫»이다 — 4096² 한 장이 램에서 67MB 라,
   지금 싣는 13장만으로 871MB 였다. 표정을 넷씩 더하면 1.6GB 가 되어 램 3.9GB 서버에서 층이 죽는다
   (층이 죽으면 방송 화면이 통째로 빈다). 1024 면 한 장 4MB 라 스물다섯 장을 실어도 100MB 다.

const 틀 = document.getElementById('마스코트틀');
{ const 접지 = document.createElement('div'); 접지.id = '접지'; 틀.appendChild(접지); }   // 09-07 · 몸보다 먼저 붙여 몸 «뒤»에 그려진다
const 이미지 = { 몽글: {}, 까몽: {}, 마린: {} };   // DJ → 표정 → <img>
const 준비된DJ = new Set();
let 현재DJ = ['몽글', '까몽', '마린'].includes(인자.get('DJ')) ? 인자.get('DJ') : '몽글';
let 준비 = false;

function 경고(문구) {
  console.error('[마스코트 오버레이] ' + 문구);
  if (document.body.classList.contains('무대') || document.body.classList.contains('데모')) {

/* DJ 하나씩 «따로» 준비한다 — 한쪽 컷이 깨져도 다른 DJ 는 방송을 계속한다
   (v1 은 하나만 실패해도 화면 전체가 빈 채로 나갔다). 못 선 DJ 로의 교대는 그때 거절한다. */
Promise.all(Object.keys(컷표).map(DJ =>
  Promise.all(Object.entries(컷표[DJ]).map(([이름, 파일]) => new Promise(끝 => {
    const im = new Image();
    im.onload = () => 끝({ 이름, im, ok: true });
    im.onerror = () => 끝({ 이름, 파일, ok: false });
    im.src = 컷경로[DJ] + 파일;
  }))).then(결과 => {
    const 실패 = 결과.filter(r => !r.ok);
    if (실패.length) {
      경고(DJ + ' 컷이 없다 — 안 뜬 것이다(통과 아님): ' + 실패.map(r => r.파일).join(', '));
      return;
    }
    for (const r of 결과) {
      이미지[DJ][r.이름] = r.im;
      r.im.hidden = true;
      틀.appendChild(r.im);

    준비된DJ.add(DJ);

)).then(() => {

    경고(현재DJ + ' 컷이 없어 ' + 대신 + ' 로 선다.');
    현재DJ = 대신;
  }
  액자보정();
  /* 🆕 09-07 확인용 `?결=<장르>` — 그 결의 DJ 를 세우고 그 차림을 «교대 연출 없이» 바로 입힌다.
     방송 봇은 이 인자를 안 준다(봇은 곡이 바뀔 때 사건으로 넣는다). 눈으로 견주려고 사진을
     찍을 때 쓴다 — 이것이 없으면 차림은 곡이 실제로 바뀔 때까지 볼 수가 없다. */
  const 첫결 = 인자.get('결');

/* ── 액자 보정 — 두 DJ 가 «같은 크기·같은 발밑»으로 서게 한다 ────────────────
   🔴 왜 필요한가(실측 2026-09-01): 두 컷 다 1024² 인데 **그림이 캔버스를 채우는 몫이 다르다** —
      몽글 높이 0.563 / 까몽 0.836. 같은 틀에 그대로 그리면 교대하는 순간 까몽이 **1.5배로 커진다.**
      이건 「까몽이 더 크다」는 미술 결정이 아니라 **굽기 액자(여백)가 갈린 자국**이다.
   ⚠ **임시 다리다.** 진짜 처방은 두 DJ 를 같은 액자 규약으로 굽는 것이고 그건 굽기 레인 몫이다.
      그날이 오면 이 보정은 **저절로 1.0 에 수렴한다**(잰 값으로 계산하므로 걷어내는 손이 안 든다).
   기준은 몽글 — 정본 마스코트이고, 유호님이 지금까지 보신 크기가 그것이다.
   `file://` 로 열면 캔버스가 오염돼 못 잰다(README 「보는 법」이 그 통로를 쓴다) → 잰 값으로 대신한다. */
/* 🆕 2026-09-06 실측 — 4K 세대로 오면서 셋의 액자가 거의 같아졌다(옛 값 0.563 / 0.836 은
   1024 시절 것이라 낡아 있었다). 그래서 보정 배율이 1에 가깝게 수렴했다 — 위 「임시 다리」
   주석이 예고한 그 날이다. 값은 `docs/캐릭터/정본_4K/*_본체.png` 를 96칸으로 줄여 잰 것이다. */
const DJ꼴 = {};                                    // DJ → 액자 보정 꼴(옷 층이 같은 것을 쓴다)
const 잰액자 = {
  몽글: { 높이몫: .750, 바닥몫: .156 },
  까몽: { 높이몫: .760, 바닥몫: .104 },
  마린: { 높이몫: .688, 바닥몫: .135 },
};

function 액자재기(im) {
  try {
    const N = 96;
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(im, 0, 0, N, N);
    const d = x.getImageData(0, 0, N, N).data;   // file:// 면 여기서 SecurityError
    let 위 = -1, 아래 = -1;
    for (let y = 0; y < N; y++) {
      let 있나 = false;
      for (let px = 0; px < N; px++) if (d[(y * N + px) * 4 + 3] > 24) { 있나 = true; break; }
      if (있나) { if (위 < 0) 위 = y; 아래 = y; }
    }
    if (아래 < 0) return null;                    // 전부 투명 — 잴 것이 없다
    return { 높이몫: (아래 - 위 + 1) / N, 바닥몫: (N - 1 - 아래) / N };
  } catch (_) { return null; }
}

function 액자보정() {
  const 액자 = {};
  for (const DJ of 준비된DJ) 액자[DJ] = 액자재기(이미지[DJ]['기본']) || 잰액자[DJ];
  const 기준 = 액자['몽글'] || 액자[현재DJ];
  if (!기준 || !(기준.높이몫 > 0)) return;
  for (const DJ of 준비된DJ) {
    const a = 액자[DJ];
    if (!a || !(a.높이몫 > 0)) continue;
    const 배율 = 기준.높이몫 / a.높이몫;
    /* 발밑 맞추기 — scale 은 가운데를 축으로 도니, 그림 «아랫변»이 기준과 같은 자리에 오게 민다.
       %는 제 높이(=틀 높이) 기준이라 해상도가 바뀌어도 그대로 산다. */
    const 밀기 = ((1 - 기준.바닥몫) - 0.5 - (0.5 - a.바닥몫) * 배율) * 100;
    const 꼴 = 'translateY(' + 밀기.toFixed(2) + '%) scale(' + 배율.toFixed(4) + ')';
    DJ꼴[DJ] = 꼴;                                  // 옷 층도 «같은 꼴»을 써야 자리가 맞는다
    for (const im of Object.values(이미지[DJ])) im.style.transform = 꼴;
  }
}


/* ── 곡 장르마다 갈아입는다 (2026-09-06 · 유호 지시 09-06 「곡 장르마다 변환시킬때 도움될
      장치나 요소」) ────────────────────────────────────────────────────────────
   무엇인가: 결(곡 장르)이 바뀌면 DJ 가 **그 결의 차림으로 갈아입는다.** 옷은 마스코트에
   씌워 구운 뒤 «따로 노는 조각»으로 떼어 둔 것이라(통로 = tools/옷굽기.js), 몸을 안 건드리고
   위에 얹기만 한다. 그래서 표정이 바뀌어도 옷이 따라간다 — 조합도 표정도 굽는 값이 0 이다.

   🔑 **갈아입는 순간은 «화면 밖»이다.** 교대 연출이 DJ 를 아래로 내렸다가 올리는데, 그 사이에
      옷을 바꾼다. 화면에서 옷이 «팟» 하고 바뀌는 장면이 없다 — DJ 교대와 같은 규율이다.
   🔑 **자리는 몸이 정한다.** 옷 조각은 몸과 같은 4096 네모 안에서 같은 자리에 그려져 있어서,
      액자 보정으로 계산한 그 DJ 의 «꼴»을 그대로 먹이면 어긋날 자리가 없다.
   ⚠ 화면용은 1024 webp 다(`tools/옷층작게.py` 가 낸다) — 원본 4096 PNG 는 한 장 20MB 라
      셋을 겹치면 방송이 무거워진다. 원본은 git 밖이고 작은 판만 저장소에 든다.
   ⚠ 규격 그대로 **색 연산 0** — 얹기만 하고 filter·blend 를 안 쓴다.

   유호 확정 09-06 「의상 최대 1 + 악세 최대 2」를 화면도 그대로 지킨다 — 층이 셋뿐이다. */
const 옷경로 = '../../docs/Loom_자산/옷층/';
const 옷층수 = 3;                                   // 의상 1 + 악세 2 (유호 확정 09-06)

/* 결(곡 장르) → 누가 · 무엇을 입나.
   결 이름은 무대 배경과 같은 낱말을 쓴다(`docs/Loom_자산/구움/라디오무대_*.png` 일곱).
   🔑 성과 옷(배지 코트·왕관·화관·출석·첫 목소리)은 **안 쓴다** — 그건 학생이 «해내서» 여는
     물건이라, 방송 DJ 가 그냥 입고 있으면 그 뜻이 닳는다.
   🔴 아직 흠이 남은 셋(몽글 밀짚모자·몽글 첫 목소리 목도리·까몽 안경)도 안 쓴다(인계문 ⑤). */
/* 접지 = 발밑 그림자 색(09-07). 밝은 무대는 따뜻한 갈색을 옅게, 어두운 무대는 검정을 진하게 — 라디오배경굽기 장르표의 값이다. */
const 장르차림 = {
  /* 🔴 2026-09-07 정정 — 여기 «까몽»이 서 있었다. 무대를 굽는 자(`tools/라디오배경굽기.js` 장르표)는
     시티팝 노을 휴양지의 가이드를 **몽글**로 적고 있고, 무대 그림 자체가 그 대비로 구워졌다
     (같은 파일 주석: 「까몽은 검은 털이라 어두운 무대에서 사라지고, 몽글은 코랄이라 옅은 파스텔에 묻힌다」).
     🔑 이것이 유호님이 「몽글이랑 까몽이 셋 다」라고 하신 자리의 실체다 — 지금 도는 곡 열둘은
     시티팝 6 · 차분 2 · 전자 4 뿐인데, 시티팝을 까몽이 가져가 **몽글이 24시간 한 번도 안 섰다.**

function 갈아입기(결) {
  const 차림 = 장르차림[결];
  for (const im of 옷들) { im.hidden = true; im.removeAttribute('src'); }

  const 꼴 = DJ꼴[현재DJ] || '';

  const 입힐옷 = 부스선다(결) ? 차림.옷.filter((이름) => !부스뒤옷.has(이름)) : 차림.옷;
  입힐옷.slice(0, 옷층수).forEach((이름, i) => {
    const im = 옷들[i];
    im.onerror = () => {                            // 조용한 실패 금지 — 안 뜬 것은 안 뜬 것이다
      im.hidden = true;

    };

    im.style.transform = 꼴;                        // 몸과 «같은 꼴» — 어긋날 자리가 없다
    im.dataset.이름 = 이름;                          // 머리 옷인지 알기 위해(인사 컷 때 감춘다)

let 반응 = null;          // {종류, 시작t}
const 대기열 = [];         // 반응 중 수신분(최대 3 — 넘치면 버리고 콘솔에 남긴다)
const 최대지속 = { 인사: .3, 라운드: 1.1, 정답: 2.3, 체크인: 1.4, 투표: 2.2, 교대: 2.2 }; // 초 — 기쁨 컷 «상시 금지»의 기계 실체
/* 🆕 09-07 — 인사 «컷»이 있는 DJ 의 인사 길이. 스프링 0.3초는 몸이 튀는 시간이고, 숙인 컷은 «보여 주는» 시간이라
   더 길어야 읽힌다(방송에서 인형이 240px 이다). 1.2초 = 숙였다 드는 한 호흡. */
const 인사컷지속 = 1.2;
function 인사컷있나() { return !!(이미지[현재DJ] && 이미지[현재DJ]['인사']); }

function 밤인가(now) {
  if (인자.get('밤') === '1') return true;
  if (인자.get('밤') === '0') return false;
  const 시 = new Date(now).getHours(); // VPS/송출 PC 로컬시 = 울란바토르
  return 시 >= 3 && 시 < 6;
}

let 마지막틱 = 0;
function 프레임() {
  requestAnimationFrame(프레임);
  한틱();
}
function 한틱() {
  if (!준비) return;
  마지막틱 = performance.now();
  const t = (performance.now() - 시작) / 1000;
  const 폭px = 틀.clientWidth || 300;
  const 자 = 폭px / 331;               // 모션 도구 기준(720px 무대 · 마스코트 331px)으로 진폭 환산
  const 밤 = 밤인가(Date.now());

  /* 🔴 2026-09-06 유호 확정 — 「멀미나게 확대됐다 작아졌다 숨 쉬는 느낌 말고, 지금처럼 서 있되
     눈 깜빡거리는 거 너무 좋아」. 그래서 «가만히 있을 때»의 떠오름과 숨을 0 으로 못 박는다.
     반응(인사·정답·교대…)의 순간 움직임은 그대로 산다 — 유호님이 마다한 것은 «상시» 흔들림이다.
     되살리려면 이 두 줄을 옛 식으로 돌리면 된다(옛 식 = git 이력). */
  let 떠오름 = 0;
  const 숨 = 1;
  let sx = 숨, sy = 숨, 기울기 = 0, 컷 = 밤 ? '깜빡' : '기본';

  if (반응) {
    const p = t - 반응.시작t;
    const 끝t = (반응.종류 === '인사' && 인사컷있나()) ? 인사컷지속 : 최대지속[반응.종류];
    if (p >= 끝t) {
      반응 = null;
      if (대기열.length) 반응시작(대기열.shift());
    } else switch (반응.종류) {
      case '인사': {            // 탭 스프링 300ms — sx +13% · sy −15% · 들림 14px
        if (인사컷있나()) {     // 🆕 09-07 숙인 컷이 있는 DJ(마린) — 컷만 바뀐다 · 몸은 그 자리 · 흔들림 0
          컷 = '인사';
          break;
        }
        const s = Math.sin(p / .3 * Math.PI);
        sx = 숨 * (1 + 0.13 * s); sy = 숨 * (1 - 0.15 * s);
        떠오름 += 14 * s * 자;
        break;
      }
      case '라운드': {           // 라운드 열림 — 놀람(은은) + 소홉
        컷 = '놀람';
        const s = Math.sin(Math.min(p / .35, 1) * Math.PI);
        떠오름 += 10 * s * 자;
        break;
      }
      case '정답': {             // 정답 공개 — 기쁨 + 통통 튐(감쇠), 끝에 눈웃음 마무리
        const 튐 = Math.exp(-p * 2.6) * Math.sin(p * 13);
        떠오름 -= 26 * Math.abs(튐) * 0.7 * 자;
        sx = 숨 * (1 - 0.05 * 튐); sy = 숨 * (1 + 0.06 * 튐);
        컷 = p < 1.7 ? '기쁨' : '눈웃음';
        break;
      }
      case '체크인': {           // 자습 체크인 접수 — 눈인사 + 소홉
        컷 = '눈웃음';
        const s = Math.sin(Math.min(p / .4, 1) * Math.PI);
        떠오름 += 8 * s * 자;
        break;
      }
      case '투표': {             // 투표 반영 — 몸 살랑(감쇠 기울임 · 표정은 기본)
        기울기 = Math.exp(-p * 1.4) * Math.sin(p * 5.5) * 6;
        break;
      }
      /* DJ 교대 — 유호 확정 08-25 ③ 「몽글이 나가고 까몽이 들어오는 짧은 순간이
         «누가 만든 방송인지»를 말하고, 그 과정이 캐릭터에 생명력을 준다」.
         🔑 **트랜스폼만으로** 한다(색 연산 0 규격) — 페이드가 아니라 «화면 밖으로 걸어 나갔다
            들어오는» 움직임이라, 확정 문면(나가고 들어온다)과도 그대로 맞는다.
         세트 교체는 **화면 밖에 있는 순간**에 딱 한 번(중간에 바꾸면 바뀌는 장면이 보인다). */
      case '교대': {
        const 나감 = (틀.clientHeight || 300) * 1.35;
        if (p < .8) {                                   // ① 퇴장 — 아래로(ease-in)
          const s = (p / .8) * (p / .8);
          떠오름 -= 나감 * s;
        } else if (p < 1.6) {                           // ② 화면 밖에서 갈아입고 등장(ease-out)
          if (!반응.바꿨나) {
            DJ바꾸기(반응.DJ);
            /* 🔑 옷도 «여기서» 바꾼다 — 화면 밖이라 갈아입는 장면이 안 보인다.
                 DJ 를 먼저 바꾸는 순서가 중요하다: 옷은 «지금 DJ» 의 것을 집는다. */
            if (반응.결) 갈아입기(반응.결);
            반응.바꿨나 = true;
          }
          const u = (p - .8) / .8;
          떠오름 -= 나감 * (1 - u) * (1 - u);
        } else {                                        // ③ 새 DJ 의 짧은 인사(인사 스프링과 같은 공식)
          const s = Math.sin((p - 1.6) / .6 * Math.PI);
          sx = 숨 * (1 + 0.13 * s); sy = 숨 * (1 - 0.15 * s);
          떠오름 += 14 * s * 자;
        }
        break;
      }
    }
  } else if (!밤) {
    const ms = t * 1000;
    /* 표정 살이 — 깜빡임과 «같은 유휴 자리»라 겹치면 살이가 이긴다(둘 다 뜨면 얼굴이 떤다).
       반응(인사·정답…)이 오면 위 가지가 이겨서 여기까지 안 온다 — 규율은 그대로다. */
    if (살이 && ms > 살이.끝) { 살이 = null; 다음살이 = ms + 살이사이(); }
    if (!살이 && ms > 다음살이) {
      /* 그 DJ 에게 «있는» 컷만 고른다 — 없는 컷을 들면 화면이 빈다(옷 조각과 같은 규율). */
      const 기움 = 기우는컷[현재DJ];
      const 머리옷중 = 기움 && 머리옷쓴채();
      const 후보 = 살이컷들.filter((k) => 이미지[현재DJ] && 이미지[현재DJ][k] && !(머리옷중 && 기움.has(k)));
      if (후보.length) 살이 = { 컷: 후보[Math.floor(Math.random() * 후보.length)], 끝: ms + 살이지속 * 1000 };
      else 다음살이 = ms + 살이사이();     // 살이 컷이 하나도 없는 DJ — 조용히 넘어간다
    }
    if (살이) 컷 = 살이.컷;
    // 자연 깜빡임 150ms (반응 중엔 반응이 이긴다 — 모션 도구와 같은 우선순위)
    else if (ms > 다음깜빡 + 150) 다음깜빡 = ms + 2200 + Math.random() * 3000;
    else if (ms > 다음깜빡) 컷 = '깜빡';
  }

  /* 확인용 — `?고정=<컷>` 이면 그 컷을 계속 든다(헤드리스 크롬으로 사진을 찍어 견주는 용도 · 봇은 이 인자를 안 준다). */
  const 고정 = 인자.get('고정');
  if (고정 && 이미지[현재DJ] && 이미지[현재DJ][고정]) 컷 = 고정;
  표정(컷);
  for (const im of 옷들) im.style.visibility = (컷 === '인사' && 머리옷.has(im.dataset.이름 || '')) ? 'hidden' : '';
  틀.style.transform = `translateY(${(-떠오름).toFixed(2)}px) rotate(${기울기.toFixed(2)}deg) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
}
requestAnimationFrame(프레임);
// rAF 기아 폴백 — 숨은 탭·절전에선 rAF 가 서고 setInterval 만 돈다(실측 08-14: 데모판은 돌고
// transform 은 빈 채였다). 150ms 넘게 굶으면 인터벌이 대신 튼다 — OBS 에선 rAF 가 이긴다.
setInterval(() => { if (performance.now() - 마지막틱 > 150) 한틱(); }, 100);

/* ── 이벤트 입구 (봇·P3 전광판·데모가 같은 문으로 들어온다) ─────────── */
/* 사건 → 반응 매핑.
   🔴 이 표는 `전광판판정.js` 의 `마스코트표` 와 **같은 값**이어야 한다 — 마스코트는 `file://`
      로도 떠야 해서 그 파일을 못 읽는다(README 「보는 법」). 한쪽을 고치면 같은 커밋에서 다른 쪽을 연다.
   ⚠ **09-01 수리** — v1 엔 이 표가 «없어서» 사건 이름을 반응 이름으로 그대로 썼고, 그래서
      `연동` 이 허용 목록 밖으로 **조용히 무시**됐다(README 표는 「연동 → 인사」라고 적고 있었다).
      README 가 경고하던 «두 파일의 어휘 갈림»이 실제로 나 있던 자리다 — 아무도 안 봤다. */
const 반응표 = { 인사: '인사', 연동: '인사', 라운드: '라운드', 정답: '정답', 체크인: '체크인', 투표: '투표', 결: '교대' };
const 허용반응 = new Set(Object.keys(최대지속));
const DJ들 = ['몽글', '까몽', '마린'];

function 반응시작(일감) {
  /* 결(곡 장르)만 오고 누가 설지는 안 오는 사건이 있다 — 그때는 차림표가 정한다.
     표에 없는 결이면 DJ 를 안 바꾸고 옷만 벗긴다(모르는 결에 아무나 세우지 않는다). */
  if (일감 && 일감.종류 === '교대' && !일감.DJ && 일감.결) {
    const 정해진 = 결의DJ(일감.결);
    if (정해진) 일감 = Object.assign({}, 일감, { DJ: 정해진 });
  }
  반응 = Object.assign({ 시작t: (performance.now() - 시작) / 1000 }, 일감);
  /* 09-07 · 살이 컷을 내리고 다음 것을 미룬다 — 반응이 끝나자마자 살이가 이어 뜨면
     두 연출이 붙어 «부산스러움»이 된다. */
  살이 = null;
  다음살이 = (performance.now() - 시작) + 살이사이();
}
function 사건받기(사건) {
  const 종류 = 사건 && 반응표[사건.종류];
  if (!종류 || !허용반응.has(종류)) {
    // '슬럼프'·'합산'·'맥박'·'곡' 이 여기로 온다 — 슬럼프는 공개 화면 되쏘기 금지(설계 §2 I-2),
    // 나머지 셋은 전광판 몫이다. 조용히 무시하되 기록은 남긴다.
    console.warn('[마스코트 오버레이] 반응 없는 사건 무시: ' + (사건 && 사건.종류));
    return;
  }
  const 일감 = { 종류 };
  if (종류 === '교대') {
    /* 🆕 2026-09-06 — 결(곡 장르)을 «들고 간다». v2 는 이 줄이 없어서 결을 버렸고,
       그래서 「곡 장르마다 갈아입는다」가 원리상 설 수 없었다(유호 지시 09-06). */
    일감.결 = 사건.결 || null;
    /* DJ 를 안 주면 차림표가 정한다 — 봇은 «어느 결인지»만 알면 된다. */
    const 갈DJ = DJ들.includes(사건.DJ) ? 사건.DJ : 결의DJ(일감.결);
    if (!갈DJ) { console.warn('[마스코트 오버레이] 누가 설지 모른다 — 교대 안 함: DJ=' + 사건.DJ + ' 결=' + 일감.결); return; }
    /* 🆕 같은 DJ 라도 «결이 바뀌면» 나갔다 들어온다 — 그 사이에 옷을 갈아입기 때문이다.
       v2 는 여기서 물러났고, 그러면 화면에서 옷이 «팟» 하고 바뀌거나 아예 안 바뀐다. */
    if (갈DJ === 현재DJ && (!일감.결 || 일감.결 === 현재차림)) return;
    if (!준비된DJ.has(갈DJ)) { 경고('컷이 없어 ' + 갈DJ + ' 로 교대하지 않는다 — 지금 DJ 로 계속한다.'); return; }
    일감.DJ = 갈DJ;
  }
  if (반응) { if (대기열.length < 3) 대기열.push(일감); else console.warn('[마스코트 오버레이] 대기열 초과 — 버림: ' + 종류); }
  else 반응시작(일감);
}
/* 🔴 문 손잡이를 «변수에 잡아 둔다» (09-06 실측 · 유호님 앞에서 결이 안 바뀐 그 자리).
   `new BroadcastChannel(...).onmessage = ...` 만 쓰면 그 문을 가리키는 것이 아무 데도 없어,
   브라우저가 청소하다 문째로 치워 버린다 — 그러면 봇이 사건을 보내도 «조용히» 아무 일도 안 난다.
   무대 층도 같은 자리를 같은 커밋에서 고쳤다. */
let 문 = null;
try {
  문 = new BroadcastChannel('라디오오버레이');
  문.onmessage = e => 사건받기(e.data);
} catch (_) { /* OBS CEF 구버전 — postMessage 만으로 동작 */ }
window.addEventListener('message', e => {
  if (e.data && e.data.채널 === '라디오오버레이') 사건받기(e.data);
});
// 콘솔·시험용 — 낱말 하나('정답')로도, 사건 통째로도 받는다: 마스코트반응({종류:'결', DJ:'까몽'})
window.마스코트반응 = (x) => 사건받기(typeof x === 'string' ? { 종류: x } : x);

/* ── 데모 시나리오 (?demo=1 — 방송·봇 없이 반응을 눈으로 검수하는 용도) ── */
if (document.body.classList.contains('데모')) {
  const 판 = document.getElementById('데모판');
  const 시나리오 = [
    [{ 종류: '인사' },                 '인사 — 마린은 숙인 컷 1.2초 · 몽글·까몽은 탭 스프링(300ms)'],
    [{ 종류: '연동', 닉네임: '바트자야' }, '연동 완료 — 인사(v1 이 무시하던 자리)'],
    [{ 종류: '라운드' },               '퀴즈 라운드 열림 — 놀람'],
    [{ 종류: '정답' },                 '정답 공개 — 기쁨+통통 튐'],
    [{ 종류: '체크인' },               '자습 체크인 — 눈인사'],
    [{ 종류: '투표' },                 '빗소리 투표 반영 — 살랑'],
    [{ 종류: '결', 결: '낮', DJ: '까몽' }, 'DJ 교대 — 몽글이 나가고 까몽이 들어온다'],
    [{ 종류: '결', 결: '밤', DJ: '몽글' }, 'DJ 교대 — 까몽이 나가고 몽글이 들어온다'],
  ];
  let i = 0;
  판.textContent = '데모 대기 — 3초 뒤 시작';
  setInterval(() => {
    const [사건, 설명] = 시나리오[i % 시나리오.length];
    사건받기(사건);
    판.textContent = `데모 ${(i % 시나리오.length) + 1}/${시나리오.length} — ${설명}\n`
      + `지금 DJ: ${현재DJ} (준비된 DJ ${준비된DJ.size}/2)\n`
      + `(수동: 마스코트반응({종류:'결', DJ:'까몽'}))`;
    i++;
  }, 3800);
}
</script>

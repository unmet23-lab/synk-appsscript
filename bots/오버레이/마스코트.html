<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK 라디오 오버레이 — 마스코트</title>
<!--
  라디오24 오버레이 · 마스코트 상주 층 (유호 확정 08-14 「화면에 세워서 자동으로 움직이고 반응하게」 · Claude FM 오마주)

  구현 명세 = 이 파일의 주석이 정본이다 (⚰tools/마스코트모션.py 는 삭제됨 · 08-23 실측 — 원칙만
  승계: 스프라이트 «교체» + 트랜스폼뿐, 색 연산 0. 아래 마스코트모션.py 언급들은 그 옛 원본 표기다).
  그림 정본 = 토큰 재질.펠트.정본사진.평상복 세트의 누끼 = docs/캐릭터/정본_4K/ (몽글 6컷 · 09-05 판올림 — 한 컷에 파일 하나, 전부 투명).

  ■ v2 (2026-09-01 · 유호 확정 08-25 ③) — **DJ 가 둘이 됐다: 몽글 ↔ 까몽.**
    「몽글이 나가고 까몽이 들어오는 짧은 순간이 «누가 만든 방송인지»를 말하고, 그 과정이
    캐릭터에 생명력을 준다」. 교대는 결이 바뀌는 자리에서만 온다(`{종류:'결', 결, DJ}` ·
    하루 다섯 번 · Reed 편성 §3 「곡 사이마다 바뀌면 존재가 싸구려가 된다」).
    까몽 컷 = docs/캐릭터/정본_4K/ · 두 DJ 가 **같은 다섯 키**를 든다.
    교대 연출은 **트랜스폼만** 쓴다(색 연산 0 규격 그대로) — 페이드가 아니라 화면 밖으로
    나갔다 들어오는 움직임이라, 확정 문면과도 그대로 맞는다.
  ⛔ 구판 마스코트_렌더/ (체리 글래시 13컷)는 2026-08-19 퇴역·삭제 — 아래 컷표 주석에 전말이 있다.
  킷(정본 = docs/디자인_토큰.json): 무대=Ink Deep #080605 + 좌상단 따뜻한 빛(Butter Soft) ·
  글자=Paper #FBF7F0 · 신호 1점=Coral #F96859 테두리.
  ⚠08-25 현행화 — 여기 살던 「Navy2」·「Cream」은 무채축(08-18)에서 «퇴역한 이름»이었고, 08-23 의
  「퇴역 색 이름 15자리 스윕」이 이 폴더를 안 탔다. 다크는 「양모 밤」이 현행이다(조항 ⓚ · 유호 확정
  08-20) — 08-23 에 NPC 를 양모 밤으로 재채색한 그 축이고, 이 층이 마지막 잔여였다.

  이 파일이 안 싣는 것(근거가 있는 제외 — 넓히기 전에 원문을 연다):
    · 별눈(본체별눈)   — 발동 닫힌 목록(진화·생애 첫·시즌 완주)에 라디오 사건이 없다. 컷 자체를 로드하지 않는다.
    · 슬픔 계열 4컷    — 슬럼프 신고는 공개 화면에 되쏘지 않는다(라디오24_설계 §2 I-2). 반응 자체가 금지.
    · 텍스트·이모지    — 명령 피드백 문안은 P3 전광판 몫. 이 층은 마스코트만.
  틀릴 때의 모습: 컷 경로가 깨지면 방송에 마스코트가 조용히 «없음»으로 나간다 — 그래서 로드 실패는
  콘솔 에러 + (무대/데모 모드에선) 화면 경고로 드러낸다. 침묵 실패 금지.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* 무대 모드(?무대=1) — 방송 합성 대신 눈으로 검수하는 바닥: Ink Deep + 좌상단 따뜻한 빛 */
  body.무대 {
    background:
      radial-gradient(120% 70% at 10% 5%, rgba(255,235,176,.30), rgba(255,235,176,0) 60%),
      #080605;
  }
  #마스코트틀 {
    position: absolute;
    /* 기본 자리 = 우하단(방송 구석) — ?자리= 로 바꾼다 */
    right: 2.5vw; bottom: 3.5vh;
    width: var(--폭, 22vw);
    will-change: transform;
  }
  #마스코트틀 img {
    display: block; width: 100%; height: auto;
    /* 색 연산 0 — filter·blend 금지(마스코트모션.py 무손상 규격) */
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  #마스코트틀 img[hidden] { display: none; }
  .경고 {
    position: absolute; left: 12px; bottom: 12px; max-width: 46ch;
    font: 13px/1.5 system-ui, sans-serif; color: #FBF7F0;
    background: rgba(43,35,32,.86); border: 1px solid #F96859;
    padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
  }
  #데모판 {
    position: absolute; left: 12px; top: 12px;
    font: 12px/1.6 ui-monospace, monospace; font-variant-numeric: tabular-nums;
    color: #FBF7F0;
    background: rgba(43,35,32,.72); padding: 8px 10px; border-radius: 8px;
    display: none;
  }
  body.데모 #데모판 { display: block; }
</style>
</head>
<body>
<div id="마스코트틀" aria-hidden="true"></div>
<div id="데모판"></div>
<script>
'use strict';
/* ── 설정(URL 파라미터) ─────────────────────────────────────────── */
const 인자 = new URLSearchParams(location.search);
if (인자.get('무대') === '1') document.body.classList.add('무대');
if (인자.get('demo') === '1' || 인자.get('데모') === '1') document.body.classList.add('데모');
{
  const 폭 = parseFloat(인자.get('크기'));
  if (폭 > 0 && 폭 <= 1) document.documentElement.style.setProperty('--폭', (폭 * 100) + 'vw');
  const 자리 = 인자.get('자리'); // 우하(기본)·좌하·우상·좌상
  const 틀 = document.getElementById('마스코트틀');
  if (자리 === '좌하') { 틀.style.right = 'auto'; 틀.style.left = '2.5vw'; }
  if (자리 === '우상') { 틀.style.bottom = 'auto'; 틀.style.top = '3.5vh'; }
  if (자리 === '좌상') { 틀.style.right = 'auto'; 틀.style.left = '2.5vw'; 틀.style.bottom = 'auto'; 틀.style.top = '3.5vh'; }
}

/* ── 컷 (그림 정본 = 토큰 `재질.펠트.정본사진.평상복` 의 누끼 세트) ───────────────
   🔴 2026-08-20 수리 — 여기는 `마스코트_렌더/`(체리 글래시) 5컷을 들고 있었고,
      그 폴더는 **2026-08-19 에 퇴역·삭제**됐다(유호 확정 「이제 아예 안쓸거야」 · F659).
      즉 이 오버레이는 그날부터 그림이 전부 깨진 채였다 — 아무도 안 봤다(F671).
      🔑 이 자리를 «가드가 못 봤다»: 구판 검사는 지면방 「입는다」 23벌의 `src`/`url()` 만 보는데
         이 봇은 그 목록 밖이고, 경로도 JS 상수라 두 겹으로 사각이었다.

   ⚠ **여기가 손으로 고쳐야 하는 유일한 자리다** (2026-08-20 · 숨기지 않는다).
      다른 곳(`tools/*`)은 전부 `lib/마스코트자산.js` → `docs/디자인_토큰.json` 에서 경로를
      파생하지만, 이 파일은 **브라우저 문서**라 Node 모듈을 못 부른다. `fetch` 로 토큰을 읽는
      길은 있으나 그러면 `file://` 직접 열기가 죽는다(README 「보는 법」이 그 통로를 쓴다) —
      빌드 단계를 새로 만들지 않는 한 자동화되지 않는다.
      ⇒ **정본이 바뀌면 이 두 줄(컷경로·컷표)을 손으로 맞춘다.**
      정본 자리 = `docs/디자인_토큰.json` → `재질.펠트.정본사진.평상복` 의 폴더 + `누끼/`. */
const 컷경로 = {
  몽글: '../../docs/캐릭터/정본_4K/',
  까몽: '../../docs/캐릭터/정본_4K/',
  마린: '../../docs/캐릭터/정본_4K/',
};
/* DJ 둘이 **같은 다섯 키**를 든다 — 교대는 세트를 통째로 바꾸는 일이라, 키가 갈리면
   교대 순간에만 터진다(가장 안 보이는 자리). 까몽에만 있는 넷(윙크·으쓱·민망·졸림)은
   지금 «발동할 자리»가 없어 안 싣는다 — 넓히기 전에 원문을 연다(README 「안 하는 것」). */
const 컷표 = {
  몽글: {
    기본:   '몽글_본체.png',    // 구슬 눈 — 모든 화면의 기본값
    깜빡:   '몽글_눈감음.png',  // 자수 눈(실 가닥) = 깜빡임 프레임·잠
    눈웃음: '몽글_눈웃음.png',  // 자수 `^^` = 만족·눈인사
    /* ⏳유호 판정 자리 — 펠트 정본에 「기쁨(깜찍)」 컷이 **없다**(구판의 하이라이트 2점 큰 눈은
       체리 세트 전용이었다). 가장 가까운 긍정 표정인 눈웃음으로 잠시 덮는다 = 지금 기쁨과 눈웃음이
       같은 그림이다. 🚫 이 줄을 「해결됨」으로 읽지 마라 — 진짜 기쁨 컷이 오면 갈아끼운다. */
    기쁨:   '몽글_눈웃음.png',
    /* ✅ 09-05 해결 — 옛 `재염색_놀람.png` 은 본체 구슬을 1.35배로 키운 «합성물»이었는데,
       4K 판올림에서 제대로 굽혔다. 토큰의 상태도 「합성후보」에서 「정본」으로 올랐다. */
    놀람:   '몽글_놀람.png',
  },
  까몽: {
    기본:   '까몽_본체.png',
    깜빡:   '까몽_눈감음.png',
    눈웃음: '까몽_눈웃음.png',
    기쁨:   '까몽_눈웃음.png',   // 몽글과 같은 사정 — 까몽에도 「기쁨」 전용 컷이 없다
    놀람:   '까몽_놀람.png',
  },
};
const 틀 = document.getElementById('마스코트틀');
const 이미지 = { 몽글: {}, 까몽: {} };   // DJ → 표정 → <img>
const 준비된DJ = new Set();
let 현재DJ = ['몽글', '까몽'].includes(인자.get('DJ')) ? 인자.get('DJ') : '몽글';
let 준비 = false;

function 경고(문구) {
  console.error('[마스코트 오버레이] ' + 문구);
  if (document.body.classList.contains('무대') || document.body.classList.contains('데모')) {
    const el = document.createElement('div');
    el.className = '경고'; el.textContent = '🔴 ' + 문구;
    document.body.appendChild(el);
  }
}

/* DJ 하나씩 «따로» 준비한다 — 한쪽 컷이 깨져도 다른 DJ 는 방송을 계속한다
   (v1 은 하나만 실패해도 화면 전체가 빈 채로 나갔다). 못 선 DJ 로의 교대는 그때 거절한다. */
Promise.all(Object.keys(컷표).map(DJ =>
  Promise.all(Object.entries(컷표[DJ]).map(([이름, 파일]) => new Promise(끝 => {
    const im = new Image();
    im.onload = () => 끝({ 이름, im, ok: true });
    im.onerror = () => 끝({ 이름, 파일, ok: false });
    im.src = 컷경로[DJ] + 파일;
  }))).then(결과 => {
    const 실패 = 결과.filter(r => !r.ok);
    if (실패.length) {
      경고(DJ + ' 컷이 없다 — 안 뜬 것이다(통과 아님): ' + 실패.map(r => r.파일).join(', '));
      return;
    }
    for (const r of 결과) {
      이미지[DJ][r.이름] = r.im;
      r.im.hidden = true;
      틀.appendChild(r.im);
    }
    준비된DJ.add(DJ);
  })
)).then(() => {
  if (!준비된DJ.has(현재DJ)) {
    const 대신 = [...준비된DJ][0];
    if (!대신) { 경고('DJ 컷이 하나도 안 떴다 — 방송에 마스코트가 «없음»으로 나간다.'); return; }
    경고(현재DJ + ' 컷이 없어 ' + 대신 + ' 로 선다.');
    현재DJ = 대신;
  }
  액자보정();
  이미지[현재DJ]['기본'].hidden = false;
  준비 = true;
});

/* ── 액자 보정 — 두 DJ 가 «같은 크기·같은 발밑»으로 서게 한다 ────────────────
   🔴 왜 필요한가(실측 2026-09-01): 두 컷 다 1024² 인데 **그림이 캔버스를 채우는 몫이 다르다** —
      몽글 높이 0.563 / 까몽 0.836. 같은 틀에 그대로 그리면 교대하는 순간 까몽이 **1.5배로 커진다.**
      이건 「까몽이 더 크다」는 미술 결정이 아니라 **굽기 액자(여백)가 갈린 자국**이다.
   ⚠ **임시 다리다.** 진짜 처방은 두 DJ 를 같은 액자 규약으로 굽는 것이고 그건 굽기 레인 몫이다.
      그날이 오면 이 보정은 **저절로 1.0 에 수렴한다**(잰 값으로 계산하므로 걷어내는 손이 안 든다).
   기준은 몽글 — 정본 마스코트이고, 유호님이 지금까지 보신 크기가 그것이다.
   `file://` 로 열면 캔버스가 오염돼 못 잰다(README 「보는 법」이 그 통로를 쓴다) → 잰 값으로 대신한다. */
const 잰액자 = { 몽글: { 높이몫: .563, 바닥몫: .219 }, 까몽: { 높이몫: .836, 바닥몫: .055 } };

function 액자재기(im) {
  try {
    const N = 96;
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(im, 0, 0, N, N);
    const d = x.getImageData(0, 0, N, N).data;   // file:// 면 여기서 SecurityError
    let 위 = -1, 아래 = -1;
    for (let y = 0; y < N; y++) {
      let 있나 = false;
      for (let px = 0; px < N; px++) if (d[(y * N + px) * 4 + 3] > 24) { 있나 = true; break; }
      if (있나) { if (위 < 0) 위 = y; 아래 = y; }
    }
    if (아래 < 0) return null;                    // 전부 투명 — 잴 것이 없다
    return { 높이몫: (아래 - 위 + 1) / N, 바닥몫: (N - 1 - 아래) / N };
  } catch (_) { return null; }
}

function 액자보정() {
  const 액자 = {};
  for (const DJ of 준비된DJ) 액자[DJ] = 액자재기(이미지[DJ]['기본']) || 잰액자[DJ];
  const 기준 = 액자['몽글'] || 액자[현재DJ];
  if (!기준 || !(기준.높이몫 > 0)) return;
  for (const DJ of 준비된DJ) {
    const a = 액자[DJ];
    if (!a || !(a.높이몫 > 0)) continue;
    const 배율 = 기준.높이몫 / a.높이몫;
    /* 발밑 맞추기 — scale 은 가운데를 축으로 도니, 그림 «아랫변»이 기준과 같은 자리에 오게 민다.
       %는 제 높이(=틀 높이) 기준이라 해상도가 바뀌어도 그대로 산다. */
    const 밀기 = ((1 - 기준.바닥몫) - 0.5 - (0.5 - a.바닥몫) * 배율) * 100;
    const 꼴 = 'translateY(' + 밀기.toFixed(2) + '%) scale(' + 배율.toFixed(4) + ')';
    for (const im of Object.values(이미지[DJ])) im.style.transform = 꼴;
  }
}

let 현재표정 = '기본';
function 표정(이름) {
  if (!준비 || 이름 === 현재표정) return;
  이미지[현재DJ][현재표정].hidden = true;
  이미지[현재DJ][이름].hidden = false;
  현재표정 = 이름;
}

/** DJ 세트를 통째로 바꾼다 — 교대 연출이 **화면 밖에 있는 동안**에만 부른다. */
function DJ바꾸기(새DJ) {
  if (!준비된DJ.has(새DJ) || 새DJ === 현재DJ) return;
  이미지[현재DJ][현재표정].hidden = true;
  현재DJ = 새DJ;
  현재표정 = '기본';
  이미지[현재DJ]['기본'].hidden = false;
}

/* ── 상태 (마스코트모션.py 상태()의 웹 이식 — 부유·숨·깜빡·스프링·감쇠 튐 공식 그대로) ── */
const 시작 = performance.now();
let 다음깜빡 = 2000 + Math.random() * 3000;
let 반응 = null;          // {종류, 시작t}
const 대기열 = [];         // 반응 중 수신분(최대 3 — 넘치면 버리고 콘솔에 남긴다)
const 최대지속 = { 인사: .3, 라운드: 1.1, 정답: 2.3, 체크인: 1.4, 투표: 2.2, 교대: 2.2 }; // 초 — 기쁨 컷 «상시 금지»의 기계 실체

function 밤인가(now) {
  if (인자.get('밤') === '1') return true;
  if (인자.get('밤') === '0') return false;
  const 시 = new Date(now).getHours(); // VPS/송출 PC 로컬시 = 울란바토르
  return 시 >= 3 && 시 < 6;
}

let 마지막틱 = 0;
function 프레임() {
  requestAnimationFrame(프레임);
  한틱();
}
function 한틱() {
  if (!준비) return;
  마지막틱 = performance.now();
  const t = (performance.now() - 시작) / 1000;
  const 폭px = 틀.clientWidth || 300;
  const 자 = 폭px / 331;               // 모션 도구 기준(720px 무대 · 마스코트 331px)으로 진폭 환산
  const 밤 = 밤인가(Date.now());

  let 떠오름 = Math.sin(t * 1.9) * 10 * 자 * (밤 ? .5 : 1);
  const 숨 = 1 + Math.sin(t * (밤 ? 1.5 : 2.4)) * 0.012;
  let sx = 숨, sy = 숨, 기울기 = 0, 컷 = 밤 ? '깜빡' : '기본';

  if (반응) {
    const p = t - 반응.시작t;
    const 끝t = 최대지속[반응.종류];
    if (p >= 끝t) {
      반응 = null;
      if (대기열.length) 반응시작(대기열.shift());
    } else switch (반응.종류) {
      case '인사': {            // 탭 스프링 300ms — sx +13% · sy −15% · 들림 14px
        const s = Math.sin(p / .3 * Math.PI);
        sx = 숨 * (1 + 0.13 * s); sy = 숨 * (1 - 0.15 * s);
        떠오름 += 14 * s * 자;
        break;
      }
      case '라운드': {           // 라운드 열림 — 놀람(은은) + 소홉
        컷 = '놀람';
        const s = Math.sin(Math.min(p / .35, 1) * Math.PI);
        떠오름 += 10 * s * 자;
        break;
      }
      case '정답': {             // 정답 공개 — 기쁨 + 통통 튐(감쇠), 끝에 눈웃음 마무리
        const 튐 = Math.exp(-p * 2.6) * Math.sin(p * 13);
        떠오름 -= 26 * Math.abs(튐) * 0.7 * 자;
        sx = 숨 * (1 - 0.05 * 튐); sy = 숨 * (1 + 0.06 * 튐);
        컷 = p < 1.7 ? '기쁨' : '눈웃음';
        break;
      }
      case '체크인': {           // 자습 체크인 접수 — 눈인사 + 소홉
        컷 = '눈웃음';
        const s = Math.sin(Math.min(p / .4, 1) * Math.PI);
        떠오름 += 8 * s * 자;
        break;
      }
      case '투표': {             // 투표 반영 — 몸 살랑(감쇠 기울임 · 표정은 기본)
        기울기 = Math.exp(-p * 1.4) * Math.sin(p * 5.5) * 6;
        break;
      }
      /* DJ 교대 — 유호 확정 08-25 ③ 「몽글이 나가고 까몽이 들어오는 짧은 순간이
         «누가 만든 방송인지»를 말하고, 그 과정이 캐릭터에 생명력을 준다」.
         🔑 **트랜스폼만으로** 한다(색 연산 0 규격) — 페이드가 아니라 «화면 밖으로 걸어 나갔다
            들어오는» 움직임이라, 확정 문면(나가고 들어온다)과도 그대로 맞는다.
         세트 교체는 **화면 밖에 있는 순간**에 딱 한 번(중간에 바꾸면 바뀌는 장면이 보인다). */
      case '교대': {
        const 나감 = (틀.clientHeight || 300) * 1.35;
        if (p < .8) {                                   // ① 퇴장 — 아래로(ease-in)
          const s = (p / .8) * (p / .8);
          떠오름 -= 나감 * s;
        } else if (p < 1.6) {                           // ② 화면 밖에서 갈아입고 등장(ease-out)
          if (!반응.바꿨나) { DJ바꾸기(반응.DJ); 반응.바꿨나 = true; }
          const u = (p - .8) / .8;
          떠오름 -= 나감 * (1 - u) * (1 - u);
        } else {                                        // ③ 새 DJ 의 짧은 인사(인사 스프링과 같은 공식)
          const s = Math.sin((p - 1.6) / .6 * Math.PI);
          sx = 숨 * (1 + 0.13 * s); sy = 숨 * (1 - 0.15 * s);
          떠오름 += 14 * s * 자;
        }
        break;
      }
    }
  } else if (!밤) {
    // 자연 깜빡임 150ms (반응 중엔 반응이 이긴다 — 모션 도구와 같은 우선순위)
    const ms = t * 1000;
    if (ms > 다음깜빡 + 150) 다음깜빡 = ms + 2200 + Math.random() * 3000;
    else if (ms > 다음깜빡) 컷 = '깜빡';
  }

  표정(컷);
  틀.style.transform = `translateY(${(-떠오름).toFixed(2)}px) rotate(${기울기.toFixed(2)}deg) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
}
requestAnimationFrame(프레임);
// rAF 기아 폴백 — 숨은 탭·절전에선 rAF 가 서고 setInterval 만 돈다(실측 08-14: 데모판은 돌고
// transform 은 빈 채였다). 150ms 넘게 굶으면 인터벌이 대신 튼다 — OBS 에선 rAF 가 이긴다.
setInterval(() => { if (performance.now() - 마지막틱 > 150) 한틱(); }, 100);

/* ── 이벤트 입구 (봇·P3 전광판·데모가 같은 문으로 들어온다) ─────────── */
/* 사건 → 반응 매핑.
   🔴 이 표는 `전광판판정.js` 의 `마스코트표` 와 **같은 값**이어야 한다 — 마스코트는 `file://`
      로도 떠야 해서 그 파일을 못 읽는다(README 「보는 법」). 한쪽을 고치면 같은 커밋에서 다른 쪽을 연다.
   ⚠ **09-01 수리** — v1 엔 이 표가 «없어서» 사건 이름을 반응 이름으로 그대로 썼고, 그래서
      `연동` 이 허용 목록 밖으로 **조용히 무시**됐다(README 표는 「연동 → 인사」라고 적고 있었다).
      README 가 경고하던 «두 파일의 어휘 갈림»이 실제로 나 있던 자리다 — 아무도 안 봤다. */
const 반응표 = { 인사: '인사', 연동: '인사', 라운드: '라운드', 정답: '정답', 체크인: '체크인', 투표: '투표', 결: '교대' };
const 허용반응 = new Set(Object.keys(최대지속));
const DJ들 = ['몽글', '까몽'];

function 반응시작(일감) {
  반응 = Object.assign({ 시작t: (performance.now() - 시작) / 1000 }, 일감);
}
function 사건받기(사건) {
  const 종류 = 사건 && 반응표[사건.종류];
  if (!종류 || !허용반응.has(종류)) {
    // '슬럼프'·'합산'·'맥박'·'곡' 이 여기로 온다 — 슬럼프는 공개 화면 되쏘기 금지(설계 §2 I-2),
    // 나머지 셋은 전광판 몫이다. 조용히 무시하되 기록은 남긴다.
    console.warn('[마스코트 오버레이] 반응 없는 사건 무시: ' + (사건 && 사건.종류));
    return;
  }
  const 일감 = { 종류 };
  if (종류 === '교대') {
    if (!DJ들.includes(사건.DJ)) { console.warn('[마스코트 오버레이] 모르는 DJ — 교대 안 함: ' + 사건.DJ); return; }
    if (사건.DJ === 현재DJ) return;                 // 같은 DJ 면 교대할 것이 없다(결만 바뀐 자리)
    if (!준비된DJ.has(사건.DJ)) { 경고('컷이 없어 ' + 사건.DJ + ' 로 교대하지 않는다 — 지금 DJ 로 계속한다.'); return; }
    일감.DJ = 사건.DJ;
  }
  if (반응) { if (대기열.length < 3) 대기열.push(일감); else console.warn('[마스코트 오버레이] 대기열 초과 — 버림: ' + 종류); }
  else 반응시작(일감);
}
try {
  new BroadcastChannel('라디오오버레이').onmessage = e => 사건받기(e.data);
} catch (_) { /* OBS CEF 구버전 — postMessage 만으로 동작 */ }
window.addEventListener('message', e => {
  if (e.data && e.data.채널 === '라디오오버레이') 사건받기(e.data);
});
// 콘솔·시험용 — 낱말 하나('정답')로도, 사건 통째로도 받는다: 마스코트반응({종류:'결', DJ:'까몽'})
window.마스코트반응 = (x) => 사건받기(typeof x === 'string' ? { 종류: x } : x);

/* ── 데모 시나리오 (?demo=1 — 방송·봇 없이 반응을 눈으로 검수하는 용도) ── */
if (document.body.classList.contains('데모')) {
  const 판 = document.getElementById('데모판');
  const 시나리오 = [
    [{ 종류: '인사' },                 '탭 스프링(300ms)'],
    [{ 종류: '연동', 닉네임: '바트자야' }, '연동 완료 — 인사(v1 이 무시하던 자리)'],
    [{ 종류: '라운드' },               '퀴즈 라운드 열림 — 놀람'],
    [{ 종류: '정답' },                 '정답 공개 — 기쁨+통통 튐'],
    [{ 종류: '체크인' },               '자습 체크인 — 눈인사'],
    [{ 종류: '투표' },                 '빗소리 투표 반영 — 살랑'],
    [{ 종류: '결', 결: '낮', DJ: '까몽' }, 'DJ 교대 — 몽글이 나가고 까몽이 들어온다'],
    [{ 종류: '결', 결: '밤', DJ: '몽글' }, 'DJ 교대 — 까몽이 나가고 몽글이 들어온다'],
  ];
  let i = 0;
  판.textContent = '데모 대기 — 3초 뒤 시작';
  setInterval(() => {
    const [사건, 설명] = 시나리오[i % 시나리오.length];
    사건받기(사건);
    판.textContent = `데모 ${(i % 시나리오.length) + 1}/${시나리오.length} — ${설명}\n`
      + `지금 DJ: ${현재DJ} (준비된 DJ ${준비된DJ.size}/2)\n`
      + `(수동: 마스코트반응({종류:'결', DJ:'까몽'}))`;
    i++;
  }, 3800);
}
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SYNK 라디오 오버레이 — 전광판</title>
<!--
  라디오24 오버레이 · P3 전광판 층 (설계 v1.5 §8-2 「학생 표면 규격 — 잔잔함이 정본이다」)

  이 파일은 «그리기»만 한다 — 무엇을 싣고 뺄지는 전부 `전광판판정.js`(순수·Node 로도 잰다)가 정한다.
  화면 코드는 회귀가 원리상 못 닿는 층이라, 판정을 여기 두면 틀린 것이 **송출 첫날**에야 드러난다.

  마스코트(`마스코트.html`)와 **같은 문**으로 듣는다 — BroadcastChannel('라디오오버레이').
  둘은 서로를 모른다: 봇이 한 번 보내면 이 파일은 문안을, 마스코트는 모션을 각자 집는다
  (릴레이를 넣으면 마스코트가 두 번 반응한다).

  ■ v2 (2026-09-01 · 유호 확정 다섯 08-25 + 설계 v1.5) — **이 판의 값은 «뺀 것»에 있다.**
    이 방송의 상품은 기능이 아니라 «혼자가 아닌 잔잔함»이고, 화면 연출은 전부 거기 세 들어 산다.
      ⚰ 퀴즈 라운드 카드 — 화면에서 **채팅으로 내려갔다**(확정 ①). 공부하려고 켠 학생에게
         정각마다 문제를 들이대면 그건 배경음악이 아니라 수업이다. 정답은 «축하 한 줄»만 남는다
         (문항·보기를 안 그리므로 정답 문자도 안 그린다 — 무엇의 B 인지 화면이 말할 수 없다).
      ⚰ 합산 전광판 «상시» — **순간 스냅숏**이 됐다(설계 §8). 숫자 3줄이 상시로 떠 있으면
         잔잔한 공부방이 상황판이 된다. 결이 바뀔 때와 정답 뒤에만 20초.
    ▶ 대신 **상시로 서는 것은 넷뿐**이다: 음악·배경(송출 몫) · 마스코트 DJ(옆 파일) ·
      **불빛**(확정 ④ — 동시 시청자를 숫자 없이) · **구석 표기**(확정 ⑤ — 곡이 바뀔 때만 밝아진다).
    ▶ **무대 연출은 한 번에 하나**(§8-2-2) — 합산 스냅숏은 큐로 직렬화한다. 잔잔함의 적은
      기능 수가 아니라 «동시에 두 개 움직이는 화면»이다. 토스트는 구석 알림이라 이 큐 밖이다(동시 3).

  ■ 🔑 «노출 확인»을 더 이상 내보내지 않는다 (설계 v1.5 §8-2-1 재정의)
    v1 은 라운드 카드를 그린 시각을 `{종류:'노출'}` 로 되쏘았고, 적는 쪽이 그걸 받아
    `radio.quiz_round.shown_at` 을 적었다 — 「그렸다」를 아는 것은 화면뿐이었기 때문이다.
    이제 화면은 라운드를 **안 그린다.** 그리지 않은 것을 그렸다고 되쏘면 그것이야말로
    그 규격이 막으려던 «안 보여준 것을 보여줬다고 적는 행»이다. ⇒ shown_at 의 근거는
    **봇의 `liveChatMessages.insert` 성공 응답**(채팅에 실제로 오른 시각)으로 옮겼다.
    그래서 이 파일에는 내보내는 문이 없다 — 듣기만 한다.

  안 하는 것(근거 있는 제외 — 넓히기 전에 원문을 연다):
    · 개인 순위·개인 성적·정답률 — §8 영구 금지(판정층 `금지칸` 이 기계로 문다).
    · 학생코드·실명·급수 — §3 철칙. 사람 표기는 유튜브 닉네임 하나.
    · 동시 시청자 «숫자» — 확정 ④ 가 숫자를 뺐다. 불빛 개수로만 말한다(하한 1 · 상한 12).
    · 곡 제목 — 구석 표기는 고정 문안 하나다(확정 ⑤ 「티 안 나게」). 제목까지 띄우면 그게 깨진다.
    · innerHTML — 채팅 원문이 그대로 오는 자리라 textContent 만 쓴다.
    · 몽골어 지어내기 — 검수 전까지 한국어만 그린다(문안표 mn 칸이 비어 있다).
-->
<style>
@font-face{font-family:'SYNK Bracket';src:local('Malgun Gothic'),local('Apple SD Gothic Neo'),local('Noto Sans KR'),local('Noto Sans CJK KR');unicode-range:U+300C-300D;}

  :root {
    /* 브랜드 킷(정본 = docs/디자인_토큰.json) — 다크 「양모 밤」(조항 ⓚ · 유호 확정 2026-08-20).
       신호는 Coral 1점 · Lime·KC 반입 0. ⚠이름은 킷 이름만 쓴다 — 08-25 까지 여기 살던
       `--navy2`·`--cream`·`--slate` 는 무채축(0039209e · 08-18)에서 «퇴역한 이름»이었고,
       `--테두리` 의 rgba(231,221,199) 은 퇴역 크림 #E7DDC7 그 자체였다. */
    --잉크밤: #080605;   /* Ink Deep — 무대(방송 검수용 바닥) */
    --종이:   #FBF7F0;   /* Paper — 본문 글자 */
    --귀리:   #EDE7DC;   /* Oat — 보조 글자 */
    --돌:     #C7BFB2;   /* Stone — 가장 흐린 라벨 */
    --코랄:   #F96859;   /* Coral — 신호 1점(지금 이 화면에 쓰는 자리는 없다 — 불빛은 신호가 아니다) */
    --버터연: #FFEBB0;   /* Butter Soft — 「따뜻한 빛」. 무대 그라디언트와 **같은 값**이다 */
    --카드바닥: rgba(43, 35, 32, .82);    /* Ink #2B2320 · 무대 위 합성 = #251E1B */
    --테두리:   rgba(240, 227, 200, .16); /* Stitch #F0E3C8(실땀) */
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    /* 브랜드 폰트 정본(DESIGN.md:90) 그대로 — 송출 PC 에 파일이 없으면 스택이 알아서 내려간다. */
    font-family: 'SYNK Bracket','Inter Tight', 'SUIT Variable', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--종이);
    -webkit-font-smoothing: antialiased;
  }
  /* 무대 모드(?무대=1) — 마스코트.html 과 같은 무대(방송 없이 눈으로 검수). */
  body.무대 {
    background:
      radial-gradient(120% 70% at 10% 5%, rgba(255,235,176,.30), rgba(255,235,176,0) 60%),
      var(--잉크밤);
  }

  /* ── 상시 ① 불빛 — 「지금 몇 명이 같이 공부 중」(유호 확정 08-25 ④) ─────
     숫자를 쓰지 않는다. 라디오의 진짜 상품은 음악이 아니라 «혼자가 아니라는 느낌»이라,
     세는 것보다 **켜져 있는 것**이 정확한 표현이다. 마스코트(우하단)와 대각선으로 짝을 이룬다. */
  #불빛 {
    position: absolute; right: 2.5vw; top: 3.5vh;
    display: flex; gap: 9px; align-items: center;
  }
  #불빛 .빛 {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--버터연);
    box-shadow: 0 0 7px rgba(255, 235, 176, .55);
    animation: 숨쉼 3.6s ease-in-out infinite;
  }
  @keyframes 숨쉼 { 0%, 100% { opacity: .34; } 50% { opacity: .86; } }

  /* ── 상시 ② 구석 표기 — 「광고가 아니라 증명」(유호 확정 08-25 ⑤) ────────
     남의 음원 트는 학원과 원리적으로 다르다는 것을 화면이 스스로 말하는 자리다.
     평소엔 거의 안 보이고(0.13), 곡이 바뀌는 순간에만 6초 밝아진다. */
  #구석 {
    position: absolute; left: 2.5vw; bottom: 1.4vh;
    font-size: 11px; letter-spacing: .06em; color: var(--귀리);
    opacity: .13; transition: opacity 1.2s ease;
  }
  #구석.밝음 { opacity: .52; }

  /* ── 순간 ① 합산 스냅숏 — 상시 아님(§8 · v1.5) ─────────────────────
     결이 바뀔 때와 정답 뒤에만 20초. 「데이터가 방송을 만든다」의 값은 노출 시간이 아니라
     노출 «순간의 무게»가 지킨다. */
  #합산 {
    position: absolute; left: 2.5vw; bottom: 5vh;
    display: grid; gap: 10px;
    padding: 18px 22px 16px;
    background: var(--카드바닥); border: 1px solid var(--테두리); border-radius: 14px;
    opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
  }
  #합산.보임 { opacity: 1; transform: none; }
  #합산 .제목 { font-size: 13px; letter-spacing: .12em; color: var(--돌); margin-bottom: 2px; }
  #합산 .줄 { display: grid; grid-template-columns: auto auto; align-items: baseline; gap: 14px; }
  #합산 .이름 { font-size: 15px; color: var(--귀리); }
  #합산 .값 {
    justify-self: end;
    font-size: 30px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; /* 숫자가 바뀌어도 폭이 안 흔들린다 */
  }
  #합산 .값.모름 { font-size: 18px; color: var(--돌); font-weight: 500; }

  /* ── 순간 ② 토스트 (설계 §5 P3 — 채팅 답글이 아니라 오버레이로) ────────
     구석 알림이라 무대 큐 밖이다(동시 3 · §8-2-2). 정답 축하도 여기로 내려왔다. */
  #토스트 {
    position: absolute; left: 50%; bottom: 4vh; transform: translateX(-50%);
    display: grid; gap: 8px; justify-items: center;
  }
  #토스트 .알림 {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 16px; border-radius: 999px;
    background: var(--카드바닥); border: 1px solid var(--테두리);
    font-size: 16px;
    animation: 뜸 .3s ease both;
  }
  #토스트 .알림 .무엇 { color: var(--귀리); font-size: 13px; letter-spacing: .06em; }
  #토스트 .알림 .누구 { font-weight: 700; font-variant-numeric: tabular-nums; }
  #토스트 .알림.끝 { animation: 짐 .3s ease both; }
  @keyframes 뜸 { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes 짐 { to { opacity: 0; transform: translateY(-6px); } }

  .경고 {
    position: absolute; right: 12px; top: 12px; max-width: 44ch;
    font: 13px/1.5 system-ui, sans-serif; color: var(--종이);
    background: rgba(43,35,32,.9); border: 1px solid var(--코랄);
    padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
  }
  #데모판 {
    position: absolute; left: 12px; top: 12px;
    font: 12px/1.6 ui-monospace, monospace; font-variant-numeric: tabular-nums;
    color: var(--종이); background: rgba(43,35,32,.72);
    padding: 8px 10px; border-radius: 8px; display: none; white-space: pre-wrap;
  }
  body.데모 #데모판 { display: block; }
  @media (prefers-reduced-motion: reduce) {
    #합산, #구석, #토스트 .알림 { transition: none; animation: none; }
    #불빛 .빛 { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<div id="불빛" aria-label="지금 함께 공부하는 사람들"></div>

<section id="합산" aria-label="학원 합산 전광판">
  <div class="제목" id="합산제목"></div>
  <div class="줄"><span class="이름" id="이름1"></span><span class="값 모름" id="값1">—</span></div>
  <div class="줄"><span class="이름" id="이름2"></span><span class="값 모름" id="값2">—</span></div>
  <div class="줄"><span class="이름" id="이름3"></span><span class="값 모름" id="값3">—</span></div>
</section>

<div id="토스트"></div>
<div id="구석"></div>
<div id="데모판"></div>

<script src="전광판판정.js"></script>
<script>
'use strict';
const 판정 = window.전광판판정;

/* ── 설정(URL 파라미터) ─────────────────────────────────────────── */
const 인자 = new URLSearchParams(location.search);
if (인자.get('무대') === '1') document.body.classList.add('무대');
if (인자.get('demo') === '1' || 인자.get('데모') === '1') document.body.classList.add('데모');

const 요소 = (id) => document.getElementById(id);
const 글 = (el, s) => { el.textContent = s; };   // innerHTML 을 쓰지 않는다(채팅 원문이 오는 자리)

function 경고(문구) {
  console.error('[전광판] ' + 문구);
  if (document.body.classList.contains('무대') || document.body.classList.contains('데모')) {
    const el = document.createElement('div');
    el.className = '경고';
    글(el, '경고 — ' + 문구);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 8000);
  }
}

if (!판정) {
  경고('전광판판정.js 를 못 읽었다 — 판정 없이 그리지 않는다(파일 두 개를 같은 폴더에 둔다).');
} else {
  시작();
}

function 시작() {
  const 수 = (n) => n.toLocaleString('ko-KR');

  글(요소('합산제목'), 판정.병기('합산제목'));
  글(요소('이름1'), 판정.병기('맞힌문제'));
  글(요소('이름2'), 판정.병기('진화레벨합'));
  글(요소('이름3'), 판정.병기('체크인주간'));
  글(요소('구석'), 판정.병기('곡표기'));

  /* ── 무대 큐 — 순간 연출은 한 번에 하나(§8-2-2) ──────────────────
     겹치면 뒤 것이 «기다린다»(버리지 않는다 — 결 경계 스냅숏은 하루 다섯 번뿐이라 귀하다).
     큐가 길어지는 것은 보낸 쪽이 과하게 보낸다는 뜻이라 상한 3 에서 버리고 센다. */
  const 무대큐 = [];
  let 무대중 = false;
  const 셈 = { 받음: 0, 버림: 0, 경고: 0, 큐버림: 0 };

  function 무대예약(연출) {
    if (무대큐.length >= 3) { 셈.큐버림++; return; }
    무대큐.push(연출);
    무대돌리기();
  }
  function 무대돌리기() {
    if (무대중 || !무대큐.length) return;
    무대중 = true;
    무대큐.shift()(() => { 무대중 = false; 무대돌리기(); });
  }

  /* ── 합산 스냅숏 ───────────────────────────────────────────── */
  const 합산칸 = 요소('합산');
  let 합산값 = null;   // 마지막으로 받은 값 — 스냅숏은 이걸 다시 쓴다

  function 합산채우기(값) {
    const 짝 = [['값1', 값.맞힌문제], ['값2', 값.진화레벨합], ['값3', 값.체크인주간]];
    for (const [id, v] of 짝) {
      const el = 요소(id);
      /* 「모름」과 「0」을 가른다 — 0 으로 접으면 안 잰 것이 실적 0 으로 둔갑한다(F207). */
      if (v === null) { 글(el, '—'); el.classList.add('모름'); }
      else { 글(el, 수(v)); el.classList.remove('모름'); }
    }
  }

  /** 스냅숏 20초. 값이 한 번도 안 왔으면 **안 그린다**(빈 카드를 방송에 올리지 않는다). */
  function 합산스냅숏() {
    if (!합산값) return;
    무대예약((끝) => {
      합산채우기(합산값);
      합산칸.classList.add('보임');
      setTimeout(() => {
        합산칸.classList.remove('보임');
        setTimeout(끝, 600);   // 퇴장 전이(0.5s)가 끝난 뒤에 다음 연출을 부른다
      }, 20000);
    });
  }

  /* ── 불빛 ─────────────────────────────────────────────────── */
  const 불빛칸 = 요소('불빛');
  let 현재불빛 = 0;
  function 불빛그리기(개수) {
    if (개수 === 현재불빛) return;   // 같은 수면 손대지 않는다(숨쉼 위상이 튄다)
    불빛칸.replaceChildren();
    for (let i = 0; i < 개수; i++) {
      const 점 = document.createElement('span');
      점.className = '빛';
      /* 위상을 어긋나게 — 전부 같이 밝아지면 «신호»로 보이고, 어긋나면 «숨»으로 보인다. */
      점.style.animationDelay = (-(i * 0.42).toFixed(2)) + 's';
      불빛칸.appendChild(점);
    }
    현재불빛 = 개수;
  }

  /* ── 구석 표기 — 곡이 바뀌는 순간에만 밝아진다 ─────────────────── */
  const 구석칸 = 요소('구석');
  let 구석타이머 = null;
  function 구석밝히기() {
    구석칸.classList.add('밝음');
    clearTimeout(구석타이머);
    구석타이머 = setTimeout(() => 구석칸.classList.remove('밝음'), 6000);
  }

  /* ── 토스트 (닉네임만 · 최대 3) ───────────────────────────── */
  const 토스트칸 = 요소('토스트');
  function 토스트(무엇, 누구) {
    while (토스트칸.children.length >= 3) 토스트칸.firstElementChild.remove();
    const el = document.createElement('div'); el.className = '알림';
    const a = document.createElement('span'); a.className = '무엇'; 글(a, 무엇);
    const b = document.createElement('span'); b.className = '누구'; 글(b, 누구 || '');
    el.append(a, b);
    토스트칸.appendChild(el);
    setTimeout(() => { el.classList.add('끝'); setTimeout(() => el.remove(), 320); }, 4200);
  }

  /** 정답 공개 — 축하 한 줄뿐이다(문항·보기·정답 문자 없음 · v1.5). 그 뒤 합산 스냅숏. */
  function 정답축하(값) {
    if (값.응답수 === null) 토스트(판정.병기('함께풀었다'), '');
    else 토스트(판정.병기('응답수'), 수(값.응답수));
    합산스냅숏();
  }

  /* ── 사건 입구 (봇·데모가 같은 문 — 마스코트도 이 문을 듣는다) ── */
  let 마지막결 = null;
  function 사건(원본) {
    셈.받음++;
    const r = 판정.정규화(원본);
    if (!r.ok) {
      셈.버림++;
      console.warn('[전광판] 버림 — ' + r.사유);
      /* 금지칸은 «보낸 쪽의 결함»이라 조용히 넘기지 않는다(무대·데모에서 눈에 보이게). */
      if (r.사유.indexOf('금지칸') === 0) 경고(r.사유);
      데모판갱신();
      return;
    }
    for (const w of r.경고) { 셈.경고++; 경고(w); }

    if (r.종류 === '합산') 합산값 = r.값;                 // 값만 갱신 — 그리는 것은 결 경계·정답 뒤
    else if (r.종류 === '맥박') 불빛그리기(r.값.불빛);
    else if (r.종류 === '곡') 구석밝히기();
    else if (r.종류 === '결') { 마지막결 = r.값; 합산스냅숏(); }  // DJ 교대 연출은 마스코트 몫
    else if (r.종류 === '정답') 정답축하(r.값);
    else if (r.종류 === '연동') 토스트(판정.병기('연동'), r.값.닉네임);
    else if (r.종류 === '체크인') 토스트(판정.병기('체크인'), r.값.닉네임);
    else if (r.종류 === '투표') 토스트(판정.병기('투표'), r.값.선택);
    else if (r.종류 === '인사') 토스트(판정.병기('시작'), '');
    /* `라운드`·`마감` 은 화면이 아무것도 안 한다 — 퀴즈는 채팅으로 내려갔다(확정 ①).
       버리지 않고 «받아서 아무것도 안 하는» 이유: 마스코트가 같은 문으로 반응하고,
       데모 계기판이 봇의 말을 세기 때문이다. */
    데모판갱신();
  }

  try { const 입구 = new BroadcastChannel('라디오오버레이'); 입구.onmessage = (e) => 사건(e.data); }
  catch (_) { /* OBS CEF 구버전 — postMessage 만으로 동작 */ }
  window.addEventListener('message', (e) => {
    if (e.data && e.data.채널 === '라디오오버레이') 사건(e.data);
  });
  window.전광판사건 = 사건; // 콘솔·시험용

  /* ── 데모 (?demo=1 — 방송·봇 없이 눈으로 검수) ──────────────── */
  function 데모판갱신() {
    if (!document.body.classList.contains('데모')) return;
    글(요소('데모판'),
      '전광판 ' + 판정.판 + '\n'
      + '받음 ' + 셈.받음 + ' = 그림 ' + (셈.받음 - 셈.버림) + ' + 버림 ' + 셈.버림
      + ' · 경고 ' + 셈.경고 + ' · 큐버림 ' + 셈.큐버림 + '\n'
      + '상시: 불빛 ' + 현재불빛 + '개'
      + ' · 결 ' + (마지막결 ? 마지막결.결 + '(DJ ' + 마지막결.DJ + ')' : '—')
      + ' · 합산값 ' + (합산값 ? '있음' : '아직') + '\n'
      + '몽골어 검수 대기 ' + 판정.몽골어대기().length + '칸(한국어만 그린다)\n'
      + "수동: 전광판사건({종류:'맥박', 동시시청:5})");
  }

  if (document.body.classList.contains('데모')) {
    const 대본 = [
      { 종류: '인사' },
      { 종류: '맥박', 동시시청: 3 },
      { 종류: '합산', 맞힌문제: 128, 진화레벨합: 412, 체크인주간: 37 },   // 값만 들어간다(안 그린다)
      { 종류: '곡' },                                                  // 구석 표기가 6초 밝아진다
      { 종류: '연동', 닉네임: '바트자야' },
      { 종류: '라운드', round_id: 'demo-1', 지시문: '학교( ) 갑니다.', 보기들: [
        { option_id: 'A', label: '을' }, { option_id: 'B', label: '에' },
      ], 마감초: 12 },                                                 // 화면 무동작 — 채팅 몫
      { 종류: '체크인', 닉네임: '어용' },
      { 종류: '맥박', 동시시청: 8 },
      { 종류: '정답', round_id: 'demo-1', 정답: 'B', 분포: { A: 4, B: 21 }, 응답수: 29 }, // 축하 + 스냅숏
      { 종류: '투표', 선택: '빗소리', 합계: { 빗소리: 12, asmr: 7 } },
      { 종류: '결', 결: '밤', DJ: '몽글' },                              // DJ 교대 + 스냅숏
      { 종류: '슬럼프' },                                               // 허용 밖 — 버려지는 것을 계기판이 센다
      { 종류: '체크인', 닉네임: '누구', student_code: 'S-001' },          // 금지칸 — 사건 전체가 버려진다(화면 경고)
    ];
    let i = 0;
    데모판갱신();
    setInterval(() => { 사건(대본[i % 대본.length]); i++; }, 3200);
  }
}
</script>

<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060709">
  <title>가족 이야기 앨범 · SYNK FOR YOU</title>
  <link rel="icon" href="assets/art/camera.webp">
  <script src="/member-signal/theme.js"></script>
  <link rel="stylesheet" href="/member-signal/signal.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="takehome.css">
  <script src="core/domain.js" defer></script>
  <script src="core/ask.js" defer></script>
  <script type="module" src="app.mjs"></script>
</head>
<body class="app-album">
  <a class="skip sr" href="#main">본문으로</a>
  <div class="shell">
    <header class="bar">
      <button type="button" class="brand" data-action="home" aria-label="가족 이야기 앨범 처음으로"><span class="bead"><img src="/member-signal/assets/synk-logo.svg" width="64" height="22" alt="SYNK"></span><span class="crumb">FOR YOU <i>/</i> <b>FAMILY STORIES</b></span></button>
      <span class="grow"></span>
      <nav class="tabs" aria-label="앨범 메뉴">
        <button type="button" data-nav="">앨범</button>
        <button type="button" data-nav="#topics">질문</button>
        <button type="button" data-nav="#takehome">소장본</button>
      </nav>
      <span class="grow"></span>
      <div class="bar-tools">
        <button class="iconbtn" type="button" data-ui="large" aria-pressed="false" aria-label="큰 글씨로 보기" title="큰 글씨로 보기"><span aria-hidden="true" class="large-mark">가</span></button>
        <button class="iconbtn" type="button" data-ui="theme" aria-label="화면 밝기 바꾸기"></button>
        <button class="acct" type="button" data-ui="account" aria-haspopup="dialog"><span>계정</span></button>
      </div>
    </header>
    <main id="main" class="board" tabindex="-1"></main>
    <footer class="foot"><p>사진·목소리·이야기는 이 기기나 로그인한 SYNK 계정에만 보관해요. 다른 사람에게 공개하거나 가족을 자동으로 초대하지 않아요.</p></footer>
  </div>
  <nav class="tabbar" aria-label="앨범 메뉴">
    <button type="button" data-nav=""><span data-icon="image"></span>앨범</button>
    <button type="button" data-nav="#topics"><span data-icon="chat"></span>질문</button>
    <button type="button" data-nav="#takehome"><span data-icon="book"></span>소장본</button>
  </nav>
  <div id="account-sheet" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="SYNK ID 계정" tabindex="-1">
      <div class="sheet-head"><p class="kicker">SYNK ID</p><button class="iconbtn" type="button" data-sheet-close aria-label="계정 판 닫기"></button></div>
      <section id="account-panel" aria-label="SYNK ID 계정 저장"></section>
    </div>
  </div>
  <div id="notice" class="toast" role="status" aria-live="polite"></div>
  <dialog id="import-dialog" class="signal-dialog" aria-labelledby="import-title"><p class="kicker">IMPORT</p><h2 id="import-title">이 앨범을 불러올까요?</h2><p id="import-description"></p><p class="small muted">지금 열린 앨범을 바꿔요. 보관하고 싶은 내용은 먼저 내보내 주세요.</p><p id="import-progress" class="small" role="status" aria-live="polite"></p><div class="actions"><button id="confirm-import" class="btn primary" type="button">불러오기</button><button id="cancel-import" class="btn soft" type="button">취소</button></div></dialog>
</body>
</html>

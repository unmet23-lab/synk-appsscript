<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060709">
  <title>중요한 대화 리허설 · SYNK FOR YOU</title>
  <link rel="icon" href="/member-signal/assets/synk-logo.svg" type="image/svg+xml">
  <script src="/member-signal/theme.js"></script>
  <link rel="stylesheet" href="/member-signal/signal.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./book.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body class="app-rehearsal">
  <div class="shell">
    <header class="bar">
      <button class="brand" type="button" data-nav="home" aria-label="리허설 처음으로"><span class="bead"><img src="/member-signal/assets/synk-logo.svg" width="64" height="22" alt="SYNK"></span><span class="crumb">FOR YOU <i>/</i> <b>REHEARSAL</b></span></button>
      <span class="grow"></span>
      <nav class="tabs" aria-label="리허설 메뉴">
        <button type="button" data-nav="home">연습</button>
        <button type="button" data-nav="book">작품집</button>
        <button type="button" data-nav="records">기록 <span class="count" data-count></span></button>
      </nav>
      <span class="grow"></span>
      <div class="bar-tools">
        <button class="iconbtn" type="button" data-action="theme" aria-label="화면 밝기 바꾸기"></button>
        <button class="acct" type="button" data-action="account" aria-haspopup="dialog"><span>계정</span></button>
      </div>
    </header>
    <main id="app" class="board" tabindex="-1" aria-live="off"></main>
    <footer class="foot">
      <p>답변은 이 기기의 규칙으로만 살펴봐요. 점수를 매기거나 녹음을 보내지 않아요.</p>
      <p>로그인하면 완료한 연습을 SYNK 계정에 보관해요. 로그인 전에는 기기 저장을 직접 고를 수 있어요.</p>
    </footer>
  </div>
  <nav class="tabbar" aria-label="리허설 메뉴">
    <button type="button" data-nav="home"><span data-icon="chat"></span>연습</button>
    <button type="button" data-nav="book"><span data-icon="star"></span>작품집</button>
    <button type="button" data-nav="records"><span data-icon="book"></span>기록</button>
  </nav>
  <div id="account-sheet" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="SYNK ID 계정" tabindex="-1">
      <div class="sheet-head"><p class="kicker">SYNK ID</p><button class="iconbtn" type="button" data-sheet-close aria-label="계정 판 닫기"></button></div>
      <section id="account-panel" aria-label="SYNK ID 계정 저장"></section>
    </div>
  </div>
  <p id="notice" class="toast" role="status" aria-live="polite"></p>
</body>
</html>

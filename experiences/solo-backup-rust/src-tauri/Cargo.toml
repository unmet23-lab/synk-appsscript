[package]
name = "solo-work-backup-rust"
version = "0.7.6"
edition = "2021"
rust-version = "1.90"
publish = false
autobins = false
# The window app; tauri build bundles WorkBackupRun beside it.
default-run = "WorkBackup"

[lib]
name = "backup_native"
path = "src/lib.rs"

[[bin]]
name = "WorkBackup"
path = "src/main.rs"

[[bin]]
name = "WorkBackupRun"
path = "src/bin/run.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
# Updates checked against our own signing key (STAGE1_DESIGN.md 4.10). The NSIS installer itself is the update
# package, so no zip support; the system proxy is kept for offices that need one.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = "1"
fs2 = "0.4"
rfd = { version = "0.18", features = ["common-controls-v6"] }
# The SYNK 솔리오 window a host-mode dialog is owned by (host.rs), handed to rfd's set_parent.
raw-window-handle = "0.6"
url = "2"
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Networking_Connectivity", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_System_Wmi"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Packaging_Appx", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Wdk_System_Threading"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

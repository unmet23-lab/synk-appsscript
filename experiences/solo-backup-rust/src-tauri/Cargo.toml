[package]
name = "solo-work-backup-rust"
version = "0.6.0-beta.1"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "backup_native"
path = "src/lib.rs"

[[bin]]
name = "WorkBackupRust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = "1"
fs2 = "0.4"
rfd = { version = "0.18", features = ["common-controls-v6"] }
url = "2"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>PULSE 장면 검증</title>
<style>html,body,#world{width:100%;height:100%;margin:0;overflow:hidden;background:#1b2b46}canvas{display:block;touch-action:none}canvas:focus-visible{outline:3px solid #f5c445;outline-offset:-6px}#hotspots{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;left:0;top:0;background:#ede7dc;color:#2b2320;border:1px solid #c7bfb2;border-radius:6px;padding:8px;pointer-events:auto}#test-input{position:absolute;right:15px;top:15px;width:160px;background:#fbf7f0;padding:8px;border:1px solid #c7bfb2;opacity:.5}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<div id="world"></div><div id="hotspots"></div><input id="test-input" aria-label="입력 예외 검증" placeholder="입력 예외 검증">
<script type="module">
import {createWorld} from '../../scene.js';
window.sceneEvents=[];window.inspections=[];
window.world=await createWorld({container:document.getElementById('world'),hotspots:document.getElementById('hotspots'),onInspect:id=>window.inspections.push(id),onStatus:s=>window.sceneEvents.push(s)});
window.world.setPhase('exploring');window.world.setReducedMotion(true);window.world.setQuality('high');
window.worldReady=true;
</script></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Reserve Sans';src:url(reserve/assets/reserve-sans.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#FAF1ED;font-family:'Reserve Sans',sans-serif;color:#1d1d1f;word-break:keep-all}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,241,237,.97) 0%,rgba(250,241,237,.9) 34%,rgba(250,241,237,0) 62%)}
.say{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:18px;width:560px}
.logo{font:800 34px/1 'Reserve Sans';letter-spacing:-.03em}
.tag{font:700 30px/1.2 'Reserve Sans';color:#F2573F;margin-top:40px}
h1{margin:0;font:700 92px/1.02 'Reserve Sans';letter-spacing:-.045em}
p{margin:0;font:600 28px/1.45 'Reserve Sans';letter-spacing:-.01em}
</style>
</head>
<body>
<img src="town-road.webp" alt="">
<div class="fade"></div>
<div class="say">
  <div class="logo">synk</div>
  <div class="tag">2027년 2월 정식 출시</div>
  <h1>SYNK 사전예약</h1>
  <p>이메일을 남기시면 출시 때<br>가장 먼저 알려 드립니다.</p>
</div>
</body>
</html>

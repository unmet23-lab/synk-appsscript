<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060709">
  <meta name="description" content="별자리와 한국 사주로 보는 오늘의 기운, 궁합, 올해의 흐름. SYNK 회원 무료 혜택.">
  <title>무료 운세 · SYNK FOR YOU</title>
  <link rel="icon" href="/member-signal/assets/synk-logo.svg" type="image/svg+xml">
  <script src="/member-signal/theme.js"></script>
  <link rel="stylesheet" href="/member-signal/signal.css">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body class="app-fortune">
  <div class="shell">
    <header class="bar">
      <button class="brand" type="button" data-view="today" aria-label="운세 처음으로"><span class="bead"><img src="/member-signal/assets/synk-logo.svg" width="64" height="22" alt="SYNK"></span><span class="crumb">FOR YOU <i>/</i> <b>FORTUNE</b></span></button>
      <span class="grow"></span>
      <nav class="tabs" aria-label="운세 메뉴">
        <button type="button" data-view="today">오늘</button>
        <button type="button" data-view="month">이번 달</button>
        <button type="button" data-view="match">궁합</button>
        <button type="button" data-view="year">올해</button>
        <button type="button" data-view="vault">보관함 <span class="count" data-vault-count></span></button>
      </nav>
      <span class="grow"></span>
      <div class="bar-tools">
        <button class="iconbtn" type="button" data-action="theme" aria-label="화면 밝기 바꾸기"></button>
        <button class="acct" type="button" data-action="account" aria-haspopup="dialog"><span>로그인</span></button>
      </div>
    </header>
    <main id="app" class="board" tabindex="-1"></main>
    <footer class="foot">
      <p>가볍게 즐기는 재미용 운세예요. 미래를 예측하거나 중요한 결정을 대신하지 않아요.</p>
      <p>비회원 입력은 이 화면에만 남아요. 저장 단추를 누를 때만 SYNK 계정에 보관해요.</p>
    </footer>
  </div>
  <nav class="tabbar" aria-label="운세 메뉴">
    <button type="button" data-view="today"><span data-icon="sun"></span>오늘</button>
    <button type="button" data-view="month"><span data-icon="calendar"></span>이번 달</button>
    <button type="button" data-view="match"><span data-icon="heart"></span>궁합</button>
    <button type="button" data-view="year"><span data-icon="sparkle"></span>올해</button>
    <button type="button" data-view="vault"><span data-icon="star"></span>보관함</button>
  </nav>
  <div id="account-sheet" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="account-title" tabindex="-1">
      <div class="sheet-head"><div><p class="kicker">SYNK ID</p><h2 id="account-title">내 운세 이어가기</h2></div><button class="iconbtn" type="button" data-sheet-close aria-label="계정 판 닫기"></button></div>
      <div id="account-body"></div>
    </div>
  </div>
  <p id="notice" class="toast" role="status" aria-live="polite"></p>
</body>
</html>

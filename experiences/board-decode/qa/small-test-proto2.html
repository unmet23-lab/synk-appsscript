:root{--ink:#191b20;--ink-2:#454a54;--ink-3:#7b808a;--paper:#fbfaf6;--line:#e4e1d8;--navy:#1f2d52;--coral:#e8664f;--butter:#f3d36b;--mint:#22815f;--wall:#d9d6cf;--sheet:#fff;--sans:'SUIT Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}

.board{flex:1;min-height:0;overflow:auto;padding:6px 12px 14px;position:relative}
.notice{position:relative;margin:10px auto;background:var(--paper);padding:14px 16px;font-size:14px;line-height:1.6;letter-spacing:-.012em;max-width:366px;box-shadow:0 1px 2px rgba(20,22,28,.1),0 6px 16px rgba(20,22,28,.1)}

.n-dorm{border-top:5px solid var(--navy)}

    {"say":"근데 목요일 비 온대. 밤 콘서트는 어떻게 돼?","keys":["우천 시","f2"],
     "options":[
      {"t":"다음에 다시 한대. 날짜 기다리자","ok":"연기","wrong":{"mood":"pale","title":"사흘째 묻는 태오","line":"태오: 「콘서트 언제 한대?」 사흘째다. 학생회 글을 다시 보니 그날 공연은 아예 없어졌다."}},
      {"t":"그날로 끝이야. 이번엔 안 한대","ok":"취소","wrong":{"mood":"warm","title":"놓친 콘서트","line":"다음 주 금요일 밤, 인스타에 콘서트 사진이 올라왔다. 태오: 「…오늘 했대!」"}},
      {"t":"비 와도 그냥 한대. 우산 가져와","ok":null,"wrong":{"mood":"rain","title":"비 오는 대운동장","line":"무대도 사람도 없다. 우산을 쓴 태오와 나뿐이다. 태오: 「…여기 맞아?」"}}
     ],
     "after":"아깝다… 알았어"},
    {"say":"그리고 너 빛담 들고 싶다며. 토요일에 신청해도 돼?","keys":["f3"],
     "options":[
      {"t":"안 돼. 금요일 6시면 끝이야. 그 전에 가야 돼","ok":"마감","wrong":{"mood":"warm","title":"늦지 않았는데","line":"태오: 「내 친구는 토요일에 신청했다던데? 금요일 6시부터 받는대.」"}},
      {"t":"돼. 금요일 6시부터 받는대","ok":"시작","wrong":{"mood":"pale","title":"닫힌 304호","line":"토요일, 304호 문이 잠겨 있다. 선배 문자: 「어제 6시까지였어요 ㅠㅠ」"}},
      {"t":"학생회관에 가면 언제든 된대","ok":null,"wrong":{"mood":"pale","title":"닫힌 304호","line":"304호에 쪽지가 붙어 있다. 「신청 시간을 확인해 주세요.」"}}
     ],
     "after":"좋아. 그럼 그렇게 하자"}
   ],
   "teach":{"say":"근데 포스터의 그 말, 무슨 뜻이었어?","key":"f1"},
   "win":{"title":"축제 계획 끝","react":"태오: 「와, 너 이제 나보다 잘 읽는다 ㅋㅋ 떡볶이는 내가 들고 올게.」"}
  }
 ]
}
</script>

<script>
'use strict';
const C = JSON.parse(document.getElementById('content').textContent);
const Q = new URLSearchParams(location.search);
const MASK = Q.get('mask');
const $ = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hide = (s) => (MASK === 'all' ? s.replace(/[가-힣]/g, '▢') : s);
const PICS = {
 'cal-x':"<rect x='6' y='8' width='60' height='40' rx='4' fill='#fff' stroke='#1f2d52'/><g fill='#d7dbe3'><rect x='11' y='16' width='7' height='7'/><rect x='19' y='16' width='7' height='7'/><rect x='27' y='16' width='7' height='7'/><rect x='35' y='16' width='7' height='7'/><rect x='43' y='16' width='7' height='7'/><rect x='51' y='16' width='7' height='7'/><rect x='11' y='28' width='7' height='7'/><rect x='19' y='28' width='7' height='7'/><rect x='27' y='28' width='7' height='7'/><rect x='35' y='28' width='7' height='7'/><rect x='43' y='28' width='7' height='7'/><rect x='51' y='28' width='7' height='7'/></g><path d='M50 15l9 9m0-9l-9 9M50 27l9 9m0-9l-9 9' stroke='#e8664f' stroke-width='2'/>",
 'ticket-plus':"<rect x='6' y='14' width='34' height='28' rx='3' fill='#fff' stroke='#1f2d52'/><path d='M14 24h18M14 32h12' stroke='#1f2d52'/><path d='M45 28h8m-4-4v8' stroke='#22815f' stroke-width='2'/><ellipse cx='60' cy='28' rx='8' ry='5' fill='#f3d36b' stroke='#1f2d52'/>",
 'locker':"<rect x='18' y='6' width='36' height='44' rx='2' fill='#fff' stroke='#1f2d52'/><path d='M36 6v44M18 28h36' stroke='#1f2d52'/><circle cx='31' cy='17' r='1.5' fill='#1f2d52'/><circle cx='41' cy='17' r='1.5' fill='#1f2d52'/><rect x='39' y='32' width='12' height='12' rx='2' fill='#f3d36b' stroke='#1f2d52'/>",
 'milk-trash':"<path d='M12 18l5-8h10l5 8v26H12z' fill='#fff' stroke='#1f2d52'/><path d='M38 28h10m-4-4l4 4-4 4' stroke='#e8664f' stroke-width='2' fill='none'/><path d='M52 22h14M55 22l2 24h8l2-24' fill='#fff' stroke='#1f2d52'/>",
 'queue':"<g fill='#22815f'><circle cx='10' cy='20' r='5'/><circle cx='24' cy='20' r='5'/><circle cx='38' cy='20' r='5'/></g><g fill='#c9ccd3'><circle cx='52' cy='20' r='5'/><circle cx='66' cy='20' r='5'/></g><path d='M6 28h8v14H6zM20 28h8v14h-8zM34 28h8v14h-8z' fill='#22815f'/><path d='M48 28h8v14h-8zM62 28h8v14h-8z' fill='#c9ccd3'/>",
 'lots':"<path d='M18 26h36v22H18z' fill='#fff' stroke='#1f2d52'/><path d='M28 26l4-4h8l4 4' fill='none' stroke='#1f2d52'/><rect x='30' y='6' width='14' height='14' fill='#f3d36b' stroke='#1f2d52' transform='rotate(12 37 13)'/><path d='M40 22c4-2 6-4 7-8' stroke='#e8664f' fill='none' stroke-width='2'/>",
 'umbrella':"<path d='M14 28a22 22 0 0 1 44 0z' fill='#fff' stroke='#1f2d52'/><path d='M36 28v14a4 4 0 0 1-8 0' fill='none' stroke='#1f2d52'/><path d='M12 8l-3 8M26 2l-3 6M50 2l-3 6M64 8l-3 8' stroke='#6d8ac0' stroke-width='2'/>",
 'cal-move':"<rect x='4' y='14' width='26' height='28' rx='3' fill='#fff' stroke='#c9ccd3'/><rect x='42' y='14' width='26' height='28' rx='3' fill='#fff' stroke='#1f2d52'/><circle cx='17' cy='28' r='4' fill='#c9ccd3'/><circle cx='55' cy='28' r='4' fill='#22815f'/><path d='M31 28h9m-4-4l4 4-4 4' stroke='#22815f' stroke-width='2' fill='none'/>",
 'cal-cancel':"<rect x='20' y='12' width='32' height='32' rx='3' fill='#fff' stroke='#1f2d52'/><circle cx='36' cy='28' r='5' fill='#c9ccd3'/><path d='M22 14l28 28M50 14L22 42' stroke='#e8664f' stroke-width='2.5'/>",
 'clock-close':"<circle cx='24' cy='28' r='17' fill='#fff' stroke='#1f2d52'/><path d='M24 18v10l-0 10' stroke='#1f2d52' stroke-width='2'/><rect x='48' y='12' width='18' height='32' fill='#fff' stroke='#1f2d52'/><path d='M50 14l14 28M64 14L50 42' stroke='#e8664f' stroke-width='2'/>",
 'clock-open':"<circle cx='24' cy='28' r='17' fill='#fff' stroke='#1f2d52'/><path d='M24 28V17M24 28l7 4' stroke='#1f2d52' stroke-width='2'/><path d='M48 44V12l18 6v32z' fill='#fff' stroke='#22815f'/>"
};
const book = new Map((Q.get('book') || '').split(',').filter(Boolean).map((w) => [w, 'ink']));
let S = null;
window.__bd = { state: () => S, log: [] };
const mark = (what, extra) => window.__bd.log.push({ t: Math.round(performance.now()), what, ...extra });
function rng(seed) { let x = seed || 1; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
function shuffle(a, r) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

function start(id, picks) {
  const R = C.rounds.find((x) => x.id === id) || C.rounds[0];
  const seed = Number(Q.get('seed')) || Math.floor(Math.random() * 1e6) + 1;
  const r = rng(seed);
  const fork = {};
  for (const [k, pair] of Object.entries(R.forks)) fork[k] = (picks && pair.find((w) => picks.includes(w))) || pair[Math.floor(r() * pair.length)];
  const order = R.slots.map((sl) => shuffle(sl.options, r));
  const tokens = {}; let n = 0;
  const keysAll = [...new Set(R.slots.flatMap((sl) => sl.keys).map((k) => fork[k] || k))];
  for (const w of keysAll) tokens[w] = '①②③④⑤⑥'[n++];
  S = { R, fork, order, tokens, slot: 0, phase: 'ask', clue: null, helped: new Set(), missed: new Set(), got: new Map(), scene: null, seen: new Set(), misses: 0, t0: performance.now(), teachOrder: null };
  mark('start', { round: R.id, fork });
  render();
}
const resolve = (k) => S.fork[k] || k;

function inline(text, R) {
  return text.split(/(\[\[[^\]]+\]\])/).map((part) => {
    const m = /^\[\[(.+)\]\]$/.exec(part);
    if (!m) return esc(hide(part));
    if (m[1] === 'carry') return `${esc(hide('졸업생 '))}${book.has('제외') ? `<span class="known">${esc(hide('제외'))}</span>` : esc(hide('제외'))}`;
    const w = resolve(m[1]);
    if (MASK) return `<span class="mask-tok">${S.tokens[w] || '?'}</span>`;
    const st = S.got.get(w);
    return `<button class="w ${st || ''} ${S.clue === w ? 'on' : ''}" data-w="${esc(w)}">${esc(w)}</button>`;
  }).join('');
}
function notice(N, R) {
  const lines = N.lines.map((L) => {
    if (typeof L === 'string') return `<p>${inline(L, R)}</p>`;
    if (L.li) return `<p class="li">· ${inline(L.li, R)}</p>`;
    if (L.note) return `<p class="note">${inline(L.note, R)}</p>`;
    if (L.big) return `<span class="big">${inline(L.big, R)}</span>`;
    if (L.gap) return '<p style="height:8px"></p>';
    return '';
  }).join('');
  return `<article class="notice ${N.style}"><div class="head">${esc(hide(N.head))}</div><h3>${esc(hide(N.title))}</h3>${lines}${N.foot ? `<p class="note" style="margin-top:6px;font-size:12px">${esc(hide(N.foot))}</p>` : ''}</article>`;
}

function dock() {
  const { R } = S;
  if (S.clue) {
    const W = C.words[S.clue];
    const clueText = W.clue.split(/(\[\[[^\]]+\]\])/).map((p) => (/^\[\[/.test(p) ? `<b>${esc(S.clue)}</b>` : esc(p))).join('');
    return `<div class="clue"><h5>이 말이 또 나온 곳</h5><div class="card"><svg viewBox="0 0 72 56" fill="none" aria-hidden="true">${PICS[W.pic] || ''}</svg><p>${clueText}</p></div>
      ${S.helped.has(S.clue) ? `<p class="easy">${esc(S.clue)} = ${esc(W.easy)}</p>` : ''}
      <div class="row"><button class="btn" data-easy ${S.helped.has(S.clue) ? 'disabled style="opacity:.4"' : ''}>그래도 모르겠어요</button><button class="btn" data-clue-close>게시물로</button></div></div>`;
  }
  const lastAfter = S.after ? `<div class="msg me"><p>${esc(S.sent)}</p></div><div class="msg"><span class="who">${esc(R.who[0])}</span><p>${esc(S.after)}</p></div>` : '';
  if (S.phase === 'ask') {
    const sl = R.slots[S.slot];
    const open = S.slot === 0 ? `<div class="msg"><span class="who">${esc(R.who[0])}</span><p>${esc(R.open)}</p></div>` : '';
    return `${open}${lastAfter}<div class="msg"><span class="who">${esc(R.who[0])}</span><p>${esc(sl.say)}</p></div><div class="replies">${S.order[S.slot].map((o, i) => `<button class="reply" data-reply="${i}">${esc(o.t)}</button>`).join('')}</div>`;
  }
  if (S.phase === 'teach') {
    const w = resolve(R.teach.key);
    if (!S.teachOrder) S.teachOrder = shuffle([{ t: C.words[w].teach, ok: true }, { t: C.words[R.forks[R.teach.key].find((x) => x !== w)].teach, ok: false }], rng(7));
    return `${lastAfter}<div class="msg"><span class="who">${esc(R.who[0])}</span><p>${esc(R.teach.say.replace('그 말', `‘${w}’`))}</p></div><div class="replies">${S.teachOrder.map((o, i) => `<button class="reply" data-teach="${i}">${esc(o.t)}</button>`).join('')}</div>`;
  }
  return '';
}

function render() {
  const { R } = S;
  const words = [...new Set(R.slots.flatMap((sl) => sl.keys).map(resolve))];
  const got = words.filter((w) => S.got.has(w)).length;
  $.innerHTML = `<header class="top"><b>${esc(R.place)}</b><span>${esc(R.time)}</span><span class="count">수첩 ${got} / ${words.length}</span></header>
  <main class="board">${R.notices.map((N) => notice(N, R)).join('')}<div>${R.scraps.map((s, i) => `<span class="scrap ${i % 2 ? 'w2' : ''}">${esc(hide(s))}</span>`).join('')}</div></main>
  <footer class="dock">${dock()}</footer>
  ${S.scene ? sceneView() : ''}${S.phase === 'done' ? doneView() : ''}`;
}

function sceneView() {
  const { w, o } = S.scene;
  const learn = w ? `<p class="learn">공지의 말 <b>${esc(w)}</b> = ${esc(C.words[w].easy)}</p>` : '';
  return `<section class="scene ${o.mood}"><span class="ph">(이 자리에 장면 사진)</span><span class="tag">이런 일이 벌어졌다 · 본 장면 ${S.seen.size}</span><h2>${esc(o.title)}</h2><p class="line">${esc(o.line)}</p>${learn}<button data-again>다시 고르기</button></section>`;
}

function doneView() {
  const { R } = S;
  const total = R.slots.reduce((n, sl) => n + sl.options.length - 1, 0);
  const secs = Math.round((S.t1 - S.t0) / 1000);
  const stamps = [...S.got.entries()].map(([w, st]) => `<div class="st"><b>${esc(w)}</b><span>${esc(C.words[w].easy)}</span><i class="${st === 'ink' ? '' : 'p'}">${st === 'ink' ? '혼자 풀었다' : '장면으로 배웠다'}</i></div>`).join('');
  return `<section class="done"><h2>${esc(R.win.title)}</h2><p class="react">${esc(R.win.react)}</p>
    <div class="sts"><div><b>${[...S.got.values()].filter((v) => v === 'ink').length} / ${S.got.size}</b><span>혼자 푼 말</span></div><div><b>${S.seen.size} / ${total}</b><span>본 장면</span></div><div><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b><span>걸린 시간</span></div></div>
    <div class="stamps">${stamps}</div><p class="note">다시 하면 공지의 낱말이 바뀌어요. 안 본 장면도 남아 있어요.</p>
    <div class="row"><button data-again-round>다시 하기</button><button class="p" data-next>다음 판</button></div></section>`;
}

$.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const { R } = S;
  if (t.dataset.w) { S.clue = t.dataset.w; mark('clue', { w: S.clue }); return render(); }
  if (t.hasAttribute('data-clue-close')) { S.clue = null; return render(); }
  if (t.hasAttribute('data-easy')) { S.helped.add(S.clue); mark('easy', { w: S.clue }); return render(); }
  if (t.dataset.reply != null) {
    const sl = R.slots[S.slot];
    const o = S.order[S.slot][Number(t.dataset.reply)];
    const need = S.fork[sl.keys[sl.keys.length - 1]];
    const right = o.ok === need;
    mark('reply', { slot: S.slot, right, t: o.t });
    if (right) {
      for (const k of sl.keys) { const w = resolve(k); if (!S.got.has(w)) S.got.set(w, S.missed.has(S.slot) || S.helped.has(w) ? 'pencil' : 'ink'); }
      S.after = sl.after; S.sent = o.t; S.slot++;
      if (S.slot >= R.slots.length) S.phase = 'teach';
      return render();
    }
    S.missed.add(S.slot); S.misses++;
    S.seen.add(o.t);
    S.scene = { w: o.ok === null ? null : need, o: o.wrong };
    return render();
  }
  if (t.hasAttribute('data-again')) { S.scene = null; return render(); }
  if (t.dataset.teach != null) {
    const ok = S.teachOrder[Number(t.dataset.teach)].ok;
    mark('teach', { ok });
    if (!ok) { S.after = '어? 그 뜻 아닌 것 같은데 ㅋㅋ 다시 말해 줘'; S.sent = t.textContent; S.teachOrder = S.teachOrder.slice().reverse(); return render(); }
    S.phase = 'done'; S.t1 = performance.now();
    for (const [w, v] of S.got) if (!book.has(w)) book.set(w, v);
    mark('done', { secs: Math.round((S.t1 - S.t0) / 1000) });
    return render();
  }
  if (t.hasAttribute('data-again-round')) return start(R.id);
  if (t.hasAttribute('data-next')) return start(C.rounds[(C.rounds.indexOf(R) + 1) % C.rounds.length].id);
});

if (Q.get('tall')) document.documentElement.classList.add('tall');
start(Q.get('round') || '1', (Q.get('pick') || '').split(',').filter(Boolean));
</script>

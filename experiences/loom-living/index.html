<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080605"><title>몽글과 바람의 정원 · SYNK Loom</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./scene.css">
</head>
<body>
  <a class="skip" href="#controls">장면 조작으로 이동</a>
  <header class="masthead"><a class="wordmark" href="./" aria-label="SYNK Loom"><img src="./assets/synk-paper.svg" alt="SYNK"><span>LOOM</span></a><span class="edition">살아 있는 작은 세계 <i></i> 01</span></header>
  <main id="experience">
    <section id="garden" class="garden" aria-labelledby="scene-title">
      <img id="fallback" class="fallback" src="./assets/garden.webp" alt="부드러운 노을빛 아래, 펠트 나무와 작은 꽃이 있는 정원">
      <img class="fallback-mongle" src="./assets/mongle.webp" alt="노을 정원에 앉아 있는 몽글">
      <canvas id="world" aria-label="몽글이 바람을 느끼고, 가까이 온 빛을 바라보는 펠트 정원. 아래 버튼으로 함께 놀 수 있어요."></canvas>
      <div class="scene-top"><div class="intro"><p class="eyebrow">MONGLE'S LITTLE WORLD</p><h1 id="scene-title">바람의 정원</h1><p class="instruction" id="instruction">몽글을 눌러 인사해 보세요.</p></div><button class="icon-button" id="fullscreen" aria-label="전체 화면으로 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button></div>
      <div class="dialogue" id="dialogue" aria-live="polite"></div>
      <div class="scene-bottom"><span class="location"><i></i> 이름 없는 땅 · 노을 정원</span><span class="weather" id="weather">잔잔한 바람</span></div>
      <div id="loading" class="loading"><span></span><p>정원에 빛이 들어오고 있어요.</p></div>
      <div id="error" class="error" hidden><p>이 환경에서는 움직이는 장면을 열지 못했어요.</p><button onclick="location.reload()">다시 열기</button></div>
    </section>
    <div class="below"><div class="caption"><span class="caption-number">01 /</span><p>같은 바람을 느끼는 시간.<small>화면을 천천히 움직여 보세요. 몽글이 관심을 돌려요.</small></p></div>
      <nav id="controls" class="controls" aria-label="정원 조작">
        <button id="greet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 12c-2-1-3 1-2 3l3 5h8c3-3 3-7 3-10a1.5 1.5 0 0 0-3 0V7a1.5 1.5 0 0 0-3 0V5a1.5 1.5 0 0 0-3 0v6-4a1.5 1.5 0 0 0-3 0v7"/></svg>인사하기</button>
        <button id="wind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h12c5 0 5-6 1-6-2 0-3 1-3 2M3 12h16c4 0 4 6 0 6-2 0-3-1-3-2M3 16h6c4 0 4 5 0 5"/></svg>바람 보내기</button>
        <button id="rest" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4v16M15 4v16"/></svg><span>잠깐 멈추기</span></button>
        <button id="sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9v6h4l5 4V5L7 9H3ZM17 9l4 6m0-6-4 6"/></svg><span>소리 켜기</span></button>
      </nav>
    </div>
  </main>
  <footer><span>한 번의 바람, 서로 다른 움직임.</span><span>SYNK · 작은 순간을 오래 남게</span></footer>
  <script type="module" src="./scene.mjs"></script>

</html>

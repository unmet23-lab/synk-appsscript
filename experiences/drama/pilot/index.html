<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060608">
<link rel="icon" href="data:,">
<title>드라마 말하기 · 시범판</title>
<link rel="preload" href="/media/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/pilot.css">
<!-- 학습 기록(Atlas Trail) 묶음 — 계정 학습 호스트가 있을 때만 기록한다(learning-entry.cjs). -->
<script src="/atlas-learning.js"></script>
<script type="module" src="/pilot.mjs"></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<!-- 장면 화면 = 시네마 자막(docs/디자인/드라마_장면/README.md, 결정 11-02): 위 74%는 장면, 대사는 자막, 아래는 유리 대사 카드와 음성 구. -->
<div class="app" id="app">
 <section class="stage" id="stage" aria-label="장면">
  <img class="layer still" id="still" alt="" decoding="async">
  <video class="layer loop" id="loop" muted loop playsinline preload="auto" aria-hidden="true"></video>
  <video class="layer reply" id="reply" playsinline preload="auto"></video>
  <div class="grain" aria-hidden="true"></div>
 </section>

 <header class="top">
  <div class="top-row">
   <span class="ep" id="epTag">EP.01 · Scene 2</span>
   <span class="tools">
    <button class="chip" id="analysisChip" type="button" hidden></button>
    <button class="chip" id="langBtn" type="button"></button>
   </span>
  </div>
  <span class="prog" id="prog" aria-hidden="true"></span>
  <span class="ai-tag" data-s="aiNotice"></span>
 </header>

 <div class="subs" id="subs" aria-live="polite"></div>
 <div class="slate" id="slate" hidden></div>
 <div class="win" id="win" hidden><span class="chk" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b id="winText"></b></div>

 <div class="dock">
  <section class="panel" id="panel" aria-live="polite"></section>
  <div class="mic" id="mic" hidden>
   <button class="orb-btn" id="orbBtn" type="button">
    <span class="orb-motion" data-ambient-motion="true"><span class="orb-shell"><span class="orb-clip"><canvas id="orbCanvas" class="orb-canvas" width="208" height="208"></canvas><span class="orb-fallback" aria-hidden="true"></span></span><span class="orb-chrome" aria-hidden="true"></span></span></span>
   </button>
   <span class="mstate" id="mstate"></span>
   <span class="mic-sub" id="micSub"></span>
  </div>
 </div>
</div>

<dialog class="sheet" id="dialog"></dialog>
<audio id="voice" preload="auto"></audio>
<noscript><p style="color:#fff;padding:24px">이 시범판은 JavaScript가 필요해요.</p></noscript>
</body>
</html>

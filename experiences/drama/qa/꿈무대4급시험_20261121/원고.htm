<!doctype html>
<html lang="ko">
<head>

<title>꿈 무대 4급 시험판</title>

<style>
/* 꿈 무대 4급 시험판(2026-11-21). 짓기.cjs가 브랜드 서체를 심어 index.html로 쓴다.
   짜임: 위에 장면(영상은 덮지 않는다) · 가운데 판 · 아래 단추 자리. 색과 유리는 1화 시범판(pilot.css)의 값을 따른다.
   대본은 배우가 형광펜을 칠한 종이 한 장, 다시 만나는 날은 한 주 칸 띠다(docs/디자인/참고사이트 5-2절). */
:root {
  --바탕: #060608; --면: #0b0b0e; --글: #f4f5f8; --흐림: rgba(244,245,248,.66); --옅음: rgba(244,245,248,.5);
  --유리: rgba(255,255,255,.065); --유리2: rgba(255,255,255,.1); --테: inset 0 0 0 1px rgba(255,255,255,.12);
  --따뜻: #ffcf5c; --미끄: #ff6b81; --초록: #6fd39a; --녹음: #ff5a4f;
  --종이: #f5f0e6; --먹: #1f1c18; --먹흐림: #6b645a; --형광: rgba(255, 214, 64, .72);
  --산스: "SUIT Variable", "SUIT", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --몽골: system-ui, -apple-system, "Segoe UI", Roboto, "SUIT Variable", sans-serif;
  --고정: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--바탕); color: var(--글); font-family: var(--산스); -webkit-font-smoothing: antialiased; }
body { font-size: 15px; line-height: 1.5; letter-spacing: -.01em; word-break: keep-all; overflow: hidden; }
[lang="mn"] { font-family: var(--몽골); letter-spacing: 0; }
[lang="mn"] [lang="ko"] { font-family: var(--산스); letter-spacing: -.01em; white-space: nowrap; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.앱 { position: relative; height: 100dvh; width: 100%; display: flex; flex-direction: column; background: var(--면); overflow: hidden; }
@media (min-width: 560px) { body { display: grid; place-items: center; } .앱 { width: 420px; height: min(calc(100dvh - 40px), 900px); border-radius: 32px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 40px 100px -40px rgba(0,0,0,.9); } }

/* 위 띠 */
.위 { flex: none; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 16px 10px; }

.칩 b { color: var(--글); font-weight: 700; }

/* 장면 */

.무대 video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.앱[data-무대="작게"] .무대 { aspect-ratio: auto; height: 132px; background-position: 50% 28%; }
.앱[data-무대="작게"] .무대 video { display: none; }
.앱[data-무대="없음"] .무대 { display: none; }
.진행 { flex: none; display: flex; align-items: center; gap: 5px; padding: 12px 16px 0; min-height: 18px; font-size: 12.5px; color: var(--옅음); font-weight: 600; }
.진행 i { width: 20px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); }
.진행 i.됨 { background: var(--따뜻); }

/* 판 */
.판 { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
.판::-webkit-scrollbar { display: none; }
.머리 { font: 600 11px/1 var(--고정); letter-spacing: .12em; text-transform: uppercase; color: var(--옅음); display: flex; align-items: center; gap: 8px; }
.머리 .한 { font-family: var(--산스); letter-spacing: 0; text-transform: none; font-size: 12.5px; font-weight: 650; }
.상태 { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--글); }

.뜻 { margin: 2px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--흐림); }

/* 메시지(조감독) */
.메시지 { background: var(--유리); box-shadow: var(--테); border-radius: 18px 18px 18px 6px; padding: 12px 14px 13px; }

/* 대본 종이 한 장 */
.종이 { background: var(--종이); color: var(--먹); border-radius: 14px; padding: 13px 15px 14px; box-shadow: 0 14px 30px -18px rgba(0,0,0,.9); }
.종이 .윗줄 { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; color: var(--먹흐림); margin-bottom: 6px; }
.종이 .꼬리 { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--먹); color: var(--종이); font-size: 12px; font-weight: 700; white-space: nowrap; }
.종이 .줄 { margin: 0; font-size: 20px; font-weight: 720; line-height: 1.5; letter-spacing: -.025em; }
.종이 mark { background: linear-gradient(180deg, transparent 52%, var(--형광) 52%, var(--형광) 92%, transparent 92%); color: inherit; padding: 0 1px; }
.종이 .뜻 { color: var(--먹흐림); margin-top: 6px; }
.종이.가림 .줄 { color: transparent; text-shadow: 0 0 11px rgba(31,28,24,.55); user-select: none; }
.종이.가림 mark { background: none; }
.종이 .가림글 { margin: 6px 0 0; font-size: 13.5px; font-weight: 650; color: var(--먹); }

/* 코치 노트 */
.노트 { background: var(--유리); box-shadow: var(--테); border-radius: 20px; padding: 15px 15px 16px; display: grid; gap: 11px; }
.들림 { background: rgba(0,0,0,.28); border-radius: 12px; padding: 10px 12px; }
.들림 .작은 { font-size: 12px; margin-bottom: 3px; color: var(--옅음); font-weight: 650; }
.들림 p.말 { font-size: 16.5px; font-weight: 650; line-height: 1.5; }
.틀림 { text-decoration: underline wavy var(--미끄); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.맞음 { text-decoration: underline var(--초록); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.고칠꼴 { margin: 0; font-size: 23px; font-weight: 760; letter-spacing: -.03em; line-height: 1.35; }
.고칠꼴 s { color: var(--옅음); text-decoration-color: var(--미끄); text-decoration-thickness: 2px; }
.고칠꼴 .화살 { color: var(--옅음); font-weight: 500; margin: 0 4px; }
.고칠꼴 em { font-style: normal; color: var(--따뜻); }
.규칙 { margin: 0; font-size: 15px; line-height: 1.6; }
.근거 { margin: 0; font-size: 12px; line-height: 1.5; color: var(--옅음); }
.줄단추 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.작은단추 { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--유리2); box-shadow: var(--테); font-size: 13.5px; font-weight: 700; }
.글단추 { background: none; padding: 4px 0; font-size: 13px; color: var(--흐림); text-decoration: underline; text-underline-offset: 3px; }

/* 결과 */
.결과 { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 740; letter-spacing: -.02em; }
.결과 i { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--초록); position: relative; }
.결과 i::after { content: ""; position: absolute; left: 7px; top: 4px; width: 6px; height: 11px; border: solid #0b0b0e; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.결과.아직 i { background: var(--미끄); }
.결과.아직 i::after { left: 10px; top: 5px; width: 0; height: 12px; border-width: 0 2.5px 0 0; transform: none; }

/* 놓친 곳 */
.놓친 { display: grid; gap: 12px; }
.놓친 .이름줄 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.놓친 .꼴 { margin: 0; font-size: 30px; font-weight: 760; letter-spacing: -.035em; line-height: 1.15; }
.딱지 { flex: none; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 750; background: rgba(255,207,92,.16); color: var(--따뜻); }
.딱지.해냄 { background: rgba(111,211,154,.16); color: var(--초록); }
.장면줄 { display: grid; grid-template-columns: 76px 1fr; gap: 11px; align-items: center; }
.장면줄 .작은그림 { width: 76px; aspect-ratio: 16 / 9; border-radius: 7px; background: #222 center / cover no-repeat; }
.장면줄 .종이줄 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--먹); }
.장면줄 s { color: var(--먹흐림); text-decoration-color: #d33a52; text-decoration-thickness: 2px; }
.한주 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.한주 .날 { display: grid; justify-items: center; gap: 3px; padding: 8px 0 9px; border-radius: 12px; background: var(--유리); box-shadow: var(--테); }
.한주 .날 small { font-size: 11px; font-weight: 650; color: var(--옅음); }
.한주 .날 b { font-size: 17px; font-weight: 740; letter-spacing: -.02em; }
.한주 .날 em { font-style: normal; font-size: 10.5px; font-weight: 750; color: var(--옅음); min-height: 14px; }
.한주 .날.오늘 { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
.한주 .날.오늘 em { color: var(--글); }
.한주 .날.다시 { background: var(--따뜻); box-shadow: none; }
.한주 .날.다시 small, .한주 .날.다시 b, .한주 .날.다시 em { color: #1b1406; }
.한주 .날.닫힘 { background: rgba(111,211,154,.2); }
.한주 .날.닫힘 em { color: var(--초록); }
.걸음 { list-style: none; margin: 0; padding: 0; display: grid; }
.걸음 li { position: relative; display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 0 0 13px; }
.걸음 li::before { content: ""; position: absolute; left: 5px; top: 14px; bottom: 0; width: 1.5px; background: rgba(255,255,255,.14); }
.걸음 li:last-child { padding-bottom: 0; }
.걸음 li:last-child::before { display: none; }
.걸음 .점 { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; background: var(--면); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); }
.걸음 li[data-상태="됨"] .점 { background: var(--초록); box-shadow: none; }
.걸음 li[data-상태="다음"] .점 { background: var(--따뜻); box-shadow: none; }
.걸음 .때 { font-size: 13px; font-weight: 750; }
.걸음 .때 small { font-weight: 650; color: var(--옅음); margin-left: 6px; }
.걸음 li[data-상태="다음"] .때 { color: var(--따뜻); }
.걸음 .일 { font-size: 14px; line-height: 1.5; color: var(--흐림); }
.걸음 .일 b { color: var(--글); font-weight: 700; }

/* 읽기 한 문항 */
.문항 { display: grid; gap: 10px; }
.문항 .지문 { margin: 0; font-size: 17px; line-height: 1.6; font-weight: 600; }
.보기들 { display: grid; gap: 8px; }
.보기 { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--유리); box-shadow: var(--테); font-size: 16px; font-weight: 650; }
.보기 b { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; background: var(--유리2); }
.보기.고름 { box-shadow: inset 0 0 0 1.5px var(--미끄); }
.보기.정답 { box-shadow: inset 0 0 0 1.5px var(--초록); background: rgba(111,211,154,.12); }
.보기:disabled { cursor: default; }

/* 아래 단추 자리 */
.아래 { flex: none; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); display: grid; gap: 8px; background: linear-gradient(180deg, rgba(11,11,14,0), var(--면) 14px); }
.아래 .줄 { display: flex; gap: 8px; }
.알약 { flex: 1; height: 54px; border-radius: 999px; font-size: 16.5px; font-weight: 760; letter-spacing: -.02em; background: var(--유리2); box-shadow: var(--테); white-space: nowrap; }
.알약.주 { background: var(--글); color: #0b0b0e; box-shadow: none; }
.알약.녹음 { background: var(--녹음); color: #fff; box-shadow: none; }
.알약:disabled { opacity: .45; cursor: default; }
.알약.손짓 { animation: 숨 1.6s ease-in-out infinite; }
@keyframes 숨 { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,90,79,.5); } 50% { box-shadow: 0 0 0 9px rgba(255,90,79,0); } }
.소리줄 { display: flex; align-items: center; justify-content: center; gap: 4px; height: 30px; }
.소리줄 i { width: 5px; height: 4px; border-radius: 3px; background: var(--녹음); transition: height .08s; }
.아래 .알림 { margin: 0; text-align: center; font-size: 12.5px; color: var(--옅음); }
@media (prefers-reduced-motion: reduce) { .알약.손짓, .상태.녹음 i { animation: none; } }
</style>
</head>
<body>
<div class="앱" id="앱" data-무대="크게">
  <header class="위">
    <div class="이름" id="이름">꿈 무대 · 옥상 장면<small>4급 대본</small></div>
    <button class="칩" id="말바꿈" type="button"></button>
  </header>
  <div class="무대" id="무대"><video id="화면" playsinline preload="auto"></video></div>
  <div class="진행" id="진행"></div>
  <main class="판" id="판"></main>
  <div class="아래" id="아래"></div>
</div>
<script type="module">
import { 차례, 나줄, 대답수, 앞친구, 문형, 메시지, 규칙글, 빠짐글, 다른자리, 근거 } from './대본.mjs';
import { 판정, 노트고르기, 놓친곳, 다듬기, learningDate, REVISIT_DAYS } from './판정.mjs';

/* ── 상태 ── 기록 · 날 넘김 · 설명 말은 이 기기에만 남긴다(시험판). 녹음은 이 창 메모리에만 있다. */
const 열쇠 = 'synk.꿈무대4급.v1';
const 처음상태 = () => ({ 기록: [], 오프셋: 0, 설명말: 'mn' });
let 저장 = (() => { try { return { ...처음상태(), ...JSON.parse(localStorage.getItem(열쇠) || '{}') }; } catch { return 처음상태(); } })();
const 남기기 = () => { try { localStorage.setItem(열쇠, JSON.stringify(저장)); } catch {} };
const 지금 = () => Date.now() + 저장.오프셋 * 86400000;
const 녹음 = new Map();       // '장면|d3' · 'take2|d3' · 'review|d3' → { 소리: Blob, 받아쓰기: Promise<{status, text}> }
let 받아쓰기됨 = null;          // 서버 받아쓰기 상태 { ok, 장치, 모델 }
let 마이크 = null, 소리판 = null, 범위 = 0;

const $ = (id) => document.getElementById(id);
const 앱 = $('앱'), 판 = $('판'), 아래 = $('아래'), 화면 = $('화면'), 무대 = $('무대'), 진행 = $('진행');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const 놓기 = (el, ...kids) => { el.replaceChildren(...kids.flat(Infinity).filter((x) => x != null && x !== false)); };
const 쉬기 = (ms) => new Promise((r) => setTimeout(r, ms));
// 화면 하나를 그릴 때마다 범위를 새로 잡는다 — 지난 화면의 기다림이 새 화면을 건드리지 않게.
const 새범위 = () => ++범위;
const 살았나 = (s) => s === 범위;
function 단계(이름) { document.body.dataset.화면 = 이름; }

/* ── 말 ── 화면은 한국어(4급 학생), 뜻과 설명은 몽골어를 먼저 보이고 칩으로 한국어로 바꾼다. */
function 말바꿈그리기() { 놓기($('말바꿈'), '설명 ', h('b', {}, 저장.설명말 === 'mn' ? 'Монгол' : '한국어')); }
$('말바꿈').addEventListener('click', () => { 저장.설명말 = 저장.설명말 === 'mn' ? 'ko' : 'mn'; 남기기(); 말바꿈그리기(); 다시그리기?.(); });
let 다시그리기 = null;
// 몽골어 글 속 「한국어」는 한국어 글꼴로 — 기기 글꼴로 넘어가면 한글 자간이 벌어진다.

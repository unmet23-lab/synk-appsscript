<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옥상 장면 촬영</title>
<style>
:root { --바탕: #0e0f12; --면: #1a1c21; --면2: #24272e; --글: #f3f1ec; --버금글: #d6d2ca; --강조: #ffb35c; --빨강: #ff5a4f; --초록: #6fd39a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--바탕); color: var(--글); font-family: "SUIT Variable", "SUIT", "Inter Tight", system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 14px 16px 28px; }
h1 { font-size: 17px; font-weight: 700; margin: 2px 0 10px; color: var(--버금글); }
#무대 { position: relative; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; border-radius: 10px; overflow: hidden; }
#무대 video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#자막 { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-size: clamp(16px, 2.6vw, 26px); font-weight: 600; text-shadow: 0 2px 6px #000, 0 0 2px #000; padding: 0 8%; }
#표 { position: absolute; top: 10px; left: 10px; display: none; align-items: center; gap: 8px; background: rgba(0,0,0,.6); padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
#표 i { width: 9px; height: 9px; border-radius: 50%; background: var(--빨강); animation: 깜빡 1s infinite; }
#표.재생 i { background: var(--초록); }
@keyframes 깜빡 { 50% { opacity: .25; } }
#진행 { display: flex; align-items: center; gap: 6px; margin: 12px 2px 0; min-height: 18px; font-size: 13px; color: var(--버금글); }
#진행 b { width: 22px; height: 6px; border-radius: 3px; background: #33363e; }
#진행 b.됨 { background: var(--강조); }
#진행 b.지금 { background: var(--글); }
#진행 span { margin-left: 6px; }
#판 { margin-top: 10px; background: var(--면); border-radius: 12px; padding: 16px; min-height: 150px; }
.할일 { font-size: 15px; font-weight: 800; color: var(--강조); margin-bottom: 8px; }
.할일 small, .말 small, .보기 small, .단계 small, .알림 small { display: block; font-weight: 500; color: var(--버금글); font-size: 13px; margin-top: 2px; }
.말 { font-size: 19px; font-weight: 700; line-height: 1.45; }
.누가 { font-size: 13px; color: var(--버금글); font-weight: 700; margin-bottom: 2px; }
.보기 { margin-top: 12px; background: var(--면2); border-radius: 10px; padding: 10px 12px; font-size: 16px; line-height: 1.5; }
.보기 .머리 { font-size: 13px; font-weight: 800; color: var(--강조); margin-bottom: 4px; }
.단추들 { position: relative; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
button { font: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; background: #2f323a; color: var(--글); }
button.주 { background: var(--강조); color: #1b1206; }
button.녹음 { background: var(--빨강); color: #fff; }
button.손짓 { animation: 숨 1.4s ease-in-out infinite; }
@keyframes 숨 { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 90, 79, .55); } 50% { box-shadow: 0 0 0 12px rgba(255, 90, 79, 0); } }
.말풍선 { position: absolute; left: 0; top: calc(100% + 10px); background: #fff; color: #15161a; font-size: 14px; font-weight: 800; padding: 8px 12px; border-radius: 10px; white-space: nowrap; animation: 콕 1.4s ease-in-out infinite; }
.말풍선::before { content: ""; position: absolute; left: 22px; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #fff; }
.말풍선 small { display: block; font-weight: 600; color: #4b4d55; font-size: 12px; }
@keyframes 콕 { 50% { transform: translateY(-4px); } }
.단계 { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; margin: 12px 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
.단계 em { font-style: normal; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--면2); color: var(--강조); font-weight: 800; }
.알림 { margin-top: 12px; font-size: 14px; color: var(--버금글); line-height: 1.5; }
.소리줄 { display: flex; align-items: end; gap: 3px; height: 28px; margin-top: 10px; }
.소리줄 i { width: 6px; border-radius: 2px; background: var(--빨강); height: 3px; transition: height .08s; }
.결과 { margin-top: 10px; font-size: 15px; font-weight: 700; }
.결과.좋음 { color: var(--초록); }
.결과.작음 { color: var(--강조); }
.테이크 { display: grid; gap: 10px; margin-top: 12px; }
.테이크 .칸 { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--면2); border-radius: 10px; padding: 12px; border: 2px solid transparent; cursor: pointer; }
.테이크 .칸.골랐다 { border-color: var(--강조); }
.테이크 .칸 b { font-size: 16px; }
.테이크 .칸 small { display: block; color: var(--버금글); font-size: 13px; font-weight: 600; }
.테이크 .칸 .동그라미 { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--버금글); display: grid; place-items: center; }
.테이크 .칸.골랐다 .동그라미 { border-color: var(--강조); }
.테이크 .칸.골랐다 .동그라미::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--강조); }
.테이크 .칸 .글 { flex: 1; min-width: 0; }
.테이크 button { flex: none; padding: 9px 14px; font-size: 15px; white-space: nowrap; }
button { white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>학생 영화 「안녕, 서울」 · 옥상 장면 촬영</h1>
  <div id="무대">
    <video id="화면" playsinline></video>
    <div id="자막"></div>
    <div id="표"><i></i><span></span></div>
  </div>
  <div id="진행"></div>
  <div id="판"></div>
</main>
<script>
/* 장면 차례. 클립 이름은 시험판짓기.cjs가 만든 영상/ 폴더의 파일이다.
   종류: 친구 · 감독은 영상을 그대로 틀고, 나는 듣는 컷을 되풀이로 틀며 학생이 마이크로 말한다.
   뜻은 배우는 학생의 말로 붙일 자리다. 시험판은 영어로 둔다(실제 앱은 학생이 고른 말). */
const 차례 = [
  { 종류: '친구', 클립: 'N1', 말: '여기 처음 와 봐요?', 뜻: 'Is this your first time here?' },
  { 종류: '나', 클립: 'N9', 번: 1, 물음: '여기 처음 와 봐요?', 물음뜻: 'Is this your first time here?', 도움: '네, 처음이에요. 와, 서울이 다 보이네요.', 도움뜻: 'Yes, it’s my first time. Wow, I can see all of Seoul.' },
  { 종류: '친구', 클립: 'V1d', 말: '서울, 어때요?', 뜻: 'How do you like Seoul?' },
  { 종류: '나', 클립: 'V3', 번: 2, 물음: '서울, 어때요?', 물음뜻: 'How do you like Seoul?', 도움: '아직 잘 몰라요. 그래서 매일 재밌어요.', 도움뜻: 'I don’t know it well yet. That’s why every day is fun.', 덧: '5화에서 내가 고친 대사로 말해도 좋아요.' },
  { 종류: '친구', 클립: 'N2', 말: '뭐가 제일 어려웠어요?', 뜻: 'What was the hardest part?' },
  { 종류: '나', 클립: 'N10', 번: 3, 물음: '뭐가 제일 어려웠어요?', 물음뜻: 'What was the hardest part?', 도움: '높임말이 제일 어려웠어요.', 도움뜻: 'Polite speech was the hardest.', 덧: '시즌에서 나에게 진짜 어려웠던 것을 말해 보세요.' },
  { 종류: '친구', 클립: 'N3', 말: '아, 맞아요. 서울 생활, 처음엔 다 어렵죠.', 뜻: 'Right. Life in Seoul is hard for everyone at first.' },
  { 종류: '친구', 클립: 'N4', 말: '우리 동갑이죠? 말 놓을까요?', 뜻: 'We’re the same age, right? Shall we talk casually?' },
  { 종류: '나', 클립: 'N9', 번: 4, 물음: '우리 동갑이죠? 말 놓을까요?', 물음뜻: 'We’re the same age, right? Shall we talk casually?', 도움: '응, 좋아.', 도움뜻: 'Yeah, sure.', 덧: '이제부터 반말(친구끼리 쓰는 말)로 대답해요.' },
  { 종류: '친구', 클립: 'N5', 말: '그럼… 밥 먹었어?', 뜻: 'Then… have you eaten?' },
  { 종류: '나', 클립: 'N10', 번: 5, 물음: '그럼… 밥 먹었어?', 물음뜻: 'Then… have you eaten?', 도움: '아니, 아직. 너는?', 도움뜻: 'No, not yet. You?', 덧: '반말로 대답해요.' },
  { 종류: '친구', 클립: 'N6', 말: '나도 아직. 같이 먹을래?', 뜻: 'Me neither. Want to eat together?' },
  { 종류: '나', 클립: 'N9', 번: 6, 물음: '나도 아직. 같이 먹을래?', 물음뜻: 'Me neither. Want to eat together?', 도움: '좋아! 떡볶이 먹으러 가자.', 도움뜻: 'Sure! Let’s go eat tteokbokki.', 덧: '좋다고 하거나, 내 나라 음식을 말해 보세요.' },
  { 종류: '친구', 클립: 'N7', 말: '…근데, 왜 서울에 왔어?', 뜻: '…By the way, why did you come to Seoul?' },
  { 종류: '나', 클립: 'V3', 번: 7, 물음: '…근데, 왜 서울에 왔어?', 물음뜻: '…By the way, why did you come to Seoul?', 도움: '배우가 되고 싶어서 왔어.', 도움뜻: 'I came because I want to be an actor.', 덧: '진짜 이유를 말해요. 엄마에게는 「공부하러 간다」고만 했던 꿈을 처음 소리 내어 말해 보세요.', 마지막: true },
  { 종류: '친구', 클립: 'N8', 말: '' },
  { 종류: '감독', 클립: 'N11', 말: '컷! 좋아요. 마지막 대사만 한 번 더, 더 설레는 목소리로요.', 뜻: 'Cut! Good. Just the last line once more, in a more excited voice.' },
  { 종류: '다시', 클립: 'V3', 번: 7, 물음: '…근데, 왜 서울에 왔어?', 물음뜻: '…By the way, why did you come to Seoul?', 도움: '아까 한 일곱 번째 대답을 그대로, 더 설레는 목소리로.', 도움뜻: 'Say your 7th answer again — same words, more excited. (설레다 = to feel excited)' },
  { 종류: '고르기' },
  { 종류: '감독', 클립: 'N12', 말: '컷, 오케이!', 뜻: 'Cut, okay! That’s a wrap.' },
  { 종류: '끝' },
];
const 대답수 = 7;

const 화면 = document.getElementById('화면'), 자막 = document.getElementById('자막'), 판 = document.getElementById('판'),
      표 = document.getElementById('표'), 진행 = document.getElementById('진행'), 무대 = document.getElementById('무대');
const 녹음들 = {};          // '답 n' · '답 7 다시' → Blob
let 고른테이크 = 0, 마이크 = null, 번호 = 0, 처음말하기 = true, 소리판 = null;

function 클립주소(이름) { return `영상/${이름}.mp4`; }
function 판쓰기(html) { 판.innerHTML = html; }
function 표보이기(글, 재생) { 표.className = 재생 ? '재생' : ''; 표.querySelector('span').textContent = 글; 표.style.display = 글 ? 'flex' : 'none'; }
function 진행쓰기(지금, 다시) {
  if (!지금) { 진행.innerHTML = ''; return; }
  let h = '';
  for (let i = 1; i <= 대답수; i++) h += `<b class="${i < 지금 ? '됨' : i === 지금 ? '지금' : ''}"></b>`;
  진행.innerHTML = h + `<span>${다시 === '고르기' ? '고르기 · Pick' : 다시 ? '마지막 대답 · 다시 찍기' : `대답 ${지금} / ${대답수}`}</span>`;
}
function 틀기(이름, { 되풀이 = false, 소리 = 1 } = {}) {
  return new Promise((됨) => {
    화면.loop = 되풀이; 화면.src = 클립주소(이름); 화면.volume = 소리; 화면.currentTime = 0;
    화면.onended = () => { if (!되풀이) 됨(); };
    화면.play().catch(() => 됨());
    if (되풀이) 됨();
  });
}

async function 마이크열기() {
  if (마이크) return 마이크;
  마이크 = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  try {
    const 소리틀 = new (window.AudioContext || window.webkitAudioContext)();
    소리판 = 소리틀.createAnalyser(); 소리판.fftSize = 512;
    소리틀.createMediaStreamSource(마이크).connect(소리판);
  } catch (e) { 소리판 = null; }
  return 마이크;
}

function 녹음하기(막대들) {
  const 기록 = new MediaRecorder(마이크);
  const 조각 = [];
  let 가장큼 = 0, 말한칸 = 0, 그림 = 0;
  const 시작 = performance.now();
  const 칸 = 소리판 ? new Uint8Array(소리판.fftSize) : null;
  const 재기 = () => {
    if (소리판) {
      소리판.getByteTimeDomainData(칸);
      let 합 = 0; for (const v of 칸) 합 += (v - 128) ** 2;
      const 크기 = Math.min(1, Math.sqrt(합 / 칸.length) / 40);
      가장큼 = Math.max(가장큼, 크기); if (크기 > 0.12) 말한칸++;
      막대들.forEach((m, i) => { m.style.height = `${3 + 25 * Math.max(0, 크기 - Math.abs(i - 6) * 0.06)}px`; });
    }
    그림 = requestAnimationFrame(재기);
  };
  재기();
  기록.ondataavailable = (e) => 조각.push(e.data);
  const 끝남 = new Promise((됨) => { 기록.onstop = () => 됨(new Blob(조각, { type: 기록.mimeType })); });
  기록.start();
  표보이기('녹음 중 · Recording');
  return {
    멈추기: async () => {
      기록.stop(); cancelAnimationFrame(그림); 표보이기('');
      return { 소리: await 끝남, 초: (performance.now() - 시작) / 1000, 말함: !소리판 || (가장큼 > 0.15 && 말한칸 > 8) };
    },
  };
}

function 물음칸(칸) {
  const 다시 = 칸.종류 === '다시';
  return `<div class="누가">${다시 ? '일곱 번째 질문 · 다시 · The 7th question, again' : '친구가 물었어요 · Your friend asked'}</div>
    <div class="말">「${칸.물음}」<small>${칸.물음뜻}</small></div>
    ${다시 && 녹음들['답 7'] ? '<div class="단추들" style="margin-top:8px"><button id="아까">▶ 아까 내 대답 듣기 · Hear my answer</button></div>' : ''}
    <div class="보기"><div class="머리">${다시 ? '이번엔 이렇게 · This time' : '이렇게 말해도 돼요 · You can say'}</div>${칸.도움}<small>${칸.도움뜻}</small>
      ${칸.덧 ? `<small style="margin-top:6px;color:var(--글)">${칸.덧}</small>` : ''}
      ${칸.종류 === '다시' ? '' : '<small style="margin-top:6px">내 말로 바꿔 말해도 좋아요. · Feel free to use your own words.</small>'}</div>`;
}

function 내차례(칸) {
  const 이름 = 칸.종류 === '다시' ? '답 7 다시' : `답 ${칸.번}`;
  진행쓰기(칸.번, 칸.종류 === '다시');
  return new Promise(async (됨) => {
    자막.textContent = '';
    await 틀기(칸.클립, { 되풀이: true, 소리: 0.3 });
    표보이기('내 차례 · Your turn', true);
    const 머리 = 칸.종류 === '다시'
      ? `<div class="할일">● 말하기를 누르고, 일곱 번째 대답을 한 번 더 해요<small>Tap ● and say your 7th answer once more.</small></div>`
      : `<div class="할일">● 말하기를 누르고, 한국어로 대답해요<small>Tap ● and answer in Korean.</small></div>`;
    const 처음 = () => {
      판쓰기(`${머리}${물음칸(칸)}
        <div class="단추들"><button class="녹음${처음말하기 ? ' 손짓' : ''}" id="말하기">● 말하기</button>
        ${처음말하기 ? '<div class="말풍선">여기를 누르고 말해요<small>Tap here, then speak</small></div>' : ''}</div>`);
      document.getElementById('말하기').onclick = 말하는중;
      const 아까 = document.getElementById('아까'); if (아까) 아까.onclick = () => new Audio(URL.createObjectURL(녹음들['답 7'])).play();
    };
    const 말하는중 = () => {
      처음말하기 = false;
      판쓰기(`<div class="할일">지금 말하세요 · 다 말하면 ■를 눌러요<small>Speak now. Tap ■ when you’re done.</small></div>
        ${물음칸(칸)}
        <div class="소리줄">${'<i></i>'.repeat(13)}</div>
        <div class="단추들"><button class="주" id="그만">■ 다 말했어요</button></div>`);
      const 녹 = 녹음하기([...판.querySelectorAll('.소리줄 i')]);
      document.getElementById('그만').onclick = async () => { const r = await 녹.멈추기(); 녹음들[이름] = r.소리; 다음(r); };
    };
    const 다음 = (r) => {
      표보이기('내 차례 · Your turn', true);
      const 알림 = r.말함
        ? `<div class="결과 좋음">✓ 녹음했어요 · Recorded</div>`
        : `<div class="결과 작음">소리가 거의 안 들렸어요. 마이크 가까이에서 다시 말해 볼까요?<small>We could barely hear you. Try again closer to the mic?</small></div>`;
      판쓰기(`<div class="할일">내 목소리를 들어 보고, 괜찮으면 다음으로<small>Listen to yourself. If it’s okay, go next.</small></div>
        ${알림}
        <div class="단추들"><button id="듣기">▶ 내 목소리 듣기</button><button id="다시">↺ 다시 말하기</button><button class="주" id="다음">다음 →</button></div>
        <div class="알림">한 번이면 충분해요. 마음에 안 들 때만 다시 말해요.<small>Once is enough. Retry only if you want to.</small></div>`);
      document.getElementById('듣기').onclick = () => new Audio(URL.createObjectURL(녹음들[이름])).play();
      document.getElementById('다시').onclick = 처음;
      document.getElementById('다음').onclick = () => { 화면.pause(); 표보이기(''); 됨(); };
    };
    처음();
  });
}

function 고르기() {
  진행쓰기(대답수, '고르기');
  return new Promise((됨) => {
    const 그리기 = () => {
      판쓰기(`<div class="할일">영화에 넣을 마지막 대답을 하나 골라요<small>Pick the version of your last answer for the movie.</small></div>
        <div class="알림" style="margin-top:0">▶ 듣기로 일곱 번째 대답 두 개를 들어 보고, 더 마음에 드는 녹음을 누르세요. 정답은 없어요.<small>Play both versions of your 7th answer, then tap the one you like. There’s no wrong choice.</small></div>
        <div class="테이크">
          ${[1, 2].map((t) => `<div class="칸${고른테이크 === t ? ' 골랐다' : ''}" data-고름="${t}"><span class="동그라미"></span><div class="글"><b>${t === 1 ? '첫 번째 녹음' : '두 번째 녹음'}</b>
            <small>${t === 1 ? '처음 한 대답 · First try' : '감독 말을 듣고 다시 한 대답 · After the director’s note'}</small></div>
            <button data-듣기="${t}">▶ 듣기</button></div>`).join('')}
        </div>
        <div class="단추들"><button class="주" id="골랐다"${고른테이크 ? '' : ' disabled style="opacity:.4"'}>${고른테이크 ? '이걸로 영화에 넣을게요 →' : '먼저 하나를 골라요 · Pick one first'}</button></div>`);
      판.querySelectorAll('[data-듣기]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); new Audio(URL.createObjectURL(녹음들[b.dataset.듣기 === '1' ? '답 7' : '답 7 다시'])).play(); });
      판.querySelectorAll('[data-고름]').forEach((b) => b.onclick = () => { 고른테이크 = Number(b.dataset.고름); 그리기(); });
      document.getElementById('골랐다').onclick = () => { if (고른테이크) 됨(); };
    };
    그리기();
  });
}

async function 내장면틀기() {
  진행쓰기(0);
  판쓰기(`<div class="할일">내 목소리가 들어간 장면을 처음부터 틀어요<small>Your scene, with your voice, from the start.</small></div>
    <div class="알림">끝까지 보면 다시 볼 수 있어요.<small>You can watch it again at the end.</small></div>`);
  표보이기('내 장면 재생 중 · Playing your scene', true);
  for (const 칸 of 차례) {
    if (칸.종류 === '친구') { 자막.textContent = 칸.말; await 틀기(칸.클립); }
    if (칸.종류 === '나') {
      const 이름 = 칸.마지막 && 고른테이크 === 2 ? '답 7 다시' : `답 ${칸.번}`;
      const 소리 = new Audio(URL.createObjectURL(녹음들[이름]));
      자막.textContent = '';
      await 틀기(칸.클립, { 되풀이: true, 소리: 0.3 });
      await new Promise((됨) => { 소리.onended = 됨; 소리.play().catch(됨); });
      await new Promise((됨) => setTimeout(됨, 300));
    }
  }
  화면.pause(); 자막.textContent = ''; 표보이기('');
  판쓰기(`<div class="할일">완성했어요! · You did it!</div>
    <div class="말">이 장면은 시즌 마지막 회(8화)의 학교 영화제에서 상영돼요.<small>This scene will play at the school film festival in the season finale (episode 8).</small></div>
    <div class="단추들"><button id="또">▶ 한 번 더 보기</button></div>`);
  document.getElementById('또').onclick = 내장면틀기;
}

async function 진행하기() {
  for (; 번호 < 차례.length; 번호++) {
    const 칸 = 차례[번호];
    if (칸.종류 === '친구' || 칸.종류 === '감독') {
      const 감독 = 칸.종류 === '감독';
      const 끝감독 = 감독 && 칸.클립 === 'N12';
      판쓰기(`<div class="할일">${감독 ? '감독이 말해요' : '친구가 말해요'} · 잘 들어 보세요<small>${감독 ? 'The director is talking.' : 'Your friend is talking.'} ${끝감독 ? 'Your scene plays next, with your voice.' : 'Just listen — your turn comes next.'}<br>영상이 끝나면 저절로 넘어가요. · It moves on by itself.</small></div>
        ${칸.말 ? `<div class="누가">${감독 ? '감독' : '친구'}</div><div class="말">「${칸.말}」<small>${칸.뜻}</small></div>` : '<div class="알림">친구가 내 대답을 듣고 있어요. · Your friend is listening.</div>'}
        ${감독 && 칸.클립 === 'N11' ? '<div class="알림">감독이 마지막 대답을 한 번 더 찍자고 해요. 곧 다시 말할 차례가 와요.<small>The director wants one more take of your last answer.</small></div>' : ''}
        ${끝감독 ? '<div class="알림">촬영 끝! 곧 내 목소리가 들어간 장면이 처음부터 흘러요.<small>That’s a wrap! Your scene will play from the start.</small></div>' : ''}`);
      표보이기(감독 ? '감독 · 듣기' : '친구 · 듣기 · Listen', true);
      자막.textContent = 칸.말; await 틀기(칸.클립);
    } else if (칸.종류 === '나' || 칸.종류 === '다시') { await 내차례(칸); }
    else if (칸.종류 === '고르기') { await 고르기(); }
    else if (칸.종류 === '끝') { await 내장면틀기(); }
  }
}

무대.style.backgroundImage = 'url(영상/첫장면.png)';
판쓰기(`<div class="할일">이 장면의 주인공은 나예요<small>You are the lead actor in this scene.</small></div>
  <div class="알림" style="margin-top:0">화면에서 등만 보이는 사람이 나예요. 친구와 대화하며 옥상 장면을 찍어요.<small>The person you see from behind is you. Film a rooftop scene by talking with your friend.</small></div>
  <div class="단계"><em>1</em><div>친구가 물으면 잘 들어요<small>Listen when your friend asks a question.</small></div></div>
  <div class="단계"><em>2</em><div>내 차례가 오면 ● 말하기를 누르고 한국어로 대답해요 (모두 ${대답수}번)<small>On your turn, tap ● and answer in Korean (${대답수} times).</small></div></div>
  <div class="단계"><em>3</em><div>감독이 「컷!」 하면 마지막 대답을 한 번 더 하고, 더 좋은 쪽을 골라요<small>When the director says “Cut!”, redo your last answer and pick the better one.</small></div></div>
  <div class="알림">소리를 켜 주세요. 마이크를 쓸지 물으면 「허용」을 눌러요. 녹음은 이 기기에만 남아요.<small>Turn your sound on. Allow the microphone when asked — your voice stays on this device.</small></div>
  <div class="단추들"><button class="주" id="시작">촬영 시작 · Start</button></div>`);
document.getElementById('시작').onclick = async () => {
  try { await 마이크열기(); } catch (e) {
    판쓰기(`<div class="할일">마이크를 쓸 수 없어요<small>We can’t use your microphone.</small></div><div class="알림">브라우저 주소창 옆의 마이크 허용을 켜고 다시 열어 주세요.<small>Allow the microphone in your browser settings, then reload.</small></div>`);
    return;
  }
  무대.style.backgroundImage = '';
  진행하기();
};

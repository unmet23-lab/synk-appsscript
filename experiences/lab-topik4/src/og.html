<!doctype html>
<html lang="ko" data-theme="night">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="app.css">
<style>
/* 링크 미리보기(1200×630) — 빌드가 Chrome으로 찍고 이 파일은 싣지 않는다. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.og{display:grid;grid-template-columns:690px 1fr;gap:20px;height:630px;padding:30px;box-sizing:border-box}
.og-text{display:flex;flex-direction:column;justify-content:center;padding:44px 46px;border-radius:28px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.og-text .t4-eyebrow{font-size:20px}
.og-text h1{margin:18px 0 22px;font-size:52px;font-weight:680;line-height:1.14;letter-spacing:-.035em}
.og-text p{margin:0;font-size:22px;line-height:1.5;color:var(--ink-2)}
.og-text p[lang=mn]{margin-top:14px;font-size:19px;color:var(--ink-3)}
.og .poster{min-height:0;height:570px;--word-scale:74cqw}
.og .poster .cut{top:12%;right:9%;width:62%}
</style>
</head>
<body class="biz-lab">
<div class="og">
  <div class="og-text">
    <p class="t4-eyebrow">SYNK LAB · TOPIK II 4급 온라인 반</p>
    <h1>졸업까지 남은 TOPIK 4급, 8주 동안 같이 준비해요</h1>
    <p>토요일 실시간 수업 · 매주 쓰기 첨삭 · 10명이 모이면 개강</p>
    <p lang="mn">TOPIK 4-р түвшний 8 долоо хоногийн онлайн анги</p>
  </div>
  <div class="poster tall" data-word="4급" style="--len:2"><span class="label">SYNK LAB · CLASS 01</span><img class="cut" src="assets/topik4-art-cap.webp" alt=""></div>
</div>
</body>
</html>

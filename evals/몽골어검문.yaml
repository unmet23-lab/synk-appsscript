# 몽골어 검문 시험지 — 제미나이 3.6 vs 3.7
#
# ■ 무엇을 재나
#   `tools/몽골어대조.js` 의 «문법·자연스러움 채점 층»(원문을 안 보여주고 몽골어만 채점하는 층)을
#   두 모델에게 **똑같이** 풀린다. 문항은 지어낸 것이 아니라 **이 저장소가 실제로 겪은 것**이다 —
#   라이브에 섰다가 검문에 잡혀 «고쳐진» 문장과, 검문을 지나 «지금 서 있는» 문장.
#
# ■ 왜 이 자리인가 (철학 Ⅰ-2)
#   「갈아탈지 말지도 감이 아니라 우리 학생들이 실제로 틀렸던 문제로 만든 시험지를 새 AI에게
#   풀려 보고 결정한다.」 — 학생이 아직 0명이라 「학생이 틀린 문제」는 없다. 대신 있는 것이
#   **우리가 틀렸던 몽골어**다. 그것이 이 시험지의 정답지다.
#
# ■ 채점은 «결정적»이다 — LLM 심판을 쓰지 않는다
#   저자원·비라틴 문자(몽골어 키릴이 정확히 그 구간)에서 LLM 심판은 사람과 어긋나고, 어긋나는
#   방향이 **후하다** — 틀린 것을 안 깎는다. 그래서 채점은 문자열 비교와 스키마 검사뿐이다.
#   보조 심판을 «달고 싶다면» 맨 아래 주석 블록을 보라(끄고 둔 까닭도 거기 있다).
#
# ■ 돌리는 법 — evals/README.md
#
# 🔴 두 값의 정본은 여기가 아니다
#   - 프롬프트·응답 스키마 = `tools/몽골어대조.js` → evals/검문자.js 가 «읽어» 온다(복사 아님)
#   - 모델·사고 수준     = `tools/모델정책.js`   → 아래 3.8 줄이 그것과 어긋나면 채점이 멈춘다
#     (3.7 은 이제 «대조군»이다 — 유호 지시 2026-09-03 로 현행 픽이 3.8 이 됐다)

description: 몽골어 검문 — 실제로 고쳐진 문장 14개로 3.7 과 3.8 을 같은 자리에서 잰다

providers:
  # 지금 도는 것. 이 두 값은 tools/모델정책.js 의 「무료최상」 픽과 같아야 한다.
  # 유호 지시 2026-09-03 로 3.7 → 3.8 로 갈아탔다. thinkingLevel: high = 「심화추론」의 실물 이름이고
  # 3.8 에 그보다 위는 없다(09-03 프로브 — max·ultra·deep·dynamic 전부 400).
  - id: google:gemini-3.8-flash
    label: 3.8 지금쓰는것
    config:
      generationConfig:
        thinkingConfig:
          thinkingLevel: high
      responseSchema: file://문법스키마.json

  # 대조군. 09-03 전까지 쓰던 판이라 «갈아탄 뒤 뭐가 달라졌나»를 재는 자리로 남긴다.
  # 🔴 3.8 은 아직 이 자로 한 번도 안 재봤다 — 이 파일을 돌리는 것이 그 「안 재봤다」를 닫는 통로다.
  - id: google:gemini-3.7-flash
    label: 3.7 이전판
    config:
      generationConfig:
        thinkingConfig:
          thinkingLevel: high
      responseSchema: file://문법스키마.json

# 프롬프트를 여기 적지 않는다 — 정본(tools/몽골어대조.js)에서 뽑아 쓴다.
prompts:
  - file://검문자.js:문법프롬프트

defaultTest:
  assert:
    # ① 모양 — 스키마를 지킨 JSON 인가 (스키마 파일도 정본에서 찍은 것이다)
    - type: is-json
      value: file://문법스키마.json
    # ② 판정 — 정답지와 맞나. 못 읽으면 「통과」가 아니라 실패다(정본과 같은 실패 방향)
    - type: javascript
      value: file://검문자.js:판정채점
    # ③ 근거 — 「어색·파손」이면 문제문장이 입력 안의 실물이고 키릴인가(지어낸 인용 차단)
    - type: javascript
      value: file://검문자.js:근거채점

tests:
  # ══════════ 갈래 ㉠ 「고쳐지기 전」 = 검문이 잡아야 하는 글 (기대 = 비정상) ══════════

  - description: ㉠1 학생 첫 화면 초벌 — 07월~08-28 라이브에 서 있던 판(결함 셋)
    vars:
      기대: 비정상
      근거: 커밋 51967c023 의 «고치기 전» · 손으로 말하다 + 언어가 자란다 + 조사 연결
      몽골어: Хөтчөө сонговол хамт өнгөрүүлсэн өдөр бүрт чам руу ойртоно. Өөрийн гараар зөв хэлсэн үг чинь олшрох тусам шинэ дүр зураг нээгдэж, солонгос хэл ч өснө!

  - description: ㉠2 직장 경험 폼 설명 초벌 — илүү 가 한 문장에 두 번
    vars:
      기대: 비정상
      근거: 커밋 14291c766 의 «고치기 전» · v9.271 이 잡은 илүү 중복
      몽골어: Таны бичсэн зүйл дараагийн сурагчдын дадлага болно. Сайн хийсэн зүйлээс илүү загнуулсан зүйл илүү их тус болно.

  - description: ㉠3 조각 — 「손으로 맞힌 말」(몽골어에 없는 결합)
    vars:
      기대: 비정상
      근거: docs/함께한날_몽골어_검수표.md 「08-28 에 고친 셋」 ① 고치기 전
      몽골어: Өөрийн гараар зөв хэлсэн үг

  - description: ㉠4 조각 — 「한국어가 자란다」(언어 실력에 안 쓰는 동사)
    vars:
      기대: 비정상
      근거: docs/함께한날_몽골어_검수표.md 「08-28 에 고친 셋」 ② 고치기 전
      몽골어: солонгос хэл ч өснө

  - description: ㉠5 은유 — 「장면이 꿰매졌다」(검문이 「매우 어색」으로 잡음)
    vars:
      기대: 비정상
      근거: docs/몽골어_함께한날_초벌.md(51967c023) 특히 봐 주십사 ①
      몽골어: дүр зураг оёогдлоо

  - description: ㉠6 은유 — 「장면을 짰다」(같은 자리 · 같은 판정)
    vars:
      기대: 비정상
      근거: docs/몽골어_함께한날_초벌.md(51967c023) 특히 봐 주십사 ①
      몽골어: дүр зургийг нэхэв

  - description: ㉠7 어미 파손 — 이 검문기가 «태어난 까닭»인 그 조각
    vars:
      기대: 비정상
      근거: 커밋 aeaf42d15 · 08-05 실측에서 3.6-flash 가 「파손」으로 적중한 자리
      몽골어: зогсоорой яах вэ

  # ══════════ 갈래 ㉡ 「고쳐진 뒤·지금 서 있는」 = 통과해야 하는 글 (기대 = 정상) ══════════
  # 이 갈래가 없으면 「전부 어색이라고 하는 모델」이 만점을 받는다. 헛경보 비용을 여기서 잰다.

  - description: ㉡1 학생 첫 화면 현행 — 08-28 에 고쳐 라이브에 선 판
    vars:
      기대: 정상
      근거: 엔진_콘텐츠AI.js setupOnboarding · 라이브
      몽골어: Хөтчөө сонгоод яв. Хамт өнгөрүүлсэн өдөр олшрох тусам тэр чам руу ойртоно. Өөрөө зөв хэлсэн үг чинь нэмэгдэх тусам шинэ дүр зураг нээгдэж, солонгос хэл чинь ч сайжирна!

  - description: ㉡2 학부모 첫 화면 현행 — 라이브
    vars:
      기대: 정상
      근거: 엔진_콘텐츠AI.js setupOnboarding · 검수표 §4 32번
      몽골어: Долоо хоног бүр хүүхдийнхээ солонгос хэлний ахицын тайланг монголоор хүлээн авна. Ирц, зэрэг, магтаалыг нэг дороос хараарай.

  - description: ㉡3 직장 경험 폼 설명 현행 — илүү 중복을 푼 판
    vars:
      기대: 정상
      근거: 엔진_폼리포트.js WORK_DESC · 라이브
      몽골어: Таны бичсэн зүйл дараагийн сурагчдын дадлага болно. Сайн хийсэн зүйлээс загнуулсан зүйл нь илүү их тус болно.

  - description: ㉡4 폼 동의 안내 — 「언제든지」를 хүссэн үедээ 로 고친 판
    vars:
      기대: 정상
      근거: 엔진_폼리포트.js WORK_HELP 자료활용동의 · v9.270 ② 의 «고친 뒤»
      몽골어: Цуцлахыг хүсвэл хүссэн үедээ сургуультай холбогдоно уу.

  - description: ㉡5 폼 도움말 — 말투·호칭 문항(검문을 지나 라이브에 선 긴 문장)
    vars:
      기대: 정상
      근거: 엔진_폼리포트.js WORK_HELP 「말투·호칭 때문에 곤란했던 일」 · 라이브
      몽골어: Хүндэтгэлийн үг, дуудах нэр, татгалзах эсвэл хүсэлт гаргах үе. Солонгос хэл нь зөв атлаа уур амьсгал хачин болсон мөчийг бичээрэй.

  - description: ㉡6 조각 — 「스스로 맞힌 말」(㉠3 의 고친 짝 · 조각 길이가 같다)
    vars:
      기대: 정상
      근거: docs/함께한날_몽골어_검수표.md 「08-28 에 고친 셋」 ① 고친 뒤
      몽골어: Өөрөө зөв хэлсэн үг

  - description: ㉡7 조각 — 「한국어가 나아진다」(㉠4 의 고친 짝)
    vars:
      기대: 정상
      근거: docs/함께한날_몽골어_검수표.md 「08-28 에 고친 셋」 ② 고친 뒤
      몽골어: солонгос хэл чинь ч сайжирна

# ─────────────────────────────────────────────────────────────────────────────
# 🔴 LLM 심판(llm-rubric)을 «켜지 않은» 까닭 — 켜려면 여기를 읽고 켜라
#
#   조사에서 확인된 것: LLM 심판은 저자원·비라틴 문자에서 사람 판정과의 일치율이 무너지고,
#   무너지는 방향이 **후한 쪽**이다 — 사실 오류·문화적 오표현을 안 깎는다. 몽골어 키릴이
#   그 최악 구간이다. 그래서 심판을 켜면 「검문이 좋아 보이는」 쪽으로 결과가 휜다.
#
#   그리고 이 시험지에서는 심판이 «필요 없다»: 정답지가 이미 사람 손으로 고쳐진 실물이라
#   판정은 문자열 비교로 끝난다. 심판은 «정답지가 없을 때» 쓰는 물건이다.
#
#   그래도 「이유 문장이 말이 되는지」를 곁눈질하고 싶으면 아래를 defaultTest.assert 에 붙인다.
#   ⚠ 붙이는 순간 그 판정이 합격/불합격을 «가른다» — 위 한계를 안고 가는 것이다.
#
#     - type: llm-rubric
#       provider: google:gemini-3.6-flash
#       value: |
#         이 답의 「이유」가 「판정」과 앞뒤가 맞고, 몽골어 문장의 구체적인 자리를 짚고 있는가.
#         몽골어가 맞는지는 판단하지 마라 — 그건 사람이 본다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 🔴 사람이 보는 자리 — 전량이 아니라 «의심 줄»만 올라온다
#   돌린 뒤:  node evals/의심줄.js evals/_결과/결과.json
#   올라오는 것 = ①정답지와 어긋난 줄 ②두 모델이 서로 갈린 줄 ③답을 못 읽은 줄.
#   맞은 줄은 안 올라온다(철학 「하지 않는 것 ㉡」 — 사람 눈을 아무 데나 쓰지 않는다).
